    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CH04 Quiz: Process Management — Script House',
            description: '10 questions on ps, top, nice values, signals, kill, and job control',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-la-ch04-quiz',
            moduleId: 'la-ch04-quiz',
            serverGrading: true,
            houseId: 'script',
            trackProgress: true,
            nextModule: {
                title: 'Ch 5: Daemons & Services',
                href: '../presentations/script-la-ch05-daemons.presentation.html'
            },

            questions: [
                {
                    question: 'What is a Linux process?',
                    options: [
                        'A running instance of a program with its own PID and memory space',
                        'A file stored in the /proc directory',
                        'A background service started by systemd',
                        'A scheduled task managed by cron'
                    ],explanation: 'A process is a running instance of a program. Each process has a unique PID (Process ID), its own memory space, a state, a parent process (PPID), and an owning user (UID).'
                },
                {
                    question: 'Which command shows a real-time, continuously updated view of running processes?',
                    options: [
                        'ps aux',
                        'top',
                        'pstree',
                        'ls /proc'
                    ],explanation: 'top provides a real-time, interactive view of the system — updating every few seconds showing CPU%, memory%, process states, and load averages. Press q to quit, k to kill a process by PID.'
                },
                {
                    question: 'What does a nice value of <code>-20</code> mean for a process?',
                    options: [
                        'The process is paused',
                        'Lowest priority — gets the least CPU time',
                        'Highest priority — gets the most CPU time',
                        'The process runs only during idle time'
                    ],explanation: 'Nice values range from -20 (highest priority) to +19 (lowest priority). A nice value of -20 means the process gets preferential CPU access. Only root can set negative nice values.'
                },
                {
                    question: 'Which signal should you try BEFORE resorting to <code>kill -9</code>?',
                    options: [
                        'SIGSTOP (19)',
                        'SIGTERM (15)',
                        'SIGHUP (1)',
                        'SIGCONT (18)'
                    ],explanation: 'Always try SIGTERM (15) first — it is a polite termination request that allows the process to clean up (close files, flush buffers, release resources). SIGKILL (9) immediately forces termination with no cleanup.'
                },
                {
                    question: 'What does the "Z" state in ps output indicate?',
                    options: [
                        'The process is sleeping',
                        'A zombie process — exited but not yet reaped by its parent',
                        'The process is stopped with Ctrl+Z',
                        'A kernel thread process'
                    ],explanation: 'A zombie (Z) process has finished executing but its entry remains in the process table because its parent has not yet read its exit status (via wait()). You cannot kill zombies — kill the parent process instead.'
                },
                {
                    question: 'How do you run a command in the background so your terminal remains available?',
                    options: [
                        'Prefix the command with bg:',
                        'Append & to the command',
                        'Use the screen command before the command',
                        'Type Ctrl+Z before the command'
                    ],explanation: 'Appending & to any command runs it in the background. Example: ./backup.sh & — the shell returns a job number [1] and PID, then immediately gives you a new prompt while backup.sh runs in the background.'
                },
                {
                    question: 'What command changes the nice value of an already-running process with PID 5678 to 10?',
                    options: [
                        'nice -n 10 5678',
                        'renice -n 10 -p 5678',
                        'kill -10 5678',
                        'priority 10 5678'
                    ],explanation: 'renice changes the nice value of a running process. Syntax: renice -n VALUE -p PID. nice is used when starting a new process. renice is for processes already running.'
                },
                {
                    question: 'What does <code>ps aux | grep nginx | grep -v grep</code> accomplish?',
                    options: [
                        'Kills all nginx processes',
                        'Lists nginx processes while excluding the grep process itself from the output',
                        'Shows nginx error logs',
                        'Restarts the nginx service'
                    ],explanation: 'The pattern "grep process | grep -v grep" is a classic — when you grep for a process name, grep itself appears in ps output (because grep is running with "nginx" as an argument). The second grep -v grep removes that false match.'
                },
                {
                    question: 'Which signal, sent with <code>kill -1 PID</code>, typically causes a daemon to reload its configuration file?',
                    options: [
                        'SIGTERM',
                        'SIGKILL',
                        'SIGHUP',
                        'SIGINT'
                    ],explanation: 'SIGHUP (signal 1, Hangup) was originally sent when a terminal connection was lost. Daemons repurposed this signal to mean "reload configuration". Most well-written daemons (nginx, sshd, apache) reload their config when receiving SIGHUP.'
                },
                {
                    question: 'What command brings a background job (job number 1) back to the foreground?',
                    options: [
                        'bg %1',
                        'fg %1',
                        'jobs 1',
                        'resume 1'
                    ],explanation: 'fg %JOB_NUMBER brings a background job to the foreground. After running a job in background with &, use "jobs" to see job numbers, then "fg %1" to bring job 1 to the foreground.'
                }
            ]
        });
        quiz.start();
    </script>
