<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Linux Admin Course</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CH03 Quiz: Grep, Pipes & Text Processing — Script House',
            description: '10 questions on grep flags, regex basics, I/O redirection, pipelines, awk, and sed',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-la-ch03-quiz',
            moduleId: 'la-ch03-quiz',
            serverGrading: true,
            houseId: 'script',
            trackProgress: true,
            nextModule: {
                title: 'Ch 4: Process Management & Nice Values',
                href: 'linux/presentations/script-la-ch04-processes.presentation.html'
            },

            questions: [
                {
                    question: 'What does the grep flag <code>-i</code> do?',
                    options: [
                        'Inverts the match (shows non-matching lines)',
                        'Makes the search case-insensitive',
                        'Searches recursively through directories',
                        'Shows only the count of matches'
                    ],explanation: 'The -i flag makes grep case-insensitive. "grep -i error" matches "error", "Error", "ERROR", and "ErRoR".'
                },
                {
                    question: 'Which grep flag shows only the filenames that contain a match (not the matching lines themselves)?',
                    options: [
                        '-n',
                        '-c',
                        '-l',
                        '-o'
                    ],explanation: 'grep -l (lowercase L) prints only the names of files containing matches — useful when searching many files with grep -rl to find which ones contain a pattern.'
                },
                {
                    question: 'What does the pipe operator <code>|</code> do?',
                    options: [
                        'Saves command output to a file',
                        'Connects the stdout of one command to the stdin of the next command',
                        'Runs two commands simultaneously',
                        'Appends output to an existing file'
                    ],explanation: 'The pipe | connects the standard output of the command on the left to the standard input of the command on the right, enabling multi-stage data processing pipelines.'
                },
                {
                    question: 'What does <code>grep -v "^#" /etc/ssh/sshd_config</code> output?',
                    options: [
                        'Only lines starting with #',
                        'All lines, replacing # with nothing',
                        'All lines that do NOT start with #',
                        'An error — invalid regex'
                    ],explanation: '-v inverts the match (shows non-matching lines). ^# matches lines starting with #. Combined: show all lines that do NOT start with # — effectively filtering out comment lines.'
                },
                {
                    question: 'Which redirection operator appends stdout to an existing file without overwriting it?',
                    options: [
                        '>',
                        '>>',
                        '<',
                        '2>'
                    ],explanation: '>> appends stdout to a file. > overwrites the file (or creates it). < reads stdin from a file. 2> redirects stderr.'
                },
                {
                    question: 'What does the command <code>cat access.log | grep "404" | wc -l</code> accomplish?',
                    options: [
                        'Displays all 404 errors from the log',
                        'Counts the number of lines containing "404" in access.log',
                        'Deletes all 404 entries from the log',
                        'Creates a new file with 404 entries'
                    ],explanation: 'The pipeline: cat reads the file, grep "404" filters to only lines containing "404", wc -l counts the resulting lines. Result: the total count of 404 responses in the access log.'
                },
                {
                    question: 'In the regex pattern <code>^Failed</code>, what does the <code>^</code> character mean?',
                    options: [
                        'Match the character "^"',
                        'Negate the pattern',
                        'Match "Failed" at the start of a line',
                        'Match "Failed" at the end of a line'
                    ],explanation: 'In regex, ^ anchors the match to the start of a line. ^Failed only matches lines where "Failed" is the very first word — not lines where "Failed" appears in the middle.'
                },
                {
                    question: 'What does <code>grep -A 3 "OOM killer" /var/log/syslog</code> do?',
                    options: [
                        'Shows the 3 lines before each match',
                        'Shows the 3 lines after each match',
                        'Shows only matches on every 3rd line',
                        'Shows 3 random lines from the file'
                    ],explanation: '-A (After) shows N lines after each match. This is invaluable in log analysis — when you find an event, you need to see what happened immediately after it. -B shows lines Before, -C shows lines both before and after.'
                },
                {
                    question: 'Which command extracts only the first field from each line of /etc/passwd using ":" as the delimiter?',
                    options: [
                        'grep -f: /etc/passwd',
                        'awk -F: \'{print $1}\' /etc/passwd',
                        'sed \'s/:.*//\' /etc/passwd',
                        'Both <code>awk</code> and <code>sed</code> are correct'
                    ],explanation: 'Both awk -F: \'{print $1}\' and sed \'s/:.*//\' extract only the first field (username) from /etc/passwd. awk uses -F to set the delimiter and $1 for the first field; sed removes everything from the first colon to end of line.'
                },
                {
                    question: 'What is the purpose of the <code>tee</code> command in a pipeline?',
                    options: [
                        'Terminates the pipeline',
                        'Reads stdin and writes to both stdout AND a specified file simultaneously',
                        'Connects two separate pipelines',
                        'Shows the last line of pipeline output only'
                    ],explanation: 'tee splits the stream — it reads stdin and writes it to both stdout (so the next command in the pipeline receives it) AND to a file. Example: ls -la | tee listing.txt | grep ".sh" — saves the full listing AND filters for .sh files.'
                }
            ]
        });
        quiz.start();
    </script>
