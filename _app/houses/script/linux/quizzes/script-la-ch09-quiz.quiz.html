<body>

    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Ch 9 Quiz: IPv4 Protocol',
            description: '10 questions on TCP/IP stack, IP addressing, subnetting, CIDR, routing tables, and gateways',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-la-ch09-quiz',
            moduleId: 'la-ch09-quiz',
            serverGrading: true,
            houseId: 'script',
            trackProgress: true,
            nextModule: {
                title: 'Ch 10: File Compression & Archiving',
                href: 'linux/presentations/script-la-ch10-compression.presentation.html'
            },

            questions: [
                {
                    question: 'An IPv4 address is how many bits long, and how is it written in human-readable form?',
                    options: [
                        '64 bits, written as 8 groups of hex digits separated by colons',
                        '32 bits, written as four decimal octets separated by dots (e.g., 192.168.1.1)',
                        '48 bits, written as six hex pairs separated by colons',
                        '128 bits, written as four decimal octets'
                    ],explanation: 'IPv4 uses 32-bit addresses expressed in dotted-decimal notation — four groups of 8-bit values (octets) separated by dots. Each octet ranges from 0 to 255. The 64-bit address with colon-separated hex is incorrect; 128-bit is IPv6. 48-bit with hex pairs is a MAC address.'
                },
                {
                    question: 'What is the purpose of the AND operation performed between an IP address and a subnet mask?',
                    options: [
                        'To encrypt the IP address for secure transmission',
                        'To calculate the broadcast address of a subnet',
                        'To extract the network ID by zeroing out the host bits',
                        'To add routing metrics to the IP address'
                    ],explanation: 'Bitwise ANDing an IP address with its subnet mask extracts the network ID. Where the mask has 1s (255 in decimal), network bits pass through; where it has 0s, host bits are zeroed. For example: 192.168.5.69 AND 255.255.255.0 = 192.168.5.0 (network ID). Routers use this to determine if two hosts are on the same subnet.'
                },
                {
                    question: 'What address class uses the range 128.0.0.0 through 191.255.255.255 with a default mask of 255.255.0.0?',
                    options: [
                        'Class A',
                        'Class B',
                        'Class C',
                        'Class D'
                    ],explanation: 'Class B: 128.0.0.0–191.255.255.255, mask 255.255.0.0 (/16), up to 65,534 hosts per network. Class A: 1.0.0.0–126.x.x.x, mask /8, 16M hosts. Class C: 192.0.0.0–223.x.x.x, mask /24, 254 hosts. Class D (224-239) is multicast. Note: 127.x.x.x is reserved for loopback and falls between Class A and B ranges.'
                },
                {
                    question: 'What does the CIDR notation /24 represent as a subnet mask?',
                    options: [
                        '255.0.0.0',
                        '255.255.0.0',
                        '255.255.255.0',
                        '255.255.255.128'
                    ],explanation: '/24 means the first 24 bits are network bits. 24 bits of 1s = 11111111.11111111.11111111.00000000 = 255.255.255.0. /8=255.0.0.0, /16=255.255.0.0, /24=255.255.255.0, /25=255.255.255.128, /26=255.255.255.192. A /24 network supports 254 host addresses (256 minus network and broadcast).'
                },
                {
                    question: 'What is the loopback IP address and what does it test?',
                    options: [
                        '192.168.0.1 — tests the local LAN gateway',
                        '127.0.0.1 — tests the local TCP/IP stack without sending traffic to the network',
                        '0.0.0.0 — tests all network interfaces simultaneously',
                        '255.255.255.255 — broadcasts to all hosts on the subnet'
                    ],explanation: '127.0.0.1 (and the entire 127.0.0.0/8 range) is the loopback address. Traffic sent to it never leaves the machine — it is processed entirely by the OS\'s TCP/IP stack. Pinging 127.0.0.1 confirms that the network stack is functional, even if no physical network interface is present. It is always mapped to the <code>lo</code> interface.'
                },
                {
                    question: 'Using the formula 2^n - 2, how many usable host addresses does a /26 subnet provide?',
                    options: [
                        '30',
                        '62',
                        '126',
                        '254'
                    ],explanation: 'A /26 mask (255.255.255.192) leaves 6 host bits (32-26=6). Formula: 2^6 - 2 = 64 - 2 = <strong>62</strong> usable hosts. We subtract 2 for the network address (all host bits = 0) and broadcast address (all host bits = 1). /25 = 126 hosts, /26 = 62 hosts, /27 = 30 hosts, /28 = 14 hosts, /30 = 2 hosts (point-to-point links).'
                },
                {
                    question: 'Which <code>ip</code> command adds a default route using 10.0.0.1 as the gateway?',
                    options: [
                        'ip route set gateway 10.0.0.1',
                        'sudo ip route add default via 10.0.0.1',
                        'ip gateway add 10.0.0.1',
                        'route add default gw 10.0.0.1 (modern syntax)'
                    ],explanation: '<code>sudo ip route add default via 10.0.0.1</code> is correct. <code>default</code> is shorthand for <code>0.0.0.0/0</code> (all destinations). The <code>via</code> keyword specifies the next-hop router. <code>route add default gw</code> is the legacy syntax from the net-tools package. You can verify with <code>ip route show</code> — you should see a line beginning with "default via 10.0.0.1".'
                },
                {
                    question: 'A host at 172.16.5.10/16 needs to communicate with a host at 172.16.200.50. Will this be direct communication or routed? Why?',
                    options: [
                        'Direct — both hosts are in the 172.16.0.0/16 network (same network ID after AND operation)',
                        'Routed — they are on different Class B subnets',
                        'Routed — the third octet differs so they need a router',
                        'Cannot communicate — the addresses are in different private ranges'
                    ],explanation: 'With mask /16 (255.255.0.0): AND 172.16.5.10 with mask = 172.16.0.0. AND 172.16.200.50 with mask = 172.16.0.0. Both produce the same network ID (172.16.0.0) — therefore they are on the same network and communicate directly without a router, regardless of the third octet difference. The mask determines which portion is network vs host.'
                },
                {
                    question: 'What is the key rule about the default gateway\'s IP address relative to the client machine?',
                    options: [
                        'The gateway must always end in .1 (e.g., 192.168.1.1)',
                        'The gateway must be on the same subnet as the client machine',
                        'The gateway must always be the first host address in the subnet',
                        'The gateway can be on any subnet as long as it has a public IP'
                    ],explanation: 'The default gateway must be on the same subnet as the client — it must be directly reachable without routing. A client at 192.168.1.100/24 can only use a gateway with an address in 192.168.1.0/24 (e.g., 192.168.1.1 or 192.168.1.254). If the gateway address is on a different subnet, the client cannot reach it and all off-subnet traffic fails. The gateway ending in .1 is convention only, not a rule.'
                },
                {
                    question: 'Which <code>ip</code> command shows the routing table on a Linux system?',
                    options: [
                        'ip addr show',
                        'ip route show',
                        'ip link show',
                        'ip neigh show'
                    ],explanation: '<code>ip route show</code> (or simply <code>ip route</code>) displays the routing table. Key output elements: "default via X.X.X.X" is the default gateway, and "192.168.1.0/24 dev enp0s3 proto kernel scope link" is a directly connected route. <code>ip addr</code> shows addresses, <code>ip link</code> shows interface state, <code>ip neigh</code> shows the ARP neighbor table.'
                }
            ]
        });
        quiz.start();
    </script>
