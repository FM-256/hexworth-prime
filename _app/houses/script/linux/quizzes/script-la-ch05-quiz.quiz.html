    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CH05 Quiz: Daemons & Services — Script House',
            description: '10 questions on daemons, systemd, systemctl, unit files, journalctl, and cron',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-la-ch05-quiz',
            moduleId: 'la-ch05-quiz',
            serverGrading: true,
            houseId: 'script',
            trackProgress: true,
            nextModule: {
                title: 'Ch 6: Initialization, X Windows & Localization',
                href: '../presentations/script-la-ch06-init-xwindows.presentation.html'
            },

            questions: [
                {
                    question: 'What is a Linux daemon?',
                    options: [
                        'A process the user actively controls in the terminal',
                        'A background process that runs continuously providing system services',
                        'A graphical application running as root',
                        'A script executed manually by an administrator'
                    ],explanation: 'A daemon is a background process that runs continuously, starts at boot, has no controlling terminal, and provides services to the system or network clients. Most daemon names end in "d" (sshd, httpd, crond).'
                },
                {
                    question: 'What systemctl command starts the nginx service AND configures it to start automatically on every boot?',
                    options: [
                        'systemctl start nginx && systemctl enable nginx',
                        'systemctl enable --now nginx',
                        'systemctl boot nginx',
                        'systemctl activate nginx'
                    ],explanation: '"systemctl enable --now" is the efficient one-command way to both enable (auto-start at boot) and start the service immediately. Without --now, enable only creates the symlink for boot without starting it.'
                },
                {
                    question: 'What command reloads a service\'s configuration without fully stopping and restarting it?',
                    options: [
                        'systemctl restart nginx',
                        'systemctl reload nginx',
                        'systemctl refresh nginx',
                        'systemctl config nginx'
                    ],explanation: '"systemctl reload" sends the service a signal to re-read its configuration files without stopping the process. This avoids any connection interruption. Not all services support reload — check with "systemctl status" first.'
                },
                {
                    question: 'In a systemd unit file, what does the <code>WantedBy=multi-user.target</code> line in [Install] mean?',
                    options: [
                        'The service requires multi-user mode to be active before starting',
                        'The service will be enabled when multi-user.target is reached (i.e., at normal boot)',
                        'The service only runs in multi-user mode on the terminal',
                        'The service creates a multi-user.target dependency'
                    ],explanation: 'WantedBy=multi-user.target means that when you run "systemctl enable", systemd creates a symlink in multi-user.target.wants/ — ensuring this service starts when the system reaches multi-user mode (standard server boot).'
                },
                {
                    question: 'Which journalctl flag shows log entries from the CURRENT boot only?',
                    options: [
                        '-f',
                        '-b',
                        '--since today',
                        '-u'
                    ],explanation: 'journalctl -b shows logs from the current boot. journalctl -b -1 shows the previous boot. This is essential for diagnosing issues that occurred during system startup.'
                },
                {
                    question: 'What crontab entry runs a script every day at 3:30 AM?',
                    options: [
                        '30 3 * * * /opt/script.sh',
                        '3 30 * * * /opt/script.sh',
                        '* * 3 30 * /opt/script.sh',
                        '0 3:30 * * * /opt/script.sh'
                    ],explanation: 'Crontab fields: minute hour day month weekday. "30 3 * * *" = minute 30, hour 3 = 3:30 AM every day (asterisks for day/month/weekday mean "any").'
                },
                {
                    question: 'After writing a new systemd unit file in /etc/systemd/system/, what command must you run before starting the service?',
                    options: [
                        'systemctl update',
                        'systemctl daemon-reload',
                        'systemctl refresh',
                        'service restart all'
                    ],explanation: '"systemctl daemon-reload" tells systemd to re-read all unit files from disk. Without this step, systemd will not know about your new (or modified) unit file and will use cached versions.'
                },
                {
                    question: 'Which daemon is responsible for executing scheduled tasks defined in crontab files?',
                    options: [
                        'taskd',
                        'scheduled',
                        'crond',
                        'timerd'
                    ],explanation: 'crond (the cron daemon) reads all crontab files and executes the defined commands at the scheduled times. It runs continuously in the background watching for jobs that need to run.'
                },
                {
                    question: 'What does <code>journalctl -u sshd -f</code> do?',
                    options: [
                        'Follows new log entries for the sshd service in real time',
                        'Deletes old sshd log entries',
                        'Shows only failed sshd authentication attempts',
                        'Lists all units related to sshd'
                    ],explanation: '-u sshd filters to only sshd service logs, -f follows new entries as they are written (equivalent to tail -f but for the journal). This is essential for watching live authentication activity.'
                },
                {
                    question: 'A cron entry reads: <code>*/15 * * * * /opt/check.sh</code>. How often does it run?',
                    options: [
                        'Every 15 hours',
                        'Every 15th day',
                        'Every 15 minutes',
                        'Once at minute 15 of each hour'
                    ],explanation: 'The */N syntax means "every N" — so */15 in the minute field means "every 15 minutes" (at :00, :15, :30, and :45 of every hour). This is one of the most useful cron scheduling patterns.'
                }
            ]
        });
        quiz.start();
    </script>
