<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH06 Quiz: Initialization & X Windows — Script House</title>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--script-green:#22c55e;--script-accent:#4ade80;--script-glow:rgba(34,197,94,0.3);--bg-card:rgba(10,20,10,0.9);--text-primary:#e8e8f0;--text-secondary:#7a9a7a;--correct:#22c55e;--incorrect:#ef4444;--border:rgba(34,197,94,0.2);}
        body{min-height:100vh;background:linear-gradient(135deg,#0a0a12,#0a1a0f,#0a250a);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text-primary);}
        .quiz-header{padding:1rem 2rem;border-bottom:1px solid var(--border);background:rgba(10,10,18,0.96);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);}
        .back-btn{display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(34,197,94,0.08);border:1px solid var(--border);border-radius:8px;color:var(--script-green);font-size:0.85rem;font-weight:600;text-decoration:none;transition:all 0.2s;}
        .back-btn:hover{background:rgba(34,197,94,0.15);}
        .progress-bar{width:180px;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;}
        .progress-fill{height:100%;background:linear-gradient(90deg,var(--script-green),var(--script-accent));width:0%;transition:width 0.5s ease;}
        #questionCounter{color:var(--text-secondary);font-size:0.85rem;}
        .quiz-container{max-width:820px;margin:2.5rem auto;padding:0 1.5rem 4rem;}
        .quiz-title{text-align:center;margin-bottom:2.5rem;}
        .quiz-title h1{font-size:1.9rem;color:var(--script-green);margin-bottom:0.5rem;}
        .quiz-title p{color:var(--text-secondary);font-size:0.95rem;}
        .question-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:2rem;margin-bottom:1.25rem;display:none;}
        .question-card.active{display:block;animation:fadeIn 0.3s ease;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
        .question-number{color:var(--script-green);font-size:0.8rem;font-weight:700;letter-spacing:0.1em;margin-bottom:0.9rem;}
        .question-text{font-size:1.15rem;line-height:1.6;margin-bottom:1.5rem;}
        .question-text code{background:rgba(34,197,94,0.12);color:var(--script-accent);padding:2px 8px;border-radius:4px;font-family:'Consolas',monospace;font-size:0.9em;}
        .options{display:grid;gap:0.75rem;}
        .option{padding:1rem 1.25rem;background:rgba(34,197,94,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:0.9rem;}
        .option:hover:not(.disabled){background:rgba(34,197,94,0.1);border-color:var(--script-green);}
        .option.correct{background:rgba(34,197,94,0.2);border-color:var(--correct);}
        .option.incorrect{background:rgba(239,68,68,0.15);border-color:var(--incorrect);}
        .option.disabled{pointer-events:none;opacity:0.75;}
        .option-letter{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:700;flex-shrink:0;}
        .option.correct .option-letter{background:var(--correct);color:#000;}
        .option.incorrect .option-letter{background:var(--incorrect);color:#fff;}
        .feedback{margin-top:1.25rem;padding:1rem 1.25rem;border-radius:10px;display:none;font-size:0.9rem;line-height:1.5;}
        .feedback.show{display:block;animation:fadeIn 0.3s ease;}
        .feedback.correct{background:rgba(34,197,94,0.1);border-left:3px solid var(--correct);}
        .feedback.incorrect{background:rgba(239,68,68,0.1);border-left:3px solid var(--incorrect);}
        .nav-buttons{display:flex;justify-content:flex-end;margin-top:1.5rem;}
        .nav-btn{padding:0.7rem 1.75rem;border-radius:10px;font-size:0.9rem;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;background:linear-gradient(135deg,var(--script-green),var(--script-accent));color:#000;}
        .nav-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px var(--script-glow);}
        .nav-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
        .results-card{background:var(--bg-card);border:1px solid rgba(34,197,94,0.35);border-radius:16px;padding:3rem;text-align:center;display:none;}
        .results-card.show{display:block;animation:fadeIn 0.5s ease;}
        .score-circle{width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,var(--script-green),var(--script-accent));display:flex;align-items:center;justify-content:center;margin:0 auto 1.75rem;font-size:2.8rem;font-weight:900;color:#000;}
        .results-title{font-size:1.75rem;color:var(--script-green);margin-bottom:0.6rem;}
        .results-subtitle{color:var(--text-secondary);margin-bottom:2rem;font-size:0.95rem;}
        .results-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
        .action-btn{padding:0.75rem 1.75rem;border-radius:10px;text-decoration:none;font-size:0.9rem;font-weight:600;transition:all 0.2s;}
        .action-btn.primary{background:linear-gradient(135deg,var(--script-green),var(--script-accent));color:#000;}
        .action-btn.secondary{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text-secondary);}
        .action-btn:hover{transform:translateY(-2px);}
    </style>
</head>
<body>
<header class="quiz-header">
    <a href="../presentations/la-ch06-init-xwindows.presentation.html" class="back-btn">&larr; Back to Presentation</a>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span id="questionCounter">1 / 10</span>
</header>
<div class="quiz-container">
    <div class="quiz-title">
        <h1>CH06: Initialization &amp; X Windows</h1>
        <p>10 questions on the boot process, GRUB, systemd targets, X11, Wayland, display managers, and localization</p>
    </div>
    <div id="questionsContainer"></div>
    <div class="results-card" id="resultsCard">
        <div class="score-circle" id="scoreCircle">0%</div>
        <h2 class="results-title" id="resultsTitle">Quiz Complete!</h2>
        <p class="results-subtitle" id="resultsSubtitle"></p>
        <div class="results-actions">
            <a href="../presentations/la-ch06-init-xwindows.presentation.html" class="action-btn secondary">Review Slides</a>
            <a href="../labs/la-ch06-init-xwindows.lab.html" class="action-btn primary" id="nextBtn">Go to Lab &rarr;</a>
        </div>
    </div>
</div>
<script src="../../../../components/FluxCapacitor.js"></script>
<script>
const questions=[
    {question:'What is the correct order of the Linux boot process?',options:['Kernel → GRUB → BIOS → systemd → Login','BIOS/UEFI → GRUB → Kernel → systemd → Login','systemd → BIOS → Kernel → GRUB → Login','GRUB → BIOS → systemd → Kernel → Login'],correct:1,feedback:{correct:'Correct! The boot sequence: BIOS/UEFI initializes hardware → GRUB loads the kernel → Kernel initializes drivers and mounts filesystem → systemd (PID 1) starts services → User login prompt appears.',incorrect:'Boot order: BIOS/UEFI (hardware init) → GRUB bootloader (load kernel) → Kernel (drivers, root filesystem) → systemd/init (PID 1, services) → Login prompt.'}},
    {question:'What is GRUB and what role does it play in the boot process?',options:['A hardware diagnostic tool that tests RAM at boot','A bootloader that loads the Linux kernel into memory','The first process started by the Linux kernel','A tool for managing systemd unit files'],correct:1,feedback:{correct:'Correct! GRUB (Grand Unified Bootloader) is the bootloader — it sits between BIOS/UEFI and the kernel. It displays a menu for kernel selection, loads the chosen kernel image and initramfs, and hands control to the kernel.',incorrect:'GRUB is the bootloader — it runs after BIOS/UEFI, displays a menu to select which kernel to boot, loads the kernel and initramfs into RAM, then transfers control to the kernel.'}},
    {question:'Which systemd target is the standard target for a headless Linux server (no graphical interface)?',options:['graphical.target','rescue.target','multi-user.target','poweroff.target'],correct:2,feedback:{correct:'Correct! multi-user.target (equivalent to SysV runlevel 3) is the standard server target — full multi-user support with networking but no graphical desktop. graphical.target adds the desktop environment on top.',incorrect:'multi-user.target is the standard server target providing full multi-user, networked, text-mode operation. graphical.target adds a desktop environment. rescue.target is for recovery. poweroff.target shuts down.'}},
    {question:'What does PID 1 represent in Linux, and which program occupies it on modern systems?',options:['The first user process; always a shell','The kernel itself; no user program can be PID 1','The first userspace process; systemd on modern distros','The login manager; always GDM or LightDM'],correct:2,feedback:{correct:'Correct! PID 1 is the first userspace process started by the kernel. On modern Linux systems, this is systemd. All other processes are descendants of PID 1. It cannot be killed — killing PID 1 triggers a kernel panic.',incorrect:'PID 1 is the first userspace process — the ancestor of all other processes. On modern Linux, this is systemd. On traditional Unix, it was a simple "init". PID 1 cannot be killed; doing so causes a kernel panic.'}},
    {question:'In the X Window System, what is the role of the X Server?',options:['It provides web services to X client browsers','It manages the physical display hardware and processes input events','It is the application program that draws windows on screen','It handles user authentication for graphical logins'],correct:1,feedback:{correct:'Correct! The X Server manages the physical display (rendering pixels) and input devices (keyboard, mouse). X Clients are the applications — they request the X Server to draw their windows. This is a counterintuitive naming: the "server" is local hardware.',incorrect:'The X Server manages physical display hardware — drawing pixels and handling keyboard/mouse input. X Clients are the applications requesting display services. Display Managers (GDM, LightDM) handle login authentication.'}},
    {question:'What is Wayland\'s primary advantage over X11?',options:['Wayland supports more legacy applications than X11','Wayland is faster to install from package managers','Wayland has better security isolation between applications and a simpler architecture','Wayland provides built-in network transparency'],correct:2,feedback:{correct:'Correct! Wayland\'s key improvements over X11: applications cannot spy on each other\'s windows (security isolation), simpler architecture eliminating X11\'s complexity, better performance, and native support for modern GPU compositing.',incorrect:'Wayland\'s main advantage is security isolation (apps cannot read other apps\' window contents) plus simpler architecture and better GPU performance. X11 has network transparency but at a security cost. Wayland uses XWayland for X11 app compatibility.'}},
    {question:'Which command checks whether your current Linux session is running X11 or Wayland?',options:['displayctl status','echo $XDG_SESSION_TYPE','systemctl get-session','xorg --version'],correct:1,feedback:{correct:'Correct! The $XDG_SESSION_TYPE environment variable contains "x11" or "wayland" depending on your current session. This is the standard cross-desktop way to detect the display protocol in use.',incorrect:'"echo $XDG_SESSION_TYPE" reveals whether you are in an "x11" or "wayland" session. This environment variable is set by the login session and is the standard way to detect which protocol is active.'}},
    {question:'GDM is the default display manager for which desktop environment?',options:['KDE Plasma','Xfce','LXDE','GNOME'],correct:3,feedback:{correct:'Correct! GDM (GNOME Display Manager) is the default display manager for GNOME desktop environments, used by Ubuntu, Fedora, and other GNOME-based distros. SDDM is KDE\'s default, LightDM is common for Xfce and MATE.',incorrect:'GDM (GNOME Display Manager) is GNOME\'s display manager — used by Ubuntu (default GNOME), Fedora, and other GNOME distros. SDDM is KDE Plasma\'s default. LightDM is used by Xfce/MATE/LXDE-based distros.'}},
    {question:'What does <code>sudo timedatectl set-timezone UTC</code> accomplish?',options:['Sets the hardware clock only, not the system clock','Changes the system timezone to UTC (Coordinated Universal Time)','Enables NTP time synchronization','Changes the display format for the date command only'],correct:1,feedback:{correct:'Correct! timedatectl set-timezone changes the system timezone. UTC is the recommended timezone for production servers — log timestamps across globally distributed systems are directly comparable without conversion.',incorrect:'timedatectl set-timezone changes the system\'s timezone setting. UTC is recommended for servers because log timestamps across multiple systems in different regions are comparable without timezone conversion — a critical practice for incident response.'}},
    {question:'What is the purpose of the <code>localectl set-locale LANG=en_US.UTF-8</code> command?',options:['Changes keyboard layout to US English','Sets the system-wide language and character encoding to US English with UTF-8','Updates the system\'s IP address to a US server','Changes the timezone to US Eastern Time'],correct:1,feedback:{correct:'Correct! localectl set-locale configures the system locale — the LANG variable controls the default language for system messages, date/time formats, and character encoding. UTF-8 is the standard character encoding supporting all Unicode characters.',incorrect:'localectl set-locale LANG=en_US.UTF-8 sets the system-wide locale — specifying American English as the language and UTF-8 as the character encoding. This affects system messages, date/time/number formats, and character display.'}}
];

let currentQuestion=0,score=0,answered=new Array(questions.length).fill(false);
function initQuiz(){const c=document.getElementById('questionsContainer'),L=['A','B','C','D'];questions.forEach((q,idx)=>{c.innerHTML+=`<div class="question-card" id="question${idx}"><div class="question-number">QUESTION ${idx+1} OF ${questions.length}</div><div class="question-text">${q.question}</div><div class="options">${q.options.map((o,i)=>`<div class="option" onclick="selectOption(${idx},${i})"><span class="option-letter">${L[i]}</span><span>${o}</span></div>`).join('')}</div><div class="feedback" id="feedback${idx}"></div><div class="nav-buttons"><button class="nav-btn" id="nextBtn${idx}" onclick="nextQuestion()" disabled>${idx===questions.length-1?'See Results':'Next Question &rarr;'}</button></div></div>`;});showQuestion(0);}
function showQuestion(idx){document.querySelectorAll('.question-card').forEach(c=>c.classList.remove('active'));document.getElementById(`question${idx}`).classList.add('active');document.getElementById('progressFill').style.width=((idx+1)/questions.length*100)+'%';document.getElementById('questionCounter').textContent=`${idx+1} / ${questions.length}`;}
function selectOption(qIdx,optIdx){if(answered[qIdx])return;answered[qIdx]=true;const q=questions[qIdx];document.querySelectorAll(`#question${qIdx} .option`).forEach((o,i)=>{o.classList.add('disabled');if(i===q.correct)o.classList.add('correct');else if(i===optIdx)o.classList.add('incorrect');});const fb=document.getElementById(`feedback${qIdx}`);if(optIdx===q.correct){score++;fb.className='feedback show correct';fb.innerHTML='<strong>Correct!</strong> '+q.feedback.correct;}else{fb.className='feedback show incorrect';fb.innerHTML='<strong>Incorrect.</strong> '+q.feedback.incorrect;}document.getElementById(`nextBtn${qIdx}`).disabled=false;}
function nextQuestion(){if(currentQuestion<questions.length-1){currentQuestion++;showQuestion(currentQuestion);}else showResults();}
function showResults(){document.querySelectorAll('.question-card').forEach(c=>c.classList.remove('active'));document.getElementById('resultsCard').classList.add('show');const pct=Math.round(score/questions.length*100);document.getElementById('scoreCircle').textContent=pct+'%';document.getElementById('resultsSubtitle').textContent=`You scored ${score} out of ${questions.length} correct`;let t='Keep Practicing!';if(pct>=90)t='Outstanding!';else if(pct>=80)t='Great Work!';else if(pct>=70)t='Good Effort!';document.getElementById('resultsTitle').textContent=t;localStorage.setItem('hexworth_la_ch06_quiz_score',pct);if(pct>=70&&typeof ModuleProgress!=='undefined')ModuleProgress.complete('script','script-la-ch06-quiz');if(pct<70){document.getElementById('nextBtn').textContent='Retry Quiz';document.getElementById('nextBtn').href='la-ch06-quiz.quiz.html';}}
initQuiz();
</script>
</body>
</html>
