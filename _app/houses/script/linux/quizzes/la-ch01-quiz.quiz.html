<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH01 Quiz: Introduction to Linux — Script House</title>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --script-green: #22c55e; --script-accent: #4ade80; --script-glow: rgba(34,197,94,0.3);
            --bg-dark: #0a0a12; --bg-card: rgba(10,20,10,0.9); --text-primary: #e8e8f0;
            --text-secondary: #7a9a7a; --correct: #22c55e; --incorrect: #ef4444;
            --border: rgba(34,197,94,0.2);
        }
        body { min-height: 100vh; background: linear-gradient(135deg, #0a0a12, #0a1a0f, #0a250a); font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text-primary); }
        .quiz-header { padding: 1rem 2rem; border-bottom: 1px solid var(--border); background: rgba(10,10,18,0.96); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); }
        .back-btn { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: rgba(34,197,94,0.08); border: 1px solid var(--border); border-radius: 8px; color: var(--script-green); font-size: 0.85rem; font-weight: 600; text-decoration: none; transition: all 0.2s; }
        .back-btn:hover { background: rgba(34,197,94,0.15); }
        .progress-bar { width: 180px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--script-green), var(--script-accent)); width: 0%; transition: width 0.5s ease; }
        .header-badge { background: linear-gradient(135deg, var(--script-green), var(--script-accent)); color: #000; padding: 0.3rem 0.9rem; border-radius: 16px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; }
        .quiz-container { max-width: 820px; margin: 2.5rem auto; padding: 0 1.5rem 4rem; }
        .quiz-title { text-align: center; margin-bottom: 2.5rem; }
        .quiz-title h1 { font-size: 1.9rem; color: var(--script-green); margin-bottom: 0.5rem; }
        .quiz-title p { color: var(--text-secondary); font-size: 0.95rem; }
        .question-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; margin-bottom: 1.25rem; display: none; }
        .question-card.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .question-number { color: var(--script-green); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 0.9rem; }
        .question-text { font-size: 1.15rem; line-height: 1.6; margin-bottom: 1.5rem; }
        .question-text code { background: rgba(34,197,94,0.12); color: var(--script-accent); padding: 2px 8px; border-radius: 4px; font-family: 'Consolas',monospace; font-size: 0.9em; }
        .options { display: grid; gap: 0.75rem; }
        .option { padding: 1rem 1.25rem; background: rgba(34,197,94,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.9rem; }
        .option:hover:not(.disabled) { background: rgba(34,197,94,0.1); border-color: var(--script-green); }
        .option.selected { background: rgba(34,197,94,0.15); border-color: var(--script-green); }
        .option.correct { background: rgba(34,197,94,0.2); border-color: var(--correct); }
        .option.incorrect { background: rgba(239,68,68,0.15); border-color: var(--incorrect); }
        .option.disabled { pointer-events: none; opacity: 0.75; }
        .option-letter { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; flex-shrink: 0; }
        .option.correct .option-letter { background: var(--correct); color: #000; }
        .option.incorrect .option-letter { background: var(--incorrect); color: #fff; }
        .feedback { margin-top: 1.25rem; padding: 1rem 1.25rem; border-radius: 10px; display: none; font-size: 0.9rem; line-height: 1.5; }
        .feedback.show { display: block; animation: fadeIn 0.3s ease; }
        .feedback.correct { background: rgba(34,197,94,0.1); border-left: 3px solid var(--correct); color: var(--text-primary); }
        .feedback.incorrect { background: rgba(239,68,68,0.1); border-left: 3px solid var(--incorrect); color: var(--text-primary); }
        .nav-buttons { display: flex; justify-content: flex-end; margin-top: 1.5rem; }
        .nav-btn { padding: 0.7rem 1.75rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; background: linear-gradient(135deg, var(--script-green), var(--script-accent)); color: #000; }
        .nav-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px var(--script-glow); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .results-card { background: var(--bg-card); border: 1px solid rgba(34,197,94,0.35); border-radius: 16px; padding: 3rem; text-align: center; display: none; }
        .results-card.show { display: block; animation: fadeIn 0.5s ease; }
        .score-circle { width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(135deg, var(--script-green), var(--script-accent)); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.75rem; font-size: 2.8rem; font-weight: 900; color: #000; }
        .results-title { font-size: 1.75rem; color: var(--script-green); margin-bottom: 0.6rem; }
        .results-subtitle { color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.95rem; }
        .results-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .action-btn { padding: 0.75rem 1.75rem; border-radius: 10px; text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; }
        .action-btn.primary { background: linear-gradient(135deg, var(--script-green), var(--script-accent)); color: #000; }
        .action-btn.secondary { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-secondary); }
        .action-btn:hover { transform: translateY(-2px); }
        #questionCounter { color: var(--text-secondary); font-size: 0.85rem; }
    </style>
</head>
<body>

<header class="quiz-header">
    <a href="../presentations/la-ch01-intro.presentation.html" class="back-btn">&larr; Back to Presentation</a>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span id="questionCounter">1 / 10</span>
</header>

<div class="quiz-container">
    <div class="quiz-title">
        <h1>CH01: Introduction to Linux</h1>
        <p>10 questions covering Linux history, the kernel, shell, file system hierarchy, and permissions</p>
    </div>
    <div id="questionsContainer"></div>
    <div class="results-card" id="resultsCard">
        <div class="score-circle" id="scoreCircle">0%</div>
        <h2 class="results-title" id="resultsTitle">Quiz Complete!</h2>
        <p class="results-subtitle" id="resultsSubtitle"></p>
        <div class="results-actions">
            <a href="../presentations/la-ch01-intro.presentation.html" class="action-btn secondary">Review Slides</a>
            <a href="../labs/la-ch01-intro.lab.html" class="action-btn primary" id="nextBtn">Go to Lab &rarr;</a>
        </div>
    </div>
</div>

<script src="../../../../components/FluxCapacitor.js"></script>
<script>
const questions = [
    {
        question: 'Who created the Linux kernel, and in what year?',
        options: ['Richard Stallman, 1983', 'Linus Torvalds, 1991', 'Dennis Ritchie, 1969', 'Andrew Tanenbaum, 1987'],
        correct: 1,
        feedback: {
            correct: 'Correct! Linus Torvalds posted his famous "just a hobby" message in 1991 and released the first Linux kernel. Richard Stallman created the GNU Project in 1983, which provided the tools that paired with the Linux kernel.',
            incorrect: 'Linus Torvalds created the Linux kernel in 1991. He was a 21-year-old Finnish student at the University of Helsinki. The GNU tools from Richard Stallman (1983) combined with Torvalds\' kernel to form GNU/Linux.'
        }
    },
    {
        question: 'What is the correct definition of the Linux kernel?',
        options: [
            'A complete operating system including desktop environment',
            'The lowest-level software layer that manages hardware and provides services to applications',
            'A package manager that distributes Linux software',
            'A graphical interface for managing Linux settings'
        ],
        correct: 1,
        feedback: {
            correct: 'Correct! The kernel is the core software bridge between hardware and user applications. It manages CPU scheduling, memory, device drivers, and the filesystem — but it is not a complete OS by itself.',
            incorrect: 'The Linux kernel is the lowest-level software layer — the bridge between hardware and user applications. It manages CPU, memory, I/O, and filesystems. A complete OS requires the kernel plus GNU tools, a package manager, and other components.'
        }
    },
    {
        question: 'What does the <code>pwd</code> command do?',
        options: ['Changes the current directory', 'Lists directory contents', 'Prints the current working directory path', 'Shows user password information'],
        correct: 2,
        feedback: {
            correct: 'Correct! PWD stands for Print Working Directory — it displays your current location in the filesystem hierarchy.',
            incorrect: '<code>pwd</code> stands for Print Working Directory. It outputs your current location in the filesystem. Use <code>cd</code> to change directory and <code>ls</code> to list contents.'
        }
    },
    {
        question: 'In the Linux file system hierarchy, which directory contains system-wide configuration files?',
        options: ['/bin', '/etc', '/var', '/usr'],
        correct: 1,
        feedback: {
            correct: 'Correct! /etc (from Unix tradition: "et cetera") holds system-wide configuration files. SSH config is at /etc/ssh/, network settings at /etc/network/, and package sources at /etc/apt/.',
            incorrect: '/etc contains system-wide configuration files. /bin holds essential command binaries (ls, cp, mv), /var holds variable data like logs, and /usr is the Unix System Resources secondary hierarchy.'
        }
    },
    {
        question: 'What does the file permission string <code>-rwxr-xr--</code> mean?',
        options: [
            'Owner: full access; Group: read+execute; Others: read only',
            'Owner: read only; Group: full access; Others: read+execute',
            'Owner: full access; Group: write only; Others: execute only',
            'Everyone: full access'
        ],
        correct: 0,
        feedback: {
            correct: 'Correct! Reading left to right: "-" = regular file; "rwx" = owner has read+write+execute; "r-x" = group has read+execute (no write); "r--" = others have read only.',
            incorrect: 'The string -rwxr-xr-- breaks down as: "-" (regular file) | "rwx" (owner: read+write+execute) | "r-x" (group: read+execute) | "r--" (others: read only).'
        }
    },
    {
        question: 'Which chmod command makes a script executable by the owner only, with no permissions for anyone else?',
        options: ['chmod 755 script.sh', 'chmod 644 script.sh', 'chmod 700 script.sh', 'chmod 777 script.sh'],
        correct: 2,
        feedback: {
            correct: 'Correct! 700 in octal means: 7 (owner: rwx=4+2+1), 0 (group: none), 0 (others: none). The owner gets full access, nobody else gets anything.',
            incorrect: 'chmod 700 gives owner full access (rwx=7) and no permissions to group or others (00). 755 gives others read+execute, 644 gives read-only to group/others, and 777 is a security risk giving everyone all permissions.'
        }
    },
    {
        question: 'What is the significance of the <code>/proc</code> directory in Linux?',
        options: [
            'It stores user process logs',
            'A virtual filesystem exposing kernel and process information as files',
            'The directory for installed programs',
            'Temporary storage cleared on reboot'
        ],
        correct: 1,
        feedback: {
            correct: 'Correct! /proc is a virtual filesystem — no actual disk storage. The kernel generates its contents on-the-fly. Each running process has a /proc/PID/ directory. /proc/cpuinfo, /proc/meminfo, /proc/version are common kernel info files.',
            incorrect: '/proc is a virtual filesystem (procfs) that exposes kernel and process information as files. It has no actual disk storage — the kernel generates contents dynamically. /tmp is temporary storage, /var/log is for logs.'
        }
    },
    {
        question: 'What does the shell\'s $PATH variable control?',
        options: [
            'The current working directory',
            'The list of directories searched when you type a command',
            'The location of the user\'s home directory',
            'The shell\'s configuration file location'
        ],
        correct: 1,
        feedback: {
            correct: 'Correct! $PATH contains a colon-separated list of directories the shell searches (left to right) when you type a command. If the command is not found in any PATH directory, you get "command not found".',
            incorrect: '$PATH is a colon-separated list of directories where the shell looks for commands you type. Example: /usr/local/bin:/usr/bin:/bin. If you type "ls", the shell checks each directory until it finds /bin/ls. $HOME is home directory, $PWD is current directory.'
        }
    },
    {
        question: 'Which command is used to change file ownership to user "alice" and group "developers"?',
        options: ['chmod alice:developers file.txt', 'chown alice:developers file.txt', 'usermod alice:developers file.txt', 'chgrp alice:developers file.txt'],
        correct: 1,
        feedback: {
            correct: 'Correct! chown (change owner) sets the user and group ownership of a file. Format: chown user:group file. You typically need sudo to change ownership.',
            incorrect: 'chown (change owner) is used to change file ownership. Syntax: chown user:group filename. chmod changes permissions, usermod modifies user accounts, and chgrp changes only the group (not both user and group together).'
        }
    },
    {
        question: 'What is a Linux "distribution" (distro)?',
        options: [
            'A version of the Linux kernel only',
            'A graphical desktop environment for Linux',
            'The Linux kernel bundled with GNU tools, package manager, and other software into a complete OS',
            'A software repository hosted online'
        ],
        correct: 2,
        feedback: {
            correct: 'Correct! A Linux distribution packages the kernel with GNU utilities, a package manager, init system, and often a desktop environment into a complete, installable operating system. Ubuntu, Fedora, Debian, and Arch are all distributions.',
            incorrect: 'A Linux distribution (distro) is the Linux kernel combined with GNU tools, a package manager, an init system, and other software to create a complete operating system. Ubuntu, Fedora, Debian, Arch, and Kali are all distinct distributions.'
        }
    }
];

let currentQuestion = 0;
let score = 0;
let answered = new Array(questions.length).fill(false);

function initQuiz() {
    const container = document.getElementById('questionsContainer');
    questions.forEach((q, idx) => {
        const letters = ['A','B','C','D'];
        const html = `
            <div class="question-card" id="question${idx}">
                <div class="question-number">QUESTION ${idx+1} OF ${questions.length}</div>
                <div class="question-text">${q.question}</div>
                <div class="options">
                    ${q.options.map((opt, i) => `
                        <div class="option" onclick="selectOption(${idx}, ${i})">
                            <span class="option-letter">${letters[i]}</span>
                            <span>${opt}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="feedback" id="feedback${idx}"></div>
                <div class="nav-buttons">
                    <button class="nav-btn" id="nextBtn${idx}" onclick="nextQuestion()" disabled>
                        ${idx === questions.length - 1 ? 'See Results' : 'Next Question &rarr;'}
                    </button>
                </div>
            </div>`;
        container.innerHTML += html;
    });
    showQuestion(0);
}

function showQuestion(idx) {
    document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
    document.getElementById(`question${idx}`).classList.add('active');
    const pct = ((idx + 1) / questions.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('questionCounter').textContent = `${idx+1} / ${questions.length}`;
}

function selectOption(qIdx, optIdx) {
    if (answered[qIdx]) return;
    answered[qIdx] = true;
    const q = questions[qIdx];
    const opts = document.querySelectorAll(`#question${qIdx} .option`);
    const fb = document.getElementById(`feedback${qIdx}`);
    opts.forEach((opt, i) => {
        opt.classList.add('disabled');
        if (i === q.correct) opt.classList.add('correct');
        else if (i === optIdx) opt.classList.add('incorrect');
    });
    if (optIdx === q.correct) {
        score++;
        fb.className = 'feedback show correct';
        fb.innerHTML = '<strong>Correct!</strong> ' + q.feedback.correct;
    } else {
        fb.className = 'feedback show incorrect';
        fb.innerHTML = '<strong>Incorrect.</strong> ' + q.feedback.incorrect;
    }
    document.getElementById(`nextBtn${qIdx}`).disabled = false;
}

function nextQuestion() {
    if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        showQuestion(currentQuestion);
    } else {
        showResults();
    }
}

function showResults() {
    document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
    const resultsCard = document.getElementById('resultsCard');
    resultsCard.classList.add('show');
    const pct = Math.round((score / questions.length) * 100);
    document.getElementById('scoreCircle').textContent = pct + '%';
    document.getElementById('resultsSubtitle').textContent = `You scored ${score} out of ${questions.length} correct`;
    let title = 'Keep Practicing!';
    if (pct >= 90) title = 'Outstanding!';
    else if (pct >= 80) title = 'Great Work!';
    else if (pct >= 70) title = 'Good Effort!';
    document.getElementById('resultsTitle').textContent = title;
    // Save score
    localStorage.setItem('hexworth_la_ch01_quiz_score', pct);
    if (pct >= 70 && typeof ModuleProgress !== 'undefined') {
        ModuleProgress.complete('script', 'script-la-ch01-quiz');
    }
    if (pct < 70) {
        document.getElementById('nextBtn').textContent = 'Retry Quiz';
        document.getElementById('nextBtn').href = 'la-ch01-quiz.quiz.html';
    }
}

initQuiz();
</script>
</body>
</html>
