<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Linux Admin Course</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>

        <div id="quiz-container"></div>
    </main>
    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CH01 Quiz: Introduction to Linux — Script House',
            description: '10 questions covering Linux history, the kernel, shell, file system hierarchy, and permissions',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-la-ch01-quiz',
            moduleId: 'la-ch01-quiz',
            houseId: 'script',
            trackProgress: true,
            nextModule: {
                title: 'Ch 2: Linux Distributions & Uses',
                href: 'linux/presentations/script-la-ch02-distros.presentation.html'
            },

            questions: [
                {
                    question: 'Who created the Linux kernel, and in what year?',
                    options: [
                        'Richard Stallman, 1983',
                        'Linus Torvalds, 1991',
                        'Dennis Ritchie, 1969',
                        'Andrew Tanenbaum, 1987'
                    ],
                    correct: 1,
                    explanation: 'Linus Torvalds posted his famous "just a hobby" message in 1991 and released the first Linux kernel. Richard Stallman created the GNU Project in 1983, which provided the tools that paired with the Linux kernel.'
                },
                {
                    question: 'What is the correct definition of the Linux kernel?',
                    options: [
                        'A complete operating system including desktop environment',
                        'The lowest-level software layer that manages hardware and provides services to applications',
                        'A package manager that distributes Linux software',
                        'A graphical interface for managing Linux settings'
                    ],
                    correct: 1,
                    explanation: 'The kernel is the core software bridge between hardware and user applications. It manages CPU scheduling, memory, device drivers, and the filesystem — but it is not a complete OS by itself.'
                },
                {
                    question: 'What does the <code>pwd</code> command do?',
                    options: [
                        'Changes the current directory',
                        'Lists directory contents',
                        'Prints the current working directory path',
                        'Shows user password information'
                    ],
                    correct: 2,
                    explanation: 'PWD stands for Print Working Directory — it displays your current location in the filesystem hierarchy.'
                },
                {
                    question: 'In the Linux file system hierarchy, which directory contains system-wide configuration files?',
                    options: [
                        '/bin',
                        '/etc',
                        '/var',
                        '/usr'
                    ],
                    correct: 1,
                    explanation: '/etc (from Unix tradition: "et cetera") holds system-wide configuration files. SSH config is at /etc/ssh/, network settings at /etc/network/, and package sources at /etc/apt/.'
                },
                {
                    question: 'What does the file permission string <code>-rwxr-xr--</code> mean?',
                    options: [
                        'Owner: full access; Group: read+execute; Others: read only',
                        'Owner: read only; Group: full access; Others: read+execute',
                        'Owner: full access; Group: write only; Others: execute only',
                        'Everyone: full access'
                    ],
                    correct: 0,
                    explanation: 'Reading left to right: "-" = regular file; "rwx" = owner has read+write+execute; "r-x" = group has read+execute (no write); "r--" = others have read only.'
                },
                {
                    question: 'Which chmod command makes a script executable by the owner only, with no permissions for anyone else?',
                    options: [
                        'chmod 755 script.sh',
                        'chmod 644 script.sh',
                        'chmod 700 script.sh',
                        'chmod 777 script.sh'
                    ],
                    correct: 2,
                    explanation: '700 in octal means: 7 (owner: rwx=4+2+1), 0 (group: none), 0 (others: none). The owner gets full access, nobody else gets anything.'
                },
                {
                    question: 'What is the significance of the <code>/proc</code> directory in Linux?',
                    options: [
                        'It stores user process logs',
                        'A virtual filesystem exposing kernel and process information as files',
                        'The directory for installed programs',
                        'Temporary storage cleared on reboot'
                    ],
                    correct: 1,
                    explanation: '/proc is a virtual filesystem — no actual disk storage. The kernel generates its contents on-the-fly. Each running process has a /proc/PID/ directory. /proc/cpuinfo, /proc/meminfo, /proc/version are common kernel info files.'
                },
                {
                    question: 'What does the shell\'s $PATH variable control?',
                    options: [
                        'The current working directory',
                        'The list of directories searched when you type a command',
                        'The location of the user\'s home directory',
                        'The shell\'s configuration file location'
                    ],
                    correct: 1,
                    explanation: '$PATH contains a colon-separated list of directories the shell searches (left to right) when you type a command. If the command is not found in any PATH directory, you get "command not found".'
                },
                {
                    question: 'Which command is used to change file ownership to user "alice" and group "developers"?',
                    options: [
                        'chmod alice:developers file.txt',
                        'chown alice:developers file.txt',
                        'usermod alice:developers file.txt',
                        'chgrp alice:developers file.txt'
                    ],
                    correct: 1,
                    explanation: 'chown (change owner) sets the user and group ownership of a file. Format: chown user:group file. You typically need sudo to change ownership.'
                },
                {
                    question: 'What is a Linux "distribution" (distro)?',
                    options: [
                        'A version of the Linux kernel only',
                        'A graphical desktop environment for Linux',
                        'The Linux kernel bundled with GNU tools, package manager, and other software into a complete OS',
                        'A software repository hosted online'
                    ],
                    correct: 2,
                    explanation: 'A Linux distribution packages the kernel with GNU utilities, a package manager, init system, and often a desktop environment into a complete, installable operating system. Ubuntu, Fedora, Debian, and Arch are all distributions.'
                }
            ]
        });
        quiz.start();
    </script>
