<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Linux Admin Course</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Ch 8 Quiz: Network Configuration',
            description: '10 questions on ifconfig vs ip, netplan, NetworkManager, nmcli, and network troubleshooting',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-la-ch08-quiz',
            moduleId: 'la-ch08-quiz',
            houseId: 'script',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the modern replacement for <code>ifconfig</code> on Linux systems?',
                    options: [
                        'netstat',
                        'ip (from iproute2 package)',
                        'route',
                        'iwconfig'
                    ],
                    correct: 1,
                    explanation: 'The <code>ip</code> command from the <strong>iproute2</strong> package is the modern replacement for <code>ifconfig</code>, <code>route</code>, and <code>arp</code>. It provides a unified interface for managing IP addresses, routes, tunnels, and link parameters. <code>ifconfig</code> is part of the legacy <code>net-tools</code> package which is no longer installed by default on many distributions.'
                },
                {
                    question: 'Which command assigns a static IP address of 10.0.0.5/24 to interface enp0s3 using the modern Linux networking tool?',
                    options: [
                        'ifconfig enp0s3 10.0.0.5 netmask 255.255.255.0',
                        'sudo ip addr add 10.0.0.5/24 dev enp0s3',
                        'ip link set enp0s3 10.0.0.5/24',
                        'netplan add 10.0.0.5/24 enp0s3'
                    ],
                    correct: 1,
                    explanation: '<code>sudo ip addr add 10.0.0.5/24 dev enp0s3</code> is the correct syntax. <code>ip addr</code> manages addresses, <code>ip link</code> manages interface state (up/down, MTU), and <code>ip route</code> manages routing. Note: this change is not persistent — it is lost on reboot. Use netplan, /etc/network/interfaces, or nmcli for persistent configuration.'
                },
                {
                    question: 'Netplan configuration files are stored in which directory?',
                    options: [
                        '/etc/network/',
                        '/etc/netplan/',
                        '/etc/sysconfig/network-scripts/',
                        '/etc/NetworkManager/'
                    ],
                    correct: 1,
                    explanation: 'Netplan configuration files (YAML format) live in <code>/etc/netplan/</code>. Common filenames are <code>00-installer-config.yaml</code> or <code>01-netcfg.yaml</code>. Files must have mode 600 permissions. After editing, apply changes with <code>sudo netplan apply</code> or test safely with <code>sudo netplan try</code>.'
                },
                {
                    question: 'Which command applies a new netplan configuration?',
                    options: [
                        'sudo systemctl restart networking',
                        'sudo netplan apply',
                        'sudo ip reload',
                        'sudo netplan start'
                    ],
                    correct: 1,
                    explanation: '<code>sudo netplan apply</code> reads all YAML files in /etc/netplan/ and applies them to the backend (systemd-networkd or NetworkManager). <code>sudo netplan try</code> applies the config but automatically reverts after 120 seconds if you do not confirm — useful for remote sessions where a bad config could lock you out. <code>sudo netplan generate</code> creates backend config files without applying them.'
                },
                {
                    question: 'Which <code>nmcli</code> command shows all active network connections?',
                    options: [
                        'nmcli device list',
                        'nmcli connection status',
                        'nmcli connection show --active',
                        'nmcli show active'
                    ],
                    correct: 2,
                    explanation: '<code>nmcli connection show --active</code> displays only active (connected) NetworkManager connection profiles. <code>nmcli connection show</code> (without --active) lists all saved profiles including inactive ones. <code>nmcli device status</code> shows device state (connected, disconnected, unmanaged). <code>nmcli device list</code> is not a valid nmcli subcommand.'
                },
                {
                    question: 'After making an IP address change with the <code>ip addr add</code> command, you reboot the server. What happens to the address?',
                    options: [
                        'The address is lost — ip addr changes are not persistent across reboots',
                        'The address persists because ip writes to /etc/network/interfaces automatically',
                        'The address persists if you ran the command as root',
                        'The address persists if the interface was up when you added it'
                    ],
                    correct: 0,
                    explanation: 'The <code>ip</code> command modifies the running kernel network configuration only. Changes are immediately effective but are lost on reboot. For persistence you must use netplan (Ubuntu 18.04+), /etc/network/interfaces (older Debian), or NetworkManager (nmcli connection add). This is one of the most common misconceptions for new Linux admins.'
                },
                {
                    question: 'Which command shows all TCP and UDP listening ports along with their process IDs?',
                    options: [
                        'ip link show',
                        'ping -a localhost',
                        'ss -tulnp',
                        'ip route show'
                    ],
                    correct: 2,
                    explanation: '<code>ss -tulnp</code>: <strong>t</strong>=TCP, <strong>u</strong>=UDP, <strong>l</strong>=listening, <strong>n</strong>=numeric (no DNS lookup, faster), <strong>p</strong>=show process. <code>ss</code> is the modern replacement for <code>netstat</code>. The equivalent legacy command is <code>netstat -tulnp</code>. This is essential for security audits and troubleshooting port conflicts.'
                },
                {
                    question: 'In a netplan YAML file, which key sets the default gateway?',
                    options: [
                        'gateway4: 192.168.1.1',
                        'routes: - to: default / via: 192.168.1.1',
                        'default-route: 192.168.1.1',
                        'gw4: 192.168.1.1'
                    ],
                    correct: 1,
                    explanation: 'In modern netplan (Ubuntu 22.04+), the preferred way to set a default gateway is using the <code>routes</code> key: <code>routes: - to: default / via: 192.168.1.1</code>. The older <code>gateway4</code> key is deprecated and produces warnings in newer versions of netplan. Both work currently but <code>routes/via</code> is the forward-compatible approach.'
                },
                {
                    question: 'What is the correct systematic order for testing network connectivity from a Linux workstation?',
                    options: [
                        'DNS lookup → gateway ping → loopback ping → remote IP',
                        'Loopback ping → gateway ping → remote IP ping → DNS lookup',
                        'Remote IP ping → DNS lookup → gateway ping → loopback',
                        'Gateway ping → DNS lookup → remote IP → loopback'
                    ],
                    correct: 1,
                    explanation: 'The correct order tests each layer progressively: (1) <strong>Loopback (127.0.0.1)</strong> — verifies the TCP/IP stack is loaded. (2) <strong>Gateway ping</strong> — verifies the local interface, subnet addressing, and that the router is reachable. (3) <strong>Remote IP (e.g., 8.8.8.8)</strong> — verifies routing beyond the local subnet. (4) <strong>DNS lookup</strong> — verifies name resolution separately from routing. Failing only at step 4 means a DNS problem, not a routing problem.'
                },
                {
                    question: 'Which tool is the CLI frontend for NetworkManager, used to create persistent connection profiles from the command line?',
                    options: [
                        'netplan',
                        'ip',
                        'nmcli',
                        'ifupdown'
                    ],
                    correct: 2,
                    explanation: '<code>nmcli</code> (NetworkManager Command-Line Interface) is the CLI tool for managing NetworkManager. It creates, modifies, activates, and deactivates connection profiles persistently. Profiles survive reboots. It is the standard tool on RHEL/CentOS/Fedora servers and desktop Linux systems using NetworkManager. <code>netplan</code> is Ubuntu\'s YAML-based abstraction layer. <code>ip</code> is non-persistent. <code>ifupdown</code> is the old Debian tool.'
                }
            ]
        });
        quiz.start();
    </script>
