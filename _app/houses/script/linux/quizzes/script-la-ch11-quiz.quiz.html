    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Ch 11 Quiz: Encryption',
            description: '10 questions on GPG, LUKS/cryptsetup, openssl, SSH keys, and encryption concepts',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-la-ch11-quiz',
            moduleId: 'la-ch11-quiz',
            serverGrading: true,
            houseId: 'script',
            trackProgress: true,
            nextModule: {
                title: 'Ch 12: Compiling Source Code',
                href: '../presentations/script-la-ch12-compile.presentation.html'
            },

            questions: [
                {
                    question: 'In asymmetric encryption, which key is used to <strong>encrypt</strong> data that only a specific recipient can read?',
                    options: [
                        'The recipient\'s private key',
                        'The recipient\'s public key',
                        'The sender\'s private key',
                        'A shared symmetric key agreed upon before transmission'
                    ],explanation: 'In asymmetric encryption: you encrypt with the <strong>recipient\'s public key</strong> — only their private key can decrypt it. This is the confidentiality model. Conversely, signing uses the <strong>sender\'s private key</strong> — anyone with the sender\'s public key can verify the signature. This distinction is fundamental to understanding GPG and PKI systems.'
                },
                {
                    question: 'Which GPG command symmetrically encrypts a file using only a passphrase (no key pair required)?',
                    options: [
                        'gpg --encrypt secrets.txt',
                        'gpg -c secrets.txt',
                        'gpg --sign secrets.txt',
                        'gpg --symmetric-key secrets.txt'
                    ],explanation: '<code>gpg -c</code> (or <code>gpg --symmetric</code>) encrypts a file using a passphrase only — no key pair needed. Anyone with the passphrase can decrypt. <code>gpg --encrypt</code> requires specifying a recipient\'s public key. <code>gpg --sign</code> signs without encrypting. The <code>-c</code> flag is the simplest way to protect a file when you don\'t need public-key infrastructure.'
                },
                {
                    question: 'What does LUKS stand for, and what layer of the Linux system does it encrypt?',
                    options: [
                        'Linux Universal Key System — encrypts individual files',
                        'Linux Unified Key Setup — encrypts at the block device level (entire partition or disk)',
                        'Layered Unix Key Security — encrypts the home directory only',
                        'Linux Uniform Key Storage — encrypts the /etc directory'
                    ],explanation: 'LUKS (Linux Unified Key Setup) is the standard disk encryption specification for Linux. It encrypts at the block device level — the entire partition or disk appears as random data to anyone without the correct passphrase. The kernel\'s dm-crypt subsystem performs transparent on-the-fly encryption/decryption. The LUKS header stores metadata including key slots (up to 8 passphrases can unlock the same device).'
                },
                {
                    question: 'After running <code>sudo cryptsetup luksOpen /dev/sdb1 mydata</code>, what device path can you now mount?',
                    options: [
                        '/dev/sdb1 directly',
                        '/dev/mapper/mydata',
                        '/dev/luks/mydata',
                        '/mnt/mydata (automatically mounted)'
                    ],explanation: 'After <code>cryptsetup luksOpen</code>, the decrypted view of the device is available at <code>/dev/mapper/mydata</code> — the name "mydata" is the mapping name you specified. You then format it (<code>mkfs.ext4 /dev/mapper/mydata</code>) or mount it (<code>mount /dev/mapper/mydata /mnt/secure</code>). The original encrypted device (/dev/sdb1) remains inaccessible directly while the mapped device is open.'
                },
                {
                    question: 'Which command generates a modern Ed25519 SSH key pair with a comment?',
                    options: [
                        'gpg --gen-key --type ed25519',
                        'ssh-keygen -t ed25519 -C "user@hostname"',
                        'openssl genrsa -ed25519 -out key.pem',
                        'ssh-keygen --algorithm ed25519'
                    ],explanation: '<code>ssh-keygen -t ed25519 -C "comment"</code> generates an Ed25519 key pair. Ed25519 is the modern preferred algorithm — it is faster, more secure, and produces smaller keys than RSA. The <code>-C</code> flag adds a comment (usually user@host) to help identify the key. The private key saves to <code>~/.ssh/id_ed25519</code> and the public key to <code>~/.ssh/id_ed25519.pub</code>.'
                },
                {
                    question: 'What permissions should the private SSH key file (~/.ssh/id_ed25519) have?',
                    options: [
                        '644 (owner read/write, group/others read)',
                        '600 (owner read/write only — no group or others)',
                        '755 (owner full, group/others read/execute)',
                        '400 (owner read only)'
                    ],explanation: 'SSH private keys must be mode <strong>600</strong> (owner read/write, no access for group or others). If the permissions are too permissive (e.g., 644 or 755), SSH will refuse to use the key and show "WARNING: UNPROTECTED PRIVATE KEY FILE!". The <code>~/.ssh/</code> directory itself must be mode <strong>700</strong>. The public key (.pub) can be mode 644.'
                },
                {
                    question: 'Which GPG operation proves a file came from you without making it unreadable?',
                    options: [
                        'gpg -c (symmetric encryption)',
                        'gpg --encrypt (asymmetric encryption)',
                        'gpg --sign or gpg --clearsign (digital signature)',
                        'gpg --import (key import)'
                    ],explanation: '<code>gpg --sign</code> creates a digital signature using your private key. Recipients can verify the signature with your public key to confirm authenticity and integrity — but the file content is not hidden. <code>gpg --clearsign</code> adds the signature inline while keeping the text human-readable. <code>gpg --detach-sign</code> creates a separate .sig file. Encryption hides content; signing proves authorship.'
                },
                {
                    question: 'What is the primary advantage of full disk encryption (LUKS) over file-level encryption (GPG)?',
                    options: [
                        'LUKS is faster because it uses smaller keys',
                        'LUKS encrypts everything including filenames, sizes, and metadata — nothing is readable without the key',
                        'LUKS is compatible with Windows, GPG is not',
                        'LUKS uses asymmetric keys making it more secure than GPG\'s symmetric approach'
                    ],explanation: 'LUKS disk encryption protects everything on the block device — file contents, filenames, directory structures, timestamps, and metadata are all encrypted. File-level encryption (GPG) encrypts file contents but leaves filenames and directory structure visible. For protecting a stolen laptop or drive, LUKS provides complete protection. File-level encryption is more selective but leaks metadata.'
                },
                {
                    question: 'Which command copies your SSH public key to a remote server to enable passwordless login?',
                    options: [
                        'scp ~/.ssh/id_ed25519 user@server:~/.ssh/authorized_keys',
                        'ssh-copy-id user@server',
                        'ssh-keygen --deploy user@server',
                        'gpg --send-keys user@server'
                    ],explanation: '<code>ssh-copy-id user@server</code> automatically appends your public key to <code>~/.ssh/authorized_keys</code> on the remote server, creating the directory and file if needed with correct permissions. It is the safest and simplest method. Using <code>scp</code> directly risks overwriting existing authorized_keys entries. The <code>--deploy</code> flag does not exist in ssh-keygen.'
                },
                {
                    question: 'You need to encrypt a file for yourself using AES-256 with openssl. Which command is correct?',
                    options: [
                        'openssl encrypt -aes256 -in plain.txt -out enc.bin',
                        'openssl enc -aes-256-cbc -pbkdf2 -in plain.txt -out enc.bin',
                        'openssl aes -256 -encrypt plain.txt',
                        'openssl dgst -aes256 -in plain.txt'
                    ],explanation: '<code>openssl enc -aes-256-cbc -pbkdf2 -in plain.txt -out enc.bin</code> is correct. <code>enc</code> is the encryption subcommand. <code>-aes-256-cbc</code> specifies the cipher. <code>-pbkdf2</code> uses PBKDF2 key derivation (required in OpenSSL 3.x to avoid legacy warnings). To decrypt: <code>openssl enc -d -aes-256-cbc -pbkdf2 -in enc.bin -out plain.txt</code>. The <code>-d</code> flag means decrypt. <code>openssl dgst</code> is for hashing, not encryption.'
                }
            ]
        });
        quiz.start();
    </script>
