<body>
    <header class="page-header">
        <a href="../index.html">&larr; Back to Linux Admin Course</a>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Ch 12 Quiz: Compiling Source Code',
            description: '10 questions on gcc, make, ./configure, Makefiles, dependencies, ldconfig, and checkinstall',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-la-ch12-quiz',
            moduleId: 'la-ch12-quiz',
            serverGrading: true,
            houseId: 'script',
            trackProgress: true,
            nextModule: {
                title: 'Course Hub',
                href: 'linux/index.html'
            },

            questions: [
                {
                    question: 'What is the correct order of steps to compile and install software from source using the traditional autotools workflow?',
                    options: [
                        'make → ./configure → make install',
                        './configure → make → sudo make install',
                        'gcc → ./configure → make',
                        'sudo make install → make → ./configure'
                    ],explanation: 'The standard autotools compilation workflow is: (1) <code>./configure</code> — checks system, generates Makefile. (2) <code>make</code> — compiles source into binaries. (3) <code>sudo make install</code> — copies binaries to system paths. This order is mandatory: you cannot run make without a Makefile, and you cannot install without compiled binaries. The configure step requires development tools already installed.'
                },
                {
                    question: 'What does the <code>./configure</code> script produce as its primary output?',
                    options: [
                        'The compiled binary executable',
                        'A Makefile tailored to the local system\'s libraries and capabilities',
                        'A .rpm or .deb package',
                        'A list of missing dependencies without generating any files'
                    ],explanation: 'The configure script checks the local system for compiler availability, required libraries, headers, and system capabilities, then generates a <strong>Makefile</strong> customized for that environment. It also generates <code>config.h</code> with #define constants for system-detected features. If a dependency is missing, configure exits with an error before generating the Makefile — you must install the missing package and re-run configure.'
                },
                {
                    question: '<code>./configure</code> fails with "OpenSSL library not found." You confirm openssl is installed. What is the most likely fix?',
                    options: [
                        'Reinstall openssl',
                        'Install the development headers package: libssl-dev (Debian/Ubuntu) or openssl-devel (RHEL/Fedora)',
                        'Run make before ./configure',
                        'Add /usr/lib to PATH'
                    ],explanation: 'When configure fails with "library not found" despite the library being installed, the issue is missing <strong>development headers</strong>. Distributions split libraries into runtime packages (just the .so file) and development packages (headers + .a files). On Debian/Ubuntu: install <code>libssl-dev</code>. On RHEL/Fedora: install <code>openssl-devel</code>. The configure script checks for header files (#include &lt;openssl/ssl.h&gt;), not just the runtime library.'
                },
                {
                    question: 'What does <code>make -j$(nproc)</code> do?',
                    options: [
                        'Installs with the maximum number of jobs',
                        'Compiles using all available CPU cores in parallel, significantly speeding up the build',
                        'Runs make jobs in quiet mode suppressing all output',
                        'Runs make and stores the number of processors in a variable'
                    ],explanation: '<code>$(nproc)</code> is command substitution that returns the number of available processor cores. <code>make -j4</code> on a 4-core machine compiles 4 source files simultaneously. On a large project with hundreds of files, parallel compilation can reduce build time from minutes to seconds. The <code>-j</code> flag enables parallel jobs. Using more jobs than cores provides diminishing returns due to I/O and dependency constraints.'
                },
                {
                    question: 'Which make target removes compiled object files and binaries, reverting the source directory to a clean state (keeping the Makefile)?',
                    options: [
                        'make clean',
                        'make distclean',
                        'make uninstall',
                        'make purge'
                    ],explanation: '<code>make clean</code> removes compiled object files (.o) and binaries, but keeps the Makefile and configuration. This is used to force a full recompile. <code>make distclean</code> goes further — it removes everything including the Makefile itself (full reset to pre-configure state). <code>make uninstall</code> removes installed files from system paths (if the Makefile supports it). There is no standard <code>make purge</code> target.'
                },
                {
                    question: 'What does <code>pkg-config --cflags --libs openssl</code> return, and how is it used?',
                    options: [
                        'Returns the OpenSSL version number for version checking',
                        'Returns the correct compiler flags and library paths for OpenSSL, used in gcc commands to link libraries correctly',
                        'Installs OpenSSL development headers automatically',
                        'Checks if OpenSSL is vulnerable to known CVEs'
                    ],explanation: '<code>pkg-config</code> reads .pc files from installed libraries and outputs the correct include paths (<code>--cflags</code>) and link flags (<code>--libs</code>). Example usage: <code>gcc myapp.c $(pkg-config --cflags --libs openssl) -o myapp</code>. This eliminates manual tracking of where libraries are installed and handles version-specific paths. Much better than hardcoding <code>-I/usr/include/openssl -lssl -lcrypto</code>.'
                },
                {
                    question: 'After installing a new shared library to /usr/local/lib, which command must you run to update the linker cache?',
                    options: [
                        'updatedb',
                        'ldconfig /usr/local/lib',
                        'sudo ldconfig',
                        'hash -r'
                    ],explanation: '<code>sudo ldconfig</code> scans directories listed in /etc/ld.so.conf (and /etc/ld.so.conf.d/*.conf) for shared libraries and rebuilds the dynamic linker cache (/etc/ld.so.cache). Without this, programs can\'t find newly installed .so files even if they\'re in a known directory. If /usr/local/lib isn\'t in ld.so.conf, add it: <code>echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/local.conf</code> then run <code>sudo ldconfig</code>.'
                },
                {
                    question: 'What is the primary advantage of using <code>checkinstall</code> instead of <code>sudo make install</code>?',
                    options: [
                        'checkinstall compiles faster than make install',
                        'checkinstall creates a .deb/.rpm package that can be cleanly removed by the package manager later',
                        'checkinstall automatically resolves and downloads all dependencies',
                        'checkinstall creates a sandboxed installation that doesn\'t touch system directories'
                    ],explanation: '<code>checkinstall</code> intercepts make install, records all files it places on the system, and packages them into a .deb (on Debian/Ubuntu) or .rpm (on RHEL). This means the software can later be cleanly removed with <code>sudo apt remove packagename</code>. Without checkinstall, <code>make install</code> scatters files across /usr/local/ with no record, making removal difficult and error-prone.'
                },
                {
                    question: 'Which command shows the shared library dependencies of a compiled binary?',
                    options: [
                        'pkg-config --libs myapp',
                        'ldd myapp',
                        'gcc -deps myapp',
                        'ldconfig -v myapp'
                    ],explanation: '<code>ldd myapp</code> (List Dynamic Dependencies) shows all shared libraries that a binary links against and whether they are found on the system. Output shows each library name and its path (or "not found" if missing). This is essential for diagnosing "error while loading shared libraries" errors and for understanding what a binary needs before deploying to another system.'
                },
                {
                    question: 'Which configure option changes the installation prefix so the program installs to <code>/opt/myapp/</code> instead of <code>/usr/local/</code>?',
                    options: [
                        './configure --install=/opt/myapp',
                        './configure --prefix=/opt/myapp',
                        './configure --dir=/opt/myapp',
                        './configure --target=/opt/myapp'
                    ],explanation: 'The <code>--prefix</code> option sets the installation root. <code>./configure --prefix=/opt/myapp</code> installs binaries to <code>/opt/myapp/bin/</code>, libraries to <code>/opt/myapp/lib/</code>, and headers to <code>/opt/myapp/include/</code>. The default prefix is <code>/usr/local</code>. Using a custom prefix isolates the software and makes removal easy (just delete the directory). After installing, add <code>/opt/myapp/bin</code> to your PATH.'
                }
            ]
        });
        quiz.start();
    </script>
