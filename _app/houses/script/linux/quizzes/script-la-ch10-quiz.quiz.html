    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Ch 10 Quiz: Compression',
            description: '10 questions on tar, gzip, bzip2, xz, zip, compression ratios, and archiving concepts',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-la-ch10-quiz',
            moduleId: 'la-ch10-quiz',
            serverGrading: true,
            houseId: 'script',
            trackProgress: true,
            nextModule: {
                title: 'Ch 11: Linux Encryption',
                href: '../presentations/script-la-ch11-encryption.presentation.html'
            },

            questions: [
                {
                    question: 'What is the key difference between <strong>archiving</strong> and <strong>compression</strong> in Linux?',
                    options: [
                        'Archiving reduces file size; compression bundles files together',
                        'Archiving bundles multiple files into one (preserving metadata); compression reduces file size through encoding',
                        'They are identical operations — all Linux tools do both simultaneously',
                        'Archiving encrypts files; compression bundles them'
                    ],explanation: 'Archiving (tar) bundles files and directories into a single file, preserving permissions, ownership, timestamps, and symlinks. It does NOT reduce size by itself. Compression (gzip, bzip2, xz) reduces file size through encoding algorithms. In practice they are combined: <code>tar czf</code> archives AND compresses in one step, but understanding they are distinct concepts is important.'
                },
                {
                    question: 'Which <code>tar</code> flag creates a new gzip-compressed archive verbosely?',
                    options: [
                        'tar xvzf',
                        'tar cvzf',
                        'tar tvzf',
                        'tar cjf'
                    ],explanation: '<strong>c</strong>=create, <strong>v</strong>=verbose, <strong>z</strong>=gzip compression, <strong>f</strong>=filename. So <code>tar cvzf archive.tar.gz folder/</code> creates a verbose gzip archive. <code>x</code>=extract, <code>t</code>=list, <code>j</code>=bzip2, <code>J</code>=xz. The <strong>f</strong> flag must immediately precede the archive filename.'
                },
                {
                    question: 'Which tar flag is used to list the contents of an archive without extracting it?',
                    options: [
                        'tar xf archive.tar.gz --list',
                        'tar tf archive.tar.gz',
                        'tar lf archive.tar.gz',
                        'tar vf archive.tar.gz'
                    ],explanation: 'The <strong>t</strong> flag (table of contents) lists files in the archive without extracting. <code>tar tf archive.tar.gz</code> shows all files. <code>tar tvf</code> adds verbose output including permissions, size, and timestamps. This is essential before extracting to verify archive contents and avoid path traversal issues.'
                },
                {
                    question: 'Which compression tool typically achieves the best compression ratio, at the cost of speed?',
                    options: [
                        'gzip',
                        'bzip2',
                        'xz',
                        'zip'
                    ],explanation: '<strong>xz</strong> uses the LZMA2 algorithm and achieves the best compression ratios of the common Linux tools, but is the slowest and most RAM-intensive. Order by compression ratio: xz > bzip2 > gzip ≈ zip. Order by speed: gzip > zip > bzip2 > xz. For maximum compression (kernel source, large distributions), xz is preferred. For speed and compatibility, gzip is the standard choice.'
                },
                {
                    question: 'What is the correct command to extract a <code>.tar.gz</code> archive to the <code>/opt/</code> directory?',
                    options: [
                        'tar xzf archive.tar.gz --output /opt/',
                        'tar xzf archive.tar.gz -C /opt/',
                        'tar xzf archive.tar.gz /opt/',
                        'tar xzf archive.tar.gz > /opt/'
                    ],explanation: 'The <code>-C</code> flag (Change directory) tells tar to extract contents into the specified directory. Syntax: <code>tar xzf archive.tar.gz -C /opt/</code>. The target directory must exist before running the command. Without <code>-C</code>, tar extracts to the current working directory. This is essential for placing extracted files in the correct location.'
                },
                {
                    question: 'What happens to the original file when you run <code>gzip file.txt</code>?',
                    options: [
                        'The original is kept and a .gz copy is created alongside it',
                        'The original is replaced by file.txt.gz — use -k to keep the original',
                        'The original is moved to /tmp/file.txt as a backup',
                        'Both the original and .gz file are kept by default'
                    ],explanation: 'By default, <code>gzip file.txt</code> replaces the original file with <code>file.txt.gz</code>. The original is deleted. To keep the original, use <code>gzip -k file.txt</code> (-k = keep). The same behavior applies to bzip2 and xz. This surprises many beginners. Use <code>-k</code> whenever you want to preserve the uncompressed original.'
                },
                {
                    question: 'Which tar flag uses bzip2 compression (creating a .tar.bz2 file)?',
                    options: [
                        'z',
                        'j',
                        'J',
                        'b'
                    ],explanation: 'tar compression flags: <strong>z</strong>=gzip (.tar.gz), <strong>j</strong>=bzip2 (.tar.bz2), <strong>J</strong>=xz (.tar.xz). There is no <code>b</code> flag for bzip2 in tar. Memory aid: z=zip(gzip), j=bzip2, J(capital)=xz. Modern tar can also auto-detect the compression type when extracting if you omit the compression flag and just use <code>tar xf</code>.'
                },
                {
                    question: 'You want to create a zip archive of a directory named <code>project/</code> recursively. Which command is correct?',
                    options: [
                        'zip project.zip project/',
                        'zip -r project.zip project/',
                        'zip -d project.zip project/',
                        'zip --all project.zip project/'
                    ],explanation: 'The <code>-r</code> flag tells zip to recurse into directories. Without <code>-r</code>, zip only processes files listed explicitly and skips directory contents. <code>-d</code> deletes files from an existing zip archive. <code>zip -r project.zip project/</code> creates a zip file containing the directory and all its contents recursively.'
                },
                {
                    question: 'All standard Linux compression tools (gzip, bzip2, xz) use what type of compression?',
                    options: [
                        'Lossy compression — some data is permanently removed to reduce size',
                        'Lossless compression — the original data is perfectly reconstructed on decompression',
                        'Destructive compression — compression level determines data loss',
                        'Selective compression — only certain file types compress losslessly'
                    ],explanation: 'All standard Linux file compression tools are <strong>lossless</strong> — when you decompress a file, you get an exact bit-for-bit copy of the original. This is critical for code, archives, databases, and system files where any data loss would cause corruption. Lossy compression (JPEG for images, MP3 for audio) sacrifices some quality for smaller sizes and is unsuitable for data files.'
                },
                {
                    question: 'You want to create a dated backup of /var/www in a single command. Which approach is correct?',
                    options: [
                        'cp -r /var/www /backup/www-backup',
                        'tar czf /backup/www-$(date +%Y%m%d).tar.gz /var/www/',
                        'gzip -r /var/www > /backup/www.gz',
                        'zip /backup/www.zip /var/www/'
                    ],explanation: '<code>tar czf /backup/www-$(date +%Y%m%d).tar.gz /var/www/</code> creates a gzip-compressed archive with today\'s date in the filename (e.g., www-20260221.tar.gz). The <code>$(date +%Y%m%d)</code> is command substitution that inserts the current date. <code>gzip -r</code> doesn\'t create a single archive. <code>cp -r</code> doesn\'t compress. The zip option would work but doesn\'t preserve Unix permissions as well as tar.'
                }
            ]
        });
        quiz.start();
    </script>
