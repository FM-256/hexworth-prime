        <a href="../index.html">&larr; Back to Linux Admin Course</a>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CH02 Quiz: Linux Distributions — Script House',
            description: '10 questions on distro families, package managers, and choosing the right Linux for each use case',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-la-ch02-quiz',
            moduleId: 'la-ch02-quiz',
            serverGrading: true,
            houseId: 'script',
            trackProgress: true,
            nextModule: {
                title: 'Ch 3: Grep, Pipes & Text Processing',
                href: 'linux/presentations/script-la-ch03-grep-pipes.presentation.html'
            },

            questions: [
                {
                    question: 'Which Linux distribution is developed by Offensive Security and comes pre-loaded with over 600 security and penetration testing tools?',
                    options: [
                        'Ubuntu Server',
                        'Kali Linux',
                        'Fedora Workstation',
                        'Arch Linux'
                    ],explanation: 'Kali Linux, developed by Offensive Security, is the standard platform for penetration testing and ethical hacking. It includes Metasploit, nmap, Wireshark, Burp Suite, and hundreds more tools pre-installed.'
                },
                {
                    question: 'Ubuntu is based on which parent distribution?',
                    options: [
                        'Fedora',
                        'Arch Linux',
                        'Debian',
                        'Red Hat Enterprise Linux'
                    ],explanation: 'Ubuntu is based on Debian. It uses Debian\'s APT package manager and .deb package format. Mark Shuttleworth created Ubuntu in 2004 to make Debian more user-friendly.'
                },
                {
                    question: 'What package manager is used by Ubuntu and Debian?',
                    options: [
                        'dnf',
                        'pacman',
                        'apt',
                        'yum'
                    ],explanation: 'APT (Advanced Package Tool) is the package manager for Debian-based distributions including Ubuntu, Mint, and Kali. Key commands: apt update, apt install, apt upgrade, apt remove.'
                },
                {
                    question: 'Which distribution is best described as a "rolling release" that requires manual setup and targets advanced users who want full control?',
                    options: [
                        'Ubuntu LTS',
                        'Debian Stable',
                        'Arch Linux',
                        'CentOS'
                    ],explanation: 'Arch Linux is a rolling release (constantly updated, no versioned releases) with a minimal base that you build upon. It requires manual installation and configuration — rewarding for experienced users who want complete control.'
                },
                {
                    question: 'Rocky Linux was created as a community replacement for which discontinued distribution?',
                    options: [
                        'Fedora',
                        'CentOS',
                        'Debian',
                        'openSUSE'
                    ],explanation: 'CentOS was discontinued as a RHEL-stable clone (it became CentOS Stream, an upstream rolling release). Rocky Linux and AlmaLinux were created by the community to fill the gap as free, RHEL-compatible distributions.'
                },
                {
                    question: 'Which command with DNF would install the "nginx" web server on a Fedora or Rocky Linux system?',
                    options: [
                        'apt install nginx',
                        'pacman -S nginx',
                        'dnf install nginx',
                        'yum get nginx'
                    ],explanation: 'DNF (Dandified YUM) is the package manager for Fedora, RHEL, Rocky Linux, and AlmaLinux. The install command is: sudo dnf install nginx'
                },
                {
                    question: 'For a new student learning Linux who is coming from a Windows background, which distribution is most commonly recommended?',
                    options: [
                        'Arch Linux',
                        'Kali Linux',
                        'Ubuntu or Linux Mint',
                        'Gentoo'
                    ],explanation: 'Ubuntu and Linux Mint provide the most beginner-friendly experience with large communities, extensive documentation, familiar desktop interfaces, and excellent hardware support. Kali and Arch require significant Linux experience.'
                },
                {
                    question: 'What does "LTS" mean in "Ubuntu 22.04 LTS"?',
                    options: [
                        'Linux Terminal System',
                        'Long Term Support',
                        'Latest Technology Stack',
                        'Linux Technology Standard'
                    ],explanation: 'LTS stands for Long Term Support. Ubuntu LTS releases receive security patches and updates for 5 years (standard releases get only 9 months). LTS versions are recommended for production servers and stable desktop deployments.'
                },
                {
                    question: 'Which Linux distribution is developed by Red Hat specifically to feature cutting-edge technology and serve as an upstream testing ground for Red Hat Enterprise Linux?',
                    options: [
                        'CentOS',
                        'Rocky Linux',
                        'Fedora',
                        'openSUSE'
                    ],explanation: 'Fedora is Red Hat\'s community project where new technology (Wayland, systemd, new kernel features) is tested before being included in RHEL. It releases every 6 months and is popular with developers.'
                },
                {
                    question: 'Raspberry Pi OS (formerly Raspbian) is optimized for which type of deployment?',
                    options: [
                        'Enterprise servers',
                        'Gaming PCs',
                        'Embedded systems and IoT devices on Raspberry Pi hardware',
                        'Cloud virtual machines'
                    ],explanation: 'Raspberry Pi OS is specifically designed for the Raspberry Pi ARM-based single-board computer. It is lightweight, includes educational tools, and is used for IoT projects, robotics, home automation, and learning computing.'
                }
            ]
        });
        quiz.start();
    </script>
