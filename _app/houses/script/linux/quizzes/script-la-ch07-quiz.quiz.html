<body>

    <script src="../../../../components/ProgressSystem.js"></script>
    <script src="../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'Ch 7 Quiz: Display Managers',
            description: '10 questions on GDM, LightDM, SDDM, graphical sessions, .Xsession, and user environment',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-la-ch07-quiz',
            moduleId: 'la-ch07-quiz',
            serverGrading: true,
            houseId: 'script',
            trackProgress: true,
            nextModule: {
                title: 'Ch 8: Network Interface Configuration',
                href: '../presentations/script-la-ch08-network.presentation.html'
            },

            questions: [
                {
                    question: 'Which systemd command shows the currently active display manager service?',
                    options: [
                        'systemctl status dm',
                        'systemctl status display-manager',
                        'service display-manager check',
                        'systemctl list-units --type=dm'
                    ],explanation: '<code>systemctl status display-manager</code> uses the generic <strong>display-manager</strong> service alias, which symlinks to whichever DM is currently configured (gdm, lightdm, sddm, etc.). This is a convenient alias that works regardless of which DM is installed.'
                },
                {
                    question: 'GDM is the default display manager for which desktop environment?',
                    options: [
                        'KDE Plasma',
                        'Xfce',
                        'GNOME',
                        'LXDE'
                    ],explanation: 'GDM (GNOME Display Manager) is the default DM for GNOME-based distributions including Ubuntu (with GNOME), Fedora Workstation, and RHEL. SDDM is the default for KDE Plasma. LightDM is often used on Xfce and MATE. LXDM or LightDM is used on LXDE.'
                },
                {
                    question: 'What environment variable indicates whether the current session uses X11 or Wayland?',
                    options: [
                        '$DISPLAY',
                        '$SESSION_TYPE',
                        '$XDG_SESSION_TYPE',
                        '$DESKTOP_SESSION'
                    ],explanation: '<code>$XDG_SESSION_TYPE</code> will output either <strong>x11</strong> or <strong>wayland</strong> depending on the session type. <code>$DISPLAY</code> (e.g., :0) identifies the X display number and only exists in X11 sessions. <code>$DESKTOP_SESSION</code> identifies the desktop environment (gnome, plasma, xfce), not the protocol.'
                },
                {
                    question: 'On a Debian/Ubuntu system, which command reconfigures which display manager is used at boot?',
                    options: [
                        'systemctl set-default gdm',
                        'sudo dpkg-reconfigure gdm3',
                        'update-rc.d gdm defaults',
                        'sudo apt install --reinstall gdm3'
                    ],explanation: '<code>sudo dpkg-reconfigure gdm3</code> (or <code>dpkg-reconfigure lightdm</code>) triggers the Debian package configuration dialog that asks which display manager should be the default. This updates <code>/etc/X11/default-display-manager</code> and sets up the appropriate systemd symlinks.'
                },
                {
                    question: 'A user\'s login succeeds but they immediately return to the login screen (login loop). Where should an admin look first?',
                    options: [
                        '/etc/gdm3/custom.conf',
                        '/var/log/auth.log',
                        '~/.xsession-errors',
                        '/etc/X11/xorg.conf'
                    ],explanation: '<code>~/.xsession-errors</code> captures stderr from the user\'s session startup — errors in .bashrc, .profile, missing window manager binaries, or corrupted .xsession files all appear here. A login loop most commonly results from a user-space error during session initialization, making this the first diagnostic file to check.'
                },
                {
                    question: 'Which file can a user create in their home directory to override the default desktop environment launched by the display manager?',
                    options: [
                        '~/.bashrc',
                        '~/.xinitrc (only used with startx, not DMs)',
                        '~/.xsession',
                        '~/.Xdefaults'
                    ],explanation: '<code>~/.xsession</code> is executed by the display manager when a user logs in (for X11 sessions). It can contain commands like <code>exec openbox-session</code> to launch an alternative window manager. <code>~/.xinitrc</code> serves a similar purpose but is used by the <code>startx</code> command, not display managers. <code>~/.Xdefaults</code> sets X resource preferences (fonts, colors) but does not control which WM runs.'
                },
                {
                    question: 'SDDM is the default display manager for which desktop environment?',
                    options: [
                        'GNOME',
                        'Xfce',
                        'MATE',
                        'KDE Plasma'
                    ],explanation: 'SDDM (Simple Desktop Display Manager) is the default DM for KDE Plasma. It is written in QML/Qt, integrating naturally with KDE\'s Qt-based design language. It replaced the older KDM display manager and supports both X11 and Wayland sessions.'
                },
                {
                    question: 'How do you switch the system to text-mode (no graphical login) on a systemd-based system?',
                    options: [
                        'systemctl disable gdm',
                        'sudo systemctl set-default multi-user.target',
                        'init 3',
                        'telinit 2'
                    ],explanation: '<code>sudo systemctl set-default multi-user.target</code> configures the system to boot to runlevel 3 equivalent (multi-user, non-graphical) on next boot. <code>graphical.target</code> is the equivalent of runlevel 5 (with GUI). While <code>init 3</code> and <code>telinit 2</code> work on SysV init systems, <code>systemctl set-default</code> is the modern systemd approach. Disabling the DM service alone does not change the default target.'
                },
                {
                    question: 'Which command sets the system-wide locale to US English UTF-8?',
                    options: [
                        'locale set en_US.UTF-8',
                        'export LANG=en_US.UTF-8',
                        'sudo localectl set-locale LANG=en_US.UTF-8',
                        'sudo timedatectl set-locale en_US'
                    ],explanation: '<code>localectl set-locale</code> makes a persistent, system-wide locale change. It writes to <code>/etc/locale.conf</code> (or the equivalent) and takes effect on the next login. <code>export LANG=en_US.UTF-8</code> only sets the locale for the current shell session — it is not persistent. <code>timedatectl</code> manages time zones and NTP, not locale settings.'
                },
                {
                    question: 'What is the primary advantage of Wayland over X11 from a security perspective?',
                    options: [
                        'Wayland encrypts all graphical communication with TLS',
                        'Wayland isolates applications — they cannot spy on input events or screen contents of other applications',
                        'Wayland requires root privileges to run, preventing malware from accessing the display',
                        'Wayland uses hardware-level memory protection not available in X11'
                    ],explanation: 'In X11, any application can read keystrokes and screen contents from any other application in the same session — this is a fundamental design flaw exploited by keyloggers and screen-scrapers. Wayland\'s architecture isolates applications by design: each app only receives input events and display access that it is explicitly granted. This is the most significant security improvement Wayland provides over X11.'
                }
            ]
        });
        quiz.start();
    </script>
