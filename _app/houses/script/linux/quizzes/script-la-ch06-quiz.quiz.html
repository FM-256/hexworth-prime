    <script src="../../../../components/ProgressSystem.js"></script>

    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CH06 Quiz: Initialization & X Windows — Script House',
            description: '10 questions on the boot process, GRUB, systemd targets, X11, Wayland, display managers, and localization',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-la-ch06-quiz',
            moduleId: 'la-ch06-quiz',
            houseId: 'script',
            trackProgress: true,

            questions: [
                {
                    question: 'What is the correct order of the Linux boot process?',
                    options: [
                        'Kernel → GRUB → BIOS → systemd → Login',
                        'BIOS/UEFI → GRUB → Kernel → systemd → Login',
                        'systemd → BIOS → Kernel → GRUB → Login',
                        'GRUB → BIOS → systemd → Kernel → Login'
                    ],
                    correct: 1,
                    explanation: 'The boot sequence: BIOS/UEFI initializes hardware → GRUB loads the kernel → Kernel initializes drivers and mounts filesystem → systemd (PID 1) starts services → User login prompt appears.'
                },
                {
                    question: 'What is GRUB and what role does it play in the boot process?',
                    options: [
                        'A hardware diagnostic tool that tests RAM at boot',
                        'A bootloader that loads the Linux kernel into memory',
                        'The first process started by the Linux kernel',
                        'A tool for managing systemd unit files'
                    ],
                    correct: 1,
                    explanation: 'GRUB (Grand Unified Bootloader) is the bootloader — it sits between BIOS/UEFI and the kernel. It displays a menu for kernel selection, loads the chosen kernel image and initramfs, and hands control to the kernel.'
                },
                {
                    question: 'Which systemd target is the standard target for a headless Linux server (no graphical interface)?',
                    options: [
                        'graphical.target',
                        'rescue.target',
                        'multi-user.target',
                        'poweroff.target'
                    ],
                    correct: 2,
                    explanation: 'multi-user.target (equivalent to SysV runlevel 3) is the standard server target — full multi-user support with networking but no graphical desktop. graphical.target adds the desktop environment on top.'
                },
                {
                    question: 'What does PID 1 represent in Linux, and which program occupies it on modern systems?',
                    options: [
                        'The first user process; always a shell',
                        'The kernel itself; no user program can be PID 1',
                        'The first userspace process; systemd on modern distros',
                        'The login manager; always GDM or LightDM'
                    ],
                    correct: 2,
                    explanation: 'PID 1 is the first userspace process started by the kernel. On modern Linux systems, this is systemd. All other processes are descendants of PID 1. It cannot be killed — killing PID 1 triggers a kernel panic.'
                },
                {
                    question: 'In the X Window System, what is the role of the X Server?',
                    options: [
                        'It provides web services to X client browsers',
                        'It manages the physical display hardware and processes input events',
                        'It is the application program that draws windows on screen',
                        'It handles user authentication for graphical logins'
                    ],
                    correct: 1,
                    explanation: 'The X Server manages the physical display (rendering pixels) and input devices (keyboard, mouse). X Clients are the applications — they request the X Server to draw their windows. This is a counterintuitive naming: the "server" is local hardware.'
                },
                {
                    question: 'What is Wayland\'s primary advantage over X11?',
                    options: [
                        'Wayland supports more legacy applications than X11',
                        'Wayland is faster to install from package managers',
                        'Wayland has better security isolation between applications and a simpler architecture',
                        'Wayland provides built-in network transparency'
                    ],
                    correct: 2,
                    explanation: 'Wayland\'s key improvements over X11: applications cannot spy on each other\'s windows (security isolation), simpler architecture eliminating X11\'s complexity, better performance, and native support for modern GPU compositing.'
                },
                {
                    question: 'Which command checks whether your current Linux session is running X11 or Wayland?',
                    options: [
                        'displayctl status',
                        'echo $XDG_SESSION_TYPE',
                        'systemctl get-session',
                        'xorg --version'
                    ],
                    correct: 1,
                    explanation: 'The $XDG_SESSION_TYPE environment variable contains "x11" or "wayland" depending on your current session. This is the standard cross-desktop way to detect the display protocol in use.'
                },
                {
                    question: 'GDM is the default display manager for which desktop environment?',
                    options: [
                        'KDE Plasma',
                        'Xfce',
                        'LXDE',
                        'GNOME'
                    ],
                    correct: 3,
                    explanation: 'GDM (GNOME Display Manager) is the default display manager for GNOME desktop environments, used by Ubuntu, Fedora, and other GNOME-based distros. SDDM is KDE\'s default, LightDM is common for Xfce and MATE.'
                },
                {
                    question: 'What does <code>sudo timedatectl set-timezone UTC</code> accomplish?',
                    options: [
                        'Sets the hardware clock only, not the system clock',
                        'Changes the system timezone to UTC (Coordinated Universal Time)',
                        'Enables NTP time synchronization',
                        'Changes the display format for the date command only'
                    ],
                    correct: 1,
                    explanation: 'timedatectl set-timezone changes the system timezone. UTC is the recommended timezone for production servers — log timestamps across globally distributed systems are directly comparable without conversion.'
                },
                {
                    question: 'What is the purpose of the <code>localectl set-locale LANG=en_US.UTF-8</code> command?',
                    options: [
                        'Changes keyboard layout to US English',
                        'Sets the system-wide language and character encoding to US English with UTF-8',
                        'Updates the system\'s IP address to a US server',
                        'Changes the timezone to US Eastern Time'
                    ],
                    correct: 1,
                    explanation: 'localectl set-locale configures the system locale — the LANG variable controls the default language for system messages, date/time formats, and character encoding. UTF-8 is the standard character encoding supporting all Unicode characters.'
                }
            ]
        });
        quiz.start();
    </script>
