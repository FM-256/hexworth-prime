<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shell Sprint - Script House Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      font-family: 'Courier New', monospace;
      color: #00ff41;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .back-link {
      cursor: pointer;
      color: #7c3aed;
      text-decoration: none;
      font-size: 18px;
      margin-bottom: 10px;
      display: inline-block;
      transition: color 0.3s;
    }

    .back-link:hover {
      color: #9f67ff;
    }

    h1 {
      font-size: 32px;
      text-shadow: 0 0 10px #00ff41;
      margin: 10px 0;
      letter-spacing: 2px;
    }

    .game-container {
      position: relative;
      max-width: 900px;
      width: 100%;
      border: 3px solid #00ff41;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      pointer-events: none;
      z-index: 10;
    }

    .score-display {
      font-size: 24px;
      text-shadow: 0 0 5px #00ff41;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #7c3aed;
    }

    .game-over-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.95);
      border: 3px solid #ff0000;
      padding: 40px;
      text-align: center;
      display: none;
      z-index: 100;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
    }

    .game-over-screen h2 {
      color: #ff0000;
      font-size: 36px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #ff0000;
    }

    .game-over-screen p {
      font-size: 18px;
      margin: 10px 0;
    }

    .restart-btn {
      background: #7c3aed;
      color: #fff;
      border: 2px solid #00ff41;
      padding: 12px 30px;
      font-size: 18px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s;
      pointer-events: all;
    }

    .restart-btn:hover {
      background: #9f67ff;
      box-shadow: 0 0 15px #7c3aed;
      transform: scale(1.05);
    }

    .mute-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #1a1a1a;
      border: 2px solid #7c3aed;
      color: #7c3aed;
      padding: 8px 15px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      font-size: 14px;
      z-index: 20;
      pointer-events: all;
      transition: all 0.3s;
    }

    .mute-btn:hover {
      background: #7c3aed;
      color: #fff;
    }

    .powerup-indicator {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(124, 58, 237, 0.8);
      padding: 10px 20px;
      border: 2px solid #00ff41;
      border-radius: 5px;
      font-size: 16px;
      display: none;
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      from { transform: translateX(-50%) scale(1); }
      to { transform: translateX(-50%) scale(1.05); }
    }

    @media (max-width: 768px) {
      h1 { font-size: 24px; }
      .score-display { font-size: 18px; }
      .controls { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a class="back-link" onclick="history.back()">← Back to Script House</a>
    <h1>SHELL SPRINT</h1>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas" width="900" height="400"></canvas>

    <div class="ui-overlay">
      <div class="score-display">
        <span>CMDS: <span id="score">0</span></span>
        <span>HIGH: <span id="highScore">0</span></span>
      </div>
    </div>

    <button class="mute-btn" id="muteBtn">🔊 SOUND</button>

    <div class="powerup-indicator" id="powerupIndicator">SUDO ACTIVE</div>

    <div class="game-over-screen" id="gameOverScreen">
      <h2>KERNEL PANIC!</h2>
      <p>Commands Executed: <span id="finalScore">0</span></p>
      <p id="highScoreMsg"></p>
      <p id="xpMessage" style="color: #7c3aed; font-weight: bold;"></p>
      <button class="restart-btn" id="restartBtn">REBOOT SYSTEM</button>
    </div>
  </div>

  <div class="controls">
    SPACE/UP: Jump | DOWN: Duck | Double Jump unlocks at 300 CMDS
  </div>

  <script>
    // ==================== AUDIO ENGINE ====================
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.muted = false;
        this.musicPlaying = false;
        this.init();
      }

      init() {
        try {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          this.masterGain = this.ctx.createGain();
          this.masterGain.connect(this.ctx.destination);
          this.masterGain.gain.value = 0.3;
        } catch (e) {
          console.warn('Web Audio API not supported');
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        if (this.masterGain) {
          this.masterGain.gain.value = this.muted ? 0 : 0.3;
        }
        return this.muted;
      }

      // Jump sound - classic platformer jump
      playJump() {
        if (!this.ctx || this.muted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.1);

        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }

      // Duck sound - slide noise
      playDuck() {
        if (!this.ctx || this.muted) return;
        const noise = this.ctx.createBufferSource();
        const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.1, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);

        noise.start();
        noise.stop(this.ctx.currentTime + 0.1);
      }

      // Hit sound - error beep
      playHit() {
        if (!this.ctx || this.muted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }

      // Score milestone - fanfare
      playMilestone() {
        if (!this.ctx || this.muted) return;
        const notes = [262, 330, 392, 523]; // C, E, G, C
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'square';
          osc.frequency.value = freq;

          const startTime = this.ctx.currentTime + i * 0.1;
          gain.gain.setValueAtTime(0.2, startTime);
          gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);

          osc.connect(gain);
          gain.connect(this.masterGain);

          osc.start(startTime);
          osc.stop(startTime + 0.2);
        });
      }

      // Powerup sound - ascending sweep
      playPowerup() {
        if (!this.ctx || this.muted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }

      // Game over - kernel panic
      playGameOver() {
        if (!this.ctx || this.muted) return;
        this.stopMusic();

        for (let i = 0; i < 8; i++) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'square';
          const startFreq = 400 - i * 30;
          osc.frequency.setValueAtTime(startFreq, this.ctx.currentTime + i * 0.05);
          osc.frequency.exponentialRampToValueAtTime(startFreq * 0.5, this.ctx.currentTime + i * 0.05 + 0.2);

          gain.gain.setValueAtTime(0.15, this.ctx.currentTime + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.05 + 0.2);

          osc.connect(gain);
          gain.connect(this.masterGain);

          osc.start(this.ctx.currentTime + i * 0.05);
          osc.stop(this.ctx.currentTime + i * 0.05 + 0.2);
        }
      }

      // Background music - 8-bit chiptune loop
      startMusic() {
        if (!this.ctx || this.muted || this.musicPlaying) return;
        this.musicPlaying = true;
        this.playMusicLoop();
      }

      playMusicLoop() {
        if (!this.musicPlaying || this.muted) return;

        // Melody notes (in Hz) - upbeat hacker theme
        const melody = [
          {note: 523, duration: 0.2}, // C5
          {note: 587, duration: 0.2}, // D5
          {note: 659, duration: 0.2}, // E5
          {note: 698, duration: 0.2}, // F5
          {note: 784, duration: 0.4}, // G5
          {note: 659, duration: 0.2}, // E5
          {note: 784, duration: 0.4}, // G5
          {note: 880, duration: 0.6}, // A5
        ];

        const bassline = [262, 196, 220, 196]; // C3, G3, A3, G3

        let time = this.ctx.currentTime;

        // Play melody
        melody.forEach((note, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'square';
          osc.frequency.value = note.note;

          gain.gain.setValueAtTime(0.08, time);
          gain.gain.exponentialRampToValueAtTime(0.01, time + note.duration);

          osc.connect(gain);
          gain.connect(this.masterGain);

          osc.start(time);
          osc.stop(time + note.duration);

          time += note.duration;
        });

        // Play bassline
        let bassTime = this.ctx.currentTime;
        bassline.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.value = freq;

          gain.gain.setValueAtTime(0.1, bassTime);
          gain.gain.exponentialRampToValueAtTime(0.01, bassTime + 0.4);

          osc.connect(gain);
          gain.connect(this.masterGain);

          osc.start(bassTime);
          osc.stop(bassTime + 0.4);

          bassTime += 0.5;
        });

        // Loop the music
        setTimeout(() => this.playMusicLoop(), 2400);
      }

      stopMusic() {
        this.musicPlaying = false;
      }
    }

    // ==================== GAME ENGINE ====================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const audio = new AudioEngine();

    // Game state
    let gameRunning = false;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('shellsprint_highscore') || '0');
    let gameSpeed = 5;
    let frameCount = 0;
    let lastMilestone = 0;
    let xpAwarded = false;

    // Update high score display
    document.getElementById('highScore').textContent = highScore;

    // Player state
    const player = {
      x: 100,
      y: 300,
      width: 16,
      height: 16,
      velY: 0,
      jumping: false,
      ducking: false,
      grounded: false,
      jumpCount: 0,
      maxJumps: 1,
      blinkTimer: 0,
      blinkState: true,
      powerup: null,
      powerupTimer: 0
    };

    const GRAVITY = 0.6;
    const JUMP_STRENGTH = -12;
    const GROUND_Y = 300;

    // Obstacles array
    let obstacles = [];
    let particles = [];
    let backgroundElements = [];

    // Obstacle types
    const ObstacleType = {
      PERMISSION_DENIED: {
        name: 'Permission Denied',
        color: '#ff0000',
        width: 24,
        height: 32,
        canJump: true,
        canDuck: false,
        text: '🔒'
      },
      SEGFAULT: {
        name: 'Segfault',
        color: '#ff6600',
        width: 40,
        height: 20,
        canJump: false,
        canDuck: true,
        text: 'SEGV'
      },
      FORK_BOMB: {
        name: 'Fork Bomb',
        color: '#ffff00',
        width: 16,
        height: 16,
        canJump: true,
        canDuck: false,
        text: ':('
      },
      KERNEL_PANIC: {
        name: 'Kernel Panic',
        color: '#ff0066',
        width: 30,
        height: 50,
        canJump: true,
        canDuck: false,
        text: '!!!'
      },
      ZOMBIE: {
        name: 'Zombie Process',
        color: '#888888',
        width: 20,
        height: 28,
        canJump: true,
        canDuck: false,
        text: 'Z'
      }
    };

    const PowerupType = {
      SUDO: {
        name: 'sudo',
        color: '#ffd700',
        duration: 300, // frames (5 seconds at 60fps)
        effect: 'invincible'
      },
      CHMOD: {
        name: 'chmod 777',
        color: '#00ffff',
        duration: 240,
        effect: 'phase'
      },
      KILL: {
        name: 'kill -9',
        color: '#ff00ff',
        duration: 1,
        effect: 'clear'
      }
    };

    // Initialize background elements
    function initBackground() {
      for (let i = 0; i < 20; i++) {
        backgroundElements.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height * 0.7,
          text: ['ls', 'cd', 'mkdir', 'rm', 'grep', 'cat', 'vim'][Math.floor(Math.random() * 7)],
          speed: Math.random() * 0.5 + 0.2,
          opacity: Math.random() * 0.3 + 0.1
        });
      }
    }

    // Draw functions
    function drawPlayer() {
      // Blink effect
      player.blinkTimer++;
      if (player.blinkTimer > 20) {
        player.blinkState = !player.blinkState;
        player.blinkTimer = 0;
      }

      // Determine color based on powerup
      let color = '#00ff41';
      if (player.powerup === 'invincible') color = '#ffd700';
      else if (player.powerup === 'phase') color = '#00ffff';

      if (player.blinkState) {
        ctx.fillStyle = color;
        ctx.fillRect(player.x, player.y, player.width, player.height);

        // Add glow effect
        ctx.shadowBlur = 10;
        ctx.shadowColor = color;
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.shadowBlur = 0;
      }

      // Draw powerup indicator
      if (player.powerup) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.strokeRect(player.x - 3, player.y - 3, player.width + 6, player.height + 6);
      }
    }

    function drawObstacle(obs) {
      const type = obs.type;

      // Draw shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.fillRect(obs.x + 2, obs.y + obs.height + 2, obs.width, 4);

      // Draw obstacle body
      ctx.fillStyle = type.color;
      ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

      // Draw border
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

      // Draw text/symbol
      ctx.fillStyle = '#ffffff';
      ctx.font = '12px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(type.text, obs.x + obs.width / 2, obs.y + obs.height / 2 + 4);
    }

    function drawPowerup(powerup) {
      const type = powerup.type;

      // Pulsing effect
      const pulse = Math.sin(frameCount * 0.1) * 3;

      ctx.fillStyle = type.color;
      ctx.fillRect(powerup.x, powerup.y - pulse, 20, 20);

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeRect(powerup.x, powerup.y - pulse, 20, 20);

      ctx.fillStyle = '#000000';
      ctx.font = 'bold 10px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(type.name.charAt(0).toUpperCase(), powerup.x + 10, powerup.y + 14 - pulse);
    }

    function drawGround() {
      // Command prompt line
      ctx.strokeStyle = '#00ff41';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 10]);
      ctx.lineDashOffset = -frameCount % 20;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y + player.height);
      ctx.lineTo(canvas.width, GROUND_Y + player.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw prompt text
      ctx.fillStyle = '#00ff41';
      ctx.font = '14px Courier New';
      ctx.textAlign = 'left';
      ctx.fillText('user@shell:~$', 10, GROUND_Y + player.height + 25);
    }

    function drawBackground() {
      // Scrolling background text
      ctx.fillStyle = '#00ff41';
      ctx.font = '12px Courier New';
      ctx.textAlign = 'left';

      backgroundElements.forEach(elem => {
        ctx.globalAlpha = elem.opacity;
        ctx.fillText(elem.text, elem.x, elem.y);

        elem.x -= elem.speed * gameSpeed * 0.2;
        if (elem.x < -50) {
          elem.x = canvas.width + 50;
          elem.y = Math.random() * canvas.height * 0.7;
        }
      });

      ctx.globalAlpha = 1;
    }

    function drawParticles() {
      particles.forEach((particle, index) => {
        ctx.fillStyle = particle.color;
        ctx.globalAlpha = particle.life;
        ctx.fillRect(particle.x, particle.y, particle.size, particle.size);

        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.life -= 0.02;

        if (particle.life <= 0) {
          particles.splice(index, 1);
        }
      });
      ctx.globalAlpha = 1;
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          size: Math.random() * 4 + 2,
          color: color,
          life: 1
        });
      }
    }

    // Game logic
    function spawnObstacle() {
      const types = Object.values(ObstacleType);
      let availableTypes = types;

      // Progressive difficulty - introduce obstacles based on score
      if (score < 100) availableTypes = [ObstacleType.PERMISSION_DENIED];
      else if (score < 200) availableTypes = [ObstacleType.PERMISSION_DENIED, ObstacleType.SEGFAULT];
      else if (score < 400) availableTypes = [ObstacleType.PERMISSION_DENIED, ObstacleType.SEGFAULT, ObstacleType.FORK_BOMB];
      else if (score < 600) availableTypes = [ObstacleType.PERMISSION_DENIED, ObstacleType.SEGFAULT, ObstacleType.FORK_BOMB, ObstacleType.ZOMBIE];

      const type = availableTypes[Math.floor(Math.random() * availableTypes.length)];

      obstacles.push({
        x: canvas.width,
        y: type.name === 'Segfault' ? 200 : GROUND_Y,
        width: type.width,
        height: type.height,
        type: type,
        isPowerup: false
      });
    }

    function spawnPowerup() {
      const types = Object.values(PowerupType);
      const type = types[Math.floor(Math.random() * types.length)];

      obstacles.push({
        x: canvas.width,
        y: GROUND_Y - 60,
        width: 20,
        height: 20,
        type: type,
        isPowerup: true
      });
    }

    function updatePlayer() {
      // Apply gravity
      if (!player.grounded) {
        player.velY += GRAVITY;
      }

      player.y += player.velY;

      // Ground collision
      if (player.y >= GROUND_Y) {
        player.y = GROUND_Y;
        player.velY = 0;
        player.grounded = true;
        player.jumping = false;
        player.jumpCount = 0;
      } else {
        player.grounded = false;
      }

      // Update powerup
      if (player.powerup) {
        player.powerupTimer--;
        if (player.powerupTimer <= 0) {
          player.powerup = null;
          document.getElementById('powerupIndicator').style.display = 'none';
        }
      }
    }

    function updateObstacles() {
      // Move and remove off-screen obstacles
      obstacles.forEach((obs, index) => {
        obs.x -= gameSpeed;

        // Score when passing obstacle
        if (obs.x + obs.width < player.x && !obs.scored) {
          obs.scored = true;
          if (!obs.isPowerup) {
            score++;
            document.getElementById('score').textContent = score;

            // Check for milestones
            if (score % 100 === 0 && score !== lastMilestone) {
              audio.playMilestone();
              lastMilestone = score;
            }

            // Increase speed
            if (score % 50 === 0) {
              gameSpeed += 0.5;
            }

            // Unlock double jump
            if (score >= 300) {
              player.maxJumps = 2;
            }

            // Award XP at 500
            if (score >= 500 && !xpAwarded) {
              awardXP();
              xpAwarded = true;
            }
          }
        }

        if (obs.x + obs.width < 0) {
          obstacles.splice(index, 1);
        }
      });

      // Spawn new obstacles
      if (frameCount % 120 === 0) {
        spawnObstacle();
      }

      // Spawn powerups occasionally
      if (frameCount % 300 === 0 && Math.random() > 0.5) {
        spawnPowerup();
      }
    }

    function checkCollisions() {
      obstacles.forEach((obs, index) => {
        if (obs.isPowerup) {
          // Powerup collision
          if (player.x < obs.x + obs.width &&
              player.x + player.width > obs.x &&
              player.y < obs.y + obs.height &&
              player.y + player.height > obs.y) {

            collectPowerup(obs.type);
            createParticles(obs.x + obs.width / 2, obs.y + obs.height / 2, obs.type.color, 15);
            obstacles.splice(index, 1);
          }
        } else {
          // Obstacle collision
          if (player.x < obs.x + obs.width - 4 &&
              player.x + player.width > obs.x + 4 &&
              player.y < obs.y + obs.height - 4 &&
              player.y + player.height > obs.y + 4) {

            // Check if invincible or can phase
            if (player.powerup === 'invincible') {
              createParticles(obs.x + obs.width / 2, obs.y + obs.height / 2, '#ffd700', 20);
              obstacles.splice(index, 1);
            } else if (player.powerup === 'phase' && obs.type.name === 'Permission Denied') {
              // Phase through permission obstacles
              return;
            } else {
              gameOver();
            }
          }
        }
      });
    }

    function collectPowerup(type) {
      audio.playPowerup();

      if (type.effect === 'clear') {
        // Kill all obstacles
        obstacles.forEach(obs => {
          if (!obs.isPowerup) {
            createParticles(obs.x + obs.width / 2, obs.y + obs.height / 2, obs.type.color, 10);
          }
        });
        obstacles = obstacles.filter(obs => obs.isPowerup);
      } else {
        player.powerup = type.effect;
        player.powerupTimer = type.duration;

        const indicator = document.getElementById('powerupIndicator');
        indicator.textContent = type.name.toUpperCase() + ' ACTIVE';
        indicator.style.display = 'block';
      }
    }

    function gameOver() {
      gameRunning = false;
      audio.playGameOver();

      // Update high score
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('shellsprint_highscore', highScore.toString());
        document.getElementById('highScoreMsg').textContent = '🏆 NEW HIGH SCORE! 🏆';
        document.getElementById('highScoreMsg').style.color = '#ffd700';
      } else {
        document.getElementById('highScoreMsg').textContent = '';
      }

      document.getElementById('finalScore').textContent = score;

      if (xpAwarded) {
        document.getElementById('xpMessage').textContent = '✓ +50 XP AWARDED!';
      } else {
        document.getElementById('xpMessage').textContent = '';
      }

      document.getElementById('gameOverScreen').style.display = 'block';
    }

    function resetGame() {
      gameRunning = true;
      score = 0;
      gameSpeed = 5;
      frameCount = 0;
      lastMilestone = 0;
      xpAwarded = false;

      player.y = GROUND_Y;
      player.velY = 0;
      player.jumping = false;
      player.ducking = false;
      player.jumpCount = 0;
      player.maxJumps = 1;
      player.powerup = null;
      player.powerupTimer = 0;

      obstacles = [];
      particles = [];

      document.getElementById('score').textContent = '0';
      document.getElementById('gameOverScreen').style.display = 'none';
      document.getElementById('powerupIndicator').style.display = 'none';

      audio.startMusic();
      gameLoop();
    }

    // Game loop
    function gameLoop() {
      if (!gameRunning) return;

      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawBackground();
      drawGround();
      drawParticles();

      obstacles.forEach(obs => {
        if (obs.isPowerup) {
          drawPowerup(obs);
        } else {
          drawObstacle(obs);
        }
      });

      drawPlayer();

      updatePlayer();
      updateObstacles();
      checkCollisions();

      frameCount++;
      requestAnimationFrame(gameLoop);
    }

    // Controls
    let keys = {};

    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;

      if ((e.code === 'Space' || e.code === 'ArrowUp') && gameRunning) {
        e.preventDefault();
        if (player.jumpCount < player.maxJumps) {
          player.velY = JUMP_STRENGTH;
          player.jumping = true;
          player.jumpCount++;
          audio.playJump();
        }
      }

      if (e.code === 'ArrowDown' && gameRunning && player.grounded) {
        player.ducking = true;
        player.height = 8;
        audio.playDuck();
      }
    });

    document.addEventListener('keyup', (e) => {
      keys[e.code] = false;

      if (e.code === 'ArrowDown') {
        player.ducking = false;
        player.height = 16;
      }
    });

    // Touch controls
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!gameRunning) return;

      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const y = touch.clientY - rect.top;

      if (y < canvas.height / 2) {
        // Top half - jump
        if (player.jumpCount < player.maxJumps) {
          player.velY = JUMP_STRENGTH;
          player.jumping = true;
          player.jumpCount++;
          audio.playJump();
        }
      } else {
        // Bottom half - duck
        if (player.grounded) {
          player.ducking = true;
          player.height = 8;
          audio.playDuck();
        }
      }
    });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      player.ducking = false;
      player.height = 16;
    });

    // UI Controls
    document.getElementById('restartBtn').addEventListener('click', resetGame);

    document.getElementById('muteBtn').addEventListener('click', () => {
      const muted = audio.toggleMute();
      document.getElementById('muteBtn').textContent = muted ? '🔇 MUTED' : '🔊 SOUND';
    });

    // XP Award Function
    function awardXP() {
      if (localStorage.getItem('game_shellsprint_xp_awarded')) return;
      localStorage.setItem('game_shellsprint_xp_awarded', 'true');
      let xp = parseInt(localStorage.getItem('hexworth_xp') || '0');
      xp += 50;
      localStorage.setItem('hexworth_xp', xp.toString());
      if (window.FirestoreManager) {
        const uid = localStorage.getItem('hexworth_uid');
        if (uid) FirestoreManager.addXP(uid, 50, 'Shell Sprint');
      }
      if (window.AchievementManager) AchievementManager.unlock('game_shellsprint');
    }

    // Initialize and start
    initBackground();
    audio.startMusic();
    resetGame();
  </script>

  <script src="../../../components/FluxCapacitor.js"></script>
  <script src="../../../components/AchievementManager.js"></script>
</body>
