                }
            },

            async typewriterText(text, container) {
                const lines = text.split('\n');

                for (const line of lines) {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'output-line';
                    lineDiv.innerHTML = line;
                    container.appendChild(lineDiv);

                    // Slight delay between lines
                    await this.sleep(20);

                    // Play typing sound occasionally
                    if (Math.random() > 0.7) {
                        AudioEngine.typewriterClick();
                    }

                    // Scroll to bottom
                    window.scrollTo(0, document.body.scrollHeight);
                }

                await this.sleep(300);
            },

            async showChoices(choices, container) {
                const choicesDiv = document.createElement('div');
                choicesDiv.className = 'choices';

                const promptDiv = document.createElement('div');
                promptDiv.className = 'prompt';
                promptDiv.innerHTML = 'root@compromised:~# <span class="purple">Choose action:</span>';
                choicesDiv.appendChild(promptDiv);

                choices.forEach((choice, index) => {
                    const choiceDiv = document.createElement('div');
                    choiceDiv.className = 'choice';
                    choiceDiv.innerHTML = `<span class="choice-number">[${index + 1}]</span> ${choice.text}`;
                    choiceDiv.onclick = () => this.makeChoice(choice);
                    choicesDiv.appendChild(choiceDiv);
                });

                container.appendChild(choicesDiv);

                // Add blinking cursor
                const cursorSpan = document.createElement('span');
                cursorSpan.className = 'cursor';
                cursorSpan.innerHTML = '█';
                container.appendChild(cursorSpan);

                window.scrollTo(0, document.body.scrollHeight);
            },

            makeChoice(choice) {
                // Update suspicion
                this.updateSuspicion(choice.suspicion);

                // Play sound based on suspicion change
                if (choice.suspicion > 20) {
                    AudioEngine.alertSting();
                    document.body.classList.add('flicker');
                    setTimeout(() => document.body.classList.remove('flicker'), 300);
                } else if (choice.suspicion > 0) {
                    AudioEngine.typewriterClick();
                }

                // Check if suspicion maxed out
                if (GameState.suspicion >= GameState.maxSuspicion) {
                    this.showNode('ending_escape');
                } else {
                    this.showNode(choice.next);
                }
            },

            updateSuspicion(amount) {
                GameState.suspicion = Math.min(GameState.maxSuspicion, Math.max(0, GameState.suspicion + amount));

                const percentage = (GameState.suspicion / GameState.maxSuspicion) * 100;
                const meterFill = document.getElementById('meter-fill');
                meterFill.style.width = percentage + '%';

                if (percentage > 70) {
                    meterFill.classList.add('danger');
                } else {
                    meterFill.classList.remove('danger');
                }

                // Update status text
                const statusText = document.getElementById('status-text');
                if (percentage > 80) {
                    statusText.textContent = 'COMPROMISED';
                    statusText.className = 'alert';
                    AudioEngine.heartbeat();
                } else if (percentage > 50) {
                    statusText.textContent = 'ALERTED';
                    statusText.className = 'warning';
                } else {
                    statusText.textContent = 'ACTIVE';
                    statusText.className = 'success';
                }
            },

            handleEnding(endingId) {
                GameState.gameEnded = true;
                if (typeof GameTracker !== 'undefined') GameTracker.record('sudo_su', { score: endingId === 'ending_victory' ? 1 : 0, result: endingId });

                if (endingId === 'ending_victory') {
                    AudioEngine.successChime();
                    this.awardXP();
                } else if (endingId === 'ending_partial_victory') {
                    AudioEngine.successChime();
                } else if (endingId === 'ending_contained') {
                    AudioEngine.alertSting();
                } else {
                    AudioEngine.glitchSound();
                }
            },

            awardXP() {
                if (localStorage.getItem('game_sudo_xp_awarded')) return;
                localStorage.setItem('game_sudo_xp_awarded', 'true');
                let xp = parseInt(localStorage.getItem('hexworth_xp') || '0');
                xp += 50;
                localStorage.setItem('hexworth_xp', xp.toString());
                if (window.FirestoreManager) {
                    const uid = localStorage.getItem('hexworth_uid');
                    if (uid) FirestoreManager.addXP(uid, 50, 'sudo su');
                }
                if (window.AchievementManager) AchievementManager.unlock('game_sudo');
            },

            sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        };

        // ===== START GAME =====
        window.addEventListener('DOMContentLoaded', () => {
            GameEngine.init();
        });
    </script>

    <script src="../../../components/FluxCapacitor.js"></script>
    <script src="../../../components/GameTracker.js"></script>
    <script src="../../../components/GameScoreboard.js"></script>
</body>
</html>
