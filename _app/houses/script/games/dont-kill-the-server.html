<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Kill the Server - Script House - Hexworth Prime</title>
    <style>
        :root {
            --house-primary: #a78bfa;
            --house-secondary: #7c3aed;
            --bg-dark: #0a0a0a;
            --bg-darker: #050505;
            --text-primary: #e0e0e0;
            --text-dim: #888;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --critical: #dc2626;
            --info: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--house-secondary), var(--house-primary));
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(167, 139, 250, 0.3);
            z-index: 10;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header-info {
            display: flex;
            gap: 2rem;
            align-items: center;
            font-size: 1rem;
        }

        .achievement-counter {
            cursor: pointer;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: all 0.3s ease;
            user-select: none;
        }

        .achievement-counter:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .timer {
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            min-width: 80px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .timer.warning {
            background: var(--warning);
            color: #000;
        }

        .timer.critical {
            background: var(--critical);
            color: #fff;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        /* Main container */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            overflow: hidden;
        }

        /* Output area */
        .output {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background: var(--bg-darker);
            border: 2px solid var(--house-primary);
            border-radius: 8px;
            margin-bottom: 1rem;
            box-shadow: 0 0 30px rgba(167, 139, 250, 0.2);
            scroll-behavior: smooth;
        }

        .output::-webkit-scrollbar {
            width: 10px;
        }

        .output::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        .output::-webkit-scrollbar-thumb {
            background: var(--house-primary);
            border-radius: 5px;
        }

        .output-line {
            margin: 0.3rem 0;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Line styling */
        .line-system { color: var(--house-primary); font-weight: bold; }
        .line-success { color: var(--success); }
        .line-error { color: var(--error); font-weight: bold; }
        .line-warning { color: var(--warning); }
        .line-critical { color: var(--critical); font-weight: bold; text-shadow: 0 0 5px var(--critical); }
        .line-alert { color: var(--warning); background: rgba(245, 158, 11, 0.1); padding: 0.3rem; border-left: 3px solid var(--warning); }
        .line-info { color: var(--info); }
        .line-dim { color: var(--text-dim); }
        .line-achievement { color: var(--house-primary); font-weight: bold; font-size: 1.1rem; }
        .line-narrative { color: #a0a0a0; font-style: italic; }
        .line-title { color: var(--house-primary); font-size: 1.3rem; font-weight: bold; text-align: center; margin: 1rem 0; }
        .line-hint { color: #fbbf24; background: rgba(251, 191, 36, 0.1); padding: 0.5rem; border-left: 3px solid #fbbf24; }
        .line-ps-output { color: #9ca3af; font-size: 0.9rem; }

        /* Input area */
        .input-area {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            background: var(--bg-darker);
            border: 2px solid var(--house-primary);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(167, 139, 250, 0.2);
        }

        .prompt {
            color: var(--success);
            font-weight: bold;
            white-space: nowrap;
        }

        #commandInput {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            outline: none;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            top: 100px;
            right: -400px;
            background: linear-gradient(135deg, var(--house-secondary), var(--house-primary));
            color: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            min-width: 300px;
            transition: right 0.5s ease;
            z-index: 1000;
        }

        .toast.show {
            right: 2rem;
        }

        .toast-title {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .toast-body {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* Gallery overlay */
        .gallery-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            overflow-y: auto;
            padding: 2rem;
        }

        .gallery-overlay.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .gallery-content {
            max-width: 1000px;
            margin: 0 auto;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .gallery-header h2 {
            font-size: 2.5rem;
            color: var(--house-primary);
            margin-bottom: 0.5rem;
        }

        .gallery-header p {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .achievement-card {
            background: var(--bg-darker);
            border: 2px solid #333;
            border-radius: 8px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .achievement-card.unlocked {
            border-color: var(--house-primary);
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.3);
        }

        .achievement-card.unlocked:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 30px rgba(167, 139, 250, 0.5);
        }

        .achievement-card h3 {
            color: var(--house-primary);
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .achievement-card.locked h3 {
            color: #555;
        }

        .achievement-card p {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .achievement-card.locked p {
            color: #444;
        }

        .gallery-close {
            text-align: center;
            margin-top: 2rem;
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        /* ASCII art styling */
        .ascii-art {
            color: var(--house-primary);
            line-height: 1.2;
            text-align: center;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
        }

        /* End screen */
        .end-screen {
            text-align: center;
            padding: 2rem;
        }

        .end-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px currentColor;
        }

        .end-subtitle {
            font-size: 1.3rem;
            margin-bottom: 2rem;
            color: var(--text-dim);
        }

        .end-stats {
            background: var(--bg-darker);
            border: 2px solid var(--house-primary);
            border-radius: 8px;
            padding: 2rem;
            margin: 2rem auto;
            max-width: 600px;
        }

        .end-stat {
            margin: 1rem 0;
            font-size: 1.1rem;
        }

        .end-controls {
            margin-top: 2rem;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>DON'T KILL THE SERVER</h1>
        <div class="header-info">
            <div class="achievement-counter" id="achievementCounter" title="Click to view achievements">
                ★ 0/12
            </div>
            <div class="timer" id="timer">3:00</div>
        </div>
    </div>

    <div class="container">
        <div class="output" id="output"></div>
        <div class="input-area">
            <span class="prompt" id="prompt">admin@prod-web01:~$</span>
            <input type="text" id="commandInput" autocomplete="off" autofocus>
        </div>
    </div>

    <div class="toast" id="toast">
        <div class="toast-title" id="toastTitle">Achievement Unlocked!</div>
        <div class="toast-body" id="toastBody"></div>
    </div>

    <div class="gallery-overlay" id="gallery">
        <div class="gallery-content">
            <div class="gallery-header">
                <h2>ACHIEVEMENT GALLERY</h2>
                <p>Server Survivalist Badges</p>
            </div>
            <div class="achievement-grid" id="achievementGrid"></div>
            <div class="gallery-close">
                Press [ESC] or [A] to close
            </div>
        </div>
    </div>

    <script>
        const Game = (function() {
            'use strict';

            // Game state
            const state = {
                phase: 'title', // title, playing, success, failure
                timeRemaining: 180,
                timerInterval: null,
                diskSpaceFreed: false,
                logsRotated: false,
                oldFilesRemoved: false,
                serviceRestarted: false,
                siteUp: false,
                dbConnectionFixed: false,
                ranRm: false,
                ranRmRf: false,
                checkedDisk: false,
                foundProblem: false,
                ranDu: false,
                ranLs: false,
                checkedService: false,
                fixedLogrotate: false,
                cleanedJournal: false,
                cleanedPackages: false,
                cleanedTemp: false,
                truncatedLog: false,
                restartedMysql: false,
                verifiedSite: false,
                commandsRun: [],
                eventsShown: [],
                hintsGiven: 0,
                triedWindowsCommands: false,
                drankCoffee: false,
                triedReboot: false,
                startTime: null,
                endTime: null,
                ending: null
            };

            // Achievement definitions
            const achievements = {
                disk_detective: {
                    name: "Disk Detective",
                    description: "Use df or du first to diagnose the issue"
                },
                log_surgeon: {
                    name: "Log Surgeon",
                    description: "Truncate the runaway log file safely"
                },
                by_the_book: {
                    name: "Methodical Admin",
                    description: "Follow proper methodology: identify, investigate, plan, implement, verify"
                },
                speed_run: {
                    name: "Speed Run",
                    description: "Fix the server in under 25 seconds"
                },
                nuclear_option: {
                    name: "Nuclear Option",
                    description: "Use rm -rf / and instantly destroy everything"
                },
                clean_sweep: {
                    name: "Clean Sweep",
                    description: "Clean logs, temp files, journal, and package cache"
                },
                root_cause: {
                    name: "Root Cause Analysis",
                    description: "Find and fix the disabled logrotate configuration"
                },
                wrong_os: {
                    name: "Wrong OS",
                    description: "Try Windows commands on a Linux server"
                },
                frozen: {
                    name: "Deer in Headlights",
                    description: "Do nothing until time runs out"
                },
                coffee_admin: {
                    name: "Coffee-Powered Admin",
                    description: "Drink coffee during the crisis"
                },
                reboot_hero: {
                    name: "Reboot 'Hero'",
                    description: "Try to reboot production during peak hours"
                },
                full_recovery: {
                    name: "Full Recovery",
                    description: "Free space, restart nginx, restart mysql, and verify site"
                }
            };

            // DOM elements
            const elements = {
                output: document.getElementById('output'),
                input: document.getElementById('commandInput'),
                prompt: document.getElementById('prompt'),
                timer: document.getElementById('timer'),
                achievementCounter: document.getElementById('achievementCounter'),
                toast: document.getElementById('toast'),
                toastTitle: document.getElementById('toastTitle'),
                toastBody: document.getElementById('toastBody'),
                gallery: document.getElementById('gallery'),
                achievementGrid: document.getElementById('achievementGrid')
            };

            // Helper to create styled output (returns String object with _className property)
            function styled(text, className) {
                const str = new String(text);
                str._className = className;
                return str;
            }

            // Output functions
            function print(text) {
                const line = document.createElement('div');
                line.className = 'output-line';

                if (text && text._className) {
                    line.classList.add(text._className);
                    line.textContent = text.toString();
                } else {
                    line.textContent = text;
                }

                elements.output.appendChild(line);
                elements.output.scrollTop = elements.output.scrollHeight;
            }

            function clear() {
                elements.output.innerHTML = '';
            }

            // Achievement system
            function loadAchievements() {
                const saved = localStorage.getItem('hexworth_dontkillserver_achievements');
                return saved ? JSON.parse(saved) : {};
            }

            function saveAchievements(data) {
                localStorage.setItem('hexworth_dontkillserver_achievements', JSON.stringify(data));
            }

            function unlockAchievement(id) {
                const saved = loadAchievements();
                if (!saved[id]) {
                    saved[id] = true;
                    saveAchievements(saved);
                    showToast(achievements[id].name, achievements[id].description);
                    updateAchievementCounter();
                    return true;
                }
                return false;
            }

            function updateAchievementCounter() {
                const saved = loadAchievements();
                const count = Object.keys(saved).length;
                elements.achievementCounter.textContent = `★ ${count}/12`;
            }

            function showToast(title, body) {
                elements.toastTitle.textContent = title;
                elements.toastBody.textContent = body;
                elements.toast.classList.add('show');
                setTimeout(() => {
                    elements.toast.classList.remove('show');
                }, 4000);
            }

            function showGallery() {
                const saved = loadAchievements();
                elements.achievementGrid.innerHTML = '';

                for (const [id, data] of Object.entries(achievements)) {
                    const card = document.createElement('div');
                    card.className = `achievement-card ${saved[id] ? 'unlocked' : 'locked'}`;
                    card.innerHTML = `
                        <h3>${saved[id] ? '★ ' : '🔒 '}${data.name}</h3>
                        <p>${data.description}</p>
                    `;
                    elements.achievementGrid.appendChild(card);
                }

                elements.gallery.classList.add('show');
            }

            function hideGallery() {
                elements.gallery.classList.remove('show');
            }

            // Timer functions
            function startTimer() {
                state.startTime = Date.now();
                state.timerInterval = setInterval(() => {
                    state.timeRemaining--;
                    updateTimerDisplay();

                    if (state.timeRemaining <= 0) {
                        endGame('timeout');
                    } else {
                        checkTimedEvents();
                    }
                }, 1000);
            }

            function stopTimer() {
                if (state.timerInterval) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                }
            }

            function updateTimerDisplay() {
                const mins = Math.floor(state.timeRemaining / 60);
                const secs = state.timeRemaining % 60;
                elements.timer.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

                elements.timer.classList.remove('warning', 'critical');
                if (state.timeRemaining <= 30) {
                    elements.timer.classList.add('critical');
                } else if (state.timeRemaining <= 60) {
                    elements.timer.classList.add('warning');
                }
            }

            function checkTimedEvents() {
                const elapsed = 180 - state.timeRemaining;

                const events = [
                    { time: 15, key: 'checkout_fail', text: styled('[MONITOR] E-commerce checkout failures increasing: 47 failed transactions', 'line-alert'), skipIf: () => state.siteUp },
                    { time: 40, key: 'mysql_pool', text: styled('[ALERT] MySQL connection pool exhausted - database refusing connections', 'line-alert'), skipIf: () => state.diskSpaceFreed },
                    { time: 70, key: 'load_balancer', text: styled('[ALERT] Load balancer marking prod-web01 as unhealthy, sending traffic to prod-web02', 'line-alert'), skipIf: () => state.siteUp },
                    { time: 100, key: 'web02_disk', text: styled('[CRITICAL] prod-web02 also running low on disk - same log issue!', 'line-critical'), skipIf: () => state.diskSpaceFreed },
                    { time: 130, key: 'ceo_tweet', text: styled('[CRITICAL] CEO tweeted "Looking into our website issues" - PR nightmare incoming', 'line-critical'), skipIf: () => state.siteUp },
                    { time: 160, key: 'revenue_loss', text: styled('[CRITICAL] Revenue loss exceeds $50,000. CFO is calling the CTO.', 'line-critical'), skipIf: () => state.siteUp }
                ];

                events.forEach(event => {
                    if (elapsed === event.time && !state.eventsShown.includes(event.key)) {
                        if (!event.skipIf || !event.skipIf()) {
                            print('');
                            print(event.text);
                            print('');
                            state.eventsShown.push(event.key);
                        }
                    }
                });
            }

            // Command handling
            function handleCommand(input) {
                const cmd = input.trim().toLowerCase();

                if (state.phase === 'title') {
                    if (cmd === 'start' || cmd === 's') {
                        startGame();
                    } else if (cmd === 'achievements' || cmd === 'a') {
                        showGallery();
                    }
                    return;
                }

                if (state.phase === 'success' || state.phase === 'failure') {
                    if (cmd === 'r' || cmd === 'restart' || cmd === 'play again') {
                        restartGame();
                    } else if (cmd === 'a' || cmd === 'achievements') {
                        showGallery();
                    }
                    return;
                }

                // Playing phase
                print(styled(`admin@prod-web01:~$ ${input}`, 'line-dim'));

                if (!cmd) return;

                state.commandsRun.push(cmd);

                // Check for first command being diagnostic
                if (state.commandsRun.length === 1) {
                    if (cmd.startsWith('df') || cmd.startsWith('du')) {
                        unlockAchievement('disk_detective');
                    }
                }

                // Route commands
                if (cmd.startsWith('df')) {
                    cmdDf(cmd);
                } else if (cmd.startsWith('du')) {
                    cmdDu(cmd);
                } else if (cmd.startsWith('ls')) {
                    cmdLs(cmd);
                } else if (cmd.startsWith('tail') || cmd.startsWith('head') || cmd.startsWith('cat')) {
                    cmdViewLog(cmd);
                } else if (cmd.startsWith('truncate')) {
                    cmdTruncate(cmd);
                } else if (cmd.startsWith('rm')) {
                    cmdRm(cmd);
                } else if (cmd.startsWith('logrotate')) {
                    cmdLogrotate(cmd);
                } else if (cmd.includes('systemctl') || cmd.includes('service')) {
                    cmdService(cmd);
                } else if (cmd.startsWith('free')) {
                    cmdFree();
                } else if (cmd.startsWith('top') || cmd === 'htop') {
                    cmdTop();
                } else if (cmd.startsWith('ps')) {
                    cmdPs(cmd);
                } else if (cmd.startsWith('kill')) {
                    cmdKill(cmd);
                } else if (cmd.startsWith('find')) {
                    cmdFind(cmd);
                } else if (cmd.startsWith('ncdu')) {
                    cmdNcdu(cmd);
                } else if (cmd.startsWith('journalctl')) {
                    cmdJournalctl(cmd);
                } else if (cmd.startsWith('apt') || cmd.startsWith('yum')) {
                    cmdPackageClean(cmd);
                } else if (cmd.startsWith('crontab')) {
                    cmdCrontab(cmd);
                } else if (cmd.startsWith('nano') || cmd.startsWith('vi') || cmd.startsWith('vim')) {
                    cmdEditor(cmd);
                } else if (cmd.startsWith('ping') || cmd.startsWith('curl')) {
                    cmdNetworkTest(cmd);
                } else if (cmd.startsWith('mysql')) {
                    cmdMysql(cmd);
                } else if (cmd === 'help' || cmd === '?' || cmd === 'h') {
                    cmdHelp();
                } else if (cmd === 'hint' || cmd === 'hints') {
                    cmdHint();
                } else if (cmd === 'look' || cmd === 'examine') {
                    cmdLook();
                } else if (cmd === 'inventory' || cmd === 'i') {
                    cmdInventory();
                } else if (cmd === 'panic') {
                    cmdPanic();
                } else if (cmd === 'coffee') {
                    cmdCoffee();
                } else if (cmd.includes('call') || cmd.includes('phone')) {
                    cmdCall(cmd);
                } else if (cmd.includes('google') || cmd.includes('stackoverflow')) {
                    cmdGoogle();
                } else if (cmd === 'reboot' || cmd === 'shutdown' || cmd.includes('shutdown') || cmd.includes('reboot')) {
                    cmdReboot();
                } else if (cmd === 'exit' || cmd === 'logout' || cmd === 'quit') {
                    cmdExit();
                } else if (cmd === 'dir' || cmd === 'cls' || cmd === 'ipconfig' || cmd.startsWith('c:')) {
                    cmdWindowsCommand(cmd);
                } else {
                    print(styled(`bash: ${cmd.split(' ')[0]}: command not found`, 'line-error'));
                    print(styled("Type 'help' for available commands", 'line-dim'));
                }
            }

            // Command implementations
            function cmdDf(cmd) {
                state.checkedDisk = true;
                print(styled('Filesystem      Size  Used Avail Use% Mounted on', 'line-info'));
                print(styled('/dev/sda1       100G   99G  1.0G  99% /', 'line-error'));
                print(styled('/dev/sda2       200G  196G  4.0G  98% /var', 'line-error'));
                print(styled('tmpfs            16G  8.0G  8.0G  50% /dev/shm', 'line-ps-output'));
                print('');
                print(styled('CRITICAL: Root and /var filesystems nearly full!', 'line-critical'));
            }

            function cmdDu(cmd) {
                state.ranDu = true;
                state.checkedDisk = true;

                if (cmd.includes('/var/log')) {
                    print(styled('4.0K    /var/log/apt', 'line-ps-output'));
                    print(styled('2.0M    /var/log/nginx', 'line-ps-output'));
                    print(styled('45G     /var/log/app.log', 'line-error'));
                    print(styled('3.2G    /var/log/app.log.1.gz', 'line-warning'));
                    print(styled('3.0G    /var/log/app.log.2.gz', 'line-warning'));
                    print(styled('2.8G    /var/log/app.log.3.gz', 'line-warning'));
                    print(styled('156M    /var/log/syslog', 'line-ps-output'));
                    print('');
                    print(styled('FOUND IT: /var/log/app.log is 45GB! That\'s the problem!', 'line-critical'));
                    state.foundProblem = true;
                } else if (cmd.includes('/var')) {
                    print(styled('45G     /var/log', 'line-error'));
                    print(styled('2.3G    /var/cache', 'line-warning'));
                    print(styled('1.1G    /var/lib', 'line-ps-output'));
                    print(styled('456M    /var/tmp', 'line-ps-output'));
                    print('');
                    print(styled('The /var/log directory is consuming 45GB!', 'line-warning'));
                } else if (cmd.includes('/tmp')) {
                    print(styled('3.2G    /tmp/sessions', 'line-warning'));

                if (state.diskSpaceFreed && state.serviceRestarted && state.siteUp) {
                    // Check for Full Recovery achievement
                    if (state.restartedMysql && state.verifiedSite) {
                        unlockAchievement('full_recovery');
                    }

                    // Check for By The Book achievement
                    if (state.checkedDisk && state.foundProblem && state.truncatedLog && state.serviceRestarted && state.verifiedSite) {
                        unlockAchievement('by_the_book');
                    }

                    // Check for Speed Run achievement
                    const elapsedSeconds = 180 - state.timeRemaining;
                    if (elapsedSeconds <= 25) {
                        unlockAchievement('speed_run');
                    }

                    endGame('success');
                }
            }

            // Game flow functions
            function showTitle() {
                clear();
                state.phase = 'title';
                elements.input.disabled = false;

                const saved = loadAchievements();
                const achievementCount = Object.keys(saved).length;

                print('');
                print(styled('╔══════════════════════════════════════════════════════════════╗', 'ascii-art'));
                print(styled('║                                                              ║', 'ascii-art'));
                print(styled('║              DON\'T KILL THE SERVER                           ║', 'ascii-art'));
                print(styled('║                                                              ║', 'ascii-art'));
                print(styled('║              A Linux Sysadmin Survival Game                 ║', 'ascii-art'));
                print(styled('║                                                              ║', 'ascii-art'));
                print(styled('╚══════════════════════════════════════════════════════════════╝', 'ascii-art'));
                print('');
                print(styled('SITUATION:', 'line-critical'));
                print('  It\'s 2:00 AM. Black Friday. Your production web server just');
                print('  triggered a DISK FULL alert. The e-commerce site is DOWN.');
                print('  Revenue is dropping $500/minute.');
                print('');
                print('  The senior admin isn\'t answering their phone.');
                print('  The CEO is one tweet away from a PR disaster.');
                print('');
                print(styled('  You have 3 MINUTES to fix this.', 'line-critical'));
                print('');
                print(styled('OBJECTIVE:', 'line-warning'));
                print('  Free disk space and restart the web server before you\'re fired.');
                print('');
                if (achievementCount > 0) {
                    print(styled(`★ You've unlocked ${achievementCount}/12 achievements`, 'line-achievement'));
                    print('');
                }
                print(styled('[S] Start Game', 'line-success'));
                print(styled('[A] View Achievements', 'line-info'));
                print('');
                print(styled('Type "help" during the game for available commands.', 'line-dim'));
                print('');
            }

            function startGame() {
                clear();
                state.phase = 'playing';

                // Reset state
                Object.assign(state, {
                    timeRemaining: 180,
                    diskSpaceFreed: false,
                    logsRotated: false,
                    oldFilesRemoved: false,
                    serviceRestarted: false,
                    siteUp: false,
                    dbConnectionFixed: false,
                    ranRm: false,
                    ranRmRf: false,
                    checkedDisk: false,
                    foundProblem: false,
                    ranDu: false,
                    ranLs: false,
                    checkedService: false,
                    fixedLogrotate: false,
                    cleanedJournal: false,
                    cleanedPackages: false,
                    cleanedTemp: false,
                    truncatedLog: false,
                    restartedMysql: false,
                    verifiedSite: false,
                    commandsRun: [],
                    eventsShown: [],
                    hintsGiven: 0,
                    triedWindowsCommands: false,
                    drankCoffee: false,
                    triedReboot: false,
                    ending: null
                });

                print('');
                print(styled('════════════════════════════════════════════════════════', 'line-critical'));
                print(styled('  [02:00:47] CRITICAL ALERT: DISK FULL ON PROD-WEB01', 'line-critical'));
                print(styled('════════════════════════════════════════════════════════', 'line-critical'));
                print('');
                print(styled('Your phone buzzes. Monitoring alert:', 'line-narrative'));
                print(styled('  "prod-web01: Disk usage critical: 99% - Service degraded"', 'line-error'));
                print('');
                print(styled('You scramble to your laptop, hands shaking.', 'line-narrative'));
                print(styled('SSH session connected: admin@prod-web01', 'line-success'));
                print('');
                print(styled('[MONITORING] E-commerce site returning 503 errors', 'line-alert'));
                print(styled('[ALERT] Revenue tracking stopped - transaction log full!', 'line-alert'));
                print('');
                print(styled('The clock is ticking. What do you do?', 'line-warning'));
                print('');
                print(styled('(Type "help" for commands, "hint" for help)', 'line-dim'));
                print('');

                startTimer();
            }

            function endGame(ending) {
                stopTimer();
                state.phase = ending === 'success' ? 'success' : 'failure';
                state.ending = ending;
                state.endTime = Date.now();
                elements.input.disabled = false;

                const elapsedSeconds = state.startTime ? Math.floor((state.endTime - state.startTime) / 1000) : 180;

                print('');
                print('');

                if (ending === 'success') {
                    print(styled('╔══════════════════════════════════════════════════════════╗', 'line-success'));
                    print(styled('║                                                          ║', 'line-success'));
                    print(styled('║                    CRISIS AVERTED!                       ║', 'line-success'));
                    print(styled('║                                                          ║', 'line-success'));
                    print(styled('╚══════════════════════════════════════════════════════════╝', 'line-success'));
                    print('');
                    print(styled('The website springs back to life!', 'line-success'));
                    print(styled('Transactions resume. Revenue flows. The CEO tweets nothing.', 'line-success'));
                    print('');
                    print(styled('You lean back in your chair, exhausted but victorious.', 'line-narrative'));
                    print(styled('In the morning, you find a "Nice work last night" Slack from the CTO.', 'line-narrative'));
                    print(styled('The senior admin buys you lunch. You sleep until 2 PM.', 'line-narrative'));
                    print('');
                    print(styled(`Time: ${Math.floor(elapsedSeconds / 60)}:${(elapsedSeconds % 60).toString().padStart(2, '0')}`, 'line-info'));
                    print(styled(`Commands used: ${state.commandsRun.length}`, 'line-info'));

                    // Platform achievement integration
                    if (typeof AchievementSystem !== 'undefined') {
                        AchievementSystem.unlockGameAchievement('server', 'win');

                        const saved = loadAchievements();
                        if (saved.by_the_book) {
                            AchievementSystem.unlockGameAchievement('server', 'by_the_book');
                        }
                        if (saved.speed_run) {
                            AchievementSystem.unlockGameAchievement('server', 'speed');
                        }
                        if (Object.keys(saved).length >= 12) {
                            AchievementSystem.unlockGameAchievement('server', 'all');
                        }
                    }

                    // Award XP (one-time)
                    if (!localStorage.getItem('game_server_xp_awarded')) {
                        const currentXP = parseInt(localStorage.getItem('hexworth_xp') || '0');
                        localStorage.setItem('hexworth_xp', (currentXP + 50).toString());
                        localStorage.setItem('game_server_xp_awarded', 'true');
                        if (typeof FirestoreManager !== 'undefined' && FirestoreManager.addXP) {
                            const uid = localStorage.getItem('hexworth_uid');
                            if (uid) FirestoreManager.addXP(uid, 50, 'Don\'t Kill the Server Complete');
                        }
                    }
                    if (typeof AchievementManager !== 'undefined') {
                        AchievementManager.unlock('game_server');
                    }
                } else if (ending === 'nuclear') {
                    print(styled('╔══════════════════════════════════════════════════════════╗', 'line-critical'));
                    print(styled('║                                                          ║', 'line-critical'));
                    print(styled('║              TOTAL SYSTEM DESTRUCTION                    ║', 'line-critical'));
                    print(styled('║                                                          ║', 'line-critical'));
                    print(styled('╚══════════════════════════════════════════════════════════╝', 'line-critical'));
                    print('');
                    print(styled('You obliterated the entire server with rm -rf /', 'line-error'));
                    print(styled('Even the backups on local disk are gone.', 'line-error'));
                    print('');
                    print(styled('The company loses $3.2M in Black Friday sales.', 'line-narrative'));
                    print(styled('Your story becomes a cautionary tale in sysadmin forums.', 'line-narrative'));
                    print(styled('Your name is spoken in hushed whispers: "Remember... The Junior..."', 'line-narrative'));
                } else if (ending === 'timeout') {
                    print(styled('╔══════════════════════════════════════════════════════════╗', 'line-critical'));
                    print(styled('║                                                          ║', 'line-critical'));
                    print(styled('║                    TIME\'S UP!                            ║', 'line-critical'));
                    print(styled('║                                                          ║', 'line-critical'));
                    print(styled('╚══════════════════════════════════════════════════════════╝', 'line-critical'));
                    print('');
                    print(styled('The site remains down. The CEO notices.', 'line-error'));
                    print(styled('Your Slack lights up. Then your personal phone. Then... silence.', 'line-error'));
                    print('');
                    print(styled('In the morning, there\'s a meeting with HR.', 'line-narrative'));
                    print(styled('The senior admin apologizes for sleeping through it.', 'line-narrative'));
                    print(styled('But you were the one on-call. This was your moment.', 'line-narrative'));
                    print('');

                    // Check if player did absolutely nothing
                    if (state.commandsRun.length === 0) {
                        unlockAchievement('frozen');
                    }
                }

                // Track game stats
                if (typeof GameTracker !== 'undefined') {
                    const saved = loadAchievements();
                    GameTracker.record('server', {
                        result: state.ending || 'unknown',
                        timeElapsed: 180 - state.timeRemaining,
                        commandsUsed: state.commandsRun.length,
                        achievementsEarned: Object.keys(saved).length,
                        achievementsTotal: Object.keys(achievements).length
                    });
                }

                print('');
                const saved = loadAchievements();
                const count = Object.keys(saved).length;
                print(styled(`Achievements Unlocked: ${count}/12`, 'line-achievement'));
                print('');
                print(styled('[R] Play Again    [A] View Achievements', 'line-info'));
                print('');
            }

            function restartGame() {
                showTitle();
            }

            // Event listeners
            elements.input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const input = elements.input.value.trim();
                    if (input) {
                        handleCommand(input);
                        elements.input.value = '';
                    }
                }
            });

            elements.achievementCounter.addEventListener('click', () => {
                showGallery();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' || (e.key.toLowerCase() === 'a' && elements.gallery.classList.contains('show'))) {
                    hideGallery();
                }
            });

            // Initialize
            function init() {
                updateAchievementCounter();
                showTitle();
            }

            return { init };
        })();

        // Start the game
        Game.init();
    </script>

    <script src="../../../components/GameTracker.js"></script>
    <script src="../../../components/AchievementSystem.js"></script>
    <script src="../../../components/AchievementManager.js"></script>
</body>
</html>
