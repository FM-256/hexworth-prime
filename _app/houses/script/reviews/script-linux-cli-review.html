<script src="../../../components/ReviewEngine.js"></script>
<script>
ReviewEngine.init({
  containerId: 'review-root',
  title: 'Linux & CLI Review',
  storageKey: 'hexworth_review_linux_cli',
  houseId: 'script',
  categories: [
    {
      name: 'File System & Navigation',
      questions: [
        { value: 100, question: 'Which command displays the current working directory in a Linux terminal?', options: ['cwd','whereami','pwd','dir'], correct: 2, explanation: 'pwd (print working directory) displays the absolute path of the current directory. It is one of the most fundamental Linux navigation commands.' },
        { value: 200, question: 'What is the difference between an absolute path and a relative path in Linux?', options: ['Absolute paths start with ~ and relative paths start with /','Absolute paths start from the root directory (/) and relative paths start from the current directory','Absolute paths are faster to process than relative paths','There is no difference; they are interchangeable terms'], correct: 1, explanation: 'An absolute path begins with / (the root directory) and specifies the complete path to a file (e.g., /home/user/docs). A relative path is relative to the current working directory (e.g., ../docs). The tilde (~) is a shorthand for the home directory, not the root.' },
        { value: 300, question: 'An administrator needs to find all files larger than 100MB in the /var directory that were modified in the last 7 days. Which command accomplishes this?', options: ['ls -la /var | grep "100M"','find /var -size +100M -mtime -7','locate /var --size 100M --days 7','du -h /var | sort -rh | head'], correct: 1, explanation: 'The find command with -size +100M matches files over 100MB, and -mtime -7 matches files modified within the last 7 days. The find command searches the directory tree in real-time and supports complex filtering criteria.' },
        { value: 400, question: 'A user creates a symbolic link with: ln -s /opt/app/config.yml ~/config.yml. Later, the original file at /opt/app/config.yml is deleted. What happens when the user tries to read ~/config.yml?', options: ['The symlink automatically updates to a new location','The symlink becomes a dangling (broken) link and reading it produces an error','The file content is preserved in the symlink itself','The symlink is automatically deleted when the target is removed'], correct: 1, explanation: 'A symbolic link is a pointer to a file path, not to the file data itself. When the target file is deleted, the symlink becomes a dangling link pointing to a nonexistent path. Attempting to read it produces a "No such file or directory" error. Unlike hard links, symlinks do not preserve the file data.' },
        { value: 500, question: 'An administrator notices that a filesystem is reported as 100% full by df, but du shows only 60% usage when summing all files. Which scenario most likely explains this discrepancy, and how would you investigate?', options: ['The df command is always inaccurate and should not be trusted','A process is holding open file handles to large deleted files; use lsof +L1 to find processes referencing deleted files that still consume disk space','The du command excludes hidden files; simply add the -a flag','The filesystem has bad sectors that df counts but du does not'], correct: 1, explanation: 'When a file is deleted but a process still has it open, the inode and disk blocks are not freed until the process closes the file handle. df reports actual block usage (including unlinked but open files), while du only counts visible directory entries. Using lsof +L1 identifies processes holding deleted files, and restarting those processes reclaims the space.' }
      ]
    },
    {
      name: 'User Management',
      questions: [
        { value: 100, question: 'Which command adds a new user account named "analyst" to a Linux system?', options: ['adduser analyst or useradd analyst','newuser analyst','create-user analyst','user --add analyst'], correct: 0, explanation: 'Both useradd (low-level) and adduser (higher-level, Debian/Ubuntu) create user accounts. useradd requires additional flags for home directory creation (-m), while adduser interactively prompts for password and details.' },
        { value: 200, question: 'Where are user password hashes stored on a modern Linux system, and why?', options: ['/etc/passwd because it is the user database','/etc/shadow because it is readable only by root, providing an additional layer of security','/etc/security/passwords in encrypted format','/home/user/.password in each user home directory'], correct: 1, explanation: '/etc/shadow stores password hashes and is readable only by root (mode 640). Historically, hashes were in /etc/passwd (world-readable), but shadow passwords were implemented to prevent non-privileged users from accessing and attempting to crack password hashes.' },
        { value: 300, question: 'An administrator needs to temporarily disable a user account without deleting it or removing the home directory. Which approach is most appropriate?', options: ['Delete the user and recreate them later','usermod -L username to lock the account password, or set the shell to /sbin/nologin','Change the user password to an empty string','Remove the user from all groups'], correct: 1, explanation: 'usermod -L locks the account by prepending a "!" to the password hash in /etc/shadow, preventing password authentication. Setting the shell to /sbin/nologin prevents interactive login. Both methods are reversible: usermod -U unlocks, and the shell can be changed back.' },
        { value: 400, question: 'A Linux server has a service account (UID 998) that should only be used to run a specific daemon. The account currently has a valid login shell. What security hardening steps should be taken, and what file controls the valid login shells?', options: ['Delete the account; service accounts are unnecessary','Set the shell to /usr/sbin/nologin (listed in /etc/shells), lock the password, and ensure the account has no unnecessary group memberships','Change the UID to 0 so it runs as root','Add the account to the sudo group for flexibility'], correct: 1, explanation: 'Service accounts should have /usr/sbin/nologin or /bin/false as their shell to prevent interactive login, and their passwords should be locked. The /etc/shells file lists valid login shells. Additionally, service accounts should follow the principle of least privilege with minimal group memberships.' },
        { value: 500, question: 'An organization uses centralized authentication via LDAP. A Linux server is configured with NSS (Name Service Switch) and PAM (Pluggable Authentication Modules). After an LDAP server outage, local users cannot log in either. What is the most likely misconfiguration, and what is the correct nsswitch.conf entry to prevent this?', options: ['PAM is disabled; re-enable it with systemctl start pam','The nsswitch.conf passwd line reads "passwd: ldap" without "files" as a fallback; it should be "passwd: files ldap" to check local files first','The LDAP server needs more memory to handle requests','The /etc/passwd file was deleted during LDAP integration'], correct: 1, explanation: 'If nsswitch.conf specifies only "ldap" without "files" for the passwd database, the system cannot resolve any user accounts when LDAP is unavailable, including local accounts. The correct configuration is "passwd: files ldap" which checks /etc/passwd first (local accounts) and falls back to LDAP for centralized accounts.' }
      ]
    },
    {
      name: 'Permissions & Ownership',
      questions: [
        { value: 100, question: 'What does the permission string rwxr-x--- represent in octal notation?', options: ['755','750','740','700'], correct: 1, explanation: 'rwx = 7 (4+2+1) for owner, r-x = 5 (4+0+1) for group, --- = 0 for others. Combined: 750. The owner has full access, group members can read and execute, and others have no access.' },
        { value: 200, question: 'An administrator runs chmod 4755 /usr/local/bin/custom-tool. What does the leading "4" accomplish?', options: ['Sets the sticky bit so only the owner can delete the file','Sets the SUID (Set User ID) bit so the program runs with the file owner permissions regardless of who executes it','Sets the SGID bit for group inheritance','Makes the file immutable and prevents modification'], correct: 1, explanation: 'The SUID bit (4 in the special permission digit) causes the executable to run with the effective UID of the file owner rather than the executing user. This is how programs like passwd can modify /etc/shadow despite being run by non-root users. SUID files are potential security risks and should be audited regularly.' },
        { value: 300, question: 'A web server document root at /var/www/html contains files that need to be readable by the web server (running as www-data) but should not be modifiable by the web server process. What is the correct ownership and permission configuration?', options: ['chown www-data:www-data /var/www/html -R && chmod 777 -R /var/www/html','chown root:www-data /var/www/html -R && chmod 750 /var/www/html && chmod 640 /var/www/html/*','chown nobody:nogroup /var/www/html -R','chmod 444 /var/www/html -R'], correct: 1, explanation: 'Setting ownership to root:www-data with 750 (directory) and 640 (files) means root owns the files (write access), the www-data group can read (and traverse directories), but www-data cannot modify files. This follows the principle of least privilege while maintaining web server read access.' },
        { value: 400, question: 'An administrator sets the sticky bit on /tmp with chmod 1777 /tmp. What specific security problem does the sticky bit solve on shared directories?', options: ['It encrypts all files in the directory','It prevents anyone from creating files in the directory','It ensures that only the file owner, directory owner, or root can delete or rename files within the directory, preventing users from deleting each other\'s files','It makes the directory read-only for all non-root users'], correct: 2, explanation: 'Without the sticky bit on a world-writable directory like /tmp, any user could delete any file regardless of ownership. The sticky bit restricts deletion/renaming so only the file owner, directory owner, or root can remove files. This is critical for shared directories to prevent denial-of-service through file deletion.' },
        { value: 500, question: 'A penetration tester discovers a custom SUID root binary that calls system("cat /var/log/app.log") without using an absolute path. How can this be exploited for privilege escalation, and what coding practice prevents this vulnerability?', options: ['The binary cannot be exploited because SUID is a security feature','The attacker can modify the PATH environment variable to place a malicious "cat" binary earlier in the path; the SUID program then executes the attacker\'s version as root. Prevention requires using absolute paths (/usr/bin/cat) in SUID programs','The attacker must first gain root access to exploit this','Replacing /var/log/app.log with a symlink to /etc/shadow is the only attack vector'], correct: 1, explanation: 'This is a PATH injection attack against a SUID binary. The attacker creates a malicious script named "cat" (e.g., #!/bin/bash /bin/bash), places it in a directory they control (e.g., /tmp), and prepends that directory to PATH (export PATH=/tmp:$PATH). When the SUID binary runs and calls system("cat ..."), it finds the attacker\'s version first and executes it as root. Secure coding requires absolute paths in SUID binaries and sanitizing the environment.' }
      ]
    },
    {
      name: 'Networking Commands',
      questions: [
        { value: 100, question: 'Which command displays the IP address configuration of all network interfaces on a modern Linux system?', options: ['ifconfig -a','ipconfig /all','ip addr show','netstat -i'], correct: 2, explanation: 'ip addr show (or ip a) is the modern command for displaying network interface configuration on Linux. While ifconfig still works on many systems, it is deprecated in favor of the ip command from the iproute2 suite.' },
        { value: 200, question: 'An administrator needs to check which process is listening on port 8080. Which command provides this information?', options: ['ping localhost:8080','ss -tlnp | grep 8080','traceroute 8080','nslookup 8080'], correct: 1, explanation: 'ss -tlnp lists all TCP listening sockets (-l) with numeric ports (-n) and the owning process (-p). Filtering with grep for 8080 shows exactly which process (name and PID) is bound to that port. ss is the modern replacement for netstat.' },
        { value: 300, question: 'A system administrator suspects DNS resolution issues on a server. The server can reach 8.8.8.8 by IP but cannot resolve google.com. Which command sequence would diagnose the DNS configuration problem?', options: ['ping google.com repeatedly until it works','cat /etc/resolv.conf to check DNS server configuration, then dig @8.8.8.8 google.com to test external resolution, then dig google.com to test configured resolver','traceroute google.com to find the DNS path','nmap -sV google.com to check DNS service version'], correct: 1, explanation: 'First, check /etc/resolv.conf for the configured nameservers. Then test with dig @8.8.8.8 to confirm external DNS works (ruling out upstream DNS issues). Finally, dig google.com (using the configured resolver) to determine if the local DNS configuration or the configured DNS server is the problem.' },
        { value: 400, question: 'An administrator needs to capture all HTTP traffic on interface eth0 for forensic analysis and save it to a file for later analysis with Wireshark. Which tcpdump command is correct?', options: ['tcpdump -i eth0 -w capture.pcap port 80','tcpdump -i eth0 -w capture.pcap "port 80 or port 443"','tcpdump -i eth0 -r capture.pcap port 80','tcpdump --interface eth0 --output http_traffic.log'], correct: 1, explanation: 'tcpdump -i eth0 specifies the interface, -w capture.pcap writes raw packets to a file (readable by Wireshark), and the filter "port 80 or port 443" captures both HTTP and HTTPS traffic. The first option misses HTTPS (port 443), which is essential for comprehensive HTTP traffic analysis.' },
        { value: 500, question: 'A Linux server behind a NAT firewall needs to accept inbound SSH connections from the internet, but the firewall only allows outbound connections. The administrator has access to a public-facing jump server. What technique using standard SSH can solve this without modifying the firewall, and what is the security implication?', options: ['Port forwarding on the NAT firewall is the only option','Configure a reverse SSH tunnel: from the internal server, run ssh -R 2222:localhost:22 user@jumpserver, then connect to the internal server via ssh -p 2222 localhost on the jump server','Use telnet as an alternative to SSH when firewalls block SSH','Install a VPN on both servers; no other solution exists'], correct: 1, explanation: 'A reverse SSH tunnel initiates an outbound connection from the internal server to the jump server (allowed by the firewall), then creates a listening port on the jump server that forwards back through the tunnel. Security implication: this bypasses firewall controls, creating an inbound access path that circumvents network security policy. In a penetration test, this is a common persistence and pivoting technique. Organizations should monitor for unauthorized SSH tunnels.' }
      ]
    },
    {
      name: 'Shell Scripting',
      questions: [
        { value: 100, question: 'What is the shebang line #!/bin/bash at the top of a script used for?', options: ['It is a comment that documents the script language','It specifies the interpreter that should execute the script when run directly','It imports the bash library functions','It enables debugging mode for the script'], correct: 1, explanation: 'The shebang (#!) tells the operating system which interpreter to use when the script is executed directly (e.g., ./script.sh). Without it, the system uses the default shell, which may not be bash and could cause compatibility issues with bash-specific syntax.' },
        { value: 200, question: 'What is the difference between $@ and $* when used inside double quotes in a bash script?', options: ['They are identical in all contexts','$@ expands each argument as a separate quoted word; $* combines all arguments into a single string','$* preserves argument separation; $@ combines them','$@ is for positional parameters; $* is for environment variables'], correct: 1, explanation: '"$@" expands to "$1" "$2" "$3" ... preserving each argument as a separate word, which is critical when arguments contain spaces. "$*" expands to "$1 $2 $3 ..." as a single string joined by the first character of IFS. For passing arguments to another command, "$@" is almost always correct.' },
        { value: 300, question: 'An administrator writes a script that checks disk usage and sends an alert if any filesystem exceeds 90% usage. Which combination of commands and constructs is most appropriate?', options: ['ls -la / | mail admin@company.com','df -h | awk \'{print $5, $6}\' parsed in a while loop with an if condition checking the percentage value','ping disk-monitor-server to check usage','cat /proc/diskstats | grep 90'], correct: 1, explanation: 'df -h provides filesystem usage data. awk extracts the percentage and mount point columns. A while read loop iterates through each line, and an if statement compares the percentage (after removing the % symbol with tr or parameter expansion) against the 90% threshold. This is a common sysadmin automation pattern.' },
        { value: 400, question: 'A script needs to process a CSV file where fields may contain commas within quoted strings (e.g., "Smith, John",Engineering,50000). The naive approach using IFS="," breaks on quoted commas. What is the correct approach?', options: ['Use cut -d"," to split fields','Use awk -F"," which handles quoted fields automatically','Use a proper CSV parser like csvtool or Python\'s csv module, as bash string splitting does not handle RFC 4180 CSV quoting rules correctly','Replace all commas with semicolons before processing'], correct: 2, explanation: 'Standard bash field splitting (IFS) and even awk do not properly handle quoted CSV fields containing delimiters. RFC 4180-compliant CSV parsing requires handling quoted fields, escaped quotes, and multi-line values. Tools like csvtool, Miller (mlr), or Python\'s csv module correctly handle these edge cases. Using the wrong tool leads to data corruption.' },
        { value: 500, question: 'A bash script runs as a cron job and occasionally fails silently. The script uses set -e but still encounters issues where a command failure in a pipeline does not cause the script to exit. What is the root cause, and which additional bash option addresses this?', options: ['set -e is broken in bash; use a different shell','Pipelines have a separate exit code behavior: set -e only checks the last command in a pipeline. Adding set -o pipefail causes the pipeline to return the exit code of the rightmost failing command, making set -e detect pipeline failures','The cron environment lacks the PATH variable; set PATH manually','set -e only works in interactive shells, not scripts'], correct: 1, explanation: 'By default, a pipeline returns the exit code of the last command only. So "failing_cmd | grep something" succeeds if grep succeeds, even if failing_cmd fails. set -o pipefail changes this behavior so the pipeline returns the exit code of the rightmost command that failed (non-zero). Combined with set -e (exit on error) and set -u (error on undefined variables), the trio set -euo pipefail is considered best practice for robust bash scripts.' }
      ]
    }
  ],
  finalJeopardy: {
    category: 'Linux Synthesis',
    question: 'A junior administrator reports that a production web server has been compromised. You SSH into the server and need to perform initial triage. The attacker may still have an active session. Which single command provides the most immediate situational awareness by showing active network connections with their owning processes?',
    options: [
      'top -u www-data',
      'ps aux | grep suspicious',
      'ss -tulnp to see all listening and established connections with process names and PIDs',
      'cat /var/log/auth.log | tail -100'
    ],
    correct: 2,
    explanation: 'ss -tulnp shows all TCP and UDP listening (-l) and established connections with numeric ports (-n) and process information (-p). This immediately reveals: active reverse shells or backdoor listeners (unusual listening ports), active attacker sessions (established connections to suspicious IPs), and which processes own the connections. This provides the broadest initial triage view. The other commands provide valuable but narrower information: top shows resource usage, ps shows processes without network context, and auth.log shows historical access but not current state.'
  },
  onComplete: function(results) {
  }
});
