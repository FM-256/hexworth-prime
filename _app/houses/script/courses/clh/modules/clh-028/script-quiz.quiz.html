<body>
    <header class="page-header">
        <a href="../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-028 Quiz: System Monitoring',
            description: 'Test your threat hunting skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-028',
            moduleId: 'clh-028',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-029: Vim Essentials', href: 'courses/clh/modules/clh-029/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'In <code>top</code>, what does a "load average" of 4.52 on a 4-core system indicate?',
                    options: [
                        'System is idle',
                        'System is at full capacity with slight queue',
                        'System is about to crash',
                        'Load average is irrelevant'
                    ],explanation: 'Load average equals number of cores means 100% utilization. 4.52 on 4 cores = slightly overloaded with processes waiting.'
                },
                {
                    question: 'Which <code>top</code> hotkey sorts processes by memory usage?',
                    options: [
                        '<code>P</code>',
                        '<code>M</code>',
                        '<code>m</code>',
                        '<code>S</code>'
                    ],explanation: '<code>M</code> sorts by memory. <code>P</code> sorts by CPU. These are the two most important sorting keys.'
                },
                {
                    question: 'What does <code>watch -n 2 "ss -tunapl"</code> do?',
                    options: [
                        'Watch a video about networking',
                        'Run ss command once after 2 minutes',
                        'Run ss command every 2 seconds continuously',
                        'Show only 2 connections'
                    ],explanation: '<code>watch -n 2</code> repeats the command every 2 seconds. Perfect for monitoring changing state like connections.'
                },
                {
                    question: 'In vmstat output, which column shows user CPU percentage?',
                    options: [
                        '<code>r</code> column',
                        '<code>us</code> column',
                        '<code>sy</code> column',
                        '<code>id</code> column'
                    ],explanation: '<code>us</code> = user CPU, <code>sy</code> = system CPU, <code>id</code> = idle. High us with unknown processes = suspicious!'
                },
                {
                    question: 'A process named "xmrig" using 85% CPU is most likely:',
                    options: [
                        'A legitimate system process',
                        'A cryptocurrency miner (threat indicator)',
                        'An Apache web server',
                        'A database process'
                    ],explanation: 'xmrig is a known cryptocurrency mining software. High CPU + strange process name = immediate red flag for compromise.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
