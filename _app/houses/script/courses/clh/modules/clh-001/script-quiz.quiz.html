    <title>CLH-001 Quiz: Hacker CLI Basics - Script House</title>
    <link rel="stylesheet" href="../../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);

        }
        /* Page-level header bar */
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        /* Brand label with scroll icon */

            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* Centre the quiz card vertically in remaining space */
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Script House</a>
        <span class="brand">
            <span>
                <img src="/assets/images/icons/icon-scroll.webp" alt=""
                     style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block">
            </span>
            Hexworth Prime
        </span>
    </header>

    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>

    <!-- QuizEngine dependencies: ProgressSystem must load first -->
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        // ═══════════════════════════════════════════════════════════════
        // CLH-001 Quiz: Hacker CLI Basics
        // 6 questions covering whoami, pwd, ls -la, id, CLI vs GUI, and
        // the dot-file convention for hidden files in Linux.
        // ═══════════════════════════════════════════════════════════════

        const quiz = new QuizEngine({
            containerId:  'quiz-container',
            title:        'CLH-001 Quiz: CLI Basics',
            description:  'Test your command line fundamentals',
            passingScore: 70,
            showFeedback: true,
            randomize:    true,
            theme:        'script',
            achievement:  'script-clh-001',
            moduleId:     'clh-001',
            serverGrading: true,
            houseId:      'script',
            nextModule: { title: 'CLH-002: Navigation & Reconnaissance', href: 'courses/clh/modules/clh-002/script-intro.module.html' },
            trackProgress: true,

            questions: [
                // ── Q1: whoami ───────────────────────────────────────
                {
                    question: 'What does the <code>whoami</code> command display?',
                    options: [
                        'The hostname of the current machine',
                        'The username of the currently running process',
                        'A list of all logged-in users',
                        'Your home directory path'
                    ],explanation: '<code>whoami</code> prints the effective username of the current process. It is the first command most operators run after gaining access to a system — knowing your privilege level is essential before taking any further action.'
                },

                // ── Q2: pwd ─────────────────────────────────────────
                {
                    question: 'What does the abbreviation <code>pwd</code> stand for, and what does it do?',
                    options: [
                        'Password — prompts for authentication',
                        'Print Working Directory — shows your current absolute path in the filesystem',
                        'Path Working Data — lists available paths',
                        'Process Working Directory — lists running processes'
                    ],explanation: '<code>pwd</code> stands for <strong>Print Working Directory</strong>. It outputs the absolute path of your current location in the filesystem. Never assume where you are — always confirm your position before operating.'
                },

                // ── Q3: ls -la flags ────────────────────────────────
                {
                    question: 'What do the <code>-l</code> and <code>-a</code> flags add to the <code>ls</code> command?',
                    options: [
                        '<code>-l</code> lists only large files; <code>-a</code> sorts alphabetically',
                        '<code>-l</code> shows long format (permissions, owner, size, date); <code>-a</code> reveals hidden files starting with a dot',
                        '<code>-l</code> follows symbolic links; <code>-a</code> shows all drives',
                        '<code>-l</code> limits output to 10 lines; <code>-a</code> shows access timestamps only'
                    ],explanation: '<code>-l</code> enables long format output showing permissions, link count, owner, group, size, and modification date. <code>-a</code> includes hidden files — those whose names begin with a dot. Combined as <code>ls -la</code> this gives you the full picture of a directory.'
                },

                // ── Q4: id command ──────────────────────────────────
                {
                    question: 'What information does the <code>id</code> command reveal?',
                    options: [
                        'The system\'s machine ID and serial number',
                        'Your user ID (uid), primary group ID (gid), and all supplementary group memberships',
                        'A list of process IDs currently running under your account',
                        'The network interface ID and MAC address'
                    ],explanation: '<code>id</code> prints your numeric <strong>uid</strong>, primary <strong>gid</strong>, and every supplementary group you belong to. Group membership determines file access and privilege escalation paths — for example, membership in the <code>sudo</code> or <code>docker</code> group can be leveraged for elevated access.'
                },

                // ── Q5: CLI vs GUI ──────────────────────────────────
                {
                    question: 'Why do security professionals prefer the CLI over graphical tools for most tasks?',
                    options: [
                        'Because GUIs are not supported on Linux',
                        'CLI tools are easier to learn than GUI applications',
                        'The CLI enables scripting, remote access via SSH, precise control, and produces less forensic noise than GUI interactions',
                        'GUI tools require administrator privileges to run'
                    ],explanation: 'The CLI is preferred for security work because it is <strong>scriptable</strong> (automate repeatable tasks), works over <strong>SSH</strong> on remote systems with no display, gives <strong>precise control</strong> over every argument, and typically generates less forensic noise than GUI activity. Nearly all professional security tooling is CLI-first.'
                },

                // ── Q6: dot-files / hidden files ────────────────────
                {
                    question: 'How does Linux determine that a file or directory is hidden from default directory listings?',
                    options: [
                        'The file has its hidden attribute bit set in the inode',
                        'The filename begins with a dot (<code>.</code>)',
                        'The file is stored in a special <code>/hidden</code> system directory',
                        'The file has no read permission for the current user'
                    ],explanation: 'In Linux, any file or directory whose name <strong>begins with a dot</strong> (e.g., <code>.bashrc</code>, <code>.ssh/</code>, <code>.secret_note</code>) is hidden from standard <code>ls</code> output. Use <code>ls -a</code> or <code>ls -la</code> to reveal them. Hidden files frequently contain configuration data, credentials, and other sensitive material.'
                }
            ]
        });

        quiz.start();
    </script>

    <!-- Flux Capacitor — House navigation / breadcrumb integration -->
</body>
</html>
