    <title>CLH-011 Quiz: Network Reconnaissance - Script House</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-011 Quiz: Network Reconnaissance',
            description: 'Test your knowledge: CLH-011 Quiz: Network Reconnaissance',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-011',
            moduleId: 'clh-011',
            houseId: 'script',
            nextModule: { title: 'CLH-012: Web Enumeration', href: 'courses/clh/modules/clh-012/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which nmap flag performs a ping sweep to find live hosts?',
                    options: [
                        '<code>nmap -sV</code>',
                        '<code>nmap -sn</code>',
                        '<code>nmap -O</code>',
                        '<code>nmap -A</code>'
                    ],
                    correct: 1,
                    explanation: '-sn (no port scan) does host discovery only - perfect for finding live systems quickly.'
                },
                {
                    question: 'What does <code>nmap -sV</code> detect?',
                    options: [
                        'Operating system',
                        'Service versions',
                        'Vulnerabilities',
                        'MAC addresses'
                    ],
                    correct: 1,
                    explanation: '-sV probes open ports to determine service/version info. Critical for finding outdated software.'
                },
                {
                    question: 'Which port is commonly used by SMB (Windows file sharing)?',
                    options: [
                        '<code>22</code>',
                        '<code>80</code>',
                        '<code>445</code>',
                        '<code>3389</code>'
                    ],
                    correct: 2,
                    explanation: 'Port 445 is SMB. It\'s been the target of major exploits like EternalBlue (WannaCry).'
                },
                {
                    question: 'What does netcat\'s <code>-z</code> flag do?',
                    options: [
                        'Enables verbose mode',
                        'Zero-I/O mode (port scanning)',
                        'Compresses data',
                        'Encrypts connection'
                    ],
                    correct: 1,
                    explanation: '-z is zero-I/O mode - just checks if ports are open without sending data. Fast port scanning.'
                },
                {
                    question: 'Which nmap output format is best for parsing with other tools?',
                    options: [
                        'Normal (<code>-oN</code>)',
                        'XML (<code>-oX</code>)',
                        'Greppable (<code>-oG</code>)',
                        'Script kiddie (<code>-oS</code>)'
                    ],
                    correct: 1,
                    explanation: 'XML output (-oX) is structured and easily parsed by tools like Metasploit, searchsploit, etc.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
