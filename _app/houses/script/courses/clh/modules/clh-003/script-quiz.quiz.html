    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);

            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-003 Quiz: Network Analysis',
            description: 'Test your packet analysis skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-003',
            moduleId: 'clh-003',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-004: Text Analysis & Pattern Hunting', href: '../clh-004/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What command reads packets from a capture file?',
                    options: [
                        '<code>tcpdump -w capture.pcap</code>',
                        '<code>tcpdump -r capture.pcap</code>',
                        '<code>tcpdump -i eth0</code>',
                        '<code>tcpdump -c 100</code>'
                    ],explanation: '-r means "read" from a file. -w would write to a file, -i specifies an interface for live capture.'
                },
                {
                    question: 'Port 4444 is commonly associated with which tool?',
                    options: [
                        'Apache web server',
                        'MySQL database',
                        'Metasploit reverse shells',
                        'SSH daemon'
                    ],explanation: 'Port 4444 is the default for Metasploit payloads. Seeing traffic on this port is a major red flag.'
                },
                {
                    question: 'What does "beaconing" traffic indicate in network forensics?',
                    options: [
                        'Normal DNS queries',
                        'File downloads',
                        'Command and Control (C2) communication',
                        'Email traffic'
                    ],explanation: 'Beaconing = regular, periodic connections typical of malware checking in with its C2 server.'
                },
                {
                    question: 'Which tcpdump filter shows only traffic to/from a specific IP?',
                    options: [
                        '<code>tcpdump port 80</code>',
                        '<code>tcpdump host 192.168.1.1</code>',
                        '<code>tcpdump -n</code>',
                        '<code>tcpdump -v</code>'
                    ],explanation: 'The "host" filter matches packets where the IP appears as either source or destination.'
                },
                {
                    question: 'What type of attack shows large volumes of outbound data to external IPs?',
                    options: [
                        'Denial of Service',
                        'SQL Injection',
                        'Data Exfiltration',
                        'Brute Force'
                    ],explanation: 'Data exfiltration involves stealing data by sending it out of the network to attacker-controlled servers.'
                }
            ]
        });
        quiz.start();
    </script>

</body>
</html>
