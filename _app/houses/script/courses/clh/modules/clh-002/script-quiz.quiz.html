<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="../../../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../../../components/AchievementManager.js"></script>
    <script src="../../../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-002 Quiz: Navigation - Script House</title>
    <link rel="stylesheet" href="../../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-002 Quiz: Navigation',
            description: 'Test your file system navigation skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-002',
            moduleId: 'clh-002',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-003: Network Analysis', href: 'courses/clh/modules/clh-003/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which directory contains system configuration files like passwd and shadow?',
                    options: [
                        '/home',
                        '/etc',
                        '/var',
                        '/tmp'
                    ],explanation: '/etc is the central location for system configuration files, including user accounts (passwd, shadow), network settings, and service configs.'
                },
                {
                    question: 'What does <code>ls -la</code> show that <code>ls</code> alone does not?',
                    options: [
                        'File sizes only',
                        'Hidden files and detailed permissions',
                        'Only directories',
                        'File creation dates'
                    ],explanation: '-l shows long format (permissions, owner, size, date) and -a shows ALL files including hidden ones (starting with a dot).'
                },
                {
                    question: 'Where would you look for SSH private keys on a Linux system?',
                    options: [
                        '/etc/ssh/',
                        '/home/[user]/.ssh/',
                        '/var/log/ssh/',
                        '/tmp/ssh/'
                    ],explanation: 'User SSH keys are stored in ~/.ssh/ (the .ssh directory in their home folder). Finding id_rsa is like finding a golden ticket.'
                },
                {
                    question: 'What command would you use to find all .conf files on the system?',
                    options: [
                        '<code>ls *.conf</code>',
                        '<code>grep .conf /</code>',
                        '<code>find / -name "*.conf"</code>',
                        '<code>cat *.conf</code>'
                    ],explanation: 'find recursively searches from a starting point. The -name flag matches file names with wildcards.'
                },
                {
                    question: 'Why is /tmp often interesting for security researchers?',
                    options: [
                        'It contains system logs',
                        'It\'s world-writable and may contain cached credentials or session data',
                        'It stores user passwords',
                        'It has the fastest disk speed'
                    ],explanation: '/tmp is world-writable, meaning any user can read/write there. Applications often dump sensitive data like session files or cache here.'
                },
                {
                    question: 'What command reveals your current location in the file system?',
                    options: [
                        '<code>cd</code>',
                        '<code>ls</code>',
                        '<code>pwd</code>',
                        '<code>where</code>'
                    ],explanation: 'pwd (Print Working Directory) shows your current absolute path. Essential for knowing exactly where you are.'
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
