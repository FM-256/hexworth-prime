<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-025 Quiz: Package Management',
            description: 'Test your apt and dpkg skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-025',
            moduleId: 'clh-025',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-026: Access Control', href: 'courses/clh/modules/clh-026/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What should you run BEFORE <code>apt install</code> to ensure you get the latest versions?',
                    options: [
                        '<code>apt upgrade</code>',
                        '<code>apt update</code>',
                        '<code>apt refresh</code>',
                        '<code>apt sync</code>'
                    ],explanation: '<code>apt update</code> refreshes the package list from repositories, ensuring you know about the latest available versions.'
                },
                {
                    question: 'Which command lists ALL installed packages?',
                    options: [
                        '<code>apt list</code>',
                        '<code>dpkg -l</code>',
                        '<code>apt installed</code>',
                        '<code>pkg list</code>'
                    ],explanation: '<code>dpkg -l</code> lists all installed packages. Pipe to grep to search: <code>dpkg -l | grep ssh</code>'
                },
                {
                    question: 'You have a .deb file on an air-gapped system with no internet. How do you install it?',
                    options: [
                        '<code>apt install file.deb</code>',
                        '<code>dpkg -i file.deb</code>',
                        '<code>apt offline file.deb</code>',
                        '<code>pkg install file.deb</code>'
                    ],explanation: '<code>dpkg -i</code> installs .deb packages directly without needing repository access. Use -r to remove.'
                },
                {
                    question: 'Why is <code>/var/log/apt/history.log</code> an OPSEC concern?',
                    options: [
                        'It uses too much disk space',
                        'It records every package you installed/removed',
                        'It slows down apt',
                        'It\'s not a concern'
                    ],explanation: 'The apt history log records timestamps and package operations, revealing what tools you installed and when.'
                },
                {
                    question: 'Which command searches for packages matching "forensic"?',
                    options: [
                        '<code>apt search forensic</code>',
                        '<code>apt-cache search forensic</code>',
                        '<code>dpkg search forensic</code>',
                        'Both <code>apt search</code> and <code>apt-cache search</code> work'
                    ],explanation: 'Both <code>apt search</code> and <code>apt-cache search</code> search package names and descriptions. apt-cache is the traditional method.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
