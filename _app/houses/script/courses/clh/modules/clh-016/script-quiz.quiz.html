    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);

            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }

            font-weight: 600;

<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-016 Quiz: System Intel',
            description: 'Test your system profiling knowledge',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-016',
            moduleId: 'clh-016',
            houseId: 'script',
            nextModule: { title: 'CLH-017: Find & Locate', href: 'courses/clh/modules/clh-017/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which command reveals the CPU architecture (x86_64, ARM, etc.)?',
                    options: [
                        '<code>free -h</code>',
                        '<code>uname -m</code>',
                        '<code>df -h</code>',
                        '<code>uptime</code>'
                    ],
                    correct: 1,
                    explanation: '<code>uname -m</code> shows the machine architecture. Critical for knowing which binaries will execute.'
                },
                {
                    question: 'You need to check if a system has enough RAM to load a 2GB memory-resident implant. Which command?',
                    options: [
                        '<code>df -h</code>',
                        '<code>du -sh</code>',
                        '<code>free -h</code>',
                        '<code>lscpu</code>'
                    ],
                    correct: 2,
                    explanation: '<code>free -h</code> shows available memory. Check the "available" column, not "free".'
                },
                {
                    question: 'A system shows 127 days uptime. What does this likely indicate?',
                    options: [
                        'The system is compromised',
                        'Security patches may not be applied',
                        'The system has no users',
                        'Hardware is failing'
                    ],
                    correct: 1,
                    explanation: 'Long uptimes often mean no kernel updates have been applied - reboots are required for kernel patches. Potential vulnerability window.'
                },
                {
                    question: 'You want to find how much space is available on /data for staging exfiltration. Which command?',
                    options: [
                        '<code>du -sh /data</code>',
                        '<code>df -h /data</code>',
                        '<code>free -h</code>',
                        '<code>lscpu</code>'
                    ],
                    correct: 1,
                    explanation: '<code>df -h</code> shows disk FREE space on mounted filesystems. <code>du</code> shows usage, not availability.'
                },
                {
                    question: 'Which <code>uname</code> flag shows the kernel version (useful for CVE mapping)?',
                    options: [
                        '<code>uname -a</code>',
                        '<code>uname -r</code>',
                        '<code>uname -n</code>',
                        '<code>uname -m</code>'
                    ],
                    correct: 1,
                    explanation: '<code>uname -r</code> shows just the kernel release version. Cross-reference with CVE databases for exploits.'
                },
                {
                    question: 'What does <code>du -sh /home/target</code> tell you?',
                    options: [
                        'Free space in /home/target',
                        'Total size of /home/target directory',
                        'Number of files in directory',
                        'Permissions on directory'
                    ],
                    correct: 1,
                    explanation: '<code>du -sh</code> gives a summary (-s) human-readable (-h) total of all files in the directory. Useful for sizing exfil targets.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
