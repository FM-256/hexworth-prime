<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../../../components/AchievementManager.js"></script>
    <script src="../../../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-008 Quiz: Advanced Scripting - Script House</title>
    <link rel="stylesheet" href="../../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-008 Quiz: Advanced Scripting',
            description: 'Test your knowledge: CLH-008 Quiz: Advanced Scripting',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-008',
            moduleId: 'clh-008',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-009: System Administration', href: '../clh-009/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'How do you declare a function-local variable in bash?',
                    options: [
                        '<code>var name="value"</code>',
                        '<code>local name="value"</code>',
                        '<code>private name="value"</code>',
                        '<code>let name="value"</code>'
                    ],explanation: 'The "local" keyword creates a variable scoped to the current function only.'
                },
                {
                    question: 'How do you iterate over all elements of an array?',
                    options: [
                        '<code>for i in $array</code>',
                        '<code>for i in ${array}</code>',
                        '<code>for i in "${array[@]}"</code>',
                        '<code>for i in array[]</code>'
                    ],explanation: '"${array[@]}" expands to all elements. The quotes preserve elements with spaces.'
                },
                {
                    question: 'What does <code>set -e</code> do in a script?',
                    options: [
                        'Enables echo mode',
                        'Exits on any command failure',
                        'Sets environment variables',
                        'Enables extended globbing'
                    ],explanation: 'set -e makes the script exit immediately if any command returns a non-zero status.'
                },
                {
                    question: 'What does <code>trap cleanup EXIT</code> do?',
                    options: [
                        'Catches keyboard interrupts only',
                        'Runs cleanup function when script exits',
                        'Prevents script from exiting',
                        'Logs all exit codes'
                    ],explanation: 'trap with EXIT runs the specified function whenever the script exits, for any reason.'
                },
                {
                    question: 'What does <code>set -u</code> protect against?',
                    options: [
                        'Undefined functions',
                        'Unset/undefined variables',
                        'User input',
                        'Unicode characters'
                    ],explanation: 'set -u treats unset variables as errors, catching typos like $NAEM instead of $NAME.'
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
