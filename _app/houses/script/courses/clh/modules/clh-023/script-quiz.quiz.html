            border-bottom: 1px solid rgba(167, 139, 250, 0.2);

            align-items: center;
        }

            color: #a78bfa;

            transition: color 0.2s;
        }

<body>
    <header class="page-header">
        <a href="../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-023 Quiz: Service Management',
            description: 'Test your systemd skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-023',
            moduleId: 'clh-023',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-024: Scheduled Tasks', href: 'courses/clh/modules/clh-024/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What does <code>systemctl enable myservice</code> do?',
                    options: [
                        'Starts the service immediately',
                        'Makes the service start automatically on boot',
                        'Shows service status',
                        'Stops the service'
                    ],explanation: '<code>enable</code> creates symlinks so the service starts automatically on boot. Use <code>start</code> to run it immediately.'
                },
                {
                    question: 'You need to view logs for the SSH daemon from the last hour. Which command?',
                    options: [
                        '<code>cat /var/log/sshd</code>',
                        '<code>journalctl -u sshd --since "1 hour ago"</code>',
                        '<code>systemctl logs sshd</code>',
                        '<code>tail -f /var/log/auth.log</code>'
                    ],explanation: '<code>journalctl -u sshd --since "1 hour ago"</code> filters logs by service unit and time range.'
                },
                {
                    question: 'A service shows "enabled" but is not running. What does this mean?',
                    options: [
                        'The service is broken',
                        'It will start on next boot but is currently stopped',
                        'The service is running in background',
                        'systemctl is malfunctioning'
                    ],explanation: '"enabled" means it will start on boot. "running" means it\'s currently active. A service can be enabled but stopped.'
                },
                {
                    question: 'Which command lists ALL running services?',
                    options: [
                        '<code>systemctl --all</code>',
                        '<code>systemctl list-units --type=service --state=running</code>',
                        '<code>ps aux | grep service</code>',
                        '<code>service --list-all</code>'
                    ],explanation: '<code>list-units --type=service --state=running</code> filters to show only running service units.'
                },
                {
                    question: 'Why would an attacker install malware as a systemd service?',
                    options: [
                        'It\'s the only way to run programs',
                        'Persistence - survives reboots and appears legitimate',
                        'It runs faster as a service',
                        'Services can\'t be detected'
                    ],explanation: 'Systemd services persist across reboots, auto-restart on failure, and blend in with hundreds of legitimate services.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
