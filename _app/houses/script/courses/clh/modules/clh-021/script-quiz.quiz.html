<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../../components/AchievementManager.js"></script>
    <script src="../../../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-021 Quiz: SSH Operations - Script House</title>
    <link rel="stylesheet" href="../../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span>📜</span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-021 Quiz: SSH Operations',
            description: 'Test your secure tunnel skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-021',
            moduleId: 'clh-021',
            houseId: 'script',
            trackProgress: true,

            questions: [
                {
                    question: 'Which key algorithm is most secure and recommended for modern operations?',
                    options: [
                        '<code>RSA 1024-bit</code>',
                        '<code>DSA</code>',
                        '<code>Ed25519</code>',
                        '<code>ECDSA 256</code>'
                    ],
                    correct: 2,
                    explanation: 'Ed25519 offers the best security with smaller keys and faster performance. RSA 1024-bit and DSA are considered weak.'
                },
                {
                    question: 'What does <code>ssh-copy-id user@host</code> do?',
                    options: [
                        'Copies SSH binary to remote host',
                        'Installs your public key in remote authorized_keys',
                        'Generates a new key pair',
                        'Copies remote keys to local machine'
                    ],
                    correct: 1,
                    explanation: 'ssh-copy-id installs your public key (~/.ssh/id_*.pub) into the remote user\'s ~/.ssh/authorized_keys file.'
                },
                {
                    question: 'You need to transfer a directory of intel files securely. Which command?',
                    options: [
                        '<code>cp -r intel/ user@host:</code>',
                        '<code>scp -r intel/ user@host:</code>',
                        '<code>ssh cp intel/ user@host:</code>',
                        '<code>ftp intel/ user@host:</code>'
                    ],
                    correct: 1,
                    explanation: '<code>scp -r</code> securely copies directories recursively over SSH encryption.'
                },
                {
                    question: 'Why should you ALWAYS set a passphrase on your SSH private key?',
                    options: [
                        'SSH requires it',
                        'It makes connections faster',
                        'It protects the key if the file is compromised',
                        'Passphrases are optional decorations'
                    ],
                    correct: 2,
                    explanation: 'A passphrase encrypts your private key. If an attacker steals the key file, they still can\'t use it without the passphrase.'
                },
                {
                    question: 'What is the purpose of <code>ssh -D 9050 user@proxy</code>?',
                    options: [
                        'Download files on port 9050',
                        'Create a SOCKS proxy for tunneling traffic',
                        'Delete files on port 9050',
                        'Direct connection bypassing encryption'
                    ],
                    correct: 1,
                    explanation: '<code>-D</code> creates a dynamic SOCKS proxy. Configure your browser/tools to use localhost:9050 and all traffic tunnels through SSH.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
