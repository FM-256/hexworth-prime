<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-024 Quiz: Scheduled Tasks - Script House</title>
    <link rel="stylesheet" href="../../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-024 Quiz: Scheduled Tasks',
            description: 'Test your cron scheduling skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-024',
            moduleId: 'clh-024',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-025: Package Management', href: '../clh-025/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What does <code>0 */6 * * *</code> mean in cron?',
                    options: [
                        'Every 6 minutes',
                        'Every 6 hours at minute 0',
                        'At 6:00 AM daily',
                        '6 times per day'
                    ],explanation: '<code>*/6</code> in the hour field means "every 6 hours", and <code>0</code> in minute means "at minute 0" of those hours.'
                },
                {
                    question: 'Why add <code>>/dev/null 2>&1</code> to a cron command?',
                    options: [
                        'Make it run faster',
                        'Suppress all output to avoid mail notifications',
                        'Enable logging',
                        'Run with elevated privileges'
                    ],explanation: 'Cron emails output to the user. Redirecting to /dev/null prevents mail alerts that could reveal your scheduled tasks.'
                },
                {
                    question: 'Which command lists your current cron jobs?',
                    options: [
                        '<code>cron -l</code>',
                        '<code>crontab -l</code>',
                        '<code>cat /etc/crontab</code>',
                        '<code>systemctl list cron</code>'
                    ],explanation: '<code>crontab -l</code> lists your user-specific cron jobs. Use -e to edit, -r to remove all.'
                },
                {
                    question: 'You need to run a script once in 24 hours, not repeatedly. Which command?',
                    options: [
                        '<code>crontab -e</code>',
                        '<code>at now + 24 hours</code>',
                        '<code>sleep 86400</code>',
                        '<code>cron --once</code>'
                    ],explanation: 'The <code>at</code> command schedules one-time tasks. <code>at now + 24 hours</code> runs once, 24 hours from now.'
                },
                {
                    question: 'Cron expression <code>0 3 * * 0</code> runs when?',
                    options: [
                        'Every Sunday at 3:00 AM',
                        'Every day at 3:00 AM',
                        'Every hour on Sunday',
                        'March 3rd at midnight'
                    ],explanation: 'Day-of-week 0 (or 7) = Sunday. Hour 3 = 3 AM. So this runs every Sunday at 3:00 AM.'
                }
            ]
        });
        quiz.start();
    </script>

    <!-- ── Dr. Hex floating mood-ring button ──────────────────────────

    <hex-ai-button mission-id="script-quiz" house="script"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
