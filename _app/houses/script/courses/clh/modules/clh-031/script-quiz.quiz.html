    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-031: BLACKOUT Debrief',
            description: 'After-action assessment — prove you mastered the Command Line Hacker path',
            passingScore: 80,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-031',
            moduleId: 'clh-031',
            houseId: 'script',
            trackProgress: true,

            questions: [
                {
                    // CLH-007 to CLH-009 + CLH-010 to CLH-012 — volatile data collection order
                    question: 'You have just gained shell access to a suspected compromised Linux host. What is the <strong>first</strong> action you should take before examining logs or the filesystem?',
                    options: [
                        'Run <code>find / -mtime -1</code> to identify recently modified files',
                        'Collect volatile data — active connections, running processes, and memory — before anything can change or be lost on reboot',
                        'Check <code>/etc/crontab</code> for persistence mechanisms',
                        'Immediately kill any suspicious processes to stop the attacker'
                    ],
                    correct: 1,
                    explanation: 'Volatile data (RAM contents, active network connections, running process list) exists only while the system is powered on. It is collected first because it is the most time-sensitive artifact. Killing processes before capturing them destroys evidence, and checking logs/filesystem can wait a few minutes. The order of volatility is foundational to incident response: memory first, then network state, then running processes, then disk artifacts.'
                },
                {
                    // CLH-004 to CLH-006 + CLH-010 to CLH-012 — log analysis with grep/awk
                    question: 'You need to find all failed SSH login attempts from the last 24 hours in <code>/var/log/auth.log</code> and count how many attempts came from each unique IP address. Which command pipeline accomplishes this?',
                    options: [
                        '<code>cat /var/log/auth.log | grep SSH | sort | uniq</code>',
                        '<code>grep "Failed password" /var/log/auth.log | awk \'{print $(NF-3)}\' | sort | uniq -c | sort -rn</code>',
                        '<code>tail -n 1000 /var/log/auth.log | grep failed</code>',
                        '<code>find /var/log -name "auth*" | xargs grep -i ssh</code>'
                    ],
                    correct: 1,
                    explanation: 'The correct pipeline uses grep to filter "Failed password" lines, awk to extract the source IP field (which is the 4th field from the end in the standard sshd log format), sorts the IPs, uses uniq -c to count consecutive duplicates, then sorts numerically in reverse to show the highest-volume attackers at the top. This is a standard analyst one-liner for brute-force investigation. The other options miss the counting and ranking step that makes the output actionable.'
                },
                {
                    // CLH-029 to CLH-030 — packet capture / network forensics
                    question: 'While reviewing a packet capture with <code>tcpdump -r capture.pcap -nn</code> you see hundreds of short UDP packets from an internal host to an external IP on port 53, each containing what appear to be base64-encoded subdomains like <code>aGVsbG8=.evil.com</code>. What attack technique does this indicate?',
                    options: [
                        'A standard high-volume DNS amplification DDoS attack against the external server',
                        'Normal DNS behavior — all DNS queries use port 53 and subdomains can be long',
                        'DNS tunneling — the attacker is encoding data inside DNS query subdomains to exfiltrate data over an allowed protocol',
                        'A DNS poisoning attack where the attacker is injecting false records into the resolver cache'
                    ],
                    correct: 2,
                    explanation: 'DNS tunneling encodes arbitrary data (often base64 or hex) into DNS query subdomains. Because DNS traffic on port 53 is almost universally allowed through firewalls, it is a favored exfiltration and C2 channel. The giveaway indicators are: high volume of DNS queries to a single domain, subdomains that look like encoded data rather than real hostnames, and consistent short packet sizes. A DDoS would be inbound traffic to the DNS server. Poisoning would involve forged responses, not queries.'
                },
                {
                    // CLH-007 to CLH-009 — process investigation and /proc
                    question: 'You run <code>ps aux</code> and find a process named <code>kworker/2:1</code> running under the <code>www-data</code> user with a high CPU usage. What makes this suspicious and how do you investigate further?',
                    options: [
                        'Nothing is suspicious — kworker processes are normal kernel worker threads and always run under www-data',
                        'It is suspicious because legitimate kworker threads run under root or a kernel context, not application users like www-data. Investigate with <code>ls -la /proc/[PID]/exe</code> to find the real binary',
                        'The high CPU usage is the only concern — kill it immediately with <code>kill -9</code>',
                        'Run <code>strace -p [PID]</code> immediately on any suspicious process as the first response action'
                    ],
                    correct: 1,
                    explanation: 'Legitimate kworker threads are kernel-level processes that always run as root (or under the kernel context, often shown as brackets like [kworker/2:1]). A process named kworker/2:1 without brackets running under www-data is a classic attacker technique: naming a malicious binary to look like a kernel thread. The /proc/[PID]/exe symlink reveals the actual binary on disk, exposing the deception. Killing it immediately before investigation destroys evidence and may not remove the persistence mechanism that will just restart it.'
                },
                {
                    // CLH-016 to CLH-018 — file permissions and SUID
                    question: 'You run <code>find / -perm -4000 -type f 2>/dev/null</code> and discover <code>/usr/local/bin/backup_util</code> in the results. A standard install of this Linux distribution should not have this binary. What does this finding mean and what is the security implication?',
                    options: [
                        'The -4000 permission means the file is hidden from normal users. The binary is likely just a system tool that requires elevated read access',
                        'The binary has the SUID (Set User ID) bit set, meaning it executes with the file owner\'s privileges (likely root) regardless of who runs it — a likely privilege escalation backdoor planted by the attacker',
                        'The binary is world-writable, meaning any user can overwrite it with malicious code',
                        'SUID on executables is standard practice for all tools in /usr/local/bin and poses no security risk'
                    ],
                    correct: 1,
                    explanation: 'The -4000 permission mask in find matches the SUID bit. When a SUID binary is executed, it runs with the effective UID of the file\'s owner — if owned by root, it gives any user who runs it root-level capabilities for the duration of execution. Attackers plant SUID copies of shells or custom binaries as persistence mechanisms because they survive password changes and user account modifications. Any SUID binary not in the expected baseline for that OS distribution must be treated as a potential backdoor until proven otherwise.'
                },
                {
                    // CLH-019 to CLH-021 — cron jobs and persistence mechanisms
                    question: 'During your investigation you need to audit all scheduled tasks on the system for attacker-planted persistence. Which set of locations must you check to get a complete picture of cron-based persistence?',
                    options: [
                        '<code>/etc/crontab</code> only — this is the system-wide cron configuration file',
                        '<code>/var/spool/cron/</code> for user crontabs only, as system cron is managed by systemd on modern Linux',
                        '<code>/etc/crontab</code>, <code>/etc/cron.d/</code>, <code>/etc/cron.hourly/</code> through <code>cron.monthly/</code>, and per-user crontabs via <code>/var/spool/cron/crontabs/</code> — all must be checked',
                        'Run <code>crontab -l</code> as root — this shows all cron jobs across all users'
                    ],
                    correct: 2,
                    explanation: 'Cron persistence is spread across multiple locations. /etc/crontab is the main system crontab. /etc/cron.d/ holds package-managed job files. /etc/cron.{hourly,daily,weekly,monthly}/ contain scripts run on those schedules. Per-user crontabs live in /var/spool/cron/crontabs/ (Debian/Ubuntu) or /var/spool/cron/ (RHEL). Running crontab -l only shows the current user\'s jobs. Attackers will use whichever location is least likely to be inspected, so a thorough audit checks all of them. Systemd timers are an additional persistence vector beyond cron that also warrant inspection.'
                },
                {
                    // CLH-022 to CLH-024 — bash scripting and one-liners
                    question: 'A colleague left this one-liner in an analysis script. What does it do?<br><br><code>for f in $(ls /var/log/*.log); do echo "=== $f ==="; grep -c "ERROR\\|CRITICAL\\|FAIL" "$f"; done</code>',
                    options: [
                        'It deletes all log files matching the pattern ERROR, CRITICAL, or FAIL from /var/log/',
                        'It iterates over each .log file in /var/log, prints its filename as a header, then prints a count of lines containing ERROR, CRITICAL, or FAIL in that file',
                        'It concatenates all log files and pipes them to grep, searching for the three terms simultaneously',
                        'It creates a new file called ERROR_CRITICAL_FAIL in each log directory as a flag marker'
                    ],
                    correct: 1,
                    explanation: 'The for loop iterates over each .log file found by ls. For each file, echo prints a separator header with the filename. grep -c counts (not prints) the number of lines matching the regex pattern. The \\| in the pattern is a literal pipe character in the regex, acting as OR — so it matches any line containing ERROR, CRITICAL, or FAIL. The output is a quick triage summary showing how many concerning entries each log file contains, useful for prioritizing which logs to examine in depth. Note: parsing ls output in a for loop is generally fragile with filenames containing spaces — a better practice uses glob expansion: for f in /var/log/*.log'
                },
                {
                    // CLH-025 to CLH-026 — database forensics and SQL
                    question: 'The SCADA historian database is running MySQL. You need to find all sensor readings inserted in the last 6 hours where the recorded value differs by more than 15% from the running average for that sensor — potential evidence of data falsification. Which query structure is the correct approach?',
                    options: [
                        '<code>SELECT * FROM readings WHERE timestamp > NOW() - INTERVAL 6 HOUR;</code>',
                        '<code>SELECT sensor_id, recorded_value, AVG(recorded_value) OVER (PARTITION BY sensor_id) AS avg_val FROM readings WHERE ABS(recorded_value - avg_val) / avg_val > 0.15;</code>',
                        '<code>SELECT sensor_id, recorded_value, avg_reading FROM readings r JOIN sensor_baselines b ON r.sensor_id = b.sensor_id WHERE r.timestamp > NOW() - INTERVAL 6 HOUR AND ABS(r.recorded_value - b.avg_reading) / b.avg_reading > 0.15;</code>',
                        '<code>SELECT * FROM readings WHERE recorded_value NOT IN (SELECT avg_reading FROM sensor_baselines);</code>'
                    ],
                    correct: 2,
                    explanation: 'The JOIN query is correct. It joins the readings table to a sensor_baselines reference table that contains trusted average values per sensor, filters to the last 6 hours, and uses the standard percentage deviation formula: ABS(actual - baseline) / baseline > 0.15. The simple timestamp filter only filters by time, no anomaly detection. The window function query attempts to use a window function but references avg_val in the WHERE clause, which is invalid SQL (window function aliases cannot be used in WHERE — use HAVING or a subquery). The NOT IN query\'s comparison is semantically wrong for this analysis. In real SCADA forensics, the baseline table contains historical norms, not the potentially-compromised recent data.'
                },
                {
                    // CLH-027 to CLH-028 — cryptography and hashing / integrity verification
                    question: 'You discover a file <code>/usr/bin/sshd</code> that looks normal but behaves strangely. You want to verify its integrity against the known-good package. You have the SHA-256 hash from the distribution\'s package manifest: <code>a3f2...d891</code>. Which command verifies the on-disk binary?',
                    options: [
                        '<code>md5sum /usr/bin/sshd</code> and compare to the SHA-256 hash from the manifest',
                        '<code>sha256sum /usr/bin/sshd</code> and compare the output hash against the manifest hash — any difference means the binary has been tampered with',
                        '<code>file /usr/bin/sshd</code> to check if it is a valid ELF binary, which confirms integrity',
                        '<code>strings /usr/bin/sshd | grep -i malware</code> to scan for malicious content'
                    ],
                    correct: 1,
                    explanation: 'sha256sum produces the same algorithm\'s output as the SHA-256 hash in the package manifest, making comparison meaningful. If the hashes differ, the binary on disk does not match what was installed from the package — evidence of tampering. md5sum uses a different algorithm and cannot be compared to a SHA-256 hash. The file command only checks the ELF header format, not the content — a replaced binary would still be a valid ELF. The strings approach is heuristic and unreliable against a professional threat actor who would avoid obvious strings. In practice, you would also verify the package manifest itself via GPG signature to ensure the baseline is trustworthy.'
                },
                {
                    // CLH overall — incident response kill chain ordering
                    question: 'During the BLACKOUT investigation you have completed initial triage. Arrange the following incident response phases in the correct operational order for this live ICS environment:<br><br>A. Remediation and recovery of affected systems<br>B. Containment — isolating affected segments to prevent spread<br>C. Evidence preservation — imaging volatile memory and disk<br>D. Threat eradication — removing attacker tooling and access<br>E. Lessons learned and final report',
                    options: [
                        'B &#8594; A &#8594; D &#8594; C &#8594; E',
                        'C &#8594; B &#8594; D &#8594; A &#8594; E',
                        'D &#8594; C &#8594; B &#8594; A &#8594; E',
                        'A &#8594; C &#8594; D &#8594; B &#8594; E'
                    ],
                    correct: 1,
                    explanation: 'The correct order is C &#8594; B &#8594; D &#8594; A &#8594; E. You must Preserve evidence first (volatile data disappears at reboot, and later legal proceedings depend on pristine evidence chains). Then Contain the incident to stop the spread and prevent further damage while preserving the environment for investigation. Then Eradicate the attacker\'s presence — removing backdoors, malware, and unauthorized accounts. Then Recover and restore systems to known-good state. Finally conduct Lessons Learned once operations are stable. In an ICS context, containment decisions are especially consequential because isolating segments can affect physical processes — which is why thorough evidence capture before containment is non-negotiable.'
                }
            ]
        });
        quiz.start();
    </script>
