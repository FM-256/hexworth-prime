        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);

            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;

            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }

            font-weight: 600;

<body>
    <header class="page-header">
        <a href="../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-019 Quiz: Disk Forensics',
            description: 'Test your disk analysis skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-019',
            moduleId: 'clh-019',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-020: User Reconnaissance', href: 'courses/clh/modules/clh-020/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which command shows ALL partitions, including unmounted ones?',
                    options: [
                        '<code>df -h</code>',
                        '<code>mount</code>',
                        '<code>lsblk</code> or <code>fdisk -l</code>',
                        '<code>du -sh</code>'
                    ],explanation: '<code>lsblk</code> and <code>fdisk -l</code> show all partitions regardless of mount status. <code>df</code> only shows mounted filesystems.'
                },
                {
                    question: 'A partition exists in <code>fdisk -l</code> but not in <code>df -h</code>. What does this mean?',
                    options: [
                        'The partition is corrupted',
                        'The partition is not mounted',
                        'The partition is encrypted',
                        'The disk is failing'
                    ],explanation: 'If a partition appears in fdisk but not df, it exists but isn\'t mounted. This is often how hidden data is stored.'
                },
                {
                    question: 'What does <code>lsblk -f</code> add to the output?',
                    options: [
                        'File count',
                        'Filesystem type and UUID',
                        'Free space',
                        'File permissions'
                    ],explanation: 'The -f flag adds filesystem type, label, and UUID. Useful for identifying encrypted volumes (LUKS shows as crypto_LUKS).'
                },
                {
                    question: '<code>df</code> shows 750GB used, but <code>du -sh /*</code> only accounts for 700GB. Why?',
                    options: [
                        'Disk error',
                        'Hidden files or deleted but open files',
                        'df is inaccurate',
                        'Filesystem overhead'
                    ],explanation: 'The discrepancy often indicates hidden directories (starting with .) or files deleted but still held open by processes.'
                },
                {
                    question: 'Which command would you use to mount a discovered hidden partition?',
                    options: [
                        '<code>fdisk /dev/sda3</code>',
                        '<code>lsblk /dev/sda3</code>',
                        '<code>mount /dev/sda3 /mnt/evidence</code>',
                        '<code>df /dev/sda3</code>'
                    ],explanation: '<code>mount</code> attaches a partition to a mount point, making its contents accessible for examination.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
