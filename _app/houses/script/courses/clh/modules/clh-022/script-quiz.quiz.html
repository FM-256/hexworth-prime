<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../../../components/AchievementManager.js"></script>
    <script src="../../../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-022 Quiz: Network Reconnaissance - Script House</title>
    <link rel="stylesheet" href="../../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-022 Quiz: Network Reconnaissance',
            description: 'Test your infrastructure probing skills',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-022',
            moduleId: 'clh-022',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-023: Service Management', href: '../clh-023/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which command fetches HTTP headers only (without downloading the body)?',
                    options: [
                        '<code>wget -h url</code>',
                        '<code>curl -I url</code>',
                        '<code>dig url</code>',
                        '<code>nc -h url</code>'
                    ],explanation: '<code>curl -I</code> (capital I) sends a HEAD request, returning only headers. Perfect for fingerprinting servers without downloading content.'
                },
                {
                    question: 'You need to find a target\'s mail server. Which command?',
                    options: [
                        '<code>dig target.com A</code>',
                        '<code>dig target.com MX</code>',
                        '<code>curl target.com/mail</code>',
                        '<code>wget target.com/mx</code>'
                    ],explanation: '<code>dig target.com MX</code> queries the MX (Mail eXchange) record, revealing which servers handle email for the domain.'
                },
                {
                    question: 'What does <code>nc -zv target 22 80 443</code> do?',
                    options: [
                        'Downloads files from ports 22, 80, 443',
                        'Scans ports 22, 80, 443 for open services',
                        'Creates a backdoor on ports 22, 80, 443',
                        'Blocks traffic on ports 22, 80, 443'
                    ],explanation: '<code>nc -z</code> scans ports without sending data (zero-I/O mode), and <code>-v</code> shows verbose results for each port.'
                },
                {
                    question: 'You need to download a file quietly without console output. Which command?',
                    options: [
                        '<code>curl file.pdf</code>',
                        '<code>wget -q file.pdf</code>',
                        '<code>dig file.pdf</code>',
                        '<code>nc file.pdf</code>'
                    ],explanation: '<code>wget -q</code> (quiet mode) downloads files without progress bars or messages - perfect for scripts or covert operations.'
                },
                {
                    question: 'The server responds with "nginx/1.18.0" in headers. Why is this valuable intel?',
                    options: [
                        'It means the site is secure',
                        'You can search for known vulnerabilities in that version',
                        'nginx is always safe',
                        'It\'s just decoration'
                    ],explanation: 'Server version disclosure lets you search CVE databases for known vulnerabilities specific to that software version.'
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
