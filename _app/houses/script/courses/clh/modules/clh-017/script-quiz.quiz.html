<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../../../components/AchievementManager.js"></script>
    <script src="../../../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-017 Quiz: Find & Locate - Script House</title>
    <link rel="stylesheet" href="../../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-017 Quiz: Find & Locate',
            description: 'Test your file hunting knowledge',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-017',
            moduleId: 'clh-017',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-018: Archive Operations', href: 'courses/clh/modules/clh-018/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which command finds all SUID binaries that could be privilege escalation backdoors?',
                    options: [
                        '<code>find / -name "suid" 2>/dev/null</code>',
                        '<code>find / -perm -4000 2>/dev/null</code>',
                        '<code>locate suid</code>',
                        '<code>which -a suid</code>'
                    ],explanation: '<code>-perm -4000</code> matches files with the SUID bit set. These run as the file owner (often root).'
                },
                {
                    question: 'Why might <code>locate</code> miss a file that was just created?',
                    options: [
                        'locate cannot search the entire filesystem',
                        'The file is hidden (starts with dot)',
                        'The locate database hasn\'t been updated',
                        'locate only finds directories'
                    ],explanation: '<code>locate</code> uses a pre-built database. Run <code>updatedb</code> to refresh it.'
                },
                {
                    question: 'Find all hidden files (dot-files) in /home that are regular files, not directories:',
                    options: [
                        '<code>find /home -name ".*"</code>',
                        '<code>find /home -name ".*" -type f</code>',
                        '<code>ls -la /home</code>',
                        '<code>locate ".*"</code>'
                    ],explanation: '<code>-name ".*"</code> matches dot-files, <code>-type f</code> restricts to regular files only.'
                },
                {
                    question: 'What does <code>which python</code> tell you?',
                    options: [
                        'All Python files on the system',
                        'The Python version installed',
                        'The path to the python executable in PATH',
                        'Python\'s configuration'
                    ],explanation: '<code>which</code> shows the full path of the executable that runs when you type a command.'
                },
                {
                    question: 'Find files modified in the last 24 hours in /tmp:',
                    options: [
                        '<code>find /tmp -mtime 1</code>',
                        '<code>find /tmp -mtime -1</code>',
                        '<code>find /tmp -atime -1</code>',
                        '<code>locate -mtime /tmp</code>'
                    ],explanation: '<code>-mtime -1</code> means modified less than 1 day ago. The minus sign is crucial!'
                },
                {
                    question: 'What\'s the difference between <code>which</code> and <code>whereis</code>?',
                    options: [
                        'which is faster',
                        'whereis also finds man pages and source files',
                        'which finds all files, whereis only binaries',
                        'There is no difference'
                    ],explanation: '<code>whereis</code> searches for binaries, source code, AND man pages. <code>which</code> only finds executables in PATH.'
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
