<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../../components/AchievementManager.js"></script>
    <script src="../../../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-004 Quiz: Pattern Hunting - Script House</title>
    <link rel="stylesheet" href="../../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-004 Quiz: Pattern Hunting',
            description: 'Test your knowledge: CLH-004 Quiz: Pattern Hunting',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-004',
            moduleId: 'clh-004',
            houseId: 'script',
            trackProgress: true,

            questions: [
                {
                    question: 'What does the <code>-n</code> flag do in grep?',
                    options: [
                        'Disable output',
                        'Show line numbers',
                        'Case-insensitive search',
                        'Recursive search'
                    ],
                    correct: 1,
                    explanation: 'The -n flag shows line numbers for each matching line, which is crucial for pinpointing exactly where matches occur.'
                },
                {
                    question: 'Which command finds all lines containing "error" in auth.log, ignoring case?',
                    options: [
                        '<code>grep "error" auth.log</code>',
                        '<code>grep -i "error" auth.log</code>',
                        '<code>grep -v "error" auth.log</code>',
                        '<code>grep -c "error" auth.log</code>'
                    ],
                    correct: 1,
                    explanation: 'The -i flag makes grep case-insensitive, matching "error", "Error", "ERROR", etc.'
                },
                {
                    question: 'In regex, what does the <code>^</code> symbol match?',
                    options: [
                        'End of line',
                        'Start of line',
                        'Any character',
                        'One or more'
                    ],
                    correct: 1,
                    explanation: 'The caret (^) anchors the pattern to the start of a line. For example, ^Error only matches lines that BEGIN with "Error".'
                },
                {
                    question: 'What does the regex pattern <code>[0-9]+</code> match?',
                    options: [
                        'Exactly one digit',
                        'Zero digits',
                        'One or more digits',
                        'Only the number 9'
                    ],
                    correct: 2,
                    explanation: '[0-9] matches any single digit, and + means "one or more of the preceding." So [0-9]+ matches strings like "1", "42", "12345".'
                },
                {
                    question: 'Which grep command would count how many lines contain "failed"?',
                    options: [
                        '<code>grep "failed" log.txt | wc -l</code>',
                        '<code>grep -c "failed" log.txt</code>',
                        '<code>Both A and B work</code>',
                        '<code>grep -n "failed" log.txt</code>'
                    ],
                    correct: 2,
                    explanation: 'Both methods work: -c is the built-in count flag, while piping to wc -l (word count -lines) also counts matches. The -c flag is more efficient.'
                },
                {
                    question: 'To find lines that do NOT contain "debug" in a log file, use:',
                    options: [
                        '<code>grep "debug" log.txt</code>',
                        '<code>grep -i "debug" log.txt</code>',
                        '<code>grep -v "debug" log.txt</code>',
                        '<code>grep -n "debug" log.txt</code>'
                    ],
                    correct: 2,
                    explanation: 'The -v flag inverts the match, showing only lines that do NOT contain the pattern. Essential for filtering out noise in logs.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
