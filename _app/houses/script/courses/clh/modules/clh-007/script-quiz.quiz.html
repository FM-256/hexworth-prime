<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../../components/AchievementManager.js"></script>
    <script src="../../../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-007 Quiz: Scripting Basics - Script House</title>
    <link rel="stylesheet" href="../../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-007 Quiz: Scripting Basics',
            description: 'Test your knowledge: CLH-007 Quiz: Scripting Basics',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-007',
            moduleId: 'clh-007',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-008: Advanced Shell Scripting', href: 'courses/clh/modules/clh-008/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What is the shebang line for a bash script?',
                    options: [
                        '<code>#/bin/bash</code>',
                        '<code>#!/bin/bash</code>',
                        '<code>!#/bin/bash</code>',
                        '<code>//bin/bash</code>'
                    ],explanation: '#!/bin/bash tells the system to use bash as the interpreter.'
                },
                {
                    question: 'How do you access the first argument passed to a script?',
                    options: [
                        '<code>$0</code>',
                        '<code>$1</code>',
                        '<code>$ARG1</code>',
                        '<code>@1</code>'
                    ],explanation: '$1 is the first argument, $2 is second, etc. $0 is the script name itself.'
                },
                {
                    question: 'Which captures command output into a variable?',
                    options: [
                        '<code>VAR=command</code>',
                        '<code>VAR=${command}</code>',
                        '<code>VAR=$(command)</code>',
                        '<code>VAR=`command`</code> or <code>$(command)</code>'
                    ],explanation: 'Both backticks and $() work, but $() is preferred (nestable, clearer).'
                },
                {
                    question: 'Make a script executable with:',
                    options: [
                        '<code>chmod +x script.sh</code>',
                        '<code>exec script.sh</code>',
                        '<code>run script.sh</code>',
                        '<code>./script.sh</code>'
                    ],explanation: 'chmod +x adds execute permission. Then you can run it with ./script.sh'
                },
                {
                    question: 'In a for loop, which syntax is correct?',
                    options: [
                        '<code>for i in 1 2 3; do echo $i; done</code>',
                        '<code>for (i=1; i<3; i++) { echo $i }</code>',
                        '<code>foreach i (1 2 3) echo $i end</code>',
                        '<code>loop i = 1 to 3 echo $i</code>'
                    ],explanation: 'Bash uses for...in...do...done syntax. The semicolons separate statements on one line.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
