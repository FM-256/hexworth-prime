<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../../components/FirebaseAuth.js"></script>
    <script src="../../../../../../components/AchievementManager.js"></script>
    <script src="../../../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-009 Quiz: System Administration - Script House</title>
    <link rel="stylesheet" href="../../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-009 Quiz: System Administration',
            description: 'Test your knowledge: CLH-009 Quiz: System Administration',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-009',
            moduleId: 'clh-009',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-010: Log Analysis & Forensics', href: 'courses/clh/modules/clh-010/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'Which file contains hashed passwords (root access required)?',
                    options: [
                        '<code>/etc/passwd</code>',
                        '<code>/etc/shadow</code>',
                        '<code>/etc/users</code>',
                        '<code>/etc/credentials</code>'
                    ],explanation: '/etc/shadow stores password hashes and is only readable by root for security.'
                },
                {
                    question: 'Add user "bob" to the "docker" group without removing existing groups:',
                    options: [
                        '<code>usermod -G docker bob</code>',
                        '<code>usermod -aG docker bob</code>',
                        '<code>groupadd bob docker</code>',
                        '<code>adduser docker bob</code>'
                    ],explanation: '-aG means "append to Groups". Without -a, it would REPLACE all groups!'
                },
                {
                    question: 'Make a service start automatically on boot:',
                    options: [
                        '<code>systemctl start nginx</code>',
                        '<code>systemctl enable nginx</code>',
                        '<code>systemctl boot nginx</code>',
                        '<code>systemctl auto nginx</code>'
                    ],explanation: '"enable" creates symlinks so the service starts on boot. "start" only starts it now.'
                },
                {
                    question: 'What does cron entry <code>0 0 * * *</code> mean?',
                    options: [
                        'Every minute',
                        'Every hour',
                        'Every day at midnight',
                        'Every month'
                    ],explanation: 'minute=0, hour=0 means midnight. The asterisks (*) mean "every" for day/month/weekday.'
                },
                {
                    question: 'Which command shows currently logged-in users with their activity?',
                    options: [
                        '<code>who</code>',
                        '<code>w</code>',
                        '<code>users</code>',
                        '<code>logged</code>'
                    ],explanation: '"w" shows logged-in users plus what they\'re running, load average, and uptime. Most detailed.'
                }
            ]
        });
        quiz.start();
    </script>
</body>
</html>
