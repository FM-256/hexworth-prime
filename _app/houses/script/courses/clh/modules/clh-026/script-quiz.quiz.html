<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../../../components/AchievementManager.js"></script>
    <script src="../../../../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-026 Quiz: Access Control - Script House</title>
    <link rel="stylesheet" href="../../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-026 Quiz: Access Control',
            description: 'Test your privilege escalation knowledge',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-026',
            moduleId: 'clh-026',
            houseId: 'script',
            trackProgress: true,

            questions: [
                {
                    question: 'What command shows your current sudo privileges?',
                    options: [
                        '<code>sudo show</code>',
                        '<code>sudo -l</code>',
                        '<code>sudoers -list</code>',
                        '<code>cat /etc/sudoers</code>'
                    ],
                    correct: 1,
                    explanation: '<code>sudo -l</code> lists all commands you can run with sudo, including NOPASSWD entries.'
                },
                {
                    question: 'Why is <code>(root) NOPASSWD: /usr/bin/vim</code> dangerous in sudoers?',
                    options: [
                        'vim is slow',
                        'vim can spawn a root shell via :!bash',
                        'vim needs a license',
                        'vim is deprecated'
                    ],
                    correct: 1,
                    explanation: 'vim allows shell escapes with :!command. Running vim as root means you can escape to a root shell.'
                },
                {
                    question: 'What\'s the difference between <code>su</code> and <code>sudo</code>?',
                    options: [
                        'They\'re the same',
                        '<code>su</code> switches user entirely, <code>sudo</code> runs one command as another user',
                        '<code>sudo</code> is older',
                        '<code>su</code> only works on Sundays'
                    ],
                    correct: 1,
                    explanation: '<code>su</code> switches your entire session to another user. <code>sudo</code> runs a single command as another user.'
                },
                {
                    question: 'Which command safely edits /etc/sudoers with syntax checking?',
                    options: [
                        '<code>nano /etc/sudoers</code>',
                        '<code>vim /etc/sudoers</code>',
                        '<code>visudo</code>',
                        '<code>sudo edit sudoers</code>'
                    ],
                    correct: 2,
                    explanation: '<code>visudo</code> validates syntax before saving. A syntax error in sudoers can lock you out!'
                },
                {
                    question: 'You have sudo access to <code>/usr/bin/less</code>. How do you escalate?',
                    options: [
                        'You can\'t escalate with less',
                        'Type <code>!bash</code> while in less to spawn a shell',
                        'less automatically gives root',
                        'Delete the less binary'
                    ],
                    correct: 1,
                    explanation: 'Like vim, less allows shell escapes. Type ! followed by a command to execute it as the sudo user.'
                }
            ]
        });
        quiz.start();
    </script>
<script src="../../../../../../components/FluxCapacitor.js"></script>
</body>
</html>
