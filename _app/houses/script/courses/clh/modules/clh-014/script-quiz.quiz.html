<html lang="en">

    <title>CLH-014 Quiz: Automation & Tooling - Script House</title>
    <link rel="stylesheet" href="../../../../../../styles/quiz-engine.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d2145 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .page-header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #c4b5fd; }
        .brand {
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        #quiz-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../../../../index.html">&larr; Back to Script House</a>
        <span class="brand"><span><img src="/assets/images/icons/icon-scroll.webp" alt="" style="width:1.1em;height:1.1em;vertical-align:middle;display:inline-block"></span> Hexworth Prime</span>
    </header>
    <main class="quiz-wrapper">
        <div id="quiz-container"></div>
    </main>
    <script src="../../../../../../components/ProgressSystem.js"></script>
    <script src="../../../../../../components/QuizEngine.js"></script>
    <script>
        const quiz = new QuizEngine({
            containerId: 'quiz-container',
            title: 'CLH-014 Quiz: Automation & Tooling',
            description: 'Test your knowledge: CLH-014 Quiz: Automation & Tooling',
            passingScore: 70,
            showFeedback: true,
            randomize: true,
            theme: 'script',
            achievement: 'script-clh-014',
            moduleId: 'clh-014',
            serverGrading: true,
            houseId: 'script',
            nextModule: { title: 'CLH-015: Capstone Challenge', href: '../clh-015/script-intro.module.html' },
            trackProgress: true,

            questions: [
                {
                    question: 'What does <code>set -euo pipefail</code> do?',
                    options: [
                        'Enables debugging output',
                        'Strict mode: exit on error, undefined vars, pipe failures',
                        'Sets environment variables',
                        'Enables parallel execution'
                    ],explanation: '-e exits on error, -u treats unset vars as errors, -o pipefail catches pipe failures. Essential for safe scripts.'
                },
                {
                    question: 'What does <code>getopts "o:vh"</code> parse?',
                    options: [
                        '-o (with arg), -v, -h flags',
                        '-o, -v (with arg), -h flags',
                        'Only -o flag',
                        '-ovh as single flag'
                    ],explanation: 'The colon after "o" means -o requires an argument. -v and -h are simple flags.'
                },
                {
                    question: 'How do you make a function available to subprocesses?',
                    options: [
                        '<code>global -f func</code>',
                        '<code>export -f func</code>',
                        '<code>source func</code>',
                        '<code>declare -g func</code>'
                    ],explanation: 'export -f exports a function to child processes. Needed for xargs and parallel execution.'
                },
                {
                    question: 'Run 4 parallel processes with xargs:',
                    options: [
                        '<code>xargs -n 4</code>',
                        '<code>xargs -P 4</code>',
                        '<code>xargs -j 4</code>',
                        '<code>xargs -t 4</code>'
                    ],explanation: '-P sets max parallel processes. -n sets args per command, -t is trace mode.'
                },
                {
                    question: 'What\'s the best practice for tool output directories?',
                    options: [
                        'Overwrite previous results',
                        'Use fixed directory name',
                        'Timestamped directories',
                        'Output to /tmp'
                    ],explanation: 'Timestamped directories preserve history and prevent accidental overwrites. Essential for audit trails.'
                }
            ]
        });
        quiz.start();
    </script>

    <hex-ai-button mission-id="script-quiz" house="script"></hex-ai-button>
    <script type="module" src="/_lib/HexAIButton.js"></script>
</body>
</html>
