        // Grade the practice challenges for the active sandbox session (server-verified
        // via the lab-manager), render per-challenge results, and award the Linux
        // Practitioner badge on full completion.
        async function gradePractice() {
            var out = document.getElementById('obs-grade-result');
            if (!out) return;
            var sid = window.__obsSandboxSession;
            if (!sid) { out.textContent = 'Launch the sandbox first, then grade.'; return; }
            out.textContent = 'Checking your work...';
            try {
                var r = await SandboxLauncher.checkPractice(sid);
                out.innerHTML = '';
                var head = document.createElement('div');
                head.className = 'obs-grade-head';
                head.textContent = r.passed + ' / ' + r.total + ' challenges complete';
                out.appendChild(head);
                var ul = document.createElement('ul');
                ul.className = 'obs-grade-list';
                (r.results || []).forEach(function (c) {
                    // textContent (not innerHTML) — descriptions are server-controlled but never trusted into markup.
                    var li = document.createElement('li');
                    li.className = c.pass ? 'ok' : 'no';
                    li.textContent = (c.pass ? '✓ ' : '✗ ') + c.desc;
                    ul.appendChild(li);
                });
                out.appendChild(ul);
                // Any real progress lights the "Getting There" easter-egg badge (idempotent).
                if (r.passed >= 1) awardBadge('sandbox_getting_there');
                if (r.complete) {
                    var newly = awardBadge('linux_sandbox_practitioner');
                    var badge = document.createElement('div');
                    badge.className = 'obs-grade-badge';
                    badge.textContent = newly ? 'Badge earned: Linux Practitioner!' : 'All complete. Badge already earned.';
                    out.appendChild(badge);
                }
            } catch (e) {
                out.textContent = 'Could not grade right now. Make sure your sandbox is still running.';
            }
        }

        // Wire the grade button once (idempotent — mountSandbox may retry).
        function wireSandboxGrader() {
            var btn = document.getElementById('obs-grade-btn');
            if (btn && !btn.__wired) { btn.__wired = true; btn.addEventListener('click', gradePractice); }
        }

        // ===== Linux Command Mastery missions =====
        // Story missions in the same sandbox. Catalog comes from the lab-manager
        // (metadata only — check commands never leave the server). Selecting a
        // mission makes the SAME launch button seed the mission world (renderButton
        // options.mission callback). Grading uses /check?mission (rich per-task
        // feedback); the badge is claimed via the awardMissionBadge CF, which
        // re-grades server-side and writes the achievement itself.
        window.__obsSelectedMission = null;

        // Per-card lifecycle chips + Start/Resume button text from the durable
        // progress doc (marathon L3). Advisory display only — server badges
        // remain the completion truth.
        function refreshMissionCards() {
            var prog = readProgress();
            document.querySelectorAll('.obs-mission-card[data-mission]').forEach(function (card) {
                var m = prog.missions[card.dataset.mission];
                var head = card.querySelector('.obs-mission-card__head');
                if (!head) return;
                var chip = head.querySelector('.obs-mission-card__state');
                if (m && (m.status === 'in_progress' || m.status === 'completed')) {
                    if (!chip) { chip = document.createElement('span'); head.appendChild(chip); }
                    var done = m.status === 'completed';
                    chip.className = 'obs-mission-card__state ' + (done ? 'obs-mission-card__state--done' : 'obs-mission-card__state--progress');
                    chip.textContent = done ? 'Completed' : 'In progress';
                    var btn = card.querySelector('.obs-mission-card__start');
                    if (btn) btn.textContent = done ? 'Replay Mission' : 'Resume Mission';
                } else if (chip) {
                    chip.remove();
                    var b = card.querySelector('.obs-mission-card__start');
                    if (b) b.textContent = 'Start Mission';
                }
            });
        }

        // L3 STOP: back to free-play. Selection + refresh-restore record are
        // cleared; the durable doc keeps the mission in_progress (resumable);
        // the free-play grade block returns. Server session.mission remains set
        // (inert for the workspace UI; known server wart — task #94, prod fix
        // is a lab-manager change outside tonight's side-channel scope).
        function stopMission() {
            window.__obsSelectedMission = null;
            try { localStorage.removeItem('hexworth_obs_active_mission'); } catch (e) { /* non-fatal */ }
            var ws = document.getElementById('obs-mission-workspace');
            if (ws) ws.style.display = 'none';
            document.querySelectorAll('.obs-mission-card.selected').forEach(function (c) { c.classList.remove('selected'); });
            // free-play tooling comes back when a session is live
            var g = document.getElementById('obs-sandbox-grade');
            if (g && window.__obsSandboxSession) g.style.display = '';
        }

        // Fetch and paint the mission catalog. Failure degrades to a quiet note —
        // free-play and the legacy grader are unaffected.
        async function renderMissionsPanel() {
            var list = document.getElementById('obs-missions-list');
            if (!list) return;
            var cat;
            try { cat = await SandboxLauncher.listMissions(); }
            catch (e) { list.textContent = 'Missions are unavailable right now.'; return; }
            list.innerHTML = '';
            // Curriculum order (QC 2026-07-09): the API returns alphabetical-id
            // order (01, 03, 13...). Sort by the TOP-LEVEL numeric `tier`
            // (mission number 1-18). NOTE: tasks[].tier inside each mission is
            // a DIFFERENT field (bronze/silver/gold strings) - do not confuse
            // the two when grepping.
            window.__obsMissionCatalog = {};   // id -> catalog entry (title/star/tasks) for the workspace + refresh-restore
            (cat.missions || []).slice().sort(function (a, b) {
                return (a.tier || 99) - (b.tier || 99);
            }).forEach(function (m) {
                window.__obsMissionCatalog[m.id] = m;
                var card = document.createElement('div');
                card.className = 'obs-mission-card';
                card.dataset.mission = m.id;
                // All content via textContent — catalog is server-controlled but never trusted into markup.
                var head = document.createElement('div');
                head.className = 'obs-mission-card__head';
                var title = document.createElement('strong');
                title.textContent = m.title;
                var star = document.createElement('span');
                star.className = 'obs-mission-card__star';
                star.textContent = m.command_star;
                head.appendChild(title); head.appendChild(star);
                var story = document.createElement('p');
                story.className = 'obs-mission-card__story';
                story.textContent = m.story;
                var meta = document.createElement('div');
                meta.className = 'obs-mission-card__meta';
                meta.textContent = m.taskCount + ' graded tasks · badge: ' + (m.badge && m.badge.name || m.id);
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'obs-mission-card__start';
                btn.textContent = 'Start Mission';
                btn.addEventListener('click', function () { startMission(m, card); });
                card.appendChild(head); card.appendChild(story); card.appendChild(meta);
                // Beginner field guide (MissionFieldGuide.js): teaches the mission
                // command's moves before the riddle-style briefs. Collapsed by
                // default; silently no-ops for mission ids without a guide.
                if (window.MissionFieldGuide) {
                    MissionFieldGuide.attach(card, m.id, m.command_star);
                    // Un-crunch (operator 2026-07-09): an OPEN guide stretches its
                    // card to the full flex row so the manual gets real width.
                    var cardGuide = card.querySelector('details.mission-fieldguide');
                    if (cardGuide) cardGuide.addEventListener('toggle', function () {
                        card.classList.toggle('obs-mission-card--wide', cardGuide.open);
                        // Overflow hint computed at open time (closed <details>
                        // reports zero heights; Chris gate 2026-07-09).
                        if (cardGuide.open) addScrollHint(cardGuide.querySelector('.mission-fieldguide__list'));
                    });
                }
                card.appendChild(btn);
                list.appendChild(card);
            });
            if (!list.children.length) list.textContent = 'No missions published yet.';
            // Refresh-restore runs HERE (not in mountSandbox) because it needs the
            // catalog map this fetch just built. Isolated: a restore throw must
            // never take down the freshly painted mission list.
            try { restoreMissionWorkspace(); } catch (e) { /* restore is best-effort */ }
            // Lifecycle chips paint AFTER the cards exist (marathon L3).
            try { refreshMissionCards(); } catch (e) { /* chips are cosmetic */ }
        }

        // Overflow honesty (Chris gate 2026-07-09: 7 of 17 manual rows were
        // silently clipped). Appends a muted hint AS A SIBLING AFTER the list —
        // outside the scroll box, so it can never scroll away with the content
        // (adversarial review pinned this exact insertion) — only when content
        // actually clips, idempotent across repaints. display:none lists report
        // zero heights, so callers must invoke this only while visible.
        function addScrollHint(listEl) {
            if (!listEl || listEl.scrollHeight <= listEl.clientHeight) return;
            var next = listEl.nextElementSibling;
            if (next && next.classList && next.classList.contains('obs-scroll-hint')) return;
            var hint = document.createElement('div');
            hint.className = 'obs-scroll-hint';
            hint.textContent = 'Scroll the list — more below';
            listEl.parentNode.insertBefore(hint, listEl.nextSibling);
        }

        // ══ Durable sandbox progress (marathon L1, 2026-07-10) ══════════════
        // ONE localStorage key, cross-device via LabStateSync (users/{uid}/sync,
        // owner read/write already in firestore.rules). ADVISORY trust tier:
        // completion truth stays with server proof docs / badge claims — no UI
        // gates a server award on this doc. Schema v1:
        //   { v:1, updatedAt, tutorial:{step,done}, missions:{ [id]:{status,
        //     startedAt, lastGrade:{passed,total,at}, completedAt } } }
        var OBS_PROG_LS = 'hexworth_obs_sandbox_progress';
        // LabStateSync resolves Firestore via FirestoreManager.getDb(); this page
        // boots ArenaFirebase instead — bridge the handle, presence-guarded,
        // never overriding a real FirestoreManager.
        if (!window.FirestoreManager) {
            window.FirestoreManager = { getDb: function () {
                try { return (window.ArenaFirebase && ArenaFirebase.db) || null; } catch (e) { return null; }
            } };
        }
        // Single normalizer: delegate to ObservatoryBadges.readProgress (loaded
        // above), which applies this exact schema-v1 guard. Retired the local copy
        // 2026-07-11 (#96, Chris QC) so the sandbox page and the Trophy Cabinet read
        // progress through ONE function and cannot diverge on malformed docs.
        // OBS_PROG_LS === ObservatoryBadges.PROG_LS (same key), verified.
        function readProgress() { return ObservatoryBadges.readProgress(); }
        // THE ONLY write path (adversarial review L1 hard requirement): every
        // writer passes a mutator; read-current -> mutate -> persist -> queue
        // cloud push. Independent read-modify-writes would clobber each other
        // same-tab across the four writer call sites.
        function writeProgress(mutator) {
            var p = readProgress();
            try { mutator(p); } catch (e) { return p; }
            p.updatedAt = Date.now();
            try { localStorage.setItem(OBS_PROG_LS, JSON.stringify(p)); } catch (e) { /* private mode */ }
            try { if (window.LabStateSync) LabStateSync.queuePush(OBS_PROG_LS); } catch (e) { /* offline no-op */ }
            return p;
        }
        // Boot: register + pull (cloud newer -> restores localStorage; the
        // restored event re-paints anything progress-derived).
        try {
            if (window.LabStateSync) { LabStateSync.register(OBS_PROG_LS); LabStateSync.pull(); }
            window.addEventListener('hexworth:progressRestored', function () {
                try { refreshMissionCards(); } catch (e) { /* pre-render */ }
                try { initTutorial(); } catch (e) { /* pre-render */ }
            });
        } catch (e) { /* sync optional */ }

        // Paint the Mission Workspace (above the terminal): mission identity +
        // pending task checklist from CATALOG metadata (briefs are server-side
        // token-substituted; hidden briefs are server-masked to 'Hidden
        // requirement'). Costs zero grading calls — real ✓/✗ verdicts render
        // over this only when the student clicks Grade mission.
        function paintWorkspace(m, noteText) {
            var ws = document.getElementById('obs-mission-workspace');
            if (!ws) return;
            var title = document.getElementById('obs-mission-ws-title');
            if (title) title.textContent = m.title;
            var star = document.getElementById('obs-mission-ws-star');
            if (star) star.textContent = m.command_star;
            var note = document.getElementById('obs-mission-ws-note');
            if (note) note.textContent = noteText || '';
            // The mission's field guide (beginner manual) at full width, next to
            // the terminal. Container is CLEARED each repaint so mission switches
            // and restores never stack duplicate guides; unknown mission ids
            // no-op inside attach and leave it empty. Open by default only on
            // the student's FIRST mission start ever — afterwards collapsed, so
            // veterans' terminals are never pushed down (adversarial review
            // 2026-07-09; the list's own 240px scroll cap bounds the open case).
            var guideBox = document.getElementById('obs-mission-ws-guide');
            if (guideBox) {
                guideBox.textContent = '';
                if (window.MissionFieldGuide) {
                    MissionFieldGuide.attach(guideBox, m.id, m.command_star);
                    var det = guideBox.querySelector('details.mission-fieldguide');
                    if (det) {
                        var seenGuide = false;
                        try { seenGuide = localStorage.getItem('obs_fieldguide_seen') === '1'; } catch (e) { /* private mode */ }
                        det.open = !seenGuide;
                        try { localStorage.setItem('obs_fieldguide_seen', '1'); } catch (e) { /* non-fatal */ }
                    }
                }
            }
            var hint = document.getElementById('obs-mission-grade-hint');
            if (hint) hint.textContent = '';
            var out = document.getElementById('obs-mission-grade-result');
            if (out) {
                out.innerHTML = '';
                var head = document.createElement('div');
                head.className = 'obs-grade-head';
                head.textContent = 'Your tasks (' + ((m.tasks && m.tasks.length) || m.taskCount) + ') — click Grade mission to check them:';
                out.appendChild(head);
                var ul = document.createElement('ul');
                ul.className = 'obs-grade-list';
                (m.tasks || []).forEach(function (t) {
                    // textContent only — catalog is server-controlled but never trusted into markup.
                    var li = document.createElement('li');
                    li.className = 'todo';
                    // Catalog briefs are substituted server-side with an EMPTY env
                    // (no session exists yet), so per-box values fall back to the
                    // literal '[assigned at launch]' — rewrite it so a beginner
                    // can never copy it verbatim into a file (Chris gate
                    // 2026-07-09). Grading replaces this checklist with briefs
                    // resolved against the box's real seeded values.
                    // No bullet prefix: the workspace checklist is CSS-numbered
                    // (counter on li:not(.obs-grade-feedback); Chris gate 2026-07-09).
                    li.textContent = (t.bonus ? '[bonus] ' : '') + String(t.brief).replace(/\[assigned at launch\]/g, '(shown in the BRIEFING file inside your box)');
                    ul.appendChild(li);
                });
                out.appendChild(ul);
            }
            ws.style.display = '';
            // Hints AFTER the panel is visible (hidden lists report zero
            // heights and the clip test would silently pass). `ul`/`det` are
            // var-hoisted from the blocks above; undefined when their branch
            // did not run.
            if (typeof ul !== 'undefined' && ul) addScrollHint(ul);
            if (typeof det !== 'undefined' && det) {
                if (det.open) addScrollHint(det.querySelector('.mission-fieldguide__list'));
                if (!det.__hintWired) {
                    det.__hintWired = true;
                    // Veteran path: guide paints collapsed; hint must be computed
                    // at open time, when the list first has real height.
                    det.addEventListener('toggle', function () {
                        if (det.open) addScrollHint(det.querySelector('.mission-fieldguide__list'));
                    });
                }
            }
        }

        // Select a mission, then launch (or re-launch seed onto the running box) via
        // the standard launcher so limits/telemetry/badges all behave identically.
        function startMission(m, card) {
            // Race guard (adversarial review 2026-07-09): all 18 cards share ONE
            // launch button, and its click handler captures the selected mission
            // synchronously then disables itself. Switching missions while a
            // launch is in flight would desync the UI (and grading) from the
            // mission actually being seeded — so block until it settles.
            var launchBtn = document.querySelector('#obs-sandbox-mount .sandbox-launcher button');
            if (launchBtn && launchBtn.disabled) {
                var busyNote = document.getElementById('obs-mission-ws-note');
                if (busyNote) busyNote.textContent = 'A launch is already in progress — give it a few seconds, then pick your mission again.';
                return;
            }
            window.__obsSelectedMission = m.id;
            document.querySelectorAll('.obs-mission-card.selected').forEach(function (c) { c.classList.remove('selected'); });
            if (card) {
                card.classList.add('selected');
                // The workspace copy of the guide takes over — collapse the card's
                // own copy so the same manual is never open twice on the page.
                var ownGuide = card.querySelector('details.mission-fieldguide');
                if (ownGuide) ownGuide.open = false;
            }
            paintWorkspace(m, 'Your box is loading this mission\'s world. Work in the terminal below — lost? Type cat START_HERE.txt — then click Grade mission. Every failed task tells you what is still wrong.');
            // Remember the active mission so a page refresh restores this workspace
            // (id + timestamp only; details re-read from the live catalog on restore).
            try { localStorage.setItem('hexworth_obs_active_mission', JSON.stringify({ id: m.id, at: Date.now() })); } catch (e) { /* private mode */ }
            // Durable lifecycle record (L1/L3): mission goes in_progress (never
            // downgrades a completed one); free-play tooling hides while a
            // mission is active (L4 — one tracker, and it also closes the client
            // path of the #94 mis-grading trap).
            writeProgress(function (p) {
                var rec = p.missions[m.id] = p.missions[m.id] || {};
                if (rec.status !== 'completed') rec.status = 'in_progress';
                rec.startedAt = rec.startedAt || Date.now();
            });
            var fp = document.getElementById('obs-sandbox-grade');
            if (fp) fp.style.display = 'none';
            try { refreshMissionCards(); } catch (e) { /* cosmetic */ }
            // Reuse the showcase launch button; if a session is already running the
            // lab-manager seeds the mission world onto it idempotently (reseed
            // safety for all 18 missions verified 2026-07-09: byte-identical seeds).
            if (launchBtn) launchBtn.click();
            var ws = document.getElementById('obs-mission-workspace');
            if (ws) ws.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Refresh-restore (QC 2026-07-09): the student's container keeps running
        // across a page refresh, but the old UI forgot the mission and hid the
        // grade controls entirely. Restore the workspace from localStorage +
        // the live catalog; grading needs a session, so the note routes them
        // through Launch Sandbox (which reattaches their running box).
        function restoreMissionWorkspace() {
            var rec = null;
            try { rec = JSON.parse(localStorage.getItem('hexworth_obs_active_mission') || 'null'); } catch (e) { /* corrupt/private */ }
            if (!rec || !rec.id) return;
            // Stale record cap: box max lifetime is 120 min (lab-manager
            // MAX_LIFETIME), so past 3 h the container is certainly reaped —
            // clear instead of nagging forever (Chris gate 2026-07-09).
            if (rec.at && (Date.now() - rec.at) > 3 * 60 * 60 * 1000) {
                try { localStorage.removeItem('hexworth_obs_active_mission'); } catch (e) { /* non-fatal */ }
                return;
            }
            var m = (window.__obsMissionCatalog || {})[rec.id];
            if (!m) { try { localStorage.removeItem('hexworth_obs_active_mission'); } catch (e) { /* non-fatal */ } return; }
            window.__obsSelectedMission = m.id;
            var card = document.querySelector('.obs-mission-card[data-mission="' + m.id + '"]');
            if (card) card.classList.add('selected');
            // Honest copy (Chris gate 2026-07-09): the box may have expired since
            // the record was written — promise a fresh world, not continuity.
            paintWorkspace(m, 'Welcome back. Click Launch Sandbox below — if your box is still running you reconnect right where you left off; if it expired you get a fresh copy of the mission world. Then Grade mission to see where you stand.');
        }

        // Grade the selected mission: rich per-task feedback, hidden tasks masked,
        // Claim button revealed only on badgeEligible (final authority stays
        // server-side). RETURNS the grade response (or null) so the launcher's
        // terminal-adjacent compact panel can render from the SAME single fetch
        // (2026-07-10 — one grade, two renders, zero drift).
        async function gradeMission() {
            var out = document.getElementById('obs-mission-grade-result');
            var claim = document.getElementById('obs-mission-claim-btn');
            if (!out) return null;
            var sid = window.__obsSandboxSession;
            var mid = window.__obsSelectedMission;
            if (!sid || !mid) { out.textContent = 'Start a mission first.'; return null; }
            out.textContent = 'Auditing your system...';
            try {
                var r = await SandboxLauncher.checkMission(sid, mid);
                out.innerHTML = '';
                var head = document.createElement('div');
                head.className = 'obs-grade-head';
                head.textContent = r.passed + ' / ' + r.total + ' tasks complete' + (r.hiddenUnmet ? ' · a hidden requirement is not met' : '');
                out.appendChild(head);
                var ul = document.createElement('ul');
                ul.className = 'obs-grade-list';
                (r.results || []).forEach(function (t) {
                    var li = document.createElement('li');
                    li.className = t.pass ? 'ok' : 'no';
                    li.textContent = (t.pass ? '✓ ' : '✗ ') + (t.bonus ? '[bonus] ' : '') + t.brief;
                    ul.appendChild(li);
                    // Rich feedback: the grader says WHAT is wrong (exists/owner/content), never how to fix it.
                    if (!t.pass && t.feedback && t.feedback.length) {
                        t.feedback.forEach(function (f) {
                            var fb = document.createElement('li');
                            fb.className = 'no obs-grade-feedback';
                            fb.textContent = '   -> ' + f;
                            ul.appendChild(fb);
                        });
                    }
                });
                out.appendChild(ul);
                // Graded results share the 300px workspace cap — same honesty rule.
                addScrollHint(ul);
                if (claim) claim.style.display = r.badgeEligible ? '' : 'none';
                // Durable record of the grade (L1): advisory only — the Claim
                // button's server recheck stays the completion authority.
                writeProgress(function (p) {
                    var rec = p.missions[mid] = p.missions[mid] || {};
                    if (rec.status !== 'completed') rec.status = 'in_progress';
                    rec.lastGrade = { passed: r.passed, total: r.total, at: Date.now() };
                });
                // Task-feat detection from this server-graded response (L6).
                try { evaluateObsBadges({ grade: r, mission: mid }); } catch (e) { /* badges cosmetic */ }
                return r;
            } catch (e) {
                out.textContent = 'Could not grade right now. Make sure your sandbox is still running.';
                return null;
            }
        }

        // Terminal-adjacent grading (the launcher's 'Grade Mission' button,
        // operator 2026-07-10: scrolling between terminal and grade controls is
        // "annoying, uncomfortable, and annoying"). ONE fetch — gradeMission()
        // renders the full workspace checklist and returns the response; this
        // renders the compact summary (score + failed tasks + hidden count)
        // right above the terminal iframe.
        async function gradeMissionCompact(ctx) {
            var panel = ctx && ctx.panel;
            if (!panel) return;
            panel.style.display = '';
            var sid = window.__obsSandboxSession;
            var mid = window.__obsSelectedMission;
            if (!sid || !mid) {
                // Free-play box: the Mission Workspace (which would explain
                // missions) is hidden, so this message must stand alone
                // (adversarial review 2026-07-10).
                panel.textContent = 'No mission is active - this box is in free-play. To run a graded mission, find the Command Mastery cards below, open one, and click Start Mission.';
                return;
            }
            panel.textContent = 'Auditing your system...';
            var r = await gradeMission();
            panel.textContent = '';
            if (!r) { panel.textContent = 'Could not grade right now. Make sure your sandbox is still running.'; return; }
            // ONE status line only (marathon L4, operator: three stacked trackers).
            // The workspace checklist directly above is the single full tracker —
            // this panel just answers "did that pass?" at the terminal without
            // duplicating the failure list it used to render.
            var head = document.createElement('div');
            head.className = 'obs-grade-head';
            var bits = [r.passed + ' / ' + r.total + ' tasks complete'];
            if (r.hiddenUnmet) bits.push(r.hiddenUnmet + ' hidden requirement' + (r.hiddenUnmet > 1 ? 's' : '') + ' not met');
            head.textContent = bits.join(' · ') + (r.badgeEligible
                ? ' — all tasks pass! Claim your badge in the Mission panel above.'
                : ' — failed-task hints are in the Mission panel above.');
            panel.appendChild(head);
        }

        // Claim the badge: the CF re-grades server-side via the lab-manager and writes
        // users/{uid}.achievements + a server_awards proof doc. Client renders the verdict.
        async function claimMissionBadge() {
            var out = document.getElementById('obs-mission-grade-result');
            var claim = document.getElementById('obs-mission-claim-btn');
            var mid = window.__obsSelectedMission;
            if (!mid || !out) return;
            if (claim) { claim.disabled = true; claim.textContent = 'Verifying...'; }
            try {
                var res = await FirebaseAuth.callFunction('awardMissionBadge', { mission: mid });
                var d = res && res.data;
                var note = document.createElement('div');
                note.className = 'obs-grade-badge';
                note.textContent = (d && d.awarded)
                    ? 'Badge earned (server-verified): ' + (d.name || d.badgeId)
                    : 'Not eligible yet: ' + ((d && d.passed) || 0) + '/' + ((d && d.total) || '?') + ' tasks passing on the server.';
                out.appendChild(note);
                if (d && d.awarded) {
                    if (claim) claim.style.display = 'none';
                    // Mission complete (adversarial review 2026-07-09): clear the
                    // refresh-restore record so a finished mission never nags
                    // "reconnect" on later visits; steer to the next mission.
                    try { localStorage.removeItem('hexworth_obs_active_mission'); } catch (e) { /* non-fatal */ }
                    var wsNote = document.getElementById('obs-mission-ws-note');
                    if (wsNote) wsNote.textContent = 'Mission complete — badge earned. Pick your next mission from the cards below.';
                    // Durable completion (L1/L3): recorded at the SERVER-VERIFIED
                    // moment (the CF re-graded and awarded), the one place client
                    // state may say 'completed'.
                    writeProgress(function (p) {
                        var rec = p.missions[mid] = p.missions[mid] || {};
                        rec.status = 'completed';
                        rec.completedAt = Date.now();
                    });
                    try { refreshMissionCards(); } catch (e) { /* cosmetic */ }
                    // Mission-ladder + completion-derived badges fire at this
                    // server-verified moment (L6).
                    try { evaluateObsBadges({}); } catch (e) { /* badges cosmetic */ }
                }
            } catch (e) {
                var err = document.createElement('div');
                err.className = 'obs-grade-badge';
                err.textContent = 'Could not verify with the badge service. Your work is safe; try again in a minute.';
                out.appendChild(err);
            } finally {
                if (claim) { claim.disabled = false; claim.textContent = 'Claim badge'; }
            }
        }

        // Wire mission buttons once (idempotent — mountSandbox may retry).
        function wireMissionPanel() {
            var g = document.getElementById('obs-mission-grade-btn');
            if (g && !g.__wired) { g.__wired = true; g.addEventListener('click', gradeMission); }
            var c = document.getElementById('obs-mission-claim-btn');
            if (c && !c.__wired) { c.__wired = true; c.addEventListener('click', claimMissionBadge); }
            // L3 lifecycle verb: Stop mission -> free-play (hook catch 2026-07-10:
            // the button shipped one edit before its wire — never again).
            var s = document.getElementById('obs-mission-stop');
            if (s && !s.__wired) { s.__wired = true; s.addEventListener('click', stopMission); }
        }

        // ===== Sandbox badge shelf =====
        // Earned-only "easter egg" collection. Order = the learner's journey. Earned/name/
        // description all come from AchievementSystem (single source); only the icon FILENAME
        // is mirrored here, because the registry stores icons as full <img> HTML strings and we
        // build the img via createElement (no innerHTML of registry data). Keep these ids +
        // icons in sync with AchievementSystem.ACHIEVEMENTS.
        // ══ Observatory Badges (marathon L5/L6, 2026-07-10) ═════════════════
        // A PlayStation-style badge collection on the PROFILE tab, using real
        // gallery art (_app/assets/images/badges/, operator-confirmed canonical).
        // TWO trust tiers, ZERO migration (adversarial review):
        //  - legacy:true entries are the 5 pre-existing CORE achievements —
        //    earned state read from AchievementSystem, award call sites
        //    untouched, XP/count semantics unchanged; this grid just gives them
        //    a real home again (the old sandbox shelf is gone).
        //  - obs_* entries are the SEPARATE Observatory system (operator:
        //    "separate for the regular hexworth badges"): earned state lives in
        //    the durable progress doc (p.obsBadges), grants NO core XP, and the
        //    mission ladder derives from server-verified claim moments only.
        //  - pending:true entries render locked and cannot be earned until the
        //    per-lab server checks deploy (SBX-7 backend; post-marathon).
        // Art is display-mapping ONLY — reusing gallery pieces per operator call.
        // Canonical defs now live in _app/components/ObservatoryBadges.js (loaded
        // above). Migrated 2026-07-11 (task #96) — verified byte-identical to the
        // former local literal before swapping. ONE source shared with the Trophy
        // Cabinet (trophies.html), so an SBX-7 pending->live flip is edited once.
        var OBS_BADGE_DEFS = ObservatoryBadges.DEFS;
        // Retired local copies — single-sourced from ObservatoryBadges.js (verified
        // byte-identical thresholds/logic before the swap, 2026-07-11 task #96).
        // obsBadgeEarned(def, prog): callers here always pass prog; the shared
        // earned() additionally defaults prog to the live doc if omitted.
        var obsRarity = ObservatoryBadges.rarity;
        var obsBadgeEarned = ObservatoryBadges.earned;

        // Award engine: derives every obs_* condition from the durable progress
        // doc (mission counts come ONLY from server-verified claim moments) and
        // grade responses (server-graded data, client-detected — same tier as
        // existing client achievements). ONE writeProgress per evaluation.
        function evaluateObsBadges(ctx) {
            var newly = [];
            writeProgress(function (p) {
                p.flags = p.flags || {};
                p.obsBadges = p.obsBadges || {};
                var r = ctx && ctx.grade;
                var mid = ctx && ctx.mission;
                if (r && mid) {
                    var rec = p.missions[mid] = p.missions[mid] || {};
                    rec.gradeCount = (rec.gradeCount || 0) + 1;
                    rec.bestPassed = Math.max(rec.bestPassed || 0, r.passed || 0);
                    (r.results || []).forEach(function (t) {
                        if (t.pass) {
                            p.flags.firstTask = true;
                            if (t.bonus) p.flags.bonusPassed = true;
                            if (t.hidden) p.flags.hiddenPassed = true;
                        }
                    });
                    if ((r.results || []).length && (r.results || []).every(function (t) { return t.pass; })) p.flags.perfectMission = true;
                }
                if (ctx && ctx.manualOpened) p.flags.manualOpened = true;
                // Derived facts
                var done = Object.keys(p.missions).filter(function (k) { return p.missions[k].status === 'completed'; });
                var taskTotal = Object.keys(p.missions).reduce(function (s, k) { return s + (p.missions[k].bestPassed || 0); }, 0);
                var anyPersistent = done.some(function (k) { return (p.missions[k].gradeCount || 0) >= 10; });
                var anyComeback = done.some(function (k) { var m = p.missions[k]; return m.completedAt && m.startedAt && (m.completedAt - m.startedAt) >= 86400000; });
                var anySpeedrun = done.some(function (k) { var m = p.missions[k]; return m.completedAt && m.startedAt && (m.completedAt - m.startedAt) <= 600000; });
                var anyNight = done.some(function (k) { var m = p.missions[k]; return m.completedAt && new Date(m.completedAt).getHours() < 5; });
                var cond = {
                    obs_first_mission: done.length >= 1,
                    obs_mission_5: done.length >= 5,
                    obs_mission_10: done.length >= 10,
                    obs_mission_18: done.length >= 18,
                    obs_first_task: !!p.flags.firstTask,
                    obs_bonus_hunter: !!p.flags.bonusPassed,
                    obs_hidden_finder: !!p.flags.hiddenPassed,
                    obs_perfect_mission: !!p.flags.perfectMission,
                    obs_task_50: taskTotal >= 50,
                    obs_grade_persistent: anyPersistent,
                    obs_comeback: anyComeback,
                    obs_night_shift: anyNight,
                    obs_speedrun: anySpeedrun,
                    obs_manual_scholar: !!p.flags.manualOpened
                };
                OBS_BADGE_DEFS.forEach(function (def) {
                    if (def.legacy || def.pending) return;              // legacy = core path; pending = server-wired later
                    if (!p.obsBadges[def.id] && cond[def.id]) {
                        p.obsBadges[def.id] = { earnedAt: Date.now() };
                        newly.push(def);
                    }
                });
            });
            if (newly.length) {
                newly.forEach(obsBadgeToast);
                try { renderObsBadgeGrid(); } catch (e) { /* grid may not be rendered yet */ }
            }
            return newly;
        }

        // Unlock celebration: page-local toast with the real badge art + rarity
        // (adversarial review: AchievementPanel is NOT loaded here and pulling it
        // in for CSS would first-load a heavy listener-wired module mid-marathon;
        // the proven page-local obsBadgePop pattern + one prismatic keyframe is
        // the whole need). Queued so multiple unlocks play sequentially.
        var _obsToastQueue = [], _obsToastBusy = false;
        function obsBadgeToast(def) {
            _obsToastQueue.push(def);
            if (!_obsToastBusy) _obsNextToast();
        }
        function _obsNextToast() {
            var def = _obsToastQueue.shift();
            if (!def) { _obsToastBusy = false; return; }
            _obsToastBusy = true;
            var t = document.createElement('div');
            t.className = 'obs-btoast obs-badge--pop';
            var img = document.createElement('img');
            img.src = '/assets/images/badges/' + def.art + '.webp'; img.alt = '';
            var box = document.createElement('div');
            var h = document.createElement('div'); h.className = 'obs-btoast__head'; h.textContent = 'OBSERVATORY BADGE EARNED';
            var n = document.createElement('div'); n.className = 'obs-btoast__name'; n.textContent = def.name;
            var rr = document.createElement('div'); rr.className = 'obs-btoast__rarity'; rr.textContent = obsRarity(def).toUpperCase() + ' · ' + def.pts + ' pts';
            box.appendChild(h); box.appendChild(n); box.appendChild(rr);
            t.appendChild(img); t.appendChild(box);
            document.body.appendChild(t);
            setTimeout(function () { t.classList.add('obs-btoast--out'); }, 3600);
            setTimeout(function () { t.remove(); _obsNextToast(); }, 4200);
        }

        // The Profile-tab grid (painted into the config.profileExtraHTML
        // container after HouseRenderer's lazy one-shot profile render).
        function renderObsBadgeGrid() {
            var grid = document.getElementById('obs-pbadges-grid');
            if (!grid) return;                                   // profile tab not rendered yet
            var prog = readProgress();
            grid.innerHTML = '';
            var earned = 0;
            OBS_BADGE_DEFS.forEach(function (def) {
                var got = obsBadgeEarned(def, prog);
                if (got) earned++;
                var cell = document.createElement('div');
                cell.className = 'obs-pbadge obs-pbadge--' + obsRarity(def) + (got ? ' is-earned' : ' is-locked');
                cell.setAttribute('data-badge', def.id);
                var img = document.createElement('img');
                img.src = '/assets/images/badges/' + def.art + '.webp';
                img.alt = ''; img.loading = 'lazy';
                var nm = document.createElement('div'); nm.className = 'obs-pbadge__name'; nm.textContent = def.name;
                var ds = document.createElement('div'); ds.className = 'obs-pbadge__desc';
                ds.textContent = def.pending && !got ? def.desc + ' (activates with the next server update)' : def.desc;
                cell.appendChild(img); cell.appendChild(nm); cell.appendChild(ds);
                grid.appendChild(cell);
            });
            var c = document.getElementById('obs-pbadges-count');
            if (c) c.textContent = earned + ' of ' + OBS_BADGE_DEFS.length + ' earned';
        }
        // Profile tab renders lazily ONCE — paint the grid when its container lands.
        window.addEventListener('hexworth:profileExtraRendered', function () {
            try { renderObsBadgeGrid(); } catch (e) { /* cosmetic */ }
        });

        // Award a LEGACY core badge (idempotent via AchievementSystem.unlock).
        // Call sites unchanged across the page; the celebration + grid repaint
        // replaced the old sandbox shelf (removed in this same commit).
        function awardBadge(id) {
            var newly = false;
            try { if (typeof AchievementSystem !== 'undefined') newly = AchievementSystem.unlock(id); } catch (e) { /* non-fatal */ }
            if (newly) {
                var def = OBS_BADGE_DEFS.filter(function (d) { return d.id === id; })[0];
                if (def) obsBadgeToast(def);
                try { renderObsBadgeGrid(); } catch (e) { /* cosmetic */ }
            }
            return newly;
        }

        // ===== Guided tutorial =====
        // A 5-step assisted walkthrough. The sandbox terminal is a cross-origin iframe we
        // cannot read, so each step is LOCKED until the SAME server-side grader the badge
        // uses (checkPractice) confirms that step's task, not by watching keystrokes. After
        // all 5 pass it auto-runs the grade + badge. Fully inert unless the learner opts in
        // (nothing polls or grades until they click "Start guided tutorial").
        var OBS_TUT_KEY = 'obs_sandbox_tutorial_done';
        var OBS_TUT_STEPS = [
            { title: 'Create your workspace and a first file',
              cmd: 'mkdir -p ~/work && echo hexworth > ~/work/hello.txt',
              why: 'mkdir makes your ~/work folder; the > sends the word "hexworth" into a new file, hello.txt.' },
            { title: 'Write a script and make it runnable',
              cmd: "printf '#!/bin/bash\\necho hi\\n' > ~/work/greet.sh && chmod +x ~/work/greet.sh",
              why: 'The first line (#!/bin/bash) marks it as a script; chmod +x sets the execute bit so you can run it as a program.' },
            { title: 'Lock a file to private permissions',
              cmd: 'touch ~/work/secret.txt && chmod 600 ~/work/secret.txt',
              why: 'chmod 600 means owner-only read and write, the standard for private files like SSH keys.' },
            { title: 'Filter the error lines out of a log',
              cmd: 'grep ERROR ~/playground/logs/app.log > ~/work/found.txt',
              why: 'grep prints only the lines containing ERROR; the > saves just those lines into found.txt.' },
            { title: 'Put your work under version control',
              cmd: 'cd ~/work && git init && git config user.email you@hex.local && git config user.name You && git add . && git commit -m first',
              why: 'git init starts a repository, add stages your files, commit records them. A fresh box needs an identity (user.email/name) before it will commit.' }
        ];
        var obsTut = { armed: false, active: false, step: 0, timer: null, busy: false, finishing: false };

        function tutEl() { return document.getElementById('obs-tutorial'); }
        // Done = legacy localStorage flag OR the durable progress doc (L2 —
        // the doc travels cross-device; the old key stays readable for
        // back-compat and has zero cloud presence, so no ping-pong risk).
        function tutDone() {
            try { if (localStorage.getItem(OBS_TUT_KEY)) return true; } catch (e) { /* private mode */ }
            return !!readProgress().tutorial.done;
        }
        // In-progress step from the durable doc (0 = never started).
        function tutSavedStep() {
            var t = readProgress().tutorial;
            return (!t.done && t.step > 0 && t.step < OBS_TUT_STEPS.length) ? t.step : 0;
        }
        function tutClear() { var e = tutEl(); if (e) { e.innerHTML = ''; e.hidden = false; } return e; }
        function pulseMount(on) { var m = document.getElementById('obs-sandbox-mount'); if (m) m.classList.toggle('obs-pulse', !!on); }

        function tutCopy(text, btn) {
            try {
                navigator.clipboard.writeText(text).then(function () {
                    btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1500);
                });
            } catch (e) { /* clipboard unavailable; the command is still shown to type */ }
        }

        // Pre-launch card: a Start button (pulsing for first-time visitors) or a Show-me-how replay.
        function renderStart() {
            var e = tutClear(); if (!e) return;
            var first = !tutDone();
            // L2 fix ("always halfway done"): an in-progress tutorial now OFFERS
            // RESUME at the durable saved step instead of silently restarting —
            // beginTut picks the saved step up and syncStep re-verifies it
            // against whatever box is actually live.
            var resumeStep = first ? tutSavedStep() : 0;
            var label = resumeStep ? ('Resume tutorial (step ' + (resumeStep + 1) + ' of 5)')
                : (first ? 'Start guided tutorial' : 'Show me how');
            var why = resumeStep
                ? 'Welcome back — your tutorial is saved at step ' + (resumeStep + 1) + ' of 5. Pick up right where you left off.'
                : (first
                    ? 'New to Linux? Take the 5-step guided tutorial. I will show you exactly what to type and check each step as you go.'
                    : 'Want a refresher? Replay the 5-step guided tutorial.');
            e.innerHTML =
                '<div class="obs-tutorial__bar"><span class="obs-tutorial__label">Guided Tutorial</span></div>' +
                '<p class="obs-tutorial__why"></p>' +
                '<div class="obs-tutorial__actions"><button type="button" class="obs-tutorial__btn' + ((first || resumeStep) ? ' obs-pulse' : '') + '" id="obs-tut-start"></button></div>';
            e.querySelector('.obs-tutorial__why').textContent = why;
            var btn = document.getElementById('obs-tut-start');
            btn.textContent = label;
            btn.addEventListener('click', armTut);
        }

        // Armed but not yet launched: tell them to launch, and pulse the launch area.
        function renderArm() {
            var e = tutClear(); if (!e) return;
            e.innerHTML =
                '<div class="obs-tutorial__bar"><span class="obs-tutorial__label">Guided Tutorial</span></div>' +
                '<p class="obs-tutorial__why">Launch your sandbox to begin. I will walk you through all 5 tasks and check each one.</p>';
            pulseMount(true);
        }

        function renderStep() {
            var e = tutClear(); if (!e) return;
            var s = OBS_TUT_STEPS[obsTut.step];
            var dots = OBS_TUT_STEPS.map(function (_, i) {
                var cls = i < obsTut.step ? 'done' : (i === obsTut.step ? 'current' : '');
                return '<span class="obs-tutorial__dot ' + cls + '"></span>';
            }).join('');
            e.innerHTML =
                '<div class="obs-tutorial__bar">' +
                    '<span class="obs-tutorial__label">Guided Tutorial</span>' +
                    '<span class="obs-tutorial__dots">' + dots + '</span>' +
                    '<span class="obs-tutorial__count">Step ' + (obsTut.step + 1) + ' of 5</span>' +
                '</div>' +
                '<p class="obs-tutorial__title"></p>' +
                '<p class="obs-tutorial__why"></p>' +
                '<div class="obs-tutorial__cmdrow">' +
                    '<div class="obs-tutorial__cmd" id="obs-tut-cmd"></div>' +
                    '<button type="button" class="obs-tutorial__copy" id="obs-tut-copy">Copy</button>' +
                '</div>' +
                '<div class="obs-tutorial__actions">' +
                    '<button type="button" class="obs-tutorial__btn" id="obs-tut-check">Check this step</button>' +
                    '<span class="obs-tutorial__msg" id="obs-tut-msg">Type the command in the terminal, then Check. I also check automatically.</span>' +
                '</div>';
            // Dynamic text via textContent (never innerHTML), matching the grader UI's no-untrusted-markup rule.
            e.querySelector('.obs-tutorial__title').textContent = 'Step ' + (obsTut.step + 1) + ': ' + s.title;
            e.querySelector('.obs-tutorial__why').textContent = s.why;
            document.getElementById('obs-tut-cmd').textContent = s.cmd;
            document.getElementById('obs-tut-copy').addEventListener('click', function () { tutCopy(s.cmd, this); });
            document.getElementById('obs-tut-check').addEventListener('click', tutManualCheck);
        }

        function renderDone() {
            var e = tutClear(); if (!e) return;
            e.innerHTML =
                '<div class="obs-tutorial__done">Tutorial complete!' +
                '<small>You ran all 5 tasks and graded your work. Your Linux Practitioner badge shows in the results just below. Relaunch anytime to practice on a fresh box.</small></div>' +
                '<div class="obs-tutorial__actions" style="margin-top:10px;"><button type="button" class="obs-tutorial__btn ghost" id="obs-tut-replay">Replay tutorial</button></div>';
            document.getElementById('obs-tut-replay').addEventListener('click', armTut);
        }

        // Does the grader report step index i (0-based) as passed? Prefer the per-task id
        // (results carry {id, desc, pass}); fall back to position if id is ever absent.
        function stepPass(res, i) {
            var c = res.filter(function (x) { return x && x.id === i + 1; })[0] || res[i];
            return !!(c && c.pass);
        }
        // Bound every grader call so a hung fetch can never wedge the busy latch forever.
        function withTimeout(promise, ms) {
            return Promise.race([promise, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, ms); })]);
        }

        // Ask the grader about the CURRENT step and advance if it passed. Returns a status
        // so callers can message honestly: advanced | not-yet | skipped | error | inactive.
        async function tutCheck() {
            if (!obsTut.active) return 'inactive';
            if (obsTut.busy) return 'skipped';
            var sid = window.__obsSandboxSession; if (!sid) return 'inactive';
            obsTut.busy = true;
            try {
                var r = await withTimeout(SandboxLauncher.checkPractice(sid), 8000);
                // The session may have ended (idle-out / destroy) while we awaited, so bail if so,
                // otherwise a stale response would clobber the torn-down UI.
                if (!obsTut.active || window.__obsSandboxSession !== sid) return 'inactive';
                var res = (r && r.results) || [];
                if (stepPass(res, obsTut.step)) { advanceTut(); return 'advanced'; }
                return 'not-yet';
            } catch (e) { return 'error'; }
            finally { obsTut.busy = false; }
        }

        async function tutManualCheck() {
            var msg = document.getElementById('obs-tut-msg');
            if (msg) { msg.className = 'obs-tutorial__msg'; msg.textContent = 'Checking...'; }
            var status = await tutCheck();
            var m = document.getElementById('obs-tut-msg');
            if (!m) return;
            if (status === 'not-yet') { m.className = 'obs-tutorial__msg err'; m.textContent = 'Not done yet. Run the command above in the terminal, then Check again.'; }
            else if (status === 'error') { m.className = 'obs-tutorial__msg'; m.textContent = 'Could not check right now. Make sure your sandbox is still running, then try again.'; }
            else if (status === 'skipped') { m.className = 'obs-tutorial__msg'; m.textContent = 'Still checking your last request, one moment.'; }
            // 'advanced' / 'inactive' already re-rendered the panel.
        }

        function advanceTut() {
            if (!obsTut.active) return;
            awardBadge('sandbox_getting_there');   // a step just passed = first task cleared (idempotent)
            obsTut.step++;
            // Durable step record (L2): survives refresh, box death, and devices.
            writeProgress(function (p) { p.tutorial.step = obsTut.step; });
            if (obsTut.step >= OBS_TUT_STEPS.length) { finishTut(); return; }
            renderStep();
            var m = document.getElementById('obs-tut-msg');
            if (m) { m.className = 'obs-tutorial__msg ok'; m.textContent = 'Nice, step complete. On to the next one.'; }
        }

        async function finishTut() {
            if (obsTut.finishing) return;      // guard: syncStep + a poll could both land here
            obsTut.finishing = true;
            obsTut.active = false; tutStopPoll();
            // Durable completion (L2) alongside the legacy key finishTut already writes.
            writeProgress(function (p) { p.tutorial.done = true; p.tutorial.step = OBS_TUT_STEPS.length; });
            awardBadge('sandbox_tutorial_graduate');   // reached finish = all 5 steps passed
            var e = tutClear();
            if (e) e.innerHTML = '<div class="obs-tutorial__done">All 5 steps complete. Grading your work...</div>';
            try { await gradePractice(); } catch (err) { /* grade UI shows its own error */ }
            try { localStorage.setItem(OBS_TUT_KEY, '1'); } catch (err) { /* private mode, non-fatal */ }
            obsTut.armed = false; obsTut.finishing = false;
            renderDone();
        }

        function tutStartPoll() { tutStopPoll(); obsTut.timer = setInterval(tutCheck, 5000); }
        function tutStopPoll() { if (obsTut.timer) { clearInterval(obsTut.timer); obsTut.timer = null; } }

        // Sync to the box's REAL state: jump to the first not-yet-done step (or finish if all
        // are done). Called on every launch. Because the sandbox is disposable, a relaunch is
        // a clean box, so we must never resume a preserved step against filesystem state that
        // no longer exists. A partly-done live box resumes at the right place instead.
        async function syncStep() {
            var sid = window.__obsSandboxSession; if (!sid) return;
            try {
                var r = await withTimeout(SandboxLauncher.checkPractice(sid), 8000);
                if (!obsTut.active || window.__obsSandboxSession !== sid) return;
                var res = (r && r.results) || [];
                var idx = 0;
                while (idx < OBS_TUT_STEPS.length && stepPass(res, idx)) idx++;
                if (idx >= OBS_TUT_STEPS.length) { finishTut(); return; }
                if (idx !== obsTut.step) { obsTut.step = idx; renderStep(); }
            } catch (e) { /* transient; the 5s poll will catch up */ }
        }

        function beginTut() {
            if (!obsTut.armed) return;
            // Resume from the durable step when one exists (L2); syncStep below
            // reconciles against the LIVE box either way — a fresh box that has
            // already-true earlier steps fast-forwards, and the saved step is
            // re-verified rather than trusted blindly (adversarial review).
            obsTut.active = true; obsTut.finishing = false; obsTut.step = tutSavedStep();
            pulseMount(false); renderStep();
            syncStep();               // fast-forward past anything already true on THIS box
            tutStartPoll();
        }

        function armTut() {
            obsTut.armed = true; obsTut.active = false; obsTut.step = 0;
            // If a box is already running, jump straight in; otherwise wait for launch.
            if (window.__obsSandboxSession) beginTut(); else renderArm();
        }

        // Show the pre-launch card once the sandbox card is in the DOM. Nothing runs until opt-in.
        function initTutorial() { if (!obsTut.armed && !obsTut.active) renderStart(); }

        // Gate the house behind research consent: render only once the signed-in
        // user has a consent record (existing or freshly submitted).
        ObservatoryConsent.ensureConsent(function () {
            HouseRenderer.init(OBSERVATORY_CONFIG);
            // Consented cohort — start activity tracking.
            if (typeof ObservatoryTracker !== 'undefined') ObservatoryTracker.init();
            // Mount the Linux Practice Sandbox launcher once its showcase panel
            // (from afterStatsHTML) is in the DOM. Retry briefly in case the house
            // render is asynchronous, so we never miss the mount point.
            (function mountSandbox(tries) {
                var el = document.getElementById('obs-sandbox-mount');
                if (el && typeof SandboxLauncher !== 'undefined') {
                    SandboxLauncher.renderButton(el, 'linux-sandbox', {
                        // Selected Command Mastery mission (if any) rides along on launch so the
                        // lab-manager seeds the mission world into the box. Null = free-play.
                        mission: function () { return window.__obsSelectedMission || null; },
                        // Terminal-adjacent controls (operator 2026-07-10): manual +
                        // grading reachable WITHOUT scrolling away from the terminal.
                        extraActions: [
                            {
                                label: 'Field Manual',
                                visibleWhen: 'always',
                                onClick: function () {
                                    var mid = window.__obsSelectedMission || '';
                                    // Named target: repeat clicks re-navigate ONE
                                    // manual tab instead of stacking new tabs.
                                    window.open('field-manual.html' + (mid ? '?mission=' + encodeURIComponent(mid) : ''), 'obs-field-manual');
                                    // Read The Manual badge (L6).
                                    try { evaluateObsBadges({ manualOpened: true }); } catch (e) { /* cosmetic */ }
                                }
                            },
                            { label: 'Grade Mission', visibleWhen: 'running', onClick: gradeMissionCompact }
                        ],
                        onLaunch: function (labId, result) {
                            // Record each launch as a consented Observatory activity event.
                            if (typeof ObservatoryTracker !== 'undefined' && ObservatoryTracker.logSandbox) {
                                ObservatoryTracker.logSandbox(labId);
                            }
                            // Remember the session so the grader can check it; reveal the
                            // free-play grader ONLY when no mission is active (marathon L4:
                            // one tracker — and this closes the client path of the #94
                            // mis-grading trap where 'Grade my practice' hit the server's
                            // sticky session.mission fork on mission sessions).
                            window.__obsSandboxSession = result && result.sessionId;
                            var g = document.getElementById('obs-sandbox-grade');
                            if (g) g.style.display = window.__obsSelectedMission ? 'none' : '';
                            // If the learner opted into the guided tutorial, start it now.
                            if (obsTut.armed) beginTut();
                            // Badge bookkeeping LAST and fully isolated: SandboxLauncher swallows
                            // onLaunch errors, so a localStorage/registry throw here must never
                            // reach the critical session-id / grader / tutorial lines above.
                            try {
                                var priorEnd = false;
                                try { priorEnd = localStorage.getItem('obs_sandbox_ended') === '1'; } catch (e) { /* private mode */ }
                                awardBadge('sandbox_first_boot');
                                if (priorEnd) {   // launched again after a session actually ended
                                    awardBadge('sandbox_fresh_start');
                                    try { localStorage.removeItem('obs_sandbox_ended'); } catch (e) { /* non-fatal */ }
                                }
                            } catch (e) { /* badges are cosmetic, never break the launch */ }
                        },
                        onEnd: function () {
                            // Session ended (destroyed or expired) — retire the now-dead grader.
                            window.__obsSandboxSession = null;
                            var g = document.getElementById('obs-sandbox-grade');
                            if (g) g.style.display = 'none';
                            var out = document.getElementById('obs-grade-result');
                            if (out) out.textContent = '';
                            // Retire the Mission Workspace too: the container (and its
                            // mission world) is gone, so hide the panel, forget the
                            // selection, and clear the refresh-restore record.
                            window.__obsSelectedMission = null;
                            var ws = document.getElementById('obs-mission-workspace');
                            if (ws) ws.style.display = 'none';
                            var wsOut = document.getElementById('obs-mission-grade-result');
                            if (wsOut) wsOut.textContent = '';
                            document.querySelectorAll('.obs-mission-card.selected').forEach(function (c) { c.classList.remove('selected'); });
                            try { localStorage.removeItem('hexworth_obs_active_mission'); } catch (e) { /* non-fatal */ }
                            // Pause the tutorial. On relaunch, beginTut() re-syncs against the
                            // fresh box (syncStep), so we don't resume a now-invalid step here.
                            tutStopPoll(); obsTut.active = false;
                            if (obsTut.armed) renderArm(); else renderStart();
                            // Mark that a session ended so the next launch earns "Fresh Start"
                            // (a genuine return, not a double-click). Guarded: cosmetic only.
                            try { localStorage.setItem('obs_sandbox_ended', '1'); } catch (e) { /* private mode */ }
                        }
                    });
                    // Each mount step isolated: a throw in one (e.g. a badge-registry
                    // mismatch) must never take down the steps after it.
                    try { wireSandboxGrader(); } catch (e) { /* grader button optional */ }
                    try { initTutorial(); } catch (e) { /* tutorial optional */ }
                    try { renderObsBadgeGrid(); } catch (e) { /* grid paints on profile-tab render otherwise */ }
                    try { wireMissionPanel(); } catch (e) { /* missions degrade to note */ }
                    try { renderMissionsPanel(); } catch (e) { /* missions degrade to note */ }
                    return;
                }
                if (tries > 0) setTimeout(function () { mountSandbox(tries - 1); }, 60);
            })(15);
        });
    </script>

    <!-- Discovery / gamification companions (match the other houses). -->
    <script src="../../components/ContentDiscovery.js"></script>
    <script src="../../components/TrailHunter.js"></script>
    <script src="../../components/MasteryXP.js"></script>
    <script src="../../components/StampRollout.js"></script>
    <script>StampRollout.init();</script>
    <!-- Data-driven hub discovery (task #225): published hubs assigned to this house appear here. -->
    <div data-hub-discovery></div>
    <script src="/components/HubDiscovery.js" data-house="observatory"></script>
</body>
