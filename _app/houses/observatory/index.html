<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexworth Observatory - Hexworth Prime</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23a5b4fc'>&#x2605;</text></svg>">
    <style>
        /* Polaris / celestial palette */
        :root {
            --house-primary: #818cf8;
            --house-secondary: #22d3ee;
            --house-glow: rgba(129, 140, 248, 0.3);
            --house-bg: rgba(129, 140, 248, 0.05);
            --house-border: rgba(129, 140, 248, 0.2);
        }
        /* Avoid a white flash before the consent gate / house render. */
        body { background: radial-gradient(ellipse at top, #0f1530, #05060f); }
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        /* ── Vivid celestial atmosphere: multi-layer starfield, nebula, aurora,
              shooting stars — fixed behind all content (negative z-index). ── */
        .obs-stars, .obs-stars-mid, .obs-stars-far {
            position: fixed; inset: 0; pointer-events: none; background-repeat: repeat;
        }
        .obs-stars {  /* bright near layer — dense, multi-colour */
            z-index: -2;
            background-image:
                radial-gradient(2px 2px at 40px 60px, #ffffff, transparent),
                radial-gradient(1.8px 1.8px at 160px 130px, #67e8f9, transparent),
                radial-gradient(1.8px 1.8px at 250px 40px, #ffffff, transparent),
                radial-gradient(2px 2px at 330px 200px, #c4b5fd, transparent),
                radial-gradient(1.6px 1.6px at 90px 250px, #fde68a, transparent),
                radial-gradient(1.8px 1.8px at 210px 290px, #f9a8d4, transparent),
                radial-gradient(1.6px 1.6px at 290px 110px, #ffffff, transparent);
            background-size: 300px 300px;
            animation: obs-twinkle 4s ease-in-out infinite;
        }
        .obs-stars-mid {  /* medium drifting layer */
            z-index: -2; opacity: .9;
            background-image:
                radial-gradient(1.4px 1.4px at 70px 40px, #a5f3fc, transparent),
                radial-gradient(1.3px 1.3px at 180px 150px, #ffffff, transparent),
                radial-gradient(1.4px 1.4px at 30px 220px, #ddd6fe, transparent),
                radial-gradient(1.3px 1.3px at 240px 250px, #fef08a, transparent);
            background-size: 280px 280px;
            animation: obs-twinkle 6s ease-in-out infinite, obs-drift 60s linear infinite;
        }
        .obs-stars-far {  /* faint dense backdrop */
            z-index: -2; opacity: .8;
            background-image:
                radial-gradient(1px 1px at 20px 20px, rgba(255,255,255,.9), transparent),
                radial-gradient(1px 1px at 120px 90px, rgba(165,180,252,.9), transparent),
                radial-gradient(1px 1px at 200px 160px, rgba(255,255,255,.8), transparent),
                radial-gradient(1px 1px at 60px 200px, rgba(199,210,254,.8), transparent),
                radial-gradient(1px 1px at 150px 40px, rgba(103,232,249,.8), transparent);
            background-size: 170px 170px;
            animation: obs-twinkle 7s ease-in-out infinite reverse;
        }
        @keyframes obs-twinkle { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
        @keyframes obs-drift { from { background-position: 0 0; } to { background-position: 280px 140px; } }

        /* Polaris — the bright north star, big glow + cross-flare. */
        .obs-polaris {
            position: fixed; top: 12%; right: 11%; width: 5px; height: 5px; z-index: -1;
            pointer-events: none; background: #fff; border-radius: 50%;
            box-shadow: 0 0 12px 4px rgba(255,255,255,.95), 0 0 30px 12px rgba(129,140,248,.85), 0 0 64px 24px rgba(34,211,238,.5);
            animation: obs-polaris-pulse 3.5s ease-in-out infinite;
        }
        .obs-polaris::before, .obs-polaris::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .obs-polaris::before { width: 2px; height: 70px; background: linear-gradient(rgba(199,210,254,0), rgba(255,255,255,.95), rgba(199,210,254,0)); }
        .obs-polaris::after  { width: 70px; height: 2px; background: linear-gradient(90deg, rgba(199,210,254,0), rgba(255,255,255,.95), rgba(199,210,254,0)); }
        @keyframes obs-polaris-pulse { 0%, 100% { opacity: .9; transform: scale(1); } 50% { opacity: 1; transform: scale(1.45); } }

        /* Nebula — bold coloured cloud-banks (the colour layer). */
        .obs-nebula {
            position: fixed; inset: 0; z-index: -3; pointer-events: none;
            background:
                radial-gradient(45% 38% at 14% 22%, rgba(139,92,246,.34), transparent 70%),
                radial-gradient(40% 34% at 86% 14%, rgba(34,211,238,.26), transparent 70%),
                radial-gradient(50% 44% at 72% 56%, rgba(99,102,241,.26), transparent 70%),
                radial-gradient(36% 34% at 26% 74%, rgba(236,72,153,.22), transparent 70%),
                radial-gradient(34% 30% at 55% 90%, rgba(16,185,129,.18), transparent 70%);
            filter: blur(26px);
            animation: obs-nebula-shift 24s ease-in-out infinite alternate;
        }
        @keyframes obs-nebula-shift {
            0%   { transform: scale(1)    translateY(0);   opacity: .9; }
            100% { transform: scale(1.12) translateY(-3%); opacity: 1; }
        }

        /* Aurora — vivid multi-hue glow + a waving curtain along the bottom. */
        .obs-aurora {
            position: fixed; left: 0; right: 0; bottom: 0; height: 58vh; z-index: -2; pointer-events: none;
            background:
                radial-gradient(120% 85% at 50% 130%, rgba(16,185,129,.32), transparent 62%),
                radial-gradient(100% 80% at 18% 132%, rgba(34,211,238,.36), transparent 60%),
                radial-gradient(100% 85% at 80% 128%, rgba(139,92,246,.36), transparent 60%),
                radial-gradient(90% 75% at 60% 135%, rgba(236,72,153,.26), transparent 60%);
            filter: blur(12px);
            animation: obs-aurora-drift 14s ease-in-out infinite alternate;
        }
        .obs-aurora-wave {  /* waving aurora curtain ribbons */
            position: fixed; left: -10%; right: -10%; bottom: 0; height: 60vh; z-index: -2; pointer-events: none;
            background: repeating-linear-gradient(100deg,
                transparent 0, transparent 60px,
                rgba(34,211,238,.12) 90px, rgba(139,92,246,.14) 150px,
                rgba(16,185,129,.12) 200px, transparent 260px);
            -webkit-mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,.4) 60%, transparent 100%);
            mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,.4) 60%, transparent 100%);
            filter: blur(6px); opacity: .8;
            animation: obs-aurora-wave 12s ease-in-out infinite alternate;
        }
        @keyframes obs-aurora-drift { 0% { transform: translateX(-5%) translateY(2%); opacity: .85; } 100% { transform: translateX(5%) translateY(-2%); opacity: 1; } }
        @keyframes obs-aurora-wave  { 0% { transform: translateX(-6%) skewX(-6deg); } 100% { transform: translateX(6%) skewX(6deg); } }

        /* Shooting stars — three comets on staggered timings/paths/colours.
           Head = glowing core; tail tapers to a point (clip-path), is brightest at the
           head, and trails up-left to match the down-right travel (rotate on ::after,
           pivoting at the head so the streak lines up with the motion vector). */
        .obs-shooting, .obs-shooting2, .obs-shooting3 {
            position: fixed; left: 0; z-index: -1; pointer-events: none;
            width: 3px; height: 3px; border-radius: 50%;
            background: radial-gradient(circle, #fff 28%, rgba(255,255,255,.6) 55%, transparent 75%);
            box-shadow: 0 0 6px 2px rgba(255,255,255,.85), 0 0 16px 5px rgba(150,185,255,.35);
            opacity: 0;
        }
        .obs-shooting::after, .obs-shooting2::after, .obs-shooting3::after {
            content: ''; position: absolute; right: 1.5px; top: 50%; height: 3px;
            transform-origin: right center; transform: translateY(-50%) rotate(16deg);
            clip-path: polygon(0 50%, 100% 0, 100% 100%); filter: blur(.4px);
        }
        .obs-shooting  { top: 12%; animation: obs-shoot 9s linear infinite; }
        .obs-shooting::after  { width: 150px; background: linear-gradient(to left, rgba(255,255,255,.95), rgba(255,255,255,.35) 35%, transparent); }
        .obs-shooting2 { top: 30%; animation: obs-shoot 13s linear infinite; animation-delay: 4s; }
        .obs-shooting2::after { width: 125px; background: linear-gradient(to left, rgba(103,232,249,.95), rgba(103,232,249,.32) 35%, transparent); }
        .obs-shooting3 { top: 8%;  animation: obs-shoot 17s linear infinite; animation-delay: 9s; }
        .obs-shooting3::after { width: 175px; background: linear-gradient(to left, rgba(196,181,253,.95), rgba(196,181,253,.32) 35%, transparent); }
        @keyframes obs-shoot {
            0%   { transform: translate(0, 0);        opacity: 0; }
            3%   { opacity: 1; }
            13%  { transform: translate(64vw, 32vh);  opacity: 1; }
            18%  { transform: translate(82vw, 41vh);  opacity: 0; }
            100% { transform: translate(82vw, 41vh);  opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .obs-stars, .obs-stars-mid, .obs-stars-far, .obs-polaris, .obs-aurora, .obs-aurora-wave, .obs-nebula { animation: none; }
            .obs-shooting, .obs-shooting2, .obs-shooting3 { display: none; }
        }

        /* ── UI colour & glow (Observatory page only — scoped to this file) ── */
        /* Course cards: glassy gradient, glowing border, hover lift + sheen sweep. */
        .path-card, .hr-hub-card {
            background: linear-gradient(150deg, rgba(129,140,248,0.12), rgba(34,211,238,0.05)) !important;
            border: 1px solid rgba(129,140,248,0.30) !important;
            border-radius: 14px !important;
            position: relative; overflow: hidden;
            transition: transform .25s ease, box-shadow .3s ease, border-color .3s ease !important;
        }
        .path-card::after, .hr-hub-card::after {
            content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
            background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,0.14) 50%, transparent 65%);
            transform: translateX(-130%); transition: transform .7s ease;
        }
        .path-card:hover, .hr-hub-card:hover {
            transform: translateY(-5px) !important;
            border-color: rgba(34,211,238,0.75) !important;
            box-shadow: 0 10px 34px rgba(129,140,248,0.30), 0 0 46px rgba(34,211,238,0.20) !important;
        }
        .path-card:hover::after, .hr-hub-card:hover::after { transform: translateX(130%); }
        .path-cert, .hr-hub-cert { color: #67e8f9 !important; }
        .path-icon img, .hr-hub-icon img { box-shadow: 0 0 16px rgba(129,140,248,0.55); border-radius: 8px; }

        /* Section titles → gradient text. */
        .paths-title, .hr-hub-title {
            background-image: linear-gradient(90deg, #a5b4fc, #22d3ee) !important;
            -webkit-background-clip: text !important; background-clip: text !important; -webkit-text-fill-color: transparent !important;
        }

        /* Hero title → animated colour-shifting gradient (background-image, NOT the
           background shorthand, so background-clip:text is not reset to border-box). */
        .hero-title, .hero-title span {
            background-image: linear-gradient(90deg, #a5b4fc, #22d3ee, #c4b5fd, #f9a8d4, #a5b4fc) !important;
            background-size: 300% auto !important;
            -webkit-background-clip: text !important; background-clip: text !important; -webkit-text-fill-color: transparent !important;
            animation: obs-hue 9s linear infinite;
        }
        @keyframes obs-hue { to { background-position: 300% center; } }

        /* Mascot + emblem glow; stat values glow. */
        .hero-icon img, .hero-mascot img, .hero-mascot video { filter: drop-shadow(0 0 24px rgba(129,140,248,0.45)); }
        .stat-value { color: #a5b4fc !important; text-shadow: 0 0 14px rgba(129,140,248,0.55); }

        /* Tabs: hover tint + active glow. */
        .hr-tab:hover { color: #a5b4fc; }
        .hr-tab.active { box-shadow: 0 0 18px rgba(129,140,248,0.35); border-color: rgba(34,211,238,0.5) !important; }

        @media (prefers-reduced-motion: reduce) {
            .hero-title { animation: none; }
            .path-card, .hr-hub-card, .path-card::after, .hr-hub-card::after { transition: none !important; }
        }

        /* ── Linux Practice Sandbox showcase — a prominent, celestial-framed panel
              above the course grid. Reuses SandboxLauncher's vetted launch/session
              UI (mounted into #obs-sandbox-mount); this styles the frame + makes
              the embedded terminal large enough to actually work in. ── */
        .obs-sandbox-showcase {
            --sandbox-accent: #818cf8;   /* SandboxLauncher adopts this house accent */
            max-width: 1280px; margin: 22px auto; padding: 22px 26px;
            border: 1px solid rgba(34,211,238,0.35); border-radius: 16px;
            background: linear-gradient(135deg, rgba(129,140,248,0.14), rgba(34,211,238,0.06));
            box-shadow: 0 0 46px rgba(129,140,248,0.18), inset 0 0 60px rgba(34,211,238,0.05);
        }
        .obs-sandbox-showcase__head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .obs-sandbox-showcase__badge {
            font-size: 0.62rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
            color: #05060f; background: linear-gradient(90deg, #a5b4fc, #22d3ee);
            padding: 4px 10px; border-radius: 999px;
        }
        .obs-sandbox-showcase__title {
            font-size: 1.5rem; font-weight: 800; margin: 0;
            background: linear-gradient(90deg, #a5b4fc, #22d3ee, #c4b5fd);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .obs-sandbox-showcase__desc { color: #b8c1ea; font-size: 0.94rem; margin: 10px 0 14px; max-width: 74ch; line-height: 1.5; }
        .obs-sandbox-showcase__feats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
        .obs-sandbox-showcase__feat {
            font-size: 0.72rem; color: #9aa6e0; border: 1px solid rgba(129,140,248,0.30);
            border-radius: 999px; padding: 4px 12px; background: rgba(129,140,248,0.06);
        }
        /* Two-column top: intro text (left) + a "how to use" guide (right) so the panel
           uses its full width instead of huddling all the content into the left column. */
        .obs-sandbox-showcase__top {
            display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
            gap: 26px; align-items: start;
        }
        @media (max-width: 900px) { .obs-sandbox-showcase__top { grid-template-columns: 1fr; } }
        .obs-sandbox-howto {
            background: rgba(5,6,15,0.5); border: 1px solid rgba(129,140,248,0.28);
            border-radius: 12px; padding: 16px 18px;
        }
        .obs-sandbox-howto__title {
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
            color: #a5b4fc; margin: 0 0 12px;
        }
        .obs-sandbox-howto__steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
        .obs-sandbox-howto__step { display: flex; gap: 11px; align-items: flex-start; font-size: 0.85rem; color: #c7d0f0; line-height: 1.45; }
        .obs-sandbox-howto__num {
            flex: 0 0 auto; width: 22px; height: 22px; border-radius: 999px; margin-top: 1px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 800; color: #05060f;
            background: linear-gradient(90deg, #a5b4fc, #22d3ee);
        }
        .obs-sandbox-howto__step code { background: rgba(129,140,248,0.14); padding: 1px 5px; border-radius: 4px; font-size: 0.82em; color: #d5dcff; }
        .obs-sandbox-howto__step strong { color: #e6ebff; }
        /* Make the embedded ttyd terminal a real working surface. */
        .obs-sandbox-showcase .sandbox-launcher { margin: 16px 0 0; }
        .obs-sandbox-showcase .sandbox-launcher__panel { background: rgba(5,6,15,0.55); border-color: rgba(129,140,248,0.28); }
        .obs-sandbox-showcase .sandbox-launcher__iframe { width: 100%; height: 66vh; min-height: 420px; border: 0; border-radius: 8px; background: #05060f; }
        .obs-sandbox-showcase .sandbox-launcher__iframe-wrap { margin-top: 12px; }

        /* Practice grader UI (revealed after a launch). */
        .obs-sandbox-grade { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(129,140,248,0.22); }
        .obs-grade-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .obs-grade-btn {
            background: linear-gradient(90deg, #818cf8, #22d3ee); color: #05060f; font-weight: 700;
            border: 0; border-radius: 10px; padding: 9px 18px; cursor: pointer; letter-spacing: 0.02em;
            transition: transform .15s ease, box-shadow .25s ease;
        }
        .obs-grade-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(34,211,238,0.30); }
        .obs-grade-hint { font-size: 0.8rem; color: #9aa6e0; }
        .obs-grade-result { margin-top: 12px; font-size: 0.9rem; color: #c7d0f0; }
        .obs-grade-head { font-weight: 700; color: #a5b4fc; margin-bottom: 6px; }
        .obs-grade-list { list-style: none; margin: 0; padding: 0; }
        .obs-grade-list li { padding: 2px 0; }
        .obs-grade-list li.ok { color: #67e8f9; }
        .obs-grade-list li.no { color: #9aa6e0; }
        .obs-grade-badge { margin-top: 10px; font-weight: 700; color: #34d399; }
    </style>
</head>
<body>
    <h1 class="visually-hidden">Hexworth Observatory</h1>

    <!-- Celestial atmosphere (decorative, behind content). -->
    <div class="obs-nebula" aria-hidden="true"></div>
    <div class="obs-stars-far" aria-hidden="true"></div>
    <div class="obs-stars-mid" aria-hidden="true"></div>
    <div class="obs-stars" aria-hidden="true"></div>
    <div class="obs-aurora" aria-hidden="true"></div>
    <div class="obs-aurora-wave" aria-hidden="true"></div>
    <div class="obs-polaris" aria-hidden="true"></div>
    <div class="obs-shooting" aria-hidden="true"></div>
    <div class="obs-shooting2" aria-hidden="true"></div>
    <div class="obs-shooting3" aria-hidden="true"></div>

    <!-- Shared house components (same set the other houses load). -->
    <script src="../../components/SkillTreeData.js"></script>
    <script src="../../components/LearningPaths.js"></script>
    <script src="../../components/AchievementSystem.js"></script>
    <script src="../../components/ProgressManager.js"></script>
    <script src="../../components/FluxCapacitor.js"></script>
    <script src="../../components/ContentCatalog.js"></script>
    <script src="../../config/mascot-lore.js"></script>
    <script src="../../components/FavoritesManager.js"></script>
    <script src="../../components/HouseRenderer.js"></script>
    <!-- Auth + Firestore so the consent gate can store the operator's copy. -->
    <script src="../../components/FirebaseAuth.js"></script>
    <script src="../../arena/firebase-init.js"></script>
    <script src="../../components/ObservatoryConsent.js"></script>
    <script src="../../components/ObservatoryTracker.js"></script>
    <!-- Linux Practice Sandbox launcher (talks to the bc1 lab-manager API). -->
    <script src="../../components/SandboxLauncher.js"></script>

    <script>
        // Observatory has no native modules of its own — it is a launcher for
        // courses that physically live in their topic houses (pointer model).
        const SAMPLE_MODULES = (typeof ContentCatalog !== 'undefined' && ContentCatalog.getHouseModules)
            ? ContentCatalog.getHouseModules('observatory') : [];

        // The house config. `paths` are the scheduled-course redirect cards —
        // each points (href) at the real course in its home house. Add a card
        // here for every course taught on a repeated schedule.
        const OBSERVATORY_CONFIG = {
            houseId: 'observatory',
            // Polaris the armored polar bear — emblem (observatory.webp) + hero
            // poster (observatory-hero.webp) auto-resolve from houseId; the
            // animated hero loop is wired explicitly here.
            mascotVideo: 'https://storage.googleapis.com/hexworth-media/mascots/observatory-hero-animated.mp4',
            icon: '<svg viewBox="0 0 24 24" width="1.1em" height="1.1em" style="vertical-align:middle"><path fill="#a5b4fc" d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg>',
            title: 'Observatory',
            fullTitle: 'Hexworth Observatory',
            customTitle: 'Hexworth <span>Observatory</span>',
            domain: 'Active Courses & Research',
            description: 'Find your way by Polaris. Your scheduled courses gathered in one place — plus the research participation that helps us teach them better.',
            certBadges: [],
            searchPlaceholder: 'Search your courses...',
            paths: [
                // Scheduled courses — each card redirects (href) to the course's
                // real home in its topic house (pointer model; content stays put).
                { id: 'obs-aplus-core1',  href: '/houses/forge/applets/comptia-aplus/core-1/index.html',            icon: '<img src="/assets/images/icons/icon-wrench.webp" alt="A+ Core 1" style="width:40px;height:40px;border-radius:8px;object-fit:cover;">',   name: 'A+ Core 1',                          cert: 'CompTIA 220-1101' },
                { id: 'obs-aplus-core2',  href: '/houses/forge/applets/comptia-aplus/core-2/index.html',            icon: '<img src="/assets/images/icons/icon-wrench.webp" alt="A+ Core 2" style="width:40px;height:40px;border-radius:8px;object-fit:cover;">',   name: 'A+ Core 2',                          cert: 'CompTIA 220-1102' },
                { id: 'obs-md-100',       href: '/houses/forge/md-100/',           icon: '<img src="/assets/images/icons/icon-terminal.webp" alt="MD-100" style="width:40px;height:40px;border-radius:8px;object-fit:cover;">',     name: 'MD-100: Windows Client',             cert: 'Microsoft MD-100' },
                { id: 'obs-md-101',       href: '/houses/forge/md-101/',           icon: '<img src="/assets/images/icons/icon-terminal.webp" alt="MD-101" style="width:40px;height:40px;border-radius:8px;object-fit:cover;">',     name: 'MD-101: Modern Desktops',            cert: 'Microsoft MD-101' },
                { id: 'obs-network-plus', href: '/houses/web/network-plus/index.html', icon: '<img src="/assets/images/icons/icon-globe.webp" alt="Network+" style="width:40px;height:40px;border-radius:8px;object-fit:cover;">',  name: 'Network+',                           cert: 'CompTIA N10-009' },
                { id: 'obs-wsa',          href: '/houses/cloud/modules/wsa/index.html', icon: '<img src="/assets/images/icons/icon-server.webp" alt="Windows Server Administration" style="width:40px;height:40px;border-radius:8px;object-fit:cover;">', name: 'Windows Server Administration', cert: 'CTS1328C' },
                { id: 'obs-python-it',    href: '/houses/code/python-for-it/index.html', icon: '<img src="/assets/images/icons/icon-terminal.webp" alt="Python for IT" style="width:40px;height:40px;border-radius:8px;object-fit:cover;">', name: 'Python for IT',                cert: 'COP1034C' },
                { id: 'obs-ethics-it',    href: '/houses/divergent/ethics-it/index.html', icon: '<img src="/assets/images/icons/icon-scales.webp" alt="Ethics in IT" style="width:40px;height:40px;border-radius:8px;object-fit:cover;">', name: 'Ethics in IT',                cert: 'CIS4253' },

        // Grade the practice challenges for the active sandbox session (server-verified
        // via the lab-manager), render per-challenge results, and award the Linux
        // Practitioner badge on full completion.
        async function gradePractice() {
            var out = document.getElementById('obs-grade-result');
            if (!out) return;
            var sid = window.__obsSandboxSession;
            if (!sid) { out.textContent = 'Launch the sandbox first, then grade.'; return; }
            out.textContent = 'Checking your work...';
            try {
                var r = await SandboxLauncher.checkPractice(sid);
                out.innerHTML = '';
                var head = document.createElement('div');
                head.className = 'obs-grade-head';
                head.textContent = r.passed + ' / ' + r.total + ' challenges complete';
                out.appendChild(head);
                var ul = document.createElement('ul');
                ul.className = 'obs-grade-list';
                (r.results || []).forEach(function (c) {
                    // textContent (not innerHTML) — descriptions are server-controlled but never trusted into markup.
                    var li = document.createElement('li');
                    li.className = c.pass ? 'ok' : 'no';
                    li.textContent = (c.pass ? '✓ ' : '✗ ') + c.desc;
                    ul.appendChild(li);
                });
                out.appendChild(ul);
                if (r.complete && typeof AchievementSystem !== 'undefined') {
                    var newly = AchievementSystem.unlock('linux_sandbox_practitioner');
                    var badge = document.createElement('div');
                    badge.className = 'obs-grade-badge';
                    badge.textContent = newly ? 'Badge earned: Linux Practitioner!' : 'All complete. Badge already earned.';
                    out.appendChild(badge);
                }
            } catch (e) {
                out.textContent = 'Could not grade right now. Make sure your sandbox is still running.';
            }
        }

        // Wire the grade button once (idempotent — mountSandbox may retry).
        function wireSandboxGrader() {
            var btn = document.getElementById('obs-grade-btn');
            if (btn && !btn.__wired) { btn.__wired = true; btn.addEventListener('click', gradePractice); }
        }

        // Gate the house behind research consent: render only once the signed-in
        // user has a consent record (existing or freshly submitted).
        ObservatoryConsent.ensureConsent(function () {
            HouseRenderer.init(OBSERVATORY_CONFIG);
            // Consented cohort — start activity tracking.
            if (typeof ObservatoryTracker !== 'undefined') ObservatoryTracker.init();
            // Mount the Linux Practice Sandbox launcher once its showcase panel
            // (from afterStatsHTML) is in the DOM. Retry briefly in case the house
            // render is asynchronous, so we never miss the mount point.
            (function mountSandbox(tries) {
                var el = document.getElementById('obs-sandbox-mount');
                if (el && typeof SandboxLauncher !== 'undefined') {
                    SandboxLauncher.renderButton(el, 'linux-sandbox', {
                        onLaunch: function (labId, result) {
                            // Record each launch as a consented Observatory activity event.
                            if (typeof ObservatoryTracker !== 'undefined' && ObservatoryTracker.logSandbox) {
                                ObservatoryTracker.logSandbox(labId);
                            }
                            // Remember the session so the grader can check it; reveal the grader.
                            window.__obsSandboxSession = result && result.sessionId;
                            var g = document.getElementById('obs-sandbox-grade');
                            if (g) g.style.display = '';
                        },
                        onEnd: function () {
                            // Session ended (destroyed or expired) — retire the now-dead grader.
                            window.__obsSandboxSession = null;
                            var g = document.getElementById('obs-sandbox-grade');
                            if (g) g.style.display = 'none';
                            var out = document.getElementById('obs-grade-result');
                            if (out) out.textContent = '';
                        }
                    });
                    wireSandboxGrader();
                    return;
                }
                if (tries > 0) setTimeout(function () { mountSandbox(tries - 1); }, 60);
            })(15);
        });
    </script>
