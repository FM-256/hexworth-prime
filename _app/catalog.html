<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Hexworth Prime hub catalog, every course and learning hub as a cartridge: cybersecurity, networking, cloud, Linux, programming, and more.">
    <title>Hub Catalog | Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/hexworth-mark.webp">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg:#0a0c16; --panel:#12151f; --line:#232838; --text:#e9edf4; --muted:#8b95a8; --cyan:#22d3ee; }
        body {
            min-height:100vh; color:var(--text);
            background:radial-gradient(1200px 560px at 75% -8%, #161d30 0, var(--bg) 60%);
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; line-height:1.5;
        }
        .header {
            display:flex; justify-content:space-between; align-items:center; padding:20px 40px;
            border-bottom:1px solid #222; background:rgba(10,10,10,.8); backdrop-filter:blur(10px);
            position:sticky; top:0; z-index:10;
        }
        .logo { font-size:1rem; letter-spacing:.3em; color:#888; text-transform:uppercase; text-decoration:none; }
        .logo:hover { color:var(--cyan); }
        .home-link { color:#888; font-size:.85rem; text-decoration:none; letter-spacing:.1em; }
        .home-link:hover { color:var(--cyan); }
        .wrap { max-width:1180px; margin:0 auto; padding:44px 24px 90px; }
        .eyebrow { font-size:.72rem; letter-spacing:.3em; text-transform:uppercase; color:var(--cyan); font-weight:700; }
        h1 { font-size:clamp(2.2rem,5vw,3.2rem); font-weight:800; letter-spacing:-.01em; margin:6px 0 10px; }
        .sub { color:var(--muted); font-size:1.05rem; max-width:60ch; }

        /* Filters */
        .filters { display:flex; flex-wrap:wrap; gap:9px; margin:30px 0 6px; }
        .filter-btn {
            padding:8px 16px; border:1px solid var(--line); border-radius:999px; background:var(--panel);
            color:#d8d8e4; font-size:.85rem; cursor:pointer; transition:border-color .2s ease, background .2s ease;
        }
        .filter-btn:hover { border-color:var(--cyan); }
        .filter-btn.active { background:var(--cyan); border-color:var(--cyan); color:#04121a; font-weight:700; }

        /* Cartridge grid + card (approved treatment) */
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); gap:20px; margin-top:26px; }
        .cart {
            position:relative; display:block; border-radius:16px; overflow:hidden; text-decoration:none;
            border:2px solid var(--hc,#22d3ee); aspect-ratio:1; background:#0c0e18;
            box-shadow:0 0 0 1px rgba(255,255,255,.03), 0 10px 30px rgba(0,0,0,.5);
            transition:transform .18s ease, box-shadow .25s ease;
        }
        .cart:hover, .cart:focus-visible {
            transform:translateY(-4px); outline:none;
            box-shadow:0 0 34px color-mix(in srgb, var(--hc,#22d3ee) 45%, transparent), 0 14px 40px rgba(0,0,0,.6);
        }
        .cart .cover { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
        /* icon fallback tile when a hub has no cover yet */
        .cart .fallback { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
            background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--hc,#22d3ee) 22%, #0c0e18), #0c0e18); }
        .cart .fallback img { width:40%; height:40%; object-fit:contain; opacity:.9; }
        .tbar { position:absolute; left:0; right:0; bottom:0; padding:44px 15px 14px;
            background:linear-gradient(transparent, rgba(6,8,15,.55) 40%, rgba(6,8,15,.94)); }
        .t { font-weight:750; font-size:1.04rem; line-height:1.15; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.6); }
        .s { font-size:.76rem; letter-spacing:.04em; color:var(--hc,#22d3ee); margin-top:3px; font-weight:600; }
        .empty { color:var(--muted); padding:40px 0; }
        .footer { padding:24px 40px; text-align:center; border-top:1px solid #222; }
        .footer-note { font-size:.7rem; color:#555; letter-spacing:.3em; text-transform:uppercase; }
        @media (max-width:820px){ .header,.footer{ padding:16px 20px; } .wrap{ padding:0 20px 60px; } }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Hexworth Prime</a>
        <a href="/" class="home-link">Hexworth.com &rarr;</a>
    </header>
    <div class="wrap">
        <div class="eyebrow">The Collection</div>
        <h1>Hub Catalog</h1>
        <p class="sub">Every course and learning hub, as a cartridge. Pick your path.</p>
        <div class="filters" id="filters"></div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" style="display:none;">No hubs match that filter.</div>
    </div>
    <footer class="footer">
        <div class="footer-note">Hexworth Prime</div>
    </footer>

    <script src="/components/HubRegistry.js"></script>
    <script>
    (function () {
        'use strict';
        // House accent colors (arcade palette + the houses the arcade did not define).
        var HOUSE_COLOR = {
            web:'#3b82f6', script:'#7c3aed', key:'#eab308', eye:'#6366f1', code:'#ec4899',
            forge:'#f97316', shield:'#ef4444', cloud:'#06b6d4', ai:'#a855f7', matrix:'#22c55e',
            divergent:'#14b8a6', 'security-plus':'#ef4444', 'dark-arts':'#c026d3', signal:'#f59e0b',
            arctic:'#38bdf8', observatory:'#22d3ee'
        };
        var SLUG = /^[a-z0-9][a-z0-9-]{0,63}$/;
        var ICON = /^\/assets\/images\/icons\/[A-Za-z0-9_-]+\.webp$/;

        // Resolve a hub's house from its hubHref (/houses/<house>/... or /<house>/... for arctic/signal).
        function houseOf(hub) {
            var href = hub.hubHref || '';
            var m = href.match(/\/houses\/([a-z0-9-]+)/) || href.match(/^\/([a-z0-9-]+)\//);
            var h = m ? m[1] : '';
            if (h === 'dark-arts' || href.indexOf('/dark-arts/') !== -1) return 'dark-arts';
            if (href.indexOf('/arctic') === 0) return 'arctic';
            if (href.indexOf('/signal') === 0) return 'signal';
            return h;
        }
        function safeIcon(v) { return (typeof v === 'string' && ICON.test(v)) ? v : '/assets/images/icons/hexworth-mark.webp'; }

        var hubs = (window.HubRegistry ? HubRegistry.sorted() : []).map(function (h) {
            return { hub: h, house: houseOf(h), color: '' };
        });

        var grid = document.getElementById('grid');
        var houses = [];

        function buildCard(entry) {
            var h = entry.hub, house = entry.house;
            var color = HOUSE_COLOR[house] || '#22d3ee';
            if (houses.indexOf(house) === -1 && house) { houses.push(house); }

            var card = document.createElement('a');
            card.className = 'cart';
            card.style.setProperty('--hc', color);
            card.dataset.house = house;
            card.setAttribute('href', h.hubHref);   // internal registry href (trusted, static)

            // Cover image, with an icon fallback tile if the cover is missing (e.g. a brand-new hub).
            var img = document.createElement('img');
            img.className = 'cover';
            img.alt = '';
            if (SLUG.test(h.id)) { img.src = '/assets/images/covers/' + h.id + '.webp'; }
            img.onerror = function () {
                var fb = document.createElement('div'); fb.className = 'fallback';
                var fi = document.createElement('img'); fi.src = safeIcon(h.icon); fi.alt = '';
                fb.appendChild(fi); img.replaceWith(fb);
            };
            card.appendChild(img);

            var tbar = document.createElement('div'); tbar.className = 'tbar';
            var t = document.createElement('div'); t.className = 't'; t.textContent = h.label || h.id;  // textContent = XSS-safe
            tbar.appendChild(t);
            if (h.sublabel) { var s = document.createElement('div'); s.className = 's'; s.textContent = h.sublabel; tbar.appendChild(s); }
            card.appendChild(tbar);
            return card;
        }

        hubs.forEach(function (e) { grid.appendChild(buildCard(e)); });

        // House filter bar
        var filters = document.getElementById('filters');
        var all = document.createElement('button'); all.className = 'filter-btn active'; all.textContent = 'All'; all.dataset.house = 'all';
        filters.appendChild(all);
        houses.sort().forEach(function (h) {
            var b = document.createElement('button'); b.className = 'filter-btn'; b.dataset.house = h; b.textContent = h;
            filters.appendChild(b);
        });
        filters.addEventListener('click', function (ev) {
            var btn = ev.target.closest('.filter-btn'); if (!btn) { return; }
            filters.querySelectorAll('.filter-btn').forEach(function (x) { x.classList.toggle('active', x === btn); });
            var want = btn.dataset.house; var shown = 0;
            grid.querySelectorAll('.cart').forEach(function (c) {
                var vis = (want === 'all' || c.dataset.house === want);
                c.style.display = vis ? '' : 'none'; if (vis) { shown++; }
            });
            document.getElementById('empty').style.display = shown ? 'none' : 'block';
        });
    })();
    </script>
</body>
</html>
