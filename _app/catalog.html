<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Hexworth Prime hub catalog, every course and learning hub as a cartridge: cybersecurity, networking, cloud, Linux, programming, and more.">
    <title>Hub Catalog | Hexworth Prime</title>
    <link rel="icon" type="image/webp" href="/assets/images/icons/hexworth-mark.webp">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg:#0a0c16; --panel:#12151f; --line:#232838; --text:#e9edf4; --muted:#8b95a8; --cyan:#22d3ee; }
        body {
            min-height:100vh; color:var(--text);
            background:radial-gradient(1200px 560px at 75% -8%, #161d30 0, var(--bg) 60%);
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; line-height:1.5;
        }
        .header {
            display:flex; justify-content:space-between; align-items:center; padding:20px 40px;
            border-bottom:1px solid #222; background:rgba(10,10,10,.8); backdrop-filter:blur(10px);
            position:sticky; top:0; z-index:10;
        }
        .logo { font-size:1rem; letter-spacing:.3em; color:#888; text-transform:uppercase; text-decoration:none; }
        .logo:hover { color:var(--cyan); }
        .home-link { color:#888; font-size:.85rem; text-decoration:none; letter-spacing:.1em; }
        .home-link:hover { color:var(--cyan); }
        .wrap { max-width:1180px; margin:0 auto; padding:44px 24px 90px; }
        .eyebrow { font-size:.72rem; letter-spacing:.3em; text-transform:uppercase; color:var(--cyan); font-weight:700; }
        h1 { font-size:clamp(2.2rem,5vw,3.2rem); font-weight:800; letter-spacing:-.01em; margin:6px 0 10px; }
        .sub { color:var(--muted); font-size:1.05rem; max-width:60ch; }

        /* Filters */
        .filters { display:flex; flex-wrap:wrap; gap:9px; margin:30px 0 6px; }
        .filter-btn {
            padding:8px 16px; border:1px solid var(--line); border-radius:999px; background:var(--panel);
            color:#d8d8e4; font-size:.85rem; cursor:pointer; transition:border-color .2s ease, background .2s ease;
        }
        .filter-btn:hover { border-color:var(--cyan); }
        .filter-btn.active { background:var(--cyan); border-color:var(--cyan); color:#04121a; font-weight:700; }

        /* Cartridge grid + card (approved treatment) */
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); gap:20px; margin-top:26px; }
        .cart {
            position:relative; display:block; border-radius:16px; overflow:hidden; text-decoration:none;
            border:2px solid var(--hc,#22d3ee); aspect-ratio:1; background:#0c0e18;
            box-shadow:0 0 0 1px rgba(255,255,255,.03), 0 10px 30px rgba(0,0,0,.5);
            transition:transform .18s ease, box-shadow .25s ease;
        }
        .cart:hover, .cart:focus-visible {
            transform:translateY(-4px); outline:none;
            box-shadow:0 0 34px color-mix(in srgb, var(--hc,#22d3ee) 45%, transparent), 0 14px 40px rgba(0,0,0,.6);
        }
        .cart .cover { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
        /* icon fallback tile when a hub has no cover yet */
        .cart .fallback { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
            background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--hc,#22d3ee) 22%, #0c0e18), #0c0e18); }
        .cart .fallback img { width:40%; height:40%; object-fit:contain; opacity:.9; }
        .tbar { position:absolute; left:0; right:0; bottom:0; padding:44px 15px 14px;
            background:linear-gradient(transparent, rgba(6,8,15,.55) 40%, rgba(6,8,15,.94)); }
        .t { font-weight:750; font-size:1.04rem; line-height:1.15; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.6); }
        .s { font-size:.76rem; letter-spacing:.04em; color:var(--hc,#22d3ee); margin-top:3px; font-weight:600; }
        .empty { color:var(--muted); padding:40px 0; }
        .footer { padding:24px 40px; text-align:center; border-top:1px solid #222; }
        .footer-note { font-size:.7rem; color:#555; letter-spacing:.3em; text-transform:uppercase; }
        @media (max-width:820px){ .header,.footer{ padding:16px 20px; } .wrap{ padding:0 20px 60px; } }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Hexworth Prime</a>
        <a href="/" class="home-link">Hexworth.com &rarr;</a>
    </header>
    <div class="wrap">
        <div class="eyebrow">The Collection</div>
        <h1>Hub Catalog</h1>
        <p class="sub">Every course and learning hub, as a cartridge. Pick your path.</p>
        <div class="filters" id="catfilters"></div>
        <div class="filters" id="filters"></div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" style="display:none;">No hubs match that filter.</div>
    </div>
    <footer class="footer">
        <div class="footer-note">Hexworth Prime</div>
    </footer>

    <script src="/components/HubRegistry.js"></script>
    <script src="/components/TenantFilter.js"></script>
    <script>
    (function () {
        'use strict';
        // House accent colors (arcade palette + the houses the arcade did not define).
        var HOUSE_COLOR = {
            web:'#3b82f6', script:'#7c3aed', key:'#eab308', eye:'#6366f1', code:'#ec4899',
            forge:'#f97316', shield:'#ef4444', cloud:'#06b6d4', ai:'#a855f7', matrix:'#22c55e',
            divergent:'#14b8a6', 'security-plus':'#ef4444', 'dark-arts':'#c026d3', signal:'#f59e0b',
            arctic:'#38bdf8', observatory:'#22d3ee', wireshark:'#0ea5e9'
        };
        var SLUG = /^[a-z0-9][a-z0-9-]{0,63}$/;
        var ICON = /^\/assets\/images\/icons\/[A-Za-z0-9_-]+\.webp$/;

        // Resolve a hub's house from its hubHref (/houses/<house>/... or /<house>/... for arctic/signal).
        function houseOf(hub) {
            var href = hub.hubHref || '';
            var m = href.match(/\/houses\/([a-z0-9-]+)/) || href.match(/^\/([a-z0-9-]+)\//);
            var h = m ? m[1] : '';
            if (h === 'dark-arts' || href.indexOf('/dark-arts/') !== -1) return 'dark-arts';
            if (href.indexOf('/arctic') === 0) return 'arctic';
            if (href.indexOf('/signal') === 0) return 'signal';
            return h;
        }
        function safeIcon(v) { return (typeof v === 'string' && ICON.test(v)) ? v : '/assets/images/icons/hexworth-mark.webp'; }
        // Internal-path only: reject protocol-relative (//), schemes (javascript:), and anything not a
        // rooted app path. Today hubHref is static/trusted; this keeps the card safe if the source ever
        // becomes dynamic (e.g. admin-authored allWithDynamic hubs).
        function safeHref(v) { return (typeof v === 'string' && /^\/(?!\/)[A-Za-z0-9/_.?=&%-]*$/.test(v)) ? v : null; }

        // Source list, with three guards applied before render:
        //  - tenantAssignable !== false: keep internal/non-catalog hubs off this public browse page.
        //  - status !== 'workshop': quarantined content stays hidden.
        //  - !h.parent: container MEMBERS render inside their container, never beside it. This is
        //    the same predicate byHouse(), Explore All and HouseRenderer.mergeDynamicHubs already
        //    use; catalog was the last surface still rendering children flat (taskboard #232).
        //    Measured before the fix: 141 of 143 entries rendered, 69 of them children -- half the
        //    public catalog was duplicate cards for navigation that already exists one click away
        //    inside the container. All 69 were verified reachable from their container's own page
        //    before this filter was added; nothing here is the sole path to any hub.
        //
        //  ORDERING IS LOAD-BEARING: this filter MUST ship together with the dynamic-hub merge
        //  below, never ahead of it. cloud-master is a Firestore hub with 6 children and no static
        //  registry entry, so filtering children while catalog still had no Firestore wiring would
        //  have removed those 6 cards with NO container card left to reach them from -- a worse
        //  regression than the duplication it fixes (taskboard #243).
        function topLevelPublic(h) {
            return h && h.tenantAssignable !== false && h.status !== 'workshop' && !h.parent;
        }
        var source = (window.HubRegistry ? HubRegistry.sorted() : []).filter(topLevelPublic);
        if (window.TenantFilter && TenantFilter.filterHubs) { source = TenantFilter.filterHubs(source); }
        var hubs = source.map(function (h) {
            return { hub: h, house: houseOf(h), color: '' };
        });

        var grid = document.getElementById('grid');
        var houses = [];
        var cats = [];   // hub categories present (cert-prep / course / platform-hub), for the category filter

        function buildCard(entry) {
            var h = entry.hub, house = entry.house;
            var href = safeHref(h.hubHref);
            if (!href) { return null; }   // never render a card that would link somewhere unsafe/broken
            var color = HOUSE_COLOR[house] || '#22d3ee';
            // Only REAL houses (those with a color) get a house-filter button. Flat cert-prep hubs live at
            // /houses/<cert-slug>/, so houseOf() derives the cert slug as a pseudo-house; excluding those
            // here prevents 11 singleton buttons. Such cards still show under "All" and filter by category.
            if (house && HOUSE_COLOR[house] && houses.indexOf(house) === -1) { houses.push(house); }

            var card = document.createElement('a');
            card.className = 'cart';
            card.style.setProperty('--hc', color);
            card.dataset.house = house;
            card.dataset.category = h.category || 'other';
            if (h.category && cats.indexOf(h.category) === -1) { cats.push(h.category); }
            card.setAttribute('href', href);

            // Cover image, with an icon fallback tile if the cover is missing (e.g. a brand-new hub).
            var img = document.createElement('img');
            img.className = 'cover';
            img.alt = '';
            if (SLUG.test(h.id)) { img.src = '/assets/images/covers/' + h.id + '.webp'; }
            img.onerror = function () {
                var fb = document.createElement('div'); fb.className = 'fallback';
                var fi = document.createElement('img'); fi.src = safeIcon(h.icon); fi.alt = '';
                fb.appendChild(fi); img.replaceWith(fb);
            };
            card.appendChild(img);

            var tbar = document.createElement('div'); tbar.className = 'tbar';
            var t = document.createElement('div'); t.className = 't'; t.textContent = h.label || h.id;  // textContent = XSS-safe
            tbar.appendChild(t);
            if (h.sublabel) { var s = document.createElement('div'); s.className = 's'; s.textContent = h.sublabel; tbar.appendChild(s); }
            card.appendChild(tbar);
            return card;
        }

        hubs.forEach(function (e) { var c = buildCard(e); if (c) { grid.appendChild(c); } });

        // Two filter dimensions: category (cert-prep / course / platform-hub) and house. A card shows
        // only if it matches BOTH active filters. The category bar is the organizing label Frank added.
        var activeHouse = 'all', activeCat = 'all';
        var rendered = {};                       // hub ids already on screen, so the merge only ADDS
        hubs.forEach(function (e) { if (e.hub && e.hub.id) { rendered[e.hub.id] = true; } });
        function applyFilter() {
            var shown = 0;
            grid.querySelectorAll('.cart').forEach(function (c) {
                var vis = (activeHouse === 'all' || c.dataset.house === activeHouse)
                    && (activeCat === 'all' || c.dataset.category === activeCat);
                c.style.display = vis ? '' : 'none'; if (vis) { shown++; }
            });
            document.getElementById('empty').style.display = shown ? 'none' : 'block';
        }
        // Buttons are REBUILT when admin-created hubs arrive (they can introduce a house or
        // category the static registry never had), but the click listener is bound ONCE. Binding
        // it inside the fill would add a second handler on every refill, and each handler calls
        // onPick+applyFilter, so the bar would fire N times per click.
        function fillBar(el, values, active) {
            el.textContent = '';
            var all = document.createElement('button');
            all.className = 'filter-btn' + (active === 'all' ? ' active' : '');
            all.textContent = 'All'; all.dataset.val = 'all'; el.appendChild(all);
            values.forEach(function (v) {
                var b = document.createElement('button');
                b.className = 'filter-btn' + (active === v ? ' active' : '');
                b.dataset.val = v; b.textContent = v; el.appendChild(b);
            });
        }
        function bindBar(el, onPick) {
            el.addEventListener('click', function (ev) {
                var btn = ev.target.closest('.filter-btn'); if (!btn) { return; }
                el.querySelectorAll('.filter-btn').forEach(function (x) { x.classList.toggle('active', x === btn); });
                onPick(btn.dataset.val); applyFilter();
            });
        }
        function buildBar(el, values, onPick) { fillBar(el, values, 'all'); bindBar(el, onPick); }
        // Category order: cert-prep, course, platform-hub, then any others.
        var CAT_ORDER = ['cert-prep', 'course', 'platform-hub'];
        function sortCats() {
            cats.sort(function (a, b) { var ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
        }
        sortCats();
        buildBar(document.getElementById('catfilters'), cats, function (v) { activeCat = v; });
        buildBar(document.getElementById('filters'), houses.slice().sort(), function (v) { activeHouse = v; });
        function refreshBars() {
            sortCats();
            fillBar(document.getElementById('catfilters'), cats, activeCat);
            fillBar(document.getElementById('filters'), houses.slice().sort(), activeHouse);
        }

        // ── Admin-created (Firestore) hubs ────────────────────────────────────────────────
        // The static catalog is ALREADY on screen at this point; this only ever appends. Every
        // failure path resolves quietly, so a slow, blocked or absent Firestore degrades this to
        // the static catalog instead of blanking a public page.
        //
        // This is the other half of the container-grouping fix. The `!h.parent` filter above
        // hides container members, which is right for the 8 static families whose container is
        // itself a catalog card -- but cloud-master is a Firestore-only hub with 6 children and
        // no static entry, so without this merge those 6 would vanish with nothing to reach them
        // from (taskboard #243). Filter and merge belong in the same change.
        //
        // Cache key and TTL are deliberately shared with HouseRenderer's own merge so the two
        // surfaces reuse one fetch rather than each paying for Firestore.
        var HUBS_CACHE_KEY = 'hubdisc_published_v1', HUBS_CACHE_TTL = 120000;
        function readHubsCache() {
            try {
                var o = JSON.parse(sessionStorage.getItem(HUBS_CACHE_KEY) || 'null');
                if (!o || typeof o.t !== 'number' || (Date.now() - o.t) > HUBS_CACHE_TTL || !Array.isArray(o.hubs)) { return null; }
                return o.hubs;
            } catch (e) { return null; }
        }
        function writeHubsCache(list) {
            try { sessionStorage.setItem(HUBS_CACHE_KEY, JSON.stringify({ t: Date.now(), hubs: list })); } catch (e) { /* quota / private mode */ }
        }
        function loadScriptOnce(src) {
            return new Promise(function (res, rej) {
                if (document.querySelector('script[src="' + src + '"]')) { return res(); }
                var s = document.createElement('script');
                s.src = src; s.onload = function () { res(); }; s.onerror = function () { rej(new Error('load failed: ' + src)); };
                document.head.appendChild(s);
            });
        }
        // Reuses ArenaFirebase rather than retyping the app config: that object is duplicated
        // across many files already, and a retyped apiKey fails silently. It lazy-imports the
        // MODULAR SDK and exposes exactly the {db, firestore} shape allWithDynamic expects.
        function ensureFirestore() {
            if (typeof ArenaFirebase !== 'undefined' && ArenaFirebase.db && window.firebaseFirestore) {
                return Promise.resolve({ db: ArenaFirebase.db, firestore: window.firebaseFirestore });
            }
            return loadScriptOnce('/arena/firebase-init.js')
                .then(function () {
                    if (typeof ArenaFirebase === 'undefined' || !ArenaFirebase.init) { throw new Error('ArenaFirebase unavailable'); }
                    return ArenaFirebase.init();
                })
                .then(function () {
                    if (!ArenaFirebase.db || !window.firebaseFirestore) { throw new Error('Firestore handle missing after init'); }
                    return { db: ArenaFirebase.db, firestore: window.firebaseFirestore };
                });
        }
        function appendDynamic(list) {
            var add = (list || []).filter(function (h) {
                return h && h.id && !rendered[h.id] && topLevelPublic(h);
            });
            if (window.TenantFilter && TenantFilter.filterHubs) { add = TenantFilter.filterHubs(add); }
            var appended = 0;
            add.forEach(function (h) {
                // A Firestore hub often carries no hubHref; its canonical route is /houses/hub/<id>.
                // Normalise onto the shape buildCard/houseOf expect rather than special-casing them.
                var norm = {
                    id: h.id, label: h.label || h.id, sublabel: h.sublabel || '',
                    icon: h.icon, category: h.category,
                    hubHref: h.hubHref || ('/houses/hub/' + h.id)
                };
                if (!safeHref(norm.hubHref)) { return; }
                var c = buildCard({ hub: norm, house: houseOf(norm), color: '' });
                if (c) { grid.appendChild(c); rendered[h.id] = true; appended++; }
            });
            // buildCard pushes into houses/cats as a side effect, so the bars can be stale now.
            if (appended) { refreshBars(); applyFilter(); }
        }

        var cachedHubs = readHubsCache();
        if (cachedHubs) {
            appendDynamic(cachedHubs);                     // cache hit: no Firebase load at all
        } else {
            ensureFirestore().then(function (ctx) {
                return HubRegistry.allWithDynamic({ db: ctx.db, firestore: ctx.firestore, isAdmin: false })
                    .then(function (merged) {
                        var staticIds = {};
                        HubRegistry.all().forEach(function (h) { staticIds[h.id] = true; });
                        var dynamicOnly = merged.filter(function (h) { return !staticIds[h.id]; });
                        writeHubsCache(dynamicOnly);
                        appendDynamic(dynamicOnly);
                    });
            }).catch(function (e) {
                // A public browse page must never break because discovery failed.
                if (console && console.warn) { console.warn('[catalog] admin-created hubs unavailable: ' + (e && e.message ? e.message : e)); }
            });
        }
    })();
    </script>
</body>
</html>
