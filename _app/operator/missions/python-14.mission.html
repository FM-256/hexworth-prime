<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PYTHON-14: Supply Chain | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <script src="../../components/ModuleProgress.js"></script>
</head>
<body>
<h1 class="visually-hidden">PYTHON-14: Supply Chain</h1>
    <div id="operator-root"></div>

    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/OperatorInterpreter.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/python-14.config.js"></script>
    <script>
    /* PYTHON-14: Supply Chain — 10x10 compromise tracing.
       4-system chain: vendor-repo → build-server → staging → production.
       Each system behind a different gate type. Student traces the
       attack path from vendor compromise through the entire delivery
       pipeline. Teaches supply chain attack concepts (SolarWinds-style). */
    (function() {
        var engine = OperatorEngine.init(PYTHON_14_CONFIG);
        var agent  = AgentBridge.create(engine);

        engine.editor.onRun(function() {
            var code = engine.editor.getCode();
            engine.editor.clearOutput();
            OperatorInterpreter.reset();
            OperatorInterpreter.run(code, agent, engine.printLine)
                .then(function(result) {
                    if (result.error) {
                        engine.printLine('Error: ' + result.error, 'error');
                    } else {
                        engine.printLine('Program complete. ' + result.cmdCount + ' agent commands executed.', 'system');
                    }
                });
        });

        engine.editor.onStop(function() {
            OperatorInterpreter.cancel();
        });
    })();
    </script>
</body>
</html>
