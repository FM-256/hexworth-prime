<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIREWALL-02: Zero Day Response | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
</head>
<body>
    <div id="operator-root"></div>

    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/firewall-02.config.js"></script>
    <script>
    (function() {
        var engine = OperatorEngine.init(FIREWALL_02_CONFIG);
        var agent  = AgentBridge.create(engine);
        var config = FIREWALL_02_CONFIG;

        function currentCellType() {
            var s = engine.getState();
            return config.grid.cells[s.position.row][s.position.col];
        }

        // ---- Command handlers ----

        function cmdHelp() {
            engine.printLine('', 'system');
            engine.printLine('\u2550\u2550\u2550 COMMAND REFERENCE \u2550\u2550\u2550', 'heading');
            engine.printLine('  scan              Survey area, reveal adjacent nodes', 'info');
            engine.printLine('  move <dir>        Move agent (north/south/east/west or n/s/e/w)', 'info');
            engine.printLine('  examine           Investigate current node in depth', 'info');
            engine.printLine('  analyze <node>    Deep traffic analysis of a node', 'info');
            engine.printLine('  rule <pattern>    Write a custom WAF rule (at RULE-ENGINE)', 'info');
            engine.printLine('  segment <target>  Isolate a network segment (at QUARANTINE or DB-SERVER)', 'info');
            engine.printLine('  block <ip>        Block an IP address at the perimeter', 'info');
            engine.printLine('  verify            Verify perimeter is hardened (at EGRESS-MON)', 'info');
            engine.printLine('  status            Show position and objectives', 'info');
            engine.printLine('  help              Show this reference', 'info');
            engine.printLine('  clear             Clear terminal output', 'info');
        }

        function cmdScan() {
            var state = engine.getState();
            var col = state.position.col, row = state.position.row;
            var cellType = config.grid.cells[row][col];
            engine.printLine('Scanning area...', 'system');
            engine.printLine('', 'system');
            if (cellType !== 'empty' && cellType !== 'wall') {
                var cur = config.nodes[cellType];
                engine.printLine('Current: ' + cur.label + ' (' + cur.ip + ')', 'heading');
                engine.printLine(cur.desc, 'info');
            } else { engine.printLine('Current: Clear path (no node)', 'heading'); }
            engine.printLine('', 'system');
            engine.printLine('Adjacent:', 'heading');
            var dirs = [{ name: 'North', dc: 0, dr: -1 }, { name: 'South', dc: 0, dr: 1 }, { name: 'East', dc: 1, dr: 0 }, { name: 'West', dc: -1, dr: 0 }];
            dirs.forEach(function(d) {
                var nc = col + d.dc, nr = row + d.dr;
                if (nc < 0 || nc >= config.grid.cols || nr < 0 || nr >= config.grid.rows) { engine.printLine('  ' + d.name + ': [network edge]', 'system'); return; }
                var type = config.grid.cells[nr][nc];
                if (type === 'wall') { engine.printLine('  ' + d.name + ': [blocked]', 'system'); return; }
                var key = nc + ',' + nr;
                if (!state.visibility[key] || state.visibility[key] === 'hidden') state.visibility[key] = 'revealed';
                if (type === 'empty') { engine.printLine('  ' + d.name + ': Clear path', 'info'); }
                else { var info = config.nodes[type]; engine.printLine('  ' + d.name + ': ' + info.label + ' (' + info.ip + ')', 'node-info'); }
            });
            engine.updateGrid(); engine.saveState();
        }

        function cmdMove(args) {
            if (!args.length) { engine.printLine('Usage: move <direction>', 'error'); return; }
            var dirMap = { 'north': [0,-1], 'n': [0,-1], 'south': [0,1], 's': [0,1], 'east': [1,0], 'e': [1,0], 'west': [-1,0], 'w': [-1,0] };
            var dir = args[0].toLowerCase();
            if (!dirMap[dir]) { engine.printLine('Unknown direction: ' + args[0], 'error'); return; }
            var state = engine.getState();
            var d = dirMap[dir], newCol = state.position.col + d[0], newRow = state.position.row + d[1];
            if (newCol < 0 || newCol >= config.grid.cols || newRow < 0 || newRow >= config.grid.rows) { engine.printLine('Edge of network.', 'error'); return; }
            var cellType = config.grid.cells[newRow][newCol];
            if (cellType === 'wall') { engine.printLine('Blocked.', 'error'); return; }
            state.position = { col: newCol, row: newRow };
            state.visibility[newCol + ',' + newRow] = 'visited';
            if (cellType !== 'empty') state.nodesDiscovered.add(cellType);
            engine.revealAdjacent(newCol, newRow);
            var dirFull = { n: 'north', s: 'south', e: 'east', w: 'west' };
            var dirName = dirFull[dir] || dir;
            if (cellType === 'empty') { engine.printLine('Moving ' + dirName + '... Clear path.', 'system'); }
            else { var info = config.nodes[cellType]; engine.printLine('Moving ' + dirName + '... ' + info.label + ' (' + info.ip + ')', 'success'); engine.printLine(info.desc, 'info'); }
            engine.checkObjectives(); engine.updateGrid(); engine.saveState();
        }

        function cmdExamine() {
            var state = engine.getState();
            var type = currentCellType();
            if (type === 'empty' || type === 'wall') { engine.printLine('Nothing notable here. Move to a node.', 'system'); return; }
            engine.printLine('', 'system');
            switch (type) {
                case 'waf-logs':
                    engine.printLine('=== WAF REQUEST LOG ===', 'heading');
                    engine.printLine('[03/05 02:14] POST /api/search \u2014 200 (PASSED)', 'node-info');
                    engine.printLine('  Payload: {"q":"test\' OR 1=1--"}  \u2192 BLOCKED by rule 942100', 'info');
                    engine.printLine('[03/05 02:15] POST /api/search \u2014 200 (PASSED)', 'node-info');
                    engine.printLine('  Payload: {"q":"te%73t%27%20O%52%201%3D1%2D%2D"}  \u2192 NOT DETECTED  [BYPASS!]', 'warning');
                    engine.printLine('[03/05 02:16] POST /api/users \u2014 200 (PASSED)', 'node-info');
                    engine.printLine('  Payload: {"id":"1%27%20UN%49ON%20SE%4CECT%20*%2D%2D"}  \u2192 NOT DETECTED  [BYPASS!]', 'warning');
                    engine.printLine('', 'system');
                    engine.printLine('[!] CRITICAL: URL-encoded SQL injection bypassing signatures', 'error');
                    engine.printLine('Pattern: Partial URL encoding of SQL keywords (OR\u2192O%52, UNION\u2192UN%49ON, SELECT\u2192SE%4CECT)', 'warning');
                    state.attackPatternFound = true;
                    state.attackSignature = 'partial-url-encode-sqli';
                    break;
                case 'app-server':
                    engine.printLine('=== APPLICATION SERVER STATUS ===', 'heading');
                    engine.printLine('Service: hexworth-api (Node.js 20.11) | Status: RUNNING', 'node-info');
                    engine.printLine("  [03/05 02:16] SQL error: syntax near '1 UNION SELECT *--'", 'warning');
                    engine.printLine('[!] Application is processing injected SQL \u2014 WAF bypass confirmed', 'error');
                    break;
                case 'load-balancer':
                    engine.printLine('=== LOAD BALANCER STATUS ===', 'heading');
                    engine.printLine('Backend pool: 3 servers | Active connections: 847 | Health: All UP', 'success');
                    engine.printLine('Suspicious: 45.33.xx.xx \u2014 412 requests in last hour (10x normal)', 'warning');
                    break;
                case 'ids-sensor':
                    engine.printLine('=== IDS ALERTS ===', 'heading');
                    engine.printLine('[03/05 02:14] SID:2001219 SQL Injection \u2192 BLOCKED', 'success');
                    engine.printLine('[03/05 02:15-02:16] No alert \u2014 encoded payloads evaded signatures', 'error');
                    engine.printLine('Detection gap: 14 requests undetected', 'warning');
                    break;
                case 'rule-engine':
                    engine.printLine('=== WAF RULE ENGINE ===', 'heading');
                    engine.printLine('Active: OWASP CRS 3.3.5 (942xxx) + 12 custom rules', 'node-info');
                    engine.printLine('  Missing: partial URL-encoding evasion  [GAP]', 'warning');
                    if (!state.attackPatternFound) engine.printLine('No attack pattern identified yet. Examine WAF-LOGS first.', 'system');
                    else engine.printLine('Use "rule <pattern>" to write a custom detection rule.', 'info');
                    break;
                case 'db-server':
                    engine.printLine('=== DATABASE SERVER ===', 'heading');
                    engine.printLine('PostgreSQL 16.1 | Active connections: 12 (normal)', 'node-info');
                    engine.printLine("  [02:16] SELECT * FROM users WHERE id='1' UNION SELECT *--", 'error');
                    engine.printLine('[!] SQL injection reaching database \u2014 data exposure imminent', 'error');
                    engine.printLine('Network: Same VLAN as app-server  [NOT SEGMENTED]', 'warning');
                    if (!state.dbSegmented) engine.printLine('Use "segment db" to isolate the database.', 'info');
                    break;
                case 'quarantine-zone':
                    engine.printLine('=== QUARANTINE ZONE ===', 'heading');
                    engine.printLine('VLAN 999 | Quarantined: ' + (state.dbSegmented ? 'DB-SERVER' : '(none)'), state.dbSegmented ? 'success' : 'info');
                    if (!state.dbSegmented) engine.printLine('Available: segment db', 'info');
                    break;
                case 'egress-monitor':
                    engine.printLine('=== EGRESS MONITOR ===', 'heading');
                    engine.printLine('[02:19] 10.2.0.20 \u2192 45.33.xx.xx:443 \u2014 2.1MB outbound  [SUSPICIOUS]', 'warning');
                    engine.printLine('[02:21] 10.2.1.100 \u2192 45.33.xx.xx:8443 \u2014 12.3MB outbound  [CRITICAL]', 'error');
                    engine.printLine('Total outbound to 45.33.xx.xx: 19.1MB in 3 minutes', 'error');
                    if (!state.egressVerified) {
                        if (state.customRuleWritten && state.dbSegmented) engine.printLine('Prerequisites met. Use "verify" to confirm perimeter.', 'info');
                        else engine.printLine('Complete WAF rule and DB segmentation first.', 'warning');
                    }
                    break;
            }
            engine.printLine('', 'system');
            engine.checkObjectives(); engine.saveState();
        }

        function cmdAnalyze(args) {
            if (!args.length) { engine.printLine('Usage: analyze <node>', 'error'); return; }
            var target = args.join(' ').toLowerCase();
            engine.printLine('', 'system');
            if (target.indexOf('waf') !== -1 || target.indexOf('log') !== -1) {
                engine.printLine('=== DEEP TRAFFIC ANALYSIS: WAF-LOGS ===', 'heading');
                engine.printLine('  %73=s  %27=\'  %20=SPACE  %52=R  %4C=L  %2D=-', 'info');
                engine.printLine('  te%73t%27%20O%52%201%3D1%2D%2D  \u2192  test\' OR 1=1--', 'error');
                engine.printLine('Bypass: Partial hex URL-encoding of keyword characters.', 'warning');
                engine.getState().attackPatternFound = true;
            } else if (target.indexOf('egress') !== -1) {
                engine.printLine('=== DEEP TRAFFIC ANALYSIS: EGRESS-MONITOR ===', 'heading');
                engine.printLine('  Total exfiltrated: ~19.1MB over HTTPS to Tor-exit 45.33.xx.xx', 'error');
            } else { engine.printLine('No deep analysis for "' + args.join(' ') + '". Try: analyze waf-logs', 'error'); }
            engine.checkObjectives(); engine.saveState();
        }

        function cmdRule(args) {
            if (!args.length) { engine.printLine('Usage: rule <pattern>', 'error'); return; }
            var state = engine.getState();
            if (currentCellType() !== 'rule-engine') { engine.printLine('Must be at RULE-ENGINE node.', 'error'); return; }
            if (!state.attackPatternFound) { engine.printLine('No attack pattern identified yet. Examine WAF-LOGS first.', 'warning'); return; }
            var ruleStr = args.join(' ').toLowerCase();
            var valid = ['url','encod','sqli','sql','inject','bypass','decode','percent','hex'].some(function(k) { return ruleStr.indexOf(k) !== -1; });
            if (!valid) { engine.printLine('Rule pattern not specific enough. Try: rule block url-encoded sqli', 'warning'); return; }
            engine.printLine('', 'system');
            engine.printLine('Custom rule created:', 'heading');
            engine.printLine('SecRule REQUEST_BODY "@rx (?i)(?:%[0-9a-f]{2}){2,}.*(?:union|select|insert|update|delete|drop)"', 'node-info');
            engine.printLine('Testing: te%73t%27%20O%52 \u2192 BLOCKED', 'success');
            engine.printLine('Custom rule effective.', 'success');
            state.customRuleWritten = true;
            engine.checkObjectives(); engine.updateGrid(); engine.saveState();
        }

        function cmdSegment(args) {
            var state = engine.getState();
            var pos = currentCellType();
            if (pos !== 'quarantine-zone' && pos !== 'db-server') { engine.printLine('Must be at QUARANTINE or DB-SERVER.', 'error'); return; }
            if (!args.length) { engine.printLine('Usage: segment <target>', 'error'); return; }
            var target = args.join(' ').toLowerCase();
            if (['db','data','server','postgres','sql'].every(function(k) { return target.indexOf(k) === -1; })) { engine.printLine('Unknown target. Try: segment db', 'error'); return; }
            if (state.dbSegmented) { engine.printLine('Database already segmented.', 'info'); return; }
            engine.printLine('Moving DB-SERVER to isolated VLAN 100.', 'node-info');
            engine.printLine('Database segmented. Direct external access blocked.', 'success');
            state.dbSegmented = true;
            engine.checkObjectives(); engine.saveState();
        }

        function cmdBlock(args) {
            if (!args.length) { engine.printLine('Usage: block <ip>', 'error'); return; }
            engine.printLine('Blocking ' + args[0] + ' at perimeter... Done.', 'success');
        }

        function cmdVerify() {
            var state = engine.getState();
            if (currentCellType() !== 'egress-monitor') { engine.printLine('Must be at EGRESS-MON node.', 'error'); return; }
            if (!state.customRuleWritten || !state.dbSegmented) {
                engine.printLine('Verification incomplete.', 'warning');
                if (!state.customRuleWritten) engine.printLine('  [ ] Write custom WAF rule', 'error');
                if (!state.dbSegmented) engine.printLine('  [ ] Segment the database', 'error');
                return;
            }
            engine.printLine('[1] Encoded SQLi \u2192 WAF: BLOCKED', 'success');
            engine.printLine('[2] Direct DB access \u2192 DENIED', 'success');
            engine.printLine('[3] Outbound exfil \u2192 BLOCKED', 'success');
            engine.printLine('[4] Normal API traffic \u2192 ALLOWED', 'success');
            engine.printLine('All tests passed. Perimeter hardened.', 'success');
            state.egressVerified = true;
            engine.checkObjectives(); engine.saveState();
        }

        function cmdStatus() {
            var state = engine.getState();
            var cellType = config.grid.cells[state.position.row][state.position.col];
            var posLabel = (cellType !== 'empty' && cellType !== 'wall') ? config.nodes[cellType].label : 'Clear';
            engine.printLine('', 'system');
            engine.printLine('\u2550\u2550\u2550 STATUS \u2550\u2550\u2550', 'heading');
            engine.printLine('Position: (' + state.position.col + ',' + state.position.row + ') \u2014 ' + posLabel, 'info');
            engine.printLine('Nodes discovered: ' + state.nodesDiscovered.size + ' / 8', 'info');
            engine.printLine('Attack pattern: ' + (state.attackPatternFound ? 'YES' : 'NO'), state.attackPatternFound ? 'success' : 'warning');
            engine.printLine('WAF rule: ' + (state.customRuleWritten ? 'YES' : 'NO'), state.customRuleWritten ? 'success' : 'warning');
            engine.printLine('DB segmented: ' + (state.dbSegmented ? 'YES' : 'NO'), state.dbSegmented ? 'success' : 'warning');
            engine.printLine('Egress verified: ' + (state.egressVerified ? 'YES' : 'NO'), state.egressVerified ? 'success' : 'warning');
        }

        engine.terminal.onCommand(function(cmd) {
            engine.getState().agentCmdCount++;
            var parts = cmd.trim().split(/\s+/);
            var action = parts[0].toLowerCase();
            var args = parts.slice(1);
            switch (action) {
                case 'scan':    cmdScan(); break;
                case 'move':    cmdMove(args); break;
                case 'examine': cmdExamine(); break;
                case 'analyze': cmdAnalyze(args); break;
                case 'rule':    cmdRule(args); break;
                case 'segment': cmdSegment(args); break;
                case 'block':   cmdBlock(args); break;
                case 'verify':  cmdVerify(); break;
                case 'status':  cmdStatus(); break;
                case 'help':    cmdHelp(); break;
                case 'clear':   engine.terminal.clearOutput(); break;
                default:
                    engine.printLine('Unknown command: ' + action, 'error');
                    engine.printLine('Type "help" for available commands.', 'system');
            }
        });
    })();
    </script>
</body>
</html>
