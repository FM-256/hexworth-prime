        // nodesExamined is tracked on engine state as a Set

        // ---- Helpers ----

        function getCell() {
            var state = engine.getState();
            return config.grid.cells[state.position.row][state.position.col];
        }

        // Hash map for known artifacts
        var hashMap = {
            'suspect-hdd.dd':           'a3f2c8d91e4b76a05f2381cd9047e3f6a8b1c4d7e9025abc13ef7d2900cc4182',
            'mem_20240115.dmp':          'b7e1f43a908d25c6e0471b3d85a2f9c04e6d18b7f2a3c8d9e0f14b2596c3a78d',
            'secure-transfer-tool.exe':  'f4d2e1b39a7c056f8d3a2e9b14c708d6f1e2a3b4c5d6e7f8091a2b3c4d5e6f7a',
            'quarterly-financials.xlsx': '2a9b4c8d1e3f5607a89b0c2d4e6f810a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d2e'

        // ---- Command handlers ----

        function cmdHelp() {
            engine.printLine('', 'system');
            engine.printLine('\u2550\u2550\u2550 COMMAND REFERENCE \u2550\u2550\u2550', 'heading');
            engine.printLine('  scan                     Survey area, reveal adjacent sources', 'info');
            engine.printLine('  move <dir>               Move examiner (north/south/east/west or n/s/e/w)', 'info');
            engine.printLine('  examine                  Examine current node for evidence', 'info');
            engine.printLine('  strings <artifact>       Run strings analysis on an artifact', 'info');
            engine.printLine('  timeline                 Build forensic timeline (requires 3+ sources examined)', 'info');
            engine.printLine('  recover <file>           Recover deleted files (at RECYCLE-BIN only)', 'info');
            engine.printLine('  hash <file>              Compute SHA-256 hash of an artifact', 'info');
            engine.printLine('  report                   Generate summary of findings so far', 'info');
            engine.printLine('  status                   Show position and objectives', 'info');
            engine.printLine('  help                     Show this reference', 'info');

        function cmdScan() {
            var state = engine.getState();
            var col = state.position.col, row = state.position.row;
            var cellType = config.grid.cells[row][col];
            engine.printLine('Scanning area...', 'system');
            engine.printLine('', 'system');
            if (cellType !== 'empty' && cellType !== 'wall') {
                var cur = config.nodes[cellType];
                engine.printLine('Current: ' + cur.label + ' \u2014 ' + cur.desc, 'heading');
                engine.printLine('OS/Type: ' + cur.os, 'info');
            } else {
                engine.printLine('Current: Clear area (no evidence source here)', 'heading');
            }
            engine.printLine('', 'system');
            engine.printLine('Adjacent:', 'heading');
            var dirs = [{ name: 'North', dc: 0, dr: -1 }, { name: 'South', dc: 0, dr: 1 }, { name: 'East', dc: 1, dr: 0 }, { name: 'West', dc: -1, dr: 0 }];
            dirs.forEach(function(d) {
                var nc = col + d.dc, nr = row + d.dr;
                if (nc < 0 || nc >= config.grid.cols || nr < 0 || nr >= config.grid.rows) { engine.printLine('  ' + d.name + ': [boundary]', 'system'); return; }
                var type = config.grid.cells[nr][nc];
                if (type === 'wall') { engine.printLine('  ' + d.name + ': [inaccessible]', 'system'); return; }
                var key = nc + ',' + nr;
                if (!state.visibility[key] || state.visibility[key] === 'hidden') state.visibility[key] = 'revealed';
                if (type === 'empty') { engine.printLine('  ' + d.name + ': Clear path', 'info'); }
                else { var info = config.nodes[type]; engine.printLine('  ' + d.name + ': ' + info.label + ' \u2014 ' + info.desc, 'node-info'); }
            });
            engine.updateGrid();
            engine.saveState();
        }

        function cmdMove(args) {
            if (!args.length) { engine.printLine('Usage: move <direction>', 'error'); engine.printLine('Directions: north/south/east/west (or n/s/e/w)', 'system'); return; }
            var dirMap = { 'north': [0,-1], 'n': [0,-1], 'south': [0,1], 's': [0,1], 'east': [1,0], 'e': [1,0], 'west': [-1,0], 'w': [-1,0] };
            var dir = args[0].toLowerCase();
            if (!dirMap[dir]) { engine.printLine('Unknown direction: ' + args[0], 'error'); engine.printLine('Use: north/south/east/west (or n/s/e/w)', 'system'); return; }
            var state = engine.getState();
            var d = dirMap[dir];
            var newCol = state.position.col + d[0], newRow = state.position.row + d[1];
            if (newCol < 0 || newCol >= config.grid.cols || newRow < 0 || newRow >= config.grid.rows) { engine.printLine('Cannot move ' + dir + '. Edge of workspace.', 'error'); return; }
            var cellType = config.grid.cells[newRow][newCol];
            if (cellType === 'wall') { engine.printLine('Blocked. No path ' + dir + '.', 'error'); return; }
            state.position = { col: newCol, row: newRow };
            state.visibility[newCol + ',' + newRow] = 'visited';
            if (cellType !== 'empty') state.nodesDiscovered.add(cellType);
            engine.revealAdjacent(newCol, newRow);
            var dirFull = { n: 'north', s: 'south', e: 'east', w: 'west' };
            var dirName = dirFull[dir] || dir;
            if (cellType === 'empty') {
                engine.printLine('Moving ' + dirName + '... Clear area.', 'system');
            } else {
                var info = config.nodes[cellType];
                engine.printLine('Moving ' + dirName + '... Reached ' + info.label, 'success');
                engine.printLine(info.desc + ' [' + info.os + ']', 'info');
                engine.printLine('Use "examine" to analyze this source.', 'system');
            }
            engine.checkObjectives();
            engine.updateGrid();
            engine.saveState();
        }

        function cmdStrings(args) {
            var state = engine.getState();
            var cellType = getCell();
            var artifact = args.join(' ').toLowerCase();

            if (!artifact) { engine.printLine('Usage: strings <artifact>', 'error'); engine.printLine('Example: strings secure-transfer-tool.exe', 'system'); return; }

            engine.printLine('', 'system');

            // Critical path: strings on the dropper at browser-data node
            if (cellType === 'browser-data') {
                var isDropper = artifact.indexOf('secure') !== -1 ||
                                artifact.indexOf('transfer') !== -1 ||
                                artifact.indexOf('download') !== -1 ||
                                artifact.indexOf('dropper') !== -1 ||
                                artifact.indexOf('exe') !== -1 ||
                                artifact.indexOf('tool') !== -1;

                if (isDropper) {
                    if (!state.nodesExamined || !state.nodesExamined.has('browser-data')) {
                        engine.printLine('[!] Examine this node first to identify the download.', 'warning');
                        return;
                    }
                    engine.printLine('Running strings analysis on secure-transfer-tool.exe...', 'system');
                    engine.printLine('', 'system');
                    engine.printLine('\u2550\u2550\u2550 EMBEDDED STRINGS (filtered) \u2550\u2550\u2550', 'heading');
                    engine.printLine('  C2 beacon:    beacon.malware-c2.xyz', 'evidence');
                    engine.printLine('  Exfil path:   /upload', 'evidence');
                    engine.printLine('  User-Agent:   UpdateService/1.0', 'evidence');
                    engine.printLine('  Encryption:   AES-256 (key embedded in binary)', 'evidence');
                    engine.printLine('  Mutex:        Global\\UpdateServiceMutex_v2', 'node-info');
                    engine.printLine('  Install path: C:\\Users\\%USERNAME%\\AppData\\Roaming\\update-service.exe', 'node-info');
                    engine.printLine('  Reg key:      HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run', 'node-info');
                    engine.printLine('  Staging dir:  C:\\ProgramData\\upd_cache\\', 'node-info');
                    engine.printLine('', 'system');
                    engine.printLine('[!] C2 domain confirmed: beacon.malware-c2.xyz', 'warning');
                    engine.printLine('[!] This binary is the malware dropper. Persistence via Run key.', 'warning');
                    engine.printLine('', 'system');
                    engine.printLine('Malware dropper identified and characterized.', 'success');
                    state.dropperFound = true;
                    engine.checkObjectives();
                    engine.updateGrid();
                    engine.saveState();
                    return;
                }
            }

            // Generic strings output for other nodes
            engine.printLine('Running strings analysis on "' + args.join(' ') + '"...', 'system');
            engine.printLine('', 'system');

            if (cellType === 'disk-image') {
                engine.printLine('  [strings output from disk image sectors]', 'info');
                engine.printLine('  MFT entry fragments, NTFS metadata, volume label: WORKST-JDOE', 'node-info');
                engine.printLine('  File path strings: C:\\Users\\jdoe\\Desktop, C:\\Users\\jdoe\\Downloads', 'node-info');
                engine.printLine('  No high-value strings found in this artifact.', 'system');
            } else if (cellType === 'memory-dump') {
                engine.printLine('  [strings from memory pages]', 'info');
                engine.printLine('  Fragments: cmd.exe /c whoami, net user, ipconfig /all', 'node-info');
                engine.printLine('  Possible recon commands found in memory.', 'warning');
                engine.printLine('  Hint: Use "examine" at BROWSER to find the dropper download.', 'system');
            } else if (cellType === 'registry') {
                engine.printLine('  [strings from registry hive binary]', 'info');
                engine.printLine('  Key paths, value names, software installation GUIDs', 'node-info');
                engine.printLine('  No additional high-value strings beyond what examine showed.', 'system');
            } else {
                engine.printLine('  No notable strings found in that artifact at this location.', 'system');
                engine.printLine('  Try: strings secure-transfer-tool.exe at the BROWSER node.', 'info');
            }
            engine.printLine('', 'system');
        }

        function cmdRecover(args) {
            var state = engine.getState();
            var cellType = getCell();
            if (cellType !== 'recycle-bin') { engine.printLine('[!] recover command only works at the RECYCLE-BIN.', 'error'); engine.printLine('Navigate to RECYCLE-BIN first.', 'system'); return; }
            if (!args.length) { engine.printLine('Usage: recover <file | all>', 'error'); engine.printLine('Example: recover all', 'system'); return; }

            var target = args.join(' ').toLowerCase();
            var validTargets = ['all', 'file', 'files', 'evidence', 'deleted', 'everything'];
            var isValid = validTargets.some(function(v) { return target.indexOf(v) !== -1; });
            var fileFragments = ['xlsx', 'csv', 'docx', 'financ', 'employee', 'project', 'quarterly', 'database', 'roadmap'];
            var isFileRef = fileFragments.some(function(f) { return target.indexOf(f) !== -1; });

            if (!isValid && !isFileRef) { engine.printLine('Specify what to recover. Try: recover all', 'warning'); return; }

            engine.printLine('', 'system');
            engine.printLine('Initiating file recovery from $Recycle.Bin...', 'system');
            engine.printLine('', 'system');
            engine.printLine('Carving file entries from NTFS MFT...', 'system');
            engine.printLine('', 'system');
            engine.printLine('Recovered:', 'heading');
            engine.printLine('  quarterly-financials.xlsx    245 KB   [INTACT]', 'success');
            engine.printLine('  employee-database.csv          1.2 MB  [INTACT]', 'success');
            engine.printLine('  project-roadmap.docx           890 KB  [INTACT]', 'success');
            engine.printLine('', 'system');
            engine.printLine('Files restored to evidence locker: /case/2024-0847/recovered/', 'success');
            engine.printLine('Hash verification: all files match pre-deletion checksums.', 'success');
            engine.printLine('', 'system');
            engine.printLine('[NOTE] secure-transfer-tool.exe also in $Recycle.Bin \u2014 preserved as malware sample.', 'warning');

            state.evidenceRecovered = true;
            engine.checkObjectives();
            engine.updateGrid();
            engine.saveState();
        }

        function cmdHash(args) {
            if (!args.length) { engine.printLine('Usage: hash <file>', 'error'); return; }
            var file = args.join(' ');
            var key = file.toLowerCase();
            var hash = null;
            for (var k in hashMap) {
                if (key.indexOf(k.split('.')[0]) !== -1 || key === k) { hash = hashMap[k]; break; }
            }
            if (!hash) {
                var seed = 0;
                for (var i = 0; i < file.length; i++) { seed = (seed * 31 + file.charCodeAt(i)) & 0xffffffff; }
                hash = Math.abs(seed).toString(16).padStart(8, '0').repeat(8).substring(0, 64);
            }
            engine.printLine('', 'system');
            engine.printLine('Computing SHA-256 hash for: ' + file, 'system');
            engine.printLine('SHA-256: ' + hash, 'evidence');
            engine.printLine('', 'system');
        }

        function cmdReport() {
            var state = engine.getState();
            var examined = state.nodesExamined ? state.nodesExamined.size : 0;
            engine.printLine('', 'system');
            engine.printLine('\u2550\u2550\u2550 CASE REPORT \u2014 #2024-0847 \u2550\u2550\u2550', 'heading');
            engine.printLine('Generated: ' + new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC', 'system');
            engine.printLine('', 'system');

            engine.printLine('Evidence sources examined (' + examined + '):', 'heading');
            var sourceMap = {
                'evidence-ws':  'EVIDENCE-WS   \u2014 Workstation case overview',
                'disk-image':   'DISK-IMAGE    \u2014 500GB NTFS image verified',
                'memory-dump':  'MEM-DUMP      \u2014 Volatile memory, suspicious processes',
                'registry':     'REGISTRY      \u2014 USB history, persistence run key',
                'browser-data': 'BROWSER       \u2014 Chrome download of dropper',
                'email-store':  'EMAIL         \u2014 Phishing email from external sender',
                'event-logs':   'EVENT-LOGS    \u2014 Process creation, file access, log cleared',
                'recycle-bin':  'RECYCLE-BIN   \u2014 Deleted exfiltration targets'
            };
            if (state.nodesExamined) {
                state.nodesExamined.forEach(function(node) {
                    engine.printLine('  [+] ' + (sourceMap[node] || node), 'info');
                });
            }

            engine.printLine('', 'system');
            engine.printLine('Key findings:', 'heading');
            if (state.diskImaged) { engine.printLine('  [+] Disk image integrity verified (SHA-256 match)', 'success'); }
            else { engine.printLine('  [ ] Disk not yet imaged', 'system'); }
            if (state.dropperFound) {
                engine.printLine('  [+] Malware dropper identified: secure-transfer-tool.exe', 'success');
                engine.printLine('      C2: beacon.malware-c2.xyz / AES-256 exfil / UpdateService UA', 'node-info');
            } else { engine.printLine('  [ ] Malware dropper not yet characterized', 'system'); }
            if (state.evidenceRecovered) { engine.printLine('  [+] Deleted files recovered from $Recycle.Bin (3 documents)', 'success'); }
            else { engine.printLine('  [ ] Deleted evidence not yet recovered', 'system'); }
            if (state.timelineBuilt) { engine.printLine('  [+] Forensic timeline complete (7 events, 2024-01-15)', 'success'); }
            else { engine.printLine('  [ ] Timeline not yet built', 'system'); }

            engine.printLine('', 'system');
            engine.printLine('Objectives: ' + state.objectives.filter(Boolean).length + ' / 4 complete', 'info');
            engine.printLine('Commands issued: ' + state.agentCmdCount, 'info');
            var elapsed = Math.floor((Date.now() - state.startTime) / 1000);
            var mins = Math.floor(elapsed / 60);
            var secs = elapsed % 60;
            engine.printLine('Elapsed: ' + (mins > 0 ? mins + 'm ' + secs + 's' : secs + 's'), 'info');
            engine.printLine('', 'system');
        }

        function cmdStatus() {
            var state = engine.getState();
            var cellType = getCell();
            var posLabel = (cellType !== 'empty' && cellType !== 'wall') ? config.nodes[cellType].label : 'Open area';
            var examined = state.nodesExamined ? state.nodesExamined.size : 0;

            engine.printLine('', 'system');
            engine.printLine('\u2550\u2550\u2550 STATUS \u2550\u2550\u2550', 'heading');
            engine.printLine('Position:  (' + state.position.col + ',' + state.position.row + ') \u2014 ' + posLabel, 'info');
            engine.printLine('Sources examined: ' + examined + ' / 8', 'info');
            engine.printLine('Commands issued:  ' + state.agentCmdCount, 'info');
            engine.printLine('', 'system');
            engine.printLine('Case flags:', 'heading');
            engine.printLine('  Disk imaged:        ' + (state.diskImaged ? 'YES' : 'no'), state.diskImaged ? 'success' : 'system');
            engine.printLine('  Dropper found:      ' + (state.dropperFound ? 'YES' : 'no'), state.dropperFound ? 'success' : 'system');
            engine.printLine('  Evidence recovered: ' + (state.evidenceRecovered ? 'YES' : 'no'), state.evidenceRecovered ? 'success' : 'system');
            engine.printLine('  Timeline built:     ' + (state.timelineBuilt ? 'YES' : 'no'), state.timelineBuilt ? 'success' : 'system');
            engine.printLine('', 'system');
            engine.printLine('Objectives:', 'heading');
            var objText = [
                'Image the disk (examine DISK-IMAGE)',
                'Find malware dropper (strings at BROWSER)',
                'Recover deleted evidence (recover at RECYCLE-BIN)',
                'Build forensic timeline (3+ sources + timeline command)'
            ];
            state.objectives.forEach(function(done, i) {
                engine.printLine((done ? ' [X] ' : ' [ ] ') + objText[i], done ? 'success' : 'system');
            });
        }

        // ---- Terminal command dispatch ----
        engine.terminal.onCommand(function(cmd) {
            var state = engine.getState();
            state.agentCmdCount++;
            var parts = cmd.trim().split(/\s+/);
            var action = parts[0].toLowerCase();
            var args = parts.slice(1);

            switch (action) {
                case 'scan':     cmdScan(); break;
                case 'move':     cmdMove(args); break;
                case 'examine':  cmdExamine(); break;
                case 'strings':  cmdStrings(args); break;
                case 'timeline': cmdTimeline(); break;
                case 'recover':  cmdRecover(args); break;
                case 'hash':     cmdHash(args); break;
                case 'report':   cmdReport(); break;
                case 'status':   cmdStatus(); break;
                case 'help':     cmdHelp(); break;
                case 'clear':    engine.terminal.clearOutput(); break;
                default:
                    engine.printLine('Unknown command: ' + action, 'error');
                    engine.printLine('Type "help" for available commands.', 'system');
            }
        });
    })();
    </script>
</body>
