<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-08 | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <script src="../../components/ModuleProgress.js"></script>
</head>
<body>
<h1 class="visually-hidden">JS-08</h1>
    <!-- Engine + interpreter + bridge + config -->
    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/JsInterpreter.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/js-08.config.js"></script>
    <script>
    /* JS-08 Mission Loader
       Wires the JavaScript interpreter to the Operator engine.
       Student writes JS in the editor panel, clicks Run,
       JsInterpreter executes it in a sandboxed context. */
    (function() {
        var engine = OperatorEngine.init(JS_08_CONFIG);
        var agent  = AgentBridge.create(engine);

        /* Run button: grab code from editor, execute via JsInterpreter */
        engine.editor.onRun(function() {
            var code = engine.editor.getCode();
            engine.editor.clearOutput();
            JsInterpreter.reset();
            JsInterpreter.run(code, agent, engine.printLine)
                .then(function(result) {
                    if (result.error) {
                        engine.printLine('Error: ' + result.error, 'error');
                    } else {
                        engine.printLine('Program complete. ' + result.cmdCount + ' agent commands executed.', 'system');
                    }
                });
        });

        /* Stop button: cancel interpreter mid-run */
        engine.editor.onStop(function() {
            JsInterpreter.cancel();
        });
    })();
    </script>
</body>
</html>
