<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IR-01: Breach Protocol | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <style>
        .editor-panel { background: #080a0e; }
        .editor-area { display: none; }
        .editor-toolbar { display: none; }
        .output-console { flex: 1; }
        .term-input-row { display: flex; align-items: center; padding: 8px 14px; border-top: 1px solid rgba(57,255,20,0.1); background: #0a0c12; flex-shrink: 0; }
        .term-prompt-text { color: #39ff14; font-size: 0.78rem; white-space: nowrap; margin-right: 8px; font-family: var(--op-font); }
        .term-input { flex: 1; background: transparent; border: none; outline: none; color: #76ff03; font-family: var(--op-font); font-size: 0.78rem; caret-color: #39ff14; }
        .grid-cell[data-type="infected-server"]:not(.vis-hidden):not(.wall) { border-left: 2px solid rgba(255,68,68,0.4); }
        .grid-cell[data-type="firewall"]:not(.vis-hidden):not(.wall) { border-left: 2px solid rgba(255,215,0,0.4); }
    </style>
    <script src="../../components/ModuleProgress.js"></script>
</head>
<body>
    <div id="operator-root"></div>

    <script src="../engine/OperatorEngine.js"></script>
    <script src="../configs/incident-response-01.config.js"></script>
    <script>
    /* ================================================================
       IR-01: Breach Protocol -- Terminal Command Layer
       Custom state: threatIdentified, hostIsolated, malwareEradicated,
                     backupRestored, firewallContained.
       Commands: scan, move, ping, logs, isolate, contain, eradicate,
                 restore, status, help, clear.
       IR lifecycle: Identify > Contain > Eradicate > Recover.
       ================================================================ */
    (function() {
        var config = IR_01_CONFIG;
        var engine = OperatorEngine.init(config);
        var state  = engine.getState();

        // Initialize custom state
        state.threatIdentified = false;
        state.hostIsolated = false;
        state.malwareEradicated = false;
        state.backupRestored = false;
        state.firewallContained = false;

        // Replace editor panel with terminal
        var editorPanel = document.querySelector('.editor-panel');
        editorPanel.innerHTML = '';
        var termBar = document.createElement('div');
        termBar.style.cssText = 'padding:7px 14px;background:#0c0e14;border-bottom:1px solid rgba(57,255,20,0.1);display:flex;align-items:center;gap:6px;flex-shrink:0;';
        for (var i = 0; i < 3; i++) { var dot = document.createElement('div'); dot.style.cssText = 'width:7px;height:7px;border-radius:50%;background:rgba(57,255,20,0.3);'; termBar.appendChild(dot); }
        var barLabel = document.createElement('span'); barLabel.style.cssText = 'font-size:0.55rem;color:rgba(57,255,20,0.35);letter-spacing:0.1em;margin-left:6px;'; barLabel.textContent = 'TERMINAL';
        termBar.appendChild(barLabel);
        editorPanel.appendChild(termBar);
        var outputConsole = document.querySelector('.output-console');
        editorPanel.appendChild(outputConsole);
        var inputRow = document.createElement('div'); inputRow.className = 'term-input-row';
        var promptSpan = document.createElement('span'); promptSpan.className = 'term-prompt-text'; promptSpan.textContent = config.promptText;
        var termInput = document.createElement('input'); termInput.type = 'text'; termInput.className = 'term-input'; termInput.autocomplete = 'off'; termInput.spellcheck = false;
        inputRow.appendChild(promptSpan); inputRow.appendChild(termInput);
        editorPanel.appendChild(inputRow);

        var history = []; var histIdx = -1;
        function curCell() { return config.grid.cells[state.position.row][state.position.col]; }

        // --- Command Handlers ---

        function cmdScan() {
            var col = state.position.col, row = state.position.row, cellType = curCell();
            engine.printLine('Scanning area...', 'system'); engine.printLine('', 'system');
            if (cellType !== 'empty' && cellType !== 'wall') {
                var cur = config.nodes[cellType]; engine.printLine('Current: ' + cur.label + ' (' + cur.ip + ')', 'heading'); engine.printLine(cur.desc, 'info');
            } else engine.printLine('Current: Clear path (no node)', 'heading');
            engine.printLine('', 'system'); engine.printLine('Adjacent:', 'heading');
            var dirs = [{name:'North',dc:0,dr:-1},{name:'South',dc:0,dr:1},{name:'East',dc:1,dr:0},{name:'West',dc:-1,dr:0}];
            for (var i = 0; i < dirs.length; i++) {
                var d = dirs[i], nc = col + d.dc, nr = row + d.dr;
                if (nc < 0 || nc >= config.grid.cols || nr < 0 || nr >= config.grid.rows) { engine.printLine('  ' + d.name + ': [network edge]', 'system'); continue; }
                var type = config.grid.cells[nr][nc];
                if (type === 'wall') { engine.printLine('  ' + d.name + ': [blocked]', 'system'); continue; }
                var key = nc + ',' + nr;
                if (!state.visibility[key] || state.visibility[key] === 'hidden') state.visibility[key] = 'revealed';
                if (type === 'empty') engine.printLine('  ' + d.name + ': Clear path', 'info');
                else { var info = config.nodes[type]; engine.printLine('  ' + d.name + ': ' + info.label + ' (' + info.ip + ')', 'node-info'); }
            }
            engine.updateGrid(); engine.saveState();
        }

        function cmdMove(args) {
            if (!args.length) { engine.printLine('Usage: move <direction>', 'error'); return; }
            var dirMap = {'north':[0,-1],'n':[0,-1],'south':[0,1],'s':[0,1],'east':[1,0],'e':[1,0],'west':[-1,0],'w':[-1,0]};
            var dir = args[0].toLowerCase(); if (!dirMap[dir]) { engine.printLine('Unknown direction: ' + args[0], 'error'); return; }
            var d = dirMap[dir], nc = state.position.col + d[0], nr = state.position.row + d[1];
            if (nc < 0 || nc >= config.grid.cols || nr < 0 || nr >= config.grid.rows) { engine.printLine('Edge of network. Cannot move ' + dir + '.', 'error'); return; }
            var cellType = config.grid.cells[nr][nc];
            if (cellType === 'wall') { engine.printLine('Blocked. No traversable path ' + dir + '.', 'error'); return; }
            state.position = { col: nc, row: nr }; state.visibility[nc + ',' + nr] = 'visited';
            if (cellType !== 'empty') state.nodesDiscovered.add(cellType);
            engine.revealAdjacent(nc, nr);
            var dirName = {n:'north',s:'south',e:'east',w:'west'}[dir] || dir;
            if (cellType === 'empty') engine.printLine('Moving ' + dirName + '... Clear path.', 'system');
            else { var info = config.nodes[cellType]; engine.printLine('Moving ' + dirName + '... ' + info.label + ' (' + info.ip + ')', 'success'); engine.printLine(info.desc, 'info'); }
            engine.updateGrid(); engine.saveState();
        }

        function cmdPing(args) {
            if (!args.length) { engine.printLine('Usage: ping <node name or IP>', 'error'); return; }
            var target = args.join(' '), node = engine.resolveNode(target);
            if (!node) {
                if (target.match(/^10\.1\.0\.\d+$/)) engine.printLine('Request timed out. Host unreachable.', 'error');
                else engine.printLine('ping: unknown host ' + target, 'error');
                return;
            }
            if (node.visibility === 'hidden') { engine.printLine('Request timed out. No route to host.', 'error'); return; }
            if (node.type === 'infected-server' && state.hostIsolated) {
                engine.printLine('PING ' + node.info.ip + ' (' + node.info.label + ')', 'system');
                if (state.malwareEradicated) { engine.printLine('64 bytes from ' + node.info.ip + ': time=1.2ms', 'node-info'); engine.printLine('Host is UP -- clean, awaiting restoration.', 'success'); }
                else engine.printLine('Host is ISOLATED. No network response (quarantined).', 'warning');
                return;
            }
            var info = node.info, ms = (Math.random() * 5 + 0.5).toFixed(1);
            engine.printLine('PING ' + info.ip + ' (' + info.label + ')', 'system');
            engine.printLine('64 bytes from ' + info.ip + ': time=' + ms + 'ms', 'node-info');
            engine.printLine('Host is UP -- ' + info.desc, 'info');
        }

        function cmdLogs(args) {
            if (!args.length) { engine.printLine('Usage: logs <node name or IP>', 'error'); return; }
            var target = args.join(' '), node = engine.resolveNode(target);
            if (!node) {
                if (target.match(/^10\.1\.0\.\d+$/)) engine.printLine('No logs found for host ' + target + '.', 'error');
                else engine.printLine('logs: unknown host ' + target, 'error');
                return;
            }
            if (node.visibility === 'hidden') { engine.printLine('Cannot query logs. Node not yet discovered.', 'error'); return; }
            engine.printLine('', 'system');

            if (node.type === 'infected-server') {
                engine.printLine('\u2550\u2550\u2550 SIEM LOG ANALYSIS: 10.1.0.30 (INFECTED) \u2550\u2550\u2550', 'heading');
                engine.printLine('', 'system');
                engine.printLine('[2026-03-04 02:14:33] SSH brute force detected -- 847 attempts from 198.51.100.77', 'warning');
                engine.printLine('[2026-03-04 02:18:01] SSH login SUCCESS -- root@10.1.0.30 from 198.51.100.77', 'error');
                engine.printLine('[2026-03-04 02:18:45] Suspicious binary download: /tmp/.x11-unix/svchost', 'error');
                engine.printLine('[2026-03-04 02:19:02] Outbound C2 beacon: 10.1.0.30 -> 198.51.100.77:4444', 'error');
                engine.printLine('[2026-03-04 02:22:15] Lateral movement attempt: SMB to 10.1.0.40 (DB-SRV)', 'warning');
                engine.printLine('[2026-03-04 02:23:01] Ransomware encryption started: /var/data/*', 'error');
                engine.printLine('[2026-03-04 02:25:00] Ransom note created: /var/data/README_DECRYPT.txt', 'error');
                engine.printLine('', 'system');
                engine.printLine('THREAT ASSESSMENT: Active ransomware. C2 channel open. Lateral movement in progress.', 'warning');
                engine.printLine('PRIORITY: CRITICAL -- Immediate containment required.', 'error');
                if (!state.threatIdentified) { state.threatIdentified = true; engine.checkObjectives(); }
            } else if (node.type === 'database') {
                engine.printLine('\u2550\u2550\u2550 SIEM LOG ANALYSIS: ' + node.info.ip + ' (' + node.info.label + ') \u2550\u2550\u2550', 'heading');
                engine.printLine('', 'system');
                engine.printLine('[2026-03-04 02:22:18] Inbound SMB connection attempt from 10.1.0.30', 'warning');
                engine.printLine('[2026-03-04 02:22:19] SMB authentication FAILED -- invalid credentials', 'info');
                engine.printLine('[2026-03-04 02:22:20] Connection reset by peer 10.1.0.30', 'info');
                engine.printLine('', 'system');
                engine.printLine('STATUS: Lateral movement blocked. No compromise detected.', 'success');
            } else if (node.type === 'web-server') {
                engine.printLine('\u2550\u2550\u2550 SIEM LOG ANALYSIS: ' + node.info.ip + ' (' + node.info.label + ') \u2550\u2550\u2550', 'heading');
                engine.printLine('', 'system');
                engine.printLine('[2026-03-04 01:00:00] Normal HTTPS traffic -- 1,247 requests/hr', 'info');
                engine.printLine('[2026-03-04 02:14:00] No anomalies detected on this host.', 'info');
                engine.printLine('', 'system');
                engine.printLine('STATUS: Clean. No indicators of compromise.', 'success');
            } else if (node.type === 'firewall') {
                engine.printLine('\u2550\u2550\u2550 SIEM LOG ANALYSIS: ' + node.info.ip + ' (' + node.info.label + ') \u2550\u2550\u2550', 'heading');
                engine.printLine('', 'system');
                engine.printLine('[2026-03-04 02:19:05] Outbound alert: 10.1.0.30:4444 -> 198.51.100.77:4444', 'warning');
                engine.printLine('[2026-03-04 02:22:16] SMB lateral: 10.1.0.30:445 -> 10.1.0.40:445', 'warning');
                engine.printLine('[2026-03-04 02:25:30] No block rules configured for internal C2 traffic.', 'error');
                engine.printLine('', 'system');
                engine.printLine('STATUS: Alerts firing but no containment rules active.', 'warning');
            } else if (node.type === 'honeypot') {
                engine.printLine('\u2550\u2550\u2550 SIEM LOG ANALYSIS: ' + node.info.ip + ' (' + node.info.label + ') \u2550\u2550\u2550', 'heading');
                engine.printLine('', 'system');
                engine.printLine('[2026-03-04 02:24:00] No attacker interaction detected on honeypot.', 'info');
                engine.printLine('', 'system');
                engine.printLine('STATUS: Quiet. Attacker has not probed decoy systems.', 'info');
            } else {
                engine.printLine('\u2550\u2550\u2550 SIEM LOG ANALYSIS: ' + node.info.ip + ' (' + node.info.label + ') \u2550\u2550\u2550', 'heading');
                engine.printLine('', 'system');
                engine.printLine('[2026-03-04 02:00:00] Normal operations. No alerts.', 'info');
                engine.printLine('', 'system');
                engine.printLine('STATUS: Clean. No indicators of compromise.', 'success');
            }
            engine.printLine('', 'system');
            engine.updateGrid(); engine.saveState();
        }

        function cmdIsolate(args) {
            if (!args.length) { engine.printLine('Usage: isolate <node name or IP>', 'error'); return; }
            var target = args.join(' '), node = engine.resolveNode(target);
            if (!node) { engine.printLine('isolate: unknown host ' + target, 'error'); return; }
            if (node.type !== 'infected-server') { engine.printLine('Cannot isolate ' + node.info.label + '. Only compromised hosts should be isolated.', 'warning'); return; }
            if (!state.threatIdentified) {
                engine.printLine('Cannot isolate yet. You must first identify the threat vector.', 'error');
                engine.printLine('Use: logs infected -- to analyze SIEM data for the compromised host.', 'info');
                return;
            }
            if (state.hostIsolated) { engine.printLine(node.info.label + ' is already isolated.', 'warning'); return; }
            engine.printLine('', 'system');
            engine.printLine('Isolating ' + node.info.ip + ' (' + node.info.label + ')...', 'system');
            engine.printLine('  Disabling switch port Gi0/30...', 'info');
            engine.printLine('  Blocking MAC on CORE-SW VLAN 10...', 'info');
            engine.printLine('  Dropping all routes to 10.1.0.30...', 'info');
            engine.printLine('  C2 channel 10.1.0.30:4444 -> 198.51.100.77:4444 SEVERED', 'warning');
            engine.printLine('', 'system');
            engine.printLine('HOST ISOLATED. ' + node.info.label + ' is now quarantined from the network.', 'success');
            state.hostIsolated = true;
            engine.checkObjectives(); engine.updateGrid(); engine.saveState();
        }

        function cmdContain() {
            var cellType = curCell();
            if (cellType !== 'firewall') {
                engine.printLine('You must be at the FIREWALL node to activate containment rules.', 'error');
                engine.printLine('Current position: ' + (config.nodes[cellType] ? config.nodes[cellType].label : 'Clear'), 'system');
                return;
            }
            if (state.firewallContained) { engine.printLine('Firewall containment rules are already active.', 'warning'); return; }
            engine.printLine('', 'system');
            engine.printLine('Activating firewall containment rules...', 'system');
            engine.printLine('  Rule 1: BLOCK outbound to 198.51.100.0/24 (C2 infrastructure)', 'info');
            engine.printLine('  Rule 2: BLOCK SMB (445/tcp) between server VLANs', 'info');
            engine.printLine('  Rule 3: ALERT on any new outbound connections from server VLAN', 'info');
            engine.printLine('', 'system');
            engine.printLine('CONTAINMENT ACTIVE. Firewall rules deployed.', 'success');
            state.firewallContained = true;
            engine.updateGrid(); engine.saveState();
        }

        function cmdEradicate() {
            var cellType = curCell();
            if (cellType !== 'infected-server') {
                engine.printLine('You must be at the INFECTED node to eradicate malware.', 'error');
                engine.printLine('Current position: ' + (config.nodes[cellType] ? config.nodes[cellType].label : 'Clear'), 'system');
                return;
            }
            if (!state.hostIsolated) {
                engine.printLine('Cannot eradicate yet. The host must be isolated first.', 'error');
                engine.printLine('Use: isolate infected -- to quarantine the compromised host.', 'info');
                return;
            }
            if (state.malwareEradicated) { engine.printLine('Malware has already been eradicated from this host.', 'warning'); return; }
            engine.printLine('', 'system');
            engine.printLine('Beginning malware eradication on 10.1.0.30...', 'system');
            engine.printLine('  Killing process: /tmp/.x11-unix/svchost (PID 31337)...', 'info');
            engine.printLine('  Removing binary: /tmp/.x11-unix/svchost...', 'info');
            engine.printLine('  Removing persistence: /etc/cron.d/.update...', 'info');
            engine.printLine('  Removing persistence: /root/.ssh/authorized_keys (attacker key)...', 'info');
            engine.printLine('  Removing ransom note: /var/data/README_DECRYPT.txt...', 'info');
            engine.printLine('  Resetting root password...', 'info');
            engine.printLine('  Disabling SSH root login...', 'info');
            engine.printLine('', 'system');
            engine.printLine('MALWARE ERADICATED. Host is clean but data remains encrypted.', 'success');
            engine.printLine('Encrypted files require restoration from backup.', 'warning');
            state.malwareEradicated = true;
            engine.checkObjectives(); engine.updateGrid(); engine.saveState();
        }

        function cmdRestore(args) {
            if (!args.length) { engine.printLine('Usage: restore <node name or IP>', 'error'); return; }
            var target = args.join(' '), node = engine.resolveNode(target);
            if (!node) { engine.printLine('restore: unknown host ' + target, 'error'); return; }
            if (node.type !== 'infected-server') { engine.printLine('Cannot restore ' + node.info.label + '. Only the infected host needs restoration.', 'warning'); return; }
            var cellType = curCell();
            if (cellType !== 'backup') {
                engine.printLine('You must be at the BACKUP node to initiate restoration.', 'error');
                engine.printLine('Current position: ' + (config.nodes[cellType] ? config.nodes[cellType].label : 'Clear'), 'system');
                return;
            }
            if (!state.malwareEradicated) {
                engine.printLine('Cannot restore yet. Malware must be eradicated first.', 'error');
                engine.printLine('Navigate to INFECTED and run "eradicate" first.', 'info');
                return;
            }
            if (state.backupRestored) { engine.printLine('System has already been restored from backup.', 'warning'); return; }
            engine.printLine('', 'system');
            engine.printLine('Initiating restoration from BACKUP (10.1.0.50)...', 'system');
            engine.printLine('  Connecting to Veeam backup repository...', 'info');
            engine.printLine('  Verifying backup integrity: 2026-03-03 23:00 snapshot...', 'info');
            engine.printLine('  SHA-256 checksum: VALID', 'info');
            engine.printLine('  Restoring /var/data/ from clean snapshot...', 'info');
            engine.printLine('  Files restored: 14,892 files (2.3 GB)', 'info');
            engine.printLine('  Verifying restored data integrity...', 'info');
            engine.printLine('', 'system');
            engine.printLine('RESTORATION COMPLETE. All data recovered from clean backup.', 'success');
            state.backupRestored = true;
            engine.checkObjectives(); engine.saveState();
        }

        function cmdStatus() {
            var cellType = curCell();
            var posLabel = (cellType !== 'empty' && cellType !== 'wall') ? config.nodes[cellType].label : 'Clear';
            engine.printLine('', 'system'); engine.printLine('\u2550\u2550\u2550 IR STATUS \u2550\u2550\u2550', 'heading');
            engine.printLine('Position: (' + state.position.col + ',' + state.position.row + ') -- ' + posLabel, 'info');
            engine.printLine('Nodes discovered: ' + state.nodesDiscovered.size + ' / 9', 'info');
            engine.printLine('Commands used: ' + state.agentCmdCount, 'info');
            engine.printLine('', 'system');
            engine.printLine('IR Status:', 'heading');
            engine.printLine('  Threat identified: ' + (state.threatIdentified ? 'YES' : 'NO'), state.threatIdentified ? 'success' : 'warning');
            engine.printLine('  Host isolated:     ' + (state.hostIsolated ? 'YES' : 'NO'), state.hostIsolated ? 'success' : 'warning');
            engine.printLine('  Malware eradicated:' + (state.malwareEradicated ? ' YES' : ' NO'), state.malwareEradicated ? 'success' : 'warning');
            engine.printLine('  Backup restored:   ' + (state.backupRestored ? 'YES' : 'NO'), state.backupRestored ? 'success' : 'warning');
            engine.printLine('  Firewall rules:    ' + (state.firewallContained ? 'ACTIVE' : 'INACTIVE'), state.firewallContained ? 'success' : 'system');
            engine.printLine('', 'system');
            engine.printLine('Objectives:', 'heading');
            var objText = ['Identify threat vector', 'Isolate infected host', 'Eradicate malware', 'Restore from backup'];
            for (var j = 0; j < config.objectives.length; j++) {
                var done = state.objectives[j];
                engine.printLine((done ? ' [X] ' : ' [ ] ') + objText[j], done ? 'success' : 'system');
            }
        }

        function cmdHelp() {
            engine.printLine('', 'system'); engine.printLine('\u2550\u2550\u2550 COMMAND REFERENCE \u2550\u2550\u2550', 'heading');
            engine.printLine('  scan              Survey area, reveal adjacent nodes', 'info');
            engine.printLine('  move <dir>        Move agent (north/south/east/west or n/s/e/w)', 'info');
            engine.printLine('  logs <node>       View SIEM logs for a node', 'info');
            engine.printLine('  isolate <node>    Network isolate a compromised host', 'info');
            engine.printLine('  contain           Activate firewall containment rules', 'info');
            engine.printLine('  eradicate         Remove malware from isolated host', 'info');
            engine.printLine('  restore <node>    Restore a node from backup', 'info');
            engine.printLine('  ping <node>       Check host status', 'info');
            engine.printLine('  status            Show position and objectives', 'info');
            engine.printLine('  help              Show this reference', 'info');
            engine.printLine('  clear             Clear terminal output', 'info');
            engine.printLine('', 'system');
            engine.printLine('IR lifecycle: Identify > Contain > Eradicate > Recover', 'system');
            engine.printLine('Nodes: reference by name, abbreviation, or IP.', 'system');
        }

        function executeCommand(input) {
            state.agentCmdCount++;
            engine.printLine(config.promptText + input, 'prompt-echo');
            var parts = input.trim().split(/\s+/), cmd = parts[0].toLowerCase(), args = parts.slice(1);
            switch (cmd) {
                case 'scan':       cmdScan(); break;
                case 'move':       cmdMove(args); break;
                case 'ping':       cmdPing(args); break;
                case 'logs':       cmdLogs(args); break;
                case 'isolate':    cmdIsolate(args); break;
                case 'contain':    cmdContain(); break;
                case 'eradicate':  cmdEradicate(); break;
                case 'restore':    cmdRestore(args); break;
                case 'status':     cmdStatus(); break;
                case 'help':       cmdHelp(); break;
                case 'clear':      outputConsole.innerHTML = ''; break;
                default:
                    engine.printLine('Unknown command: ' + cmd, 'error');
                    engine.printLine('Type "help" for available commands.', 'system');
            }
        }

        termInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { var cmd = this.value.trim(); if (cmd) { history.push(cmd); histIdx = history.length; executeCommand(cmd); } this.value = ''; }
            else if (e.key === 'ArrowUp') { e.preventDefault(); if (histIdx > 0) { histIdx--; this.value = history[histIdx]; } }
            else if (e.key === 'ArrowDown') { e.preventDefault(); if (histIdx < history.length - 1) { histIdx++; this.value = history[histIdx]; } else { histIdx = history.length; this.value = ''; } }
        });
        editorPanel.addEventListener('click', function(e) { if (e.target.tagName !== 'INPUT') termInput.focus(); });

        // Briefing
        engine.printLine('\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557', 'heading');
        engine.printLine('\u2551  MISSION: IR-01 -- BREACH PROTOCOL         \u2551', 'heading');
        engine.printLine('\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563', 'heading');
        for (var b = 0; b < config.briefing.length; b++) {
            engine.printLine('\u2551  ' + config.briefing[b] + Array(Math.max(1, 39 - config.briefing[b].length)).join(' ') + '\u2551', 'heading');
        }
        engine.printLine('\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D', 'heading');
        engine.printLine('', 'system');
        engine.printLine('[SYS] SOC analyst online at SIEM (10.1.0.5)', 'success');
        engine.printLine('[SYS] Type "help" for command reference', 'info');
        engine.printLine('[SYS] Type "scan" to survey the area', 'info');
        engine.printLine('', 'system');
        termInput.focus();
    })();
