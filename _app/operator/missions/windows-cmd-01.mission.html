<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINDOWS-CMD-01: Workstation Triage | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <style>
        .editor-panel { background: #080a0e; }
        .editor-area { display: none; }
        .editor-toolbar { display: none; }
        .output-console { flex: 1; }
        .term-input-row { display: flex; align-items: center; padding: 8px 14px; border-top: 1px solid rgba(57,255,20,0.1); background: #0a0c12; flex-shrink: 0; }
        .term-prompt-text { color: #39ff14; font-size: 0.78rem; white-space: nowrap; margin-right: 8px; font-family: var(--op-font); }
        .term-input { flex: 1; background: transparent; border: none; outline: none; color: #76ff03; font-family: var(--op-font); font-size: 0.78rem; caret-color: #39ff14; }
        .grid-cell[data-type="malware-host"]:not(.vis-hidden):not(.wall) { border-left: 2px solid rgba(255,68,68,0.4); }
        .grid-cell[data-type="domain-controller"]:not(.vis-hidden):not(.wall) { border-left: 2px solid rgba(255,215,0,0.4); }
    </style>
    <script src="../../components/ModuleProgress.js"></script>
</head>
<body>
    <div id="operator-root"></div>

    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/windows-cmd-01.config.js"></script>
    <script>
    /* ================================================================
       WINDOWS-CMD-01: Workstation Triage -- Terminal Command Layer
       Custom state: c2Identified, malwareKilled, filesRepaired, dnsVerified.
       Commands: scan, move, ipconfig, netstat, tasklist, taskkill, sfc,
                 chkdsk, nslookup, ping, status, help, clear.
       ================================================================ */
    (function() {
        var config = WINDOWS_CMD_01_CONFIG;
        var engine = OperatorEngine.init(config);
        var state  = engine.getState();

        // Initialize custom state
        state.c2Identified = false;
        state.malwareKilled = false;
        state.filesRepaired = false;
        state.dnsVerified = false;

        // Replace editor panel with terminal
        var editorPanel = document.querySelector('.editor-panel');
        editorPanel.innerHTML = '';
        var termBar = document.createElement('div');
        termBar.style.cssText = 'padding:7px 14px;background:#0c0e14;border-bottom:1px solid rgba(57,255,20,0.1);display:flex;align-items:center;gap:6px;flex-shrink:0;';
        for (var i = 0; i < 3; i++) { var dot = document.createElement('div'); dot.style.cssText = 'width:7px;height:7px;border-radius:50%;background:rgba(57,255,20,0.3);'; termBar.appendChild(dot); }
        var barLabel = document.createElement('span'); barLabel.style.cssText = 'font-size:0.55rem;color:rgba(57,255,20,0.35);letter-spacing:0.1em;margin-left:6px;'; barLabel.textContent = 'COMMAND PROMPT';
        termBar.appendChild(barLabel);
        editorPanel.appendChild(termBar);
        var outputConsole = document.querySelector('.output-console');
        editorPanel.appendChild(outputConsole);
        var inputRow = document.createElement('div'); inputRow.className = 'term-input-row';
        var promptSpan = document.createElement('span'); promptSpan.className = 'term-prompt-text'; promptSpan.textContent = config.promptText;
        var termInput = document.createElement('input'); termInput.type = 'text'; termInput.className = 'term-input'; termInput.autocomplete = 'off'; termInput.spellcheck = false;
        inputRow.appendChild(promptSpan); inputRow.appendChild(termInput);
        editorPanel.appendChild(inputRow);

        var history = []; var histIdx = -1;
        function curCell() { return config.grid.cells[state.position.row][state.position.col]; }

        function cmdScan() {
            var c = config, col = state.position.col, row = state.position.row, cellType = curCell();
            engine.printLine('Scanning area...', 'system'); engine.printLine('', 'system');
            if (cellType !== 'empty' && cellType !== 'wall') {
                var cur = c.nodes[cellType]; engine.printLine('Current: ' + cur.label + ' (' + cur.ip + ')', 'heading'); engine.printLine(cur.desc, 'info');
            } else engine.printLine('Current: Clear path (no node)', 'heading');
            engine.printLine('', 'system'); engine.printLine('Adjacent:', 'heading');
            var dirs = [{name:'North',dc:0,dr:-1},{name:'South',dc:0,dr:1},{name:'East',dc:1,dr:0},{name:'West',dc:-1,dr:0}];
            for (var i = 0; i < dirs.length; i++) {
                var d = dirs[i], nc = col + d.dc, nr = row + d.dr;
                if (nc < 0 || nc >= c.grid.cols || nr < 0 || nr >= c.grid.rows) { engine.printLine('  ' + d.name + ': [network edge]', 'system'); continue; }
                var type = c.grid.cells[nr][nc];
                if (type === 'wall') { engine.printLine('  ' + d.name + ': [blocked]', 'system'); continue; }
                var key = nc + ',' + nr;
                if (!state.visibility[key] || state.visibility[key] === 'hidden') state.visibility[key] = 'revealed';
                if (type === 'empty') engine.printLine('  ' + d.name + ': Clear path', 'info');
                else { var info = c.nodes[type]; engine.printLine('  ' + d.name + ': ' + info.label + ' (' + info.ip + ')', 'node-info'); }
            }
            engine.updateGrid(); engine.saveState();
        }

        function cmdMove(args) {
            if (!args.length) { engine.printLine('Usage: move <direction>', 'error'); return; }
            var dirMap = {'north':[0,-1],'n':[0,-1],'south':[0,1],'s':[0,1],'east':[1,0],'e':[1,0],'west':[-1,0],'w':[-1,0]};
            var dir = args[0].toLowerCase(); if (!dirMap[dir]) { engine.printLine('Unknown direction: ' + args[0], 'error'); return; }
            var d = dirMap[dir], nc = state.position.col + d[0], nr = state.position.row + d[1];
            if (nc < 0 || nc >= config.grid.cols || nr < 0 || nr >= config.grid.rows) { engine.printLine('Edge of network. Cannot move ' + dir + '.', 'error'); return; }
            var cellType = config.grid.cells[nr][nc];
            if (cellType === 'wall') { engine.printLine('Blocked. No traversable path ' + dir + '.', 'error'); return; }
            state.position = { col: nc, row: nr }; state.visibility[nc + ',' + nr] = 'visited';
            if (cellType !== 'empty') state.nodesDiscovered.add(cellType);
            engine.revealAdjacent(nc, nr);
            var dirName = {n:'north',s:'south',e:'east',w:'west'}[dir] || dir;
            if (cellType === 'empty') engine.printLine('Moving ' + dirName + '... Clear path.', 'system');
            else { var info = config.nodes[cellType]; engine.printLine('Moving ' + dirName + '... ' + info.label + ' (' + info.ip + ')', 'success'); engine.printLine(info.desc, 'info'); }
            engine.checkObjectives(); engine.updateGrid(); engine.saveState();
        }

        function cmdPing(args) {
            if (!args.length) { engine.printLine('Usage: ping <node name or IP>', 'error'); return; }
            var target = args.join(' '), node = engine.resolveNode(target);
            if (!node) { engine.printLine(target.match(/^[\d.]+$/) ? 'Request timed out.' : 'Ping request could not find host ' + target + '.', 'error'); return; }
            if (node.visibility === 'hidden') { engine.printLine('Request timed out. No route to host.', 'error'); return; }
            var info = node.info, ms = (Math.random() * 5 + 0.5).toFixed(0);
            engine.printLine('', 'system');
            engine.printLine('Pinging ' + info.ip + ' with 32 bytes of data:', 'system');
            engine.printLine('Reply from ' + info.ip + ': bytes=32 time=' + ms + 'ms TTL=128', 'node-info');
            engine.printLine('Reply from ' + info.ip + ': bytes=32 time=' + (parseInt(ms) + 1) + 'ms TTL=128', 'node-info');
            engine.printLine('', 'system');
            engine.printLine('Ping statistics for ' + info.ip + ':', 'info');
            engine.printLine('    Packets: Sent = 2, Received = 2, Lost = 0 (0% loss)', 'info');
        }

        function cmdIpconfig() {
            var cellType = curCell();
            engine.printLine('', 'system'); engine.printLine('Windows IP Configuration', 'heading'); engine.printLine('', 'system');
            if (cellType !== 'empty' && cellType !== 'wall') {
                var info = config.nodes[cellType];
                engine.printLine('   Host Name . . . . . . . . . . : ' + info.label, 'info');
                engine.printLine('   OS  . . . . . . . . . . . . . : ' + info.os, 'info');
                engine.printLine('', 'system'); engine.printLine('Ethernet adapter Ethernet0:', 'heading'); engine.printLine('', 'system');
                engine.printLine('   IPv4 Address. . . . . . . . . : ' + info.ip, 'node-info');
                engine.printLine('   Subnet Mask . . . . . . . . . : 255.255.255.0', 'info');
                engine.printLine('   Default Gateway . . . . . . . : 192.168.1.1', 'info');
                engine.printLine('   DNS Server  . . . . . . . . . : 192.168.1.2', 'info');
            } else engine.printLine('   No network adapter detected at this position.', 'warning');
            engine.printLine('', 'system');
        }

        function cmdNetstat() {
            var cellType = curCell();
            engine.printLine('', 'system'); engine.printLine('Active Connections', 'heading'); engine.printLine('', 'system');
            engine.printLine('  Proto  Local Address          Foreign Address        State', 'info');
            if (cellType !== 'workstation') {
                if (cellType !== 'empty' && cellType !== 'wall') { var info = config.nodes[cellType]; engine.printLine('  TCP    ' + info.ip + ':445          192.168.1.10:49300     ESTABLISHED', 'system'); }
                engine.printLine('', 'system'); engine.printLine('No suspicious connections detected.', 'info'); return;
            }
            engine.printLine('  TCP    192.168.1.10:49152     192.168.1.1:389        ESTABLISHED', 'system');
            engine.printLine('  TCP    192.168.1.10:49153     192.168.1.2:53         ESTABLISHED', 'system');
            engine.printLine('  TCP    192.168.1.10:49201     203.0.113.42:443       ESTABLISHED  *', 'warning');
            engine.printLine('  TCP    192.168.1.10:49202     203.0.113.42:8443      ESTABLISHED  *', 'warning');
            engine.printLine('  TCP    192.168.1.10:3389      192.168.1.100:52341    ESTABLISHED', 'system');
            engine.printLine('', 'system');
            engine.printLine('* Suspicious outbound connections to unknown external host', 'error');
            if (!state.c2Identified) { state.c2Identified = true; engine.checkObjectives(); engine.saveState(); }
        }

        function cmdTasklist() {
            var cellType = curCell();
            engine.printLine('', 'system');
            engine.printLine('Image Name                     PID Session Name        Mem Usage', 'info');
            engine.printLine('========================= ======== ================ ==========', 'info');
            if (cellType !== 'workstation') {
                engine.printLine('System Idle Process              0 Services                0 K', 'system');
                engine.printLine('System                           4 Services            1,024 K', 'system');
                engine.printLine('svchost.exe                    512 Services            6,432 K', 'system');
                engine.printLine('', 'system'); engine.printLine('No anomalies detected on this host.', 'info'); return;
            }
            engine.printLine('System Idle Process              0 Services                0 K', 'system');
            engine.printLine('System                           4 Services            1,024 K', 'system');
            engine.printLine('svchost.exe                    892 Services           12,432 K', 'system');
            engine.printLine('svchost.exe                   1204 Services            8,756 K', 'system');
            engine.printLine('explorer.exe                  3456 Console            45,892 K', 'system');
            engine.printLine('svchost.exe                   4891 Services           98,432 K  *', 'warning');
            engine.printLine('chrome.exe                    5123 Console            89,012 K', 'system');
            engine.printLine('tasklist.exe                  7890 Console             5,120 K', 'system');
            engine.printLine('', 'system');
            engine.printLine('* PID 4891: Abnormal memory usage for svchost.exe -- potential malware', 'error');
        }

        function cmdTaskkill(args) {
            var raw = args.join(' ').toLowerCase(), pidMatch = raw.match(/\/pid\s+(\d+)/);
            if (!pidMatch) { engine.printLine('Usage: taskkill /PID <process_id>', 'error'); return; }
            var pid = parseInt(pidMatch[1]);
            if (pid === 4891) {
                if (state.malwareKilled) { engine.printLine('ERROR: PID 4891 has already been terminated.', 'warning'); return; }
                engine.printLine('SUCCESS: The process with PID 4891 has been terminated.', 'success');
                engine.printLine('[!] Malicious svchost.exe (98,432 K) killed.', 'success');
                engine.printLine('Outbound C2 connections should begin to drop.', 'info');
                state.malwareKilled = true; engine.checkObjectives(); engine.saveState();
            } else if (pid === 0 || pid === 4) {
                engine.printLine('ERROR: Access denied. Cannot terminate system process PID ' + pid + '.', 'error');
            } else if ([892, 1204, 3456, 5123, 7890].indexOf(pid) !== -1) {
                engine.printLine('SUCCESS: The process with PID ' + pid + ' has been terminated.', 'warning');
                engine.printLine('[!] WARNING: You terminated a legitimate process. Focus on PID 4891.', 'warning');
            } else engine.printLine('ERROR: The process "' + pid + '" not found.', 'error');
        }

        function cmdSfc(args) {
            if (args.join(' ').toLowerCase() !== '/scannow') { engine.printLine('Usage: sfc /scannow', 'error'); return; }
            engine.printLine('', 'system'); engine.printLine('Beginning system scan. This process will take some time.', 'system');
            engine.printLine('', 'system'); engine.printLine('Beginning verification phase of system scan.', 'system');
            engine.printLine('Verification 100% complete.', 'info'); engine.printLine('', 'system');
            if (state.filesRepaired) { engine.printLine('Windows Resource Protection did not find any integrity violations.', 'success'); return; }
            engine.printLine('Windows Resource Protection found corrupt files and successfully repaired them.', 'success');
            engine.printLine('For online repairs, details are included in the CBS log file:', 'info');
            engine.printLine('C:\\Windows\\Logs\\CBS\\CBS.log', 'info'); engine.printLine('', 'system');
            engine.printLine('  Files repaired: 3', 'warning');
            engine.printLine('  - C:\\Windows\\System32\\drivers\\tcpip.sys (replaced)', 'warning');
            engine.printLine('  - C:\\Windows\\System32\\svchost.exe (replaced)', 'warning');
            engine.printLine('  - C:\\Windows\\System32\\netsh.dll (replaced)', 'warning');
            state.filesRepaired = true; engine.checkObjectives(); engine.saveState();
        }

        function cmdChkdsk() {
            engine.printLine('', 'system'); engine.printLine('The type of the file system is NTFS.', 'info');
            engine.printLine('Volume label is OS.', 'info'); engine.printLine('', 'system');
            engine.printLine('Stage 1: Examining basic file system structure ...', 'system');
            engine.printLine('  523776 file records processed.', 'system');
            engine.printLine('Stage 2: Examining file name linkage ...', 'system');
            engine.printLine('  612040 index entries processed.', 'system');
            engine.printLine('Stage 3: Examining security descriptors ...', 'system');
            engine.printLine('  52416 security descriptors processed.', 'system'); engine.printLine('', 'system');
            engine.printLine('Windows has scanned the file system and found no problems.', 'success');
            engine.printLine('No further action is required.', 'info');
        }

        function cmdNslookup(args) {
            if (!args.length) { engine.printLine('Usage: nslookup <node name or IP>', 'error'); return; }
            var target = args.join(' '), node = engine.resolveNode(target);
            if (!node) { engine.printLine('*** UnKnown can\'t find ' + target + ': Non-existent domain', 'error'); return; }
            if (node.visibility === 'hidden') { engine.printLine('DNS request timed out. Server not reachable.', 'error'); return; }
            var info = node.info;
            engine.printLine('', 'system');
            engine.printLine('Server:  dns-srv.corp.local', 'info');
            engine.printLine('Address: 192.168.1.2', 'info'); engine.printLine('', 'system');
            engine.printLine('Name:    ' + info.label.toLowerCase() + '.corp.local', 'node-info');
            engine.printLine('Address: ' + info.ip, 'node-info');
            if (node.type === 'domain-controller' && !state.dnsVerified) {
                engine.printLine('', 'system');
                engine.printLine('[+] DNS resolution for DC-01 confirmed clean.', 'success');
                engine.printLine('[+] No DNS poisoning or hijacking detected.', 'success');
                state.dnsVerified = true; engine.checkObjectives(); engine.saveState();
            }
        }

        function cmdStatus() {
            var cellType = curCell();
            var posLabel = (cellType !== 'empty' && cellType !== 'wall') ? config.nodes[cellType].label : 'Clear';
            engine.printLine('', 'system'); engine.printLine('\u2550\u2550\u2550 STATUS \u2550\u2550\u2550', 'heading');
            engine.printLine('Position: (' + state.position.col + ',' + state.position.row + ') -- ' + posLabel, 'info');
            engine.printLine('Nodes discovered: ' + state.nodesDiscovered.size + ' / 8', 'info');
            engine.printLine('Commands used: ' + state.agentCmdCount, 'info');
            engine.printLine('C2 connection: ' + (state.c2Identified ? 'IDENTIFIED' : 'UNKNOWN'), state.c2Identified ? 'success' : 'warning');
            engine.printLine('Malicious process: ' + (state.malwareKilled ? 'TERMINATED' : 'ACTIVE'), state.malwareKilled ? 'success' : 'warning');
            engine.printLine('System files: ' + (state.filesRepaired ? 'REPAIRED' : 'UNCHECKED'), state.filesRepaired ? 'success' : 'warning');
            engine.printLine('DNS integrity: ' + (state.dnsVerified ? 'VERIFIED' : 'UNVERIFIED'), state.dnsVerified ? 'success' : 'warning');
            engine.printLine('', 'system'); engine.printLine('Objectives:', 'heading');
            var objText = ['Identify C2 connection (run netstat at workstation)', 'Kill malicious process (taskkill /PID 4891)', 'Repair system files (sfc /scannow)', 'Verify DNS integrity (nslookup domain controller)'];
            for (var j = 0; j < state.objectives.length; j++) engine.printLine((state.objectives[j] ? ' [X] ' : ' [ ] ') + objText[j], state.objectives[j] ? 'success' : 'system');
        }

        function cmdHelp() {
            engine.printLine('', 'system'); engine.printLine('\u2550\u2550\u2550 COMMAND REFERENCE \u2550\u2550\u2550', 'heading');
            engine.printLine('  scan              Survey area, reveal adjacent nodes', 'info');
            engine.printLine('  move <dir>        Move agent (north/south/east/west or n/s/e/w)', 'info');
            engine.printLine('  ipconfig          Show network configuration', 'info');
            engine.printLine('  netstat           Show active connections', 'info');
            engine.printLine('  tasklist          Show running processes', 'info');
            engine.printLine('  taskkill /PID #   Kill process by PID', 'info');
            engine.printLine('  sfc /scannow      System File Checker', 'info');
            engine.printLine('  chkdsk            Check disk integrity', 'info');
            engine.printLine('  nslookup <node>   DNS lookup on a node', 'info');
            engine.printLine('  ping <node>       Ping a node by name or IP', 'info');
            engine.printLine('  status            Show position and objectives', 'info');
            engine.printLine('  help              Show this reference', 'info');
            engine.printLine('  clear             Clear terminal output', 'info');
            engine.printLine('', 'system');
            engine.printLine('Nodes: reference by name, abbreviation, or IP.', 'system');
        }

        function executeCommand(input) {
            state.agentCmdCount++;
            engine.printLine(config.promptText + input, 'prompt-echo');
            var parts = input.trim().split(/\s+/), cmd = parts[0].toLowerCase(), args = parts.slice(1);
            switch (cmd) {
                case 'scan':     cmdScan(); break;
                case 'move':     cmdMove(args); break;
                case 'ping':     cmdPing(args); break;
                case 'ipconfig': cmdIpconfig(); break;
                case 'netstat':  cmdNetstat(); break;
                case 'tasklist': cmdTasklist(); break;
                case 'taskkill': cmdTaskkill(args); break;
                case 'sfc':      cmdSfc(args); break;
                case 'chkdsk':   cmdChkdsk(); break;
                case 'nslookup': cmdNslookup(args); break;
                case 'status':   cmdStatus(); break;
                case 'help':     cmdHelp(); break;
                case 'clear':    outputConsole.innerHTML = ''; break;
                default:
                    engine.printLine('\'' + cmd + '\' is not recognized as an internal or external command,', 'error');
                    engine.printLine('operable program or batch file.', 'error');
                    engine.printLine('Type "help" for available commands.', 'system');
            }
        }

        termInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { var cmd = this.value.trim(); if (cmd) { history.push(cmd); histIdx = history.length; executeCommand(cmd); } this.value = ''; }
            else if (e.key === 'ArrowUp') { e.preventDefault(); if (histIdx > 0) { histIdx--; this.value = history[histIdx]; } }
            else if (e.key === 'ArrowDown') { e.preventDefault(); if (histIdx < history.length - 1) { histIdx++; this.value = history[histIdx]; } else { histIdx = history.length; this.value = ''; } }
        });
        editorPanel.addEventListener('click', function(e) { if (e.target.tagName !== 'INPUT') termInput.focus(); });

        // Briefing
        engine.printLine('\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557', 'heading');
        engine.printLine('\u2551  MISSION: WINDOWS-CMD-01 -- WORKSTATION TRIAGE  \u2551', 'heading');
        engine.printLine('\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563', 'heading');
        for (var b = 0; b < config.briefing.length; b++) {
            engine.printLine('\u2551  ' + config.briefing[b] + Array(Math.max(1, 47 - config.briefing[b].length)).join(' ') + '\u2551', 'heading');
        }
        engine.printLine('\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D', 'heading');
        engine.printLine('', 'system');
        engine.printLine('Commands: scan, move, ipconfig, netstat, sfc /scannow, chkdsk,', 'info');
        engine.printLine('          tasklist, taskkill, nslookup, ping, status, help, clear.', 'info');
        engine.printLine('', 'system');
        engine.printLine('[SYS] Analyst online at WORKSTATION (192.168.1.10)', 'success');
        engine.printLine('[SYS] Type "help" for command reference', 'info');
        engine.printLine('[SYS] Type "scan" to survey the area', 'info');
        engine.printLine('', 'system');
        termInput.focus();
    })();
    </script>
</body>
</html>
