<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../components/AchievementManager.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIREWALL-01: Perimeter | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
</head>
<body>
    <div id="operator-root"></div>

    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/firewall-01.config.js"></script>
    <script>
    (function() {
        var engine = OperatorEngine.init(FIREWALL_01_CONFIG);
        var agent  = AgentBridge.create(engine);
        var config = FIREWALL_01_CONFIG;

        // ---- Firewall-specific state ----
        var customRules = [];

        function padRight(str, len) { str = String(str); while (str.length < len) str += ' '; return str; }

        function resolveIP(query) {
            var q = query.toLowerCase();
            var nodes = config.nodes;
            for (var key in nodes) {
                var info = nodes[key];
                if (q === key || q === info.label.toLowerCase() || q === info.ip || q === info.abbr.toLowerCase()) return info;
            }
            return null;
        }

        function buildRuleset() {
            var rules = [];
            customRules.forEach(function(r, i) { rules.push({ id: i + 1, action: r.action, src: r.src, dst: r.dst, port: r.port, proto: r.proto }); });
            config.defaultRules.forEach(function(r) { rules.push({ id: rules.length + 1, action: r.action, src: r.src, dst: r.dst, port: r.port, proto: r.proto }); });
            return rules;
        }

        // ---- Command handlers ----

        function cmdHelp() {
            engine.printLine('', 'system');
            engine.printLine('\u2550\u2550\u2550 COMMAND REFERENCE \u2550\u2550\u2550', 'heading');
            engine.printLine('  scan                  Survey area, reveal adjacent nodes', 'info');
            engine.printLine('  move <dir>            Move agent (north/south/east/west or n/s/e/w)', 'info');
            engine.printLine('  status                Show position and objectives', 'info');
            engine.printLine('  rules                 Display current firewall ruleset', 'info');
            engine.printLine('  block <ip>            Add DENY rule for a source IP', 'info');
            engine.printLine('  allow <ip> <port>     Add ALLOW rule for destination IP and port', 'info');
            engine.printLine('  test <src> <dst> <p>  Test connectivity (name or IP, port number)', 'info');
            engine.printLine('  ids                   Check IDS/Suricata alerts', 'info');
            engine.printLine('  flush                 Flush all custom rules (reset to defaults)', 'info');
            engine.printLine('  help                  Show this reference', 'info');
            engine.printLine('  clear                 Clear terminal output', 'info');
        }

        function cmdIds() {
            var state = engine.getState();
            engine.printLine('', 'system');
            engine.printLine('\u2550\u2550\u2550 IDS ALERTS \u2014 SURICATA 7.0 (10.0.0.5) \u2550\u2550\u2550', 'heading');
            engine.printLine('Last updated: ' + new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC', 'system');
            engine.printLine('', 'system');
            engine.printLine('[ALERT] ET SCAN Nmap SYN Scan', 'warning');
            engine.printLine('  src: 203.0.113.66 \u2192 dst: 172.16.0.10  port: 80', 'node-info');
            engine.printLine('  priority: HIGH | sid: 2000537', 'system');
            engine.printLine('', 'system');
            engine.printLine('[ALERT] ET SCAN Potential SSH Brute Force', 'warning');
            engine.printLine('  src: 203.0.113.66 \u2192 dst: 10.0.0.1     port: 22', 'node-info');
            engine.printLine('  priority: HIGH | sid: 2001219', 'system');
            engine.printLine('', 'system');
            engine.printLine('[ALERT] ET POLICY Possible SQL Injection Attempt', 'warning');
            engine.printLine('  src: 203.0.113.66 \u2192 dst: 172.16.0.10  port: 80', 'node-info');
            engine.printLine('  priority: CRITICAL | sid: 2006445', 'system');
            engine.printLine('', 'system');
            engine.printLine('3 active alerts. Hostile source: 203.0.113.66', 'error');
            engine.printLine('Recommended action: block 203.0.113.66', 'info');
            if (!state.alertsChecked) {
                state.alertsChecked = true;
                engine.printLine('', 'system');
                engine.printLine('[!] IDS review complete. Alerts logged.', 'success');
                engine.checkObjectives();
            }
            engine.saveState();
        }

        function cmdRules() {
            var ruleset = buildRuleset();
            engine.printLine('', 'system');
            engine.printLine('\u2550\u2550\u2550 FIREWALL RULES (FW1 / 10.0.0.1) \u2550\u2550\u2550', 'heading');
            engine.printLine(padRight('#', 4) + padRight('ACTION', 8) + padRight('SRC', 20) + padRight('DST', 20) + padRight('PORT', 8) + 'PROTO', 'heading');
            engine.printLine('\u2500'.repeat(65), 'system');
            ruleset.forEach(function(r) {
                engine.printLine(padRight(r.id, 4) + padRight(r.action, 8) + padRight(r.src, 20) + padRight(r.dst, 20) + padRight(r.port, 8) + r.proto, r.action === 'DENY' ? 'error' : 'node-info');
            });
            if (customRules.length > 0) engine.printLine('(' + customRules.length + ' custom rule(s) active)', 'warning');
        }

        function cmdBlock(args) {
            if (!args.length) { engine.printLine('Usage: block <ip>', 'error'); return; }
            var ip = args[0];
            if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) { engine.printLine('Invalid IP address: ' + ip, 'error'); return; }
            var already = customRules.some(function(r) { return r.action === 'DENY' && r.src === ip; });
            if (already) { engine.printLine('Rule already exists: DENY ' + ip, 'warning'); return; }
            customRules.unshift({ action: 'DENY', src: ip, dst: 'any', port: 'any', proto: 'any' });
            engine.printLine('', 'system');
            engine.printLine('Rule added: DENY ' + ip + ' any any any', 'success');
            if (ip === '203.0.113.66') {
                engine.getState().attackerBlocked = true;
                engine.printLine('[!] Hostile source 203.0.113.66 neutralized.', 'success');
                engine.updateGrid();
            }
            engine.checkObjectives();
            engine.saveState();
        }

        function cmdAllow(args) {
            if (args.length < 2) { engine.printLine('Usage: allow <dst-ip> <port>', 'error'); return; }
            var ip = args[0], port = args[1];
            if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) { engine.printLine('Invalid IP: ' + ip, 'error'); return; }
            if (!/^\d+$/.test(port)) { engine.printLine('Invalid port: ' + port, 'error'); return; }
            var portNum = parseInt(port, 10);
            if (portNum < 1 || portNum > 65535) { engine.printLine('Port out of range: ' + port, 'error'); return; }
            var already = customRules.some(function(r) { return r.action === 'ALLOW' && r.dst === ip && r.port === port; });
            if (already) { engine.printLine('Rule already exists: ALLOW any ' + ip + ' ' + port, 'warning'); return; }
            customRules.unshift({ action: 'ALLOW', src: 'any', dst: ip, port: port, proto: 'TCP' });
            engine.printLine('', 'system');
            engine.printLine('Rule added: ALLOW any ' + ip + ' ' + port + ' TCP', 'success');
            if (ip === '172.16.0.10' && (port === '80' || port === '443')) {
                engine.getState().webAllowed = true;
                engine.printLine('[!] DMZ web server traffic verified.', 'success');
            }
            engine.checkObjectives();
            engine.saveState();
        }

        function cmdTest(args) {
            if (args.length < 3) { engine.printLine('Usage: test <src> <dst> <port>', 'error'); return; }
            var state = engine.getState();
            var srcInfo = resolveIP(args[0]), dstInfo = resolveIP(args[1]), port = args[2];
            if (!/^\d+$/.test(port)) { engine.printLine('Invalid port: ' + port, 'error'); return; }
            var srcLabel = srcInfo ? srcInfo.label : args[0].toUpperCase();
            var srcIp = srcInfo ? srcInfo.ip : args[0];
            var dstLabel = dstInfo ? dstInfo.label : args[1].toUpperCase();
            var dstIp = dstInfo ? dstInfo.ip : args[1];
            engine.printLine('', 'system');
            engine.printLine('Testing: ' + srcLabel + ' (' + srcIp + ') \u2192 ' + dstLabel + ' (' + dstIp + ') port ' + port, 'heading');
            // Attacker blocked
            if ((srcIp === '203.0.113.66' || args[0].toLowerCase() === 'attacker') && state.attackerBlocked) {
                engine.printLine('Result: DENIED \u2014 source 203.0.113.66 is blocked.', 'error'); return;
            }
            // WAN to DB
            var isWan = (srcIp === '0.0.0.0' || args[0].toLowerCase() === 'internet' || args[0].toLowerCase() === 'wan');
            var isDb = (dstIp === '192.168.1.50' || args[1].toLowerCase() === 'internal-db' || args[1].toLowerCase() === 'db' || args[1].toLowerCase() === 'int-db');
            if (isWan && isDb) {
                engine.printLine('Result: DENIED \u2014 no route from WAN to internal DB.', 'error');
                if (!state.dbSecured) { state.dbSecured = true; engine.printLine('[!] Confirmed: Internal database unreachable from WAN.', 'success'); engine.checkObjectives(); }
                return;
            }
            if (isWan && dstIp.indexOf('192.168.') === 0) { engine.printLine('Result: DENIED \u2014 WAN to internal blocked.', 'error'); return; }
            if (srcIp.indexOf('192.168.1.') === 0) { engine.printLine('Result: ALLOWED \u2014 internal source allowed.', 'success'); return; }
            if (dstIp === '172.16.0.10' && (port === '80' || port === '443')) { engine.printLine('Result: ALLOWED \u2014 DMZ web traffic.', 'success'); return; }
            if (dstIp === '172.16.0.20' && port === '25') { engine.printLine('Result: ALLOWED \u2014 DMZ mail traffic.', 'success'); return; }
            engine.printLine('Result: DENIED \u2014 default deny.', 'error');
        }

        function cmdFlush() {
            if (customRules.length === 0) { engine.printLine('No custom rules to flush.', 'system'); return; }
            var count = customRules.length;
            customRules = [];
            engine.getState().attackerBlocked = false;
            engine.getState().webAllowed = false;
            engine.printLine('Flushed ' + count + ' custom rule(s). Reverting to defaults.', 'warning');
            engine.printLine('WARNING: Attacker 203.0.113.66 is no longer blocked.', 'error');
            engine.checkObjectives();
            engine.updateGrid();
            engine.saveState();
        }

        function cmdScan() {
            var state = engine.getState();
            var col = state.position.col, row = state.position.row;
            var cellType = config.grid.cells[row][col];
            engine.printLine('Scanning area...', 'system');
            engine.printLine('', 'system');
            if (cellType !== 'empty' && cellType !== 'wall') {
                var cur = config.nodes[cellType];
                engine.printLine('Current: ' + cur.label + ' (' + cur.ip + ')', 'heading');
                engine.printLine(cur.desc, 'info');
                engine.printLine('OS: ' + cur.os, 'node-info');
            } else { engine.printLine('Current: Clear path', 'heading'); }
            engine.printLine('', 'system');
            engine.printLine('Adjacent:', 'heading');
            var dirs = [{ name: 'North', dc: 0, dr: -1 }, { name: 'South', dc: 0, dr: 1 }, { name: 'East', dc: 1, dr: 0 }, { name: 'West', dc: -1, dr: 0 }];
            dirs.forEach(function(d) {
                var nc = col + d.dc, nr = row + d.dr;
                if (nc < 0 || nc >= config.grid.cols || nr < 0 || nr >= config.grid.rows) { engine.printLine('  ' + d.name + ': [network edge]', 'system'); return; }
                var type = config.grid.cells[nr][nc];
                if (type === 'wall') { engine.printLine('  ' + d.name + ': [blocked]', 'system'); return; }
                var key = nc + ',' + nr;
                if (!state.visibility[key] || state.visibility[key] === 'hidden') state.visibility[key] = 'revealed';
                if (type === 'empty') { engine.printLine('  ' + d.name + ': Clear path', 'info'); }
                else { var info = config.nodes[type]; engine.printLine('  ' + d.name + ': ' + info.label + ' (' + info.ip + ')', 'node-info'); }
            });
            engine.updateGrid();
            engine.saveState();
        }

        function cmdMove(args) {
            if (!args.length) { engine.printLine('Usage: move <direction>', 'error'); return; }
            var dirMap = { 'north': [0,-1], 'n': [0,-1], 'south': [0,1], 's': [0,1], 'east': [1,0], 'e': [1,0], 'west': [-1,0], 'w': [-1,0] };
            var dir = args[0].toLowerCase();
            if (!dirMap[dir]) { engine.printLine('Unknown direction: ' + args[0], 'error'); return; }
            var state = engine.getState();
            var d = dirMap[dir];
            var newCol = state.position.col + d[0], newRow = state.position.row + d[1];
            if (newCol < 0 || newCol >= config.grid.cols || newRow < 0 || newRow >= config.grid.rows) { engine.printLine('Edge of network.', 'error'); return; }
            var cellType = config.grid.cells[newRow][newCol];
            if (cellType === 'wall') { engine.printLine('Blocked.', 'error'); return; }
            state.position = { col: newCol, row: newRow };
            state.visibility[newCol + ',' + newRow] = 'visited';
            if (cellType !== 'empty') state.nodesDiscovered.add(cellType);
            engine.revealAdjacent(newCol, newRow);
            var dirFull = { n: 'north', s: 'south', e: 'east', w: 'west' };
            var dirName = dirFull[dir] || dir;
            if (cellType === 'empty') { engine.printLine('Moving ' + dirName + '... Clear path.', 'system'); }
            else { var info = config.nodes[cellType]; engine.printLine('Moving ' + dirName + '... ' + info.label + ' (' + info.ip + ')', 'success'); engine.printLine(info.desc, 'info'); }
            engine.checkObjectives();
            engine.updateGrid();
            engine.saveState();
        }

        function cmdStatus() {
            var state = engine.getState();
            var cellType = config.grid.cells[state.position.row][state.position.col];
            var posLabel = (cellType !== 'empty' && cellType !== 'wall') ? config.nodes[cellType].label : 'Clear';
            engine.printLine('', 'system');
            engine.printLine('\u2550\u2550\u2550 STATUS \u2550\u2550\u2550', 'heading');
            engine.printLine('Position: (' + state.position.col + ',' + state.position.row + ') \u2014 ' + posLabel, 'info');
            engine.printLine('Nodes discovered: ' + state.nodesDiscovered.size + ' / 8', 'info');
            engine.printLine('Attacker (203.0.113.66): ' + (state.attackerBlocked ? 'BLOCKED' : 'ACTIVE'), state.attackerBlocked ? 'success' : 'warning');
            engine.printLine('', 'system');
            engine.printLine('Objectives:', 'heading');
            var objText = ['Check IDS alerts', 'Block attacker IP (203.0.113.66)', 'Allow web traffic to DMZ (172.16.0.10)', 'Verify DB unreachable from WAN (port 3306)'];
            state.objectives.forEach(function(done, i) { engine.printLine((done ? ' [X] ' : ' [ ] ') + objText[i], done ? 'success' : 'system'); });
        }

        // ---- Terminal command dispatch ----
        engine.terminal.onCommand(function(cmd) {
            var state = engine.getState();
            state.agentCmdCount++;
            var parts = cmd.trim().split(/\s+/);
            var action = parts[0].toLowerCase();
            var args = parts.slice(1);

            switch (action) {
                case 'scan':   cmdScan(); break;
                case 'move':   cmdMove(args); break;
                case 'status': cmdStatus(); break;
                case 'rules':  cmdRules(); break;
                case 'block':  cmdBlock(args); break;
                case 'allow':  cmdAllow(args); break;
                case 'test':   cmdTest(args); break;
                case 'ids':    cmdIds(); break;
                case 'flush':  cmdFlush(); break;
                case 'help':   cmdHelp(); break;
                case 'clear':  engine.terminal.clearOutput(); break;
                default:
                    engine.printLine('Unknown command: ' + action, 'error');
                    engine.printLine('Type "help" for available commands.', 'system');
            }
        });
    })();
    </script>
</body>
</html>
