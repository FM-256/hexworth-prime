<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFI-OP-01: The Patrol | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <!-- Progress tracking bridge: records Operator completion in ModuleProgress -->
    <script src="../../components/FirebaseAuth.js"></script>
    <script src="../../components/ModuleProgress.js"></script>
</head>
<body>
<h1 class="visually-hidden">PFI-OP-01: The Patrol</h1>
    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/OperatorInterpreter.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/pfi-op-01.config.js"></script>
    <script>
    /* PFI-OP-01: The Patrol — 6x6 grid with 4 corner servers.
       Forces students to define a patrol() function and call it 4 times.
       Manual approach = 36+ lines. Function approach = ~10 lines.
       The repetition IS the lesson: DRY = define once, call many. */
    (function() {
        var engine = OperatorEngine.init(PFI_OP_01_CONFIG);
        var agent  = AgentBridge.create(engine);

        engine.editor.onRun(function() {
            var code = engine.editor.getCode();
            engine.editor.clearOutput();
            OperatorInterpreter.reset();
            OperatorInterpreter.run(code, agent, engine.printLine)
                .then(function(result) {
                    if (result.error) {
                        engine.printLine('Error: ' + result.error, 'error');
                    } else {
                        engine.printLine('Program complete. ' + result.cmdCount + ' agent commands executed.', 'system');
                    }
                });
        });

        engine.editor.onStop(function() {
            OperatorInterpreter.cancel();
        });
    })();

    // Bridge: when OperatorEngine marks completion in localStorage,
    // also record it in ModuleProgress so the PFI course hub sees it.
    // Polls the completion key because OperatorEngine doesn't emit an event.
    (function() {
        var MISSION_ID = 'pfi-op-01';
        var HOUSE_ID = 'code';
        // The engine writes config.completion.storageKey, which is UNDERSCORED
        // (see configs/pfi-op-01.config.js). Building the key from the dashed
        // MISSION_ID meant this bridge polled a key nothing ever wrote, so PFI
        // students got no course credit (BUG-039). Hardcoded to match the config:
        // the other operator missions use unrelated shapes (crypto01, ir01), so a
        // mechanical dash-to-underscore rule must NOT be generalised beyond pfi-op.
        var COMP_KEY = 'hexworth_operator_pfi_op_01';
        var bridged = false;

        function tryBridge() {
            if (bridged) return;
            var saved = localStorage.getItem(COMP_KEY);
            if (saved && typeof window.ModuleProgress !== 'undefined') {
                try {
                    var data = JSON.parse(saved);
                    if (data && !bridged) {
                        bridged = true;
                        window.ModuleProgress.complete(HOUSE_ID, MISSION_ID);
                    }
                } catch (e) {}
            }
        }

        // Check on load (for returning students) + poll during mission
        tryBridge();
        var poll = setInterval(function() {
            tryBridge();
            if (bridged) clearInterval(poll);
        }, 2000);
        // Stop polling after 30 minutes
        setTimeout(function() { clearInterval(poll); }, 1800000);
    })();
    </script>
</body>
</html>
