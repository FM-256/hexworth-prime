<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IR-02: Ransomware Dawn | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <style>
        .editor-panel { background: #080a0e; }
        .editor-area { display: none; }
        .editor-toolbar { display: none; }
        .output-console { flex: 1; }
        .term-input-row { display: flex; align-items: center; padding: 8px 14px; border-top: 1px solid rgba(57,255,20,0.1); background: #0a0c12; flex-shrink: 0; }
        .term-prompt-text { color: #39ff14; font-size: 0.78rem; white-space: nowrap; margin-right: 8px; font-family: var(--op-font); }
        .term-input { flex: 1; background: transparent; border: none; outline: none; color: #76ff03; font-family: var(--op-font); font-size: 0.78rem; caret-color: #39ff14; }
        .grid-cell[data-type="file-server"]:not(.vis-hidden):not(.wall) { border-left: 2px solid rgba(255,68,68,0.4); }
        .grid-cell[data-type="c2-server"]:not(.vis-hidden):not(.wall) { border-left: 2px solid rgba(255,100,100,0.4); }
        .grid-cell[data-type="patient-zero"]:not(.vis-hidden):not(.wall) { border-left: 2px solid rgba(255,215,0,0.4); }
    </style>
    <script src="../../components/ModuleProgress.js"></script>
</head>
<body>
    <div id="operator-root"></div>

    <script src="../engine/OperatorEngine.js"></script>
    <script src="../configs/incident-response-02.config.js"></script>
    <script>
    /* ================================================================
       IR-02: Ransomware Dawn -- Terminal Command Layer
       Custom state: fileServerIsolated, patientZeroIdentified,
                     backupVerified, c2Blocked, infectionChain.
       Commands: scan, move, isolate, analyze, restore, trace,
                 contain, status, help, clear.
       ================================================================ */
    (function() {
        var config = IR_02_CONFIG;
        var engine = OperatorEngine.init(config);
        var state  = engine.getState();

        // Initialize custom state
        state.fileServerIsolated = false;
        state.patientZeroIdentified = false;
        state.backupVerified = false;
        state.c2Blocked = false;
        state.infectionChain = [];

        // Replace editor panel with terminal
        var editorPanel = document.querySelector('.editor-panel');
        editorPanel.innerHTML = '';
        var termBar = document.createElement('div');
        termBar.style.cssText = 'padding:7px 14px;background:#0c0e14;border-bottom:1px solid rgba(57,255,20,0.1);display:flex;align-items:center;gap:6px;flex-shrink:0;';
        for (var i = 0; i < 3; i++) { var dot = document.createElement('div'); dot.style.cssText = 'width:7px;height:7px;border-radius:50%;background:rgba(57,255,20,0.3);'; termBar.appendChild(dot); }
        var barLabel = document.createElement('span'); barLabel.style.cssText = 'font-size:0.55rem;color:rgba(57,255,20,0.35);letter-spacing:0.1em;margin-left:6px;'; barLabel.textContent = 'TERMINAL';
        termBar.appendChild(barLabel);
        editorPanel.appendChild(termBar);
        var outputConsole = document.querySelector('.output-console');
        editorPanel.appendChild(outputConsole);
        var inputRow = document.createElement('div'); inputRow.className = 'term-input-row';
        var promptSpan = document.createElement('span'); promptSpan.className = 'term-prompt-text'; promptSpan.textContent = config.promptText;
        var termInput = document.createElement('input'); termInput.type = 'text'; termInput.className = 'term-input'; termInput.autocomplete = 'off'; termInput.spellcheck = false;
        inputRow.appendChild(promptSpan); inputRow.appendChild(termInput);
        editorPanel.appendChild(inputRow);

        var history = []; var histIdx = -1;
        function curCell() { return config.grid.cells[state.position.row][state.position.col]; }

        // Helpers
        function isNearNode(nodeType) {
            var c = config;
            for (var r = 0; r < c.grid.rows; r++) {
                for (var col = 0; col < c.grid.cols; col++) {
                    if (c.grid.cells[r][col] !== nodeType) continue;
                    var dc = Math.abs(state.position.col - col), dr = Math.abs(state.position.row - r);
                    if ((dc === 0 && dr === 0) || (dc + dr === 1)) return true;
                }
            }
            return false;
        }
        function isOnNode(nodeType) { return curCell() === nodeType; }

        // --- Command Handlers ---

        function cmdScan() {
            var col = state.position.col, row = state.position.row, cellType = curCell();
            engine.printLine('Scanning area...', 'system'); engine.printLine('', 'system');
            if (cellType !== 'empty' && cellType !== 'wall') {
                var cur = config.nodes[cellType]; engine.printLine('Current: ' + cur.label + ' (' + cur.ip + ')', 'heading'); engine.printLine(cur.desc, 'info');
            } else engine.printLine('Current: Clear path (no node)', 'heading');
            engine.printLine('', 'system'); engine.printLine('Adjacent:', 'heading');
            var dirs = [{name:'North',dc:0,dr:-1},{name:'South',dc:0,dr:1},{name:'East',dc:1,dr:0},{name:'West',dc:-1,dr:0}];
            for (var i = 0; i < dirs.length; i++) {
                var d = dirs[i], nc = col + d.dc, nr = row + d.dr;
                if (nc < 0 || nc >= config.grid.cols || nr < 0 || nr >= config.grid.rows) { engine.printLine('  ' + d.name + ': [network edge]', 'system'); continue; }
                var type = config.grid.cells[nr][nc];
                if (type === 'wall') { engine.printLine('  ' + d.name + ': [blocked]', 'system'); continue; }
                var key = nc + ',' + nr;
                if (!state.visibility[key] || state.visibility[key] === 'hidden') state.visibility[key] = 'revealed';
                if (type === 'empty') engine.printLine('  ' + d.name + ': Clear path', 'info');
                else { var info = config.nodes[type]; engine.printLine('  ' + d.name + ': ' + info.label + ' (' + info.ip + ')', 'node-info'); }
            }
            engine.updateGrid(); engine.saveState();
        }

        function cmdMove(args) {
            if (!args.length) { engine.printLine('Usage: move <direction>', 'error'); return; }
            var dirMap = {'north':[0,-1],'n':[0,-1],'south':[0,1],'s':[0,1],'east':[1,0],'e':[1,0],'west':[-1,0],'w':[-1,0]};
            var dir = args[0].toLowerCase(); if (!dirMap[dir]) { engine.printLine('Unknown direction: ' + args[0], 'error'); return; }
            var d = dirMap[dir], nc = state.position.col + d[0], nr = state.position.row + d[1];
            if (nc < 0 || nc >= config.grid.cols || nr < 0 || nr >= config.grid.rows) { engine.printLine('Edge of network. Cannot move ' + dir + '.', 'error'); return; }
            var cellType = config.grid.cells[nr][nc];
            if (cellType === 'wall') { engine.printLine('Blocked. No traversable path ' + dir + '.', 'error'); return; }
            state.position = { col: nc, row: nr }; state.visibility[nc + ',' + nr] = 'visited';
            if (cellType !== 'empty') state.nodesDiscovered.add(cellType);
            engine.revealAdjacent(nc, nr);
            var dirName = {n:'north',s:'south',e:'east',w:'west'}[dir] || dir;
            if (cellType === 'empty') engine.printLine('Moving ' + dirName + '... Clear path.', 'system');
            else { var info = config.nodes[cellType]; engine.printLine('Moving ' + dirName + '... ' + info.label + ' (' + info.ip + ')', 'success'); engine.printLine(info.desc, 'info'); }
            engine.checkObjectives(); engine.updateGrid(); engine.saveState();
        }

        function cmdIsolate(args) {
            if (!args.length) { engine.printLine('Usage: isolate <node>', 'error'); return; }
            var target = args.join(' '), node = engine.resolveNode(target);
            if (!node) { engine.printLine('isolate: unknown node: ' + target, 'error'); return; }
            var dc = Math.abs(state.position.col - node.col), dr = Math.abs(state.position.row - node.row);
            var inRange = (dc === 0 && dr === 0) || (dc + dr === 1);
            if (!inRange) {
                engine.printLine('isolate: must be adjacent to or on ' + node.info.label + '.', 'error');
                engine.printLine('Navigate closer to the target node first.', 'system');
                return;
            }
            switch (node.type) {
                case 'file-server':
                    if (state.fileServerIsolated) { engine.printLine('FILE-SERVER is already isolated from the network.', 'warning'); }
                    else {
                        engine.printLine('Isolating FILE-SERVER from network...', 'system');
                        engine.printLine('SMB connections severed. Port 445 blocked at switch level.', 'info');
                        engine.printLine('NetBIOS traffic dropped. Port 139 null-routed.', 'info');
                        engine.printLine('Encryption halted. No new files are being affected.', 'success');
                        state.fileServerIsolated = true;
                        engine.checkObjectives();
                    }
                    break;
                case 'workstation-a':
                    engine.printLine('Isolating WORKSTATION-A from network...', 'system');
                    engine.printLine('RDP session terminated. SMB access revoked.', 'info');
                    engine.printLine('Finance workstation quarantined.', 'info');
                    break;
                case 'workstation-b':
                    engine.printLine('Isolating WORKSTATION-B from network...', 'system');
                    engine.printLine('RDP session terminated. SMB access revoked.', 'info');
                    engine.printLine('HR workstation quarantined. Encrypted files preserved for forensics.', 'info');
                    break;
                case 'patient-zero':
                    engine.printLine('Isolating PATIENT-ZERO from network...', 'system');
                    engine.printLine('All connections severed. Backdoor port 4444 blocked.', 'info');
                    engine.printLine('Machine quarantined for forensic analysis.', 'info');
                    break;
                case 'ad-controller':
                    engine.printLine('[!] WARNING: Isolating AD-CONTROLLER will disrupt domain auth.', 'warning');
                    engine.printLine('Recommend targeted firewall rules instead of full isolation.', 'warning');
                    engine.printLine('No action taken. Specify a different target.', 'system');
                    break;
                default:
                    engine.printLine('isolate: ' + node.info.label + ' is not a valid isolation target.', 'error');
            }
            engine.saveState();
        }

        function cmdAnalyze(args) {
            if (!args.length) { engine.printLine('Usage: analyze <node>', 'error'); return; }
            var target = args.join(' '), node = engine.resolveNode(target);
            if (!node) { engine.printLine('analyze: unknown node: ' + target, 'error'); return; }
            if (!isOnNode(node.type)) {
                engine.printLine('analyze: must be ON ' + node.info.label + ' to run deep analysis.', 'error');
                engine.printLine('Current position: (' + state.position.col + ',' + state.position.row + ')', 'system');
                return;
            }
            engine.printLine('', 'system');
            engine.printLine('Running deep analysis on ' + node.info.label + '...', 'system');
            engine.printLine('', 'system');

            switch (node.type) {
                case 'patient-zero':
                    engine.printLine('HOST: ' + node.info.label + ' (' + node.info.ip + ')', 'heading');
                    engine.printLine('OS: ' + node.info.os, 'node-info');
                    engine.printLine('', 'system');
                    engine.printLine('INFECTION TIMELINE:', 'heading');
                    engine.printLine('  03/04 14:22  Phishing email received from: billing@corp-invoices.ru', 'warning');
                    engine.printLine('  03/04 14:24  Macro-enabled document opened: invoice_march.xlsm', 'warning');
                    engine.printLine('  03/04 14:24  Dropper executed: CryptoLock v3.1 payload deployed', 'warning');
                    engine.printLine('  03/04 14:25  C2 beacon established: 185.147.xx.xx:8443 (TLS)', 'warning');
                    engine.printLine('  03/04 14:38  Lateral movement via SMB to FILE-SERVER (10.1.0.10)', 'warning');
                    engine.printLine('  03/04 14:45  Lateral movement via SMB to WORKSTATION-A (10.1.1.50)', 'warning');
                    engine.printLine('  03/04 15:02  Lateral movement via SMB to WORKSTATION-B (10.1.1.60)', 'warning');
                    engine.printLine('', 'system');
                    engine.printLine('MALWARE DETAILS:', 'heading');
                    engine.printLine('  Family:    CryptoLock v3.1 (Ransomware-as-a-Service)', 'node-info');
                    engine.printLine('  Ransom:    $250,000 BTC to wallet 1A9fBm...kR3', 'node-info');
                    engine.printLine('  Extension: .cl0ck appended to encrypted files', 'node-info');
                    engine.printLine('  Exclusions: C:\\Windows\\, C:\\Program Files\\', 'node-info');
                    engine.printLine('', 'system');
                    engine.printLine('[!] Patient zero identified. Infection vector confirmed.', 'success');
                    state.patientZeroIdentified = true;
                    engine.checkObjectives();
                    break;
                case 'file-server':
                    engine.printLine('HOST: ' + node.info.label + ' (' + node.info.ip + ')', 'heading');
                    engine.printLine('OS: ' + node.info.os, 'node-info');
                    engine.printLine('', 'system');
                    engine.printLine('STATUS:', 'heading');
                    if (state.fileServerIsolated) {
                        engine.printLine('  Network: ISOLATED -- no active connections', 'success');
                        engine.printLine('  Encryption: HALTED', 'success');
                    } else {
                        engine.printLine('  Network: ACTIVE -- SMB sessions in progress', 'warning');
                        engine.printLine('  Encryption: ACTIVE -- files being encrypted', 'warning');
                    }
                    engine.printLine('  Shares: \\\\FSV\\finance, \\\\FSV\\shared, \\\\FSV\\archive', 'info');
                    engine.printLine('  Encrypted files: ~14,800 (est.)', 'warning');
                    engine.printLine('  Extension: .cl0ck', 'warning');
                    break;
                case 'email-gateway':
                    engine.printLine('HOST: ' + node.info.label + ' (' + node.info.ip + ')', 'heading');
                    engine.printLine('OS: ' + node.info.os, 'node-info');
                    engine.printLine('', 'system');
                    engine.printLine('INBOUND LOG (last 24h):', 'heading');
                    engine.printLine('  Delivered:  12,847 messages', 'info');
                    engine.printLine('  Quarantine:     231 messages', 'info');
                    engine.printLine('  [!] MISSED:       1 message -- macro-enabled attachment bypassed sandbox', 'warning');
                    engine.printLine('  Subject: "March Invoice - Action Required"', 'warning');
                    engine.printLine('  From:    billing@corp-invoices.ru', 'warning');
                    engine.printLine('  Attachment: invoice_march.xlsm (macro-enabled Excel)', 'warning');
                    break;
                case 'ad-controller':
                    engine.printLine('HOST: ' + node.info.label + ' (' + node.info.ip + ')', 'heading');
                    engine.printLine('OS: ' + node.info.os, 'node-info');
                    engine.printLine('', 'system');
                    engine.printLine('ACTIVE DIRECTORY STATUS:', 'heading');
                    engine.printLine('  Domain: corp.internal', 'info');
                    engine.printLine('  Users: 347 active accounts', 'info');
                    engine.printLine('  [!] Suspicious Kerberoasting attempt detected at 14:30', 'warning');
                    engine.printLine('  [!] Service account "svc_backup" queried from 10.1.1.25', 'warning');
                    engine.printLine('  Recommend: reset svc_backup credentials immediately.', 'warning');
                    break;
                case 'backup-vault':
                    engine.printLine('HOST: ' + node.info.label + ' (' + node.info.ip + ')', 'heading');
                    engine.printLine('OS: ' + node.info.os, 'node-info');
                    engine.printLine('', 'system');
                    engine.printLine('BACKUP STATUS:', 'heading');
                    engine.printLine('  Last full backup:  03/04 02:00 (pre-infection)', 'info');
                    engine.printLine('  Incremental:       03/04 14:00 (may contain encrypted files)', 'warning');
                    engine.printLine('  Use "restore" to verify backup integrity.', 'system');
                    break;
                case 'c2-server':
                    engine.printLine('HOST: ' + node.info.label + ' (' + node.info.ip + ')', 'heading');
                    engine.printLine('OS: ' + node.info.os, 'node-info');
                    engine.printLine('', 'system');
                    engine.printLine('EXTERNAL HOST ANALYSIS:', 'heading');
                    engine.printLine('  IP: 185.147.xx.xx -- registered in: RU / AS9123', 'warning');
                    engine.printLine('  Beacon protocol: HTTPS/TLS (port 8443)', 'warning');
                    engine.printLine('  Heartbeat interval: 60 seconds', 'warning');
                    engine.printLine('  Threat intel: Known CryptoLock C2 infrastructure', 'warning');
                    if (state.c2Blocked) engine.printLine('  Status: BLOCKED -- firewall rule active', 'success');
                    else {
                        engine.printLine('  Status: ACTIVE -- beacon traffic flowing', 'warning');
                        engine.printLine('  Use "contain" to block C2 communication.', 'info');
                    }
                    break;
                default:
                    var nfo = node.info;
                    engine.printLine('HOST: ' + nfo.label + ' (' + nfo.ip + ')', 'heading');
                    engine.printLine('OS: ' + nfo.os, 'node-info');
                    engine.printLine('Desc: ' + nfo.desc, 'info');
                    engine.printLine('Open ports:', 'heading');
                    for (var p = 0; p < nfo.ports.length; p++) engine.printLine('  ' + nfo.ports[p], 'node-info');
            }
            engine.printLine('', 'system');
            engine.saveState();
        }

        function cmdRestore() {
            if (!isOnNode('backup-vault')) {
                engine.printLine('restore: must be at BACKUP-VAULT node.', 'error');
                engine.printLine('Navigate to BACKUP-VAULT (BKV) and run restore again.', 'system');
                return;
            }
            if (state.backupVerified) { engine.printLine('Backup integrity already verified. CLEAN restore point confirmed.', 'success'); return; }
            engine.printLine('', 'system');
            engine.printLine('Verifying backup integrity...', 'system');
            engine.printLine('Connecting to Veeam repository at 10.1.0.200:9392...', 'system');
            engine.printLine('', 'system');
            engine.printLine('BACKUP CATALOG:', 'heading');
            engine.printLine('  Full backup    03/04 02:00  Size: 2.3 TB  Status: CLEAN', 'success');
            engine.printLine('  Incremental    03/04 14:00  Size: 47 GB   Status: SUSPECT (post-infection window)', 'warning');
            engine.printLine('', 'system');
            engine.printLine('Running SHA-256 integrity check on full backup...', 'system');
            engine.printLine('  Checking: \\\\FSV\\finance     [OK]', 'info');
            engine.printLine('  Checking: \\\\FSV\\shared      [OK]', 'info');
            engine.printLine('  Checking: \\\\FSV\\archive     [OK]', 'info');
            engine.printLine('', 'system');
            engine.printLine('BACKUP VERIFIED. Clean restore point confirmed: 03/04 02:00.', 'success');
            engine.printLine('Ready for restoration when containment is complete.', 'info');
            state.backupVerified = true;
            engine.checkObjectives(); engine.saveState();
        }

        function cmdTrace(args) {
            if (!state.patientZeroIdentified) {
                engine.printLine('trace: cannot trace infection chain.', 'error');
                engine.printLine('Identify patient zero first (analyze patient-zero).', 'system');
                return;
            }
            engine.printLine('', 'system');
            engine.printLine('Tracing infection chain...', 'system');
            engine.printLine('', 'system');
            engine.printLine('INFECTION PROPAGATION:', 'heading');
            engine.printLine('  PZ0  (10.1.1.25)  14:22  Initial compromise via phishing email', 'warning');
            engine.printLine('   |', 'system');
            engine.printLine('   +-> FSV  (10.1.0.10)  14:38  Lateral: SMB share enumeration + credential reuse', 'warning');
            engine.printLine('   |', 'system');
            engine.printLine('   +-> WKA  (10.1.1.50)  14:45  Lateral: SMB from finance share mount', 'warning');
            engine.printLine('   |', 'system');
            engine.printLine('   +-> WKB  (10.1.1.60)  15:02  Lateral: SMB from shared drive access', 'warning');
            engine.printLine('', 'system');
            engine.printLine('TIMELINE SUMMARY:', 'heading');
            engine.printLine('  Duration from initial compromise to full spread: 40 minutes', 'node-info');
            engine.printLine('  Total affected hosts: 4', 'node-info');
            engine.printLine('  C2 active since: 14:25 (185.147.xx.xx:8443)', 'node-info');
            engine.printLine('', 'system');
            if (state.infectionChain.length === 0) state.infectionChain = ['PZ0', 'FSV', 'WKA', 'WKB'];
            engine.saveState();
        }

        function cmdContain() {
            if (!isNearNode('c2-server')) {
                engine.printLine('contain: must be near C2-SERVER node.', 'error');
                engine.printLine('Navigate to or adjacent to C2-SERVER and run contain again.', 'system');
                return;
            }
            if (state.c2Blocked) { engine.printLine('C2 communication is already blocked. Firewall rule active.', 'success'); return; }
            engine.printLine('', 'system');
            engine.printLine('Deploying firewall rule...', 'system');
            engine.printLine('  BLOCK outbound 185.147.xx.xx ANY (all ports)', 'info');
            engine.printLine('  BLOCK inbound  185.147.xx.xx ANY (all ports)', 'info');
            engine.printLine('  Applying to: edge firewall, all VLANs', 'info');
            engine.printLine('', 'system');
            engine.printLine('Monitoring beacon traffic...', 'system');
            engine.printLine('  08:443 heartbeat -- DROPPED', 'info');
            engine.printLine('  08:443 heartbeat -- DROPPED', 'info');
            engine.printLine('  08:443 heartbeat -- DROPPED', 'info');
            engine.printLine('', 'system');
            engine.printLine('C2 beacon silenced. Ransomware cut off from command server.', 'success');
            engine.printLine('Decryption key delivery blocked. Attacker cannot issue new commands.', 'success');
            state.c2Blocked = true;
            engine.checkObjectives();
            engine.printLine('', 'system');
            engine.saveState();
        }

        function cmdStatus() {
            var cellType = curCell();
            var posLabel = (cellType !== 'empty' && cellType !== 'wall') ? config.nodes[cellType].label : 'Clear';
            engine.printLine('', 'system'); engine.printLine('\u2550\u2550\u2550 INCIDENT RESPONSE STATUS \u2550\u2550\u2550', 'heading');
            engine.printLine('Position: (' + state.position.col + ',' + state.position.row + ') -- ' + posLabel, 'info');
            engine.printLine('Nodes mapped: ' + state.nodesDiscovered.size + ' / 8', 'info');
            engine.printLine('Commands issued: ' + state.agentCmdCount, 'info');
            engine.printLine('', 'system');
            engine.printLine('CONTAINMENT:', 'heading');
            engine.printLine('  File server isolated:  ' + (state.fileServerIsolated ? 'YES -- encryption halted' : 'NO -- still encrypting'), state.fileServerIsolated ? 'success' : 'warning');
            engine.printLine('  Patient zero ID\'d:     ' + (state.patientZeroIdentified ? 'YES -- CryptoLock v3.1 via phishing' : 'NO -- run analyze on patient-zero'), state.patientZeroIdentified ? 'success' : 'warning');
            engine.printLine('  Backup verified:       ' + (state.backupVerified ? 'YES -- 03/04 02:00 clean restore point' : 'NO -- go to BACKUP-VAULT'), state.backupVerified ? 'success' : 'warning');
            engine.printLine('  C2 blocked:            ' + (state.c2Blocked ? 'YES -- beacon severed' : 'NO -- beacon active to 185.147.xx.xx'), state.c2Blocked ? 'success' : 'warning');
            engine.printLine('', 'system');
            engine.printLine('Objectives:', 'heading');
            var objText = ['Isolate the file server', 'Identify patient zero', 'Verify backup integrity', 'Block C2 communication'];
            for (var j = 0; j < config.objectives.length; j++) {
                var done = state.objectives[j];
                engine.printLine((done ? ' [X] ' : ' [ ] ') + objText[j], done ? 'success' : 'system');
            }
        }

        function cmdHelp() {
            engine.printLine('', 'system'); engine.printLine('\u2550\u2550\u2550 COMMAND REFERENCE \u2550\u2550\u2550', 'heading');
            engine.printLine('  scan              Survey area, reveal adjacent nodes', 'info');
            engine.printLine('  move <dir>        Move agent (north/south/east/west or n/s/e/w)', 'info');
            engine.printLine('  isolate <node>    Isolate a node from the network', 'info');
            engine.printLine('  analyze <node>    Deep investigation of current node', 'info');
            engine.printLine('  restore           Verify backup integrity (must be at BACKUP-VAULT)', 'info');
            engine.printLine('  trace <node>      Trace infection chain (requires patient zero ID)', 'info');
            engine.printLine('  contain           Block C2 communication (must be near C2-SERVER)', 'info');
            engine.printLine('  status            Show position and incident response status', 'info');
            engine.printLine('  help              Show this reference', 'info');
            engine.printLine('  clear             Clear terminal output', 'info');
            engine.printLine('', 'system');
            engine.printLine('Nodes: reference by name, abbreviation, or IP.', 'system');
            engine.printLine('Examples: isolate file-server, analyze patient-zero, move east', 'system');
        }

        function executeCommand(input) {
            state.agentCmdCount++;
            engine.printLine(config.promptText + input, 'prompt-echo');
            var parts = input.trim().split(/\s+/), cmd = parts[0].toLowerCase(), args = parts.slice(1);
            switch (cmd) {
                case 'scan':     cmdScan(); break;
                case 'move':     cmdMove(args); break;
                case 'isolate':  cmdIsolate(args); break;
                case 'analyze':  cmdAnalyze(args); break;
                case 'restore':  cmdRestore(); break;
                case 'trace':    cmdTrace(args); break;
                case 'contain':  cmdContain(); break;
                case 'status':   cmdStatus(); break;
                case 'help':     cmdHelp(); break;
                case 'clear':    outputConsole.innerHTML = ''; break;
                default:
                    engine.printLine('Unknown command: ' + cmd, 'error');
                    engine.printLine('Type "help" for available commands.', 'system');
            }
        }

        termInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { var cmd = this.value.trim(); if (cmd) { history.push(cmd); histIdx = history.length; executeCommand(cmd); } this.value = ''; }
            else if (e.key === 'ArrowUp') { e.preventDefault(); if (histIdx > 0) { histIdx--; this.value = history[histIdx]; } }
            else if (e.key === 'ArrowDown') { e.preventDefault(); if (histIdx < history.length - 1) { histIdx++; this.value = history[histIdx]; } else { histIdx = history.length; this.value = ''; } }
        });
        editorPanel.addEventListener('click', function(e) { if (e.target.tagName !== 'INPUT') termInput.focus(); });

        // Briefing
        engine.printLine('\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557', 'heading');

        engine.printLine('\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563', 'heading');
        for (var b = 0; b < config.briefing.length; b++) {
            engine.printLine('\u2551  ' + config.briefing[b] + Array(Math.max(1, 39 - config.briefing[b].length)).join(' ') + '\u2551', 'heading');
        }
        engine.printLine('\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D', 'heading');
        engine.printLine('', 'system');
        engine.printLine('[SYS] Responder online at FILE-SERVER (10.1.0.10)', 'success');
        engine.printLine('[SYS] WARNING: Active encryption in progress', 'warning');
        engine.printLine('[SYS] Type "help" for command reference', 'info');
        engine.printLine('[SYS] Type "scan" to survey the network', 'info');
        engine.printLine('', 'system');
        termInput.focus();
    })();
