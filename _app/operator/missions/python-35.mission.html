<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PYTHON-35: python-35 | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <script src="../../components/ModuleProgress.js"></script>
</head>
<body>
<h1 class="visually-hidden">PYTHON-35: python-35</h1>
    <div id="operator-root"></div>
    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/OperatorInterpreter.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/python-35.config.js"></script>
    <script>
    (function() {
        var engine = OperatorEngine.init(PYTHON_35_CONFIG);
        var agent  = AgentBridge.create(engine);
        engine.editor.onRun(function() {
            var code = engine.editor.getCode();
            engine.editor.clearOutput();
            OperatorInterpreter.reset();
            OperatorInterpreter.run(code, agent, engine.printLine)
                .then(function(result) {
                    if (result.error) engine.printLine('Error: ' + result.error, 'error');
                    else engine.printLine('Program complete. ' + result.cmdCount + ' agent commands executed.', 'system');
                });
        });
        engine.editor.onStop(function() { OperatorInterpreter.cancel(); });
    })();
    </script>
</body>
</html>
