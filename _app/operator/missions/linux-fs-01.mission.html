<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../components/AchievementManager.js"></script>
    <script src="../../components/ModuleProgress.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINUX-FS-01: Root Access | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <style>
        /* Terminal panel replaces the default editor panel */
        .editor-panel { display: none !important; }
        .term-panel {
            flex: 0 0 45%;
            display: flex;
            flex-direction: column;
            background: #080a0e;
            height: 100%;
        }
        .term-bar {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 14px; background: #0e1018;
            border-bottom: 1px solid rgba(57,255,20,0.1);
        }
        .term-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: rgba(57,255,20,0.3);
        }
        .term-bar-label {
            font-size: 0.55rem; letter-spacing: 0.12em;
            color: rgba(57,255,20,0.25); margin-left: 6px;
        }
        .term-output {
            flex: 1; overflow-y: auto; padding: 10px 14px;
            font-size: 0.72rem; line-height: 1.55;
        }
        .term-output::-webkit-scrollbar { width: 4px; }
        .term-output::-webkit-scrollbar-thumb { background: rgba(57,255,20,0.15); border-radius: 2px; }
        .term-input-row {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 14px; border-top: 1px solid rgba(57,255,20,0.1);
        }
        .term-prompt-text {
            color: rgba(57,255,20,0.5); font-size: 0.72rem;
            letter-spacing: 0.04em; white-space: nowrap;
        }
        .term-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #76ff03; font-family: 'Courier New', monospace;
            font-size: 0.72rem; caret-color: #39ff14;
        }
        .term-line { word-break: break-word; }
        .term-system  { color: rgba(57,255,20,0.3); }
        .term-info    { color: rgba(57,255,20,0.65); }
        .term-success { color: #39ff14; font-weight: 600; }
        .term-error   { color: #ff4444; }
        .term-warning { color: #ffaa00; }
        .term-node-info { color: #00ccff; }
        .term-heading { color: #39ff14; font-weight: 700; }
        .term-flag    { color: #ff44ff; font-weight: 700; }
        .term-prompt-echo { color: rgba(57,255,20,0.4); }
        @media (max-width: 768px) {
            .term-panel { flex: 1; }
        }
    </style>
</head>
<body>
    <div id="operator-root"></div>

    <!-- Terminal panel injected after engine builds its DOM -->
    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/linux-fs-01.config.js"></script>
    <script>
    (function() {
        var CONFIG = LINUX_FS_01_CONFIG;
        var engine = OperatorEngine.init(CONFIG);
        var state  = engine.getState();

        // --- Inject custom state fields ---
        if (!state.flagsFound)  state.flagsFound = new Set();
        if (!state.dirsVisited) state.dirsVisited = new Set();
        state.commandHistory = state.commandHistory || [];
        state.historyIndex   = -1;

        // --- Replace the editor panel with a terminal panel ---
        var editorPanel = document.querySelector('.editor-panel');
        if (editorPanel) editorPanel.style.display = 'none';

        var layout = document.querySelector('.mission-layout');
        var termPanel = document.createElement('div');
        termPanel.className = 'term-panel';
        termPanel.innerHTML =
            '<div class="term-bar">' +
                '<div class="term-dot"></div><div class="term-dot"></div><div class="term-dot"></div>' +
                '<span class="term-bar-label">OPERATOR TERMINAL</span>' +
            '</div>' +
            '<div class="term-output" id="term-output"></div>' +
            '<div class="term-input-row">' +
                '<span class="term-prompt-text">' + CONFIG.prompt + '</span>' +
                '<input type="text" class="term-input" id="term-input" autocomplete="off" spellcheck="false" autofocus>' +
            '</div>';
        layout.appendChild(termPanel);

        var termOutput = document.getElementById('term-output');
        var termInput  = document.getElementById('term-input');

        function printLine(text, type) {
            var line = document.createElement('div');
            line.className = 'term-line term-' + (type || 'system');
            line.textContent = text;
            termOutput.appendChild(line);
            while (termOutput.children.length > 200) termOutput.removeChild(termOutput.firstChild);
            termOutput.scrollTop = termOutput.scrollHeight;
        }

        function getCurrentCellType() {
            return CONFIG.grid.cells[state.position.row][state.position.col];
        }

        // --- Commands ---
        function cmdHelp() {
            printLine('', 'system');
            printLine('\u2550\u2550\u2550 COMMAND REFERENCE \u2550\u2550\u2550', 'heading');
            printLine('  scan            Survey area, reveal adjacent directories', 'info');
            printLine('  move <dir>      Move (north/south/east/west or n/s/e/w)', 'info');
            printLine('  ls              List contents of current directory', 'info');
            printLine('  cat <file>      Read a file in the current directory', 'info');
            printLine('  grep <pattern>  Search for pattern in current directory', 'info');
            printLine('  find <pattern>  Search visited directories for files', 'info');
            printLine('  pwd             Show current directory path', 'info');
            printLine('  ping <node>     Check a directory by name', 'info');
            printLine('  status          Show position and objectives', 'info');
            printLine('  help            Show this reference', 'info');
            printLine('  clear           Clear terminal output', 'info');
        }

        function cmdScan() {
            var col = state.position.col, row = state.position.row;
            var cellType = getCurrentCellType();
            printLine('Scanning area...', 'system');
            printLine('', 'system');
            if (cellType !== 'empty' && cellType !== 'wall') {
                var cur = CONFIG.nodes[cellType];
                printLine('Current: ' + cur.label + ' ' + cur.ip, 'heading');
                printLine(cur.desc, 'info');
                printLine('Permissions: ' + cur.os, 'node-info');
            } else {
                printLine('Current: Empty path (no directory)', 'heading');
            }
            printLine('', 'system');
            printLine('Adjacent:', 'heading');
            var dirs = [{name:'North',dc:0,dr:-1},{name:'South',dc:0,dr:1},{name:'East',dc:1,dr:0},{name:'West',dc:-1,dr:0}];
            for (var i = 0; i < dirs.length; i++) {
                var d = dirs[i], nc = col+d.dc, nr = row+d.dr;
                if (nc<0||nc>=CONFIG.grid.cols||nr<0||nr>=CONFIG.grid.rows) { printLine('  '+d.name+': [filesystem boundary]','system'); continue; }
                var type = CONFIG.grid.cells[nr][nc];
                if (type==='wall') { printLine('  '+d.name+': [inaccessible]','system'); continue; }
                var key = nc+','+nr;
                if (!state.visibility[key]||state.visibility[key]==='hidden') state.visibility[key]='revealed';
                if (type==='empty') { printLine('  '+d.name+': Empty path','info'); }
                else { var info=CONFIG.nodes[type]; printLine('  '+d.name+': '+info.label+' '+info.ip,'node-info'); }
            }
            engine.updateGrid();
            engine.saveState();
        }

        function cmdMove(args) {
            if (!args.length) { printLine('Usage: move <direction>','error'); return; }
            var dirMap = {'north':[0,-1],'n':[0,-1],'south':[0,1],'s':[0,1],'east':[1,0],'e':[1,0],'west':[-1,0],'w':[-1,0]};
            var dir = args[0].toLowerCase();
            if (!dirMap[dir]) { printLine('Unknown direction: '+args[0],'error'); return; }
            var d=dirMap[dir], newCol=state.position.col+d[0], newRow=state.position.row+d[1];
            if (newCol<0||newCol>=CONFIG.grid.cols||newRow<0||newRow>=CONFIG.grid.rows) { printLine('Filesystem boundary.','error'); return; }
            var cellType = CONFIG.grid.cells[newRow][newCol];
            if (cellType==='wall') { printLine('Inaccessible.','error'); return; }
            state.position = {col:newCol, row:newRow};
            state.visibility[newCol+','+newRow] = 'visited';
            if (cellType!=='empty') state.dirsVisited.add(cellType);
            engine.revealAdjacent(newCol,newRow);
            var dirFull={n:'north',s:'south',e:'east',w:'west'}, dirName=dirFull[dir]||dir;
            if (cellType==='empty') { printLine('cd '+dirName+'... Empty path.','system'); }
            else { var info=CONFIG.nodes[cellType]; printLine('cd '+dirName+'... '+info.label+' '+info.ip,'success'); printLine(info.desc,'info'); printLine('Permissions: '+info.os,'node-info'); }
            engine.updateGrid(); engine.saveState();
        }

        function cmdLs() {
            var cellType = getCurrentCellType();
            if (cellType==='empty'||cellType==='wall') { printLine('Not inside a directory.','error'); return; }
            var info = CONFIG.nodes[cellType];
            printLine(info.ports.join('  '), 'node-info');
        }

        function cmdCat(args) {
            if (!args.length) { printLine('Usage: cat <filename>','error'); return; }
            var filename = args[0], cellType = getCurrentCellType();
            if (cellType==='empty'||cellType==='wall') { printLine('cat: not inside a directory','error'); return; }
            var info = CONFIG.nodes[cellType];
            var files = CONFIG.fileContents[cellType];
            if (!files||!files[filename]) {
                var inPorts = info.ports.indexOf(filename) !== -1;
                printLine('cat: '+filename+': '+(inPorts?'unable to read':'No such file or directory'),'error');
                return;
            }
            var content = files[filename];
            if (info.hasFlag && filename === info.flagFile) {
                printLine(content, 'flag');
                if (!state.flagsFound.has(cellType)) {
                    state.flagsFound.add(cellType);
                    printLine('', 'system');
                    printLine('[!] FLAG CAPTURED', 'success');
                    engine.checkObjectives();
                }
            } else {
                var lines = content.split('\n');
                for (var i=0;i<lines.length;i++) printLine(lines[i],'node-info');
            }
            engine.saveState();
        }

        function cmdGrep(args) {
            if (!args.length) { printLine('Usage: grep <pattern>','error'); return; }
            var pattern = args.join(' ').toLowerCase();
            var cellType = getCurrentCellType();
            if (cellType==='empty'||cellType==='wall') { printLine('grep: not inside a directory','error'); return; }
            var files = CONFIG.fileContents[cellType];
            if (!files) { printLine('No files to search.','error'); return; }
            var found = 0;
            var fnames = Object.keys(files);
            for (var i=0;i<fnames.length;i++) {
                if (files[fnames[i]].toLowerCase().indexOf(pattern) !== -1) {
                    printLine(fnames[i]+': match found','node-info');
                    found++;
                }
            }
            if (!found) printLine('No matches for "'+pattern+'"','system');
        }

        function cmdFind(args) {
            if (!args.length) { printLine('Usage: find <pattern>','error'); return; }
            var pattern = args.join(' ').toLowerCase();
            var keys = Object.keys(CONFIG.fileContents);
            var found = 0;
            for (var k=0;k<keys.length;k++) {
                if (!state.dirsVisited.has(keys[k]) && keys[k] !== getCurrentCellType()) continue;
                var files = CONFIG.fileContents[keys[k]];
                var fnames = Object.keys(files);
                for (var f=0;f<fnames.length;f++) {
                    if (fnames[f].toLowerCase().indexOf(pattern) !== -1) {
                        printLine(CONFIG.nodes[keys[k]].label+'/'+fnames[f],'node-info');
                        found++;
                    }
                }
            }
            if (!found) printLine('No files matching "'+pattern+'" in visited directories.','system');
        }

        function cmdPwd() {
            var cellType = getCurrentCellType();
            if (cellType!=='empty'&&cellType!=='wall') printLine(CONFIG.nodes[cellType].label,'info');
            else printLine('(no named directory)','system');
        }

        function cmdStatus() {
            printLine('', 'system');
            printLine('[STATUS] Position: '+getCurrentCellType()+' ('+state.position.col+','+state.position.row+')','info');
            printLine('[STATUS] Dirs visited: '+state.dirsVisited.size,'info');
            printLine('[STATUS] Flags: '+state.flagsFound.size+'/4','info');
            printLine('[STATUS] Commands: '+state.commandCount,'info');
        }

        // --- Dispatch ---
        function dispatch(raw) {
            state.commandCount = (state.commandCount||0) + 1;
            var parts = raw.trim().split(/\s+/);
            var cmd   = parts[0].toLowerCase();
            var args  = parts.slice(1);

            printLine(CONFIG.prompt + ' ' + raw, 'prompt-echo');

            switch (cmd) {
                case 'help':   cmdHelp(); break;
                case 'scan':   cmdScan(); break;
                case 'move': case 'cd': cmdMove(args); break;
                case 'ls':     cmdLs(); break;
                case 'cat':    cmdCat(args); break;
                case 'grep':   cmdGrep(args); break;
                case 'find':   cmdFind(args); break;
                case 'pwd':    cmdPwd(); break;
                case 'status': cmdStatus(); break;
                case 'clear':  termOutput.innerHTML = ''; break;
                default:       printLine('Unknown command: '+cmd+'. Type "help".','error');
            }
        }

        // --- Wire terminal input ---
        termInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                var val = termInput.value.trim();
                if (!val) return;
                state.commandHistory.push(val);
                state.historyIndex = state.commandHistory.length;
                termInput.value = '';
                dispatch(val);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (state.historyIndex > 0) { state.historyIndex--; termInput.value = state.commandHistory[state.historyIndex]; }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (state.historyIndex < state.commandHistory.length - 1) { state.historyIndex++; termInput.value = state.commandHistory[state.historyIndex]; }
                else { state.historyIndex = state.commandHistory.length; termInput.value = ''; }
            }
        });

        // --- Boot message ---
        printLine('OPERATOR // LINUX-FS-01: ROOT ACCESS', 'heading');
        printLine('Navigate the filesystem. Find all 4 flags.', 'system');
        printLine('Type "help" for commands, "scan" to survey.', 'system');
        printLine('', 'system');
        termInput.focus();
    })();
    </script>
</body>
</html>
