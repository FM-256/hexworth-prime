        printLine('[STATUS] Objectives: ' + completedCount + '/' + STATE.objectives.length, completedCount === STATE.objectives.length ? 'success' : 'info');
        OBJ_LABELS.forEach(function(label, i) {
            var shortLabel = label.split(' \u2014 ')[0];
            printLine('[STATUS]   ' + (STATE.objectives[i] ? '\u2713' : '\u2717') + ' ' + shortLabel, STATE.objectives[i] ? 'success' : 'system');
        });
        await delay(50);
        return { position: posLabel, discovered: STATE.nodesDiscovered.size, objectives: completedCount + '/' + STATE.objectives.length };
    }
};

// Read-only properties on the agent bridge using getters
Object.defineProperty(AGENT_BRIDGE, 'position', {
    get: function() {
        var type = GRID_MAP[STATE.position.row][STATE.position.col];
        return (type !== 'empty' && type !== 'wall' && CELL_INFO[type])
            ? CELL_INFO[type].label.toLowerCase()
            : 'empty';
    }
});
Object.defineProperty(AGENT_BRIDGE, 'discovered', {
    get: function() { return Array.from(STATE.nodesDiscovered); }
});

/* ════════════════════════════════════════════════════════════
   EDITOR UI
   Handles line numbers, scroll sync, tab key, Ctrl+Enter
   shortcut, run/stop/clear controls, and the async
   run pipeline: tokenize → parse → interpret.
   ════════════════════════════════════════════════════════════ */

function updateLineNumbers() {
    var textarea = document.getElementById('code-input');
    var lineNums = document.getElementById('line-numbers');
    var lines    = textarea.value.split('\n');
    var nums     = '';
    for (var i = 1; i <= Math.max(lines.length, 1); i++) {
        nums += i + '\n';
    }
    lineNums.textContent = nums;
}

function syncScroll() {
    var textarea = document.getElementById('code-input');
    var lineNums = document.getElementById('line-numbers');
    lineNums.scrollTop = textarea.scrollTop;
}

async function runScript() {
    if (RUNNING) return;
    var code = document.getElementById('code-input').value;
    if (!code.trim()) return;

    RUNNING      = true;
    CANCEL_FLAG  = false;

    document.getElementById('btn-run').disabled       = true;
    document.getElementById('btn-stop').disabled      = false;
    document.getElementById('code-input').readOnly    = true;

    printLine('>>> Running...', 'system');

    try {
        var tokens   = tokenize(code);
        var ast      = parse(tokens);
        var cmdCount = await interpret(ast);
        printLine('[OK] Script complete. ' + (cmdCount || 0) + ' agent cmd(s) executed.', 'success');
    } catch (e) {
        if (e instanceof StopExecution) {
            printLine('[STOPPED] Execution halted by user.', 'warning');
        } else {
            printLine('[ERROR] ' + e.message, 'error');
        }
    }

    RUNNING = false;
    document.getElementById('btn-run').disabled    = false;
    document.getElementById('btn-stop').disabled   = true;
    document.getElementById('code-input').readOnly = false;
    document.getElementById('code-input').focus();
}

function stopScript() {
    CANCEL_FLAG = true;
}

function clearOutput() {
    document.getElementById('output-console').innerHTML = '';
}

function resetMission() {
    if (RUNNING) return;
    clearOutput();
    try { localStorage.removeItem('hexworth_operator_python04_save'); } catch (e) {}
    resetState();
    updateGrid();
    updateObjectivesUI();
    document.getElementById('header-status').textContent = 'IN PROGRESS';
    document.getElementById('header-status').style.color = '';
    document.getElementById('mission-complete').classList.remove('visible');
    showBriefing();
    printLine('[SYS] Mission reset. All progress cleared.', 'warning');
    printLine('', 'system');
}

function setupEditor() {
    var textarea = document.getElementById('code-input');

    textarea.addEventListener('keydown', function(e) {
        // Tab → insert 4 spaces (Python indentation)
        if (e.key === 'Tab') {
            e.preventDefault();
            var start = this.selectionStart;
            var end   = this.selectionEnd;
            this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 4;
            updateLineNumbers();
        }
        // Ctrl+Enter or Cmd+Enter → run script
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            runScript();
        }
    });

    textarea.addEventListener('input',  updateLineNumbers);
    textarea.addEventListener('scroll', syncScroll);

    updateLineNumbers();
}

function init() {
    buildGrid();
    setupEditor();

    var restored = loadState();
    if (restored && !STATE.completed) {
        showBriefing();
        printLine('[SYS] Session restored. Progress intact.', 'system');
        printLine('', 'system');
    } else {
        resetState();
        showBriefing();
    }

    updateGrid();
    updateObjectivesUI();
    document.getElementById('code-input').focus();
}

document.addEventListener('DOMContentLoaded', init);
