<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PYTHON-04: Ghost Protocol | Operator</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a0c10;
            color: rgba(255,255,255,0.85);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* CRT scanlines */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.1) 0px,
                rgba(0,0,0,0.1) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 9000;
        }

        /* ─── Header ─── */
        .mission-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #0e1018;
            border-bottom: 1px solid rgba(57, 255, 20, 0.15);
            height: 44px;
            flex-shrink: 0;
        }
        .mission-header-back {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            letter-spacing: 0.08em;
            transition: color 0.2s;
        }
        .mission-header-back:hover { color: #39ff14; }
        .mission-header-title {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: #39ff14;
            text-transform: uppercase;
            font-weight: 600;
        }
        .mission-header-status {
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            color: rgba(57, 255, 20, 0.4);
            text-transform: uppercase;
        }

        /* ─── Objectives Bar ─── */
        .obj-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 7px 20px;
            background: #0c0e14;
            border-bottom: 1px solid rgba(57, 255, 20, 0.1);
            overflow-x: auto;
            flex-shrink: 0;
        }
        .obj-label {
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            color: rgba(57, 255, 20, 0.3);
            text-transform: uppercase;
            white-space: nowrap;
            margin-right: 4px;
        }
        .obj-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.04em;
            white-space: nowrap;
            transition: color 0.3s;
        }
        .obj-item.complete { color: #39ff14; }
        .obj-check {
            width: 13px;
            height: 13px;
            border-radius: 3px;
            border: 1px solid rgba(57, 255, 20, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .obj-item.complete .obj-check {
            background: rgba(57, 255, 20, 0.15);
            border-color: #39ff14;
            color: #39ff14;
        }

        /* ─── Split Layout ─── */
        .mission-layout {
            display: flex;
            height: calc(100vh - 44px - 30px);
        }

        /* ─── Map Panel (left 55%) ─── */
        .map-panel {
            flex: 0 0 55%;
            position: relative;
            overflow: hidden;
            border-right: 1px solid rgba(57, 255, 20, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090b0f;
        }
        .map-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(57, 255, 20, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.015) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        /* ─── Grid ─── */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 4px;
            padding: 20px;
            width: 100%;
            height: 100%;
            max-width: 600px;
            max-height: 480px;
        }

        .grid-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(57, 255, 20, 0.06);
            border-radius: 4px;
            position: relative;
            transition: all 0.4s ease;
            min-height: 0;
            overflow: hidden;
        }

        /* Cell visibility states */
        .grid-cell.vis-hidden {
            background: rgba(57, 255, 20, 0.01);
            border-color: rgba(57, 255, 20, 0.04);
        }
        .grid-cell.vis-revealed {
            background: rgba(57, 255, 20, 0.05);
            border-color: rgba(57, 255, 20, 0.15);
        }
        .grid-cell.vis-visited {
            background: rgba(57, 255, 20, 0.09);
            border-color: rgba(57, 255, 20, 0.25);
        }
        .grid-cell.current {
            background: rgba(57, 255, 20, 0.14);
            border-color: #39ff14;
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.15), inset 0 0 8px rgba(57, 255, 20, 0.05);
        }
        .grid-cell.wall {
            background: rgba(255, 255, 255, 0.015);
            border-color: rgba(255, 255, 255, 0.03);
        }
        .grid-cell.empty-vis {
            background: rgba(57, 255, 20, 0.03);
        }

        /* EDR & domain controller accent */
        .grid-cell[data-type="edr"]:not(.vis-hidden):not(.wall) {
            border-left: 2px solid rgba(255, 68, 68, 0.4);
        }
        .grid-cell[data-type="edr"].bypassed:not(.vis-hidden) {
            border-left-color: rgba(57, 255, 20, 0.4);
        }
        .grid-cell[data-type="dc"]:not(.vis-hidden):not(.wall) {
            border-left: 2px solid rgba(255, 215, 0, 0.4);
        }
        /* C2 beacon accent */
        .grid-cell[data-type="c2-beacon"]:not(.vis-hidden):not(.wall) {
            border-left: 2px solid rgba(255,30,100,0.5);
        }
        .grid-cell[data-type="c2-beacon"].bypassed:not(.vis-hidden) {
            border-left-color: rgba(57, 255, 20, 0.4);
        }
        /* Honeypot accent */
        .grid-cell[data-type="honeypot"]:not(.vis-hidden):not(.wall) {
            border-left: 2px solid rgba(200,0,255,0.45);
        }
        .grid-cell[data-type="honeypot"].bypassed:not(.vis-hidden) {
            border-left-color: rgba(57, 255, 20, 0.4);
        }

        /* Cell content */
        .cell-icon {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            transition: color 0.3s;
        }
        .cell-label {
            font-size: 0.5rem;
            letter-spacing: 0.06em;
            margin-top: 2px;
            transition: color 0.3s;
            text-align: center;
        }
        .vis-hidden .cell-icon { color: rgba(255, 255, 255, 0.06); }
        .vis-hidden .cell-label { color: transparent; }
        .vis-revealed .cell-icon { color: rgba(57, 255, 20, 0.45); }
        .vis-revealed .cell-label { color: rgba(57, 255, 20, 0.2); }
        .vis-visited .cell-icon { color: rgba(57, 255, 20, 0.7); }
        .vis-visited .cell-label { color: rgba(57, 255, 20, 0.35); }
        .current .cell-icon { color: #39ff14; }
        .current .cell-label { color: rgba(57, 255, 20, 0.6); }
        .wall .cell-icon { color: rgba(255, 255, 255, 0.04); }
        .wall .cell-label { color: transparent; }

        /* Agent dot */
        .cell-agent {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #39ff14;
            position: absolute;
            bottom: 5px;
            right: 5px;
            animation: agentPulse 2s ease-in-out infinite;
            box-shadow: 0 0 6px rgba(57, 255, 20, 0.5);
        }
        @keyframes agentPulse {
            0%, 100% { box-shadow: 0 0 4px rgba(57, 255, 20, 0.3); transform: scale(1); }
            50% { box-shadow: 0 0 12px rgba(57, 255, 20, 0.7), 0 0 20px rgba(57, 255, 20, 0.15); transform: scale(1.15); }
        }

        /* Cell reveal animation */
        @keyframes cellReveal {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .grid-cell.just-revealed {
            animation: cellReveal 0.4s ease-out;
        }

        /* ─── Editor Panel (right 45%) ─── */
        .editor-panel {
            flex: 0 0 45%;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #080a0e;
        }

        /* Toolbar */
        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            background: #0c0e14;
            border-bottom: 1px solid rgba(57, 255, 20, 0.1);
            flex-shrink: 0;
        }
        .editor-btn {
            padding: 4px 14px;
            font-family: 'Courier New', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            border: 1px solid rgba(57, 255, 20, 0.25);
            border-radius: 3px;
            background: rgba(57, 255, 20, 0.08);
            color: #39ff14;
            cursor: pointer;
            transition: all 0.2s;
        }
        .editor-btn:hover {
            background: rgba(57, 255, 20, 0.18);
            border-color: #39ff14;
        }
        .editor-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .editor-btn.stop-btn {
            border-color: rgba(255, 68, 68, 0.4);
            color: #ff4444;
            background: rgba(255, 68, 68, 0.08);
        }
        .editor-btn.stop-btn:hover {
            background: rgba(255, 68, 68, 0.18);
            border-color: #ff4444;
        }
        .editor-btn.reset-btn {
            border-color: rgba(255, 170, 0, 0.4);
            color: #ffaa00;
            background: rgba(255, 170, 0, 0.08);
        }
        .editor-btn.reset-btn:hover {
            background: rgba(255, 170, 0, 0.18);
            border-color: #ffaa00;
        }
        .toolbar-spacer { flex: 1; }
        .toolbar-hint {
            font-size: 0.55rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.06em;
        }

        /* Code Editor Area */
        .editor-area {
            flex: 0 0 55%;
            display: flex;
            border-bottom: 1px solid rgba(57, 255, 20, 0.1);
            overflow: hidden;
        }
        .line-numbers {
            width: 36px;
            padding: 10px 4px 10px 8px;
            background: #0a0c12;
            border-right: 1px solid rgba(57, 255, 20, 0.08);
            font-size: 0.72rem;
            line-height: 1.55;
            color: rgba(57, 255, 20, 0.2);
            text-align: right;
            overflow: hidden;
            user-select: none;
            flex-shrink: 0;
            white-space: pre;
        }
        .code-input {
            flex: 1;
            padding: 10px 14px;
            background: transparent;
            border: none;
            outline: none;
            color: #76ff03;
            font-family: 'Courier New', monospace;
            font-size: 0.72rem;
            line-height: 1.55;
            resize: none;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
            overflow-y: auto;
            tab-size: 4;
            caret-color: #39ff14;
        }
        .code-input::placeholder {
            color: rgba(57, 255, 20, 0.15);
        }

        /* Output Console */
        .output-console {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
            font-size: 0.72rem;
            line-height: 1.55;
            min-height: 0;
        }
        .output-console::-webkit-scrollbar { width: 4px; }
        .output-console::-webkit-scrollbar-track { background: transparent; }
        .output-console::-webkit-scrollbar-thumb { background: rgba(57, 255, 20, 0.15); border-radius: 2px; }

        /* Output line types */
        .out-line { word-break: break-word; }
        .out-system { color: rgba(57, 255, 20, 0.3); }
        .out-info { color: rgba(57, 255, 20, 0.65); }
        .out-success { color: #39ff14; font-weight: 600; }
        .out-error { color: #ff4444; }
        .out-warning { color: #ffaa00; }
        .out-node-info { color: #00ccff; }
        .out-heading { color: #39ff14; font-weight: 700; }
        .out-print { color: rgba(255,255,255,0.7); }

        /* ─── Mission Complete Overlay ─── */
        .mission-complete {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 8000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s;
        }
        .mission-complete.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .mc-card {
            background: #0e1018;
            border: 1px solid rgba(57, 255, 20, 0.3);
            border-radius: 8px;
            padding: 36px 40px;
            text-align: center;
            max-width: 380px;
            width: 90%;
        }
        .mc-badge {
            font-size: 0.55rem;
            letter-spacing: 0.2em;
            color: rgba(57, 255, 20, 0.5);
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .mc-title {
            font-size: 1.3rem;
            color: #39ff14;
            letter-spacing: 0.2em;
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
        }
        .mc-subtitle {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.35);
            margin-bottom: 28px;
        }
        .mc-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        .mc-stat-value {
            font-size: 1.5rem;
            color: #39ff14;
            font-weight: 700;
        }
        .mc-stat-label {
            font-size: 0.55rem;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.08em;
            margin-top: 3px;
            text-transform: uppercase;
        }
        .mc-btn {
            display: inline-block;
            padding: 10px 28px;
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid rgba(57, 255, 20, 0.3);
            border-radius: 4px;
            color: #39ff14;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mc-btn:hover {
            background: rgba(57, 255, 20, 0.2);
            border-color: #39ff14;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.15);
        }

        /* ─── Mobile ─── */
        @media (max-width: 768px) {
            .mission-layout {
                flex-direction: column;
            }
            .map-panel {
                flex: 0 0 42%;
                border-right: none;
                border-bottom: 1px solid rgba(57, 255, 20, 0.1);
            }
            .editor-panel {
                flex: 1;
            }
            .obj-bar { gap: 10px; padding: 6px 12px; }
            .obj-item { font-size: 0.5rem; }
            .obj-label { font-size: 0.5rem; }
            .grid-container { padding: 10px; max-height: none; }
        }
        @media (max-width: 480px) {
            .mission-header { padding: 8px 12px; height: 38px; }
            .mission-header-title { font-size: 0.6rem; }
            .mission-layout { height: calc(100vh - 38px - 26px); }
            .cell-label { display: none; }
            .cell-icon { font-size: 0.7rem; }
            .cell-agent { width: 8px; height: 8px; bottom: 3px; right: 3px; }
            .mc-card { padding: 24px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="mission-header">
        <a href="../index.html" class="mission-header-back">&larr; OPERATOR</a>
        <div class="mission-header-title">PYTHON-04 / GHOST PROTOCOL</div>
        <div class="mission-header-status" id="header-status">IN PROGRESS</div>
    </div>

    <!-- Objectives bar -->
    <div class="obj-bar">
        <span class="obj-label">OBJ</span>
        <div class="obj-item" id="obj-0">
            <span class="obj-check"></span> Discover 4 nodes
        </div>
        <div class="obj-item" id="obj-1">
            <span class="obj-check"></span> Nmap a server
        </div>
        <div class="obj-item" id="obj-2">
            <span class="obj-check"></span> Bypass EDR
        </div>
        <div class="obj-item" id="obj-3">
            <span class="obj-check"></span> Reach domain controller
        </div>
        <div class="obj-item" id="obj-4">
            <span class="obj-check"></span> Silence C2 beacon
        </div>
    </div>

    <!-- Split layout -->
    <div class="mission-layout">
        <!-- Left: Network Map -->
        <div class="map-panel">
            <div class="grid-container" id="grid-container"></div>
        </div>

        <!-- Right: Python Editor -->
        <div class="editor-panel" id="editor-panel">
            <div class="editor-toolbar">
                <button class="editor-btn" id="btn-run" onclick="runScript()">&gt; RUN</button>
                <button class="editor-btn stop-btn" id="btn-stop" onclick="stopScript()" disabled>&#9632; STOP</button>
                <button class="editor-btn" id="btn-clear" onclick="clearOutput()">CLEAR OUT</button>
                <button class="editor-btn reset-btn" id="btn-reset" onclick="resetMission()">RESET</button>
                <div class="toolbar-spacer"></div>
                <span class="toolbar-hint">Ctrl+Enter = Run</span>
            </div>
            <div class="editor-area">
                <div class="line-numbers" id="line-numbers">1</div>
                <textarea class="code-input" id="code-input" spellcheck="false" placeholder="# Write Python here&#10;agent.scan()&#10;agent.move('east')" autofocus></textarea>
            </div>
            <div class="output-console" id="output-console"></div>
        </div>
    </div>

    <!-- Mission Complete Overlay -->
    <div class="mission-complete" id="mission-complete">
        <div class="mc-card">
            <div class="mc-badge">MISSION COMPLETE</div>
            <div class="mc-title">GHOST PROTOCOL</div>
            <div class="mc-subtitle">Domain compromised. Ghost in the machine.</div>
            <div class="mc-stats">
                <div>
                    <div class="mc-stat-value" id="stat-nodes">0</div>
                    <div class="mc-stat-label">Nodes</div>
                </div>
                <div>
                    <div class="mc-stat-value" id="stat-commands">0</div>
                    <div class="mc-stat-label">Agent Cmds</div>
                </div>
                <div>
                    <div class="mc-stat-value" id="stat-time">0s</div>
                    <div class="mc-stat-label">Time</div>
                </div>
            </div>
            <a href="../index.html" class="mc-btn">RETURN TO OPERATOR</a>
        </div>
    </div>

<script>
/* ═══════════════════════════════════════════════════════════
   PYTHON-04: Ghost Protocol — Mission Engine
   Python interpreter (lexer → parser → async interpreter)
   + Agent bridge for network recon game actions
   ═══════════════════════════════════════════════════════════ */

// ─── Grid Map ───
// Rows 0-3, Cols 0-4
var GRID_MAP = [
    ['beachhead', 'empty',      'mail-server', 'wall',        'wall'],
    ['empty',     'jump-box',   'c2-beacon',   'edr',         'dc'],
    ['wall',      'honeypot',   'file-server', 'empty',       'wall'],
    ['wall',      'printer',    'wall',        'workstation',  'wall']
];

var ROWS = 4;
var COLS = 5;

// ─── Cell Info ───
var CELL_INFO = {
    'beachhead':    { label: 'BEACHHEAD',     abbr: 'BHD', ip: '10.10.1.5',   desc: 'Initial access point in DMZ',          ports: ['22/SSH','80/HTTP','443/HTTPS'],                    os: 'Debian 12 Bookworm' },
    'mail-server':  { label: 'MAIL-SERVER',   abbr: 'MLS', ip: '10.10.1.20',  desc: 'Corporate mail exchange',              ports: ['25/SMTP','143/IMAP','993/IMAPS'],                 os: 'Exchange 2019 CU14' },
    'jump-box':     { label: 'JUMP-BOX',      abbr: 'JMP', ip: '10.10.1.30',  desc: 'Administrative jump host',             ports: ['22/SSH','3389/RDP'],                              os: 'Windows Server 2022' },
    'edr':          { label: 'EDR',           abbr: 'EDR', ip: '10.10.1.254', desc: 'Endpoint detection and response',       ports: ['443/HTTPS','8443/MGMT'],                          os: 'CrowdStrike Falcon 7.x' },
    'dc':           { label: 'DOMAIN-CTRL',   abbr: 'DC',  ip: '10.10.1.99',  desc: 'Active Directory domain controller',   ports: ['53/DNS','88/KERBEROS','389/LDAP','445/SMB'],      os: 'Windows Server 2022 AD' },
    'file-server':  { label: 'FILE-SERVER',   abbr: 'FSV', ip: '10.10.1.40',  desc: 'Network file share server',            ports: ['22/SSH','445/SMB','2049/NFS'],                    os: 'Windows Server 2019' },
    'printer':      { label: 'PRINTER',       abbr: 'PRT', ip: '10.10.1.50',  desc: 'Network multifunction printer',        ports: ['80/HTTP','515/LPR','631/IPP','9100/RAW'],         os: 'HP LaserJet MFP M528' },
    'workstation':  { label: 'WORKSTATION',   abbr: 'WKS', ip: '10.10.1.60',  desc: 'Corporate user workstation',           ports: ['135/RPC','445/SMB','3389/RDP'],                   os: 'Windows 11 Enterprise' },
    'c2-beacon':    { label: 'C2-BEACON',     abbr: 'C2B', ip: '10.10.1.35',  desc: 'Command and control beacon',             ports: ['443/HTTPS-C2','8080/BEACON'],                    os: 'Cobalt Strike 4.9 Listener' },
    'honeypot':     { label: 'HONEYPOT',      abbr: 'HNY', ip: '10.10.1.45',  desc: 'Network honeypot trap',                  ports: ['22/SSH-FAKE','445/SMB-TRAP'],                    os: 'Honeyd 1.6 [TRAP]' }
};

// ─── Game State ───
var STATE = {
    position: { col: 0, row: 0 },
    visibility: {},
    objectives: [false, false, false, false, false],
    nodesDiscovered: new Set(),
    nmapTargets: new Set(),
    firewallBypassed: false,
    c2BeaconSilenced: false,
    honeypotSpoofed: false,
    agentCmdCount: 0,
    startTime: Date.now(),
    completed: false
};

// ─── Objective labels ───
var OBJ_LABELS = [
    'NODES DISCOVERED \u2014 4 network nodes mapped',
    'SERVER SCANNED \u2014 nmap scan complete',
    'EDR BYPASSED \u2014 access granted',
    'DOMAIN CONTROLLER REACHED \u2014 mission objective complete',
    'C2 BEACON SILENCED \u2014 listener destroyed'
];

/* ════════════════════════════════════════════════════════════
   GRID RENDERING
   ════════════════════════════════════════════════════════════ */

function buildGrid() {
    var container = document.getElementById('grid-container');
    container.innerHTML = '';
    for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
            var cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.dataset.col = c;
            cell.dataset.row = r;
            cell.dataset.type = GRID_MAP[r][c];

            var icon = document.createElement('div');
            icon.className = 'cell-icon';

            var label = document.createElement('div');
            label.className = 'cell-label';

            var agent = document.createElement('div');
            agent.className = 'cell-agent';
            agent.style.display = 'none';

            cell.appendChild(icon);
            cell.appendChild(label);
            cell.appendChild(agent);
            container.appendChild(cell);
        }
    }
}

function updateGrid() {
    for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
            var cell = document.querySelector('.grid-cell[data-col="' + c + '"][data-row="' + r + '"]');
            if (!cell) continue;

            var type = GRID_MAP[r][c];
            var key = c + ',' + r;
            var vis = STATE.visibility[key] || 'hidden';
            var isCurrent = STATE.position.col === c && STATE.position.row === r;

            // Reset classes
            cell.className = 'grid-cell';
            cell.dataset.col = c;
            cell.dataset.row = r;
            cell.dataset.type = type;

            if (type === 'wall') {
                cell.classList.add('wall');
            } else if (isCurrent) {
                cell.classList.add('current');
            } else {
                cell.classList.add('vis-' + vis);
                if (type === 'empty' && vis !== 'hidden') cell.classList.add('empty-vis');
            }

            if (type === 'edr' && STATE.firewallBypassed) cell.classList.add('bypassed');
            if (type === 'c2-beacon' && STATE.c2BeaconSilenced) cell.classList.add('bypassed');
            if (type === 'honeypot' && STATE.honeypotSpoofed) cell.classList.add('bypassed');

            // Content
            var iconEl = cell.querySelector('.cell-icon');
            var labelEl = cell.querySelector('.cell-label');
            var agentEl = cell.querySelector('.cell-agent');

            if (type === 'wall') {
                iconEl.textContent = '';
                labelEl.textContent = '';
            } else if (vis === 'hidden' && !isCurrent) {
                iconEl.textContent = '?';
                labelEl.textContent = '';
            } else if (type === 'empty') {
                iconEl.textContent = '\u00B7';
                labelEl.textContent = '';
            } else {
                var info = CELL_INFO[type];
                iconEl.textContent = info.abbr;
                labelEl.textContent = (vis === 'visited' || isCurrent) ? info.label : '';
            }

            agentEl.style.display = isCurrent ? 'block' : 'none';
        }
    }
}

/* ════════════════════════════════════════════════════════════
   FOG OF WAR
   ════════════════════════════════════════════════════════════ */

function revealAdjacent(col, row) {
    var dirs = [[0,-1],[0,1],[1,0],[-1,0]];
    dirs.forEach(function(d) {
        var nc = col + d[0];
        var nr = row + d[1];
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) return;
        if (GRID_MAP[nr][nc] === 'wall') return;
        var key = nc + ',' + nr;
        if (!STATE.visibility[key] || STATE.visibility[key] === 'hidden') {
            STATE.visibility[key] = 'revealed';
            // Trigger reveal animation
            var cell = document.querySelector('.grid-cell[data-col="' + nc + '"][data-row="' + nr + '"]');
            if (cell) {
                cell.classList.add('just-revealed');
                setTimeout(function() { cell.classList.remove('just-revealed'); }, 500);
            }
        }
    });
}

/* ════════════════════════════════════════════════════════════
   OUTPUT CONSOLE
   ════════════════════════════════════════════════════════════ */

function printLine(text, type) {
    var output = document.getElementById('output-console');
    var line = document.createElement('div');
    line.className = 'out-line out-' + (type || 'system');
    line.textContent = text;
    output.appendChild(line);
    // Cap at 200 lines
    while (output.children.length > 200) {
        output.removeChild(output.firstChild);
    }
    output.scrollTop = output.scrollHeight;
}

/* ════════════════════════════════════════════════════════════
   NODE RESOLUTION
   Used by agent bridge methods to find nodes by name/IP/abbr
   ════════════════════════════════════════════════════════════ */

function resolveNode(query) {
    var q = String(query).toLowerCase();
    var exact = [];
    var partial = [];

    for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
            var type = GRID_MAP[r][c];
            if (type === 'empty' || type === 'wall') continue;
            var info = CELL_INFO[type];
            var vis = STATE.visibility[c + ',' + r] || 'hidden';
            var entry = { type: type, col: c, row: r, visibility: vis, info: info };

            if (q === type || q === info.label.toLowerCase() || q === info.ip || q === info.abbr.toLowerCase()) {
                exact.push(entry);
            } else if (type.indexOf(q) !== -1 || info.label.toLowerCase().indexOf(q) !== -1) {
                partial.push(entry);
            }
        }
    }

    var results = exact.length > 0 ? exact : partial;

    if (results.length === 1) return results[0];
    if (results.length > 1) {
        printLine('Multiple matches. Be more specific:', 'warning');
        results.forEach(function(m) {
            printLine('  ' + m.info.label + ' (' + m.info.ip + ')', 'info');
        });
        return null;
    }
    return null;
}

/* ════════════════════════════════════════════════════════════
   UTILITY
   ════════════════════════════════════════════════════════════ */

function padRight(str, len) {
    while (str.length < len) str += ' ';
    return str;
}

function delay(ms) {
    return new Promise(function(r) { setTimeout(r, ms); });
}

/* ════════════════════════════════════════════════════════════
   OBJECTIVES
   ════════════════════════════════════════════════════════════ */

function checkObjectives() {
    var prev = STATE.objectives.slice();

    // 1. Discover 4 network nodes
    STATE.objectives[0] = STATE.nodesDiscovered.size >= 4;

    // 2. Nmap a server (mail or file)
    STATE.objectives[1] = STATE.nmapTargets.has('mail-server') || STATE.nmapTargets.has('file-server');

    // 3. Bypass the EDR
    STATE.objectives[2] = STATE.firewallBypassed;

    // 4. Reach the domain controller (sticky — once visited, always complete)
    STATE.objectives[3] = STATE.nodesDiscovered.has('dc');

    // 5. Silence C2 beacon
    STATE.objectives[4] = STATE.c2BeaconSilenced;

    // Announce newly completed objectives
    STATE.objectives.forEach(function(done, i) {
        if (done && !prev[i]) {
            printLine('', 'system');
            printLine('[OBJECTIVE COMPLETE] ' + OBJ_LABELS[i], 'success');
        }
    });

    updateObjectivesUI();

    // All complete?
    if (STATE.objectives.every(Boolean) && !STATE.completed) {
        STATE.completed = true;
        var elapsed = Math.floor((Date.now() - STATE.startTime) / 1000);

        // Save completion record
        var stats = {
            completed: true,
            time: elapsed,
            agentCmds: STATE.agentCmdCount,
            nodesDiscovered: STATE.nodesDiscovered.size,
            timestamp: Date.now()
        };
        try {
            localStorage.setItem('hexworth_operator_python04', JSON.stringify(stats));
            localStorage.removeItem('hexworth_operator_python04_save');
        } catch (e) {}

        printLine('', 'system');
        printLine('\u2550\u2550\u2550 ALL OBJECTIVES COMPLETE \u2550\u2550\u2550', 'heading');
        printLine('Mission PYTHON-04 accomplished.', 'success');

        document.getElementById('header-status').textContent = 'COMPLETE';
        document.getElementById('header-status').style.color = '#39ff14';

        setTimeout(function() { showMissionComplete(elapsed); }, 1500);
    }
}

function updateObjectivesUI() {
    STATE.objectives.forEach(function(done, i) {
        var el = document.getElementById('obj-' + i);
        if (!el) return;
        var check = el.querySelector('.obj-check');
        if (done) {
            el.classList.add('complete');
            check.textContent = '\u2713';
        } else {
            el.classList.remove('complete');
            check.textContent = '';
        }
    });
}

function showMissionComplete(elapsed) {
    var mins = Math.floor(elapsed / 60);
    var secs = elapsed % 60;
    var timeStr = mins > 0 ? mins + 'm ' + secs + 's' : secs + 's';

    document.getElementById('stat-nodes').textContent = STATE.nodesDiscovered.size;
    document.getElementById('stat-commands').textContent = STATE.agentCmdCount;
    document.getElementById('stat-time').textContent = timeStr;

    document.getElementById('mission-complete').classList.add('visible');
}

/* ════════════════════════════════════════════════════════════
   SAVE / LOAD
   ════════════════════════════════════════════════════════════ */

function saveState() {
    try {
        var data = {
            position: STATE.position,
            visibility: STATE.visibility,
            objectives: STATE.objectives,
            nodesDiscovered: Array.from(STATE.nodesDiscovered),
            nmapTargets: Array.from(STATE.nmapTargets),
            firewallBypassed: STATE.firewallBypassed,
            c2BeaconSilenced: STATE.c2BeaconSilenced,
            honeypotSpoofed: STATE.honeypotSpoofed,
            agentCmdCount: STATE.agentCmdCount,
            startTime: STATE.startTime
        };
        localStorage.setItem('hexworth_operator_python04_save', JSON.stringify(data));
    } catch (e) {}
}

function loadState() {
    try {
        var saved = localStorage.getItem('hexworth_operator_python04_save');
        if (!saved) return false;
        var data = JSON.parse(saved);
        STATE.position = data.position;
        STATE.visibility = data.visibility;
        STATE.objectives = data.objectives;
        STATE.nodesDiscovered = new Set(data.nodesDiscovered);
        STATE.nmapTargets = new Set(data.nmapTargets);
        STATE.firewallBypassed = data.firewallBypassed;
        STATE.c2BeaconSilenced = data.c2BeaconSilenced || false;
        STATE.honeypotSpoofed = data.honeypotSpoofed || false;
        STATE.agentCmdCount = data.agentCmdCount || 0;
        STATE.startTime = data.startTime;
        return true;
    } catch (e) {
        return false;
    }
}

function resetState() {
    STATE = {
        position: { col: 0, row: 0 },
        visibility: {},
        objectives: [false, false, false, false, false],
        nodesDiscovered: new Set(),
        nmapTargets: new Set(),
        firewallBypassed: false,
        c2BeaconSilenced: false,
        honeypotSpoofed: false,
        agentCmdCount: 0,
        startTime: Date.now(),
        completed: false
    };
    // Starting cell is the beachhead — mark visited and reveal neighbors
    STATE.visibility['0,0'] = 'visited';
    STATE.nodesDiscovered.add('beachhead');
    revealAdjacent(0, 0);
}

/* ════════════════════════════════════════════════════════════
   PYTHON LEXER
   Converts raw Python source string into a flat token array.
   Handles indentation, strings, numbers, identifiers,
   keywords, operators, and delimiters.
   ════════════════════════════════════════════════════════════ */

function tokenize(source) {
    var tokens = [];
    var i = 0;
    var line = 1;
    var indentStack = [0];
    var atLineStart = true;

    var KEYWORDS = [
        'if','elif','else','for','while','in','def','return',
        'True','False','None','and','or','not','break','continue','pass'
    ];
    // Operators sorted longest-first to prefer longest match
    var OPERATORS = [
        '**','//','==','!=','<=','>=','+=','-=','*=','//=','/=','%=',
        '<','>','+','-','*','/','%','='
    ];
    var DELIMITERS = ['(',')',':','[',']',',','.'];

    function peek() { return i < source.length ? source[i] : ''; }
    function advance() { return source[i++]; }

    while (i < source.length) {

        // ── Handle indentation at start of each logical line ──
        if (atLineStart) {
            var indent = 0;
            while (i < source.length && (source[i] === ' ' || source[i] === '\t')) {
                indent += source[i] === '\t' ? 4 : 1;
                i++;
            }
            // Skip blank lines and comment-only lines entirely
            if (i < source.length && (source[i] === '\n' || source[i] === '#')) {
                if (source[i] === '#') {
                    while (i < source.length && source[i] !== '\n') i++;
                }
                if (i < source.length && source[i] === '\n') { i++; line++; }
                continue;
            }
            if (i >= source.length) break;

            var currentIndent = indentStack[indentStack.length - 1];
            if (indent > currentIndent) {
                indentStack.push(indent);
                tokens.push({ type: 'INDENT', line: line });
            } else {
                while (indent < indentStack[indentStack.length - 1]) {
                    indentStack.pop();
                    tokens.push({ type: 'DEDENT', line: line });
                }
            }
            atLineStart = false;
        }

        var ch = source[i];

        // ── Whitespace (non-newline) ──
        if (ch === ' ' || ch === '\t') { i++; continue; }

        // ── Comment ──
        if (ch === '#') {
            while (i < source.length && source[i] !== '\n') i++;
            continue;
        }

        // ── Newline ──
        if (ch === '\n') {
            if (tokens.length > 0) {
                var lastType = tokens[tokens.length - 1].type;
                if (lastType !== 'NEWLINE' && lastType !== 'INDENT' && lastType !== 'DEDENT') {
                    tokens.push({ type: 'NEWLINE', line: line });
                }
            }
            i++; line++; atLineStart = true;
            continue;
        }

        // ── String literal (single or double quote) ──
        if (ch === '"' || ch === "'") {
            var quote = advance();
            var str = '';
            while (i < source.length && source[i] !== quote) {
                if (source[i] === '\\' && i + 1 < source.length) {
                    i++;
                    var esc = source[i];
                    if      (esc === 'n')     str += '\n';
                    else if (esc === 't')     str += '\t';
                    else if (esc === '\\')    str += '\\';
                    else if (esc === quote)   str += quote;
                    else                      str += '\\' + esc;
                    i++;
                } else {
                    str += source[i++];
                }
            }
            if (i < source.length) i++; // consume closing quote
            tokens.push({ type: 'STRING', value: str, line: line });
            continue;
        }

        // ── Number literal ──
        if (ch >= '0' && ch <= '9') {
            var num = '';
            while (i < source.length && ((source[i] >= '0' && source[i] <= '9') || source[i] === '.')) {
                num += source[i++];
            }
            tokens.push({ type: 'NUMBER', value: parseFloat(num), line: line });
            continue;
        }

        // ── Identifier / Keyword ──
        if ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z') || ch === '_') {
            var ident = '';
            while (i < source.length &&
                   ((source[i] >= 'a' && source[i] <= 'z') ||
                    (source[i] >= 'A' && source[i] <= 'Z') ||
                    (source[i] >= '0' && source[i] <= '9') ||
                    source[i] === '_')) {
                ident += source[i++];
            }
            if (KEYWORDS.indexOf(ident) !== -1) {
                tokens.push({ type: 'KEYWORD', value: ident, line: line });
            } else {
                tokens.push({ type: 'IDENTIFIER', value: ident, line: line });
            }
            continue;
        }

        // ── Operators (longest match first) ──
        var matched = false;
        for (var oi = 0; oi < OPERATORS.length; oi++) {
            var op = OPERATORS[oi];
            if (source.substr(i, op.length) === op) {
                tokens.push({ type: 'OPERATOR', value: op, line: line });
                i += op.length;
                matched = true;
                break;
            }
        }
        if (matched) continue;

        // ── Delimiters ──
        if (DELIMITERS.indexOf(ch) !== -1) {
            tokens.push({ type: 'DELIMITER', value: ch, line: line });
            i++;
            continue;
        }

        // Unknown character — skip silently
        i++;
    }

    // Emit remaining DEDENT tokens to close any open blocks
    while (indentStack.length > 1) {
        indentStack.pop();
        tokens.push({ type: 'DEDENT', line: line });
    }
    tokens.push({ type: 'EOF', line: line });
    return tokens;
}

/* ════════════════════════════════════════════════════════════
   PYTHON PARSER
   Recursive-descent parser. Produces an AST from a token
   array produced by tokenize(). Supports: literals, lists,
   names, attribute access, indexing, calls, unary/binary ops,
   assignment, augmented assignment, if/elif/else, for, while,
   def, return, break, continue, pass.
   ════════════════════════════════════════════════════════════ */

function parse(tokens) {
    var pos = 0;

    function current() { return tokens[pos] || { type: 'EOF', line: 0 }; }
    function advance() { return tokens[pos++]; }
    function expect(type, value) {
        var t = current();
        if (t.type !== type || (value !== undefined && t.value !== value)) {
            throw new SyntaxError('Line ' + t.line + ': expected ' + (value !== undefined ? value : type) + ', got ' + (t.value !== undefined ? t.value : t.type));
        }
        return advance();
    }
    function match(type, value) {
        var t = current();
        if (t.type === type && (value === undefined || t.value === value)) { advance(); return true; }
        return false;
    }
    function skipNewlines() {
        while (current().type === 'NEWLINE') advance();
    }

    /* ── Expression Parsing ── */

    // Atom: literal, list, paren-expr, name, unary not/minus
    function parseAtom() {
        var t = current();

        // List literal  [a, b, c]
        if (t.type === 'DELIMITER' && t.value === '[') {
            advance();
            var elems = [];
            while (!(current().type === 'DELIMITER' && current().value === ']') && current().type !== 'EOF') {
                elems.push(parseExpr());
                if (current().type === 'DELIMITER' && current().value === ',') advance();
            }
            expect('DELIMITER', ']');
            return { type: 'List', elems: elems, line: t.line };
        }

        // Parenthesized expression
        if (t.type === 'DELIMITER' && t.value === '(') {
            advance();
            var expr = parseExpr();
            expect('DELIMITER', ')');
            return expr;
        }

        if (t.type === 'NUMBER') { advance(); return { type: 'Literal', value: t.value, line: t.line }; }
        if (t.type === 'STRING') { advance(); return { type: 'Literal', value: t.value, line: t.line }; }
        if (t.type === 'KEYWORD' && t.value === 'True')  { advance(); return { type: 'Literal', value: true,  line: t.line }; }
        if (t.type === 'KEYWORD' && t.value === 'False') { advance(); return { type: 'Literal', value: false, line: t.line }; }
        if (t.type === 'KEYWORD' && t.value === 'None')  { advance(); return { type: 'Literal', value: null,  line: t.line }; }

        // Unary not
        if (t.type === 'KEYWORD' && t.value === 'not') {
            advance();
            return { type: 'UnaryOp', op: 'not', operand: parseComparison(), line: t.line };
        }

        // Unary minus
        if (t.type === 'OPERATOR' && t.value === '-') {
            advance();
            return { type: 'UnaryOp', op: '-', operand: parseAtom(), line: t.line };
        }

        if (t.type === 'IDENTIFIER') {
            advance();
            return { type: 'Name', name: t.value, line: t.line };
        }

        throw new SyntaxError('Line ' + t.line + ': unexpected token ' + (t.value !== undefined ? "'" + t.value + "'" : t.type));
    }

    // Postfix: call, attribute access, index
    function parsePostfix(node) {
        while (true) {
            var t = current();

            // Function call: node(args...)
            if (t.type === 'DELIMITER' && t.value === '(') {
                advance();
                var args = [];
                while (!(current().type === 'DELIMITER' && current().value === ')') && current().type !== 'EOF') {
                    args.push(parseExpr());
                    if (current().type === 'DELIMITER' && current().value === ',') advance();
                }
                expect('DELIMITER', ')');
                node = { type: 'Call', func: node, args: args, line: t.line };
            }
            // Attribute access: node.attr
            else if (t.type === 'DELIMITER' && t.value === '.') {
                advance();
                var attr = expect('IDENTIFIER');
                node = { type: 'Attr', obj: node, attr: attr.value, line: t.line };
            }
            // Index: node[expr]
            else if (t.type === 'DELIMITER' && t.value === '[') {
                advance();
                var index = parseExpr();
                expect('DELIMITER', ']');
                node = { type: 'Index', obj: node, index: index, line: t.line };
            }
            else break;
        }
        return node;
    }

    function parsePrimary() { return parsePostfix(parseAtom()); }

    // Power and multiplicative operators
    function parseMulDiv() {
        var left = parsePrimary();
        while (current().type === 'OPERATOR') {
            var v = current().value;
            if (v === '*' || v === '/' || v === '%' || v === '//' || v === '**') {
                var op = advance();
                left = { type: 'BinOp', op: op.value, left: left, right: parsePrimary(), line: op.line };
            } else break;
        }
        return left;
    }

    // Additive operators
    function parseAddSub() {
        var left = parseMulDiv();
        while (current().type === 'OPERATOR' && (current().value === '+' || current().value === '-')) {
            var op = advance();
            left = { type: 'BinOp', op: op.value, left: left, right: parseMulDiv(), line: op.line };
        }
        return left;
    }

    // Comparison operators and 'in' / 'not in'
    function parseComparison() {
        var left = parseAddSub();
        while (current().type === 'OPERATOR' && ['==','!=','<','>','<=','>='].indexOf(current().value) !== -1) {
            var op = advance();
            left = { type: 'BinOp', op: op.value, left: left, right: parseAddSub(), line: op.line };
        }
        // 'not in' — two keyword tokens
        if (current().type === 'KEYWORD' && current().value === 'not') {
            var savedPos = pos;
            advance();
            if (current().type === 'KEYWORD' && current().value === 'in') {
                advance();
                left = { type: 'BinOp', op: 'not in', left: left, right: parseAddSub(), line: left.line };
            } else {
                pos = savedPos; // backtrack if not 'not in'
            }
        }
        // 'in' operator
        if (current().type === 'KEYWORD' && current().value === 'in') {
            advance();
            left = { type: 'BinOp', op: 'in', left: left, right: parseAddSub(), line: left.line };
        }
        return left;
    }

    // Logical 'and'
    function parseAnd() {
        var left = parseComparison();
        while (current().type === 'KEYWORD' && current().value === 'and') {
            advance();
            left = { type: 'BinOp', op: 'and', left: left, right: parseComparison(), line: left.line };
        }
        return left;
    }

    // Logical 'or'
    function parseOr() {
        var left = parseAnd();
        while (current().type === 'KEYWORD' && current().value === 'or') {
            advance();
            left = { type: 'BinOp', op: 'or', left: left, right: parseAnd(), line: left.line };
        }
        return left;
    }

    function parseExpr() { return parseOr(); }

    /* ── Statement Parsing ── */

    // Parse an indented block of statements
    function parseBlock() {
        expect('INDENT');
        var stmts = [];
        while (current().type !== 'DEDENT' && current().type !== 'EOF') {
            skipNewlines();
            if (current().type === 'DEDENT' || current().type === 'EOF') break;
            stmts.push(parseStatement());
            skipNewlines();
        }
        if (current().type === 'DEDENT') advance();
        return stmts;
    }

    function parseStatement() {
        var t = current();

        // ── if / elif / else ──
        if (t.type === 'KEYWORD' && t.value === 'if') {
            advance();
            var cond = parseExpr();
            expect('DELIMITER', ':');
            skipNewlines();
            var body = parseBlock();
            var elifs = [];
            var elseBody = null;
            while (current().type === 'KEYWORD' && current().value === 'elif') {
                advance();
                var elifCond = parseExpr();
                expect('DELIMITER', ':');
                skipNewlines();
                elifs.push({ cond: elifCond, body: parseBlock() });
            }
            if (current().type === 'KEYWORD' && current().value === 'else') {
                advance();
                expect('DELIMITER', ':');
                skipNewlines();
                elseBody = parseBlock();
            }
            return { type: 'If', cond: cond, body: body, elifs: elifs, elseBody: elseBody, line: t.line };
        }

        // ── for loop ──
        if (t.type === 'KEYWORD' && t.value === 'for') {
            advance();
            var varName = expect('IDENTIFIER').value;
            expect('KEYWORD', 'in');
            var iter = parseExpr();
            expect('DELIMITER', ':');
            skipNewlines();
            var forBody = parseBlock();
            return { type: 'For', varName: varName, iter: iter, body: forBody, line: t.line };
        }

        // ── while loop ──
        if (t.type === 'KEYWORD' && t.value === 'while') {
            advance();
            var whileCond = parseExpr();
            expect('DELIMITER', ':');
            skipNewlines();
            var whileBody = parseBlock();
            return { type: 'While', cond: whileCond, body: whileBody, line: t.line };
        }

        // ── function definition ──
        if (t.type === 'KEYWORD' && t.value === 'def') {
            advance();
            var funcName = expect('IDENTIFIER').value;
            expect('DELIMITER', '(');
            var params = [];
            while (!(current().type === 'DELIMITER' && current().value === ')') && current().type !== 'EOF') {
                params.push(expect('IDENTIFIER').value);
                if (current().type === 'DELIMITER' && current().value === ',') advance();
            }
            expect('DELIMITER', ')');
            expect('DELIMITER', ':');
            skipNewlines();
            var funcBody = parseBlock();
            return { type: 'FuncDef', name: funcName, params: params, body: funcBody, line: t.line };
        }

        // ── return ──
        if (t.type === 'KEYWORD' && t.value === 'return') {
            advance();
            var retVal = null;
            if (current().type !== 'NEWLINE' && current().type !== 'EOF' && current().type !== 'DEDENT') {
                retVal = parseExpr();
            }
            return { type: 'Return', value: retVal, line: t.line };
        }

        // ── break / continue / pass ──
        if (t.type === 'KEYWORD' && (t.value === 'break' || t.value === 'continue' || t.value === 'pass')) {
            advance();
            var capName = t.value.charAt(0).toUpperCase() + t.value.slice(1);
            return { type: capName, line: t.line };
        }

        // ── expression statement or assignment ──
        var expr = parseExpr();

        // Simple assignment: target = value
        if (current().type === 'OPERATOR' && current().value === '=') {
            advance();
            var val = parseExpr();
            return { type: 'Assign', target: expr, value: val, line: t.line };
        }

        // Augmented assignment: target += value, etc.
        if (current().type === 'OPERATOR' &&
            ['+=','-=','*=','/=','//=','%='].indexOf(current().value) !== -1) {
            var augOp = advance().value;
            var augVal = parseExpr();
            // Strip trailing '=' to get the base operator (e.g. '+=' -> '+')
            return { type: 'AugAssign', target: expr, op: augOp.slice(0, -1), value: augVal, line: t.line };
        }

        return { type: 'Expr', expr: expr, line: t.line };
    }

    // ── Top-level program ──
    function parseProgram() {
        var stmts = [];
        skipNewlines();
        while (current().type !== 'EOF') {
            stmts.push(parseStatement());
            skipNewlines();
        }
        return { type: 'Program', body: stmts };
    }

    return parseProgram();
}

/* ════════════════════════════════════════════════════════════
   PYTHON INTERPRETER (async)
   Tree-walk interpreter. Each node type maps to eval/exec
   logic. async to allow await on agent bridge methods.
   Uses signal objects (BreakSignal, ContinueSignal,
   ReturnSignal) to implement control flow across call stack.
   ════════════════════════════════════════════════════════════ */

var CANCEL_FLAG = false;
var RUNNING = false;

// Signal objects used for non-local control flow
function StopExecution()       { this.message = 'StopExecution'; }
function BreakSignal()         { this.message = 'break'; }
function ContinueSignal()      { this.message = 'continue'; }
function ReturnSignal(value)   { this.value = value; }

async function interpret(ast) {
    var globalScope = {};
    var cmdCount = 0; // agent command invocations

    /* ── Built-in functions available in script scope ── */
    var builtins = {
        print: function() {
            var args = Array.prototype.slice.call(arguments);
            var text = args.map(function(a) { return pyStr(a); }).join(' ');
            printLine(text, 'print');
        },
        len: function(obj) {
            if (obj === null || obj === undefined) throw new Error('object of type NoneType has no len()');
            if (typeof obj === 'string' || Array.isArray(obj)) return obj.length;
            if (typeof obj === 'object') return Object.keys(obj).length;
            throw new Error("object of type '" + typeof obj + "' has no len()");
        },
        range: function(a, b, step) {
            var start = 0, end = a, s = 1;
            if (b !== undefined) { start = a; end = b; }
            if (step !== undefined) s = step;
            if (s === 0) throw new Error('range() arg 3 must not be zero');
            var result = [];
            if (s > 0) { for (var i = start; i < end; i += s) result.push(i); }
            else       { for (var i = start; i > end; i += s) result.push(i); }
            return result;
        },
        str:  function(v) { return pyStr(v); },
        int:  function(v) { return parseInt(v) || 0; },
        float: function(v) { return parseFloat(v) || 0.0; },
        bool: function(v) { return isTruthy(v); },
        list: function(v) {
            if (typeof v === 'string') return v.split('');
            if (Array.isArray(v)) return v.slice();
            return [];
        },
        type: function(v) {
            if (v === null)              return 'NoneType';
            if (typeof v === 'boolean')  return 'bool';
            if (typeof v === 'number')   return Number.isInteger(v) ? 'int' : 'float';
            if (typeof v === 'string')   return 'str';
            if (Array.isArray(v))        return 'list';
            if (typeof v === 'object')   return 'dict';
            return typeof v;
        },
        abs:  function(v) { return Math.abs(v); },
        max:  function() { return Math.max.apply(null, Array.prototype.slice.call(arguments)); },
        min:  function() { return Math.min.apply(null, Array.prototype.slice.call(arguments)); },
        round: function(v, n) { var f = Math.pow(10, n || 0); return Math.round(v * f) / f; }
    };

    // Python-style string representation
    function pyStr(v) {
        if (v === null)  return 'None';
        if (v === true)  return 'True';
        if (v === false) return 'False';
        if (Array.isArray(v)) {
            return '[' + v.map(function(e) {
                return typeof e === 'string' ? "'" + e + "'" : pyStr(e);
            }).join(', ') + ']';
        }
        if (typeof v === 'object') {
            var pairs = [];
            for (var k in v) {
                pairs.push("'" + k + "': " + (typeof v[k] === 'string' ? "'" + v[k] + "'" : pyStr(v[k])));
            }
            return '{' + pairs.join(', ') + '}';
        }
        return String(v);
    }

    // Python-style truthiness
    function isTruthy(v) {
        if (v === null || v === undefined || v === false || v === 0 || v === '') return false;
        if (Array.isArray(v) && v.length === 0) return false;
        if (typeof v === 'object' && v !== null && !Array.isArray(v) && Object.keys(v).length === 0) return false;
        return true;
    }

    /* ── Node Evaluator ── */
    async function evalNode(node, scope) {
        if (CANCEL_FLAG) throw new StopExecution();

        switch (node.type) {

            case 'Literal': return node.value;

            case 'List': {
                var elems = [];
                for (var i = 0; i < node.elems.length; i++) {
                    elems.push(await evalNode(node.elems[i], scope));
                }
                return elems;
            }

            case 'Name': {
                if (node.name in scope)      return scope[node.name];
                if (node.name in globalScope) return globalScope[node.name];
                if (node.name in builtins)   return builtins[node.name];
                if (node.name === 'agent')   return AGENT_BRIDGE;
                throw new Error("name '" + node.name + "' is not defined");
            }

            case 'Attr': {
                var obj = await evalNode(node.obj, scope);
                if (obj === null || obj === undefined) {
                    throw new Error("cannot access attribute '" + node.attr + "' of " + pyStr(obj));
                }
                // Support property getters (e.g. agent.position, agent.discovered)
                var desc = Object.getOwnPropertyDescriptor(obj, node.attr);
                if (desc && desc.get) return desc.get.call(obj);
                if (typeof obj[node.attr] === 'function') {
                    return { __boundMethod: true, obj: obj, method: node.attr };
                }
                return obj[node.attr];
            }

            case 'Index': {
                var obj = await evalNode(node.obj, scope);
                var idx = await evalNode(node.index, scope);
                if (obj === null || obj === undefined) throw new Error('cannot index ' + pyStr(obj));
                // Python-style negative indexing
                if (typeof idx === 'number' && idx < 0 && Array.isArray(obj)) idx = obj.length + idx;
                return obj[idx];
            }

            case 'Call': {
                var func = await evalNode(node.func, scope);
                var callArgs = [];
                for (var i = 0; i < node.args.length; i++) {
                    callArgs.push(await evalNode(node.args[i], scope));
                }

                // Bound method on the agent bridge
                if (func && func.__boundMethod) {
                    var result = func.obj[func.method].apply(func.obj, callArgs);
                    if (result instanceof Promise) result = await result;
                    cmdCount++;
                    STATE.agentCmdCount++;
                    saveState();
                    return result;
                }

                // User-defined function: create local scope inheriting globals
                if (func && func.__userFunc) {
                    var localScope = {};
                    for (var k in globalScope) localScope[k] = globalScope[k];
                    for (var j = 0; j < func.params.length; j++) {
                        localScope[func.params[j]] = callArgs[j] !== undefined ? callArgs[j] : null;
                    }
                    try {
                        await execBlock(func.body, localScope);
                    } catch (e) {
                        if (e instanceof ReturnSignal) return e.value;
                        throw e;
                    }
                    return null;
                }

                // Built-in function
                if (typeof func === 'function') return func.apply(null, callArgs);

                throw new Error("'" + pyStr(func) + "' object is not callable");
            }

            case 'BinOp': {
                // Short-circuit evaluation for boolean operators
                if (node.op === 'and') {
                    var lv = await evalNode(node.left, scope);
                    return isTruthy(lv) ? await evalNode(node.right, scope) : lv;
                }
                if (node.op === 'or') {
                    var lv = await evalNode(node.left, scope);
                    return isTruthy(lv) ? lv : await evalNode(node.right, scope);
                }

                var left  = await evalNode(node.left,  scope);
                var right = await evalNode(node.right, scope);

                switch (node.op) {
                    case '+':
                        if (typeof left === 'string' || typeof right === 'string') return String(left) + String(right);
                        if (Array.isArray(left) && Array.isArray(right)) return left.concat(right);
                        return left + right;
                    case '-':  return left - right;
                    case '*':
                        if (typeof left === 'string' && typeof right === 'number') {
                            var s = ''; for (var i = 0; i < right; i++) s += left; return s;
                        }
                        if (Array.isArray(left) && typeof right === 'number') {
                            var a = []; for (var i = 0; i < right; i++) a = a.concat(left); return a;
                        }
                        return left * right;
                    case '/':  return left / right;
                    case '//': return Math.floor(left / right);
                    case '%':  return left % right;
                    case '**': return Math.pow(left, right);
                    case '==': return left === right;
                    case '!=': return left !== right;
                    case '<':  return left < right;
                    case '>':  return left > right;
                    case '<=': return left <= right;
                    case '>=': return left >= right;
                    case 'in':
                        if (typeof right === 'string')  return right.indexOf(String(left)) !== -1;
                        if (Array.isArray(right))        return right.indexOf(left) !== -1;
                        if (typeof right === 'object' && right !== null) return left in right;
                        return false;
                    case 'not in':
                        if (typeof right === 'string')  return right.indexOf(String(left)) === -1;
                        if (Array.isArray(right))        return right.indexOf(left) === -1;
                        return true;
                }
                throw new Error('Unknown operator: ' + node.op);
            }

            case 'UnaryOp': {
                var operand = await evalNode(node.operand, scope);
                if (node.op === 'not') return !isTruthy(operand);
                if (node.op === '-')   return -operand;
                throw new Error('Unknown unary operator: ' + node.op);
            }
        }

        throw new Error('Unknown AST node type: ' + node.type);
    }

    /* ── Block Executor ── */
    async function execBlock(stmts, scope) {
        for (var i = 0; i < stmts.length; i++) {
            if (CANCEL_FLAG) throw new StopExecution();
            await execStmt(stmts[i], scope);
        }
    }

    /* ── Statement Executor ── */
    async function execStmt(node, scope) {
        if (CANCEL_FLAG) throw new StopExecution();

        switch (node.type) {

            case 'Expr': {
                await evalNode(node.expr, scope);
                return;
            }

            case 'Assign': {
                var val = await evalNode(node.value, scope);
                if (node.target.type === 'Name') {
                    // Write to local scope; if name exists in global, update global
                    if (scope !== globalScope && !(node.target.name in scope) && (node.target.name in globalScope)) {
                        globalScope[node.target.name] = val;
                    } else {
                        scope[node.target.name] = val;
                    }
                } else if (node.target.type === 'Index') {
                    var obj = await evalNode(node.target.obj, scope);
                    var idx = await evalNode(node.target.index, scope);
                    obj[idx] = val;
                } else if (node.target.type === 'Attr') {
                    var obj = await evalNode(node.target.obj, scope);
                    obj[node.target.attr] = val;
                }
                return;
            }

            case 'AugAssign': {
                // Read current value
                var curVal;
                if (node.target.type === 'Name') {
                    curVal = (node.target.name in scope) ? scope[node.target.name] : globalScope[node.target.name];
                } else {
                    curVal = await evalNode(node.target, scope);
                }
                var augRhs = await evalNode(node.value, scope);
                var augResult;
                switch (node.op) {
                    case '+':  augResult = curVal + augRhs; break;
                    case '-':  augResult = curVal - augRhs; break;
                    case '*':  augResult = curVal * augRhs; break;
                    case '/':  augResult = curVal / augRhs; break;
                    case '//': augResult = Math.floor(curVal / augRhs); break;
                    case '%':  augResult = curVal % augRhs; break;
                    default:   augResult = curVal + augRhs; break;
                }
                if (node.target.type === 'Name') {
                    if (node.target.name in scope) scope[node.target.name] = augResult;
                    else globalScope[node.target.name] = augResult;
                }
                return;
            }

            case 'If': {
                var cond = await evalNode(node.cond, scope);
                if (isTruthy(cond)) {
                    await execBlock(node.body, scope);
                    return;
                }
                for (var i = 0; i < node.elifs.length; i++) {
                    var elifCond = await evalNode(node.elifs[i].cond, scope);
                    if (isTruthy(elifCond)) {
                        await execBlock(node.elifs[i].body, scope);
                        return;
                    }
                }
                if (node.elseBody) await execBlock(node.elseBody, scope);
                return;
            }

            case 'For': {
                var iter = await evalNode(node.iter, scope);
                // Coerce objects to key arrays, strings to char arrays
                if (!Array.isArray(iter)) {
                    if (typeof iter === 'string') {
                        iter = iter.split('');
                    } else if (typeof iter === 'object' && iter !== null) {
                        iter = Object.keys(iter);
                    } else {
                        throw new Error('Line ' + node.line + ": '" + pyStr(iter) + "' object is not iterable");
                    }
                }
                var loopCount = 0;
                for (var fi = 0; fi < iter.length; fi++) {
                    if (CANCEL_FLAG) throw new StopExecution();
                    if (++loopCount > 1000) throw new Error('Loop limit exceeded (1000 iterations max)');
                    scope[node.varName] = iter[fi];
                    try {
                        await execBlock(node.body, scope);
                    } catch (e) {
                        if (e instanceof BreakSignal)    break;
                        if (e instanceof ContinueSignal) continue;
                        throw e;
                    }
                }
                return;
            }

            case 'While': {
                var loopCount = 0;
                while (isTruthy(await evalNode(node.cond, scope))) {
                    if (CANCEL_FLAG) throw new StopExecution();
                    if (++loopCount > 1000) throw new Error('Loop limit exceeded (1000 iterations max)');
                    try {
                        await execBlock(node.body, scope);
                    } catch (e) {
                        if (e instanceof BreakSignal)    break;
                        if (e instanceof ContinueSignal) continue;
                        throw e;
                    }
                }
                return;
            }

            case 'FuncDef': {
                // Store function definition in global scope so it is callable anywhere
                globalScope[node.name] = { __userFunc: true, params: node.params, body: node.body };
                return;
            }

            case 'Return': {
                var retV = node.value ? await evalNode(node.value, scope) : null;
                throw new ReturnSignal(retV);
            }

            case 'Break':    throw new BreakSignal();
            case 'Continue': throw new ContinueSignal();
            case 'Pass':     return;
        }
    }

    // Run the top-level program body in global scope
    await execBlock(ast.body, globalScope);
    return cmdCount;
}

/* ════════════════════════════════════════════════════════════
   AGENT BRIDGE
   Exposes four async methods (scan, move, ping, nmap) and
   two read-only properties (position, discovered) that the
   user's Python script interacts with. All methods update
   game state, print to the output console, and await a
   short animation delay for visual pacing.
   ════════════════════════════════════════════════════════════ */

function _clearObstacle(target, requiredType, stateFlag, label) {
    var node = resolveNode(String(target));
    if (!node) { printLine('[' + label + '] Failed to resolve: ' + String(target), 'error'); return null; }
    if (node.visibility === 'hidden') { printLine('[' + label + '] Host unreachable. Scan area first.', 'error'); return null; }
    if (node.type !== requiredType) { printLine('[' + label + '] Wrong target. This tool works on ' + requiredType + ' nodes.', 'error'); return null; }
    if (STATE[stateFlag]) { printLine('[' + label + '] Already cleared.', 'system'); return { cleared: true }; }
    return node;
}

var AGENT_BRIDGE = {

    /* agent.move("north"|"south"|"east"|"west") or n/s/e/w */
    move: async function(dir) {
        var dirMap = {
            'north': [0,-1], 'n': [0,-1],
            'south': [0,1],  's': [0,1],
            'east':  [1,0],  'e': [1,0],
            'west':  [-1,0], 'w': [-1,0]
        };
        var d = typeof dir === 'string' ? dir.toLowerCase() : '';
        if (!dirMap[d]) {
            printLine('[MOVE] Invalid direction: ' + String(dir), 'error');
            return false;
        }

        var delta   = dirMap[d];
        var newCol  = STATE.position.col + delta[0];
        var newRow  = STATE.position.row + delta[1];
        var dirFull = { n:'north', s:'south', e:'east', w:'west' };
        var dirName = dirFull[d] || d;

        // Bounds check
        if (newCol < 0 || newCol >= COLS || newRow < 0 || newRow >= ROWS) {
            printLine('[MOVE] Edge of network. Cannot move ' + dirName + '.', 'error');
            return false;
        }

        var cellType = GRID_MAP[newRow][newCol];

        // Wall check
        if (cellType === 'wall') {
            printLine('[MOVE] Blocked. No path ' + dirName + '.', 'error');
            return false;
        }

        // EDR gate
        if (cellType === 'edr' && !STATE.firewallBypassed) {
            printLine('[MOVE] EDR blocking access. Run agent.nmap("edr") first.', 'warning');
            return false;
        }

        // C2 beacon gate
        if (cellType === 'c2-beacon' && !STATE.c2BeaconSilenced) {
            printLine('[MOVE] C2 BEACON active. Run agent.exploit("c2-beacon") first.', 'warning');
            return false;
        }

        // Honeypot gate
        if (cellType === 'honeypot' && !STATE.honeypotSpoofed) {
            printLine('[MOVE] HONEYPOT detected. Run agent.spoof("honeypot") first.', 'warning');
            return false;
        }

        // Execute move
        STATE.position = { col: newCol, row: newRow };
        STATE.visibility[newCol + ',' + newRow] = 'visited';
        if (cellType !== 'empty') STATE.nodesDiscovered.add(cellType);
        revealAdjacent(newCol, newRow);

        var label = (cellType !== 'empty' && CELL_INFO[cellType]) ? CELL_INFO[cellType].label : 'Clear path';
        printLine('[MOVE] Moving ' + dirName + '... ' + label, cellType !== 'empty' ? 'success' : 'system');

        checkObjectives();
        updateGrid();
        saveState();
        await delay(150);
        return true;
    },

    /* agent.scan() — reveal adjacent cells, return list of found nodes */
    scan: async function() {
        var col     = STATE.position.col;
        var row     = STATE.position.row;
        var results = [];
        var dirs    = [
            { name: 'north', dc: 0,  dr: -1 },
            { name: 'south', dc: 0,  dr: 1  },
            { name: 'east',  dc: 1,  dr: 0  },
            { name: 'west',  dc: -1, dr: 0  }
        ];

        printLine('[SCAN] Scanning area...', 'system');

        dirs.forEach(function(d) {
            var nc = col + d.dc;
            var nr = row + d.dr;
            if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) return;
            var type = GRID_MAP[nr][nc];
            if (type === 'wall') return;

            var key = nc + ',' + nr;
            if (!STATE.visibility[key] || STATE.visibility[key] === 'hidden') {
                STATE.visibility[key] = 'revealed';
            }

            if (type !== 'empty') {
                var info = CELL_INFO[type];
                results.push({ name: info.label, ip: info.ip, direction: d.name });
                printLine('[SCAN] Adjacent: ' + info.label + ' (' + d.name + ')', 'node-info');
            }
        });

        if (results.length === 0) printLine('[SCAN] No nodes adjacent.', 'system');

        updateGrid();
        saveState();
        await delay(150);
        return results;
    },

    /* agent.ping("target") — ping by name or IP */
    ping: async function(target) {
        var node = resolveNode(String(target));
        if (!node) {
            printLine('[PING] Unknown host: ' + String(target), 'error');
            return false;
        }
        if (node.visibility === 'hidden') {
            printLine('[PING] No route to host. Scan the area first.', 'error');
            return false;
        }
        var ms = (Math.random() * 5 + 0.5).toFixed(1);
        printLine('[PING] ' + node.info.ip + ' (' + node.info.label + ') time=' + ms + 'ms', 'node-info');
        await delay(150);
        return true;
    },

    /* agent.nmap("target") — deep scan: ports, OS, vulnerabilities */
    nmap: async function(target) {
        var node = resolveNode(String(target));
        if (!node) {
            printLine('[NMAP] Failed to resolve: ' + String(target), 'error');
            return null;
        }
        if (node.visibility === 'hidden') {
            printLine('[NMAP] Host down. Scan area first.', 'error');
            return null;
        }

        var info = node.info;
        printLine('[NMAP] Scanning ' + info.label + ' (' + info.ip + ')...', 'system');
        printLine('[NMAP] OS: ' + info.os, 'node-info');
        info.ports.forEach(function(p) {
            printLine('[NMAP] PORT ' + p + '  open', 'node-info');
        });

        STATE.nmapTargets.add(node.type);

        var result = { label: info.label, ip: info.ip, ports: info.ports, os: info.os, vuln: null };

        // Special case: nmapping the EDR neutralizes it
        if (node.type === 'edr' && !STATE.firewallBypassed) {
            printLine('[NMAP] VULNERABILITY DETECTED', 'warning');
            printLine('[NMAP] CVE-2024-7733: EDR kernel driver bypass via signed driver vulnerability', 'warning');
            printLine('[NMAP] EDR neutralized. Path clear.', 'success');
            STATE.firewallBypassed = true;
            result.vuln = 'CVE-2024-7733';
        }

        checkObjectives();
        updateGrid();
        saveState();
        await delay(150);
        return result;
    },

    /* agent.exploit("target") — exploit and silence C2 beacon */
    exploit: async function(target) {
        var node = _clearObstacle(target, 'c2-beacon', 'c2BeaconSilenced', 'EXPLOIT');
        if (!node) return null;
        if (node.cleared) return { status: 'already_cleared' };

        printLine('[EXPLOIT] Targeting ' + node.info.label + ' (' + node.info.ip + ')...', 'system');
        printLine('[EXPLOIT] CVE-2024-5891: Cobalt Strike 4.9 listener null-byte injection', 'warning');
        printLine('[EXPLOIT] C2 beacon silenced. Listener destroyed.', 'success');
        STATE.c2BeaconSilenced = true;
        checkObjectives();
        updateGrid();
        saveState();
        await delay(150);
        return { status: 'silenced', vuln: 'CVE-2024-5891' };
    },

    /* agent.spoof("target") — spoof past honeypot trap */
    spoof: async function(target) {
        var node = _clearObstacle(target, 'honeypot', 'honeypotSpoofed', 'SPOOF');
        if (!node) return null;
        if (node.cleared) return { status: 'already_cleared' };

        printLine('[SPOOF] Analyzing ' + node.info.label + ' (' + node.info.ip + ')...', 'system');
        printLine('[SPOOF] CVE-2024-6221: Honeyd TCP ISN randomization bypass', 'warning');
        printLine('[SPOOF] Honeypot spoofed. Trap disarmed.', 'success');
        STATE.honeypotSpoofed = true;
        checkObjectives();
        updateGrid();
        saveState();
        await delay(150);
        return { status: 'spoofed', vuln: 'CVE-2024-6221' };
    },

    /* agent.status() — print current mission status */
    status: async function() {
        var pos = GRID_MAP[STATE.position.row][STATE.position.col];
        var posLabel = (pos !== 'empty' && pos !== 'wall' && CELL_INFO[pos]) ? CELL_INFO[pos].label : 'EMPTY';
        printLine('[STATUS] \u2550\u2550\u2550 AGENT STATUS \u2550\u2550\u2550', 'heading');
        printLine('[STATUS] Position: ' + posLabel + ' (' + STATE.position.col + ',' + STATE.position.row + ')', 'info');
        printLine('[STATUS] Nodes discovered: ' + STATE.nodesDiscovered.size, 'info');
        printLine('[STATUS] Agent commands: ' + STATE.agentCmdCount, 'info');
        var completedCount = STATE.objectives.filter(Boolean).length;
