<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PYTHON-06: Night Raid | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <script src="../../components/ModuleProgress.js"></script>
</head>
<body>
<h1 class="visually-hidden">PYTHON-06: Night Raid</h1>
    <div id="operator-root"></div>

    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/OperatorInterpreter.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/python-06.config.js"></script>
    <script>
    /* PYTHON-06: Night Raid — 9x9, three-phase operation.
       Phase 1: Recon sweep (discover nodes, catalog with nmap).
       Phase 2: Breach (bypass 2 firewalls, exploit vuln servers).
       Phase 3: Extract (navigate gated corridor to extraction).
       Forces multi-function program structure with data passing
       between phases. 5 traps, 7 objectives, 5 integrity pips. */
    (function() {
        var engine = OperatorEngine.init(PYTHON_06_CONFIG);
        var agent  = AgentBridge.create(engine);

        engine.editor.onRun(function() {
            var code = engine.editor.getCode();
            engine.editor.clearOutput();
            OperatorInterpreter.reset();
            OperatorInterpreter.run(code, agent, engine.printLine)
                .then(function(result) {
                    if (result.error) {
                        engine.printLine('Error: ' + result.error, 'error');
                    } else {
                        engine.printLine('Program complete. ' + result.cmdCount + ' agent commands executed.', 'system');
                    }
                });
        });

        engine.editor.onStop(function() {
            OperatorInterpreter.cancel();
        });
    })();
    </script>
</body>
</html>
