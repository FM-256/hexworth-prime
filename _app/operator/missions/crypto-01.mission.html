<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYPTO-01: Dead Drop | Operator</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a0c10;
            color: rgba(255,255,255,0.85);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* CRT scanlines */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.1) 0px,
                rgba(0,0,0,0.1) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 9000;
        }

        /* ─── Header ─── */
        .mission-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #0e1018;
            border-bottom: 1px solid rgba(57, 255, 20, 0.15);
            height: 44px;
            flex-shrink: 0;
        }
        .mission-header-back {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            letter-spacing: 0.08em;
            transition: color 0.2s;
        }
        .mission-header-back:hover { color: #39ff14; }
        .mission-header-title {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: #39ff14;
            text-transform: uppercase;
            font-weight: 600;
        }
        .mission-header-status {
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            color: rgba(57, 255, 20, 0.4);
            text-transform: uppercase;
        }

        /* ─── Objectives Bar ─── */
        .obj-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 7px 20px;
            background: #0c0e14;
            border-bottom: 1px solid rgba(57, 255, 20, 0.1);
            overflow-x: auto;
            flex-shrink: 0;
        }
        .obj-label {
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            color: rgba(57, 255, 20, 0.3);
            text-transform: uppercase;
            white-space: nowrap;
            margin-right: 4px;
        }
        .obj-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.04em;
            white-space: nowrap;
            transition: color 0.3s;
        }
        .obj-item.complete { color: #39ff14; }
        .obj-check {
            width: 13px;
            height: 13px;
            border-radius: 3px;
            border: 1px solid rgba(57, 255, 20, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .obj-item.complete .obj-check {
            background: rgba(57, 255, 20, 0.15);
            border-color: #39ff14;
            color: #39ff14;
        }

        /* ─── Split Layout ─── */
        .mission-layout {
            display: flex;
            height: calc(100vh - 44px - 30px);
        }

        /* ─── Map Panel (left 55%) ─── */
        .map-panel {
            flex: 0 0 55%;
            position: relative;
            overflow: hidden;
            border-right: 1px solid rgba(57, 255, 20, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090b0f;
        }
        .map-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(57, 255, 20, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.015) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        /* ─── Grid ─── */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 4px;
            padding: 20px;
            width: 100%;
            height: 100%;
            max-width: 600px;
            max-height: 480px;
        }

        .grid-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(57, 255, 20, 0.06);
            border-radius: 4px;
            position: relative;
            transition: all 0.4s ease;
            min-height: 0;
            overflow: hidden;
        }

        /* Cell visibility states */
        .grid-cell.vis-hidden {
            background: rgba(57, 255, 20, 0.01);
            border-color: rgba(57, 255, 20, 0.04);
        }
        .grid-cell.vis-revealed {
            background: rgba(57, 255, 20, 0.05);
            border-color: rgba(57, 255, 20, 0.15);
        }
        .grid-cell.vis-visited {
            background: rgba(57, 255, 20, 0.09);
            border-color: rgba(57, 255, 20, 0.25);
        }
        .grid-cell.current {
            background: rgba(57, 255, 20, 0.14);
            border-color: #39ff14;
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.15), inset 0 0 8px rgba(57, 255, 20, 0.05);
        }
        .grid-cell.wall {
            background: rgba(255, 255, 255, 0.015);
            border-color: rgba(255, 255, 255, 0.03);
        }
        .grid-cell.empty-vis {
            background: rgba(57, 255, 20, 0.03);
        }

        /* Cell content */
        .cell-icon {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            transition: color 0.3s;
        }
        .cell-label {
            font-size: 0.5rem;
            letter-spacing: 0.06em;
            margin-top: 2px;
            transition: color 0.3s;
            text-align: center;
        }
        .vis-hidden .cell-icon { color: rgba(255, 255, 255, 0.06); }
        .vis-hidden .cell-label { color: transparent; }
        .vis-revealed .cell-icon { color: rgba(57, 255, 20, 0.45); }
        .vis-revealed .cell-label { color: rgba(57, 255, 20, 0.2); }
        .vis-visited .cell-icon { color: rgba(57, 255, 20, 0.7); }
        .vis-visited .cell-label { color: rgba(57, 255, 20, 0.35); }
        .current .cell-icon { color: #39ff14; }
        .current .cell-label { color: rgba(57, 255, 20, 0.6); }
        .wall .cell-icon { color: rgba(255, 255, 255, 0.04); }
        .wall .cell-label { color: transparent; }

        /* Agent dot */
        .cell-agent {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #39ff14;
            position: absolute;
            bottom: 5px;
            right: 5px;
            animation: agentPulse 2s ease-in-out infinite;
            box-shadow: 0 0 6px rgba(57, 255, 20, 0.5);
        }
        @keyframes agentPulse {
            0%, 100% { box-shadow: 0 0 4px rgba(57, 255, 20, 0.3); transform: scale(1); }
            50% { box-shadow: 0 0 12px rgba(57, 255, 20, 0.7), 0 0 20px rgba(57, 255, 20, 0.15); transform: scale(1.15); }
        }

        /* Cell reveal animation */
        @keyframes cellReveal {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .grid-cell.just-revealed {
            animation: cellReveal 0.4s ease-out;
        }

        /* ─── Terminal Panel (right 45%) ─── */
        .term-panel {
            flex: 0 0 45%;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #080a0e;
        }
        .term-bar {
            padding: 7px 14px;
            background: #0c0e14;
            border-bottom: 1px solid rgba(57, 255, 20, 0.1);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .term-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(57, 255, 20, 0.3);
        }
        .term-bar-label {
            font-size: 0.55rem;
            color: rgba(57, 255, 20, 0.35);
            letter-spacing: 0.1em;
            margin-left: 6px;
        }
        .term-output {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
            font-size: 0.78rem;
            line-height: 1.65;
        }
        .term-output::-webkit-scrollbar { width: 4px; }
        .term-output::-webkit-scrollbar-track { background: transparent; }
        .term-output::-webkit-scrollbar-thumb { background: rgba(57, 255, 20, 0.15); border-radius: 2px; }

        /* Terminal line types */
        .term-line { word-break: break-word; }
        .term-system { color: rgba(57, 255, 20, 0.3); }
        .term-info { color: rgba(57, 255, 20, 0.65); }
        .term-success { color: #39ff14; font-weight: 600; }
        .term-error { color: #ff4444; }
        .term-warning { color: #ffaa00; }
        .term-node-info { color: #00ccff; }
        .term-heading { color: #39ff14; font-weight: 700; }
        .term-prompt-echo { color: rgba(57, 255, 20, 0.45); }

        /* Terminal input */
        .term-input-row {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            border-top: 1px solid rgba(57, 255, 20, 0.1);
            background: #0a0c12;
            flex-shrink: 0;
        }
        .term-prompt-text {
            color: #39ff14;
            font-size: 0.78rem;
            white-space: nowrap;
            margin-right: 8px;
        }
        .term-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #76ff03;
            font-family: 'Courier New', monospace;
            font-size: 0.78rem;
            caret-color: #39ff14;
        }

        /* ─── Mission Complete Overlay ─── */
        .mission-complete {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 8000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s;
        }
        .mission-complete.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .mc-card {
            background: #0e1018;
            border: 1px solid rgba(57, 255, 20, 0.3);
            border-radius: 8px;
            padding: 36px 40px;
            text-align: center;
            max-width: 380px;
            width: 90%;
        }
        .mc-badge {
            font-size: 0.55rem;
            letter-spacing: 0.2em;
            color: rgba(57, 255, 20, 0.5);
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .mc-title {
            font-size: 1.3rem;
            color: #39ff14;
            letter-spacing: 0.2em;
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
        }
        .mc-subtitle {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.35);
            margin-bottom: 28px;
        }
        .mc-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        .mc-stat-value {
            font-size: 1.5rem;
            color: #39ff14;
            font-weight: 700;
        }
        .mc-stat-label {
            font-size: 0.55rem;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.08em;
            margin-top: 3px;
            text-transform: uppercase;
        }
        .mc-btn {
            display: inline-block;
            padding: 10px 28px;
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid rgba(57, 255, 20, 0.3);
            border-radius: 4px;
            color: #39ff14;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mc-btn:hover {
            background: rgba(57, 255, 20, 0.2);
            border-color: #39ff14;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.15);
        }

        /* ─── Mobile ─── */
        @media (max-width: 768px) {
            .mission-layout {
                flex-direction: column;
            }
            .map-panel {
                flex: 0 0 42%;
                border-right: none;
                border-bottom: 1px solid rgba(57, 255, 20, 0.1);
            }
            .term-panel {
                flex: 1;
            }
            .obj-bar { gap: 10px; padding: 6px 12px; }
            .obj-item { font-size: 0.5rem; }
            .obj-label { font-size: 0.5rem; }
            .grid-container { padding: 10px; max-height: none; }
        }
        @media (max-width: 480px) {
            .mission-header { padding: 8px 12px; height: 38px; }
            .mission-header-title { font-size: 0.6rem; }
            .mission-layout { height: calc(100vh - 38px - 26px); }
            .cell-label { display: none; }
            .cell-icon { font-size: 0.7rem; }
            .cell-agent { width: 8px; height: 8px; bottom: 3px; right: 3px; }
            .mc-card { padding: 24px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="mission-header">
        <a href="../index.html" class="mission-header-back">&larr; OPERATOR</a>
        <div class="mission-header-title">CRYPTO-01 / DEAD DROP</div>
        <div class="mission-header-status" id="header-status">IN PROGRESS</div>
    </div>

    <!-- Objectives bar -->
    <div class="obj-bar">
        <span class="obj-label">OBJ</span>
        <div class="obj-item" id="obj-0">
            <span class="obj-check"></span> Decode the base64 drop
        </div>
        <div class="obj-item" id="obj-1">
            <span class="obj-check"></span> Crack the password hash
        </div>
        <div class="obj-item" id="obj-2">
            <span class="obj-check"></span> Decrypt the dead drop
        </div>
        <div class="obj-item" id="obj-3">
            <span class="obj-check"></span> Verify authenticity
        </div>
    </div>

    <!-- Split layout -->
    <div class="mission-layout">
        <!-- Left: Crypto Map -->
        <div class="map-panel">
            <div class="grid-container" id="grid-container"></div>
        </div>

        <!-- Right: Terminal -->
        <div class="term-panel" id="term-panel">
            <div class="term-bar">
                <div class="term-dot"></div>
                <div class="term-dot"></div>
                <div class="term-dot"></div>
                <span class="term-bar-label">OPERATOR TERMINAL</span>
            </div>
            <div class="term-output" id="term-output"></div>
            <div class="term-input-row">
                <span class="term-prompt-text">crypto@lab:~$</span>
                <input type="text" class="term-input" id="term-input" autocomplete="off" spellcheck="false" autofocus>
            </div>
        </div>
    </div>

    <!-- Mission Complete Overlay -->
    <div class="mission-complete" id="mission-complete">
        <div class="mc-card">
            <div class="mc-badge">MISSION COMPLETE</div>
            <div class="mc-title">DEAD DROP</div>
            <div class="mc-subtitle">Message decrypted. Identity verified.</div>
            <div class="mc-stats">
                <div>
                    <div class="mc-stat-value" id="stat-nodes">0</div>
                    <div class="mc-stat-label">Nodes</div>
                </div>
                <div>
                    <div class="mc-stat-value" id="stat-commands">0</div>
                    <div class="mc-stat-label">Commands</div>
                </div>
                <div>
                    <div class="mc-stat-value" id="stat-time">0s</div>
                    <div class="mc-stat-label">Time</div>
                </div>
            </div>
            <a href="../index.html" class="mc-btn">RETURN TO OPERATOR</a>
        </div>
    </div>

<script>
/* ═══════════════════════════════════════════════════════════
   CRYPTO-01: Dead Drop — Mission Engine
   ═══════════════════════════════════════════════════════════ */

// ─── Grid Map ───
// Rows 0-3, Cols 0-4
const GRID_MAP = [
    ['terminal',    'empty',       'base64-node', 'hash-vault',  'wall'],
    ['empty',       'cipher-desk', 'empty',       'keystore',    'dead-drop'],
    ['wall',        'hex-bench',   'empty',       'empty',       'wall'],
    ['wall',        'wall',        'verify-post', 'wall',        'wall']
];

const ROWS = 4;
const COLS = 5;

// ─── Cell Info ───
const CELL_INFO = {
    'terminal':    { label: 'TERMINAL',    abbr: 'TRM', ip: 'localhost', desc: 'Crypto analysis workstation',   os: 'Kali Linux 2024.1' },
    'base64-node': { label: 'BASE64-STN',  abbr: 'B64', ip: '\u2014',         desc: 'Encoding/decoding station',      os: 'Custom' },
    'hash-vault':  { label: 'HASH-VAULT',  abbr: 'HSH', ip: '\u2014',         desc: 'Cryptographic hash database',     os: 'HashDB 3.2' },
    'cipher-desk': { label: 'CIPHER-DESK', abbr: 'CPH', ip: '\u2014',         desc: 'Classical cipher workspace',      os: 'Custom' },
    'keystore':    { label: 'KEYSTORE',    abbr: 'KEY', ip: '\u2014',         desc: 'Key management system',           os: 'GnuPG 2.4' },
    'dead-drop':   { label: 'DEAD-DROP',   abbr: 'DRP', ip: '\u2014',         desc: 'Encrypted message drop point',    os: 'Unknown' },
    'hex-bench':   { label: 'HEX-BENCH',   abbr: 'HEX', ip: '\u2014',         desc: 'Hexadecimal analysis bench',      os: 'Custom' },
    'verify-post': { label: 'VERIFY-POST', abbr: 'VFY', ip: '\u2014',         desc: 'Signature verification station',  os: 'OpenSSL 3.1' }
};

// ─── Known hash: SHA-256 of "password" ───
const KNOWN_HASH = '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8';
const KNOWN_HASH_PREFIX = '5e884898';

// ─── Game State ───
let STATE = {
    position: { col: 0, row: 0 },
    visibility: {},
    objectives: [false, false, false, false],
    nodesDiscovered: new Set(),
    commandCount: 0,
    commandHistory: [],
    historyIndex: -1,
    startTime: Date.now(),
    completed: false,
    // Crypto-specific progress flags
    base64Decoded: false,
    hashCracked: false,
    dropDecrypted: false,
    signatureVerified: false,
    // Track which nodes have been examined
    nodesExamined: new Set()
};

// ─── Objective announcement labels ───
const OBJ_LABELS = [
    'BASE64 DECODED \u2014 passphrase recovered',
    'HASH CRACKED \u2014 password retrieved',
    'DEAD DROP DECRYPTED \u2014 intel secured',
    'SIGNATURE VERIFIED \u2014 authenticity confirmed'
];

// ═══ Grid Rendering ═══

function buildGrid() {
    var container = document.getElementById('grid-container');
    container.innerHTML = '';
    for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
            var cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.dataset.col = c;
            cell.dataset.row = r;
            cell.dataset.type = GRID_MAP[r][c];

            var icon = document.createElement('div');
            icon.className = 'cell-icon';

            var label = document.createElement('div');
            label.className = 'cell-label';

            var agent = document.createElement('div');
            agent.className = 'cell-agent';
            agent.style.display = 'none';

            cell.appendChild(icon);
            cell.appendChild(label);
            cell.appendChild(agent);
            container.appendChild(cell);
        }
    }
}

function updateGrid() {
    for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
            var cell = document.querySelector('.grid-cell[data-col="' + c + '"][data-row="' + r + '"]');
            if (!cell) continue;

            var type = GRID_MAP[r][c];
            var key = c + ',' + r;
            var vis = STATE.visibility[key] || 'hidden';
            var isCurrent = STATE.position.col === c && STATE.position.row === r;

            // Reset classes
            cell.className = 'grid-cell';
            cell.dataset.col = c;
            cell.dataset.row = r;
            cell.dataset.type = type;

            if (type === 'wall') {
                cell.classList.add('wall');
            } else if (isCurrent) {
                cell.classList.add('current');
            } else {
                cell.classList.add('vis-' + vis);
                if (type === 'empty' && vis !== 'hidden') cell.classList.add('empty-vis');
            }

            var iconEl = cell.querySelector('.cell-icon');
            var labelEl = cell.querySelector('.cell-label');
            var agentEl = cell.querySelector('.cell-agent');

            if (type === 'wall') {
                iconEl.textContent = '';
                labelEl.textContent = '';
            } else if (vis === 'hidden' && !isCurrent) {
                iconEl.textContent = '?';
                labelEl.textContent = '';
            } else if (type === 'empty') {
                iconEl.textContent = '\u00B7';
                labelEl.textContent = '';
            } else {
                var info = CELL_INFO[type];
                iconEl.textContent = info.abbr;
                labelEl.textContent = (vis === 'visited' || isCurrent) ? info.label : '';
            }

            agentEl.style.display = isCurrent ? 'block' : 'none';
        }
    }
}

// ═══ Fog of War ═══

function revealAdjacent(col, row) {
    var dirs = [[0,-1],[0,1],[1,0],[-1,0]];
    dirs.forEach(function(d) {
        var nc = col + d[0];
        var nr = row + d[1];
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) return;
        if (GRID_MAP[nr][nc] === 'wall') return;
        var key = nc + ',' + nr;
        if (!STATE.visibility[key] || STATE.visibility[key] === 'hidden') {
            STATE.visibility[key] = 'revealed';
            var cell = document.querySelector('.grid-cell[data-col="' + nc + '"][data-row="' + nr + '"]');
            if (cell) {
                cell.classList.add('just-revealed');
                setTimeout(function() { cell.classList.remove('just-revealed'); }, 500);
            }
        }
    });
}

// ═══ Terminal Output ═══

function printLine(text, type) {
    var output = document.getElementById('term-output');
    var line = document.createElement('div');
    line.className = 'term-line term-' + (type || 'system');
    line.textContent = text;
    output.appendChild(line);

    // Cap at 200 lines to prevent memory bloat
    while (output.children.length > 200) {
        output.removeChild(output.firstChild);
    }
    output.scrollTop = output.scrollHeight;
}

// ═══ Command Handlers ═══

function cmdHelp() {
    printLine('', 'system');
    printLine('\u2550\u2550\u2550 COMMAND REFERENCE \u2550\u2550\u2550', 'heading');
    printLine('  scan                    Survey area, reveal adjacent nodes', 'info');
    printLine('  move <dir>              Move agent (north/south/east/west or n/s/e/w)', 'info');
    printLine('  examine                 Examine current node for crypto artifacts', 'info');
    printLine('  decode <type> <data>    Decode encoded data (types: base64, hex, rot13)', 'info');
    printLine('  hash <algo> <text>      Hash text (algos: sha256, md5)', 'info');
    printLine('  crack <hash>            Attempt to crack a known hash', 'info');
    printLine('  verify                  Verify a digital signature (at VERIFY-POST)', 'info');
    printLine('  status                  Show position and objectives', 'info');
    printLine('  help                    Show this reference', 'info');
    printLine('  clear                   Clear terminal output', 'info');
    printLine('', 'system');
    printLine('Tip: Use "examine" at each node to discover encoded data.', 'system');

    dirs.forEach(function(d) {

            printLine('  ' + d.name + ': ' + info.label + ' \u2014 ' + info.desc, 'node-info');

function cmdMove(args) {
    if (!args.length) {
        printLine('Usage: move <direction>', 'error');
        printLine('Directions: north/south/east/west (or n/s/e/w)', 'system');
        return;
    }

    var dirMap = {
        'north': [0,-1], 'n': [0,-1],
        'south': [0,1],  's': [0,1],
        'east':  [1,0],  'e': [1,0],
        'west':  [-1,0], 'w': [-1,0]
    };

    var dir = args[0].toLowerCase();
    if (!dirMap[dir]) {
        printLine('Unknown direction: ' + args[0], 'error');
        printLine('Use: north/south/east/west (or n/s/e/w)', 'system');
        return;
    }

    var d = dirMap[dir];
    var newCol = STATE.position.col + d[0];
    var newRow = STATE.position.row + d[1];

    if (newCol < 0 || newCol >= COLS || newRow < 0 || newRow >= ROWS) {
        printLine('Edge of lab. Cannot move ' + dir + '.', 'error');
        return;
    }

    var cellType = GRID_MAP[newRow][newCol];

    if (cellType === 'wall') {
        printLine('Blocked. No traversable path ' + dir + '.', 'error');
        return;
    }

    // Move the agent
    STATE.position = { col: newCol, row: newRow };
    STATE.visibility[newCol + ',' + newRow] = 'visited';

    if (cellType !== 'empty') {
        STATE.nodesDiscovered.add(cellType);
    }

    revealAdjacent(newCol, newRow);

    var dirFull = { n: 'north', s: 'south', e: 'east', w: 'west' };
    var dirName = dirFull[dir] || dir;

    if (cellType === 'empty') {
        printLine('Moving ' + dirName + '... Clear path.', 'system');
    } else {
        var info = CELL_INFO[cellType];

        printLine(info.desc + ' | ' + info.os, 'info');

}

/* ─── decode command ───
   Supports base64, hex, rot13. Works from anywhere once relevant
   node has been visited/examined, or unconditionally for educational use. */
function cmdDecode(args) {
    if (args.length < 2) {
        printLine('Usage: decode <type> <data>', 'error');
        printLine('Types: base64, hex, rot13', 'system');
        return;
    }

    var type = args[0].toLowerCase();
    // Everything after the type is the payload (supports spaces in rot13 text)
    var payload = args.slice(1).join(' ');

    switch (type) {
        case 'base64':
            // Only handle the specific mission base64 string; educate on others
            if (payload === 'VGhlIHBhc3NwaHJhc2UgaXM6IHNoYWRvd3BoZW5peA==') {
                printLine('', 'system');
                printLine('Decoding Base64...', 'system');
                printLine('', 'system');
                printLine('Result: The passphrase is: shadowphenix', 'success');
                printLine('', 'system');
                printLine('[RECOVERED] Passphrase: shadowphenix', 'heading');
                printLine('Store this. It unlocks the dead drop payload.', 'info');

                if (!STATE.base64Decoded) {
                    STATE.base64Decoded = true;
                    checkObjectives();
                }
            } else {
                // Generic base64 decode attempt — decode what we can
                try {
                    var decoded = atob(payload);
                    printLine('', 'system');
                    printLine('Decoding Base64...', 'system');
                    printLine('Result: ' + decoded, 'node-info');
                } catch (e) {
                    printLine('Invalid Base64 string. Check padding and characters.', 'error');
                }
            }
            break;

        case 'hex':
            // Strip spaces and decode as hex
            var hexClean = payload.replace(/\s+/g, '');
            // Accept the mission hex sample with or without spaces
            if (hexClean === '4865787776f727468' || hexClean === '48657877' ||
                payload.replace(/\s/g,'') === '48657877' ||
                // Also handle the exact mission string with spaces stripped
                hexClean === '48657877' || hexClean.startsWith('48657877')) {
                printLine('', 'system');
                printLine('Decoding Hex...', 'system');
                printLine('Result: Hexworth', 'success');
                printLine('(Platform identifier — informational)', 'system');
            } else if (/^[0-9a-fA-F]+$/.test(hexClean) && hexClean.length % 2 === 0) {
                // Attempt generic hex decode
                var hexResult = '';
                for (var i = 0; i < hexClean.length; i += 2) {
                    hexResult += String.fromCharCode(parseInt(hexClean.substr(i, 2), 16));
                }
                printLine('', 'system');
                printLine('Decoding Hex...', 'system');
                printLine('Result: ' + hexResult, 'node-info');
            } else {
                printLine('Invalid hex string. Use only 0-9, a-f.', 'error');
                printLine('Example: decode hex 48 65 78 77 6f 72 74 68', 'system');
            }
            break;

        case 'rot13':
            // ROT13 is its own inverse; apply it and print
            var rot13Result = payload.replace(/[a-zA-Z]/g, function(ch) {
                var base = ch <= 'Z' ? 65 : 97;
                return String.fromCharCode(((ch.charCodeAt(0) - base + 13) % 26) + base);
            });
            printLine('', 'system');
            printLine('Applying ROT13...', 'system');
            printLine('Result: ' + rot13Result, 'success');

            // Check if this is the mission cipher text
            if (payload.toLowerCase().indexOf('gur qrnq qebc') !== -1) {
                printLine('', 'system');
                printLine('[INTEL] Dead drop location confirmed: coordinates (4,1)', 'info');
                printLine('That is the DEAD-DROP station on the map.', 'system');
            }
            break;

        default:
            printLine('Unknown encoding type: ' + type, 'error');
            printLine('Supported: base64, hex, rot13', 'system');
    }
}

/* ─── hash command ───
   Educational: lets the analyst hash arbitrary text. */
function cmdHash(args) {
    if (args.length < 2) {
        printLine('Usage: hash <algo> <text>', 'error');
        printLine('Algorithms: sha256, md5', 'system');
        return;
    }

    var algo = args[0].toLowerCase();
    var text = args.slice(1).join(' ');

    if (algo !== 'sha256' && algo !== 'md5') {
        printLine('Unknown algorithm: ' + algo, 'error');
        printLine('Supported: sha256, md5', 'system');
        return;
    }

    printLine('', 'system');
    printLine('Computing ' + algo.toUpperCase() + ' hash of "' + text + '"...', 'system');

    // We simulate SHA-256 for the known test cases
    // For "password" specifically, we return the real hash for mission integrity
    if (algo === 'sha256' && text === 'password') {
        printLine('Hash: ' + KNOWN_HASH, 'node-info');
        printLine('', 'system');
        printLine('Note: This matches the hash stored in HASH-VAULT.', 'warning');
    } else if (algo === 'sha256') {
        // Produce a deterministic-looking but fake hash for other inputs
        // so the analyst can explore without breaking mission logic
        var fakeHash = simulateSha256(text);
        printLine('Hash: ' + fakeHash, 'node-info');
    } else if (algo === 'md5' && text === 'password') {
        printLine('Hash: 5f4dcc3b5aa765d61d8327deb882cf99', 'node-info');
    } else {
        printLine('Hash: ' + simulateMd5(text), 'node-info');
    }
}

// Deterministic fake hash generators for educational exploration
function simulateSha256(text) {
    var h = 0;
    for (var i = 0; i < text.length; i++) {
        h = (Math.imul(31, h) + text.charCodeAt(i)) | 0;
    }
    var hex = (h >>> 0).toString(16).padStart(8, '0');
    return hex + 'a3f291b74dc58e0f' + hex.split('').reverse().join('') +
           'c7d6e5b4a3920100' + hex + 'f1e2d3c4b5a69788';
}

function simulateMd5(text) {
    var h = 0;
    for (var i = 0; i < text.length; i++) {
        h = (Math.imul(17, h) + text.charCodeAt(i)) | 0;
    }
    var hex = (h >>> 0).toString(16).padStart(8, '0');
    return hex + 'b9c8d7e6' + hex.split('').reverse().join('') + 'f5a4b3c2';
}

// ═══ Objectives ═══

function checkObjectives() {
    var prev = STATE.objectives.slice();

    STATE.objectives[0] = STATE.base64Decoded;
    STATE.objectives[1] = STATE.hashCracked;
    STATE.objectives[2] = STATE.dropDecrypted;
    STATE.objectives[3] = STATE.signatureVerified;

    // Announce newly completed objectives
    STATE.objectives.forEach(function(done, i) {
        if (done && !prev[i]) {
            printLine('', 'system');
            printLine('[OBJECTIVE COMPLETE] ' + OBJ_LABELS[i], 'success');
        }
    });

    updateObjectivesUI();

    // All four complete?
    if (STATE.objectives.every(Boolean) && !STATE.completed) {
        STATE.completed = true;
        var elapsed = Math.floor((Date.now() - STATE.startTime) / 1000);

        var stats = {
            completed: true,
            time: elapsed,
            commands: STATE.commandCount,
            nodesDiscovered: STATE.nodesDiscovered.size,
            timestamp: Date.now()
        };
        try {
            localStorage.setItem('hexworth_operator_crypto01', JSON.stringify(stats));
            localStorage.removeItem('hexworth_operator_crypto01_save');
        } catch (e) {}

        printLine('', 'system');
        printLine('\u2550\u2550\u2550 ALL OBJECTIVES COMPLETE \u2550\u2550\u2550', 'heading');
        printLine('Mission CRYPTO-01 accomplished.', 'success');

        document.getElementById('header-status').textContent = 'COMPLETE';
        document.getElementById('header-status').style.color = '#39ff14';

        setTimeout(function() { showMissionComplete(elapsed); }, 1500);
    }
}

function updateObjectivesUI() {
    STATE.objectives.forEach(function(done, i) {
        var el = document.getElementById('obj-' + i);
        if (!el) return;
        var check = el.querySelector('.obj-check');
        if (done) {
            el.classList.add('complete');
            check.textContent = '\u2713';
        } else {
            el.classList.remove('complete');
            check.textContent = '';
        }
    });
}

function showMissionComplete(elapsed) {
    var mins = Math.floor(elapsed / 60);
    var secs = elapsed % 60;
    var timeStr = mins > 0 ? mins + 'm ' + secs + 's' : secs + 's';

    document.getElementById('stat-nodes').textContent = STATE.nodesDiscovered.size;
    document.getElementById('stat-commands').textContent = STATE.commandCount;
    document.getElementById('stat-time').textContent = timeStr;

    document.getElementById('mission-complete').classList.add('visible');
}

function loadState() {

        STATE.position        = data.position;
        STATE.visibility      = data.visibility;
        STATE.objectives      = data.objectives;
        STATE.nodesDiscovered = new Set(data.nodesDiscovered);
        STATE.nodesExamined   = new Set(data.nodesExamined || []);
        STATE.commandCount    = data.commandCount;
        STATE.startTime       = data.startTime;
        STATE.base64Decoded   = data.base64Decoded   || false;
        STATE.hashCracked     = data.hashCracked     || false;
        STATE.dropDecrypted   = data.dropDecrypted   || false;
        STATE.signatureVerified = data.signatureVerified || false;
        return true;
    } catch (e) {
        return false;
    }
}

function resetState() {
    STATE = {
        position: { col: 0, row: 0 },
        visibility: {},
        objectives: [false, false, false, false],
        nodesDiscovered: new Set(),
        nodesExamined: new Set(),
        commandCount: 0,
        commandHistory: [],
        historyIndex: -1,
        startTime: Date.now(),
        completed: false,
        base64Decoded: false,
        hashCracked: false,
        dropDecrypted: false,
        signatureVerified: false
    };
    // Starting cell: terminal at (0,0)
    STATE.visibility['0,0'] = 'visited';
    STATE.nodesDiscovered.add('terminal');
    STATE.nodesExamined.add('terminal');
    revealAdjacent(0, 0);
}

// ═══ Command Parser ═══

function executeCommand(input) {
    STATE.commandCount++;

    // Echo the input with the prompt
    printLine('crypto@lab:~$ ' + input, 'prompt-echo');

    var parts = input.trim().split(/\s+/);
    var cmd   = parts[0].toLowerCase();
    var args  = parts.slice(1);

    switch (cmd) {
        case 'scan':    cmdScan();        break;
        case 'move':    cmdMove(args);    break;
        case 'examine': cmdExamine();     break;
        case 'decode':  cmdDecode(args);  break;
        case 'hash':    cmdHash(args);    break;
        case 'crack':   cmdCrack(args);   break;
        case 'verify':  cmdVerify();      break;
        case 'status':  cmdStatus();      break;
        case 'help':    cmdHelp();        break;
        case 'clear':
            document.getElementById('term-output').innerHTML = '';
            break;
        default:
            printLine('Unknown command: ' + cmd, 'error');
            printLine('Type "help" for available commands.', 'system');
    }
}

// ═══ Terminal Input ═══

function setupInput() {
    var input = document.getElementById('term-input');

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            var cmd = this.value.trim();
            if (cmd) {
                STATE.commandHistory.push(cmd);
                STATE.historyIndex = STATE.commandHistory.length;
                executeCommand(cmd);
            }
            this.value = '';
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (STATE.historyIndex > 0) {
                STATE.historyIndex--;
                this.value = STATE.commandHistory[STATE.historyIndex];
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (STATE.historyIndex < STATE.commandHistory.length - 1) {
                STATE.historyIndex++;
                this.value = STATE.commandHistory[STATE.historyIndex];
            } else {
                STATE.historyIndex = STATE.commandHistory.length;
                this.value = '';
            }
        }
    });

    // Click anywhere in the terminal panel to re-focus the input
    document.getElementById('term-panel').addEventListener('click', function(e) {
        if (e.target.tagName !== 'INPUT') input.focus();
    });
}

// ═══ Init ═══

function init() {
    buildGrid();
    setupInput();

    var restored = loadState();
    if (restored && !STATE.completed) {
        printLine('[SYS] Session restored from save.', 'system');
        printLine('[SYS] Type "status" to review progress.', 'info');
        printLine('', 'system');
    } else {
        resetState();
        showBriefing();
    }

    updateGrid();
    updateObjectivesUI();
    document.getElementById('term-input').focus();
}

document.addEventListener('DOMContentLoaded', init);
