<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFI-OP-03: The Router | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
</head>
<body>
<h1 class="visually-hidden">PFI-OP-03: The Router</h1>
    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/OperatorInterpreter.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/pfi-op-03.config.js"></script>
    <script>
    /* PFI-OP-03: The Router — 8x6 grid with 3 gated zones.
       Forces students to compose multiple functions: one sweep per zone,
       one gate-clearing helper. Manual approach = 60+ lines.
       Function composition approach = ~20 lines.
       The zoned layout IS the teacher: same pattern, different zones. */
    (function() {
        var engine = OperatorEngine.init(PFI_OP_03_CONFIG);
        var agent  = AgentBridge.create(engine);

        engine.editor.onRun(function() {
            var code = engine.editor.getCode();
            engine.editor.clearOutput();
            OperatorInterpreter.reset();
            OperatorInterpreter.run(code, agent, engine.printLine)
                .then(function(result) {
                    if (result.error) {
                        engine.printLine('Error: ' + result.error, 'error');
                    } else {
                        engine.printLine('Program complete. ' + result.cmdCount + ' agent commands executed.', 'system');
                    }
                });
        });

        engine.editor.onStop(function() {
            OperatorInterpreter.cancel();
        });
    })();
    </script>
</body>
</html>
