<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINDOWS-CMD-02: Blue Screen Protocol | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <style>
        .editor-panel { background: #080a0e; }
        .editor-area { display: none; }
        .editor-toolbar { display: none; }
        .output-console { flex: 1; }
        .term-input-row { display: flex; align-items: center; padding: 8px 14px; border-top: 1px solid rgba(57,255,20,0.1); background: #0a0c12; flex-shrink: 0; }
        .term-prompt-text { color: #39ff14; font-size: 0.78rem; white-space: nowrap; margin-right: 8px; font-family: var(--op-font); }
        .term-input { flex: 1; background: transparent; border: none; outline: none; color: #76ff03; font-family: var(--op-font); font-size: 0.78rem; caret-color: #39ff14; }
        .grid-cell.remediated:not(.vis-hidden):not(.wall) { border-left: 2px solid rgba(57,255,20,0.4); }
    </style>
    <script src="../../components/ModuleProgress.js"></script>
</head>
<body>
    <div id="operator-root"></div>

    <script src="../engine/OperatorEngine.js"></script>
    <script src="../configs/windows-cmd-02.config.js"></script>
    <script>
    /* ================================================================
       WINDOWS-CMD-02: Blue Screen Protocol -- Terminal Command Layer
       Windows Server admin environment. Location-specific commands.
       ================================================================ */
    (function() {
        var config = WINDOWS_CMD_02_CONFIG;
        var engine = OperatorEngine.init(config);
        var state  = engine.getState();

        // Custom state
        state.rogueTaskFound = false; state.rogueTaskDisabled = false;
        state.serviceViewed = false; state.maliciousServiceStopped = false;
        state.userViewed = false; state.unauthorizedUserDisabled = false;
        state.remediationVerified = false;

        // Terminal UI setup
        var editorPanel = document.querySelector('.editor-panel');
        editorPanel.innerHTML = '';
        var termBar = document.createElement('div');
        termBar.style.cssText = 'padding:7px 14px;background:#0c0e14;border-bottom:1px solid rgba(57,255,20,0.1);display:flex;align-items:center;gap:6px;flex-shrink:0;';
        for (var i = 0; i < 3; i++) { var dot = document.createElement('div'); dot.style.cssText = 'width:7px;height:7px;border-radius:50%;background:rgba(57,255,20,0.3);'; termBar.appendChild(dot); }
        var barLabel = document.createElement('span'); barLabel.style.cssText = 'font-size:0.55rem;color:rgba(57,255,20,0.35);letter-spacing:0.1em;margin-left:6px;'; barLabel.textContent = 'COMMAND PROMPT';
        termBar.appendChild(barLabel); editorPanel.appendChild(termBar);
        var outputConsole = document.querySelector('.output-console'); editorPanel.appendChild(outputConsole);
        var inputRow = document.createElement('div'); inputRow.className = 'term-input-row';
        var promptSpan = document.createElement('span'); promptSpan.className = 'term-prompt-text'; promptSpan.textContent = config.promptText;
        var termInput = document.createElement('input'); termInput.type = 'text'; termInput.className = 'term-input'; termInput.autocomplete = 'off'; termInput.spellcheck = false;
        inputRow.appendChild(promptSpan); inputRow.appendChild(termInput); editorPanel.appendChild(inputRow);

        var history = []; var histIdx = -1;
        function curCell() { return config.grid.cells[state.position.row][state.position.col]; }

        function cmdScan() {
            var col = state.position.col, row = state.position.row, cellType = curCell();
            engine.printLine('Scanning area...', 'system'); engine.printLine('', 'system');
            if (cellType !== 'empty' && cellType !== 'wall') { var cur = config.nodes[cellType]; engine.printLine('Current: ' + cur.label + ' (' + cur.ip + ')', 'heading'); engine.printLine(cur.desc, 'info'); state.nodesDiscovered.add(cellType); }
            else engine.printLine('Current: Corridor (no panel)', 'heading');
            engine.printLine('', 'system'); engine.printLine('Adjacent:', 'heading');
            var dirs = [{name:'North',dc:0,dr:-1},{name:'South',dc:0,dr:1},{name:'East',dc:1,dr:0},{name:'West',dc:-1,dr:0}];
            for (var i = 0; i < dirs.length; i++) { var d = dirs[i], nc = col + d.dc, nr = row + d.dr;
                if (nc < 0 || nc >= config.grid.cols || nr < 0 || nr >= config.grid.rows) { engine.printLine('  ' + d.name + ': [edge]', 'system'); continue; }
                var type = config.grid.cells[nr][nc]; if (type === 'wall') { engine.printLine('  ' + d.name + ': [blocked]', 'system'); continue; }
                var key = nc + ',' + nr; if (!state.visibility[key] || state.visibility[key] === 'hidden') state.visibility[key] = 'revealed';
                if (type === 'empty') engine.printLine('  ' + d.name + ': Corridor', 'info');
                else engine.printLine('  ' + d.name + ': ' + config.nodes[type].label, 'node-info');
            }
            engine.updateGrid(); engine.saveState();
        }

        function cmdMove(args) {
            if (!args.length) { engine.printLine('Usage: move <direction>', 'error'); return; }
            var dirMap = {'north':[0,-1],'n':[0,-1],'south':[0,1],'s':[0,1],'east':[1,0],'e':[1,0],'west':[-1,0],'w':[-1,0]};
            var dir = args[0].toLowerCase(); if (!dirMap[dir]) { engine.printLine('Unknown direction: ' + args[0], 'error'); return; }
            var d = dirMap[dir], nc = state.position.col + d[0], nr = state.position.row + d[1];
            if (nc < 0 || nc >= config.grid.cols || nr < 0 || nr >= config.grid.rows) { engine.printLine('Edge of server. Cannot move ' + dir + '.', 'error'); return; }
            var cellType = config.grid.cells[nr][nc]; if (cellType === 'wall') { engine.printLine('Blocked. No path ' + dir + '.', 'error'); return; }
            state.position = { col: nc, row: nr }; state.visibility[nc + ',' + nr] = 'visited';
            if (cellType !== 'empty') state.nodesDiscovered.add(cellType);
            engine.revealAdjacent(nc, nr);
            var dirName = {n:'north',s:'south',e:'east',w:'west'}[dir] || dir;
            if (cellType === 'empty') engine.printLine('Moving ' + dirName + '... Corridor.', 'system');
            else { var info = config.nodes[cellType]; engine.printLine('Moving ' + dirName + '... ' + info.label, 'success'); engine.printLine(info.desc, 'info'); }
            engine.updateGrid(); engine.saveState();
        }

        function cmdSchtasks(args) {
            if (curCell() !== 'task-scheduler') { engine.printLine('schtasks: must be at TASK SCHEDULER panel.', 'error'); return; }
            if (args.length > 0 && args[0].toLowerCase() === '/disable') {
                if (!state.rogueTaskFound) { engine.printLine('schtasks /disable: Run "schtasks" first to enumerate tasks.', 'warning'); return; }
                if (state.rogueTaskDisabled) { engine.printLine('Task \\Custom\\SyncUpdate is already disabled.', 'info'); return; }
                engine.printLine('', 'system'); engine.printLine('Disabling scheduled task \\Custom\\SyncUpdate...', 'system');
                engine.printLine('SUCCESS: The operation completed successfully.', 'success'); engine.printLine('Task \\Custom\\SyncUpdate set to DISABLED.', 'success');
                state.rogueTaskDisabled = true; engine.checkObjectives(); engine.updateGrid(); engine.saveState(); return;
            }
            engine.printLine('', 'system'); engine.printLine('schtasks /query /fo TABLE /nh', 'system'); engine.printLine('', 'system');
            engine.printLine('TaskName                    Status    Next Run', 'heading');
            engine.printLine('\\Microsoft\\Windows\\Defrag   Ready     03/10/2026 02:00', 'node-info');
            engine.printLine('\\Maintenance\\DiskCleanup    Ready     03/06/2026 01:00', 'node-info');
            engine.printLine('\\Custom\\SyncUpdate          Ready     Every 15 min', 'warning');
            engine.printLine('\\Microsoft\\Windows\\Backup   Ready     03/06/2026 03:00', 'node-info');
            engine.printLine('', 'system');
            engine.printLine('[!] SUSPICIOUS: \\Custom\\SyncUpdate runs every 15 minutes -- unusual frequency.', 'warning');
            engine.printLine('[!] Non-standard path. Publisher: Unknown. Created: 03/05/2026 03:12', 'warning');
            engine.printLine('', 'system'); engine.printLine('Use "schtasks /disable" to disable the rogue task.', 'info');
            state.rogueTaskFound = true; engine.checkObjectives(); engine.saveState();
        }

        function cmdSc(args) {
            if (curCell() !== 'services-panel') { engine.printLine('sc: must be at SERVICES panel.', 'error'); return; }
            if (args.length > 0 && args[0].toLowerCase() === 'stop') {
                if (!state.serviceViewed) { engine.printLine('sc stop: Run "sc" first to enumerate services.', 'warning'); return; }
                if (state.maliciousServiceStopped) { engine.printLine('sysmonitor_x64 is already stopped.', 'info'); return; }
                engine.printLine('', 'system'); engine.printLine('[SC] StopService: sysmonitor_x64', 'system');
                engine.printLine('SERVICE_NAME: sysmonitor_x64', 'heading');
                engine.printLine('        STATE              : 1  STOPPED', 'success');
                engine.printLine('[+] sysmonitor_x64 terminated. Binary: C:\\ProgramData\\svchost64.exe', 'success');
                state.maliciousServiceStopped = true; engine.checkObjectives(); engine.updateGrid(); engine.saveState(); return;
            }
            engine.printLine('', 'system'); engine.printLine('sc query type= all state= all', 'system'); engine.printLine('', 'system');
            engine.printLine('SERVICE_NAME        STATE          DISPLAY_NAME', 'heading');
            engine.printLine('wuauserv           RUNNING        Windows Update', 'node-info');
            engine.printLine('WinRM              RUNNING        WS-Management', 'node-info');
            engine.printLine('sysmonitor_x64     RUNNING        System Monitor Helper', 'warning');
            engine.printLine('W32Time            RUNNING        Windows Time', 'node-info');
            engine.printLine('', 'system');
            engine.printLine('[!] SUSPICIOUS: sysmonitor_x64 -- not a known Windows service.', 'warning');
            engine.printLine('[!] Binary: C:\\ProgramData\\svchost64.exe', 'warning');
            engine.printLine('Use "sc stop sysmonitor_x64" to terminate.', 'info');
            state.serviceViewed = true; engine.saveState();
        }

        function cmdNet(args) {
            if (curCell() !== 'user-accounts') { engine.printLine('net: must be at USER ACCOUNTS panel.', 'error'); return; }
            var fullCmd = args.join(' ').toLowerCase();
            if (fullCmd.indexOf('active:no') !== -1 || fullCmd.indexOf('svc_backup') !== -1) {
                if (!state.userViewed) { engine.printLine('net user: Run "net" first to enumerate accounts.', 'warning'); return; }
                if (state.unauthorizedUserDisabled) { engine.printLine('svc_backup is already disabled.', 'info'); return; }
                engine.printLine('', 'system'); engine.printLine('net user svc_backup /active:no', 'system');
                engine.printLine('The command completed successfully.', 'success');
                engine.printLine('[+] Account svc_backup set to INACTIVE.', 'success');
                state.unauthorizedUserDisabled = true; engine.checkObjectives(); engine.updateGrid(); engine.saveState(); return;
            }
            engine.printLine('', 'system'); engine.printLine('net user', 'system'); engine.printLine('', 'system');
            engine.printLine('User Name              Status    Last Logon', 'heading');
            engine.printLine('Administrator          Active    03/05/2026 14:22', 'node-info');
            engine.printLine('svc_sql                Active    03/04/2026 08:00', 'node-info');
            engine.printLine('svc_backup             Active    03/05/2026 03:14', 'warning');
            engine.printLine('Guest                  Disabled  Never', 'node-info');
            engine.printLine('', 'system');
            engine.printLine('[!] SUSPICIOUS: svc_backup -- created 03/05/2026 at 03:14.', 'warning');
            engine.printLine('Use "net user svc_backup /active:no" to disable.', 'info');
            state.userViewed = true; engine.saveState();
        }

        function cmdWevtutil() {
            if (curCell() !== 'event-viewer') { engine.printLine('wevtutil: must be at EVENT VIEWER panel.', 'error'); return; }
            engine.printLine('', 'system'); engine.printLine('wevtutil qe Security /c:10 /rd:true /f:text', 'system'); engine.printLine('', 'system');
            engine.printLine('Event ID  Level    Source          Message', 'heading');
            engine.printLine('4624      Info     Security        Logon success -- Administrator', 'node-info');
            engine.printLine('4625      Warning  Security        Logon failure -- svc_backup (3 attempts)', 'warning');
            engine.printLine('4720      Warning  Security        New user created: svc_backup', 'warning');
            engine.printLine('4688      Info     Security        Process created: svchost64.exe (PID 4892)', 'warning');
            engine.printLine('7045      Warning  System          Service installed: sysmonitor_x64', 'warning');
            engine.printLine('', 'system');
            if (state.rogueTaskDisabled && state.maliciousServiceStopped && state.unauthorizedUserDisabled) {
                engine.printLine('Checking for post-remediation events...', 'system'); engine.printLine('', 'system');
                engine.printLine('4689      Info     Security        Process terminated: svchost64.exe', 'success');
                engine.printLine('7036      Info     System          Service stopped: sysmonitor_x64', 'success');
                engine.printLine('4725      Info     Security        Account disabled: svc_backup', 'success');
                engine.printLine('4702      Info     Security        Scheduled task disabled: \\Custom\\SyncUpdate', 'success');
                engine.printLine('', 'system');
                engine.printLine('[+] All remediation events confirmed in event log.', 'success');
                state.remediationVerified = true;
            } else {
                engine.printLine('[!] Threat indicators still active. Complete all remediation steps first:', 'warning');
                if (!state.rogueTaskDisabled) engine.printLine('    [ ] Disable rogue scheduled task (schtasks /disable)', 'system');
                if (!state.maliciousServiceStopped) engine.printLine('    [ ] Stop malicious service (sc stop sysmonitor_x64)', 'system');
                if (!state.unauthorizedUserDisabled) engine.printLine('    [ ] Disable unauthorized user (net user svc_backup /active:no)', 'system');
                engine.printLine('', 'system'); engine.printLine('Return here after completing all actions to verify.', 'info');
            }
            engine.checkObjectives(); engine.saveState();
        }

        function cmdReg() {
            if (curCell() !== 'registry-editor') { engine.printLine('reg: must be at REGISTRY panel.', 'error'); return; }
            engine.printLine('', 'system'); engine.printLine('reg query HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run', 'system'); engine.printLine('', 'system');
            engine.printLine('    WindowsUpdate    REG_SZ    C:\\ProgramData\\svchost64.exe', 'warning');
            engine.printLine('    SecurityHealth   REG_SZ    C:\\Program Files\\Windows Defender\\...', 'node-info');
            engine.printLine('', 'system');
            engine.printLine('[!] SUSPICIOUS: "WindowsUpdate" key points to C:\\ProgramData\\svchost64.exe', 'warning');
            state.nodesDiscovered.add('registry-editor'); engine.saveState();
        }

        function cmdGpresult() {
            if (curCell() !== 'group-policy') { engine.printLine('gpresult: must be at GROUP POLICY panel.', 'error'); return; }
            engine.printLine('', 'system'); engine.printLine('gpresult /r', 'system'); engine.printLine('', 'system');
            engine.printLine('Applied Group Policy Objects', 'heading');
            engine.printLine('    Default Domain Policy', 'node-info');
            engine.printLine('    Server Hardening Baseline', 'node-info');
            engine.printLine('    Audit Policy -- Enhanced', 'node-info');
            engine.printLine('', 'system'); engine.printLine('[*] GPO audit policy is active -- all actions are logged.', 'info');
            state.nodesDiscovered.add('group-policy'); engine.saveState();
        }

        function cmdStatus() {
            var cellType = curCell(), posLabel = (cellType !== 'empty' && cellType !== 'wall') ? config.nodes[cellType].label : 'Corridor';
            engine.printLine('', 'system'); engine.printLine('\u2550\u2550\u2550 STATUS \u2550\u2550\u2550', 'heading');
            engine.printLine('Server: SRV-DC01 (corp.hexworth.local)', 'info'); engine.printLine('Position: ' + posLabel, 'info');
            engine.printLine('Panels accessed: ' + state.nodesDiscovered.size + ' / 8', 'info'); engine.printLine('Commands used: ' + state.agentCmdCount, 'info');
            engine.printLine('', 'system'); engine.printLine('Remediation Status:', 'heading');
            engine.printLine('  Rogue task:    ' + (state.rogueTaskDisabled ? 'DISABLED' : state.rogueTaskFound ? 'FOUND' : 'UNKNOWN'), state.rogueTaskDisabled ? 'success' : 'system');
            engine.printLine('  Mal. service:  ' + (state.maliciousServiceStopped ? 'STOPPED' : 'RUNNING'), state.maliciousServiceStopped ? 'success' : 'warning');
            engine.printLine('  Unauth user:   ' + (state.unauthorizedUserDisabled ? 'DISABLED' : 'ACTIVE'), state.unauthorizedUserDisabled ? 'success' : 'warning');
            engine.printLine('  Verified:      ' + (state.remediationVerified ? 'YES' : 'PENDING'), state.remediationVerified ? 'success' : 'system');
        }

        function executeCommand(input) {
            state.agentCmdCount++;
            engine.printLine(config.promptText + input, 'prompt-echo');
            var parts = input.trim().split(/\s+/), cmd = parts[0].toLowerCase(), args = parts.slice(1);
            switch (cmd) {
                case 'scan':     cmdScan(); break;
                case 'move':     cmdMove(args); break;
                case 'schtasks': cmdSchtasks(args); break;
                case 'sc':       cmdSc(args); break;
                case 'net':      cmdNet(args); break;
                case 'wevtutil': cmdWevtutil(); break;
                case 'reg':      cmdReg(); break;
                case 'gpresult': cmdGpresult(); break;
                case 'status':   cmdStatus(); break;
                case 'help':
                    engine.printLine('', 'system'); engine.printLine('\u2550\u2550\u2550 COMMAND REFERENCE \u2550\u2550\u2550', 'heading');
                    engine.printLine('  scan / move <dir> / status / help / clear', 'info');
                    engine.printLine('  schtasks [/disable]    List/disable scheduled tasks [TASK SCHEDULER]', 'info');
                    engine.printLine('  sc [stop ...]          List/stop services [SERVICES]', 'info');
                    engine.printLine('  net [user ... /active:no]  List/disable users [USER ACCOUNTS]', 'info');
                    engine.printLine('  wevtutil               View event logs [EVENT VIEWER]', 'info');
                    engine.printLine('  reg                    View registry [REGISTRY]', 'info');
                    engine.printLine('  gpresult               View GPOs [GROUP POLICY]', 'info');
                    engine.printLine('Navigate to the correct panel before running admin commands.', 'system'); break;
                case 'clear': outputConsole.innerHTML = ''; break;
                default:
                    engine.printLine('\'' + cmd + '\' is not recognized as an internal or external command.', 'error');
                    engine.printLine('Type "help" for available commands.', 'system');
            }
        }

        termInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { var cmd = this.value.trim(); if (cmd) { history.push(cmd); histIdx = history.length; executeCommand(cmd); } this.value = ''; }
            else if (e.key === 'ArrowUp') { e.preventDefault(); if (histIdx > 0) { histIdx--; this.value = history[histIdx]; } }
            else if (e.key === 'ArrowDown') { e.preventDefault(); if (histIdx < history.length - 1) { histIdx++; this.value = history[histIdx]; } else { histIdx = history.length; this.value = ''; } }
        });
        editorPanel.addEventListener('click', function(e) { if (e.target.tagName !== 'INPUT') termInput.focus(); });

        // Briefing
        engine.printLine('\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557', 'heading');
        engine.printLine('\u2551  MISSION: WINDOWS-CMD-02 -- BLUE SCREEN PROTOCOL  \u2551', 'heading');
        engine.printLine('\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563', 'heading');
        for (var b = 0; b < config.briefing.length; b++) engine.printLine('\u2551  ' + config.briefing[b] + Array(Math.max(1, 46 - config.briefing[b].length)).join(' ') + '\u2551', 'heading');
        engine.printLine('\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D', 'heading');
        engine.printLine('', 'system');
        engine.printLine('[SYS] Operator online at TASK SCHEDULER (SRV-DC01)', 'success');
        engine.printLine('[SYS] Type "help" for command reference', 'info');
        engine.printLine('[SYS] Type "scan" to survey the area', 'info');
        engine.printLine('', 'system');
        termInput.focus();
    })();
    </script>
</body>
</html>
