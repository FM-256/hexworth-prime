<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECON-03: Phantom Network | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <style>
        .grid-cell[data-type="rogue-ap"]:not(.vis-hidden) { border-left: 2px solid rgba(255,60,60,0.5); }
        .grid-cell[data-type="vpn-gate"].vpn-active:not(.vis-hidden) { border-left: 2px solid rgba(57,255,20,0.5); }
        .grid-cell[data-type="honeypot-1"]:not(.vis-hidden):not(.wall),
        .grid-cell[data-type="honeypot-2"]:not(.vis-hidden):not(.wall) { border-left: 2px solid rgba(200,0,255,0.45); }
        .grid-cell[data-type="staging-server"]:not(.vis-hidden) { border-left: 2px solid rgba(255,165,0,0.5); }
        .grid-cell[data-type="exfil-endpoint"]:not(.vis-hidden) { border-left: 2px solid rgba(255,165,0,0.5); }
    </style>
    <script src="../../components/ModuleProgress.js"></script>
</head>
<body>
    <div id="operator-root"></div>
    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../engine/TerminalInterpreter.js"></script>
    <script src="../configs/recon-03.config.js"></script>
    <script>
    /* RECON-03: Phantom Network -- domain commands defined in config */
    (function() {
        var engine = OperatorEngine.init(RECON_03_CONFIG);
        var agent  = AgentBridge.create(engine);
        var ti = TerminalInterpreter.init(RECON_03_CONFIG, engine, agent);
    })();
    </script>
</body>
</html>
