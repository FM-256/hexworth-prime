<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECON-02: Deep Sweep | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <style>
        .editor-panel { background: #080a0e; }
        .editor-area { display: none; }
        .editor-toolbar { display: none; }
        .output-console { flex: 1; }
        .term-input-row { display: flex; align-items: center; padding: 8px 14px; border-top: 1px solid rgba(57,255,20,0.1); background: #0a0c12; flex-shrink: 0; }
        .term-prompt-text { color: #39ff14; font-size: 0.78rem; white-space: nowrap; margin-right: 8px; font-family: var(--op-font); }
        .term-input { flex: 1; background: transparent; border: none; outline: none; color: #76ff03; font-family: var(--op-font); font-size: 0.78rem; caret-color: #39ff14; }
        .grid-cell[data-type="vpn-gateway"].pivoted:not(.vis-hidden) { border-left: 2px solid rgba(57,255,20,0.5); }
        .grid-cell[data-type="honeypot"]:not(.vis-hidden):not(.wall) { border-left: 2px solid rgba(200,0,255,0.45); }
    </style>
    <script src="../../components/ModuleProgress.js"></script>
</head>
<body>
    <div id="operator-root"></div>

    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/recon-02.config.js"></script>
    <script>
    /* ================================================================
       RECON-02: Deep Sweep -- Terminal Command Layer
       Custom commands: scan, move, ping, nmap, traceroute, pivot.
       Custom state: pivoted, honeypotTriggered, honeypotPinged,
                     dmzNodesMapped, dcHostnameFound.
       ================================================================ */
    (function() {
        var config = RECON_02_CONFIG;
        var engine = OperatorEngine.init(config);
        var agent  = AgentBridge.create(engine);
        var state  = engine.getState();

        // Initialize custom state
        state.pivoted = false;
        state.honeypotTriggered = false;
        state.honeypotPinged = false;
        state.dmzNodesMapped = new Set();
        state.dcHostnameFound = false;

        // Starting node is a DMZ node
        state.dmzNodesMapped.add('edge-router');

        var DMZ_NODES = new Set(config.dmzNodes);

        // Replace editor panel with terminal
        var editorPanel = document.querySelector('.editor-panel');
        editorPanel.innerHTML = '';
        var termBar = document.createElement('div');
        termBar.style.cssText = 'padding:7px 14px;background:#0c0e14;border-bottom:1px solid rgba(57,255,20,0.1);display:flex;align-items:center;gap:6px;flex-shrink:0;';
        for (var i = 0; i < 3; i++) { var dot = document.createElement('div'); dot.style.cssText = 'width:7px;height:7px;border-radius:50%;background:rgba(57,255,20,0.3);'; termBar.appendChild(dot); }
        var barLabel = document.createElement('span'); barLabel.style.cssText = 'font-size:0.55rem;color:rgba(57,255,20,0.35);letter-spacing:0.1em;margin-left:6px;'; barLabel.textContent = 'TERMINAL';
        termBar.appendChild(barLabel);
        editorPanel.appendChild(termBar);
        var outputConsole = document.querySelector('.output-console');
        editorPanel.appendChild(outputConsole);
        var inputRow = document.createElement('div'); inputRow.className = 'term-input-row';
        var promptSpan = document.createElement('span'); promptSpan.className = 'term-prompt-text'; promptSpan.textContent = config.promptText;
        var termInput = document.createElement('input'); termInput.type = 'text'; termInput.className = 'term-input'; termInput.autocomplete = 'off'; termInput.spellcheck = false;
        inputRow.appendChild(promptSpan); inputRow.appendChild(termInput);
        editorPanel.appendChild(inputRow);

        var history = []; var histIdx = -1;
        function padRight(s, n) { while (s.length < n) s += ' '; return s; }

        function isInternalCell(col, row) {
            var type = config.grid.cells[row][col];
            if (type === 'internal-db' || type === 'internal-dc') return true;
            if (row >= 2 && col >= 3 && type === 'empty') return true;
            return false;
        }

        function cmdScan() {
            var s = engine.getState(), c = engine.getConfig();
            var col = s.position.col, row = s.position.row;
            var cellType = c.grid.cells[row][col];
            engine.printLine('Scanning area...', 'system');
            engine.printLine('', 'system');
            if (cellType !== 'empty' && cellType !== 'wall') {
                var cur = c.nodes[cellType];
                engine.printLine('Current: ' + cur.label + ' (' + cur.ip + ')', 'heading');
                engine.printLine(cur.desc, 'info');
                if (DMZ_NODES.has(cellType)) s.dmzNodesMapped.add(cellType);
            } else { engine.printLine('Current: Clear path (no node)', 'heading'); }
            engine.printLine('', 'system');
            engine.printLine('Adjacent:', 'heading');
            var dirs = [{name:'North',dc:0,dr:-1},{name:'South',dc:0,dr:1},{name:'East',dc:1,dr:0},{name:'West',dc:-1,dr:0}];
            for (var i = 0; i < dirs.length; i++) {
                var d = dirs[i], nc = col + d.dc, nr = row + d.dr;
                if (nc < 0 || nc >= c.grid.cols || nr < 0 || nr >= c.grid.rows) { engine.printLine('  ' + d.name + ': [network edge]', 'system'); continue; }
                var type = c.grid.cells[nr][nc];
                if (type === 'wall') { engine.printLine('  ' + d.name + ': [blocked]', 'system'); continue; }
                var key = nc + ',' + nr;
                if (!s.visibility[key] || s.visibility[key] === 'hidden') s.visibility[key] = 'revealed';
                if (type === 'empty') engine.printLine('  ' + d.name + ': Clear path', 'info');
                else { var info = c.nodes[type]; engine.printLine('  ' + d.name + ': ' + info.label + ' (' + info.ip + ')', 'node-info'); if (DMZ_NODES.has(type)) s.dmzNodesMapped.add(type); }
            }
            engine.updateGrid(); engine.checkObjectives(); engine.saveState();
        }

        function cmdMove(args) {
            if (!args.length) { engine.printLine('Usage: move <direction>', 'error'); return; }
            var dirMap = {'north':[0,-1],'n':[0,-1],'south':[0,1],'s':[0,1],'east':[1,0],'e':[1,0],'west':[-1,0],'w':[-1,0]};
            var dir = args[0].toLowerCase(); if (!dirMap[dir]) { engine.printLine('Unknown direction: ' + args[0], 'error'); return; }
            var s = engine.getState(), c = engine.getConfig(), d = dirMap[dir];
            var nc = s.position.col + d[0], nr = s.position.row + d[1];
            if (nc < 0 || nc >= c.grid.cols || nr < 0 || nr >= c.grid.rows) { engine.printLine('Edge of network. Cannot move ' + dir + '.', 'error'); return; }
            var cellType = c.grid.cells[nr][nc];
            if (cellType === 'wall') { engine.printLine('Blocked. No traversable path ' + dir + '.', 'error'); return; }
            if (!s.pivoted && isInternalCell(nc, nr)) {
                engine.printLine('[!] Internal subnet unreachable.', 'warning');
                engine.printLine('VPN tunnel not established. Navigate to VPN-GATEWAY and use "pivot".', 'info');
                return;
            }
            s.position = { col: nc, row: nr }; s.visibility[nc + ',' + nr] = 'visited';
            if (cellType !== 'empty') { s.nodesDiscovered.add(cellType); if (DMZ_NODES.has(cellType)) s.dmzNodesMapped.add(cellType); }
            engine.revealAdjacent(nc, nr);
            var dirFull = {n:'north',s:'south',e:'east',w:'west'}; var dirName = dirFull[dir] || dir;
            if (cellType === 'empty') engine.printLine('Moving ' + dirName + '... Clear path.', 'system');
            else {
                var info = c.nodes[cellType];
                engine.printLine('Moving ' + dirName + '... ' + info.label + ' (' + info.ip + ')', 'success');
                engine.printLine(info.desc, 'info');
                if (cellType === 'vpn-gateway' && !s.pivoted) { engine.printLine('', 'system'); engine.printLine('[*] VPN concentrator reached. Use "pivot" to establish tunnel.', 'info'); }
            }
            engine.checkObjectives(); engine.updateGrid(); engine.saveState();
        }

        function cmdPing(args) {
            if (!args.length) { engine.printLine('Usage: ping <node name or IP>', 'error'); return; }
            var target = args.join(' '), node = engine.resolveNode(target);
            if (!node) { engine.printLine('ping: unknown host ' + target, 'error'); return; }
            if (node.visibility === 'hidden') { engine.printLine('Request timed out. No route to host.', 'error'); return; }
            var info = node.info, s = engine.getState();
            var ms = (Math.random() * 5 + 0.5).toFixed(1);
            engine.printLine('PING ' + info.ip + ' (' + info.label + ')', 'system');
            engine.printLine('64 bytes from ' + info.ip + ': time=' + ms + 'ms', 'node-info');
            if (node.type === 'honeypot') {
                s.honeypotPinged = true;
                engine.printLine('Host is UP -- ' + info.desc, 'info');
                engine.printLine('', 'system');
                engine.printLine('[*] Notice: Unusual response signature. Multiple services detected.', 'warning');
                engine.printLine('[*] Proceed with caution before deeper enumeration.', 'warning');
            } else { engine.printLine('Host is UP -- ' + info.desc, 'info'); }
        }

        function cmdNmap(args) {
            if (!args.length) { engine.printLine('Usage: nmap <node name or IP>', 'error'); return; }
            var target = args.join(' '), node = engine.resolveNode(target);
            if (!node) { engine.printLine('Failed to resolve: ' + target, 'error'); return; }
            if (node.visibility === 'hidden') { engine.printLine('Host seems down. Scan the area first.', 'error'); return; }
            var info = node.info, s = engine.getState();
            engine.printLine('', 'system');
            engine.printLine('Starting Nmap 7.94 scan on ' + info.ip + '...', 'system');
            engine.printLine('', 'system');
            engine.printLine('Nmap scan report for ' + info.label + ' (' + info.ip + ')', 'heading');
            engine.printLine('Host is up (0.003s latency)', 'info');
            engine.printLine('OS: ' + info.os, 'node-info');
            engine.printLine('', 'system');
            engine.printLine('PORT              STATE    SERVICE', 'heading');
            for (var p = 0; p < info.ports.length; p++) {
                var parts = info.ports[p].split('/');
                engine.printLine(padRight(parts[0] + '/tcp', 18) + 'open     ' + parts[1].toLowerCase(), 'node-info');
            }
            s.nmapTargets.add(node.type);
            if (node.type === 'honeypot') {
                s.nodesDiscovered.add('honeypot');
                if (!s.honeypotPinged) {
                    s.honeypotTriggered = true;
                    engine.printLine('', 'system');
                    engine.printLine('[!] ALERT: Honeypot triggered! IDS notification sent.', 'error');
                    engine.printLine('[!] Aggressive scan detected by deception layer. Alert logged.', 'error');
                } else {
                    engine.printLine('', 'system');
                    engine.printLine('[*] Analysis: Service signatures inconsistent across reported ports.', 'warning');
                    engine.printLine('[*] Response patterns indicate emulated services -- likely honeypot/canary system.', 'warning');
                    engine.printLine('[*] Honeypot flagged. Avoid further interaction.', 'success');
                }
            }
            if (node.type === 'internal-dc' && !s.dcHostnameFound) {
                s.dcHostnameFound = true;
                engine.printLine('', 'system');
                engine.printLine('[+] NetBIOS hostname enumerated:', 'success');
                engine.printLine('    HEXDC01.corp.hexworth.local', 'success');
                engine.printLine('[+] Domain: corp.hexworth.local', 'success');
                engine.printLine('[+] AD Forest: hexworth.local', 'success');
            }
            engine.printLine('', 'system');
            engine.checkObjectives(); engine.updateGrid(); engine.saveState();
        }

        function cmdTraceroute(args) {
            if (!args.length) { engine.printLine('Usage: traceroute <node name or IP>', 'error'); return; }
            var target = args.join(' '), node = engine.resolveNode(target);
            if (!node) { engine.printLine('traceroute: unknown host ' + target, 'error'); return; }
            if (node.visibility === 'hidden') { engine.printLine('traceroute: No route to host. Scan the area first.', 'error'); return; }
            var info = node.info, s = engine.getState();
            engine.printLine('', 'system');
            engine.printLine('traceroute to ' + info.ip + ' (' + info.label + ')', 'heading');
            var curType = config.grid.cells[s.position.row][s.position.col];
            if (node.type === curType) { engine.printLine(' 1  ' + info.ip + '  0.1ms  [local]', 'node-info'); return; }
            if (node.type === 'internal-db' || node.type === 'internal-dc') {
                engine.printLine(' 1  172.16.0.1    (EDGE-ROUTER)   1.2ms', 'node-info');
                engine.printLine(' 2  172.16.0.5    (CORE-SWITCH)   1.8ms', 'node-info');
                engine.printLine(' 3  172.16.0.254  (VPN-GATEWAY)   2.4ms', 'node-info');
                if (!s.pivoted) engine.printLine(' 4  * * *  Request timed out (tunnel not established)', 'warning');
                else engine.printLine(' 4  ' + info.ip + '  (' + info.label + ')   3.1ms', 'node-info');
            } else if (node.type === 'vpn-gateway') {
                engine.printLine(' 1  172.16.0.1    (EDGE-ROUTER)   1.2ms', 'node-info');
                engine.printLine(' 2  172.16.0.5    (CORE-SWITCH)   1.8ms', 'node-info');
                engine.printLine(' 3  172.16.0.254  (VPN-GATEWAY)   2.4ms', 'node-info');
            } else if (node.type === 'honeypot') {
                engine.printLine(' 1  172.16.0.1    (EDGE-ROUTER)   1.2ms', 'node-info');
                engine.printLine(' 2  172.16.0.5    (CORE-SWITCH)   1.8ms', 'node-info');
                engine.printLine(' 3  172.16.2.99   (HONEYPOT)      2.1ms', 'node-info');
            } else {
                engine.printLine(' 1  172.16.0.1    (EDGE-ROUTER)   1.2ms', 'node-info');
                engine.printLine(' 2  ' + info.ip + '  (' + info.label + ')   1.9ms', 'node-info');
            }
            engine.printLine('', 'system');
        }

        function cmdPivot() {
            var s = engine.getState(), c = engine.getConfig();
            var cellType = c.grid.cells[s.position.row][s.position.col];
            if (cellType !== 'vpn-gateway') { engine.printLine('pivot: must be at VPN-GATEWAY node.', 'error'); engine.printLine('Navigate to VPN-GATEWAY (172.16.0.254) first.', 'system'); return; }
            if (s.pivoted) { engine.printLine('[*] IPSec tunnel already active. Internal subnet accessible.', 'info'); return; }
            engine.printLine('', 'system');
            engine.printLine('Establishing IPSec tunnel to 10.10.0.0/24...', 'system');
            engine.printLine('  Initiating IKE phase 1... OK', 'info');
            engine.printLine('  IKE phase 2 negotiation... OK', 'info');
            engine.printLine('  SA established. Encryption: AES-256-GCM', 'info');
            engine.printLine('', 'system');
            engine.printLine('[+] Tunnel UP. Internal subnet 10.10.0.0/24 accessible.', 'success');
            engine.printLine('[+] Routes added: 10.10.0.0/24 via 172.16.0.254', 'success');
            s.pivoted = true;
            s.visibility['3,2'] = s.visibility['3,2'] || 'revealed';
            engine.checkObjectives(); engine.updateGrid(); engine.saveState();
        }

        function cmdStatus() {
            var s = engine.getState(), c = engine.getConfig();
            var cellType = c.grid.cells[s.position.row][s.position.col];
            var posLabel = (cellType !== 'empty' && cellType !== 'wall') ? c.nodes[cellType].label : 'Clear path';
            engine.printLine('', 'system');
            engine.printLine('\u2550\u2550\u2550 STATUS \u2550\u2550\u2550', 'heading');
            engine.printLine('Position: (' + s.position.col + ',' + s.position.row + ') -- ' + posLabel, 'info');
            engine.printLine('Nodes discovered: ' + s.nodesDiscovered.size + ' / 8', 'info');
            engine.printLine('DMZ perimeter mapped: ' + s.dmzNodesMapped.size + ' / 3', 'info');
            engine.printLine('VPN pivot: ' + (s.pivoted ? 'ACTIVE' : 'INACTIVE'), s.pivoted ? 'success' : 'warning');
            engine.printLine('Honeypot status: ' + (s.honeypotTriggered ? 'TRIGGERED (alert logged)' : s.nodesDiscovered.has('honeypot') ? 'IDENTIFIED (clean)' : 'UNKNOWN'), s.honeypotTriggered ? 'error' : 'info');
            engine.printLine('Commands used: ' + s.agentCmdCount, 'info');
            engine.printLine('', 'system');
            engine.printLine('Objectives:', 'heading');
            var objText = ['Map 3 DMZ perimeter nodes (' + s.dmzNodesMapped.size + '/3)', 'Identify honeypot without triggering IDS', 'Establish VPN pivot to internal subnet', 'Exfiltrate DC hostname (nmap internal-dc)'];
            for (var j = 0; j < s.objectives.length; j++) { engine.printLine((s.objectives[j] ? ' [X] ' : ' [ ] ') + objText[j], s.objectives[j] ? 'success' : 'system'); }
        }

        function executeCommand(input) {
            var s = engine.getState(); s.agentCmdCount++;
            engine.printLine(config.promptText + input, 'prompt-echo');
            var parts = input.trim().split(/\s+/), cmd = parts[0].toLowerCase(), args = parts.slice(1);
            switch (cmd) {
                case 'scan':       cmdScan(); break;
                case 'move':       cmdMove(args); break;
                case 'ping':       cmdPing(args); break;
                case 'nmap':       cmdNmap(args); break;
                case 'traceroute': cmdTraceroute(args); break;
                case 'pivot':      cmdPivot(); break;
                case 'status':     cmdStatus(); break;
                case 'help':
                    engine.printLine('', 'system');
                    engine.printLine('\u2550\u2550\u2550 COMMAND REFERENCE \u2550\u2550\u2550', 'heading');
                    engine.printLine('  scan               Survey area, reveal adjacent nodes', 'info');
                    engine.printLine('  move <dir>         Move agent (north/south/east/west or n/s/e/w)', 'info');
                    engine.printLine('  ping <node>        Ping a node by name or IP', 'info');
                    engine.printLine('  nmap <node>        Deep scan -- ports, OS, vulnerabilities', 'info');
                    engine.printLine('  traceroute <node>  Show hop path to target node', 'info');
                    engine.printLine('  pivot              Establish VPN tunnel (must be at VPN-GATEWAY)', 'info');
                    engine.printLine('  status             Show position and objectives', 'info');
                    engine.printLine('  help               Show this reference', 'info');
                    engine.printLine('  clear              Clear terminal output', 'info');
                    engine.printLine('', 'system');
                    engine.printLine('Tip: ping a node before nmap to avoid triggering traps.', 'system');
                    break;
                case 'clear': outputConsole.innerHTML = ''; break;
                default:
                    engine.printLine('Unknown command: ' + cmd, 'error');
                    engine.printLine('Type "help" for available commands.', 'system');
            }
        }

        termInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { var cmd = this.value.trim(); if (cmd) { history.push(cmd); histIdx = history.length; executeCommand(cmd); } this.value = ''; }
            else if (e.key === 'ArrowUp') { e.preventDefault(); if (histIdx > 0) { histIdx--; this.value = history[histIdx]; } }
            else if (e.key === 'ArrowDown') { e.preventDefault(); if (histIdx < history.length - 1) { histIdx++; this.value = history[histIdx]; } else { histIdx = history.length; this.value = ''; } }
        });
        editorPanel.addEventListener('click', function(e) { if (e.target.tagName !== 'INPUT') termInput.focus(); });

        // Briefing
        engine.printLine('\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557', 'heading');
        engine.printLine('\u2551  MISSION: RECON-02 -- DEEP SWEEP            \u2551', 'heading');
        engine.printLine('\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563', 'heading');
        for (var b = 0; b < config.briefing.length; b++) {
            engine.printLine('\u2551  ' + config.briefing[b] + Array(Math.max(1, 39 - config.briefing[b].length)).join(' ') + '\u2551', 'heading');
        }
        engine.printLine('\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D', 'heading');
        engine.printLine('', 'system');
        engine.printLine('[SYS] Agent online at EDGE-ROUTER (172.16.0.1)', 'success');
        engine.printLine('[SYS] Type "help" for command reference', 'info');
        engine.printLine('[SYS] Type "scan" to survey the perimeter', 'info');
        engine.printLine('[SYS] WARNING: Deception systems active on this network.', 'warning');
        engine.printLine('', 'system');
        termInput.focus();
    })();
    </script>
</body>
</html>
