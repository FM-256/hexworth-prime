<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PYTHON-15: Perimeter Breach | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <script src="../../components/ModuleProgress.js"></script>
</head>
<body>
<h1 class="visually-hidden">PYTHON-15: Perimeter Breach</h1>
    <div id="operator-root"></div>

    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/OperatorInterpreter.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/python-15.config.js"></script>
    <script>
    /* PYTHON-15: Perimeter Breach — first 11x11 grid (121 cells).
       Corporate perimeter with 4 directional zones (N/E/S/W), each
       gated with a different tool requirement. Central core has DC
       and Vault. Nested loop sweeps are mandatory at this scale.
       10 servers + 2 core servers + 6 traps + 4 gates = 8 objectives. */
    (function() {
        var engine = OperatorEngine.init(PYTHON_15_CONFIG);
        var agent  = AgentBridge.create(engine);

        engine.editor.onRun(function() {
            var code = engine.editor.getCode();
            engine.editor.clearOutput();
            OperatorInterpreter.reset();
            OperatorInterpreter.run(code, agent, engine.printLine)
                .then(function(result) {
                    if (result.error) {
                        engine.printLine('Error: ' + result.error, 'error');
                    } else {
                        engine.printLine('Program complete. ' + result.cmdCount + ' agent commands executed.', 'system');
                    }
                });
        });

        engine.editor.onStop(function() {
            OperatorInterpreter.cancel();
        });
    })();
    </script>
</body>
</html>
