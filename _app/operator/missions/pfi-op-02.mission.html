<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFI-OP-02: The Scanner | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
</head>
<body>
<h1 class="visually-hidden">PFI-OP-02: The Scanner</h1>
    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/OperatorInterpreter.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/pfi-op-02.config.js"></script>
    <script>
    /* PFI-OP-02: The Scanner — 7x7 grid with 3 corridors of varying length.
       Forces students to write scan_row(length) with a parameter.
       Each corridor has a different distance: 6, 5, 3 cells.
       The varying lengths teach parameterized function calls. */
    (function() {
        var engine = OperatorEngine.init(PFI_OP_02_CONFIG);
        var agent  = AgentBridge.create(engine);

        engine.editor.onRun(function() {
            var code = engine.editor.getCode();
            engine.editor.clearOutput();
            OperatorInterpreter.reset();
            OperatorInterpreter.run(code, agent, engine.printLine)
                .then(function(result) {
                    if (result.error) {
                        engine.printLine('Error: ' + result.error, 'error');
                    } else {
                        engine.printLine('Program complete. ' + result.cmdCount + ' agent commands executed.', 'system');
                    }
                });
        });

        engine.editor.onStop(function() {
            OperatorInterpreter.cancel();
        });
    })();
    </script>
</body>
</html>
