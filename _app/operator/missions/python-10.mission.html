<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PYTHON-10: Ghost Protocol | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <script src="../../components/ModuleProgress.js"></script>
</head>
<body>
<h1 class="visually-hidden">PYTHON-10: Ghost Protocol</h1>
    <div id="operator-root"></div>

    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/OperatorInterpreter.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/python-10.config.js"></script>
    <script>
    /* PYTHON-10: Ghost Protocol — THE FINAL MISSION.
       10x10 grid. 4 department firewalls (nmap/exploit/spoof/decrypt).
       8 servers to catalog. 5 traps. 8 objectives. 6 integrity pips.
       Requires: def functions, for loops, if/elif chains, list building,
       scan data inspection, multi-phase execution, and strategic planning.
       This is the capstone of the entire Python Operator track. */
    (function() {
        var engine = OperatorEngine.init(PYTHON_10_CONFIG);
        var agent  = AgentBridge.create(engine);

        engine.editor.onRun(function() {
            var code = engine.editor.getCode();
            engine.editor.clearOutput();
            OperatorInterpreter.reset();
            OperatorInterpreter.run(code, agent, engine.printLine)
                .then(function(result) {
                    if (result.error) {
                        engine.printLine('Error: ' + result.error, 'error');
                    } else {
                        engine.printLine('Program complete. ' + result.cmdCount + ' agent commands executed.', 'system');
                    }
                });
        });

        engine.editor.onStop(function() {
            OperatorInterpreter.cancel();
        });
    })();
    </script>
</body>
</html>
