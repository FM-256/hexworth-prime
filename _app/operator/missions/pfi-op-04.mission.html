<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFI-OP-04: The Architect | Operator</title>
    <link rel="stylesheet" href="../engine/operator.css">
    <!-- Progress tracking bridge: records Operator completion in ModuleProgress -->
    <script src="../../components/FirebaseAuth.js"></script>
    <script src="../../components/ModuleProgress.js"></script>
</head>
<body>
<h1 class="visually-hidden">PFI-OP-04: The Architect</h1>
    <script src="../engine/OperatorEngine.js"></script>
    <script src="../engine/OperatorInterpreter.js"></script>
    <script src="../engine/AgentBridge.js"></script>
    <script src="../configs/pfi-op-04.config.js"></script>
    <script>
    /* PFI-OP-04: The Architect — 8x8 grid with 4 quadrants.
       Forces students to build helper functions (move_n, scan_quadrant)
       and compose them to navigate a cross-walled grid.
       Manual approach = 70+ lines. Building-block functions = ~25 lines.
       The symmetry IS the teacher: same helpers, different parameters. */
    (function() {
        var engine = OperatorEngine.init(PFI_OP_04_CONFIG);
        var agent  = AgentBridge.create(engine);

        engine.editor.onRun(function() {
            var code = engine.editor.getCode();
            engine.editor.clearOutput();
            OperatorInterpreter.reset();
            OperatorInterpreter.run(code, agent, engine.printLine)
                .then(function(result) {
                    if (result.error) {
                        engine.printLine('Error: ' + result.error, 'error');
                    } else {
                        engine.printLine('Program complete. ' + result.cmdCount + ' agent commands executed.', 'system');
                    }
                });
        });

        engine.editor.onStop(function() {
            OperatorInterpreter.cancel();
        });
    })();

    // Bridge: record Operator completion in ModuleProgress for PFI course hub
    (function() {
        var MISSION_ID = 'pfi-op-04';
        var HOUSE_ID = 'code';
        var COMP_KEY = 'hexworth_operator_' + MISSION_ID;
        var bridged = false;
        function tryBridge() {
            if (bridged) return;
            var saved = localStorage.getItem(COMP_KEY);
            if (saved && typeof window.ModuleProgress !== 'undefined') {
                try { if (JSON.parse(saved)) { bridged = true; window.ModuleProgress.complete(HOUSE_ID, MISSION_ID); } } catch(e) {}
            }
        }
        tryBridge();
        var poll = setInterval(function() { tryBridge(); if (bridged) clearInterval(poll); }, 2000);
        setTimeout(function() { clearInterval(poll); }, 1800000);
    })();
    </script>
</body>
</html>
