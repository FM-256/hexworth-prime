<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Hexworth Prime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', 'Consolas', monospace;
            overflow: hidden;
        }

        .loader {
            text-align: center;
            color: #888;
            position: relative;
            z-index: 10;
        }

        /* ── Tagline: Decode. Defend. Discover. ── */

        .tagline {
            margin-bottom: 32px;
            display: flex;
            justify-content: center;
            gap: 24px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .tagline.visible {
            opacity: 1;
        }

        .tagline-word {
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            color: #333;
            text-transform: uppercase;
            position: relative;
            min-width: 5.5em;
            text-align: center;
            transition: color 0.6s ease, text-shadow 0.6s ease;
        }

        .tagline-word.decoded {
            color: #606878;
        }

        .tagline-word.glow {
            color: #8898a8;
            text-shadow: 0 0 12px rgba(136,152,168,0.25);
        }

        .tagline-dot {
            color: #2a2a2a;
            transition: color 0.6s ease;
        }

        .tagline-word.decoded .tagline-dot {
            color: #404850;
        }

        /* ── Initializing text ── */

        .loader-text {
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            color: #333;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .loader-text.visible {
            opacity: 1;
        }

        /* ── Pulsing dots ── */

        .loader-dots {
            margin-top: 16px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .loader-dots.visible {
            opacity: 1;
        }

        .loader-dots span {
            display: inline-block;
            width: 5px;
            height: 5px;
            margin: 0 3px;
            background: #282828;
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out both;
        }

        .loader-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loader-dots span:nth-child(2) { animation-delay: -0.16s; }
        .loader-dots span:nth-child(3) { animation-delay: 0; }

        @keyframes pulse {
            0%, 80%, 100% {
                transform: scale(0.6);
                background: #222;
            }
            40% {
                transform: scale(1);
                background: #444;
            }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="tagline" id="tagline">
            <span class="tagline-word" id="word0" data-target="Decode"><span class="tagline-chars"></span><span class="tagline-dot">.</span></span>
            <span class="tagline-word" id="word1" data-target="Defend"><span class="tagline-chars"></span><span class="tagline-dot">.</span></span>
            <span class="tagline-word" id="word2" data-target="Discover"><span class="tagline-chars"></span><span class="tagline-dot">.</span></span>
        </div>
        <div class="loader-text" id="loaderText">INITIALIZING</div>
        <div class="loader-dots" id="loaderDots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Interactions -->
    <script src="_app/digital-life/interactions/PlayerTools.js"></script>
    <!-- Behaviors -->
    <script src="_app/digital-life/behaviors/Hunting.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // Initialize Digital Life
            const digitalLife = DigitalLife.createAmbient({
                population: { initial: 8, min: 5, max: 12 },
                shootingStars: { enabled: false },
                cosmicEvents: { enabled: false },
                blackHole: { enabled: false },
                predators: { enabled: false }
            });
            digitalLife.init(document.body);

            // ── Transmission Decode Effect ──
            // Each word scrambles through random chars before resolving

            const glyphs = '01!@#$%^&*<>{}[]|/\\~`?:;_=+-';
            const words = document.querySelectorAll('.tagline-word');
            const tagline = document.getElementById('tagline');

            function decodeWord(el, delay) {
                const target = el.dataset.target;
                const charsEl = el.querySelector('.tagline-chars');
                const len = target.length;
                let iterations = 0;
                const maxIterations = 12;       // scramble cycles before locking
                const lockFrom = 0;             // characters lock left-to-right
                let locked = 0;

                setTimeout(() => {
                    const interval = setInterval(() => {
                        let display = '';
                        for (let i = 0; i < len; i++) {
                            if (i < locked) {
                                display += target[i];
                            } else {
                                display += glyphs[Math.floor(Math.random() * glyphs.length)];
                            }
                        }
                        charsEl.textContent = display;

                        iterations++;

                        // Lock one more character every few cycles
                        if (iterations % 3 === 0 && locked < len) {
                            locked++;
                        }

                        // Fully decoded
                        if (locked >= len) {
                            clearInterval(interval);
                            charsEl.textContent = target;
                            el.classList.add('decoded');

                            // Brief pause then subtle glow
                            setTimeout(() => el.classList.add('glow'), 200);
                        }
                    }, 50);
                }, delay);
            }

            // Sequence: show tagline container → decode words staggered → then show loader

            // 1. Show tagline container
            setTimeout(() => {
                tagline.classList.add('visible');
            }, 300);

            // 2. Decode each word with stagger
            decodeWord(words[0], 500);      // "Decode"  — starts at 0.5s
            decodeWord(words[1], 1200);     // "Defend"  — starts at 1.2s
            decodeWord(words[2], 1900);     // "Discover" — starts at 1.9s

            // 3. Show INITIALIZING after all words decoded (~2.8s)
            setTimeout(() => {
                document.getElementById('loaderText').classList.add('visible');
                document.getElementById('loaderDots').classList.add('visible');
            }, 3000);

            // 4. Redirect to SSO after the full sequence
            setTimeout(function() {
                window.location.href = '_app/index.html';
            }, 4200);
        });
    </script>
</body>
</html>
