<!DOCTYPE html>
<html><head><style>

body { background:#0a0a0f; padding:20px; }

.content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px; }
.content-card { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: rgba(56,189,248,0.2); border: 1px solid rgba(56,189,248,0.4); border-radius: 8px; color:#fff; }
</style></head>
<body>
<div class="container">
  <div class="content-grid">
    <a href="#" class="content-card"><div>Single Card Presentation Module Title Here</div></a>
  </div>
</div>
</body></html>
