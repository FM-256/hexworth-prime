<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexworth Prime — Icon Library</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e1a;
            color: #c8d6e5;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 2rem;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #00e5ff;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .subtitle {
            text-align: center;
            color: #5a6a7a;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .stats {
            text-align: center;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(0, 229, 255, 0.05);
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
        }
        .stat-num { color: #00e5ff; font-size: 1.4rem; font-weight: 700; }
        .stat-label { color: #5a6a7a; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        .search-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .search-bar input {
            background: #111827;
            border: 1px solid rgba(0, 229, 255, 0.2);
            color: #c8d6e5;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            width: 100%;
            max-width: 400px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar input:focus {
            border-color: #00e5ff;
        }
        .search-bar input::placeholder { color: #3a4a5a; }
        .section-title {
            color: #00e5ff;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 2rem 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(0, 229, 255, 0.15);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 1rem;
        }
        .card {
            background: #111827;
            border: 1px solid rgba(0, 229, 255, 0.1);
            border-radius: 8px;
            padding: 1rem 0.5rem;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }
        .card:hover {
            border-color: #00e5ff;
            background: #151d2e;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.1);
        }
        .card.copied {
            border-color: #10b981;
        }
        .card.copied::after {
            content: 'Copied!';
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 0.6rem;
            color: #10b981;
            font-weight: 600;
        }
        .card img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            margin-bottom: 0.5rem;
            image-rendering: auto;
        }
        .card .name {
            font-size: 0.75rem;
            color: #8892a0;
            word-break: break-word;
            line-height: 1.3;
        }
        .card .refs {
            font-size: 0.6rem;
            color: #3a4a5a;
            margin-top: 0.3rem;
        }
        .card.unused { opacity: 0.4; }
        .card.unused:hover { opacity: 0.8; }
        .hidden { display: none; }
        .copy-hint {
            text-align: center;
            color: #3a4a5a;
            font-size: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .preview-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
        }
        .preview-overlay.active { display: flex; }
        .preview-overlay img {
            width: 256px;
            height: 256px;
            object-fit: contain;
            border: 2px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            background: #111827;
        }
        .preview-overlay .preview-name {
            color: #00e5ff;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .preview-overlay .preview-path {
            color: #5a6a7a;
            font-size: 0.8rem;
            font-family: monospace;
        }
        .preview-overlay .preview-refs {
            color: #8892a0;
            font-size: 0.8rem;
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .card img { width: 48px; height: 48px; }
        }
    </style>
</head>
<body>
    <h1>Hexworth Icon Library</h1>
    <p class="subtitle">Click any icon to copy its path</p>
    <div class="stats" id="stats"></div>

    </div>
    <p class="copy-hint">Click = copy path &nbsp;|&nbsp; Double-click = preview</p>

    <div class="grid" id="medals-grid"></div>

    <div class="preview-overlay" id="preview" onclick="this.classList.remove('active')">

        <div class="preview-name" id="preview-name"></div>
        <div class="preview-path" id="preview-path"></div>
        <div class="preview-refs" id="preview-refs"></div>

function init() {
    const icons = ICONS.filter(i => i.file.startsWith('icon-'));
    const medals = ICONS.filter(i => !i.file.startsWith('icon-'));
    const totalRefs = ICONS.reduce((s, i) => s + i.refs, 0);
    const unused = ICONS.filter(i => i.refs === 0);

    document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="stat-num">${ICONS.length}</div><div class="stat-label">Total Images</div></div>
        <div class="stat"><div class="stat-num">${icons.length}</div><div class="stat-label">Icons</div></div>
        <div class="stat"><div class="stat-num">${medals.length}</div><div class="stat-label">Medals</div></div>
        <div class="stat"><div class="stat-num">${totalRefs}</div><div class="stat-label">References</div></div>
        <div class="stat"><div class="stat-num">${unused.length}</div><div class="stat-label">Unused</div></div>
    `;

    renderGrid('icons-grid', icons);
    renderGrid('medals-grid', medals);

    document.getElementById('search').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        document.querySelectorAll('.card').forEach(card => {
            const name = card.dataset.name;
            card.classList.toggle('hidden', q && !name.includes(q));
        });
    });
}

function renderGrid(containerId, items) {
    const grid = document.getElementById(containerId);
    items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card' + (item.refs === 0 ? ' unused' : '');
        card.dataset.name = item.name;
        card.innerHTML = `
            <img src="${BASE}${item.file}" alt="${item.name}" loading="lazy">
            <div class="name">${item.name}</div>
            <div class="refs">${item.refs} ref${item.refs !== 1 ? 's' : ''}</div>
        `;
        card.addEventListener('click', () => copyPath(card, item));
        card.addEventListener('dblclick', (e) => { e.preventDefault(); showPreview(item); });
        grid.appendChild(card);
    });
}

function copyPath(card, item) {
    const path = ICON_PATH_PREFIX + item.file;
    navigator.clipboard.writeText(path).then(() => {
        card.classList.add('copied');
        setTimeout(() => card.classList.remove('copied'), 1500);
    });
}

function showPreview(item) {
    document.getElementById('preview-img').src = BASE + item.file;
    document.getElementById('preview-name').textContent = item.name;
    document.getElementById('preview-path').textContent = ICON_PATH_PREFIX + item.file;
    document.getElementById('preview-refs').textContent = item.refs + ' reference' + (item.refs !== 1 ? 's' : '') + ' across the codebase';
    document.getElementById('preview').classList.add('active');
}

init();
