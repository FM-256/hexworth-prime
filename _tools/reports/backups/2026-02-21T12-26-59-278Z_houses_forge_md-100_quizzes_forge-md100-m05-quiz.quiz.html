<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-100 Module 05: Storage - Forge House</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1510 50%, #0d0d15 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e0e0e0;
        }

        .page-header { padding: 14px 28px; background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(234,88,12,0.25); display: flex; justify-content: space-between; align-items: center; }
        .page-header a { color: #ea580c; text-decoration: none; font-size: 0.875rem; transition: color 0.2s; }
        .page-header a:hover { color: #f97316; }
        .brand { font-weight: 600; color: #e0e0e0; display: flex; align-items: center; gap: 8px; }

        .quiz-wrapper { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 32px 20px 48px; }
        .quiz-container { width: 100%; max-width: 820px; }

        .quiz-header { background: linear-gradient(135deg, rgba(234,88,12,0.1) 0%, rgba(249,115,22,0.05) 100%); border: 1px solid rgba(234,88,12,0.3); border-radius: 12px; padding: 28px; text-align: center; margin-bottom: 24px; }
        .quiz-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .quiz-title { font-size: 1.5rem; font-weight: 700; color: #f97316; margin-bottom: 6px; }
        .quiz-subtitle { color: #9ca3af; font-size: 0.95rem; margin-bottom: 14px; }
        .quiz-meta { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .quiz-meta span { background: rgba(234,88,12,0.15); border: 1px solid rgba(234,88,12,0.3); border-radius: 20px; padding: 4px 14px; font-size: 0.8rem; color: #fb923c; }

        .progress-section { margin-bottom: 20px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: #9ca3af; margin-bottom: 6px; }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ea580c 0%, #f97316 100%); border-radius: 3px; transition: width 0.3s ease; }

        .question-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(234,88,12,0.15); border-radius: 10px; padding: 22px; margin-bottom: 16px; transition: border-color 0.2s; }
        .question-card.answered { border-color: rgba(234,88,12,0.35); }
        .question-number { font-size: 0.75rem; color: #ea580c; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .question-text { font-size: 1rem; line-height: 1.55; color: #e5e7eb; margin-bottom: 16px; }

        .options { display: flex; flex-direction: column; gap: 9px; }
        .option { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 7px; cursor: pointer; transition: all 0.18s ease; text-align: left; color: #d1d5db; font-size: 0.9rem; line-height: 1.4; }
        .option:hover:not(:disabled) { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.4); color: #f3f4f6; }
        .option.selected { background: rgba(234,88,12,0.18); border-color: rgba(234,88,12,0.6); color: #fff; }
        .option.correct { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.6); color: #86efac; }
        .option.incorrect { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.6); color: #fca5a5; }
        .option.revealed { cursor: default; }
        .option-letter { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; min-width: 22px; background: rgba(255,255,255,0.1); border-radius: 50%; font-size: 0.75rem; font-weight: 700; color: #9ca3af; }
        .option.selected .option-letter { background: #ea580c; color: #fff; }
        .option.correct .option-letter { background: #22c55e; color: #fff; }
        .option.incorrect .option-letter { background: #ef4444; color: #fff; }

        .explanation { display: none; margin-top: 12px; padding: 12px 14px; background: rgba(249,115,22,0.08); border-left: 3px solid #ea580c; border-radius: 0 6px 6px 0; font-size: 0.875rem; color: #d1d5db; line-height: 1.55; }
        .explanation.visible { display: block; }
        .explanation strong { color: #f97316; }

        .quiz-actions { text-align: center; margin: 28px 0 20px; }
        .btn { display: inline-flex; align-items: center; gap: 7px; padding: 11px 28px; border-radius: 7px; border: none; cursor: pointer; font-size: 0.95rem; font-weight: 600; text-decoration: none; transition: all 0.2s ease; }
        .btn-primary { background: linear-gradient(135deg, #ea580c 0%, #f97316 100%); color: #fff; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(234,88,12,0.4); }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary { background: rgba(255,255,255,0.07); border: 1px solid rgba(234,88,12,0.35); color: #fb923c; }
        .btn-secondary:hover { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.6); }

        .results-card { display: none; background: linear-gradient(135deg, rgba(234,88,12,0.08) 0%, rgba(249,115,22,0.04) 100%); border: 1px solid rgba(234,88,12,0.3); border-radius: 12px; padding: 32px; text-align: center; margin-bottom: 24px; }
        .results-card.visible { display: block; }
        .score-display { font-size: 3.5rem; font-weight: 800; color: #f97316; line-height: 1; margin-bottom: 6px; }
        .score-label { color: #9ca3af; font-size: 0.9rem; margin-bottom: 16px; }
        .pass-badge { display: inline-block; padding: 6px 20px; border-radius: 20px; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 16px; }
        .pass-badge.pass { background: rgba(34,197,94,0.2); color: #22c55e; border: 1px solid rgba(34,197,94,0.4); }
        .pass-badge.fail { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.4); }
        .results-message { color: #d1d5db; font-size: 0.95rem; line-height: 1.5; }

        .nav-buttons { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(234,88,12,0.15); }
    </style>
</head>
<body>

<header class="page-header">
    <a href="../../index.html">← Back to Forge House</a>
    <span class="brand"><span>⚒️</span> Hexworth Prime</span>
</header>

<main class="quiz-wrapper">
    <div class="quiz-container">

        <header class="quiz-header">
            <div class="quiz-icon">⚒️</div>
            <h1 class="quiz-title">Storage Quiz</h1>
            <p class="quiz-subtitle">MD-100 Module 05 Assessment</p>
            <div class="quiz-meta">
                <span>📝 15 Questions</span>
                <span>⏱️ No Time Limit</span>
                <span>🎯 70% to Pass</span>
            </div>
        </header>

        <div class="progress-section">
            <div class="progress-label">
                <span id="progress-text">0 of 15 answered</span>
                <span id="progress-pct">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width:0%"></div>
            </div>
        </div>

        <div class="results-card" id="results-card">
            <div class="score-display" id="score-display">0%</div>
            <div class="score-label" id="score-label">0 / 15 correct</div>
            <div class="pass-badge" id="pass-badge">--</div>
            <p class="results-message" id="results-message"></p>
        </div>

        <div id="questions-container"></div>

        <div class="quiz-actions">
            <button class="btn btn-primary" id="submit-btn" disabled onclick="submitQuiz()">Submit Quiz</button>
        </div>

        <nav class="nav-buttons">
            <a href="../labs/md100-m05-storage.lab.html" class="btn btn-secondary">← Review Lab</a>
            <a href="../../index.html" class="btn btn-secondary">Forge House →</a>
        </nav>

    </div>
</main>

<script>
const QUIZ_ID = 'hexworth_md100_m05';

const questions = [
    {
        id: 1,
        topic: 'Basic vs Dynamic Disks',
        question: 'EXAM TIP: What is the maximum number of primary partitions on a Basic MBR disk?',
        options: [
            '2',
            '3',
            '4',
            '128'
        ],
        correct: 2,
        explanation: 'MBR disks support a maximum of 4 primary partitions. To work around this limit, one partition can be an Extended partition containing multiple logical drives. GPT disks support up to 128 partitions with no extended/logical partition distinction. Dynamic disks do not have this 4-partition limit either.'
    },
    {
        id: 2,
        topic: 'MBR vs GPT',
        question: 'What is the maximum volume size supported by MBR partitioning with a 512-byte sector size?',
        options: [
            '1 TB',
            '2 TB',
            '4 TB',
            '16 TB'
        ],
        correct: 1,
        explanation: 'MBR uses 32-bit sector addressing with 512-byte sectors, giving a maximum addressable size of approximately 2 TB (2^32 x 512 bytes). Drives larger than 2 TB require GPT partitioning. This limitation is the primary technical reason GPT was developed as the successor to MBR.'
    },
    {
        id: 3,
        topic: 'Volume Types',
        question: 'A dynamic disk volume spans multiple physical disks to create one large logical volume with no redundancy or performance improvement. Which volume type is this?',
        options: [
            'Simple volume',
            'Spanned volume',
            'Striped volume (RAID-0)',
            'Mirrored volume (RAID-1)'
        ],
        correct: 1,
        explanation: 'A spanned volume extends across multiple disks sequentially - the first disk is filled before data moves to the next. There is no performance gain and no redundancy; losing any disk in the span loses all data. A striped volume (RAID-0) writes across disks simultaneously for performance but also has no redundancy.'
    },
    {
        id: 4,
        topic: 'Volume Types',
        question: 'Which dynamic disk volume type improves read/write performance by writing data simultaneously across multiple disks but provides NO fault tolerance?',
        options: [
            'Simple volume',
            'Spanned volume',
            'Striped volume (RAID-0)',
            'Mirrored volume (RAID-1)'
        ],
        correct: 2,
        explanation: 'RAID-0 (striped volume) splits data into stripes written simultaneously across two or more disks, improving throughput. However, if any disk fails, ALL data is lost - it has zero redundancy. RAID-1 (mirrored) duplicates data for fault tolerance but does not improve write performance.'
    },
    {
        id: 5,
        topic: 'File Systems',
        question: 'EXAM TIP: A user wants to copy a 10 GB video file to a USB flash drive but receives an error that the file is too large. The drive is formatted as FAT32. What is the FAT32 file size limit?',
        options: [
            '2 GB',
            '4 GB',
            '8 GB',
            'No limit'
        ],
        correct: 1,
        explanation: 'FAT32 has a maximum individual file size of 4 GB (specifically 4 GB minus 1 byte, due to 32-bit file size fields). A 10 GB file exceeds this limit. The solution is to format the drive as exFAT (supports files up to 16 EB) or NTFS (also supports very large files). exFAT is generally preferred for removable drives due to cross-platform compatibility.'
    },
    {
        id: 6,
        topic: 'File Systems',
        question: 'Which file system is designed for flash drives and memory cards, supports large files, but does NOT include journaling or file-level permissions?',
        options: [
            'NTFS',
            'FAT32',
            'exFAT',
            'ReFS'
        ],
        correct: 2,
        explanation: 'exFAT (Extended FAT) was designed by Microsoft for removable media. It supports large files (beyond FAT32\'s 4 GB limit) and large volumes, and is compatible with Windows, macOS, and Linux. It does not have NTFS permissions or journaling, making it lightweight and appropriate for flash storage.'
    },
    {
        id: 7,
        topic: 'Storage Spaces',
        question: 'A user sets up Storage Spaces with a two-way mirror resiliency. How many physical drives are the minimum required?',
        options: [
            '1',
            '2',
            '3',
            '4'
        ],
        correct: 1,
        explanation: 'Two-way mirror (equivalent to RAID-1) requires a minimum of 2 physical drives - it writes two copies of all data. Three-way mirror requires 5 drives minimum. Parity (similar to RAID-5) requires 3 drives minimum. Storage Spaces manages these automatically through the Storage Pool abstraction.'
    },
    {
        id: 8,
        topic: 'Storage Spaces',
        question: 'Which Storage Spaces resiliency type uses parity information spread across drives to survive one disk failure while being more storage-efficient than mirroring?',
        options: [
            'Two-way mirror',
            'Three-way mirror',
            'Simple (no resiliency)',
            'Parity'
        ],
        correct: 3,
        explanation: 'Storage Spaces Parity is similar to RAID-5 - it stores parity data across drives so the pool survives a single disk failure. It is more storage-efficient than mirroring (e.g., 3 drives give ~2/3 usable space vs 1/2 for two-way mirror) but has slower write performance due to parity calculations.'
    },
    {
        id: 9,
        topic: 'Disk Cleanup',
        question: 'What is the difference between Disk Cleanup and Storage Sense in Windows 10?',
        options: [
            'Disk Cleanup removes files from all users; Storage Sense only removes files for the current user',
            'Storage Sense can run automatically on a schedule; Disk Cleanup is manual only',
            'Storage Sense removes system files; Disk Cleanup only removes personal files',
            'They are identical tools; Storage Sense is just the newer UI for the same functionality'
        ],
        correct: 1,
        explanation: 'Storage Sense (Settings > System > Storage) can be configured to run automatically when disk space is low or on a schedule, automatically cleaning temporary files, Recycle Bin, and Downloads. Disk Cleanup (cleanmgr.exe) is the traditional manual tool. Storage Sense is the modern replacement; Disk Cleanup may be deprecated in future Windows versions.'
    },
    {
        id: 10,
        topic: 'chkdsk',
        question: 'A technician needs to check a system drive for file system errors and repair them. The drive is in use and cannot be locked. What happens when "chkdsk C: /f" is run?',
        options: [
            'chkdsk runs immediately in read-only mode',
            'chkdsk fails with an error and cannot proceed',
            'chkdsk schedules itself to run at the next system restart',
            'chkdsk forces the drive offline and runs immediately'
        ],
        correct: 2,
        explanation: 'When chkdsk /f cannot lock the volume because it is in use (such as the system drive C:), it asks if you want to schedule it for the next restart. On reboot, chkdsk runs before Windows loads so the drive is not locked. This is the expected behavior on active system volumes.'
    },
    {
        id: 11,
        topic: 'Disk Quotas',
        question: 'Disk quotas in Windows 10 are configured per-user on NTFS volumes. What happens when a user reaches their disk quota limit?',
        options: [
            'Windows automatically compresses their files to make room',
            'The user cannot save any more files to that volume until space is freed',
            'An email alert is sent to the administrator automatically',
            'Windows moves older files to the Recycle Bin to free space'
        ],
        correct: 1,
        explanation: 'When a user hits their hard quota limit on an NTFS volume, Windows returns an "out of disk space" error - the user cannot write additional data until they delete files to fall below the limit. A warning threshold can also be configured to alert before the hard limit is reached. Alerts appear in Event Viewer; automatic email requires additional configuration.'
    },
    {
        id: 12,
        topic: 'Defrag vs TRIM',
        question: 'Why should you NOT run traditional defragmentation on a Solid State Drive (SSD)?',
        options: [
            'SSDs are too fast for defragmentation to provide any benefit',
            'Defragmentation causes unnecessary write cycles that reduce SSD lifespan without improving performance',
            'SSDs cannot be defragmented by Windows - it will throw an error',
            'Defragmentation reformats the drive, erasing all data'
        ],
        correct: 1,
        explanation: 'SSDs have no mechanical read heads, so file fragmentation does not cause performance degradation as it does on HDDs. Running defragmentation generates large numbers of write operations across the SSD, consuming limited write cycles (P/E cycles) and reducing the drive\'s lifespan without benefit. Windows 10 automatically detects SSDs and runs TRIM instead of defragmentation.'
    },
    {
        id: 13,
        topic: 'diskpart',
        question: 'Which diskpart command sequence correctly creates and formats a new partition on Disk 1?',
        options: [
            'select disk 1 > create partition primary > format fs=ntfs quick > assign',
            'select disk 1 > new partition > format ntfs > mount',
            'partition disk 1 primary > format quick ntfs > letter=D',
            'disk select 1 > create part > format ntfs > assign letter'
        ],
        correct: 0,
        explanation: 'The correct diskpart sequence is: select disk [n], create partition primary (or extended/logical), format fs=ntfs quick (or fs=fat32), assign (to auto-assign a drive letter) or assign letter=[x]. diskpart commands must be in this order: select, create, format, then assign. The syntax is strict - wrong order or keywords will fail.'
    },
    {
        id: 14,
        topic: 'File Systems',
        question: 'EXAM TIP: A technician is setting up a dual-boot system with both Windows 10 and Linux. Which file system for the shared data partition provides the best cross-OS compatibility?',
        options: [
            'NTFS, because both Windows and Linux support it natively',
            'exFAT, because both Windows and Linux can read/write it',
            'FAT32, because it is universally supported but has the 4 GB file limit',
            'ReFS, because it is the most modern Microsoft file system'
        ],
        correct: 1,
        explanation: 'exFAT offers the best balance for cross-platform use: no 4 GB file size limit (unlike FAT32), native read/write support in modern Linux kernels (since kernel 5.4) and macOS, and good performance. NTFS has limited Linux write support (historically via ntfs-3g). ReFS is Windows-only. For a shared partition, exFAT is the practical modern choice.'
    },
    {
        id: 15,
        topic: 'Disk Management',
        question: 'A new 2 TB hard drive shows as "Unallocated" in Disk Management. Before creating a partition, what initialization step is required if you want to use GPT?',
        options: [
            'No initialization needed; GPT is applied automatically during partitioning',
            'Right-click the disk header and select "Initialize Disk", then choose GPT',
            'Convert the disk from Basic to Dynamic first',
            'Run "diskpart clean" to prepare the disk for GPT'
        ],
        correct: 1,
        explanation: 'A brand new disk shows as "Not Initialized" in Disk Management. Right-clicking the disk header and selecting "Initialize Disk" presents a choice between MBR and GPT. GPT is recommended for all modern installations, especially for drives over 2 TB. Without initialization, you cannot create partitions on the disk.'
    }
];

const state = {
    answers: JSON.parse(localStorage.getItem(QUIZ_ID + '_answers') || 'null') || {},
    submitted: false
};

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    questions.forEach((q, idx) => {
        const letters = ['A', 'B', 'C', 'D'];
        const card = document.createElement('div');
        card.className = 'question-card' + (state.answers[idx] !== undefined ? ' answered' : '');
        card.id = 'question-' + idx;
        card.innerHTML = `
            <div class="question-number">Question ${idx + 1} &mdash; ${q.topic}</div>
            <div class="question-text">${q.question}</div>
            <div class="options" id="options-${idx}">
                ${q.options.map((opt, oi) => `
                    <button class="option ${state.answers[idx] === oi ? 'selected' : ''}"
                            onclick="selectAnswer(${idx}, ${oi})"
                            id="opt-${idx}-${oi}">
                        <span class="option-letter">${letters[oi]}</span>
                        ${escapeHtml(opt)}
                    </button>
                `).join('')}
            </div>
            <div class="explanation" id="explanation-${idx}">
                <strong>Explanation:</strong> ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });
    updateProgress();
    updateSubmitButton();
}

function selectAnswer(qIdx, optIdx) {
    if (state.submitted) return;
    state.answers[qIdx] = optIdx;
    localStorage.setItem(QUIZ_ID + '_answers', JSON.stringify(state.answers));
    questions[qIdx].options.forEach((_, oi) => {
        document.getElementById('opt-' + qIdx + '-' + oi).className = 'option' + (oi === optIdx ? ' selected' : '');
    });
    document.getElementById('question-' + qIdx).classList.add('answered');
    updateProgress();
    updateSubmitButton();
}

function updateProgress() {
    const answered = Object.keys(state.answers).length;
    const pct = Math.round((answered / questions.length) * 100);
    document.getElementById('progress-text').textContent = answered + ' of ' + questions.length + ' answered';
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
}

function updateSubmitButton() {
    document.getElementById('submit-btn').disabled = Object.keys(state.answers).length < questions.length;
}

function submitQuiz() {
    state.submitted = true;
    let correct = 0;
    questions.forEach((q, idx) => {
        const chosen = state.answers[idx];
        const isCorrect = chosen === q.correct;
        if (isCorrect) correct++;
        questions[idx].options.forEach((_, oi) => {
            const btn = document.getElementById('opt-' + idx + '-' + oi);
            btn.classList.remove('selected');
            btn.classList.add('revealed');
            if (oi === q.correct) btn.classList.add('correct');
            else if (oi === chosen && !isCorrect) btn.classList.add('incorrect');
        });
        document.getElementById('explanation-' + idx).classList.add('visible');
    });
    const pct = Math.round((correct / questions.length) * 100);
    const passed = pct >= 70;
    localStorage.setItem(QUIZ_ID + '_score', JSON.stringify({ score: pct, correct, total: questions.length, passed, date: new Date().toISOString() }));
    const resultsCard = document.getElementById('results-card');
    resultsCard.classList.add('visible');
    document.getElementById('score-display').textContent = pct + '%';
    document.getElementById('score-label').textContent = correct + ' / ' + questions.length + ' correct';
    const badge = document.getElementById('pass-badge');
    badge.textContent = passed ? 'PASSED' : 'FAILED';
    badge.className = 'pass-badge ' + (passed ? 'pass' : 'fail');
    document.getElementById('results-message').textContent = passed
        ? 'Excellent. Storage concepts are deceptively deep - MBR vs GPT limits, RAID types, and file system trade-offs come up in both exam and real-world scenarios. Well handled.'
        : 'Review the key numbers: MBR 4-partition limit, MBR 2 TB max, FAT32 4 GB file limit. Then nail the volume type behaviors (spanned vs striped vs mirrored). Retake when ready.';
    document.querySelector('.quiz-actions').innerHTML = '<button class="btn btn-primary" onclick="retakeQuiz()">Retake Quiz</button>';
    resultsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retakeQuiz() {
    localStorage.removeItem(QUIZ_ID + '_answers');
    localStorage.removeItem(QUIZ_ID + '_score');
    state.answers = {};
    state.submitted = false;
    document.getElementById('results-card').classList.remove('visible');
    document.querySelector('.quiz-actions').innerHTML = '<button class="btn btn-primary" id="submit-btn" disabled onclick="submitQuiz()">Submit Quiz</button>';
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

renderQuestions();
</script>

</body>
</html>
