<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLH-017 Quiz: Find & Locate - Hexworth Prime</title>
    <style>
        :root { --house-primary: #a78bfa; --house-secondary: #8b5cf6; --house-glow: rgba(167, 139, 250, 0.3); --terminal-green: #4ade80; --correct: #22c55e; --incorrect: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #0a0a0f; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #e0e0e0; }
        .quiz-header { padding: 20px 40px; border-bottom: 1px solid rgba(167, 139, 250, 0.2); background: rgba(10, 10, 15, 0.95); display: flex; justify-content: space-between; align-items: center; }
        .back-btn { padding: 8px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #888; text-decoration: none; }
        .back-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .progress-bar { width: 200px; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--house-primary), var(--terminal-green)); width: 0%; transition: width 0.5s ease; }
        .quiz-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .quiz-title { text-align: center; margin-bottom: 40px; }
        .quiz-title h1 { font-size: 2rem; color: var(--house-primary); margin-bottom: 10px; }
        .quiz-title p { color: #666; }
        .question-card { background: rgba(15, 15, 20, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 30px; display: none; }
        .question-card.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .question-number { color: var(--house-primary); font-size: 0.85rem; margin-bottom: 15px; }
        .question-text { font-size: 1.2rem; margin-bottom: 25px; line-height: 1.6; }
        .question-text code { background: rgba(74, 222, 128, 0.1); color: var(--terminal-green); padding: 2px 8px; border-radius: 4px; font-family: 'Consolas', monospace; }
        .options { display: grid; gap: 12px; }
        .option { padding: 15px 20px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .option:hover:not(.disabled) { background: rgba(167, 139, 250, 0.1); border-color: var(--house-primary); }
        .option.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--correct); }
        .option.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--incorrect); }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .option-letter { width: 28px; height: 28px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .feedback { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
        .feedback.show { display: block; }
        .feedback.correct { background: rgba(34, 197, 94, 0.1); border-left: 3px solid var(--correct); }
        .feedback.incorrect { background: rgba(239, 68, 68, 0.1); border-left: 3px solid var(--incorrect); }
        .nav-buttons { display: flex; justify-content: flex-end; margin-top: 30px; }
        .nav-btn { padding: 12px 30px; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--house-primary), var(--house-secondary)); color: #fff; cursor: pointer; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .nav-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 20px var(--house-glow); }
        .results-card { background: rgba(15, 15, 20, 0.6); border: 1px solid rgba(167, 139, 250, 0.3); border-radius: 12px; padding: 50px; text-align: center; display: none; }
        .results-card.show { display: block; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; background: linear-gradient(135deg, var(--house-primary), var(--terminal-green)); display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; font-size: 3rem; font-weight: bold; color: #fff; }
        .results-title { font-size: 1.8rem; color: var(--house-primary); margin-bottom: 15px; }
        .results-subtitle { color: #888; margin-bottom: 30px; }
        .results-actions { display: flex; gap: 15px; justify-content: center; }
        .action-btn { padding: 12px 30px; border-radius: 8px; text-decoration: none; }
        .action-btn.primary { background: linear-gradient(135deg, var(--house-primary), var(--house-secondary)); color: #fff; }
        .action-btn.secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #ccc; }
    </style>
</head>
<body>
    <header class="quiz-header">
        <a href="clh-017-intro.html" class="back-btn">&larr; Back to Lesson</a>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span id="questionCounter" style="color: #666;">1 / 6</span>
    </header>

    <div class="quiz-container">
        <div class="quiz-title">
            <h1>CLH-017: Find & Locate Quiz</h1>
            <p>Test your file hunting knowledge</p>
        </div>
        <div id="questionsContainer"></div>
        <div class="results-card" id="resultsCard">
            <div class="score-circle" id="scoreCircle">0%</div>
            <h2 class="results-title" id="resultsTitle">Quiz Complete!</h2>
            <p class="results-subtitle" id="resultsSubtitle"></p>
            <div class="results-actions">
                <a href="clh-017-intro.html" class="action-btn secondary">Review Lesson</a>
                <a href="../applets/linux/clh-017-find-locate.html" class="action-btn primary" id="nextModuleBtn">Start Lab &rarr;</a>
            </div>
        </div>
    </div>

    <script src="../../../components/TrailHunter.js"></script>
    <script src="../../../components/ModuleProgress.js"></script>
    <script>
        const questions = [
            {
                question: 'Which command finds all SUID binaries that could be privilege escalation backdoors?',
                options: ['<code>find / -name "suid" 2>/dev/null</code>', '<code>find / -perm -4000 2>/dev/null</code>', '<code>locate suid</code>', '<code>which -a suid</code>'],
                correct: 1,
                feedback: {
                    correct: 'Correct! <code>-perm -4000</code> matches files with the SUID bit set. These run as the file owner (often root).',
                    incorrect: '<code>find / -perm -4000</code> locates SUID files. The 4000 octal represents the SUID permission bit.'
                }
            },
            {
                question: 'Why might <code>locate</code> miss a file that was just created?',
                options: ['locate cannot search the entire filesystem', 'The file is hidden (starts with dot)', 'The locate database hasn\'t been updated', 'locate only finds directories'],
                correct: 2,
                feedback: {
                    correct: 'Correct! <code>locate</code> uses a pre-built database. Run <code>updatedb</code> to refresh it.',
                    incorrect: '<code>locate</code> searches a database that may be stale. New files won\'t appear until <code>updatedb</code> runs.'
                }
            },
            {
                question: 'Find all hidden files (dot-files) in /home that are regular files, not directories:',
                options: ['<code>find /home -name ".*"</code>', '<code>find /home -name ".*" -type f</code>', '<code>ls -la /home</code>', '<code>locate ".*"</code>'],
                correct: 1,
                feedback: {
                    correct: 'Correct! <code>-name ".*"</code> matches dot-files, <code>-type f</code> restricts to regular files only.',
                    incorrect: '<code>find /home -name ".*" -type f</code> finds hidden files. Without <code>-type f</code>, directories like .ssh would match too.'
                }
            },
            {
                question: 'What does <code>which python</code> tell you?',
                options: ['All Python files on the system', 'The Python version installed', 'The path to the python executable in PATH', 'Python\'s configuration'],
                correct: 2,
                feedback: {
                    correct: 'Correct! <code>which</code> shows the full path of the executable that runs when you type a command.',
                    incorrect: '<code>which</code> finds executables in your PATH and shows their location. It reveals which binary actually runs.'
                }
            },
            {
                question: 'Find files modified in the last 24 hours in /tmp:',
                options: ['<code>find /tmp -mtime 1</code>', '<code>find /tmp -mtime -1</code>', '<code>find /tmp -atime -1</code>', '<code>locate -mtime /tmp</code>'],
                correct: 1,
                feedback: {
                    correct: 'Correct! <code>-mtime -1</code> means modified less than 1 day ago. The minus sign is crucial!',
                    incorrect: '<code>-mtime -1</code> finds files modified within the last day. Without the minus, it would mean exactly 1 day ago.'
                }
            },
            {
                question: 'What\'s the difference between <code>which</code> and <code>whereis</code>?',
                options: ['which is faster', 'whereis also finds man pages and source files', 'which finds all files, whereis only binaries', 'There is no difference'],
                correct: 1,
                feedback: {
                    correct: 'Correct! <code>whereis</code> searches for binaries, source code, AND man pages. <code>which</code> only finds executables in PATH.',
                    incorrect: '<code>whereis</code> is broader - it finds the binary, man page, and source code locations. <code>which</code> only checks PATH.'
                }
            }
        ];

        let currentQuestion = 0, score = 0, answered = new Array(questions.length).fill(false);

        function initQuiz() {
            const container = document.getElementById('questionsContainer');
            questions.forEach((q, idx) => {
                container.innerHTML += `<div class="question-card" id="question${idx}"><div class="question-number">QUESTION ${idx + 1} OF ${questions.length}</div><div class="question-text">${q.question}</div><div class="options">${q.options.map((opt, i) => `<div class="option" onclick="selectOption(${idx}, ${i})"><span class="option-letter">${['A','B','C','D'][i]}</span><span>${opt}</span></div>`).join('')}</div><div class="feedback" id="feedback${idx}"></div><div class="nav-buttons"><button class="nav-btn" id="nextBtn${idx}" onclick="nextQuestion()" disabled>${idx === questions.length - 1 ? 'See Results' : 'Next &rarr;'}</button></div></div>`;
            });
            showQuestion(0);
        }

        function showQuestion(idx) {
            document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`question${idx}`).classList.add('active');
            document.getElementById('progressFill').style.width = `${((idx + 1) / questions.length) * 100}%`;
            document.getElementById('questionCounter').textContent = `${idx + 1} / ${questions.length}`;
        }

        function selectOption(qIdx, optIdx) {
            if (answered[qIdx]) return;
            answered[qIdx] = true;
            const q = questions[qIdx], opts = document.querySelectorAll(`#question${qIdx} .option`), fb = document.getElementById(`feedback${qIdx}`);
            opts.forEach((o, i) => { o.classList.add('disabled'); if (i === q.correct) o.classList.add('correct'); else if (i === optIdx) o.classList.add('incorrect'); });
            if (optIdx === q.correct) { score++; fb.className = 'feedback show correct'; fb.innerHTML = `&#10003; ${q.feedback.correct}`; }
            else { fb.className = 'feedback show incorrect'; fb.innerHTML = `&#10007; ${q.feedback.incorrect}`; }
            document.getElementById(`nextBtn${qIdx}`).disabled = false;
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) { currentQuestion++; showQuestion(currentQuestion); }
            else { showResults(); }
        }

        function showResults() {
            document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
            document.getElementById('resultsCard').classList.add('show');
            const pct = Math.round((score / questions.length) * 100);
            document.getElementById('scoreCircle').textContent = `${pct}%`;
            document.getElementById('resultsSubtitle').textContent = `You scored ${score} out of ${questions.length} correct`;
            if (pct >= 80) {
                document.getElementById('resultsTitle').textContent = 'File Hunter!';
                if (typeof ModuleProgress !== 'undefined') ModuleProgress.completeQuiz('script', 'clh-017-quiz', pct, { returnToDashboard: false });
            } else if (pct >= 60) {
                document.getElementById('resultsTitle').textContent = 'Good Progress!';
            } else {
                document.getElementById('resultsTitle').textContent = 'Keep Studying!';
                document.getElementById('nextModuleBtn').textContent = 'Retry Quiz';
                document.getElementById('nextModuleBtn').href = 'clh-017-quiz.html';
            }
        }

        initQuiz();
    </script>
    <script src="../../../components/FluxCapacitor.js"></script>
</body>
</html>
