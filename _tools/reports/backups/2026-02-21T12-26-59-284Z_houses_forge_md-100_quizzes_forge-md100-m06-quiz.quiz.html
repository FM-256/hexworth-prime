<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-100 Module 06: Data Access &amp; Usage - Forge House</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1510 50%, #0d0d15 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e0e0e0;
        }

        .page-header { padding: 14px 28px; background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(234,88,12,0.25); display: flex; justify-content: space-between; align-items: center; }
        .page-header a { color: #ea580c; text-decoration: none; font-size: 0.875rem; transition: color 0.2s; }
        .page-header a:hover { color: #f97316; }
        .brand { font-weight: 600; color: #e0e0e0; display: flex; align-items: center; gap: 8px; }

        .quiz-wrapper { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 32px 20px 48px; }
        .quiz-container { width: 100%; max-width: 820px; }

        .quiz-header { background: linear-gradient(135deg, rgba(234,88,12,0.1) 0%, rgba(249,115,22,0.05) 100%); border: 1px solid rgba(234,88,12,0.3); border-radius: 12px; padding: 28px; text-align: center; margin-bottom: 24px; }
        .quiz-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .quiz-title { font-size: 1.5rem; font-weight: 700; color: #f97316; margin-bottom: 6px; }
        .quiz-subtitle { color: #9ca3af; font-size: 0.95rem; margin-bottom: 14px; }
        .quiz-meta { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .quiz-meta span { background: rgba(234,88,12,0.15); border: 1px solid rgba(234,88,12,0.3); border-radius: 20px; padding: 4px 14px; font-size: 0.8rem; color: #fb923c; }

        .progress-section { margin-bottom: 20px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: #9ca3af; margin-bottom: 6px; }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ea580c 0%, #f97316 100%); border-radius: 3px; transition: width 0.3s ease; }

        .question-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(234,88,12,0.15); border-radius: 10px; padding: 22px; margin-bottom: 16px; transition: border-color 0.2s; }
        .question-card.answered { border-color: rgba(234,88,12,0.35); }
        .question-number { font-size: 0.75rem; color: #ea580c; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .question-text { font-size: 1rem; line-height: 1.55; color: #e5e7eb; margin-bottom: 16px; }

        .options { display: flex; flex-direction: column; gap: 9px; }
        .option { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 7px; cursor: pointer; transition: all 0.18s ease; text-align: left; color: #d1d5db; font-size: 0.9rem; line-height: 1.4; }
        .option:hover:not(:disabled) { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.4); color: #f3f4f6; }
        .option.selected { background: rgba(234,88,12,0.18); border-color: rgba(234,88,12,0.6); color: #fff; }
        .option.correct { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.6); color: #86efac; }
        .option.incorrect { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.6); color: #fca5a5; }
        .option.revealed { cursor: default; }
        .option-letter { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; min-width: 22px; background: rgba(255,255,255,0.1); border-radius: 50%; font-size: 0.75rem; font-weight: 700; color: #9ca3af; }
        .option.selected .option-letter { background: #ea580c; color: #fff; }
        .option.correct .option-letter { background: #22c55e; color: #fff; }
        .option.incorrect .option-letter { background: #ef4444; color: #fff; }

        .explanation { display: none; margin-top: 12px; padding: 12px 14px; background: rgba(249,115,22,0.08); border-left: 3px solid #ea580c; border-radius: 0 6px 6px 0; font-size: 0.875rem; color: #d1d5db; line-height: 1.55; }
        .explanation.visible { display: block; }
        .explanation strong { color: #f97316; }

        .quiz-actions { text-align: center; margin: 28px 0 20px; }
        .btn { display: inline-flex; align-items: center; gap: 7px; padding: 11px 28px; border-radius: 7px; border: none; cursor: pointer; font-size: 0.95rem; font-weight: 600; text-decoration: none; transition: all 0.2s ease; }
        .btn-primary { background: linear-gradient(135deg, #ea580c 0%, #f97316 100%); color: #fff; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(234,88,12,0.4); }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary { background: rgba(255,255,255,0.07); border: 1px solid rgba(234,88,12,0.35); color: #fb923c; }
        .btn-secondary:hover { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.6); }

        .results-card { display: none; background: linear-gradient(135deg, rgba(234,88,12,0.08) 0%, rgba(249,115,22,0.04) 100%); border: 1px solid rgba(234,88,12,0.3); border-radius: 12px; padding: 32px; text-align: center; margin-bottom: 24px; }
        .results-card.visible { display: block; }
        .score-display { font-size: 3.5rem; font-weight: 800; color: #f97316; line-height: 1; margin-bottom: 6px; }
        .score-label { color: #9ca3af; font-size: 0.9rem; margin-bottom: 16px; }
        .pass-badge { display: inline-block; padding: 6px 20px; border-radius: 20px; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 16px; }
        .pass-badge.pass { background: rgba(34,197,94,0.2); color: #22c55e; border: 1px solid rgba(34,197,94,0.4); }
        .pass-badge.fail { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.4); }
        .results-message { color: #d1d5db; font-size: 0.95rem; line-height: 1.5; }

        .nav-buttons { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(234,88,12,0.15); }
    </style>
</head>
<body>

<header class="page-header">
    <a href="../../index.html">← Back to Forge House</a>
    <span class="brand"><span>⚒️</span> Hexworth Prime</span>
</header>

<main class="quiz-wrapper">
    <div class="quiz-container">

        <header class="quiz-header">
            <div class="quiz-icon">⚒️</div>
            <h1 class="quiz-title">Data Access &amp; Usage Quiz</h1>
            <p class="quiz-subtitle">MD-100 Module 06 Assessment</p>
            <div class="quiz-meta">
                <span>📝 15 Questions</span>
                <span>⏱️ No Time Limit</span>
                <span>🎯 70% to Pass</span>
            </div>
        </header>

        <div class="progress-section">
            <div class="progress-label">
                <span id="progress-text">0 of 15 answered</span>
                <span id="progress-pct">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width:0%"></div>
            </div>
        </div>

        <div class="results-card" id="results-card">
            <div class="score-display" id="score-display">0%</div>
            <div class="score-label" id="score-label">0 / 15 correct</div>
            <div class="pass-badge" id="pass-badge">--</div>
            <p class="results-message" id="results-message"></p>
        </div>

        <div id="questions-container"></div>

        <div class="quiz-actions">
            <button class="btn btn-primary" id="submit-btn" disabled onclick="submitQuiz()">Submit Quiz</button>
        </div>

        <nav class="nav-buttons">
            <a href="../labs/md100-m06-data-access.lab.html" class="btn btn-secondary">← Review Lab</a>
            <a href="../../index.html" class="btn btn-secondary">Forge House →</a>
        </nav>

    </div>
</main>

<script>
const QUIZ_ID = 'hexworth_md100_m06';

const questions = [
    {
        id: 1,
        topic: 'NTFS Permissions',
        question: 'Which NTFS permission level allows a user to read files, create new files, modify existing files, and delete files, but NOT change permissions or take ownership?',
        options: [
            'Read',
            'Read & Execute',
            'Modify',
            'Full Control'
        ],
        correct: 2,
        explanation: 'Modify permission allows reading, writing, modifying, and deleting files and subfolders, but does not grant the ability to change permissions (Change Permissions) or take ownership (Take Ownership). Full Control adds those two capabilities. This distinction is a common exam question - Modify is the "do almost everything except manage access" level.'
    },
    {
        id: 2,
        topic: 'NTFS Permissions',
        question: 'EXAM TIP: A user named Alex is a member of "Sales" group. Alex has Read permission directly assigned and the Sales group has Modify. Alex also has an explicit Deny on Write. What is Alex\'s effective Write permission?',
        options: [
            'Allow Write (from Modify via group membership)',
            'No Write access (Deny overrides Allow)',
            'Allow Write (direct assignment takes precedence)',
            'Allow Write (user permissions override group permissions)'
        ],
        correct: 1,
        explanation: 'Deny permissions always override Allow permissions regardless of source (direct assignment or group membership). Even though Modify (which includes Write) is granted through the Sales group, the explicit Deny on Write blocks it. Deny is the absolute trump card in NTFS permission calculation. This is the most critical NTFS rule to memorize.'
    },
    {
        id: 3,
        topic: 'Permission Inheritance',
        question: 'An administrator sets permissions on a parent folder. A new subfolder is created inside it. Where do the subfolder\'s permissions come from by default?',
        options: [
            'The subfolder has no permissions until explicitly set',
            'The subfolder inherits permissions from the parent folder',
            'The subfolder automatically grants Full Control to the creator',
            'The subfolder inherits permissions from HKLM\\Security'
        ],
        correct: 1,
        explanation: 'NTFS permission inheritance means child objects (files and subfolders) automatically inherit the permissions of their parent container. Inherited permissions are shown grayed-out in the ACL editor. You can disable inheritance on any object to create a unique permission set, at which point you must choose to copy or remove inherited entries.'
    },
    {
        id: 4,
        topic: 'icacls',
        question: 'Which icacls command grants user "jsmith" Modify permission on the folder C:\\Projects and all its contents?',
        options: [
            'icacls C:\\Projects /grant jsmith:M /T',
            'icacls C:\\Projects /allow jsmith Modify /recurse',
            'icacls C:\\Projects /set jsmith:Modify',
            'icacls /grant jsmith C:\\Projects Modify /all'
        ],
        correct: 0,
        explanation: 'icacls uses /grant to add permissions, with the format [user]:[permission letter] where M = Modify. The /T flag applies the change recursively to all subfolders and files (T = tree). The permission letters are: F (Full Control), M (Modify), RX (Read & Execute), R (Read), W (Write). Syntax and flags must be exact.'
    },
    {
        id: 5,
        topic: 'Share Permissions',
        question: 'A folder has NTFS permission of Modify for "Everyone" and Share permission of Read for "Everyone". A user accesses the folder over the network. What is their effective access?',
        options: [
            'Modify, because NTFS permissions apply when accessing over the network',
            'Read, because the most restrictive of NTFS and Share permissions applies',
            'Full Control, because both permissions combine',
            'No access, because conflicting permissions block access'
        ],
        correct: 1,
        explanation: 'When accessing a resource over the network, Windows applies BOTH NTFS and Share permissions and uses the MORE RESTRICTIVE result. NTFS Modify + Share Read = effective Read. When accessing the same folder locally (not over the network), only NTFS permissions apply. This is the critical difference between local and network access to shared resources.'
    },
    {
        id: 6,
        topic: 'Admin Shares',
        question: 'What is the purpose of the hidden administrative share C$?',
        options: [
            'It is a read-only share for system administrators to browse files remotely',
            'It provides full administrative access to the C: drive root for local administrators',
            'It is used by Windows Update to download patches',
            'It is a backup location automatically managed by Windows'
        ],
        correct: 1,
        explanation: 'C$ (and D$, E$ etc.) are hidden administrative shares automatically created by Windows for each local drive, accessible only to members of the local Administrators group. ADMIN$ maps to the Windows directory; IPC$ provides inter-process communication for remote administration. These shares cannot be permanently disabled through standard means without registry changes.'
    },
    {
        id: 7,
        topic: 'Mapping Drives',
        question: 'Which command maps a network share \\\\SERVER01\\Data to drive letter Z: using the credentials of user "contoso\\jsmith"?',
        options: [
            'net use Z: \\\\SERVER01\\Data /user:contoso\\jsmith',
            'map drive Z: \\\\SERVER01\\Data contoso\\jsmith',
            'net share Z: = \\\\SERVER01\\Data /user:jsmith',
            'connect Z: \\\\SERVER01\\Data /credentials:contoso\\jsmith'
        ],
        correct: 0,
        explanation: 'The net use command maps network drives. Syntax: net use [drive]: [\\\\server\\share] /user:[domain\\username]. After this command, Windows will prompt for the password. To persist the mapping across reboots, add /persistent:yes. To disconnect, use "net use Z: /delete". This is a heavily tested command-line skill.'
    },
    {
        id: 8,
        topic: 'OneDrive',
        question: 'A user enables "Files On-Demand" in OneDrive. What does this mean for files shown in their OneDrive folder?',
        options: [
            'All files are immediately downloaded and stored locally',
            'Files are listed in Explorer but only downloaded when opened',
            'Files are stored only in the cloud with no local representation',
            'Files are compressed locally to save space'
        ],
        correct: 1,
        explanation: 'Files On-Demand shows all OneDrive files as placeholders in File Explorer without downloading them. When a user opens a file, it downloads on demand. A cloud icon indicates the file is online-only; a checkmark indicates it is locally available. This reduces local storage usage while maintaining full visibility of the cloud content.'
    },
    {
        id: 9,
        topic: 'Folder Redirection',
        question: 'An administrator configures folder redirection for the Documents folder via Group Policy. What is the PRIMARY benefit of this configuration?',
        options: [
            'Documents are compressed automatically to save space',
            'Documents are stored on a network server, enabling centralized backup and roaming access',
            'Documents are encrypted automatically with EFS',
            'Documents load faster because they are stored on faster network storage'
        ],
        correct: 1,
        explanation: 'Folder Redirection transparently moves user folders (Documents, Desktop, etc.) from local storage to a network share. Benefits include: centralized backup of all user data, roaming profile support (access from any machine), and reduced risk of data loss from local drive failure. Users see no change - it looks like a local folder.'
    },
    {
        id: 10,
        topic: 'EFS',
        question: 'A user encrypts files using EFS (Encrypting File System) then leaves the company. The IT team needs to decrypt those files. What must have been configured in advance to make this possible?',
        options: [
            'BitLocker recovery key stored in Active Directory',
            'A Data Recovery Agent (DRA) certificate configured in Group Policy',
            'The user\'s Microsoft account password',
            'The files cannot be recovered without the user\'s private key'
        ],
        correct: 1,
        explanation: 'EFS files can only be decrypted by the encrypting user or a designated Data Recovery Agent (DRA). A DRA is an account with a special certificate configured via Group Policy (Security Settings > Public Key Policies > Encrypting File System) before users encrypt files. Without a DRA, EFS-encrypted files are permanently inaccessible when the user account is deleted.'
    },
    {
        id: 11,
        topic: 'EFS',
        question: 'EXAM TIP: A user moves an EFS-encrypted file from an NTFS volume to a FAT32 USB drive. What happens to the encryption?',
        options: [
            'The file remains encrypted on the FAT32 drive',
            'Windows asks whether to keep or remove encryption during the copy',
            'The encryption is removed because FAT32 does not support EFS',
            'The copy fails because encrypted files cannot be moved to removable drives'
        ],
        correct: 2,
        explanation: 'EFS is an NTFS-only feature. When an EFS-encrypted file is copied or moved to a volume that does not support EFS (FAT32, exFAT, network shares without EFS support), the encryption is silently stripped and the file is stored in plaintext. This is a significant data security risk and a common exam gotcha. BitLocker protects the drive at rest; EFS does not carry over.'
    },
    {
        id: 12,
        topic: 'Offline Files',
        question: 'A laptop user regularly accesses files from a network share. The IT admin enables Offline Files for the share. What happens when the laptop loses network connectivity?',
        options: [
            'The user cannot access any files from the share',
            'The user can access a locally cached copy of the files they have opened previously',
            'The user receives an error and must reconnect to continue working',
            'OneDrive automatically synchronizes the files instead'
        ],
        correct: 1,
        explanation: 'Offline Files (Sync Center) caches copies of network share files locally. When the network is unavailable, Windows automatically switches to the cached version, allowing users to continue working. Changes made offline are synchronized back to the server when connectivity is restored. Sync conflicts are surfaced through Sync Center.'
    },
    {
        id: 13,
        topic: 'Access-Based Enumeration',
        question: 'Access-Based Enumeration (ABE) is enabled on a shared folder. User "jsmith" only has Read access to the "Payroll" subfolder. What does jsmith see when browsing the share?',
        options: [
            'All subfolders including those jsmith has no access to, with access denied errors when clicked',
            'Only the subfolders and files that jsmith has at least Read permission to',
            'A completely empty share because ABE hides all content',
            'Only the "Payroll" folder but with no ability to read its contents'
        ],
        correct: 1,
        explanation: 'Access-Based Enumeration hides files and folders that a user has no permission to access. Users only see objects they can actually open. This prevents information disclosure (users should not know confidential folders exist) and reduces confusion from "Access Denied" errors. ABE is configured on the share, not on individual folders.'
    },
    {
        id: 14,
        topic: 'Share Permissions',
        question: 'An administrator shares a folder and wants to control access granularly per-user. What is the recommended Microsoft best practice for permission configuration?',
        options: [
            'Set detailed permissions at the Share level and grant Full Control via NTFS',
            'Grant Everyone Full Control at the Share level and control access with NTFS permissions only',
            'Set identical permissions at both Share and NTFS level for simplicity',
            'Avoid NTFS permissions entirely and rely only on Share permissions'
        ],
        correct: 1,
        explanation: 'Microsoft\'s recommended best practice is to grant Everyone Full Control (or Authenticated Users Full Control) at the Share permission level, then use NTFS permissions exclusively for granular access control. This simplifies troubleshooting because you only need to manage one permission layer. Share permissions only apply to network access anyway, while NTFS applies both locally and over the network.'
    },
    {
        id: 15,
        topic: 'NTFS Permissions',
        question: 'A file has inherited Read permission from its parent folder. An administrator wants this specific file to have different permissions. What must be done first?',
        options: [
            'Delete the file and recreate it in a different folder',
            'Change the parent folder permissions to affect only the file',
            'Disable permission inheritance on the file, choosing to copy or remove inherited entries',
            'Inherited permissions cannot be changed; the file must be moved'
        ],
        correct: 2,
        explanation: 'To assign unique permissions to a specific file or folder, you must first break (disable) inheritance. In the ACL editor: Advanced > Disable Inheritance. Windows offers two choices: Convert inherited permissions to explicit entries (copy) which preserves current access while allowing modification, or Remove all inherited permissions. After breaking inheritance, you can customize permissions freely.'
    }
];

const state = {
    answers: JSON.parse(localStorage.getItem(QUIZ_ID + '_answers') || 'null') || {},
    submitted: false
};

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    questions.forEach((q, idx) => {
        const letters = ['A', 'B', 'C', 'D'];
        const card = document.createElement('div');
        card.className = 'question-card' + (state.answers[idx] !== undefined ? ' answered' : '');
        card.id = 'question-' + idx;
        card.innerHTML = `
            <div class="question-number">Question ${idx + 1} &mdash; ${q.topic}</div>
            <div class="question-text">${q.question}</div>
            <div class="options" id="options-${idx}">
                ${q.options.map((opt, oi) => `
                    <button class="option ${state.answers[idx] === oi ? 'selected' : ''}"
                            onclick="selectAnswer(${idx}, ${oi})"
                            id="opt-${idx}-${oi}">
                        <span class="option-letter">${letters[oi]}</span>
                        ${escapeHtml(opt)}
                    </button>
                `).join('')}
            </div>
            <div class="explanation" id="explanation-${idx}">
                <strong>Explanation:</strong> ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });
    updateProgress();
    updateSubmitButton();
}

function selectAnswer(qIdx, optIdx) {
    if (state.submitted) return;
    state.answers[qIdx] = optIdx;
    localStorage.setItem(QUIZ_ID + '_answers', JSON.stringify(state.answers));
    questions[qIdx].options.forEach((_, oi) => {
        document.getElementById('opt-' + qIdx + '-' + oi).className = 'option' + (oi === optIdx ? ' selected' : '');
    });
    document.getElementById('question-' + qIdx).classList.add('answered');
    updateProgress();
    updateSubmitButton();
}

function updateProgress() {
    const answered = Object.keys(state.answers).length;
    const pct = Math.round((answered / questions.length) * 100);
    document.getElementById('progress-text').textContent = answered + ' of ' + questions.length + ' answered';
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
}

function updateSubmitButton() {
    document.getElementById('submit-btn').disabled = Object.keys(state.answers).length < questions.length;
}

function submitQuiz() {
    state.submitted = true;
    let correct = 0;
    questions.forEach((q, idx) => {
        const chosen = state.answers[idx];
        const isCorrect = chosen === q.correct;
        if (isCorrect) correct++;
        questions[idx].options.forEach((_, oi) => {
            const btn = document.getElementById('opt-' + idx + '-' + oi);
            btn.classList.remove('selected');
            btn.classList.add('revealed');
            if (oi === q.correct) btn.classList.add('correct');
            else if (oi === chosen && !isCorrect) btn.classList.add('incorrect');
        });
        document.getElementById('explanation-' + idx).classList.add('visible');
    });
    const pct = Math.round((correct / questions.length) * 100);
    const passed = pct >= 70;
    localStorage.setItem(QUIZ_ID + '_score', JSON.stringify({ score: pct, correct, total: questions.length, passed, date: new Date().toISOString() }));
    const resultsCard = document.getElementById('results-card');
    resultsCard.classList.add('visible');
    document.getElementById('score-display').textContent = pct + '%';
    document.getElementById('score-label').textContent = correct + ' / ' + questions.length + ' correct';
    const badge = document.getElementById('pass-badge');
    badge.textContent = passed ? 'PASSED' : 'FAILED';
    badge.className = 'pass-badge ' + (passed ? 'pass' : 'fail');
    document.getElementById('results-message').textContent = passed
        ? 'Outstanding. Data access and permissions are among the most frequently tested areas on MD-100. Mastering the Deny-overrides-Allow rule and NTFS+Share interaction puts you in a strong position.'
        : 'Permissions are tricky. The two rules that trip most candidates: Deny always beats Allow, and network access uses the most restrictive of NTFS and Share permissions. Build a mental model around those and retake.';
    document.querySelector('.quiz-actions').innerHTML = '<button class="btn btn-primary" onclick="retakeQuiz()">Retake Quiz</button>';
    resultsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retakeQuiz() {
    localStorage.removeItem(QUIZ_ID + '_answers');
    localStorage.removeItem(QUIZ_ID + '_score');
    state.answers = {};
    state.submitted = false;
    document.getElementById('results-card').classList.remove('visible');
    document.querySelector('.quiz-actions').innerHTML = '<button class="btn btn-primary" id="submit-btn" disabled onclick="submitQuiz()">Submit Quiz</button>';
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

renderQuestions();
</script>

</body>
</html>
