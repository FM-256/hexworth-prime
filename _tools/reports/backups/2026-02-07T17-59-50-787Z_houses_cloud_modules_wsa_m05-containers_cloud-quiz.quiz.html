<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA M05 Quiz: Containers & Nano Server - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-bg: #0a0a0f; --secondary-bg: #12141f; --panel-bg: #1a1c28;
            --border-color: #2d3748; --accent-blue: #60a5fa; --accent-light: #93c5fd;
            --text-primary: #e0e0e0; --text-secondary: #9ca3af;
            --success-color: #22c55e; --error-color: #ef4444;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--primary-bg); color: var(--text-primary); min-height: 100vh; }
        .page-header { background: var(--secondary-bg); padding: 12px 20px; border-bottom: 2px solid var(--accent-blue); display: flex; justify-content: space-between; align-items: center; }
        .page-header h1 { font-size: 1.2rem; color: var(--accent-blue); }
        .header-btn { padding: 8px 16px; background: rgba(96, 165, 250, 0.1); border: 1px solid rgba(96, 165, 250, 0.3); color: var(--accent-blue); border-radius: 6px; text-decoration: none; font-size: 0.85rem; }
        .quiz-container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .quiz-progress { background: var(--secondary-bg); border-radius: 8px; padding: 15px 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .progress-bar { flex: 1; height: 8px; background: var(--panel-bg); border-radius: 4px; margin: 0 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent-blue); border-radius: 4px; transition: width 0.3s; }
        .question-card { background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; margin-bottom: 30px; }
        .question-number { color: var(--accent-blue); font-size: 0.9rem; margin-bottom: 10px; }
        .question-text { font-size: 1.2rem; margin-bottom: 25px; line-height: 1.6; }
        .options-list { list-style: none; }
        .option { background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 8px; padding: 15px 20px; margin-bottom: 12px; cursor: pointer; display: flex; align-items: center; gap: 15px; transition: all 0.2s; }
        .option:hover { border-color: var(--accent-blue); }
        .option.correct { border-color: var(--success-color); background: rgba(34, 197, 94, 0.1); }
        .option.incorrect { border-color: var(--error-color); background: rgba(239, 68, 68, 0.1); }
        .option-letter { width: 32px; height: 32px; border-radius: 50%; background: var(--border-color); display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .option.correct .option-letter { background: var(--success-color); color: #fff; }
        .option.incorrect .option-letter { background: var(--error-color); color: #fff; }
        .explanation { display: none; background: rgba(96, 165, 250, 0.1); border-left: 4px solid var(--accent-blue); padding: 15px 20px; margin-top: 20px; border-radius: 0 8px 8px 0; }
        .explanation.show { display: block; }
        .explanation h4 { color: var(--accent-blue); margin-bottom: 8px; }
        .quiz-nav { display: flex; justify-content: space-between; gap: 15px; }
        .nav-btn { padding: 12px 30px; border-radius: 8px; font-size: 1rem; cursor: pointer; border: none; }
        .nav-btn.secondary { background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); }
        .nav-btn.primary { background: var(--accent-blue); color: #000; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .results-card { display: none; background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 40px; text-align: center; }
        .results-card.show { display: block; }
        .results-score { font-size: 4rem; font-weight: 700; color: var(--accent-blue); margin: 20px 0; }
        .results-score.passing { color: var(--success-color); }
        .results-score.failing { color: var(--error-color); }
        .results-message { font-size: 1.2rem; margin-bottom: 30px; color: var(--text-secondary); }
        .results-actions { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .nav-footer { background: var(--secondary-bg); padding: 12px 20px; display: flex; justify-content: center; gap: 15px; border-top: 1px solid var(--border-color); margin-top: 40px; }
        .footer-btn { padding: 10px 20px; background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); border-radius: 6px; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <script src="../progress.js"></script>
    <div class="page-header">
        <h1>WSA M05 Quiz: Containers & Nano Server</h1>
        <div class="header-controls">
            <a class="header-btn" href="presentation.html">&larr; Review Material</a>
        </div>
    </div>

    <div class="quiz-container">
        <div class="quiz-progress">
            <span id="progressText">Question 1 of 10</span>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 10%"></div></div>
            <span id="scoreText">Score: 0</span>
        </div>
        <div id="questionContainer"></div>
        <div class="results-card" id="resultsCard">
            <h2>Quiz Complete!</h2>
            <div class="results-score" id="finalScore">0%</div>
            <p class="results-message" id="resultsMessage"></p>
            <div class="results-actions">
                <button class="nav-btn secondary" onclick="restartQuiz()">Try Again</button>
                <a href="presentation.html" class="nav-btn secondary">Review Material</a>
                <a href="../m06-clustering/presentation.html" class="nav-btn primary">Next Module &rarr;</a>
            </div>
        </div>
    </div>

    <div class="nav-footer">
        <a href="presentation.html" class="footer-btn">&larr; Presentation</a>
        <a href="gui-lab.html" class="footer-btn">GUI Lab</a>
        <a href="ps-lab.html" class="footer-btn">PS Lab</a>
        <a href="../index.html" class="footer-btn">Course Home</a>
    </div>

    <script>
        const questions = [
            { question: "What is the primary difference between containers and virtual machines?", options: ["Containers require more resources", "Containers share the host OS kernel", "VMs are faster to start", "VMs use less disk space"], correct: 1, explanation: "Containers share the host operating system kernel, making them lightweight and fast to start. VMs include a full OS for each instance." },
            { question: "Which Windows container isolation mode provides the strongest security boundary?", options: ["Process isolation", "Hyper-V isolation", "NAT isolation", "Bridge isolation"], correct: 1, explanation: "Hyper-V isolation runs each container in a lightweight VM, providing hardware-level isolation similar to traditional VMs." },
            { question: "What is the approximate size of a Windows Nano Server container image?", options: ["50 MB", "300 MB", "1 GB", "2.5 GB"], correct: 1, explanation: "Nano Server is approximately 300 MB, making it the smallest official Windows container base image." },
            { question: "Which Docker command lists all running containers?", options: ["docker list", "docker containers", "docker ps", "docker show"], correct: 2, explanation: "docker ps lists running containers. Add -a flag to show all containers including stopped ones." },
            { question: "Since Windows Server 2019, how can Nano Server be deployed?", options: ["As a standalone installation only", "As a container base image only", "Both standalone and container", "As a VM template only"], correct: 1, explanation: "Since Windows Server 2019, Nano Server is only available as a container base image. It can no longer be installed as a standalone OS." },
            { question: "What does the -d flag do in 'docker run -d'?", options: ["Deletes the container after exit", "Runs in detached (background) mode", "Enables debug logging", "Duplicates the container"], correct: 1, explanation: "The -d flag runs the container in detached mode, meaning it runs in the background and doesn't block the terminal." },
            { question: "Which Dockerfile instruction specifies the command to run when a container starts?", options: ["CMD", "RUN", "EXEC", "START"], correct: 0, explanation: "CMD specifies the default command to run when a container starts. ENTRYPOINT is similar but harder to override." },
            { question: "What is NOT included in Windows Nano Server?", options: [".NET Core Runtime", "PowerShell Core", "Full .NET Framework", "Base networking stack"], correct: 2, explanation: "Nano Server does not include the full .NET Framework, GUI, 32-bit support, or MSI installer. It only supports .NET Core." },
            { question: "Which command enters an interactive PowerShell session inside a running container?", options: ["docker attach", "docker exec -it <container> powershell", "docker shell", "docker connect"], correct: 1, explanation: "docker exec -it <container> powershell runs PowerShell inside the container with an interactive terminal (-it flags)." },
            { question: "What must match between host and container for process isolation to work?", options: ["CPU architecture only", "Memory size", "OS version", "Network configuration"], correct: 2, explanation: "For process isolation, the container's base image OS version must match or be older than the host OS version. Hyper-V isolation doesn't have this requirement." }
        ];

        let currentQuestion = 0, score = 0, answered = false;

        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('questionContainer').innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <ul class="options-list">
                        ${q.options.map((opt, i) => `
                            <li class="option" onclick="selectOption(${i})">
                                <span class="option-letter">${String.fromCharCode(65 + i)}</span>
                                <span>${opt}</span>
                            </li>
                        `).join('')}
                    </ul>
                    <div class="explanation" id="explanation"><h4>Explanation</h4><p>${q.explanation}</p></div>
                </div>
                <div class="quiz-nav">
                    <button class="nav-btn secondary" onclick="previousQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>&larr; Previous</button>
                    <button class="nav-btn primary" id="nextBtn" onclick="nextQuestion()" disabled>${currentQuestion === questions.length - 1 ? 'Finish' : 'Next'} &rarr;</button>
                </div>
            `;
            answered = false;
            updateProgress();
        }

        function selectOption(index) {
            if (answered) return;
            answered = true;
            const options = document.querySelectorAll('.option');
            const correct = questions[currentQuestion].correct;
            options.forEach((opt, i) => {
                opt.style.pointerEvents = 'none';
                if (i === correct) opt.classList.add('correct');
                else if (i === index) opt.classList.add('incorrect');
            });
            if (index === correct) { score++; document.getElementById('scoreText').textContent = `Score: ${score}`; }
            document.getElementById('explanation').classList.add('show');
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) { currentQuestion++; renderQuestion(); }
            else showResults();
        }

        function previousQuestion() { if (currentQuestion > 0) { currentQuestion--; renderQuestion(); } }

        function updateProgress() {
            document.getElementById('progressFill').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function showResults() {
            document.getElementById('questionContainer').innerHTML = '';
            document.querySelector('.quiz-progress').style.display = 'none';
            const pct = Math.round((score / questions.length) * 100);
            const passing = pct >= 70;
            const resultsCard = document.getElementById('resultsCard');
            resultsCard.classList.add('show');
            const scoreEl = document.getElementById('finalScore');
            scoreEl.textContent = `${pct}%`;
            scoreEl.className = `results-score ${passing ? 'passing' : 'failing'}`;
            document.getElementById('resultsMessage').textContent = pct === 100 ? "Perfect! You've mastered containers!" :
                pct >= 80 ? "Excellent work on container concepts!" : pct >= 70 ? "Good job! Review weak areas." : "Keep practicing! Review the material.";
            if (passing) {
                WSAProgress.markQuizPassed('m05');
                try {
                    const progress = JSON.parse(localStorage.getItem('hexworthProgress') || '{}');
                    progress['wsa-m05-quiz'] = { completed: true, score: pct, date: new Date().toISOString() };
                    localStorage.setItem('hexworthProgress', JSON.stringify(progress));
                } catch (e) {}
            }
        }

        function restartQuiz() {
            currentQuestion = 0; score = 0; answered = false;
            document.getElementById('resultsCard').classList.remove('show');
            document.querySelector('.quiz-progress').style.display = 'flex';
            document.getElementById('scoreText').textContent = 'Score: 0';
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
