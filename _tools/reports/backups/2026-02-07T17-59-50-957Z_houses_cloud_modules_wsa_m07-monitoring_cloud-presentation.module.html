<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSA M07: Monitoring & Management - Hexworth Prime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-bg: #0a0a0f; --secondary-bg: #12141f; --panel-bg: #1a1c28;
            --border-color: #2d3748; --accent-blue: #60a5fa; --accent-light: #93c5fd;
            --text-primary: #e0e0e0; --text-secondary: #9ca3af;
            --success-color: #22c55e; --warning-color: #f59e0b; --error-color: #ef4444;
            --azure-blue: #0078d4; --wac-purple: #7c3aed;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--primary-bg); color: var(--text-primary); min-height: 100vh; overflow: hidden; }
        .presentation-container { display: flex; flex-direction: column; height: 100vh; }
        .slide-header { background: var(--secondary-bg); padding: 12px 20px; border-bottom: 2px solid var(--accent-blue); display: flex; justify-content: space-between; align-items: center; }
        .slide-header h1 { font-size: 1.2rem; color: var(--accent-blue); }
        .header-controls { display: flex; gap: 15px; align-items: center; }
        .slide-counter { color: var(--accent-light); font-size: 0.9rem; }
        .header-btn { padding: 8px 16px; background: rgba(96, 165, 250, 0.1); border: 1px solid rgba(96, 165, 250, 0.3); color: var(--accent-blue); border-radius: 6px; cursor: pointer; font-size: 0.85rem; text-decoration: none; transition: all 0.3s; }
        .header-btn:hover { background: var(--accent-blue); color: #000; }
        .slide-area { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px; overflow: auto; }
        .slide { max-width: 1000px; width: 100%; }
        .slide-title { font-size: 2.2rem; color: var(--accent-blue); margin-bottom: 30px; text-align: center; }
        .slide-content { background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; }
        .slide-nav { background: var(--secondary-bg); padding: 15px 20px; border-top: 1px solid var(--border-color); display: flex; justify-content: center; gap: 15px; }
        .nav-btn { padding: 10px 25px; border-radius: 8px; font-size: 1rem; cursor: pointer; border: none; transition: all 0.3s; }
        .nav-btn.secondary { background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); }
        .nav-btn.primary { background: var(--accent-blue); color: #000; }
        .nav-btn:hover { transform: translateY(-2px); }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .key-points { list-style: none; }
        .key-points li { padding: 12px 15px; margin-bottom: 10px; background: var(--panel-bg); border-left: 4px solid var(--accent-blue); border-radius: 0 8px 8px 0; }
        .key-points li strong { color: var(--accent-blue); }
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .comparison-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        .comparison-card h4 { color: var(--warning-color); margin-bottom: 12px; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .comparison-card ul { list-style: none; font-size: 0.9rem; color: var(--text-secondary); }
        .comparison-card li { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .comparison-card li:last-child { border-bottom: none; }
        .code-block { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 0.9rem; overflow-x: auto; margin: 15px 0; }
        .code-block .comment { color: #6a9955; }
        .code-block .cmdlet { color: #dcdcaa; }
        .code-block .param { color: #9cdcfe; }
        .code-block .string { color: #ce9178; }
        .tools-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
        .tool-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; text-align: center; }
        .tool-card .icon { font-size: 2.5rem; margin-bottom: 10px; }
        .tool-card h5 { color: var(--accent-blue); margin-bottom: 8px; }
        .tool-card p { font-size: 0.85rem; color: var(--text-secondary); }
        .info-box { background: rgba(0, 120, 212, 0.1); border-left: 4px solid var(--azure-blue); padding: 15px; border-radius: 0 8px 8px 0; margin: 15px 0; }
        .warning-box { background: rgba(245, 158, 11, 0.1); border-left: 4px solid var(--warning-color); padding: 15px; border-radius: 0 8px 8px 0; margin: 15px 0; }
        .event-types { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
        .event-type { padding: 15px 10px; border-radius: 8px; text-align: center; font-size: 0.8rem; }
        .event-type.error { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--error-color); color: var(--error-color); }
        .event-type.warning { background: rgba(245, 158, 11, 0.2); border: 1px solid var(--warning-color); color: var(--warning-color); }
        .event-type.info { background: rgba(96, 165, 250, 0.2); border: 1px solid var(--accent-blue); color: var(--accent-blue); }
        .event-type.success { background: rgba(34, 197, 94, 0.2); border: 1px solid var(--success-color); color: var(--success-color); }
        .event-type.critical { background: rgba(127, 29, 29, 0.4); border: 1px solid #dc2626; color: #fca5a5; }
        .nav-footer { background: var(--secondary-bg); padding: 12px 20px; display: flex; justify-content: center; gap: 15px; border-top: 1px solid var(--border-color); }
        .footer-btn { padding: 10px 20px; background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); border-radius: 6px; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="presentation-container">
        <div class="slide-header">
            <h1>WSA M07: Monitoring & Management</h1>
            <div class="header-controls">
                <span class="slide-counter" id="slideCounter">Slide 1 of 8</span>
                <a class="header-btn" href="../index.html">&larr; Course Home</a>
            </div>
        </div>

        <div class="slide-area">
            <div class="slide" id="slideContent"></div>
        </div>

        <div class="slide-nav">
            <button class="nav-btn secondary" id="prevBtn" onclick="prevSlide()">&larr; Previous</button>
            <button class="nav-btn primary" id="nextBtn" onclick="nextSlide()">Next &rarr;</button>
        </div>

        <div class="nav-footer">
            <a href="gui-lab.html" class="footer-btn">GUI Lab</a>
            <a href="ps-lab.html" class="footer-btn">PS Lab</a>
            <a href="quiz.html" class="footer-btn">Quiz</a>
        </div>
    </div>

    <script>
        const slides = [
            // Slide 1: Title
            {
                title: "Monitoring & Management",
                content: `
                    <div style="text-align: center; padding: 40px 0;">
                        <div style="font-size: 5rem; margin-bottom: 20px;">📊</div>
                        <h2 style="color: var(--warning-color); font-size: 1.8rem; margin-bottom: 15px;">Module 07: Visibility & Control</h2>
                        <p style="color: var(--text-secondary); font-size: 1.1rem; max-width: 600px; margin: 0 auto;">
                            Monitor server health, analyze events, track performance, and manage updates across your Windows Server infrastructure.
                        </p>
                        <div style="display: flex; justify-content: center; gap: 40px; margin-top: 40px;">
                            <div style="text-align: center;">
                                <div style="font-size: 2.5rem;">📋</div>
                                <div style="color: var(--warning-color); font-weight: 600;">Event Viewer</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 2.5rem;">📈</div>
                                <div style="color: var(--success-color); font-weight: 600;">Performance</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 2.5rem;">☁️</div>
                                <div style="color: var(--azure-blue); font-weight: 600;">Azure Arc</div>
                            </div>
                        </div>
                    </div>
                `
            },
            // Slide 2: Event Viewer
            {
                title: "Event Viewer",
                content: `
                    <p style="margin-bottom: 20px;">Event Viewer (eventvwr.msc) is the central location for system logs and application events:</p>
                    <div class="event-types">
                        <div class="event-type critical">🔴<br>Critical</div>
                        <div class="event-type error">❌<br>Error</div>
                        <div class="event-type warning">⚠️<br>Warning</div>
                        <div class="event-type info">ℹ️<br>Information</div>
                        <div class="event-type success">✓<br>Success Audit</div>
                    </div>
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h4>📁 Windows Logs</h4>
                            <ul>
                                <li><strong>Application</strong> - App-generated events</li>
                                <li><strong>Security</strong> - Logon, access audits</li>
                                <li><strong>System</strong> - OS and drivers</li>
                                <li><strong>Setup</strong> - Installation events</li>
                            </ul>
                        </div>
                        <div class="comparison-card">
                            <h4 style="color: var(--accent-blue);">📂 Applications and Services</h4>
                            <ul>
                                <li><strong>Microsoft → Windows</strong> - Feature logs</li>
                                <li><strong>DNS Server</strong> - DNS queries/errors</li>
                                <li><strong>Directory Service</strong> - AD events</li>
                                <li><strong>PowerShell</strong> - Script execution</li>
                            </ul>
                        </div>
                    </div>
                    <div class="code-block">
<span class="comment"># Query recent errors from System log</span>
<span class="cmdlet">Get-WinEvent</span> <span class="param">-LogName</span> System <span class="param">-MaxEvents</span> 50 | <span class="cmdlet">Where-Object</span> { $_.LevelDisplayName -eq <span class="string">'Error'</span> }
                    </div>
                `
            },
            // Slide 3: Performance Monitor
            {
                title: "Performance Monitor",
                content: `
                    <p style="margin-bottom: 20px;">Performance Monitor (perfmon.msc) tracks real-time and historical system metrics:</p>
                    <div class="tools-grid">
                        <div class="tool-card">
                            <div class="icon">📊</div>
                            <h5>Performance Monitor</h5>
                            <p>Real-time graphs of CPU, memory, disk, network counters</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon">📁</div>
                            <h5>Data Collector Sets</h5>
                            <p>Scheduled collection of performance data over time</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon">📋</div>
                            <h5>Reports</h5>
                            <p>Analyze collected data with built-in reports</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon">⚠️</div>
                            <h5>Alerts</h5>
                            <p>Trigger actions when thresholds are exceeded</p>
                        </div>
                    </div>
                    <ul class="key-points">
                        <li><strong>Processor → % Processor Time</strong> - CPU utilization (healthy: < 80%)</li>
                        <li><strong>Memory → Available MBytes</strong> - Free RAM (healthy: > 10% of total)</li>
                        <li><strong>Physical Disk → Avg. Disk Queue Length</strong> - I/O bottleneck (healthy: < 2)</li>
                        <li><strong>Network Interface → Bytes Total/sec</strong> - Network throughput</li>
                    </ul>
                    <div class="code-block">
<span class="comment"># Get current CPU usage</span>
<span class="cmdlet">Get-Counter</span> <span class="string">'\\Processor(_Total)\\% Processor Time'</span>
                    </div>
                `
            },
            // Slide 4: Windows Admin Center
            {
                title: "Windows Admin Center (WAC)",
                content: `
                    <p style="margin-bottom: 20px;">Browser-based management tool for Windows Server and Windows 10/11:</p>
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h4 style="color: var(--wac-purple);">Features</h4>
                            <ul>
                                <li>Single pane of glass management</li>
                                <li>No agents required on managed servers</li>
                                <li>Role-based access control</li>
                                <li>PowerShell integration</li>
                                <li>Azure hybrid services integration</li>
                            </ul>
                        </div>
                        <div class="comparison-card">
                            <h4 style="color: var(--accent-blue);">Managed Components</h4>
                            <ul>
                                <li>Servers (local & remote)</li>
                                <li>Failover Clusters</li>
                                <li>Hyper-V hosts and VMs</li>
                                <li>Azure Stack HCI</li>
                                <li>Windows 10/11 PCs</li>
                            </ul>
                        </div>
                    </div>
                    <div class="info-box">
                        <strong>Deployment Options:</strong><br>
                        • <strong>Local client</strong> - Install on admin workstation (smallest scale)<br>
                        • <strong>Gateway server</strong> - Central WAC server for team access (recommended)<br>
                        • <strong>Failover cluster</strong> - HA gateway for enterprise
                    </div>
                    <div class="code-block">
<span class="comment"># Install WAC on a gateway server</span>
msiexec /i WindowsAdminCenter.msi /qn /L*v log.txt SME_PORT=443 SSL_CERTIFICATE_OPTION=generate
                    </div>
                `
            },
            // Slide 5: WSUS
            {
                title: "Windows Server Update Services (WSUS)",
                content: `
                    <p style="margin-bottom: 20px;">WSUS provides centralized update management for Windows clients and servers:</p>
                    <div class="tools-grid">
                        <div class="tool-card">
                            <div class="icon">⬇️</div>
                            <h5>Download</h5>
                            <p>Downloads updates from Microsoft Update</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon">✓</div>
                            <h5>Approve</h5>
                            <p>Admin approves updates for deployment</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon">📦</div>
                            <h5>Deploy</h5>
                            <p>Clients receive approved updates from WSUS</p>
                        </div>
                        <div class="tool-card">
                            <div class="icon">📊</div>
                            <h5>Report</h5>
                            <p>Track compliance across the organization</p>
                        </div>
                    </div>
                    <ul class="key-points">
                        <li><strong>Computer Groups</strong> - Organize clients (Servers, Workstations, Test)</li>
                        <li><strong>Automatic Approvals</strong> - Rules for auto-approving update classifications</li>
                        <li><strong>Deadline</strong> - Force install by a specific date/time</li>
                        <li><strong>Supersedence</strong> - Newer updates replace older ones</li>
                    </ul>
                    <div class="code-block">
<span class="comment"># Force client to check for updates from WSUS</span>
wuauclt /detectnow
<span class="cmdlet">Invoke-WUJob</span> <span class="param">-ComputerName</span> <span class="string">"Server01"</span> <span class="param">-Script</span> { ipmo PSWindowsUpdate; Install-WindowsUpdate -AcceptAll }
                    </div>
                `
            },
            // Slide 6: Azure Arc
            {
                title: "Azure Arc for Servers",
                content: `
                    <p style="margin-bottom: 20px;">Extend Azure management and governance to on-premises and multi-cloud servers:</p>
                    <div class="comparison-grid">
                        <div class="comparison-card">
                            <h4 style="color: var(--azure-blue);">Azure Arc Capabilities</h4>
                            <ul>
                                <li>Azure Policy enforcement</li>
                                <li>Azure Monitor & Log Analytics</li>
                                <li>Microsoft Defender for Cloud</li>
                                <li>Azure Automation (Update Management)</li>
                                <li>Azure RBAC for on-prem servers</li>
                            </ul>
                        </div>
                        <div class="comparison-card">
                            <h4 style="color: var(--success-color);">How It Works</h4>
                            <ul>
                                <li>Install Connected Machine agent</li>
                                <li>Agent registers with Azure</li>
                                <li>Server appears in Azure Portal</li>
                                <li>Apply Azure services to hybrid servers</li>
                                <li>No VPN or ExpressRoute required</li>
                            </ul>
                        </div>
                    </div>
                    <div class="info-box">
                        <strong>Azure Arc-enabled servers let you:</strong> Use Azure Policy to audit configurations, deploy Azure Monitor agents, run Azure Automation runbooks, and apply Microsoft Defender for Cloud - all on servers running anywhere.
                    </div>
                    <div class="code-block">
<span class="comment"># Connect server to Azure Arc</span>
azcmagent connect --resource-group <span class="string">"HexworthRG"</span> --tenant-id <span class="string">"&lt;tenant-id&gt;"</span> --location <span class="string">"eastus"</span> --subscription-id <span class="string">"&lt;sub-id&gt;"</span>
                    </div>
                `
            },
            // Slide 7: PowerShell Monitoring
            {
                title: "PowerShell Monitoring Commands",
                content: `
                    <div class="code-block">
<span class="comment"># Event Log Queries</span>
<span class="cmdlet">Get-WinEvent</span> <span class="param">-LogName</span> System <span class="param">-MaxEvents</span> 100
<span class="cmdlet">Get-WinEvent</span> <span class="param">-FilterHashtable</span> @{LogName=<span class="string">'Security'</span>;ID=4624}  <span class="comment"># Logon events</span>
<span class="cmdlet">Get-EventLog</span> <span class="param">-LogName</span> Application <span class="param">-EntryType</span> Error <span class="param">-Newest</span> 20

<span class="comment"># Performance Counters</span>
<span class="cmdlet">Get-Counter</span> <span class="string">'\\Processor(_Total)\\% Processor Time'</span>
<span class="cmdlet">Get-Counter</span> <span class="string">'\\Memory\\Available MBytes'</span>
<span class="cmdlet">Get-Counter</span> <span class="param">-ListSet</span> * | <span class="cmdlet">Select-Object</span> CounterSetName  <span class="comment"># List all counter sets</span>

<span class="comment"># System Information</span>
<span class="cmdlet">Get-ComputerInfo</span>
<span class="cmdlet">Get-Process</span> | <span class="cmdlet">Sort-Object</span> CPU <span class="param">-Descending</span> | <span class="cmdlet">Select-Object</span> <span class="param">-First</span> 10
<span class="cmdlet">Get-Service</span> | <span class="cmdlet">Where-Object</span> Status -eq <span class="string">'Stopped'</span>

<span class="comment"># Remote Monitoring</span>
<span class="cmdlet">Invoke-Command</span> <span class="param">-ComputerName</span> Server01,Server02 <span class="param">-ScriptBlock</span> { Get-Counter <span class="string">'\\Processor(_Total)\\% Processor Time'</span> }
                    </div>
                `
            },
            // Slide 8: Summary
            {
                title: "Module Summary",
                content: `
                    <ul class="key-points">
                        <li><strong>Event Viewer</strong> centralizes system, security, and application logs for troubleshooting</li>
                        <li><strong>Performance Monitor</strong> tracks real-time metrics and creates data collector sets for analysis</li>
                        <li><strong>Windows Admin Center</strong> provides browser-based, agent-less management of servers and clusters</li>
                        <li><strong>WSUS</strong> centralizes Windows update management with approval workflows and compliance reporting</li>
                        <li><strong>Azure Arc</strong> extends Azure governance (Policy, Monitor, Defender) to on-premises servers</li>
                        <li><strong>PowerShell</strong> enables scriptable monitoring with Get-WinEvent, Get-Counter, and remoting</li>
                    </ul>
                    <div style="margin-top: 30px; padding: 20px; background: var(--panel-bg); border-radius: 8px; text-align: center;">
                        <p style="margin-bottom: 15px;">Ready to practice?</p>
                        <a href="gui-lab.html" class="header-btn" style="margin-right: 10px;">GUI Lab</a>
                        <a href="ps-lab.html" class="header-btn" style="margin-right: 10px;">PowerShell Lab</a>
                        <a href="quiz.html" class="header-btn">Take Quiz</a>
                    </div>
                `
            }
        ];

        let currentSlide = 0;

        function renderSlide() {
            const slide = slides[currentSlide];
            document.getElementById('slideContent').innerHTML = `
                <h2 class="slide-title">${slide.title}</h2>
                <div class="slide-content">${slide.content}</div>
            `;
            document.getElementById('slideCounter').textContent = `Slide ${currentSlide + 1} of ${slides.length}`;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').textContent = currentSlide === slides.length - 1 ? 'Finish' : 'Next →';
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); }
            else { window.location.href = 'gui-lab.html'; }
        }

        function prevSlide() {
            if (currentSlide > 0) { currentSlide--; renderSlide(); }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        renderSlide();
    </script>
    <script src="../progress.js"></script>
    <script>WSAProgress.markPresentationViewed('m07');</script>
</body>
</html>
