<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-100 Module 02: Authorization & Authentication - Forge House</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1510 50%, #0d0d15 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e0e0e0;
        }

        .page-header {
            padding: 14px 28px;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(234,88,12,0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a { color: #ea580c; text-decoration: none; font-size: 0.875rem; transition: color 0.2s; }
        .page-header a:hover { color: #f97316; }
        .brand { font-weight: 600; color: #e0e0e0; display: flex; align-items: center; gap: 8px; }

        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 32px 20px 48px;
        }
        .quiz-container { width: 100%; max-width: 820px; }

        .quiz-header {
            background: linear-gradient(135deg, rgba(234,88,12,0.1) 0%, rgba(249,115,22,0.05) 100%);
            border: 1px solid rgba(234,88,12,0.3);
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            margin-bottom: 24px;
        }
        .quiz-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .quiz-title { font-size: 1.5rem; font-weight: 700; color: #f97316; margin-bottom: 6px; }
        .quiz-subtitle { color: #9ca3af; font-size: 0.95rem; margin-bottom: 14px; }
        .quiz-meta { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .quiz-meta span { background: rgba(234,88,12,0.15); border: 1px solid rgba(234,88,12,0.3); border-radius: 20px; padding: 4px 14px; font-size: 0.8rem; color: #fb923c; }

        .progress-section { margin-bottom: 20px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: #9ca3af; margin-bottom: 6px; }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ea580c 0%, #f97316 100%); border-radius: 3px; transition: width 0.3s ease; }

        .question-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(234,88,12,0.15);
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        .question-card.answered { border-color: rgba(234,88,12,0.35); }
        .question-number { font-size: 0.75rem; color: #ea580c; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .question-text { font-size: 1rem; line-height: 1.55; color: #e5e7eb; margin-bottom: 16px; }

        .options { display: flex; flex-direction: column; gap: 9px; }
        .option {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.18s ease;
            text-align: left;
            color: #d1d5db;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .option:hover:not(:disabled) { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.4); color: #f3f4f6; }
        .option.selected { background: rgba(234,88,12,0.18); border-color: rgba(234,88,12,0.6); color: #fff; }
        .option.correct { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.6); color: #86efac; }
        .option.incorrect { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.6); color: #fca5a5; }
        .option.revealed { cursor: default; }
        .option-letter {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; min-width: 22px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            font-size: 0.75rem; font-weight: 700; color: #9ca3af;
        }
        .option.selected .option-letter { background: #ea580c; color: #fff; }
        .option.correct .option-letter { background: #22c55e; color: #fff; }
        .option.incorrect .option-letter { background: #ef4444; color: #fff; }

        .explanation {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            background: rgba(249,115,22,0.08);
            border-left: 3px solid #ea580c;
            border-radius: 0 6px 6px 0;
            font-size: 0.875rem;
            color: #d1d5db;
            line-height: 1.55;
        }
        .explanation.visible { display: block; }
        .explanation strong { color: #f97316; }

        .quiz-actions { text-align: center; margin: 28px 0 20px; }
        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 11px 28px; border-radius: 7px; border: none;
            cursor: pointer; font-size: 0.95rem; font-weight: 600;
            text-decoration: none; transition: all 0.2s ease;
        }
        .btn-primary { background: linear-gradient(135deg, #ea580c 0%, #f97316 100%); color: #fff; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(234,88,12,0.4); }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary { background: rgba(255,255,255,0.07); border: 1px solid rgba(234,88,12,0.35); color: #fb923c; }
        .btn-secondary:hover { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.6); }

        .results-card {
            display: none;
            background: linear-gradient(135deg, rgba(234,88,12,0.08) 0%, rgba(249,115,22,0.04) 100%);
            border: 1px solid rgba(234,88,12,0.3);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
        }
        .results-card.visible { display: block; }
        .score-display { font-size: 3.5rem; font-weight: 800; color: #f97316; line-height: 1; margin-bottom: 6px; }
        .score-label { color: #9ca3af; font-size: 0.9rem; margin-bottom: 16px; }
        .pass-badge { display: inline-block; padding: 6px 20px; border-radius: 20px; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 16px; }
        .pass-badge.pass { background: rgba(34,197,94,0.2); color: #22c55e; border: 1px solid rgba(34,197,94,0.4); }
        .pass-badge.fail { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.4); }
        .results-message { color: #d1d5db; font-size: 0.95rem; line-height: 1.5; }

        .nav-buttons {
            display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
            margin-top: 24px; padding-top: 20px;
            border-top: 1px solid rgba(234,88,12,0.15);
        }
    </style>
</head>
<body>

<header class="page-header">
    <a href="../../index.html">← Back to Forge House</a>
    <span class="brand"><span>⚒️</span> Hexworth Prime</span>
</header>

<main class="quiz-wrapper">
    <div class="quiz-container">

        <header class="quiz-header">
            <div class="quiz-icon">⚒️</div>
            <h1 class="quiz-title">Authorization &amp; Authentication Quiz</h1>
            <p class="quiz-subtitle">MD-100 Module 02 Assessment</p>
            <div class="quiz-meta">
                <span>📝 15 Questions</span>
                <span>⏱️ No Time Limit</span>
                <span>🎯 70% to Pass</span>
            </div>
        </header>

        <div class="progress-section">
            <div class="progress-label">
                <span id="progress-text">0 of 15 answered</span>
                <span id="progress-pct">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width:0%"></div>
            </div>
        </div>

        <div class="results-card" id="results-card">
            <div class="score-display" id="score-display">0%</div>
            <div class="score-label" id="score-label">0 / 15 correct</div>
            <div class="pass-badge" id="pass-badge">--</div>
            <p class="results-message" id="results-message"></p>
        </div>

        <div id="questions-container"></div>

        <div class="quiz-actions">
            <button class="btn btn-primary" id="submit-btn" disabled onclick="submitQuiz()">
                Submit Quiz
            </button>
        </div>

        <nav class="nav-buttons">
            <a href="../labs/md100-m02-auth.lab.html" class="btn btn-secondary">← Review Lab</a>
            <a href="../../index.html" class="btn btn-secondary">Forge House →</a>
        </nav>

    </div>
</main>

<script>
const QUIZ_ID = 'hexworth_md100_m02';

const questions = [
    {
        id: 1,
        topic: 'Account Types',
        question: 'A user signs in to a Windows 10 PC using a Microsoft account. Where are the user\'s credentials ultimately authenticated?',
        options: [
            'Locally in the SAM database only',
            'Against Microsoft\'s cloud authentication servers',
            'Against Active Directory on-premises',
            'Against Azure Active Directory joined to the device'
        ],
        correct: 1,
        explanation: 'Microsoft accounts are authenticated against Microsoft\'s cloud identity service (Microsoft Identity Platform). The device caches credentials locally for offline use, but the authoritative authentication happens in the cloud. This is distinct from Azure AD join, which is an enterprise scenario.'
    },
    {
        id: 2,
        topic: 'Account Types',
        question: 'Which account type is stored only on the local machine and has no cloud sync or roaming profile capabilities?',
        options: [
            'Microsoft account',
            'Azure AD account',
            'Local account',
            'Domain account'
        ],
        correct: 2,
        explanation: 'Local accounts exist only in the SAM database on the local machine. They cannot sync settings across devices or access corporate resources tied to an organizational identity. Microsoft accounts and Azure AD accounts are cloud-backed; domain accounts rely on Active Directory.'
    },
    {
        id: 3,
        topic: 'User Management',
        question: 'What command-line tool creates a local user account named "analyst" with password "P@ssw0rd1" on a Windows system?',
        options: [
            'net user analyst P@ssw0rd1 /create',
            'net user analyst P@ssw0rd1 /add',
            'adduser analyst P@ssw0rd1',
            'New-LocalUser analyst P@ssw0rd1'
        ],
        correct: 1,
        explanation: 'The correct syntax is "net user [username] [password] /add". The /create switch does not exist. New-LocalUser is valid PowerShell but requires different syntax with named parameters. adduser is a Linux command.'
    },
    {
        id: 4,
        topic: 'Built-in Groups',
        question: 'EXAM TIP: A user needs to install software and change system settings without being a full local Administrator. Which built-in group provides the closest capability on a standalone Windows 10 machine?',
        options: [
            'Power Users',
            'Backup Operators',
            'Remote Desktop Users',
            'Network Configuration Operators'
        ],
        correct: 0,
        explanation: 'Power Users (legacy group) has elevated privileges above standard users on standalone machines, allowing some administrative tasks like installing certain software. However, note that on modern Windows 10 its privileges are greatly reduced from earlier Windows versions. The exam still tests this group. Backup Operators can bypass file permissions for backup; Remote Desktop Users can RDP; Network Configuration Operators manage network settings.'
    },
    {
        id: 5,
        topic: 'UAC',
        question: 'A standard user attempts to install software that requires elevation. With default UAC settings, what happens?',
        options: [
            'The installation fails silently with no prompt',
            'UAC prompts for administrator credentials before proceeding',
            'The installation proceeds automatically',
            'UAC blocks the installation permanently and logs the event'
        ],
        correct: 1,
        explanation: 'With default UAC settings, a standard user who triggers an elevation request sees a credential prompt asking for an administrator username and password. This is called "over-the-shoulder" elevation. The installation can proceed if valid admin credentials are supplied.'
    },
    {
        id: 6,
        topic: 'UAC',
        question: 'Which UAC setting disables the UAC prompt entirely, meaning all elevation requests are silently granted without notification?',
        options: [
            'Always notify',
            'Notify me only when apps try to make changes to my computer (default)',
            'Notify me only when apps try to make changes (do not dim desktop)',
            'Never notify'
        ],
        correct: 3,
        explanation: '"Never notify" disables UAC completely, allowing all privilege elevation silently. This is a significant security risk as malware can escalate privileges without any user interaction or notification. The exam tests knowledge of each UAC level and their security implications.'
    },
    {
        id: 7,
        topic: 'Azure AD',
        question: 'What is the difference between Azure AD Join and Azure AD Registration for a Windows 10 device?',
        options: [
            'Azure AD Join is for personal devices; Registration is for corporate devices',
            'Azure AD Join is a full organizational identity management; Registration allows BYOD access to company resources',
            'They are identical; the terms are interchangeable',
            'Azure AD Registration requires Windows 10 Pro; Join works on all editions'
        ],
        correct: 1,
        explanation: 'Azure AD Join fully integrates a device into the organization\'s Azure AD tenant (corporate-owned devices), enabling full MDM management and SSO. Azure AD Registration (Workplace Join) allows personal/BYOD devices to access company resources through conditional access without full organizational management of the device.'
    },
    {
        id: 8,
        topic: 'Windows Hello',
        question: 'Windows Hello for Business requires which hardware component to store cryptographic keys securely and enable biometric authentication?',
        options: [
            'A dedicated GPU',
            'A fingerprint sensor only',
            'A TPM (Trusted Platform Module) chip',
            'A Smart Card reader'
        ],
        correct: 2,
        explanation: 'Windows Hello for Business uses the TPM chip to securely store the private key used for authentication. The TPM ensures the key cannot be extracted from the device even if the OS is compromised. Biometric sensors (fingerprint, IR camera) are optional input methods, but TPM is the security foundation.'
    },
    {
        id: 9,
        topic: 'MFA',
        question: 'A company requires employees to use MFA when signing in to Azure AD-joined devices. Which three authentication factor categories are combined in MFA?',
        options: [
            'Password, PIN, and biometric (all "what you know")',
            'Something you know, something you have, and something you are',
            'Username, password, and security question',
            'Password, smart card, and email verification'
        ],
        correct: 1,
        explanation: 'MFA combines factors from at least two of three categories: something you know (password, PIN), something you have (authenticator app, smart card, hardware token), and something you are (biometric - fingerprint, face). Using only a password plus security question is still single-factor (both are "something you know").'
    },
    {
        id: 10,
        topic: 'NTFS Permissions',
        question: 'EXAM TIP: A user has Read permission on a folder through group membership and Full Control on the same folder through direct assignment. What is the user\'s effective permission?',
        options: [
            'Read, because NTFS uses the most restrictive permission',
            'Full Control, because NTFS uses the least restrictive (cumulative) permission',
            'No access, because conflicting permissions cancel out',
            'Read, because direct assignments override group permissions'
        ],
        correct: 1,
        explanation: 'NTFS permissions are cumulative when combining Allow permissions from multiple sources. The user gets the union of all Allow permissions, resulting in Full Control. The "most restrictive wins" rule only applies when a Deny permission is present - Deny overrides Allow regardless of source.'
    },
    {
        id: 11,
        topic: 'Credential Manager',
        question: 'Where does Windows store saved website and network credentials that are managed through the "Credential Manager" control panel applet?',
        options: [
            'In the SAM database alongside local user accounts',
            'In the Windows Credential Vault (Windows Vault and Web Credentials)',
            'In the user\'s Documents folder in an encrypted file',
            'In Azure AD for cloud-synced accounts'
        ],
        correct: 1,
        explanation: 'Windows Credential Manager stores credentials in the Windows Vault, separated into Windows Credentials (for network resources, domain resources) and Web Credentials (for IE/Edge saved passwords). The vault is protected by the user\'s login session and DPAPI encryption.'
    },
    {
        id: 12,
        topic: 'Security Policies',
        question: 'An administrator runs "secpol.msc". What tool opens?',
        options: [
            'Security Center',
            'Local Security Policy',
            'Group Policy Editor',
            'Security Configuration Wizard'
        ],
        correct: 1,
        explanation: 'secpol.msc opens the Local Security Policy console, which controls account policies (password/lockout), local policies (audit, user rights, security options), and more. gpedit.msc opens the full Group Policy Object Editor which includes Local Security Policy as a subset. secpol.msc is available on Pro/Enterprise but not Home.'
    },
    {
        id: 13,
        topic: 'User Management',
        question: 'Which MMC snap-in allows an administrator to manage local user accounts and groups with a graphical interface on Windows 10 Pro?',
        options: [
            'compmgmt.msc (Computer Management)',
            'lusrmgr.msc (Local Users and Groups)',
            'usrmgr.msc (User Manager)',
            'Both A and B provide access to Local Users and Groups'
        ],
        correct: 3,
        explanation: 'Both Computer Management (compmgmt.msc) and Local Users and Groups (lusrmgr.msc) provide GUI access to local user and group management. compmgmt.msc includes lusrmgr as one of its snap-ins under System Tools. Either tool works; the exam may present both paths as correct navigation options.'
    },
    {
        id: 14,
        topic: 'Account Types',
        question: 'A technician needs to perform maintenance tasks on a Windows 10 machine without creating a permanent user account. Which built-in account should they use, keeping security risk in mind?',
        options: [
            'Guest account (enable it temporarily)',
            'Built-in Administrator account (enable it for the session)',
            'DefaultAccount',
            'WDAGUtilityAccount'
        ],
        correct: 1,
        explanation: 'The built-in Administrator account (disabled by default in Windows 10) can be temporarily enabled for maintenance. It has full local admin rights. The Guest account has extremely limited permissions and is inappropriate for maintenance. DefaultAccount and WDAGUtilityAccount are system accounts not intended for human use.'
    },
    {
        id: 15,
        topic: 'Azure AD',
        question: 'EXAM TIP: A user completes Azure AD Join on their Windows 10 Pro laptop. Which sign-in method does the device use after the join is complete?',
        options: [
            'Local account credentials stored in SAM',
            'Azure AD credentials (work/school account)',
            'A new local account is automatically created for Azure AD use',
            'The device requires a VPN to sign in after joining Azure AD'
        ],
        correct: 1,
        explanation: 'After Azure AD Join, the user signs in with their Azure AD (work or school) credentials directly on the Windows 10 login screen. The device authenticates against Azure AD and generates a Primary Refresh Token (PRT) for SSO to cloud resources. No VPN is required for the basic login.'
    }
];

const state = {
    answers: JSON.parse(localStorage.getItem(QUIZ_ID + '_answers') || 'null') || {},
    submitted: false
};

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    questions.forEach((q, idx) => {
        const letters = ['A', 'B', 'C', 'D'];
        const card = document.createElement('div');
        card.className = 'question-card' + (state.answers[idx] !== undefined ? ' answered' : '');
        card.id = 'question-' + idx;
        card.innerHTML = `
            <div class="question-number">Question ${idx + 1} &mdash; ${q.topic}</div>
            <div class="question-text">${q.question}</div>
            <div class="options" id="options-${idx}">
                ${q.options.map((opt, oi) => `
                    <button class="option ${state.answers[idx] === oi ? 'selected' : ''}"
                            onclick="selectAnswer(${idx}, ${oi})"
                            id="opt-${idx}-${oi}">
                        <span class="option-letter">${letters[oi]}</span>
                        ${escapeHtml(opt)}
                    </button>
                `).join('')}
            </div>
            <div class="explanation" id="explanation-${idx}">
                <strong>Explanation:</strong> ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });
    updateProgress();
    updateSubmitButton();
}

function selectAnswer(qIdx, optIdx) {
    if (state.submitted) return;
    state.answers[qIdx] = optIdx;
    localStorage.setItem(QUIZ_ID + '_answers', JSON.stringify(state.answers));
    const letters = ['A', 'B', 'C', 'D'];
    questions[qIdx].options.forEach((_, oi) => {
        const btn = document.getElementById('opt-' + qIdx + '-' + oi);
        btn.className = 'option' + (oi === optIdx ? ' selected' : '');
    });
    document.getElementById('question-' + qIdx).classList.add('answered');
    updateProgress();
    updateSubmitButton();
}

function updateProgress() {
    const answered = Object.keys(state.answers).length;
    const total = questions.length;
    const pct = Math.round((answered / total) * 100);
    document.getElementById('progress-text').textContent = answered + ' of ' + total + ' answered';
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
}

function updateSubmitButton() {
    document.getElementById('submit-btn').disabled = Object.keys(state.answers).length < questions.length;
}

function submitQuiz() {
    state.submitted = true;
    let correct = 0;
    questions.forEach((q, idx) => {
        const chosen = state.answers[idx];
        const isCorrect = chosen === q.correct;
        if (isCorrect) correct++;
        questions[idx].options.forEach((_, oi) => {
            const btn = document.getElementById('opt-' + idx + '-' + oi);
            btn.classList.remove('selected');
            btn.classList.add('revealed');
            if (oi === q.correct) btn.classList.add('correct');
            else if (oi === chosen && !isCorrect) btn.classList.add('incorrect');
        });
        document.getElementById('explanation-' + idx).classList.add('visible');
    });
    const pct = Math.round((correct / questions.length) * 100);
    const passed = pct >= 70;
    localStorage.setItem(QUIZ_ID + '_score', JSON.stringify({ score: pct, correct, total: questions.length, passed, date: new Date().toISOString() }));
    const resultsCard = document.getElementById('results-card');
    resultsCard.classList.add('visible');
    document.getElementById('score-display').textContent = pct + '%';
    document.getElementById('score-label').textContent = correct + ' / ' + questions.length + ' correct';
    const badge = document.getElementById('pass-badge');
    badge.textContent = passed ? 'PASSED' : 'FAILED';
    badge.className = 'pass-badge ' + (passed ? 'pass' : 'fail');
    document.getElementById('results-message').textContent = passed
        ? 'Strong work. Authentication and authorization concepts are foundational to every Windows security domain. Make sure you can articulate why each answer is correct.'
        : 'Authentication is a dense topic. Review UAC behavior, Azure AD join types, and NTFS permission accumulation. Retake when you are confident in those areas.';
    document.querySelector('.quiz-actions').innerHTML = '<button class="btn btn-primary" onclick="retakeQuiz()">Retake Quiz</button>';
    resultsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retakeQuiz() {
    localStorage.removeItem(QUIZ_ID + '_answers');
    localStorage.removeItem(QUIZ_ID + '_score');
    state.answers = {};
    state.submitted = false;
    document.getElementById('results-card').classList.remove('visible');
    document.querySelector('.quiz-actions').innerHTML = '<button class="btn btn-primary" id="submit-btn" disabled onclick="submitQuiz()">Submit Quiz</button>';
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

renderQuestions();
</script>

</body>
</html>
