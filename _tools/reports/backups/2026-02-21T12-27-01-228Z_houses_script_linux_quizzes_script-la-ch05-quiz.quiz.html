<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH05 Quiz: Daemons & Services — Script House</title>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--script-green:#22c55e;--script-accent:#4ade80;--script-glow:rgba(34,197,94,0.3);--bg-card:rgba(10,20,10,0.9);--text-primary:#e8e8f0;--text-secondary:#7a9a7a;--correct:#22c55e;--incorrect:#ef4444;--border:rgba(34,197,94,0.2);}
        body{min-height:100vh;background:linear-gradient(135deg,#0a0a12,#0a1a0f,#0a250a);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text-primary);}
        .quiz-header{padding:1rem 2rem;border-bottom:1px solid var(--border);background:rgba(10,10,18,0.96);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);}
        .back-btn{display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(34,197,94,0.08);border:1px solid var(--border);border-radius:8px;color:var(--script-green);font-size:0.85rem;font-weight:600;text-decoration:none;transition:all 0.2s;}
        .back-btn:hover{background:rgba(34,197,94,0.15);}
        .progress-bar{width:180px;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;}
        .progress-fill{height:100%;background:linear-gradient(90deg,var(--script-green),var(--script-accent));width:0%;transition:width 0.5s ease;}
        #questionCounter{color:var(--text-secondary);font-size:0.85rem;}
        .quiz-container{max-width:820px;margin:2.5rem auto;padding:0 1.5rem 4rem;}
        .quiz-title{text-align:center;margin-bottom:2.5rem;}
        .quiz-title h1{font-size:1.9rem;color:var(--script-green);margin-bottom:0.5rem;}
        .quiz-title p{color:var(--text-secondary);font-size:0.95rem;}
        .question-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:2rem;margin-bottom:1.25rem;display:none;}
        .question-card.active{display:block;animation:fadeIn 0.3s ease;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
        .question-number{color:var(--script-green);font-size:0.8rem;font-weight:700;letter-spacing:0.1em;margin-bottom:0.9rem;}
        .question-text{font-size:1.15rem;line-height:1.6;margin-bottom:1.5rem;}
        .question-text code{background:rgba(34,197,94,0.12);color:var(--script-accent);padding:2px 8px;border-radius:4px;font-family:'Consolas',monospace;font-size:0.9em;}
        .options{display:grid;gap:0.75rem;}
        .option{padding:1rem 1.25rem;background:rgba(34,197,94,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:0.9rem;}
        .option:hover:not(.disabled){background:rgba(34,197,94,0.1);border-color:var(--script-green);}
        .option.correct{background:rgba(34,197,94,0.2);border-color:var(--correct);}
        .option.incorrect{background:rgba(239,68,68,0.15);border-color:var(--incorrect);}
        .option.disabled{pointer-events:none;opacity:0.75;}
        .option-letter{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:700;flex-shrink:0;}
        .option.correct .option-letter{background:var(--correct);color:#000;}
        .option.incorrect .option-letter{background:var(--incorrect);color:#fff;}
        .feedback{margin-top:1.25rem;padding:1rem 1.25rem;border-radius:10px;display:none;font-size:0.9rem;line-height:1.5;}
        .feedback.show{display:block;animation:fadeIn 0.3s ease;}
        .feedback.correct{background:rgba(34,197,94,0.1);border-left:3px solid var(--correct);}
        .feedback.incorrect{background:rgba(239,68,68,0.1);border-left:3px solid var(--incorrect);}
        .nav-buttons{display:flex;justify-content:flex-end;margin-top:1.5rem;}
        .nav-btn{padding:0.7rem 1.75rem;border-radius:10px;font-size:0.9rem;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;background:linear-gradient(135deg,var(--script-green),var(--script-accent));color:#000;}
        .nav-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px var(--script-glow);}
        .nav-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
        .results-card{background:var(--bg-card);border:1px solid rgba(34,197,94,0.35);border-radius:16px;padding:3rem;text-align:center;display:none;}
        .results-card.show{display:block;animation:fadeIn 0.5s ease;}
        .score-circle{width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,var(--script-green),var(--script-accent));display:flex;align-items:center;justify-content:center;margin:0 auto 1.75rem;font-size:2.8rem;font-weight:900;color:#000;}
        .results-title{font-size:1.75rem;color:var(--script-green);margin-bottom:0.6rem;}
        .results-subtitle{color:var(--text-secondary);margin-bottom:2rem;font-size:0.95rem;}
        .results-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
        .action-btn{padding:0.75rem 1.75rem;border-radius:10px;text-decoration:none;font-size:0.9rem;font-weight:600;transition:all 0.2s;}
        .action-btn.primary{background:linear-gradient(135deg,var(--script-green),var(--script-accent));color:#000;}
        .action-btn.secondary{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text-secondary);}
        .action-btn:hover{transform:translateY(-2px);}
    </style>
</head>
<body>
<header class="quiz-header">
    <a href="../presentations/la-ch05-daemons.presentation.html" class="back-btn">&larr; Back to Presentation</a>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span id="questionCounter">1 / 10</span>
</header>
<div class="quiz-container">
    <div class="quiz-title">
        <h1>CH05: Daemons &amp; Services</h1>
        <p>10 questions on daemons, systemd, systemctl, unit files, journalctl, and cron</p>
    </div>
    <div id="questionsContainer"></div>
    <div class="results-card" id="resultsCard">
        <div class="score-circle" id="scoreCircle">0%</div>
        <h2 class="results-title" id="resultsTitle">Quiz Complete!</h2>
        <p class="results-subtitle" id="resultsSubtitle"></p>
        <div class="results-actions">
            <a href="../presentations/la-ch05-daemons.presentation.html" class="action-btn secondary">Review Slides</a>
            <a href="../labs/la-ch05-daemons.lab.html" class="action-btn primary" id="nextBtn">Go to Lab &rarr;</a>
        </div>
    </div>
</div>
<script src="../../../../components/FluxCapacitor.js"></script>
<script>
const questions=[
    {question:'What is a Linux daemon?',options:['A process the user actively controls in the terminal','A background process that runs continuously providing system services','A graphical application running as root','A script executed manually by an administrator'],correct:1,feedback:{correct:'Correct! A daemon is a background process that runs continuously, starts at boot, has no controlling terminal, and provides services to the system or network clients. Most daemon names end in "d" (sshd, httpd, crond).',incorrect:'A daemon is a background process that starts at boot and runs continuously without user interaction, providing services to the system or network. Think sshd, crond, httpd, mysqld.'}},
    {question:'What systemctl command starts the nginx service AND configures it to start automatically on every boot?',options:['systemctl start nginx && systemctl enable nginx','systemctl enable --now nginx','systemctl boot nginx','systemctl activate nginx'],correct:1,feedback:{correct:'Correct! "systemctl enable --now" is the efficient one-command way to both enable (auto-start at boot) and start the service immediately. Without --now, enable only creates the symlink for boot without starting it.',incorrect:'"systemctl enable --now nginx" both enables (creates boot symlink) and starts (right now) in one command. "start" and "enable" separately also works but is two commands.'}},
    {question:'What command reloads a service\'s configuration without fully stopping and restarting it?',options:['systemctl restart nginx','systemctl reload nginx','systemctl refresh nginx','systemctl config nginx'],correct:1,feedback:{correct:'Correct! "systemctl reload" sends the service a signal to re-read its configuration files without stopping the process. This avoids any connection interruption. Not all services support reload — check with "systemctl status" first.',incorrect:'"systemctl reload" reloads configuration without stopping the service (zero downtime). "systemctl restart" stops then starts (brief downtime). Not all services support reload.'}},
    {question:'In a systemd unit file, what does the <code>WantedBy=multi-user.target</code> line in [Install] mean?',options:['The service requires multi-user mode to be active before starting','The service will be enabled when multi-user.target is reached (i.e., at normal boot)','The service only runs in multi-user mode on the terminal','The service creates a multi-user.target dependency'],correct:1,feedback:{correct:'Correct! WantedBy=multi-user.target means that when you run "systemctl enable", systemd creates a symlink in multi-user.target.wants/ — ensuring this service starts when the system reaches multi-user mode (standard server boot).','incorrect':'WantedBy=multi-user.target tells systemctl enable where to create the symlink so this service is started when multi-user.target is reached — which happens on every normal boot of a Linux server.'}},
    {question:'Which journalctl flag shows log entries from the CURRENT boot only?',options:['-f','-b','--since today','-u'],correct:1,feedback:{correct:'Correct! journalctl -b shows logs from the current boot. journalctl -b -1 shows the previous boot. This is essential for diagnosing issues that occurred during system startup.',incorrect:'journalctl -b shows logs from the current boot. -f follows new entries (like tail -f). -u filters by unit name. --since accepts time expressions like "1 hour ago".'}},
    {question:'What crontab entry runs a script every day at 3:30 AM?',options:['30 3 * * * /opt/script.sh','3 30 * * * /opt/script.sh','* * 3 30 * /opt/script.sh','0 3:30 * * * /opt/script.sh'],correct:0,feedback:{correct:'Correct! Crontab fields: minute hour day month weekday. "30 3 * * *" = minute 30, hour 3 = 3:30 AM every day (asterisks for day/month/weekday mean "any").',incorrect:'Crontab fields in order: minute(0-59) hour(0-23) day-of-month month day-of-week. "30 3 * * *" means minute=30, hour=3 (3:30 AM), and all (*) for day/month/weekday.'}},
    {question:'After writing a new systemd unit file in /etc/systemd/system/, what command must you run before starting the service?',options:['systemctl update','systemctl daemon-reload','systemctl refresh','service restart all'],correct:1,feedback:{correct:'Correct! "systemctl daemon-reload" tells systemd to re-read all unit files from disk. Without this step, systemd will not know about your new (or modified) unit file and will use cached versions.',incorrect:'You must run "systemctl daemon-reload" after creating or modifying unit files. This tells systemd to reload its configuration from disk. Skipping this step means systemd ignores your new file.'}},
    {question:'Which daemon is responsible for executing scheduled tasks defined in crontab files?',options:['taskd','scheduled','crond','timerd'],correct:2,feedback:{correct:'Correct! crond (the cron daemon) reads all crontab files and executes the defined commands at the scheduled times. It runs continuously in the background watching for jobs that need to run.',incorrect:'crond is the cron daemon that reads crontab files and executes scheduled commands. On some systems it is named cron without the "d". Systemd timers are an alternative but crond handles traditional crontabs.'}},
    {question:'What does <code>journalctl -u sshd -f</code> do?',options:['Follows new log entries for the sshd service in real time','Deletes old sshd log entries','Shows only failed sshd authentication attempts','Lists all units related to sshd'],correct:0,feedback:{correct:'Correct! -u sshd filters to only sshd service logs, -f follows new entries as they are written (equivalent to tail -f but for the journal). This is essential for watching live authentication activity.',incorrect:'-u filters to a specific unit, -f follows new entries in real time. Together: "journalctl -u sshd -f" watches live sshd log entries — great for monitoring SSH login attempts as they happen.'}},
    {question:'A cron entry reads: <code>*/15 * * * * /opt/check.sh</code>. How often does it run?',options:['Every 15 hours','Every 15th day','Every 15 minutes','Once at minute 15 of each hour'],correct:2,feedback:{correct:'Correct! The */N syntax means "every N" — so */15 in the minute field means "every 15 minutes" (at :00, :15, :30, and :45 of every hour). This is one of the most useful cron scheduling patterns.',incorrect:'"*/15" in the minute field means "every 15 minutes". The "/" in cron means "step" — */15 = every 15 steps through the minute range (0, 15, 30, 45). Similarly, */2 in hours = every 2 hours.'}}
];

let currentQuestion=0,score=0,answered=new Array(questions.length).fill(false);
function initQuiz(){const c=document.getElementById('questionsContainer'),L=['A','B','C','D'];questions.forEach((q,idx)=>{c.innerHTML+=`<div class="question-card" id="question${idx}"><div class="question-number">QUESTION ${idx+1} OF ${questions.length}</div><div class="question-text">${q.question}</div><div class="options">${q.options.map((o,i)=>`<div class="option" onclick="selectOption(${idx},${i})"><span class="option-letter">${L[i]}</span><span>${o}</span></div>`).join('')}</div><div class="feedback" id="feedback${idx}"></div><div class="nav-buttons"><button class="nav-btn" id="nextBtn${idx}" onclick="nextQuestion()" disabled>${idx===questions.length-1?'See Results':'Next Question &rarr;'}</button></div></div>`;});showQuestion(0);}
function showQuestion(idx){document.querySelectorAll('.question-card').forEach(c=>c.classList.remove('active'));document.getElementById(`question${idx}`).classList.add('active');document.getElementById('progressFill').style.width=((idx+1)/questions.length*100)+'%';document.getElementById('questionCounter').textContent=`${idx+1} / ${questions.length}`;}
function selectOption(qIdx,optIdx){if(answered[qIdx])return;answered[qIdx]=true;const q=questions[qIdx];document.querySelectorAll(`#question${qIdx} .option`).forEach((o,i)=>{o.classList.add('disabled');if(i===q.correct)o.classList.add('correct');else if(i===optIdx)o.classList.add('incorrect');});const fb=document.getElementById(`feedback${qIdx}`);if(optIdx===q.correct){score++;fb.className='feedback show correct';fb.innerHTML='<strong>Correct!</strong> '+q.feedback.correct;}else{fb.className='feedback show incorrect';fb.innerHTML='<strong>Incorrect.</strong> '+q.feedback.incorrect;}document.getElementById(`nextBtn${qIdx}`).disabled=false;}
function nextQuestion(){if(currentQuestion<questions.length-1){currentQuestion++;showQuestion(currentQuestion);}else showResults();}
function showResults(){document.querySelectorAll('.question-card').forEach(c=>c.classList.remove('active'));document.getElementById('resultsCard').classList.add('show');const pct=Math.round(score/questions.length*100);document.getElementById('scoreCircle').textContent=pct+'%';document.getElementById('resultsSubtitle').textContent=`You scored ${score} out of ${questions.length} correct`;let t='Keep Practicing!';if(pct>=90)t='Outstanding!';else if(pct>=80)t='Great Work!';else if(pct>=70)t='Good Effort!';document.getElementById('resultsTitle').textContent=t;localStorage.setItem('hexworth_la_ch05_quiz_score',pct);if(pct>=70&&typeof ModuleProgress!=='undefined')ModuleProgress.complete('script','script-la-ch05-quiz');if(pct<70){document.getElementById('nextBtn').textContent='Retry Quiz';document.getElementById('nextBtn').href='la-ch05-quiz.quiz.html';}}
initQuiz();
</script>
</body>
</html>
