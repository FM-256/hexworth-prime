<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../../components/AccessGuard.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH04 Quiz: Process Management — Script House</title>
    <script src="../../../../components/AchievementManager.js"></script>
    <script src="../../../../components/ModuleProgress.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --script-green: #22c55e; --script-accent: #4ade80; --script-glow: rgba(34,197,94,0.3); --bg-card: rgba(10,20,10,0.9); --text-primary: #e8e8f0; --text-secondary: #7a9a7a; --correct: #22c55e; --incorrect: #ef4444; --border: rgba(34,197,94,0.2); }
        body { min-height: 100vh; background: linear-gradient(135deg, #0a0a12, #0a1a0f, #0a250a); font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text-primary); }
        .quiz-header { padding: 1rem 2rem; border-bottom: 1px solid var(--border); background: rgba(10,10,18,0.96); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); }
        .back-btn { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: rgba(34,197,94,0.08); border: 1px solid var(--border); border-radius: 8px; color: var(--script-green); font-size: 0.85rem; font-weight: 600; text-decoration: none; transition: all 0.2s; }
        .back-btn:hover { background: rgba(34,197,94,0.15); }
        .progress-bar { width: 180px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--script-green), var(--script-accent)); width: 0%; transition: width 0.5s ease; }
        #questionCounter { color: var(--text-secondary); font-size: 0.85rem; }
        .quiz-container { max-width: 820px; margin: 2.5rem auto; padding: 0 1.5rem 4rem; }
        .quiz-title { text-align: center; margin-bottom: 2.5rem; }
        .quiz-title h1 { font-size: 1.9rem; color: var(--script-green); margin-bottom: 0.5rem; }
        .quiz-title p { color: var(--text-secondary); font-size: 0.95rem; }
        .question-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; margin-bottom: 1.25rem; display: none; }
        .question-card.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);} }
        .question-number { color: var(--script-green); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 0.9rem; }
        .question-text { font-size: 1.15rem; line-height: 1.6; margin-bottom: 1.5rem; }
        .question-text code { background: rgba(34,197,94,0.12); color: var(--script-accent); padding: 2px 8px; border-radius: 4px; font-family: 'Consolas',monospace; font-size: 0.9em; }
        .options { display: grid; gap: 0.75rem; }
        .option { padding: 1rem 1.25rem; background: rgba(34,197,94,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.9rem; }
        .option:hover:not(.disabled) { background: rgba(34,197,94,0.1); border-color: var(--script-green); }
        .option.correct { background: rgba(34,197,94,0.2); border-color: var(--correct); }
        .option.incorrect { background: rgba(239,68,68,0.15); border-color: var(--incorrect); }
        .option.disabled { pointer-events: none; opacity: 0.75; }
        .option-letter { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; flex-shrink: 0; }
        .option.correct .option-letter { background: var(--correct); color: #000; }
        .option.incorrect .option-letter { background: var(--incorrect); color: #fff; }
        .feedback { margin-top: 1.25rem; padding: 1rem 1.25rem; border-radius: 10px; display: none; font-size: 0.9rem; line-height: 1.5; }
        .feedback.show { display: block; animation: fadeIn 0.3s ease; }
        .feedback.correct { background: rgba(34,197,94,0.1); border-left: 3px solid var(--correct); }
        .feedback.incorrect { background: rgba(239,68,68,0.1); border-left: 3px solid var(--incorrect); }
        .nav-buttons { display: flex; justify-content: flex-end; margin-top: 1.5rem; }
        .nav-btn { padding: 0.7rem 1.75rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; background: linear-gradient(135deg, var(--script-green), var(--script-accent)); color: #000; }
        .nav-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px var(--script-glow); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .results-card { background: var(--bg-card); border: 1px solid rgba(34,197,94,0.35); border-radius: 16px; padding: 3rem; text-align: center; display: none; }
        .results-card.show { display: block; animation: fadeIn 0.5s ease; }
        .score-circle { width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(135deg, var(--script-green), var(--script-accent)); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.75rem; font-size: 2.8rem; font-weight: 900; color: #000; }
        .results-title { font-size: 1.75rem; color: var(--script-green); margin-bottom: 0.6rem; }
        .results-subtitle { color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.95rem; }
        .results-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .action-btn { padding: 0.75rem 1.75rem; border-radius: 10px; text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; }
        .action-btn.primary { background: linear-gradient(135deg, var(--script-green), var(--script-accent)); color: #000; }
        .action-btn.secondary { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-secondary); }
        .action-btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
<header class="quiz-header">
    <a href="../presentations/la-ch04-processes.presentation.html" class="back-btn">&larr; Back to Presentation</a>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span id="questionCounter">1 / 10</span>
</header>
<div class="quiz-container">
    <div class="quiz-title">
        <h1>CH04: Process Management</h1>
        <p>10 questions on ps, top, nice values, signals, kill, and job control</p>
    </div>
    <div id="questionsContainer"></div>
    <div class="results-card" id="resultsCard">
        <div class="score-circle" id="scoreCircle">0%</div>
        <h2 class="results-title" id="resultsTitle">Quiz Complete!</h2>
        <p class="results-subtitle" id="resultsSubtitle"></p>
        <div class="results-actions">
            <a href="../presentations/la-ch04-processes.presentation.html" class="action-btn secondary">Review Slides</a>
            <a href="../labs/la-ch04-processes.lab.html" class="action-btn primary" id="nextBtn">Go to Lab &rarr;</a>
        </div>
    </div>
</div>
<script src="../../../../components/FluxCapacitor.js"></script>
<script>
const questions = [
    { question: 'What is a Linux process?', options: ['A running instance of a program with its own PID and memory space', 'A file stored in the /proc directory', 'A background service started by systemd', 'A scheduled task managed by cron'], correct: 0, feedback: { correct: 'Correct! A process is a running instance of a program. Each process has a unique PID (Process ID), its own memory space, a state, a parent process (PPID), and an owning user (UID).', incorrect: 'A process is a running instance of a program with a unique PID, memory space, and state. /proc/PID/ is where process information is exposed, but the process itself is the running program.' } },
    { question: 'Which command shows a real-time, continuously updated view of running processes?', options: ['ps aux', 'top', 'pstree', 'ls /proc'], correct: 1, feedback: { correct: 'Correct! top provides a real-time, interactive view of the system — updating every few seconds showing CPU%, memory%, process states, and load averages. Press q to quit, k to kill a process by PID.', incorrect: 'top provides real-time process monitoring. ps aux gives a static snapshot. pstree shows a static tree. ls /proc/ lists process directories but is not a monitoring tool.' } },
    { question: 'What does a nice value of <code>-20</code> mean for a process?', options: ['The process is paused', 'Lowest priority — gets the least CPU time', 'Highest priority — gets the most CPU time', 'The process runs only during idle time'], correct: 2, feedback: { correct: 'Correct! Nice values range from -20 (highest priority) to +19 (lowest priority). A nice value of -20 means the process gets preferential CPU access. Only root can set negative nice values.', incorrect: 'Nice values are counterintuitive: lower is higher priority. -20 is maximum priority (most CPU), +19 is minimum priority (least CPU). Default is 0. Only root can set negative values.' } },
    { question: 'Which signal should you try BEFORE resorting to <code>kill -9</code>?', options: ['SIGSTOP (19)', 'SIGTERM (15)', 'SIGHUP (1)', 'SIGCONT (18)'], correct: 1, feedback: { correct: 'Correct! Always try SIGTERM (15) first — it is a polite termination request that allows the process to clean up (close files, flush buffers, release resources). SIGKILL (9) immediately forces termination with no cleanup.', incorrect: 'SIGTERM (signal 15) is the correct first step — it allows graceful shutdown and cleanup. Only use SIGKILL (-9) when SIGTERM fails. SIGHUP (1) reloads config, SIGSTOP pauses, SIGCONT resumes.' } },
    { question: 'What does the "Z" state in ps output indicate?', options: ['The process is sleeping', 'A zombie process — exited but not yet reaped by its parent', 'The process is stopped with Ctrl+Z', 'A kernel thread process'], correct: 1, feedback: { correct: 'Correct! A zombie (Z) process has finished executing but its entry remains in the process table because its parent has not yet read its exit status (via wait()). You cannot kill zombies — kill the parent process instead.', incorrect: 'Z = Zombie. The process finished but remains in the process table waiting for its parent to read its exit status. You cannot kill zombie processes — you must kill (or wait for) the parent. S = sleeping, T = stopped, D = uninterruptible.' } },
    { question: 'How do you run a command in the background so your terminal remains available?', options: ['Prefix the command with bg:', 'Append & to the command', 'Use the screen command before the command', 'Type Ctrl+Z before the command'], correct: 1, feedback: { correct: 'Correct! Appending & to any command runs it in the background. Example: ./backup.sh & — the shell returns a job number [1] and PID, then immediately gives you a new prompt while backup.sh runs in the background.', incorrect: 'Append & to run in background: "./backup.sh &". The shell prints [1] 4521 (job number and PID) then returns the prompt. Ctrl+Z suspends a foreground process (then use bg to send it to background).' } },
    { question: 'What command changes the nice value of an already-running process with PID 5678 to 10?', options: ['nice -n 10 5678', 'renice -n 10 -p 5678', 'kill -10 5678', 'priority 10 5678'], correct: 1, feedback: { correct: 'Correct! renice changes the nice value of a running process. Syntax: renice -n VALUE -p PID. nice is used when starting a new process. renice is for processes already running.', incorrect: 'renice changes priority of running processes: "renice -n 10 -p 5678". nice is only for starting new processes with a priority. kill sends signals, not priority changes.' } },
    { question: 'What does <code>ps aux | grep nginx | grep -v grep</code> accomplish?', options: ['Kills all nginx processes', 'Lists nginx processes while excluding the grep process itself from the output', 'Shows nginx error logs', 'Restarts the nginx service'], correct: 1, feedback: { correct: 'Correct! The pattern "grep process | grep -v grep" is a classic — when you grep for a process name, grep itself appears in ps output (because grep is running with "nginx" as an argument). The second grep -v grep removes that false match.', incorrect: 'This classic pattern: ps aux lists all processes, grep nginx filters to nginx lines (but the grep command itself also matches), grep -v grep removes the grep process from results. You get only actual nginx processes.' } },
    { question: 'Which signal, sent with <code>kill -1 PID</code>, typically causes a daemon to reload its configuration file?', options: ['SIGTERM', 'SIGKILL', 'SIGHUP', 'SIGINT'], correct: 2, feedback: { correct: 'Correct! SIGHUP (signal 1, Hangup) was originally sent when a terminal connection was lost. Daemons repurposed this signal to mean "reload configuration". Most well-written daemons (nginx, sshd, apache) reload their config when receiving SIGHUP.', incorrect: 'SIGHUP (signal 1) is the configuration reload signal for most daemons. Historical origin: sent when terminal hung up. Daemons adopted it as "reload" since they have no terminal. "kill -1 PID" or "kill -HUP PID" are equivalent.' } },
    { question: 'What command brings a background job (job number 1) back to the foreground?', options: ['bg %1', 'fg %1', 'jobs 1', 'resume 1'], correct: 1, feedback: { correct: 'Correct! fg %JOB_NUMBER brings a background job to the foreground. After running a job in background with &, use "jobs" to see job numbers, then "fg %1" to bring job 1 to the foreground.', incorrect: 'fg %1 brings background job 1 to the foreground. bg %1 sends a suspended job to the background (continues running). jobs lists all background jobs. There is no "resume" command in bash job control.' } }
];

let currentQuestion=0, score=0, answered=new Array(questions.length).fill(false);
function initQuiz(){const c=document.getElementById('questionsContainer'),L=['A','B','C','D'];questions.forEach((q,idx)=>{c.innerHTML+=`<div class="question-card" id="question${idx}"><div class="question-number">QUESTION ${idx+1} OF ${questions.length}</div><div class="question-text">${q.question}</div><div class="options">${q.options.map((o,i)=>`<div class="option" onclick="selectOption(${idx},${i})"><span class="option-letter">${L[i]}</span><span>${o}</span></div>`).join('')}</div><div class="feedback" id="feedback${idx}"></div><div class="nav-buttons"><button class="nav-btn" id="nextBtn${idx}" onclick="nextQuestion()" disabled>${idx===questions.length-1?'See Results':'Next Question &rarr;'}</button></div></div>`;});showQuestion(0);}
function showQuestion(idx){document.querySelectorAll('.question-card').forEach(c=>c.classList.remove('active'));document.getElementById(`question${idx}`).classList.add('active');document.getElementById('progressFill').style.width=((idx+1)/questions.length*100)+'%';document.getElementById('questionCounter').textContent=`${idx+1} / ${questions.length}`;}
function selectOption(qIdx,optIdx){if(answered[qIdx])return;answered[qIdx]=true;const q=questions[qIdx];document.querySelectorAll(`#question${qIdx} .option`).forEach((o,i)=>{o.classList.add('disabled');if(i===q.correct)o.classList.add('correct');else if(i===optIdx)o.classList.add('incorrect');});const fb=document.getElementById(`feedback${qIdx}`);if(optIdx===q.correct){score++;fb.className='feedback show correct';fb.innerHTML='<strong>Correct!</strong> '+q.feedback.correct;}else{fb.className='feedback show incorrect';fb.innerHTML='<strong>Incorrect.</strong> '+q.feedback.incorrect;}document.getElementById(`nextBtn${qIdx}`).disabled=false;}
function nextQuestion(){if(currentQuestion<questions.length-1){currentQuestion++;showQuestion(currentQuestion);}else showResults();}
function showResults(){document.querySelectorAll('.question-card').forEach(c=>c.classList.remove('active'));document.getElementById('resultsCard').classList.add('show');const pct=Math.round(score/questions.length*100);document.getElementById('scoreCircle').textContent=pct+'%';document.getElementById('resultsSubtitle').textContent=`You scored ${score} out of ${questions.length} correct`;let t='Keep Practicing!';if(pct>=90)t='Outstanding!';else if(pct>=80)t='Great Work!';else if(pct>=70)t='Good Effort!';document.getElementById('resultsTitle').textContent=t;localStorage.setItem('hexworth_la_ch04_quiz_score',pct);if(pct>=70&&typeof ModuleProgress!=='undefined')ModuleProgress.complete('script','script-la-ch04-quiz');if(pct<70){document.getElementById('nextBtn').textContent='Retry Quiz';document.getElementById('nextBtn').href='la-ch04-quiz.quiz.html';}}
initQuiz();
</script>
</body>
</html>
