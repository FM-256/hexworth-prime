<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-100 Module 01: Install the Windows Client - Forge House</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1510 50%, #0d0d15 100%);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e0e0e0;
        }

        /* ── Page header ── */
        .page-header {
            padding: 14px 28px;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(234,88,12,0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header a {
            color: #ea580c;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }
        .page-header a:hover { color: #f97316; }
        .brand { font-weight: 600; color: #e0e0e0; display: flex; align-items: center; gap: 8px; }

        /* ── Quiz wrapper ── */
        .quiz-wrapper {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 32px 20px 48px;
        }
        .quiz-container { width: 100%; max-width: 820px; }

        /* ── Quiz header card ── */
        .quiz-header {
            background: linear-gradient(135deg, rgba(234,88,12,0.1) 0%, rgba(249,115,22,0.05) 100%);
            border: 1px solid rgba(234,88,12,0.3);
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            margin-bottom: 24px;
        }
        .quiz-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .quiz-title { font-size: 1.5rem; font-weight: 700; color: #f97316; margin-bottom: 6px; }
        .quiz-subtitle { color: #9ca3af; font-size: 0.95rem; margin-bottom: 14px; }
        .quiz-meta { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .quiz-meta span { background: rgba(234,88,12,0.15); border: 1px solid rgba(234,88,12,0.3); border-radius: 20px; padding: 4px 14px; font-size: 0.8rem; color: #fb923c; }

        /* ── Progress bar ── */
        .progress-section { margin-bottom: 20px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: #9ca3af; margin-bottom: 6px; }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ea580c 0%, #f97316 100%); border-radius: 3px; transition: width 0.3s ease; }

        /* ── Question cards ── */
        .question-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(234,88,12,0.15);
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        .question-card.answered { border-color: rgba(234,88,12,0.35); }
        .question-number { font-size: 0.75rem; color: #ea580c; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .question-text { font-size: 1rem; line-height: 1.55; color: #e5e7eb; margin-bottom: 16px; }

        /* ── Options ── */
        .options { display: flex; flex-direction: column; gap: 9px; }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.18s ease;
            text-align: left;
            color: #d1d5db;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .option:hover:not(:disabled) { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.4); color: #f3f4f6; }
        .option.selected { background: rgba(234,88,12,0.18); border-color: rgba(234,88,12,0.6); color: #fff; }
        .option.correct { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.6); color: #86efac; }
        .option.incorrect { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.6); color: #fca5a5; }
        .option.revealed { cursor: default; }
        .option-letter {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; min-width: 22px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 700;
            color: #9ca3af;
        }
        .option.selected .option-letter { background: #ea580c; color: #fff; }
        .option.correct .option-letter { background: #22c55e; color: #fff; }
        .option.incorrect .option-letter { background: #ef4444; color: #fff; }

        /* ── Explanation ── */
        .explanation {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            background: rgba(249,115,22,0.08);
            border-left: 3px solid #ea580c;
            border-radius: 0 6px 6px 0;
            font-size: 0.875rem;
            color: #d1d5db;
            line-height: 1.55;
        }
        .explanation.visible { display: block; }
        .explanation strong { color: #f97316; }

        /* ── Submit / Results ── */
        .quiz-actions { text-align: center; margin: 28px 0 20px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 11px 28px;
            border-radius: 7px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(234,88,12,0.4); }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(234,88,12,0.35);
            color: #fb923c;
        }
        .btn-secondary:hover { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.6); }

        /* ── Results card ── */
        .results-card {
            display: none;
            background: linear-gradient(135deg, rgba(234,88,12,0.08) 0%, rgba(249,115,22,0.04) 100%);
            border: 1px solid rgba(234,88,12,0.3);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
        }
        .results-card.visible { display: block; }
        .score-display { font-size: 3.5rem; font-weight: 800; color: #f97316; line-height: 1; margin-bottom: 6px; }
        .score-label { color: #9ca3af; font-size: 0.9rem; margin-bottom: 16px; }
        .pass-badge {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }
        .pass-badge.pass { background: rgba(34,197,94,0.2); color: #22c55e; border: 1px solid rgba(34,197,94,0.4); }
        .pass-badge.fail { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.4); }
        .results-message { color: #d1d5db; font-size: 0.95rem; line-height: 1.5; }

        /* ── Nav buttons ── */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(234,88,12,0.15);
        }
    </style>
</head>
<body>

<header class="page-header">
    <a href="../../index.html">← Back to Forge House</a>
    <span class="brand"><span>⚒️</span> Hexworth Prime</span>
</header>

<main class="quiz-wrapper">
    <div class="quiz-container">

        <header class="quiz-header">
            <div class="quiz-icon">⚒️</div>
            <h1 class="quiz-title">Install the Windows Client Quiz</h1>
            <p class="quiz-subtitle">MD-100 Module 01 Assessment</p>
            <div class="quiz-meta">
                <span>📝 15 Questions</span>
                <span>⏱️ No Time Limit</span>
                <span>🎯 70% to Pass</span>
            </div>
        </header>

        <!-- Progress bar -->
        <div class="progress-section">
            <div class="progress-label">
                <span id="progress-text">0 of 15 answered</span>
                <span id="progress-pct">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width:0%"></div>
            </div>
        </div>

        <!-- Results card (hidden until submit) -->
        <div class="results-card" id="results-card">
            <div class="score-display" id="score-display">0%</div>
            <div class="score-label" id="score-label">0 / 15 correct</div>
            <div class="pass-badge" id="pass-badge">--</div>
            <p class="results-message" id="results-message"></p>
        </div>

        <!-- Questions rendered here by JS -->
        <div id="questions-container"></div>

        <div class="quiz-actions">
            <button class="btn btn-primary" id="submit-btn" disabled onclick="submitQuiz()">
                Submit Quiz
            </button>
        </div>

        <nav class="nav-buttons">
            <a href="../labs/md100-m01-install.lab.html" class="btn btn-secondary">← Review Lab</a>
            <a href="../../index.html" class="btn btn-secondary">Forge House →</a>
        </nav>

    </div>
</main>

<script>
/* ── Quiz data ── */
const QUIZ_ID = 'hexworth_md100_m01';

const questions = [
    {
        id: 1,
        topic: 'Windows Editions',
        question: 'A small business owner needs domain join and BitLocker but wants to minimize licensing cost. Which Windows 10 edition is the MINIMUM that meets both requirements?',
        options: [
            'Windows 10 Home',
            'Windows 10 Pro',
            'Windows 10 Enterprise',
            'Windows 10 Education'
        ],
        correct: 1,
        explanation: 'Windows 10 Pro is the minimum edition that supports both domain join and BitLocker full-disk encryption. Home lacks both features. Enterprise and Education also support them but carry higher licensing costs.'
    },
    {
        id: 2,
        topic: 'Hardware Requirements',
        question: 'What is the minimum RAM required for a 64-bit installation of Windows 10 according to Microsoft\'s official specification?',
        options: [
            '512 MB',
            '1 GB',
            '2 GB',
            '4 GB'
        ],
        correct: 2,
        explanation: 'Microsoft specifies 2 GB RAM as the minimum for 64-bit Windows 10 (1 GB for 32-bit). While Windows may technically boot with less, 2 GB is the published and exam-tested minimum for 64-bit installations.'
    },
    {
        id: 3,
        topic: 'Hardware Requirements',
        question: 'What minimum storage space does Microsoft require for a Windows 10 installation?',
        options: [
            '16 GB',
            '20 GB',
            '32 GB',
            '64 GB'
        ],
        correct: 2,
        explanation: 'Windows 10 requires 32 GB of storage as the minimum. Note this changed from the original 16 GB (32-bit) / 20 GB (64-bit) spec in later builds. The MD-100 exam reflects the 32 GB requirement for current Windows 10.'
    },
    {
        id: 4,
        topic: 'Installation Methods',
        question: 'A technician needs to deploy Windows 10 to 200 identical workstations with a pre-configured application baseline. Which deployment method is MOST efficient?',
        options: [
            'Interactive clean install from USB on each machine',
            'In-place upgrade from Windows 7 on each machine',
            'Image-based deployment using MDT or SCCM',
            'Windows Update push via Group Policy'
        ],
        correct: 2,
        explanation: 'Image-based deployment captures a configured master image and deploys it to multiple machines simultaneously. Tools like MDT (Microsoft Deployment Toolkit) and SCCM automate this at scale, making it far more efficient than manual installs.'
    },
    {
        id: 5,
        topic: 'Upgrade Paths',
        question: 'EXAM TIP: A user is running Windows 7 Home Premium and wants to upgrade to Windows 10. Which statement about in-place upgrades is TRUE?',
        options: [
            'In-place upgrades from Windows 7 to Windows 10 preserve all apps and settings',
            'In-place upgrades from Windows 7 to Windows 10 are not supported; a clean install is required',
            'Only Windows 7 Professional can upgrade in-place to Windows 10',
            'In-place upgrades require the same or higher edition (Home to Home, Pro to Pro)'
        ],
        correct: 1,
        explanation: 'In-place upgrades from Windows 7 to Windows 10 are not supported by the Windows 10 setup process. Microsoft\'s upgrade paths support in-place upgrade from Windows 8.1 and Windows 10 to newer Windows 10 builds, but Windows 7 requires a clean install.'
    },
    {
        id: 6,
        topic: 'USMT',
        question: 'Which Microsoft tool is used to migrate user state data (profiles, documents, settings) when performing side-by-side PC migrations?',
        options: [
            'Windows Easy Transfer',
            'USMT (User State Migration Tool)',
            'DISM (Deployment Image Servicing and Management)',
            'WDS (Windows Deployment Services)'
        ],
        correct: 1,
        explanation: 'USMT (User State Migration Tool) is the enterprise tool for migrating user profiles, documents, and application settings between machines. Windows Easy Transfer was retired in Windows 10. DISM manages images, and WDS deploys OS images over the network.'
    },
    {
        id: 7,
        topic: 'Deployment Tools',
        question: 'Windows Deployment Services (WDS) requires which server role to distribute installation images over the network?',
        options: [
            'DHCP only',
            'DNS only',
            'Both DHCP and DNS',
            'DHCP is required; DNS is optional'
        ],
        correct: 3,
        explanation: 'WDS requires DHCP to assign IP addresses during PXE boot so clients can communicate over the network. DNS is helpful but not strictly required for WDS to function. PXE clients need an IP address first, then locate the WDS server.'
    },
    {
        id: 8,
        topic: 'Deployment Tools',
        question: 'Which Microsoft deployment solution is cloud-based and requires NO on-premises infrastructure for device provisioning?',
        options: [
            'MDT (Microsoft Deployment Toolkit)',
            'SCCM (System Center Configuration Manager)',
            'Windows Autopilot',
            'WDS (Windows Deployment Services)'
        ],
        correct: 2,
        explanation: 'Windows Autopilot is a cloud-based deployment service that pre-registers devices in Azure AD and configures them via Intune without any on-premises servers. MDT, SCCM, and WDS all require on-premises infrastructure.'
    },
    {
        id: 9,
        topic: 'MBR vs GPT',
        question: 'A technician is installing Windows 10 on a new 3 TB hard drive and the system uses UEFI firmware. Which partition table format must be used?',
        options: [
            'MBR, because MBR supports drives up to 4 TB',
            'GPT, because UEFI requires GPT for bootable drives',
            'MBR, because Windows 10 only supports MBR',
            'Either MBR or GPT; the choice does not matter with UEFI'
        ],
        correct: 1,
        explanation: 'UEFI firmware requires GPT for bootable system drives. Additionally, MBR is limited to 2 TB addressable space, making GPT mandatory for 3 TB drives regardless. Legacy BIOS uses MBR; UEFI uses GPT.'
    },
    {
        id: 10,
        topic: 'UEFI vs BIOS',
        question: 'EXAM TIP: Which security feature is ONLY available on UEFI systems and helps prevent unauthorized operating systems from loading during boot?',
        options: [
            'BitLocker',
            'Secure Boot',
            'TPM (Trusted Platform Module)',
            'Windows Defender'
        ],
        correct: 1,
        explanation: 'Secure Boot is a UEFI feature that verifies the digital signature of the bootloader before allowing it to run, blocking rootkits and unauthorized OS loads. BitLocker and TPM are encryption/security chips that work independently of UEFI, and Windows Defender is an antimalware tool.'
    },
    {
        id: 11,
        topic: 'Windows ADK',
        question: 'What is the primary purpose of the Windows Assessment and Deployment Kit (ADK)?',
        options: [
            'To run compatibility tests on applications before migration',
            'To provide tools for customizing, assessing, and deploying Windows images',
            'To monitor system performance in production environments',
            'To manage Windows updates across an enterprise'
        ],
        correct: 1,
        explanation: 'The Windows ADK includes tools like DISM, Windows SIM, Windows PE, and the Assessment Toolkit. These tools are used to create and customize Windows images, automate deployments, and assess hardware/software compatibility before large-scale deployments.'
    },
    {
        id: 12,
        topic: 'DISM',
        question: 'A deployment engineer needs to add drivers to a Windows image file (.wim) before deploying it to machines. Which tool should they use?',
        options: [
            'Device Manager',
            'DISM (Deployment Image Servicing and Management)',
            'Windows Update',
            'PnPutil'
        ],
        correct: 1,
        explanation: 'DISM is the command-line tool for servicing Windows images offline. It can add drivers, features, language packs, and updates to a .wim image before deployment, ensuring all target machines receive the correct driver package at install time.'
    },
    {
        id: 13,
        topic: 'Partition Structure',
        question: 'During a clean Windows 10 installation on a GPT disk with UEFI, which partition is created first and is required to boot the system?',
        options: [
            'Recovery partition',
            'Windows (OS) partition',
            'EFI System Partition (ESP)',
            'Microsoft Reserved Partition (MSR)'
        ],
        correct: 2,
        explanation: 'The EFI System Partition (ESP) is a FAT32 partition that contains the bootloader files. UEFI firmware reads the ESP to find and launch the Windows Boot Manager. Without the ESP, the system cannot boot. It is created before the OS partition.'
    },
    {
        id: 14,
        topic: 'Installation Troubleshooting',
        question: 'A Windows 10 installation fails with error code 0xC1900101. This code family typically indicates which category of problem?',
        options: [
            'Network connectivity failure during download',
            'Driver compatibility issue',
            'Insufficient disk space',
            'Corrupt installation media'
        ],
        correct: 1,
        explanation: 'The 0xC1900101 error family (0xC1900101-0x20004, 0xC1900101-0x40017, etc.) indicates driver compatibility failures during Windows setup. The fix typically involves removing or updating third-party drivers before running the upgrade/install.'
    },
    {
        id: 15,
        topic: 'Windows Editions',
        question: 'Which Windows 10 edition is specifically designed for large enterprises and includes features like DirectAccess, AppLocker, and Credential Guard as standard inclusions?',
        options: [
            'Windows 10 Pro',
            'Windows 10 Pro for Workstations',
            'Windows 10 Enterprise',
            'Windows 10 Education'
        ],
        correct: 2,
        explanation: 'Windows 10 Enterprise includes advanced security features like Credential Guard, Device Guard, AppLocker, and DirectAccess that are designed for large organizations. Education is derived from Enterprise but targeted at schools. Pro for Workstations focuses on high-end hardware support.'
    }
];

/* ── State ── */
const state = {
    answers: JSON.parse(localStorage.getItem(QUIZ_ID + '_answers') || 'null') || {},
    submitted: false
};

/* ── Render questions ── */
function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    questions.forEach((q, idx) => {
        const letters = ['A', 'B', 'C', 'D'];
        const card = document.createElement('div');
        card.className = 'question-card' + (state.answers[idx] !== undefined ? ' answered' : '');
        card.id = 'question-' + idx;

        card.innerHTML = `
            <div class="question-number">Question ${idx + 1} &mdash; ${q.topic}</div>
            <div class="question-text">${q.question}</div>
            <div class="options" id="options-${idx}">
                ${q.options.map((opt, oi) => `
                    <button class="option ${state.answers[idx] === oi ? 'selected' : ''}"
                            onclick="selectAnswer(${idx}, ${oi})"
                            id="opt-${idx}-${oi}">
                        <span class="option-letter">${letters[oi]}</span>
                        ${escapeHtml(opt)}
                    </button>
                `).join('')}
            </div>
            <div class="explanation" id="explanation-${idx}">
                <strong>Explanation:</strong> ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });

    updateProgress();
    updateSubmitButton();
}

/* ── Select an answer ── */
function selectAnswer(qIdx, optIdx) {
    if (state.submitted) return;
    state.answers[qIdx] = optIdx;
    localStorage.setItem(QUIZ_ID + '_answers', JSON.stringify(state.answers));

    // Update UI for this question
    const letters = ['A', 'B', 'C', 'D'];
    questions[qIdx].options.forEach((_, oi) => {
        const btn = document.getElementById('opt-' + qIdx + '-' + oi);
        btn.className = 'option' + (oi === optIdx ? ' selected' : '');
    });
    document.getElementById('question-' + qIdx).classList.add('answered');

    updateProgress();
    updateSubmitButton();
}

/* ── Update progress bar ── */
function updateProgress() {
    const answered = Object.keys(state.answers).length;
    const total = questions.length;
    const pct = Math.round((answered / total) * 100);
    document.getElementById('progress-text').textContent = answered + ' of ' + total + ' answered';
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
}

/* ── Enable submit when all answered ── */
function updateSubmitButton() {
    const answered = Object.keys(state.answers).length;
    document.getElementById('submit-btn').disabled = answered < questions.length;
}

/* ── Submit quiz ── */
function submitQuiz() {
    state.submitted = true;
    let correct = 0;

    questions.forEach((q, idx) => {
        const chosen = state.answers[idx];
        const isCorrect = chosen === q.correct;
        if (isCorrect) correct++;

        // Color code options
        questions[idx].options.forEach((_, oi) => {
            const btn = document.getElementById('opt-' + idx + '-' + oi);
            btn.classList.remove('selected');
            btn.classList.add('revealed');
            if (oi === q.correct) {
                btn.classList.add('correct');
            } else if (oi === chosen && !isCorrect) {
                btn.classList.add('incorrect');
            }
        });

        // Show explanation
        document.getElementById('explanation-' + idx).classList.add('visible');
    });

    const pct = Math.round((correct / questions.length) * 100);
    const passed = pct >= 70;

    // Save score
    localStorage.setItem(QUIZ_ID + '_score', JSON.stringify({ score: pct, correct, total: questions.length, passed, date: new Date().toISOString() }));

    // Show results
    const resultsCard = document.getElementById('results-card');
    resultsCard.classList.add('visible');
    document.getElementById('score-display').textContent = pct + '%';
    document.getElementById('score-label').textContent = correct + ' / ' + questions.length + ' correct';

    const badge = document.getElementById('pass-badge');
    badge.textContent = passed ? 'PASSED' : 'FAILED';
    badge.className = 'pass-badge ' + (passed ? 'pass' : 'fail');

    document.getElementById('results-message').textContent = passed
        ? 'Solid work. You have demonstrated understanding of Windows 10 installation fundamentals. Review any explanations you found surprising before moving on.'
        : 'Keep pushing. Review the explanations for missed questions, revisit the lab exercises, and retake when ready. 70% is the threshold.';

    // Swap submit for retake
    const actionsDiv = document.querySelector('.quiz-actions');
    actionsDiv.innerHTML = '<button class="btn btn-primary" onclick="retakeQuiz()">Retake Quiz</button>';

    // Scroll to results
    resultsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ── Retake ── */
function retakeQuiz() {
    localStorage.removeItem(QUIZ_ID + '_answers');
    localStorage.removeItem(QUIZ_ID + '_score');
    state.answers = {};
    state.submitted = false;
    document.getElementById('results-card').classList.remove('visible');
    document.querySelector('.quiz-actions').innerHTML = '<button class="btn btn-primary" id="submit-btn" disabled onclick="submitQuiz()">Submit Quiz</button>';
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── Sanitize user-facing text ── */
function escapeHtml(str) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

/* ── Init ── */
renderQuestions();
</script>

</body>
</html>
