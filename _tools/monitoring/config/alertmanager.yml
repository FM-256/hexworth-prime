route:
  receiver: ntfy
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    # Critical alerts (crash loops, targets down) re-notify hourly until resolved.
    - matchers:
        - severity = "critical"
      receiver: ntfy
      repeat_interval: 1h

receivers:
  - name: ntfy
    webhook_configs:
      # Posts to the webhook-ntfy relay, which formats each alert and publishes
      # to the self-hosted ntfy topic "hexworth-alerts". Subscribe from the ntfy
      # app/browser at http://100.65.122.90:8090/hexworth-alerts (over Tailscale).
      # send_resolved posts a follow-up when an alert clears.
      - url: 'http://webhook-ntfy:9099/'
        send_resolved: true

# ---------------------------------------------------------------------------
# To swap in Discord/Slack/email later, replace the webhook_configs above with
# the matching *_configs block (slack_configs and email_configs are native).
# Keep the receiver name "ntfy" or update route.receiver to match. Notification
# channel is a one-block change.
# ---------------------------------------------------------------------------
