global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Self-monitoring: if the alerting chain itself dies (Prometheus rule eval
  # failures, or Alertmanager crashing with nowhere to send), up==0 and the
  # prometheus_* / alertmanager_* metrics surface it. This closes the "who
  # watches the watcher" gap one layer up from the original incident.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          server: "neon"

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          server: "neon"

  - job_name: "neon"
    static_configs:
      - targets: ["node_exporter:9100"]
        labels:
          server: "neon"

  - job_name: "bc1"
    static_configs:
      - targets: ["100.96.136.114:9100"]
        labels:
          server: "bc1"

  - job_name: "bc2"
    static_configs:
      - targets: ["100.125.36.2:9100"]
        labels:
          server: "bc2"

  # Container restart/health metrics from the Docker Engine API (replaces cAdvisor,
  # which cannot enrich containers under neon's containerd image store).
  - job_name: "docker-restart-exporter"
    static_configs:
      - targets: ["docker-restart-exporter:9101"]
        labels:
          server: "neon"
