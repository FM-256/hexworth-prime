server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          host: neon
          __path__: /var/log/*.log

  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          host: neon
          __path__: /var/log/syslog

  - job_name: backups
    static_configs:
      - targets:
          - localhost
        labels:
          job: backups
          host: neon
          __path__: /var/log/hexworth/backup.log
