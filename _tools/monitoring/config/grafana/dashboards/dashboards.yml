apiVersion: 1

providers:
  - name: "Hexworth"
    orgId: 1
    folder: "Hexworth Infrastructure"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards
      # ⚠ POINTS AT THE MOUNTED CONFIG DIR, not /var/lib/grafana/dashboards. The latter
      # sits inside the grafana_data VOLUME, so each dashboard needed its own bind mount
      # in docker-compose and a new one silently did not appear (2026-08-18). Scanning the
      # already-mounted provisioning dir picks up every *.json automatically.
      foldersFromFilesStructure: false
