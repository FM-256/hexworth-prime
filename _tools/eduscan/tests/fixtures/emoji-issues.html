<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emoji Issues Fixture</title>
</head>
<body>
    <!-- EMOJI-002: Emoji directly in badge/icon elements -->
    <span class="house-badge-icon">🐍</span>
    <span class="tab-icon">🔑</span>
    <span class="path-icon">☁️</span>

    <!-- EMOJI-003: Emoji inside known UI container patterns -->
    <span class="path-meta">🐧 Linux Fundamentals</span>
    <span class="module-duration">⚡ 30 min</span>
    <span class="stat-icon">🏆</span>

    <!-- FALSE POSITIVE: checkmarks/arrows should NOT trigger -->
    <span class="badge-icon">✓</span>
    <span class="badge-icon">✅</span>
    <span class="badge-icon">❌</span>
    <span class="path-meta">→ Next module</span>

    <!-- FALSE POSITIVE: emoji inside onerror fallback is intentional -->
    <img src="/assets/images/emblems/script.webp"
         onerror="this.style.display='none'; this.nextSibling.style.display='inline'" class="badge-icon">
    <span style="display:none" class="badge-icon">🐍</span>

    <script>
        // EMOJI-001: Emoji in icon: JS property (config objects)
        const CATEGORIES = {
            python: { name: 'Python', icon: '🐍' },
            linux:  { name: 'Linux',  icon: '🐧' },
            cloud:  { name: 'Cloud',  icon: '☁️' }
        };

        // FALSE POSITIVE: emoji in string content, not icon property
        const description = "Students love the 🎉 celebration animation";
    </script>
</body>
</html>
