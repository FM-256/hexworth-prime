<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic Test Fixture</title>
</head>
<body>
    <!-- SEM-001: Heading hierarchy skip (h1 → h3, missing h2) -->
    <h1>Main Title</h1>
    <h3>Skipped to H3</h3>

    <!-- SEM-002: Multiple h1 elements -->
    <h1>Second H1 (violation)</h1>

    <!-- SEM-001 again: h2 → h4, missing h3 -->
    <h2>Section Two</h2>
    <h4>Jumped to H4</h4>

    <!-- No <main> element → SEM-004 in strict mode -->
    <div class="content">
        <p>Page content without main landmark.</p>
    </div>
</body>
</html>
