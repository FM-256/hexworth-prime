<!DOCTYPE html>
<!--
  EduScan fixture — HEUR-033 (SVG width-% keyframe overflow)

  Locks in detection of @keyframes that animate width to a percentage,
  applied via a class to a <rect> or <line> inside an inline <svg>.
  SVG percentage widths resolve to the viewBox root, not the parent
  container, so the animated element overflows. Caught originally on
  WSA m01 slide 23 progress bars.

  Expected: HEUR-033 fires once (the rect using .bad-bar).
  Negative coverage: .good-bar uses transform: scaleX which is correct
  for SVG primitives and must NOT fire.
-->
<html>
<head>
<title>HEUR-033 fixture</title>
<style>
@keyframes bad-width-anim { 0% { width: 0; } 100% { width: 100%; } }

@keyframes good-scale-anim { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }

.bad-bar { animation: bad-width-anim 2s infinite; }

.good-bar { animation: good-scale-anim 2s forwards; transform-origin: left; transform-box: fill-box; }
</style>
</head>
<body>
    <svg viewBox="0 0 200 50">
        <rect class="bad-bar" x="10" y="10" width="50" height="6" fill="blue"/>
        <rect class="good-bar" x="10" y="30" width="50" height="6" fill="green"/>
    </svg>
</body>
</html>
