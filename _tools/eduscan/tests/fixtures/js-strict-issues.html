<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Strict Issues Fixture</title>
</head>
<body>
    <div id="app">Test content</div>

    <script>
        // JS-003: Unterminated string literal
        var msg = "unterminated string;

        // JS-004: Assignment in condition
        var x = 10;
        if (x = 5) {
            console.log('assigned');
        }
    </script>

    <!-- SCOPE-001: const IIFE not accessible via window -->
    <script>
        const GameEngine = (() => {
            return { init() {}, start() {} };
        })();
    </script>
    <script>
        window.GameEngine.init();
    </script>
</body>
</html>
