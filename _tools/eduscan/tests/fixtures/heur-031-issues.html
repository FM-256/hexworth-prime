<!DOCTYPE html>
<!--
  EduScan fixture — HEUR-031 (empty slide-text wrapper)

  Locks in detection of slides where the text half of the Venn-diagram
  layout has been lost (the slide-text div exists structurally but is
  empty or has <20 chars of content). Caught originally on WSA m01
  slides 6, 17, 20 after a depth-tracker bug during slide rebuild.

  Expected: HEUR-031 fires twice (one for each empty wrapper).
  Negative coverage: also includes one slide with proper non-empty
  slide-text to confirm the rule does NOT fire on legitimate slides.
-->
<html>
<head><title>HEUR-031 fixture</title></head>
<body>
    <div class="slide has-visual" data-slide="1">
        <h2 class="slide-title">Empty text half (should fire)</h2>
        <div class="slide-content">
            <div class="slide-text">
            </div>
            <div class="slide-visual">
                <svg viewBox="0 0 100 100"><rect width="50" height="50"/></svg>
            </div>
        </div>
    </div>

    <div class="slide has-visual" data-slide="2">
        <h2 class="slide-title">Whitespace-only text (should fire)</h2>
        <div class="slide-content">
            <div class="slide-text">

            </div>
            <div class="slide-visual">
                <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="20"/></svg>
            </div>
        </div>
    </div>

    <div class="slide has-visual" data-slide="3">
        <h2 class="slide-title">Proper non-empty text (should NOT fire)</h2>
        <div class="slide-content">
            <div class="slide-text">
                <p>This slide has the proper paragraph of teaching content, which is well over the 20-char threshold and should not trigger the rule.</p>
            </div>
            <div class="slide-visual">
                <svg viewBox="0 0 100 100"><rect width="80" height="80"/></svg>
            </div>
        </div>
    </div>
</body>
</html>
