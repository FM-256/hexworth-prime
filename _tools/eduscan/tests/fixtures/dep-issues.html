<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dependency Check Issues Fixture | EduScan Test</title>
    <!-- Intentionally missing: ProgressSystem.js, ProgressManager.js, GameTracker.js,
         ModuleProgress.js, AchievementSystem.js, AchievementManager.js -->
    <script src="../../../../components/AccessGuard.js"></script>
</head>
<body>
    <h1>DEP fixture — every dependency global referenced without its script tag</h1>

    <script>
        // DEP-001: trackProgress: true → ProgressSystem.js not loaded
        const quizConfig = {
            quizId: 'fixture-quiz',
            trackProgress: true,
            questions: []
        };

        // DEP-002: ProgressManager.completeModule() / .complete() → ProgressSystem.js or ProgressManager.js not loaded
        function bumpModule() {
            ProgressManager.completeModule('fixture-mod-01', { score: 100 });
            ProgressManager.complete('fixture-mod-02');
        }

        // DEP-003: GameTracker.record() → GameTracker.js not loaded
        function recordGame() {
            GameTracker.record('fixture-game', { score: 999 });
        }

        // DEP-004: ModuleProgress.complete() → ModuleProgress.js not loaded
        function completeFixtureModule() {
            ModuleProgress.complete('script', 'fixture-mod-04', { returnUrl: 'index.html' });
        }

        // DEP-005: AchievementSystem.unlock() / AchievementManager.unlock() → neither script loaded
        function unlockFixtureAchievements() {
            AchievementSystem.unlock('fixture_achievement_a');
            AchievementManager.unlock('fixture_achievement_b');
        }
    </script>
</body>
</html>
