<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LT-005 phantom root-child fixture | EduScan Test</title>
    <script src="../../../../components/LinuxTerminal.js"></script>
</head>
<body>
    <div id="terminal"></div>
    <script>
        // Root session claiming /root -> the root-home prune removes base-seeded
        // /root/* fallback. Children listed below without a matching node are
        // phantom files (ls shows them; cat/stat fail).
        LinuxTerminal.init('LT005', '#terminal', { user: 'root', hostname: 'target', startDir: '/root' });
        LinuxTerminal.addFilesystem({
            // 'notes.txt' is listed but never seeded -> phantom (LT-005)
            '/root': { type: 'dir', perms: 'drwx------', owner: 'root', group: 'root', children: ['.ssh', 'notes.txt'] },
            // 'authorized_keys' is listed but never seeded -> phantom (LT-005)
            '/root/.ssh': { type: 'dir', perms: 'drwx------', owner: 'root', group: 'root', children: ['id_rsa', 'authorized_keys'] },
            '/root/.ssh/id_rsa': { type: 'file', perms: '-rw-------', owner: 'root', group: 'root', size: 8, content: 'KEYDATA\n' }
        });
    </script>
</body>
</html>
