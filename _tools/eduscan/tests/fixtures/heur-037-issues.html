<!DOCTYPE html>
<!--
  EduScan fixture - HEUR-037 (target="_blank" missing rel="noopener")

  Locks in detection of tabnabbing-risk anchors and confirms safe-form
  variants do NOT fire.

  Expected: HEUR-037 fires 3 times (anchors A, B, C below). Negative
  coverage: anchors D, E, F have valid rel attributes and must NOT fire.
-->
<html>
<head><title>HEUR-037 fixture</title></head>
<body>
    <!-- (A) Vulnerable: no rel attribute at all (should fire) -->
    <a href="https://example.com" target="_blank">External link, no rel</a>

    <!-- (B) Vulnerable: rel attribute present but no noopener/noreferrer (should fire) -->
    <a href="https://example.com" target="_blank" rel="author">Author rel only</a>

    <!-- (C) Vulnerable: target=_blank with no rel, multi-line tag (should fire) -->
    <a
        href="https://example.com"
        target="_blank"
        class="external-link"
    >Multi-line tag without rel</a>

    <!-- (D) Safe: rel="noopener" (must NOT fire) -->
    <a href="https://example.com" target="_blank" rel="noopener">Noopener only</a>

    <!-- (E) Safe: rel="noopener noreferrer" (must NOT fire) -->
    <a href="https://example.com" target="_blank" rel="noopener noreferrer">Both keywords</a>

    <!-- (F) Safe: rel="noreferrer" alone — per HTML spec implies noopener (must NOT fire) -->
    <a href="https://example.com" target="_blank" rel="noreferrer">Noreferrer alone (spec-equiv-safe)</a>

    <!-- Negative coverage: target=_self should NOT trigger (only _blank applies) -->
    <a href="https://example.com" target="_self">Same-tab, no risk</a>

    <!-- Negative coverage: <button> tags are out of scope -->
    <button>Just a button</button>
</body>
</html>
