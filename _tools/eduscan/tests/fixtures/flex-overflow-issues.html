<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduScan Fixture: Flex Overflow Issues</title>
    <style>
        /* ── FLEX-001: Flex column with flex:1 missing min-height:0 ── */
        /* This causes the terminal to expand the page instead of scrolling */
        .terminal-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }

        .terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        /* ── FALSE POSITIVE GUARD: has min-height: 0 ─────────── */
        .workspace-fixed {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* ── FALSE POSITIVE GUARD: has overflow: hidden ──────── */
        .workspace-hidden {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── FALSE POSITIVE GUARD: has max-height ────────────── */
        .panel-capped {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-height: 500px;
        }

        /* ── FALSE POSITIVE GUARD: has explicit height ───────── */
        .panel-height {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* ── FALSE POSITIVE GUARD: not a column layout ───────── */
        .row-layout {
            flex: 1;
            display: flex;
            flex-direction: row;
        }

        /* ── FALSE POSITIVE GUARD: no flex:1 ─────────────────── */
        .column-no-flex {
            display: flex;
            flex-direction: column;
            width: 300px;
        }
    </style>
</head>
<body>
    <div class="terminal-area">
        <div class="terminal-output" id="output"></div>
    </div>
</body>
</html>
