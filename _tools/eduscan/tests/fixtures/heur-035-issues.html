<!DOCTYPE html>
<!--
  EduScan fixture - HEUR-035 (em-dash in content)

  Locks in detection of the em-dash character (U+2014) used in HTML
  content. Per the user style preference, the em-dash should not appear
  in prose. Detection skips style/script/code-block contexts where it
  may be intentional or syntactic.

  Expected: HEUR-035 fires once (covering all em-dashes in body prose).
  Negative coverage: em-dashes inside a div.code-block do NOT count and
  the rule's count should not include them.
-->
<html>
<head><title>HEUR-035 fixture</title></head>
<body>
    <p>This sentence has an em-dash — right here, which should fire the rule.</p>
    <p>Another paragraph — one more em-dash — to test the count.</p>

    <div class="code-block">
        <span class="comment"># comment with an em-dash — should NOT count</span>
        <span>output: this em-dash — is also in a code block, ignored</span>
    </div>
</body>
</html>
