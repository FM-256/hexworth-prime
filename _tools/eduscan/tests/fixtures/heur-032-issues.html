<!DOCTYPE html>
<!--
  EduScan fixture — HEUR-032 (broken webp icon reference)

  Locks in detection of HTML that references icon-NAME.webp files that
  do not exist on disk under _app/assets/images/icons/. Caught originally
  on WSA m01 with icon-checklist.webp and icon-gears.webp (the correct
  files are icon-checkbox and icon-gear, singular).

  Expected: HEUR-032 fires twice (one per non-existent icon).
  Negative coverage: a known-existing icon ref (icon-chain) should not
  fire.
-->
<html>
<head><title>HEUR-032 fixture</title></head>
<body>
    <h2>
        <span class="icon">
            <img src="/assets/images/icons/icon-doesnotexist.webp" alt="" />
        </span>
        Icon does not exist (should fire)
    </h2>

    <h2>
        <span class="icon">
            <img src="/assets/images/icons/icon-gears.webp" alt="" />
        </span>
        Plurality typo, icon-gears vs icon-gear (should fire)
    </h2>

    <h2>
        <span class="icon">
            <img src="/assets/images/icons/icon-chain.webp" alt="" />
        </span>
        Real icon, exists in _app/assets/images/icons/ (should NOT fire)
    </h2>
</body>
</html>
