<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Script Template Literal FP Regression Fixture</title>
    <style>
        .card { padding: 1em; }
    </style>
</head>
<body>
    <main>
        <h1>FP Regression Guard: script template literals containing div tags</h1>
        <p>
            Whole-file div balance: 1 open / 1 close (the wrapper below).
            Inline script contains 8 div opens and 8 div closes inside template
            literals. These MUST NOT be counted by the structural-tag check.
        </p>
        <div class="wrapper" id="wrapper"></div>
    </main>
    <script>
        (function() {
            var html = `<div class="a">
                <div class="b"><span>x</span></div>
                <div class="c">
                    <div class="d">y</div>
                </div>
            </div>`;
            var more = `<div>${html}</div><div></div><div></div>`;
            document.getElementById('wrapper').innerHTML = html + more;
        })();
    </script>
</body>
</html>
