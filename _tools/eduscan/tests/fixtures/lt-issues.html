<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="../../../../components/AccessGuard.js"></script>

    <script src="../../../../components/ModuleProgress.js"></script>
</head>
<body>
    <div id="terminal"></div>

    <script src="../../../../components/LinuxTerminal.js"></script>
    <script>
        // LT-001: new LinuxTerminal() — IIFE, not a constructor
        const terminal = new LinuxTerminal('terminal', {
            user: 'learner',
            hostname: 'test',
            height: '400px'
        });

        // LT-002: .addCommand() — method doesn't exist
        terminal.addCommand('grep', (args) => {
            return 'fake output';
        });
        terminal.addCommand('sort', (args) => {
            return 'sorted output';
        });

        // LT-004: Nested progress key
        function saveProgress() {
            const p = JSON.parse(localStorage.getItem('hexworth_progress') || '{}');
            if (!p.script) p.script = {};
            if (!p.script.linuxMastery) p.script.linuxMastery = {};
            p.script.linuxMastery['lm-99'] = { completed: true };
            localStorage.setItem('hexworth_progress', JSON.stringify(p));
        }

        // LT-003: Has completeTask but never marks module as done
        const tasks = { 'test': false };
        function completeTask(id) {
            tasks[id] = true;
            saveProgress();
        }
    </script>
<script src="../../../../components/FluxCapacitor.js"></script>
</body>
