<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEUR-029 Issues Fixture | EduScan Test</title>

<body>
    <h1>HEUR-029 — looks-clickable-but-isn't</h1>

    <!-- HEUR-029: trigger via role="link" + href + no onclick + no JS wiring -->
    <div class="dead-card-1"
         role="link"
         href="/somewhere/index.html"
         onkeydown="if(event.key==='Enter'){window.location.href='/somewhere/index.html'}"
         tabindex="0"
         style="cursor:pointer;">
        <div class="card-name">Dead Hub Card</div>
        <div class="card-desc">Mouse click goes nowhere — keyboard Enter works</div>
    </div>

    <!-- HEUR-029: trigger via cursor:pointer + tabindex + no onclick + no JS wiring -->
    <span class="dead-card-2"
          tabindex="0"
          style="cursor:pointer;color:#888;">Looks like a button, isn't</span>

    <!-- Negative cases below — these should NOT fire HEUR-029 -->

    <!-- Real anchor — inherent click handling -->
    <a href="/legit/index.html" style="cursor:pointer;">Legit anchor link</a>

    <!-- Div with inline onclick — has handler -->
    <div role="button" tabindex="0" style="cursor:pointer;" onclick="window.location.href='/handled/index.html'">Has onclick</div>

    <script>
        // No JS wiring for dead-card-1 or dead-card-2 — they stay flagged.
    </script>
</body>
