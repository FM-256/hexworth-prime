<!DOCTYPE html>
<html>
<head><title>UX Issues Test Fixture</title></head>
<body>

    <!--
        ══════════════════════════════════════════════════════════════
        UX-001: Dynamic canvas insertion WITHOUT scrollIntoView
        This is the exact pattern found in pyh-graphics-01/02 modules.
        Should trigger UX-001.
        ══════════════════════════════════════════════════════════════
    -->
    <script>
    function runLab(num) {
        var code = document.getElementById('lab' + num + '-code').value;
        var canvasId = 'turtleCanvas' + num;
        var canvas = document.getElementById(canvasId);
        if (!canvas) {
            var container = document.createElement('div');
            container.className = 'turtle-canvas-container';
            container.innerHTML = '<canvas id="' + canvasId + '" width="500" height="350"></canvas>';
            document.getElementById('lab' + num + '-output').parentNode.insertBefore(container, document.getElementById('lab' + num + '-output'));
            canvas = document.getElementById(canvasId);
        }
        var t = TurtleCanvas.create(canvasId);
        t.runCode(code);
    }
    </script>

    <!--
        ══════════════════════════════════════════════════════════════
        FALSE POSITIVE: canvas insertion WITH scrollIntoView
        The developer handled viewport positioning — should NOT trigger.
        ══════════════════════════════════════════════════════════════
    -->
    <script>
    function runLabGood(num) {
        var container = document.createElement('div');
        container.innerHTML = '<canvas id="goodCanvas" width="500" height="350"></canvas>';
        document.getElementById('output').parentNode.insertBefore(container, document.getElementById('output'));
        container.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    </script>

    <!--
        ══════════════════════════════════════════════════════════════
        FALSE POSITIVE: DOM insertion of non-visual element
        Regular div insertion should NOT trigger — only canvas/video/iframe.
        ══════════════════════════════════════════════════════════════
    -->
    <script>
    function addMessage(text) {
        var div = document.createElement('div');
        div.textContent = text;
        document.getElementById('messages').appendChild(div);
    }
    </script>

    <!--
        ══════════════════════════════════════════════════════════════
        FALSE POSITIVE: createElement('canvas') without DOM insertion
        Offscreen canvas (used for image processing, buffering, etc.)
        is never inserted into the document — should NOT trigger.
        ══════════════════════════════════════════════════════════════
    -->
    <script>
    function createBuffer(width, height) {
        var offscreen = document.createElement('canvas');
        offscreen.width = width;
        offscreen.height = height;
        return offscreen.getContext('2d');
    }
    </script>

</body>
</html>
