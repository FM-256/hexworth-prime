<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduScan Fixture: Turtle Issues</title>
    <style>
        /* ── TURTLE-001: Opaque background on canvas children ────── */
        /* This hides Skulpt's drawing layer behind the sprite layer */
        .turtle-canvas-container canvas {
            background: #0d1117;
            border-radius: 4px;
            max-width: 100%;
        }

        /* ── FALSE POSITIVE GUARD: container bg is fine ───────── */
        /* Background on the container itself does NOT cause the bug */
        .turtle-canvas-container {
            background: #0a0e1a;
            padding: 8px;
        }

        /* ── FALSE POSITIVE GUARD: no background = fine ──────── */
        /* Styling canvas children without background is safe */
        .other-turtle-container canvas {
            border-radius: 4px;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="turtle-canvas-container">
        <canvas id="turtleCanvas" width="600" height="400"></canvas>
    </div>

    <!-- ── TURTLE-002: Textarea with indented turtle code ────── -->
    <!-- HTML template indentation leaks into the code content -->
    <textarea id="code">
            import turtle
            for i in range(4):
                forward(100)
                right(90)
    </textarea>

    <!-- ── FALSE POSITIVE GUARD: textarea without turtle keywords ── -->
    <textarea id="notes">
            This is just a regular textarea
            with some indented text content
            that has nothing to do with turtle
    </textarea>

    <!-- ── FALSE POSITIVE GUARD: properly dedented turtle textarea ── -->
    <textarea id="clean-code">import turtle
for i in range(4):
    forward(100)
    right(90)</textarea>
</body>
</html>
