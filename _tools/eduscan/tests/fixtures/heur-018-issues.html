<!DOCTYPE html>
<!--
  EduScan fixture — HEUR-018 (scroll-triggered auto-completion)

  This fixture exists to lock in the validator's detection of the
  scroll-listener + ModuleProgress.complete() + threshold pattern. It uses
  a low threshold (0.8 = 80%) so the validator fires at medium severity.

  The validator's severity-demotion logic (high-threshold matches → info)
  is exercised by the live scan, not by this fixture (the test framework
  only checks code-fired-or-not, not severity tier).

  Expected: HEUR-018 fires once.
-->
<html>
<head>
  <title>HEUR-018 fixture — scroll-completion at 80%</title>
</head>
<body>
  <h1>Test page</h1>
  <div id="progressBar"></div>
  <p>Lorem ipsum content...</p>
  <script>
    const MODULE_ID = 'fixture-heur-018';
    const HOUSE_ID  = 'test';
    let completed   = false;
    window.addEventListener('scroll', () => {
      const pct = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
      document.getElementById('progressBar').style.width = pct + '%';
      if (!completed && pct >= 80) {
        completed = true;
        ModuleProgress.complete(HOUSE_ID, MODULE_ID);
      }
    });
  </script>
</body>
</html>
