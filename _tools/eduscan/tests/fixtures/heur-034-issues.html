<!DOCTYPE html>
<!--
  EduScan fixture — HEUR-034 (infinite opacity 0→1 keyframe flicker)

  Locks in detection of @keyframes that start at opacity 0 and end at
  opacity 1, applied with animation: ... infinite. Each loop resets
  opacity to 0 then fades back in, creating a visible flicker. Caught
  originally on WSA m01 slides 17 and 26 with the drop-in animation.

  Expected: HEUR-034 fires twice (.flicker-fade and .also-flickering).
  Negative coverage: .fade-once uses forwards (runs once, stays in end
  state) and must NOT fire; .pulse uses opacity 0.3 ↔ 1 (cycling, no
  fade-from-zero) and must NOT fire.
-->
<html>
<head>
<title>HEUR-034 fixture</title>
<style>
@keyframes fade-in { 0% { opacity: 0; } 100% { opacity: 1; } }

@keyframes drop-in { 0% { transform: translateY(-20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

@keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

.flicker-fade { animation: fade-in 1.5s ease-out infinite; }

.also-flickering { animation: drop-in 1s ease infinite; }

.fade-once { animation: fade-in 1.5s ease-out forwards; }

.pulse { animation: pulse 2s ease-in-out infinite; }
</style>
</head>
<body>
    <div class="flicker-fade">flicker (should fire)</div>
    <div class="also-flickering">also flicker (should fire)</div>
    <div class="fade-once">fades once and stays (should NOT fire)</div>
    <div class="pulse">cyclic pulse (should NOT fire)</div>
</body>
</html>
