<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Issues Fixture | EduScan Test</title>
    <script src="../../../../components/AccessGuard.js"></script>
    <script>AccessGuard.require('sorted');</script>
    <script src="../../../../components/ModuleProgress.js"></script>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>

    <script>
        // PROG-001: Individual key reads — these keys are never written
        function updateProgress() {
            let completed = 0;
            const ids = ['mod-01', 'mod-02', 'mod-03'];

            ids.forEach(id => {
                const val = localStorage.getItem('hexworth_progress_' + id);
                if (val) completed++;
            });

            document.getElementById('progressBar').style.width = (completed / ids.length * 100) + '%';
        }

        // PROG-002: 2-arg ModuleProgress.complete() — houseId missing
        function markComplete() {
            ModuleProgress.complete('cloud-openstack-intro', '../index.html');
        }
    </script>
<script src="../../../../components/FluxCapacitor.js"></script>
</body>
</html>
