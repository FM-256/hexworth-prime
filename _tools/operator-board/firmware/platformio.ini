; ===============================================================
;  Operator Board — XIAO ESP32-C3 + Waveshare 7.5" V2 ePaper
;  Phase 1: fetch static PNG from Cloud Function, display it.
; ===============================================================

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Larger app partition; we ship a PNG decoder + display lib + TLS root certs
board_build.partitions = huge_app.csv

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1

lib_deps =
    ; E-paper driver — supports the Waveshare 7.5" V2 800x480 monochrome panel
    zinggjm/GxEPD2 @ ^1.5.6
    adafruit/Adafruit GFX Library @ ^1.11.9
    ; PNG decoding (Bodmer's lightweight decoder)
    bitbank2/PNGdec @ ^1.0.3
