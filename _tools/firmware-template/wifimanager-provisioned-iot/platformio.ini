; ===============================================================
;  Hexworth firmware template — WiFiManager-provisioned IoT device
;
;  Copy this whole directory to a new location, rename the env block
;  below to your project name, and start editing src/main.cpp at the
;  TODO(app): markers.
;
;  Three pre-canned environments for the most common Hexworth boards.
;  Uncomment + edit the one that matches your hardware; delete the rest.
; ===============================================================

; -- Seeed XIAO ESP32-C3 (e.g. ePaper Boards) ------------------
[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    ; TODO(app): add your app-specific libs (e.g. GxEPD2, FastLED, MFRC522)

; -- Seeed XIAO ESP32-S3 (e.g. ESP32-S3 Arsenal projects) ------
; [env:xiao_esp32s3]
; platform = espressif32
; board = seeed_xiao_esp32s3
; framework = arduino
; monitor_speed = 115200
; upload_speed = 921600
; board_build.partitions = huge_app.csv
; build_flags =
