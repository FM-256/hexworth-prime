; ===============================================================
;  C2 device firmware — Hexworth Command and Control endpoint
;
;  First real device built on top of the WiFiManager provisioning
;  template. Polls /c2Register, /c2CheckIn, /c2GetCommands, /c2Result.
; ===============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D BTN_BOOT=0
    ; LED on most ESP32 DevKit V1 modules is GPIO2 (active HIGH)
    -D LED_PIN=2

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.1.0
